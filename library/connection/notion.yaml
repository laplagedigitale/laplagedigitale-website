# sovrium-library: connection/notion@0.30.0
name: notion
type: bearer
label: Notion
description: "Notion API, authenticated with an internal integration token"
props:
  token: $env.NOTION_TOKEN
baseUrl: https://api.notion.com/v1
operations:
  - name: create-page
    method: POST
    path: /pages
    summary: "Create a page under a page, a database or a data source"
    params:
      Notion-Version:
        &Notion-Version
        in: header
        type: string
        required: true
        enum:
          - 2026-03-11
        description: API version Notion answers in; pass 2026-03-11
      parent:
        in: body
        type: object
        required: true
        description: "One of { page_id }, { database_id } or { data_source_id }"
      properties:
        in: body
        type: object
        description: Property values by name
      markdown:
        in: body
        type: string
        description: Page content as Markdown
      children:
        in: body
        type: array
        description: "Block objects, at most 100"
  - name: get-page
    method: GET
    path: "/pages/{page_id}"
    summary: Retrieve a page and its property values
    params:
      Notion-Version:
        *Notion-Version
      page_id:
        in: path
        type: string
        required: true
  - name: update-page
    method: PATCH
    path: "/pages/{page_id}"
    summary: "Update property values of a page, or archive it"
    params:
      Notion-Version:
        *Notion-Version
      page_id:
        in: path
        type: string
        required: true
      properties:
        in: body
        type: object
      in_trash:
        in: body
        type: boolean
  - name: query-data-source
    method: POST
    path: "/data_sources/{data_source_id}/query"
    summary: "List the pages of a data source, filtered and sorted"
    params:
      Notion-Version:
        *Notion-Version
      data_source_id:
        in: path
        type: string
        required: true
      filter:
        in: body
        type: object
      sorts:
        in: body
        type: array
      start_cursor:
        in: body
        type: string
      page_size:
        in: body
        type: integer
        description: At most 100
  - name: search
    method: POST
    path: /search
    summary: Search the pages and data sources shared with the integration by title
    params:
      Notion-Version:
        *Notion-Version
      query:
        in: body
        type: string
      filter:
        in: body
        type: object
      start_cursor:
        in: body
        type: string
      page_size:
        in: body
        type: integer
