# sovrium-library: connection/pennylane@0.30.0
name: pennylane
type: bearer
label: Pennylane
description: "Pennylane company API, authenticated with a company API token"
props:
  token: $env.PENNYLANE_API_TOKEN
baseUrl: https://app.pennylane.com/api/external/v2
operations:
  - name: get-customer-invoices
    method: GET
    path: /customer_invoices
    summary: List customer invoices
    params:
      cursor:
        in: query
        type: string
      limit:
        in: query
        type: integer
      filter:
        in: query
        type: string
      sort:
        in: query
        type: string
      include:
        in: query
        type: string
    pagination:
      style: cursor
      cursorParam: cursor
      cursorPath: next_cursor
      itemsPath: items
  - name: get-customers
    method: GET
    path: /customers
    summary: List customers (company and individual)
    params:
      cursor:
        in: query
        type: string
      limit:
        in: query
        type: integer
      filter:
        in: query
        type: string
      sort:
        in: query
        type: string
    pagination:
      style: cursor
      cursorParam: cursor
      cursorPath: next_cursor
      itemsPath: items
  - name: get-gocardless-mandates
    method: GET
    path: /gocardless_mandates
    summary: List gocardless mandates
    params:
      cursor:
        in: query
        type: string
      limit:
        in: query
        type: integer
      filter:
        in: query
        type: string
      sort:
        in: query
        type: string
    pagination:
      style: cursor
      cursorParam: cursor
      cursorPath: next_cursor
      itemsPath: items
  - name: post-gocardless-mandate-mail-requests
    method: POST
    path: /gocardless_mandates/mail_requests
    summary: Send a GoCardless mandate email request
    params:
      customer_id:
        in: body
        type: integer
        required: true
      email:
        in: body
        type: object
        required: true
  - name: get-transactions
    method: GET
    path: /transactions
    summary: List transactions
    params:
      cursor:
        in: query
        type: string
      limit:
        in: query
        type: integer
      filter:
        in: query
        type: string
      sort:
        in: query
        type: string
    pagination:
      style: cursor
      cursorParam: cursor
      cursorPath: next_cursor
      itemsPath: items
  - name: post-customer-invoice-matched-transactions
    method: POST
    path: "/customer_invoices/{customer_invoice_id}/matched_transactions"
    summary: Match a transaction to a customer invoice
    params:
      customer_invoice_id:
        in: path
        type: integer
        required: true
      transaction_id:
        in: body
        type: integer
        required: true
