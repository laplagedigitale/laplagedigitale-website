schema: https://sovrium.com/schema/app.json

name: la-plage-digitale
version: 1.0.0
description: La Plage Digitale — Tiers-lieu de l'innovation à Strasbourg

# =============================================================================
# THEME
# =============================================================================
theme:
  colors:
    primary: '#eb6f18'
    secondary: '#992b8c'
    success: '#10b981'
    background: '#faf9f7'
    surface: '#ffffff'
    text: '#1a2767'
    textMuted: '#4b5563'

  fonts:
    heading:
      family: 'Libre Franklin'
      fallback: 'system-ui, sans-serif'
      weights: [600, 700, 800]
      url: '/fonts/fonts.css'
    body:
      family: 'Questrial'
      fallback: 'system-ui, sans-serif'
      weights: [400]
      size: 16px
      lineHeight: '1.6'
      url: '/fonts/fonts.css'

  spacing:
    container: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8'
    section: 'py-16 sm:py-24'

  borderRadius:
    sm: '0.375rem'
    md: '0.75rem'
    lg: '1rem'
    full: '9999px'

  shadows:
    sm: '0 1px 2px 0 rgb(0 0 0 / 0.05)'
    md: '0 4px 6px -1px rgb(0 0 0 / 0.1)'
    lg: '0 10px 15px -3px rgb(0 0 0 / 0.1)'

  animations:
    fadeInUp:
      duration: '0.6s'
      easing: ease-out
      keyframes:
        '0%': { opacity: '0', transform: 'translateY(20px)' }
        '100%': { opacity: '1', transform: 'translateY(0)' }
    fadeIn:
      duration: '0.4s'
      easing: ease-in-out
      keyframes:
        '0%': { opacity: '0' }
        '100%': { opacity: '1' }

  breakpoints:
    sm: '640px'
    md: '768px'
    lg: '1024px'
    xl: '1280px'

# =============================================================================
# LANGUAGES
# =============================================================================
languages:
  default: fr
  supported:
    - code: fr
      locale: fr-FR
      label: Français
      direction: ltr
    - code: en
      locale: en-US
      label: English
      direction: ltr

  translations:
    fr:
      nav.home: Accueil
      nav.spaces: Nos espaces
      nav.pricing: Tarifs
      nav.about: Qui sommes-nous
      nav.contact: Contact
      nav.cta: Nous rejoindre
      nav.href.home: /fr
      nav.href.spaces: '/fr/#spaces'
      nav.href.pricing: '/fr/#pricing'
      nav.href.about: /fr/about
      nav.href.contact: /fr/contact
      nav.href.legal: /fr/legal
      nav.href.privacy: /fr/privacy

      hero.title: Le tiers-lieu de l'innovation à Strasbourg
      hero.subtitle: "Plus de 600m² dédiés au coworking, à la collaboration et à l'innovation au cœur de Strasbourg"
      hero.cta: Découvrir nos espaces
      hero.cta2: Réserver une visite

      spaces.title: Nos espaces
      spaces.subtitle: "Des espaces adaptés à chaque besoin, du freelance à l'équipe, dans un bâtiment historique au centre de Strasbourg"

      space.flex.name: Espace Flex
      space.flex.description: "30 postes en open space pour travailler en toute liberté, du lundi au vendredi de 9h à 17h30"
