  # ===========================================================================
  # PRIVACY
  # ===========================================================================
  - name: privacy
    path: /privacy
    meta:
      title: "Politique de confidentialité — La Plage Digitale"
    sections:
      - component: site-header
      - type: section
        props:
          className: 'pt-32 pb-24'
        children:
          - type: div
            props:
              className: 'max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 prose prose-gray'
            children:
              - type: h1
                content: Politique de confidentialité
                props:
                  className: 'text-3xl font-bold text-gray-900 mb-8'
              - type: customHTML
                content: |
                  <h2>Collecte des données</h2>
                  <p>Ce site collecte uniquement les données transmises volontairement via le formulaire de contact : nom, adresse email et message. Ces données sont utilisées exclusivement pour répondre à votre demande.</p>

                  <h2>Analytiques</h2>
                  <p>Ce site utilise un système d'analytiques respectueux de la vie privée, sans cookies et sans collecte de données personnelles identifiantes, conforme au RGPD.</p>

                  <h2>Vos droits</h2>
                  <p>Conformément au RGPD, vous disposez d'un droit d'accès, de rectification et de suppression de vos données. Pour exercer ces droits, contactez-nous à contact@laplagedigitale.fr.</p>

                  <h2>Responsable du traitement</h2>
                  <p>La Plage Digitale<br>
                  13 rue Jacques Peirotes<br>
                  67000 Strasbourg</p>
      - component: site-footer

# =============================================================================
# ANALYTICS
# =============================================================================
analytics:
  retentionDays: 365
  respectDoNotTrack: true
  excludedPaths: ['/legal', '/privacy']
