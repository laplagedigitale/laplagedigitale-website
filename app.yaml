# =============================================================================
# REUSABLE COMPONENTS
# =============================================================================
components:

  # ---------------------------------------------------------------------------
  # Navigation
  # ---------------------------------------------------------------------------
  - name: site-header
    type: header
    children:
      - type: header
        props:
          className: 'fixed top-0 w-full z-50 bg-[#1a2767] border-b border-[#2a3777]'
        children:
          - type: nav
            props:
              className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16'
            children:
              - type: link
                props:
                  href: $t:nav.href.home
                  className: 'flex items-center gap-2 font-bold text-xl text-white'
                children:
                  - type: span
                    content: "La Plage Digitale"

              - type: flex
                props:
                  className: 'hidden md:flex items-center gap-8'
                children:
                  - type: link
                    content: $t:nav.spaces
                    props:
                      href: $t:nav.href.spaces
                      className: 'text-sm font-medium text-white hover:text-[#f3ae13] transition-colors'
                  - type: link
                    content: $t:nav.pricing
                    props:
                      href: $t:nav.href.pricing
                      className: 'text-sm font-medium text-white hover:text-[#f3ae13] transition-colors'
                  - type: link
                    content: $t:nav.about
                    props:
                      href: $t:nav.href.about
                      className: 'text-sm font-medium text-white hover:text-[#f3ae13] transition-colors'
                  - type: link
                    content: $t:nav.contact
                    props:
                      href: $t:nav.href.contact
                      className: 'text-sm font-medium text-white hover:text-[#f3ae13] transition-colors'

              - type: link
                content: $t:nav.cta
                props:
                  href: $t:nav.href.contact
                  className: 'inline-flex items-center px-4 py-2 rounded-full text-sm font-semibold text-white bg-[#992b8c] hover:bg-[#7e2374] transition-colors'

  # ---------------------------------------------------------------------------
  # Footer
  # ---------------------------------------------------------------------------
  - name: site-footer
    type: footer
    children:
      - type: footer
        props:
          className: 'bg-[#111d4a] text-gray-300'
        children:
          - type: section
            props:
              className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16'
            children:
              - type: grid
                props:
                  className: 'grid grid-cols-1 md:grid-cols-4 gap-12'
                children:
                  - type: div
                    props:
                      className: 'md:col-span-2'
                    children:
                      - type: h3
                        content: La Plage Digitale
                        props:
                          className: 'text-white text-xl font-bold mb-3'
                      - type: p
                        content: $t:footer.tagline
                        props:
                          className: 'text-gray-400 mb-6 max-w-md'
                      - type: flex
                        props:
                          className: 'flex gap-4'
                        children:
                          - type: link
                            content: LinkedIn
                            props:
                              href: 'https://fr.linkedin.com/company/la-plage-digitale'
                              className: 'text-gray-400 hover:text-white transition-colors'
                          - type: link
                            content: Twitter
                            props:
                              href: 'https://twitter.com/laplagedigitale'
                              className: 'text-gray-400 hover:text-white transition-colors'
                          - type: link
                            content: Instagram
                            props:
                              href: 'https://instagram.com/laplagedigitale'
                              className: 'text-gray-400 hover:text-white transition-colors'
                          - type: link
                            content: Facebook
                            props:
                              href: 'https://facebook.com/laplagedigitale'
                              className: 'text-gray-400 hover:text-white transition-colors'

                  - type: div
                    children:
                      - type: h4
                        content: Navigation
                        props:
                          className: 'text-white font-semibold mb-4'
                      - type: list
                        props:
                          className: 'space-y-2'
                        children:
                          - type: list-item
                            children:
                              - type: link
                                content: $t:nav.spaces
                                props:
                                  href: $t:nav.href.spaces
                                  className: 'text-gray-400 hover:text-white transition-colors'
                          - type: list-item
                            children:
                              - type: link
                                content: $t:nav.pricing
                                props:
                                  href: $t:nav.href.pricing
                                  className: 'text-gray-400 hover:text-white transition-colors'
                          - type: list-item
                            children:
                              - type: link
                                content: $t:nav.about
                                props:
                                  href: $t:nav.href.about
                                  className: 'text-gray-400 hover:text-white transition-colors'
                          - type: list-item
                            children:
                              - type: link
                                content: $t:nav.contact
                                props:
                                  href: $t:nav.href.contact
                                  className: 'text-gray-400 hover:text-white transition-colors'

                  - type: div
                    children:
                      - type: h4
                        content: Contact
                        props:
                          className: 'text-white font-semibold mb-4'
                      - type: list
                        props:
                          className: 'space-y-2 text-gray-400 text-sm'
                        children:
                          - type: list-item
                            content: $t:contact.address
                          - type: list-item
                            content: $t:contact.email
                          - type: list-item
                            content: $t:contact.hours

          - type: div
            props:
              className: 'border-t border-gray-800'
            children:
              - type: div
                props:
                  className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col sm:flex-row justify-between items-center gap-4'
                children:
                  - type: p
                    content: $t:footer.copyright
                    props:
                      className: 'text-gray-500 text-sm'
                  - type: flex
                    props:
                      className: 'flex gap-6'
                    children:
                      - type: link
                        content: $t:footer.legal
                        props:
                          href: $t:nav.href.legal
                          className: 'text-gray-500 hover:text-gray-300 text-sm transition-colors'
                      - type: link
                        content: $t:footer.privacy
                        props:
                          href: $t:nav.href.privacy
                          className: 'text-gray-500 hover:text-gray-300 text-sm transition-colors'

  # ---------------------------------------------------------------------------
  # Space card
  # ---------------------------------------------------------------------------
  - name: space-card
    type: card
    children:
      - type: card
        props:
          className: 'group overflow-hidden rounded-xl bg-white shadow-md hover:shadow-lg transition-shadow'
        children:
          - type: div
            props:
              className: 'aspect-[4/3] overflow-hidden bg-gradient-to-br from-[#fef3e2] to-[#fde5c8]'
            children:
              - type: div
                props:
                  className: 'w-full h-full flex items-center justify-center text-[#eb6f18] text-6xl'
                children:
                  - type: span
                    content: '$icon'
          - type: card-body
            props:
              className: 'p-6'
            children:
              - type: h3
                content: '$name'
                props:
                  className: 'text-xl font-bold text-gray-900 mb-2'
              - type: p
                content: '$description'
                props:
                  className: 'text-gray-600 mb-4'
              - type: badge
                content: '$capacity'
                props:
                  className: 'inline-block px-3 py-1 rounded-full text-sm font-medium bg-[#fef3e2] text-[#eb6f18]'

  # ---------------------------------------------------------------------------
  # Pricing card
  # (pricing cards and meeting rooms are inlined in the pages section)

  # ---------------------------------------------------------------------------
  # Amenity item
  # ---------------------------------------------------------------------------
  - name: amenity-item
    type: flex
    children:
      - type: flex
        props:
          className: 'flex items-center gap-3 p-4 bg-white rounded-lg shadow-sm'
        children:
          - type: span
            content: '✓'
            props:
              className: 'flex-shrink-0 w-6 h-6 rounded-full bg-[#fef3e2] text-[#eb6f18] flex items-center justify-center text-sm font-bold'
          - type: span
            content: '$label'
            props:
              className: 'text-gray-700'

# =============================================================================
# PAGES
# =============================================================================
pages:

  # ===========================================================================
  # HOME
  # ===========================================================================
  - name: home
    path: /
    meta:
      title: "La Plage Digitale — Coworking à Strasbourg"
      description: "Tiers-lieu de l'innovation à Strasbourg : coworking, bureaux privés, salles de réunion et espace événementiel. Plus de 600m² au cœur de la ville."
      keywords: 'coworking, strasbourg, bureau partagé, espace de travail, la plage digitale, tiers-lieu, innovation'
      openGraph:
        type: website
        image: 'https://www.laplagedigitale.fr/wp-content/uploads/2024/03/Sans-titre-8-2plage1.jpg'
        imageAlt: "La Plage Digitale — Coworking à Strasbourg"
      twitter:
        card: summary_large_image
        image: 'https://www.laplagedigitale.fr/wp-content/uploads/2024/03/Sans-titre-8-2plage1.jpg'

    sections:
      - component: site-header

      # -----------------------------------------------------------------------
      # Hero
      # -----------------------------------------------------------------------
      - type: section
        props:
          className: 'relative min-h-screen flex items-center pt-16 bg-gradient-to-br from-[#1a2767] via-[#2a1a4a] to-[#1a2767]'
        children:
          - type: div
            props:
              className: 'relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-32 text-center'
            children:
              - type: h1
                content: $t:hero.title
                props:
                  className: 'text-4xl sm:text-5xl lg:text-6xl font-extrabold text-white mb-6 leading-tight'
                interactions:
                  entrance:
                    animation: fadeInUp
                    duration: '600ms'
                    threshold: 0.1
              - type: p
                content: $t:hero.subtitle
                props:
                  className: 'text-lg sm:text-xl text-gray-300 max-w-2xl mx-auto mb-10'
                interactions:
                  entrance:
                    animation: fadeInUp
                    duration: '600ms'
                    delay: '200ms'
                    threshold: 0.1
              - type: flex
                props:
                  className: 'flex flex-col sm:flex-row items-center justify-center gap-4'
                children:
                  - type: link
                    content: $t:hero.cta
                    props:
                      href: '#spaces'
                      className: 'px-8 py-4 rounded-full bg-[#eb6f18] text-white font-semibold text-lg hover:bg-[#d4610f] transition-colors'
                  - type: link
                    content: $t:hero.cta2
                    props:
                      href: $t:nav.href.contact
