  # ===========================================================================
  # CONTACT
  # ===========================================================================
  - name: contact
    path: /contact
    meta:
      title: "Contact — La Plage Digitale"
      description: "Contactez La Plage Digitale, coworking à Strasbourg. 13 rue Jacques Peirotes, 67000 Strasbourg."
    sections:
      - component: site-header

      - type: section
        props:
          className: 'pt-32 pb-24'
        children:
          - type: div
            props:
              className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8'
            children:
              - type: div
                props:
                  className: 'text-center mb-16'
                children:
                  - type: h1
                    content: $t:contact.title
                    props:
                      className: 'text-4xl sm:text-5xl font-bold text-gray-900 mb-4'
                  - type: p
                    content: $t:contact.subtitle
                    props:
                      className: 'text-lg text-gray-600'

              - type: grid
                props:
                  className: 'grid grid-cols-1 lg:grid-cols-2 gap-16'
                children:
                  # Contact info + map
                  - type: div
                    props:
                      className: 'space-y-8'
                    children:
                      - type: div
                        children:
                          - type: h3
                            content: $t:contact.address.label
                            props:
                              className: 'text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2'
                          - type: p
                            content: $t:contact.address
                            props:
                              className: 'text-lg text-gray-900'
                      - type: div
                        children:
                          - type: h3
                            content: $t:contact.email.label
                            props:
                              className: 'text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2'
                          - type: link
                            content: $t:contact.email
                            props:
                              href: 'mailto:contact@laplagedigitale.fr'
                              className: 'text-lg text-[#eb6f18] hover:underline'
                      - type: div
                        children:
                          - type: h3
                            content: $t:contact.hours.label
                            props:
                              className: 'text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2'
                          - type: p
                            content: $t:contact.hours
                            props:
                              className: 'text-lg text-gray-900'

                      - type: div
                        props:
                          className: 'rounded-xl overflow-hidden shadow-md'
                        children:
                          - type: iframe
                            props:
                              src: 'https://www.openstreetmap.org/export/embed.html?bbox=7.7510%2C48.5770%2C7.7560%2C48.5800&layer=mapnik&marker=48.5785%2C7.7535'
                              className: 'w-full h-64 border-0'
                              loading: lazy

                  # Contact form
                  - type: form
                    props:
                      className: 'space-y-6 bg-gray-50 p-8 rounded-xl'
                      action: '{{CONTACT_FORM_ACTION}}'
                      method: POST
                    children:
                      - type: div
                        children:
                          - type: span
                            content: $t:contact.form.name
                            props:
                              className: 'block text-sm font-medium text-gray-700 mb-1'
                          - type: input
                            props:
                              type: text
                              name: name
                              required: true
                              className: 'w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#eb6f18] focus:border-transparent'
                      - type: div
                        children:
                          - type: span
                            content: $t:contact.form.email
                            props:
                              className: 'block text-sm font-medium text-gray-700 mb-1'
                          - type: input
                            props:
                              type: email
                              name: email
                              required: true
                              className: 'w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#eb6f18] focus:border-transparent'
                      - type: div
                        children:
                          - type: span
                            content: $t:contact.form.message
                            props:
                              className: 'block text-sm font-medium text-gray-700 mb-1'
                          - type: input
                            props:
                              type: text
                              name: message
                              required: true
                              className: 'w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#eb6f18] focus:border-transparent h-32'
                      - type: button
                        content: $t:contact.form.submit
                        props:
                          type: submit
                          className: 'w-full px-6 py-3 rounded-full bg-[#eb6f18] text-white font-semibold hover:bg-[#d4610f] transition-colors'

      - component: site-footer

