  # Weekly Notion → Slack digest (Monday 08:30 Europe/Paris)
  - $ref: ./config/automations/notion-hebdo.yaml
  # Contacts & adhésions: the import of the three Notion databases (manual,
  # dry run unless {"dryRun": "false"})
  - $ref: ./config/automations/notion-import-communaute.yaml
