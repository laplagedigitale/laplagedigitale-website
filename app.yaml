# Private files the document actions read (never served by any route).
assets:
  - path: templates/grant-dossier.docx
    description: Dossier de demande de subvention, filled by grant-export
    sampleData: templates/grant-sample.json
  - path: templates/grant-budget.xlsx
    description: Budget prévisionnel CERFA and modalités de calcul, filled by grant-export
    sampleData: templates/grant-sample.json
  - path: templates/grant-sample.json
    description: Sample data shaped like grant-export's gather step, for sovrium render

# Reusable action templates ($ref from the automations).
actions:
  # The forecast engine of the Trésorerie, shared by treasury-forecast, the
  # hourly sync, treasury-scenario-init and the on-edit triggers.
  - $ref: ./config/actions/treasury-forecast-compute.yaml
  # The Subventions engine: modalités de calcul and CERFA budget of the
  # demandes, shared by grant-compute, grant-application-init and the on-edit
  # triggers.
  - $ref: ./config/actions/grant-budget-compute.yaml
  # Lieu: who occupies each desk and locker, from the active contracts;
  # shared by lieu-occupancy-refresh and notion-import-lieu.
  - $ref: ./config/actions/lieu-occupancy-compute.yaml

