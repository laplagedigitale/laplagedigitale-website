# yaml-language-server: $schema=https://sovrium.com/schema/app.json

# The app is split across config/ — one file per singleton, one per entity.
# $refs resolve before validation, so errors are still reported per file.

name: la-plage-digitale
version: 2.0.0
description: La Plage Digitale — Tiers-lieu et coworking à Strasbourg

# Secrets the config reads. A required variable missing at boot stops the
# server, so set it on Scalingo (env-set) before deploying.
env:
  - key: PENNYLANE_API_TOKEN
    description: Pennylane company API token, read and write (mandate requests and payment matching write)
  - key: AUTOMATCH_APPLY
    description: pennylane-auto-match writes its reliable matches to Pennylane; 'false' makes it a dry run
    required: false
    default: 'true'
    secret: false
  - key: TREASURER_EMAIL
    description: Recipient of the pennylane-auto-match morning summary
    required: false
    default: tresorerie@laplagedigitale.fr
    secret: false

design:
  $ref: ./config/design.yaml

auth:
  $ref: ./config/auth.yaml

languages:
  $ref: ./config/languages.yaml

tables:
  - $ref: ./config/tables/posts.yaml
  - $ref: ./config/tables/leads.yaml
  # The coworker portal: Pennylane data mirrored per member, read under
  # row-level rules so each coworker sees only their own.
  - $ref: ./config/tables/members.yaml
  - $ref: ./config/tables/invoices.yaml
  - $ref: ./config/tables/mandates.yaml
  - $ref: ./config/tables/mandate-requests.yaml
  # Log of the payment matching: admin only.
  - $ref: ./config/tables/payment-matches.yaml

buckets:
  $ref: ./config/buckets.yaml

components:
  - $ref: ./config/components/site-header.yaml
  - $ref: ./config/components/site-footer.yaml
  - $ref: ./config/components/editor-bar.yaml

forms:
  - $ref: ./config/forms/contact.yaml

pages:
  - $ref: ./config/pages/home.yaml
  - $ref: ./config/pages/qui-sommes-nous.yaml
  - $ref: ./config/pages/nos-activites.yaml
  - $ref: ./config/pages/nos-soutiens.yaml
  - $ref: ./config/pages/espace-coworking.yaml
  - $ref: ./config/pages/les-formules.yaml
  - $ref: ./config/pages/nos-coworkers.yaml
  - $ref: ./config/pages/les-entreprises.yaml
  - $ref: ./config/pages/blog.yaml
  - $ref: ./config/pages/blog-post.yaml
  - $ref: ./config/pages/contact.yaml
  - $ref: ./config/pages/mentions-legales.yaml
  - $ref: ./config/pages/confidentialite.yaml
  # Editors' front office — gated, never indexed.
  - $ref: ./config/pages/connexion.yaml
  - $ref: ./config/pages/editor.yaml
  - $ref: ./config/pages/editor-post-new.yaml
  - $ref: ./config/pages/editor-post-edit.yaml
  # Coworker portal — gated, never indexed.
  - $ref: ./config/pages/login.yaml
  - $ref: ./config/pages/portal.yaml

# Old WordPress URLs (posts lived at the root, pages had other slugs) — 301s.
redirects:
  $ref: ./config/redirects.yaml

analytics:
  $ref: ./config/analytics.yaml

connections:
  - $ref: ./library/connection/pennylane.yaml

automations:
  - $ref: ./config/automations/member-sign-up.yaml
  - $ref: ./config/automations/pennylane-auto-match.yaml
  - $ref: ./config/automations/pennylane-match-pending.yaml
  - $ref: ./config/automations/pennylane-sync.yaml
  - $ref: ./config/automations/request-mandate.yaml
