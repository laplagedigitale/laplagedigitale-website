# yaml-language-server: $schema=https://sovrium.com/schema/app.json

# The app is split across config/ — one file per singleton, one per entity.
# $refs resolve before validation, so errors are still reported per file.

name: la-plage-digitale
version: 1.0.0
description: La Plage Digitale — Tiers-lieu de l'innovation à Strasbourg

design:
  $ref: ./config/design.yaml

auth:
  $ref: ./config/auth.yaml

languages:
  $ref: ./config/languages.yaml

# Première table du site : les réponses au baromètre de satisfaction. Elle a
# besoin d'une base persistante — l'add-on PostgreSQL de scalingo.json n'est
# donc plus seulement là pour les comptes admin.
tables:
  - $ref: ./config/tables/feedback.yaml

# Formulaires autonomes, montés sur leur propre `path`.
forms:
  - $ref: ./config/forms/feedback.yaml

components:
  - $ref: ./config/components/site-header.yaml
  - $ref: ./config/components/site-footer.yaml
  - $ref: ./config/components/space-card.yaml
  - $ref: ./config/components/amenity-item.yaml

pages:
  - $ref: ./config/pages/home.yaml
  - $ref: ./config/pages/about.yaml
  - $ref: ./config/pages/contact.yaml
  - $ref: ./config/pages/legal.yaml
  - $ref: ./config/pages/privacy.yaml

analytics:
  $ref: ./config/analytics.yaml
