# yaml-language-server: $schema=https://sovrium.com/schema/app.json

# The app is split across config/ — one file per singleton, one per entity.
# $refs resolve before validation, so errors are still reported per file.

name: la-plage-digitale
version: 2.0.0
description: La Plage Digitale — Tiers-lieu et coworking à Strasbourg
# No « Built with Sovrium » badge on the site.
badge: false

# Secrets the config reads. A required variable missing at boot stops the
# server, so set it on Scalingo (env-set) before deploying.
env:
  - key: PENNYLANE_API_TOKEN
    description: Pennylane company API token, read and write (mandate requests and payment matching write)
  - key: AUTOMATCH_APPLY
    description: pennylane-auto-match writes its reliable matches to Pennylane; 'false' makes it a dry run
    required: false
    default: 'true'
    secret: false
  - key: AUTOMATCH_SUPPLIER_APPLY
    description: pennylane-auto-match also writes its reliable supplier-invoice matches; anything but 'true' keeps that side a dry run
    required: false
    default: 'false'
    secret: false
  - key: DIRECT_DEBIT_APPLY
    description: pennylane-direct-debit moves every monthly subscription of a customer with an active Compte Pro mandate to Compte Pro direct debit; 'false' makes it a dry run
    required: false
    default: 'true'
    secret: false
  - key: FLEX_INVOICING_APPLY
    description: flex-invoicing creates the monthly Flex invoices in Pennylane and marks the check-ins; 'false' makes it a dry run
    required: false
    default: 'true'
    secret: false
  - key: DEADLINES_APPLY
    description: management-reminders posts the Calendrier de gestion reminders in Slack, creates the Notion cards and stamps the rows; 'false' makes it a dry run
    required: false
    default: 'true'
    secret: false
  - key: FLEX_SIGNUP_APPLY
    description: flex-signup-validate creates the Pennylane customer, links the member and sends the invitation; 'false' makes the « Valider » button a dry run
    required: false
    default: 'true'
    secret: false
  # pennylane-sync reads the account directory through this app's own admin
  # API (config/connections/sovrium-admin.yaml): an admin's API key, minted in
  # /_admin, and the public origin to call. The Flex invitation no longer needs
  # it: since 0.46 it is the built-in inviteUser auth action.
  - key: INVITE_API_KEY
    description: API key of an admin account (minted in /_admin), sent on x-api-key to /api/admin/users so pennylane-sync can fill members.user_id; empty skips that backfill
    required: false
    default: ''
  - key: BASE_URL
    description: Public origin of the app; also read by Sovrium itself (links, cookies, CSRF)
    required: false
    default: http://localhost:3000
    secret: false
  - key: TREASURER_EMAIL
    description: Recipient of the pennylane-auto-match morning summary and the pennylane-direct-debit mail
    required: false
    default: tresorerie@laplagedigitale.fr
    secret: false
  - key: LEADS_NOTIFY_EMAIL
    description: Recipient of lead-notify, one mail per contact-form submission (the team inbox Mathieu reads)
    required: false
    default: contact@laplagedigitale.fr
    secret: false
  # Weekly Notion → Slack digest (notion-hebdo)
  - key: NOTION_TOKEN
    description: Notion internal integration token used to read the task database
  - key: SLACK_BOT_TOKEN
    description: Bot token (xoxb-…) of the Slack app A0C71BTPUCS
  - key: SLACK_CHANNEL_ID
    description: Channel id of #notion-hebdo (C…)
    secret: false
  - key: NOTION_TASKS_DATA_SOURCE_ID
    description: Data source id of « Suivi des sujets, projets & tâches » (V2)
    secret: false
  # Calendrier de gestion reminders (management-reminders)
  - key: DEADLINES_SLACK_CHANNEL_ID
    description: Channel id (C…) where management-reminders posts the Calendrier de gestion reminders
    secret: false
  - key: NOTION_METRICS_DATA_SOURCE_ID
    description: Data source id of « Indicateurs d'usage Notion »; empty disables the weekly history row
    required: false
    default: ""
    secret: false

  # Trésorerie & prévisionnel (pennylane-treasury-sync, treasury-forecast)
  - key: PENNYLANE_COMPANY_ID
    description: Pennylane company id, used to build the link that opens a transaction in Pennylane from the Transactions page
    required: false
    default: '21901400'
    secret: false
  - key: TREASURY_SYNC_SINCE_DAYS
    description: How many days back pennylane-treasury-sync re-reads the bank transactions on each hourly run (a one-off backfill passes `since` in the trigger body)
    required: false
    default: '120'
    secret: false
  - key: TREASURY_COMFORT_THRESHOLD
    description: Cash balance (EUR) under which the forecast flags a scenario's low point as « tendu »
    required: false
    default: '10000'
    secret: false

