# Authentication. Its presence is what mounts /api/auth/*, the RBAC layer and
# the admin user-management endpoints — there is no `enabled` flag.
#
# The site is public: every page here is readable without a session. Auth exists
# so the admin surface does, which is why self-registration is off.

strategies:
  - type: emailAndPassword

# Nobody signs themselves up on a public marketing site — admins create users.
allowSignUp: false

# Least privilege for anyone an admin does create. The seeded administrator
# comes from AUTH_ADMIN_EMAIL / AUTH_ADMIN_PASSWORD and is unaffected by this.
defaultRole: viewer

# Two roles beside the built-ins, both created by admins in /_admin/users.
#
# Everyone signs in at /connexion, which sends the session to /app, the
# "Mes espaces" page (config/pages/app-landing.yaml).
#
# Blog editors land on /editor, the editors' space. They write the `posts`
# table and nothing else — the console at /_admin stays admin-only.
#
# Coworkers land on /chaloupe — « La Chaloupe », their own Pennylane invoices,
# direct-debit mandate and account. Inviting one with this role is what files
# their `members` row; there is still no self-registration.
#
# Not `landingPath` + `defaultLanding`: in Sovrium 0.30 the resolver sends a
# custom role with a bare landing to the no-access page (only the built-in
# admin was routed), so /app does the routing itself.
roles:
  - name: editor
    description: Rédaction du blog — crée, modifie et publie les articles
    level: 30
  - name: coworker
    description: Coworker — consulte ses factures et son mandat de prélèvement
    level: 20

# An invitation link stays valid for a week — coworkers do not all read their
# mail the day an account is opened.
invitationTokenExpiry: 7d

# Self-service API keys: the credential Claude presents to /mcp on x-api-key.
# A key acts as its owner — same role, same row-level rules — and is revoked
# on its own, without touching the owner's password.
apiKeys: true
