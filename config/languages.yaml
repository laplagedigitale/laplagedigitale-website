# Languages, locales and the $t: dictionary.
#
# French is the default. Most pages answer unprefixed (/flex) and under /en/ and
# /de/; the three content pages have translated slugs (path maps:
# /fr/formules-et-tarifs, /en/pricing, /de/preise), and the engine sends their
# unprefixed address to /fr/ with a 302 — which is why the French href.* keys
# point at /fr/… directly. Each dictionary lives in its
# own file — they are long, and a translator edits one language at a time.
default: fr
fallback: fr
# The address decides the language, nothing else: an unprefixed path is always
# French. Browser detection and a remembered choice served English at a French
# URL (/blog with an English browser), so one address showed two languages.
detectBrowser: false
persistSelection: false
supported:
  - code: fr
    locale: fr-FR
    label: Français
    direction: ltr
  - code: en
    locale: en-GB
    label: English
    direction: ltr
  - code: de
    locale: de-DE
    label: Deutsch
    direction: ltr

translations:
  fr:
    $ref: ./translations/fr.yaml
  en:
    $ref: ./translations/en.yaml
  de:
    $ref: ./translations/de.yaml
