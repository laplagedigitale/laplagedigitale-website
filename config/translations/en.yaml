coworkers.bastien.p1: "A self-employed web developer, Bastien builds custom applications for businesses that need web-based tools."
coworkers.bastien.p2: "He has been working at La Plage Digitale for five years and feels right at home. For him, the Plage means peace, freedom and flexibility!"
coworkers.sylvaine.alt: Portrait of Sylvaine Gross
