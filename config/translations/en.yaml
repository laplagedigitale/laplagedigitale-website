# ── coworkers ──
coworkers.meta.title: Our coworkers — La Plage Digitale
coworkers.meta.description: "Designers, developers, entrepreneurs: meet the people who work every day at La Plage Digitale, a non-profit coworking space in Strasbourg."
coworkers.eyebrow: Our coworkers
coworkers.title: The people who make the Plage
coworkers.lead: "Remote employees, freelancers and founders: they chose La Plage Digitale as their place to work, and they tell you why."
coworkers.list.title: Coworker profiles
coworkers.caroline.alt: Portrait of Caroline Bosc
coworkers.caroline.p1: "After a master's degree in international business, Caroline added a second master's in web studies in Strasbourg."
coworkers.caroline.p2: "Now a UX designer at Impact Positif, she has been coworking at La Plage Digitale since March 2022."
coworkers.frederic.alt: Portrait of Frédéric Fuchs
coworkers.frederic.p1: "Frédéric is head of sales operations at OpenClassrooms, a company whose mission is to make education accessible to everyone."
coworkers.frederic.p2: "After three years of working from home, he joined us to draw a line between his private and professional life — and to meet new people."
coworkers.roland.alt: Portrait of Roland Margelidon
coworkers.roland.p1: "A software engineer, Roland founded his own company, Rolrom, and is building business management software for architecture firms."
coworkers.roland.p2: "He chose La Plage Digitale because it is a non-profit, community-run coworking space."
coworkers.bastien.company: Freelance
coworkers.bastien.alt: Portrait of Bastien Remy
coworkers.bastien.p1: "A self-employed web developer, Bastien builds custom applications for businesses that need web-based tools."
coworkers.bastien.p2: "He has been working at La Plage Digitale for five years and feels right at home. For him, the Plage means peace, freedom and flexibility!"
coworkers.sylvaine.alt: Portrait of Sylvaine Gross
coworkers.sylvaine.p1: "A true Alsatian Swiss Army knife: after more than 20 years as an all-round secretary, sales assistant and executive assistant, Sylvaine launched her own administrative support business, Mu.se. She has served as treasurer of La Plage Digitale, of which Mu.se has been a member since 2019."
coworkers.sylvaine.p2: "She is also the coworkers' unofficial supplier of staples, paper clips, correction fluid and scrap paper."
coworkers.eleonore.alt: Portrait of Eléonore Greif
coworkers.eleonore.p1: "A documentary maker in another life, Eléonore recently joined the cheerful Mu.se team as an administrative assistant — and the even more cheerful team at La Plage Digitale!"
coworkers.eleonore.p2: "A chance to work away from home, alongside people who are involved in community life."
coworkers.cta.title: Could yours be the next portrait?
coworkers.cta.text: Join the La Plage Digitale community, for a day or for the long run.
