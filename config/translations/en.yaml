tierslieu.hero.eyebrow: "The third place"
tierslieu.hero.title: "A coworking space run by and for its members"
tierslieu.hero.lead: "La Plage Digitale is an association. It runs 600 m² in the Krutenau district, right in the centre of Strasbourg, where freelancers, founders, creative people and project leaders work and cross paths every day."
tierslieu.story.eyebrow: "Our story"
tierslieu.story.title: "An association, since 2019"
tierslieu.story.p1: "La Plage Digitale is an association under the local law of Alsace-Moselle (1908), founded in 2019 when the Alsace Digitale association handed part of its activity over to it."
tierslieu.story.p2: "It moved into the former Coop premises on rue Jacques Peirotes. « La Plage » is both the association and the place it runs, and its members are the Plagistes."
tierslieu.story.imageAlt: "The open space at La Plage Digitale: desks, pendant lights and glazed partitions under a concrete roof structure"
tierslieu.life.eyebrow: "Life at the Plage"
tierslieu.life.title: "Regular get-togethers"
tierslieu.life.lead: "At the Plage, members bump into each other in the kitchen, help each other out on projects and pass clients on. And there are regular dates:"
tierslieu.life.conseil.title: "The Conseil de la Plage"
tierslieu.life.conseil.text: "The first Thursday of the month at noon, coworkers meet: news of the place, current projects, ideas, problems to fix, and a welcome for newcomers."
tierslieu.life.mardis.title: "Mardis gourmands"
tierslieu.life.mardis.text: "Every Tuesday around 10 am, a coworker brings breakfast to share."
tierslieu.life.events.title: "Evenings and meetups"
tierslieu.life.events.text: "Apéro recruteurs, Fail Club, « Regards » talks, Biz'dej solopreneurs: get-togethers to talk business with peers."
tierslieu.life.advice.title: "Drop-in advice"
tierslieu.life.advice.text: "The INPI (intellectual property office) and the CCI (chamber of commerce) hold drop-in sessions at the Plage for your business questions."
tierslieu.communities.title: "The communities we host"
tierslieu.communities.text: "The Plage lends its spaces free of charge to communities and associations. You will meet Go SXB Go!, Strasbourg JS, Software Crafters, Pixels & Bretzels and the Strasbourg Games Community, among others."
tierslieu.host.title: "Hosting an event at the Plage"
tierslieu.host.text: "The Narval room seats up to 50 people. For a community or an association it can be lent, subject to approval and membership; for a business event, it is rented."
tierslieu.host.cta: "Suggest an event"
tierslieu.people.title: "The people who make the Plage"
tierslieu.support.eyebrow: "Our supporters"
tierslieu.support.title: "Supporters and networks"
tierslieu.support.lead: "La Plage Digitale is supported by the Grand Est Region and the Eurométropole de Strasbourg. It belongs to the Tiers-Lieux Grand Est network and holds the Centre Collaboratif Connecté label."
tierslieu.member.eyebrow: "Membership"
tierslieu.member.title: "Becoming a member"
tierslieu.member.p1: "Working at the Plage? You are already a member: membership comes with your first invoice."
tierslieu.member.p2: "Want to support the Plage without renting a space? You can join to back the project and take part in the life of the association."
tierslieu.member.cta: "Join online"
tierslieu.contact.title: "Come and meet the community"
