# ── privacy ──
privacy.meta.title: "Privacy policy — La Plage Digitale"
privacy.meta.description: "How La Plage Digitale handles your data: contact form, cookie-free analytics, retention periods and your GDPR rights."
privacy.eyebrow: "Your data"
privacy.title: "Privacy policy"
privacy.lead: "We collect only what we need, we sell nothing and we use no advertising trackers. Here, in plain terms, is what laplagedigitale.fr does with your data."
privacy.updated: "Last updated: October 2026"
privacy.controller.title: "Data controller"
privacy.controller.p1: "The data controller is the La Plage Digitale association, 13 rue Jacques Peirotes, 67000 Strasbourg, France, represented by its President, Simon THIERRY."
privacy.controller.p2: "For any question about your data: contact@laplagedigitale.fr."
privacy.contact.title: "Contact form"
privacy.contact.p1: "When you write to us through the form on the Contact page, we store your name, email address, phone number (optional), the subject and content of your message, and the date it was sent, in the website’s database."
privacy.contact.p2: "This data is used solely to reply to your enquiry (a visit, a desk, a room, an event, membership…) and, where relevant, to send you a proposal. Legal basis: steps taken at your request prior to entering into a contract, and our legitimate interest in replying to people who contact us (Article 6(1)(b) and (f) GDPR)."
privacy.contact.p3: "To protect the form against automated submissions, each submission is also logged with your browser identifier (user agent) and an irreversible fingerprint (salted hash) of your IP address; the IP address itself is never stored."
privacy.analytics.title: "Cookie-free analytics"
privacy.analytics.p1: "To understand which pages are read, we use the analytics tool built into our platform, which runs on our own server. It sets no cookies, uses no fingerprinting techniques and sends no data to any third party: no Google Analytics, no advertising pixels."
privacy.analytics.p2: "It records page views, the referring page, campaign parameters (UTM) and device type. Visits are grouped using a pseudonymous identifier calculated on the server from the date, IP address and browser, which changes every day; the IP address is not stored."
privacy.analytics.p3: "If your browser sends a “Do Not Track” signal, your visit is not recorded. Statistics are deleted automatically after 365 days, and the Legal notice and Privacy pages are not measured. As it is limited to aggregate statistics, this audience measurement does not require your consent."
privacy.accounts.title: "Editorial team accounts"
privacy.accounts.p1: "Only members of the La Plage Digitale team have an account, created by an administrator, to publish blog news: the website offers no public sign-up. For these accounts we store the name, email address, an irreversibly hashed password and the session information needed to sign in."
privacy.cookies.title: "Cookies"
privacy.cookies.p1: "This website sets no advertising, profiling or analytics cookies. Only strictly necessary cookies may be set: the session cookie for team members signed in to the editorial area and, if you switch language, a cookie that remembers your choice."
privacy.cookies.p2: "These technical cookies are exempt from consent under French data protection law (Article 82 of the Loi Informatique et Libertés), which is why the website shows no cookie banner."
privacy.thirdparty.title: "Third-party content"
privacy.thirdparty.p1: "The Contact page embeds a Google Maps map. When it loads, Google receives your IP address and may set its own cookies, in accordance with its privacy policy (policies.google.com/privacy). Our full address is written out on the page, so you can do without the map."
privacy.thirdparty.p2: "Links to HelloAsso (membership) and to our social networks lead to third-party services governed by their own privacy policies. We do not pass any data to them."
privacy.recipients.title: "Recipients and hosting"
privacy.recipients.p1: "Your data is accessible only to authorised members of the La Plage Digitale team. It is never sold, rented or transferred for commercial purposes."
privacy.recipients.p2: "The website and its database are hosted by our technical processor, Scalingo SAS (Strasbourg), within the European Union. No data is transferred outside the European Union."
privacy.retention.title: "Retention periods"
privacy.retention.p1: "Contact form messages: 3 years from our last exchange, then deleted. · Visit statistics: 365 days, then deleted automatically. · Team accounts: for as long as the person contributes to the website, then deleted."
privacy.security.title: "Security"
privacy.security.p1: "Connections to the website are encrypted (HTTPS), passwords are hashed and access to data is restricted to authorised people. As no method of transmission or storage is infallible, we undertake to inform you as soon as possible should an incident affect your data, in accordance with the GDPR."
privacy.rights.title: "Your rights"
privacy.rights.p1: "Under the GDPR and French data protection law, you have the right to access, rectify and erase your data, to restrict or object to its processing, the right to data portability, and the right to give instructions on what happens to your data after your death."
privacy.rights.p2: "To exercise these rights, email us at contact@laplagedigitale.fr or write to La Plage Digitale, 13 rue Jacques Peirotes, 67000 Strasbourg, France. We will reply within one month. If we have reasonable doubts about your identity, we may ask you for proof."
privacy.rights.p3: "If, after contacting us, you feel your rights have not been respected, you may lodge a complaint with the CNIL, the French data protection authority: www.cnil.fr/fr/plaintes."
privacy.changes.title: "Changes to this policy"
privacy.changes.p1: "We may update this policy to reflect changes to the website or to the law. The date of the latest update is shown at the top of this page."

