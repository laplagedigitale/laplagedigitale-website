member.rooms.title: "Meeting rooms"
member.rooms.intro: "Four rooms for 6 to 60 people, bookable by the half day or the day."
member.rooms.fixe.title: "Included in your Fixed desk plan"
member.rooms.fixe.text: "Crevette, Requin and Baleine are yours on a fair-use basis. Narval, repeated full-day bookings and paid activities (a training session, say) are charged."
member.rooms.gcal.title: "Book with Google Calendar"
member.rooms.gcal.1: "1. Add the room calendars: you receive an email invitation, click “Add this calendar”. They show under “Other calendars”."
member.rooms.gcal.2: "2. Create an event in your calendar, then “Find a room” and pick one. Taken? Choose another room or time."
member.rooms.gcal.3: "3. Check the event shows in the room calendar. To cancel, delete the event."
member.rooms.gcal.access: "No calendars yet? Ask for access at contact@laplagedigitale.fr."
member.rooms.request.title: "Request a booking"
member.rooms.request.text: "Outside the Fixed desk plan, rooms are charged at the rates above. Send us your request: date, time slot, room and number of people."
member.rooms.request.cta: "Send a request ↗"
member.rooms.rules.title: "Good habits"
member.rooms.rules.1: "A booked room still empty 15 minutes after the slot starts may be treated as free."
member.rooms.rules.2: "Leave the room clean and tidy."
member.rooms.rules.3: "Set the temperature when you arrive, never more than 5 °C below the outside temperature."
member.rooms.rules.4: "A quick call? The table-football room will do, but players have priority."
