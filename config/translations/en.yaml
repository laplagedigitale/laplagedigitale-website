coworkers.caroline.alt: Portrait of Caroline Bosc
coworkers.caroline.p1: "After a master's degree in international business, Caroline added a second master's in web studies in Strasbourg."
coworkers.caroline.p2: "Now a UX designer at Impact Positif, she has been coworking at La Plage Digitale since March 2022."
coworkers.frederic.alt: Portrait of Frédéric Fuchs
coworkers.frederic.p1: "Frédéric is head of sales operations at OpenClassrooms, a company whose mission is to make education accessible to everyone."
coworkers.frederic.p2: "After three years of working from home, he joined us to draw a line between his private and professional life — and to meet new people."
coworkers.roland.alt: Portrait of Roland Margelidon
coworkers.roland.p1: "A software engineer, Roland founded his own company, Rolrom, and is building business management software for architecture firms."
