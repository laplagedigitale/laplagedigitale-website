# ── about ──
about.meta.title: About us — La Plage Digitale
about.meta.description: "La Plage Digitale, a non-profit born from Alsace Digitale, runs a third place of over 600 m² in the heart of Strasbourg. Our project, board and team."
about.eyebrow: About us
about.title: A third place in the heart of Strasbourg
about.lead: La Plage Digitale welcomes you to its coworking space, at the heart of its third place.
about.place.eyebrow: The place
about.place.title: Over 600 m² in the former Coop premises
about.place.p1: "Set in the former Coop premises on rue Jacques Peirotes, right in the centre of Strasbourg, La Plage Digitale offers over 600 m² for the region's entrepreneurs, innovators and creatives. A meeting point for Strasbourg's entrepreneurial ecosystem, it is a space that fosters creative initiatives, individual and collective alike."
about.place.p2: "It is also one of the largest coworking spaces in Strasbourg: 52 dedicated desks for coworkers and 30 places available without booking, Monday to Friday from 9 am to 5 pm. Fully equipped meeting rooms host your seminars and team meetings."
about.place.p3: "Last but not least, our Flex area holds up to 60 people for meetups and evenings run with our community, institutional and private partners — and you can hire it for your own professional events."
about.place.imageAlt: "The open space at La Plage Digitale: desks, pendant lights and glazed partitions under a concrete roof structure"
about.project.title: The project
about.project.p1: "La Plage Digitale exists to speed up the development of innovative projects. It encourages exchanges between coworkers while giving every visitor a personal welcome."
about.project.p2: "Our coworking space is open to everyone. That diversity is what makes for a warm, caring community: working together, sharing services and values, with respect for each other."
about.project.motto: Pooling resources and serendipity are the watchwords behind everything we do.
about.association.title: The association
about.association.p1: "La Plage Digitale is a non-profit association under local Alsace-Moselle law (loi 1908), set up in 2019 when part of the activity of the Alsace Digitale association was spun off."
about.association.p2: "It runs the third place and its coworking space. La Plage Digitale is therefore the name of both the association and this dual-purpose venue."
