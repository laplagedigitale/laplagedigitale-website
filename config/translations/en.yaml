tarifs.rooms.eyebrow: "Meeting rooms"
tarifs.rooms.title: "Four rooms, from 6 to 50 people"
tarifs.rooms.lead: "Member or not, you book a room in 4-hour slots; each extra hour costs €20 excl. VAT. Screen (HDMI), flip chart, whiteboard, plus coffee, tea and water."
tarifs.rooms.assoc: "Organising something for an association or a community? The Plage can lend you a room, subject to approval and membership."
tarifs.member.eyebrow: "The association"
tarifs.member.title: "Joining the association"
tarifs.member.p1: "Whether you come for a day or all year, you become a member of the association: the fee is added to your first invoice, nothing to do on your side."
tarifs.member.p2: "€5 per person, €20 per company; employees of a member company are covered by its membership. It runs until 31 December (paid after 14 December, until the end of the following year)."
tarifs.member.p3: "You can join the Conseil de la Plage and the internal events, and you get the monthly newsletter."
cta.support: "Join without renting a space →"
tarifs.faq.eyebrow: "Frequent questions"
tarifs.faq.title: "Before you start"
tarifs.faq.q1: "Can I try before committing?"
tarifs.faq.a1: "Yes: come and work a Flex day for €14 excl. VAT, no booking needed, or email us to arrange a visit."
tarifs.faq.q2: "Is membership compulsory?"
tarifs.faq.a2: "Yes, to rent a space: the association makes its premises available to its members. It costs €5 per person or €20 per company per year."
tarifs.faq.q3: "Can I switch plans?"
tarifs.faq.a3: "Yes: email contact@laplagedigitale.fr and we'll look at it together."
tarifs.faq.q4: "How do I get my invoices?"
tarifs.faq.a4: "By email, and in your Member Area, where you can also set up direct debit."
tarifs.faq.q5: "Are meeting rooms included with a fixed desk?"
tarifs.faq.a5: "Crevette, Requin and Baleine, yes, on a fair-use basis: not for a paid activity, nor for whole days several times a month. Narval is charged."
tarifs.faq.q6: "What does the business address include?"
tarifs.faq.a6: "Your registered office address, your mail received during opening hours, your registered letters collected, a message each time something arrives, and a room for your board meetings. Forwarding costs €10 excl. VAT a month."
