member.guide.about.title: "What is La Plage Digitale?"
member.guide.about.1: "An association under local law (1908 act), founded in 2019, running a third place and coworking space in the former Coop premises in central Strasbourg: over 600 m²."
member.guide.about.2: "A third place to meet and create together, and a coworking space for freelancers, associations and companies."
member.guide.about.3: "Address: 13 rue Jacques Peirotes, 67000 Strasbourg. Sliding door at the front, glass door at the back on rue de Genève."
member.guide.access.title: "Opening hours and access"
member.guide.access.1: "Reception is staffed Monday to Friday, 9am to 5:30pm. Flex members come between 9am and 5pm."
member.guide.access.2: "Fixed desk, Nomad and Box members have 24/7 access with their keys or badges, issued against a deposit. Never lend or copy them."
member.guide.access.3: "The first to arrive opens the back metal shutter: it blocks an emergency exit. The last to leave turns off the lights, sets the front door to stay shut, locks the back door and lowers the shutter."
member.guide.access.4: "Anyone the association does not know is accompanied during their visit. Someone new on your team (employee, intern)? Let us know."
member.guide.net.title: "Internet and Wi-Fi"
member.guide.net.1: "Wired fibre at the desks and Wi-Fi in every room. The network name and password are displayed in the rooms, or ask at reception."
member.guide.net.2: "No router or repeater without the association’s approval, and no illegal downloading. Heavy data use? A dedicated line is possible."
member.guide.print.title: "Printing and scanning"
member.guide.print.1: "Printers and scanners are for everyday business documents. Personal, commercial (flyers, posters) or bulk printing falls outside fair use."
member.guide.print.2: "To scan to your computer: install the Brother MFC-L8690CDW driver, then “Scan” and pick the La Plage printer."
member.guide.print.cta: "Download the Brother driver ↗"
member.guide.kitchen.title: "Kitchen and fridges"
member.guide.kitchen.1: "Ovens, microwaves and hobs are for everyone. Clean your spot and your dishes, and empty the dishwasher when it is clean."
member.guide.kitchen.2: "Shared fridge: orange label 🟠 with the date, its contents are for everyone. Personal fridge: blue label 🔵 with your name."
member.guide.kitchen.3: "Anything unlabelled or out of date is thrown away at cleaning. Paper goes next to the printers, packaging in the yellow bin."
member.guide.together.title: "Living together"
member.guide.together.1: "Phones on silent, low voices in shared rooms, calls and video meetings outside the open space, smelly food in the kitchen."
member.guide.together.2: "The plants are looked after by Jardins de Gally: do not water them or pour anything in. Your own plants are yours to care for."
member.guide.together.3: "No smoking or vaping. Alcohol only at events approved by the board. No animals except assistance or emotional-support animals."
member.guide.together.4: "Office-room temperature is set by the team. Ill and contagious? Stay home, or wear a mask."
member.guide.furniture.title: "Furniture"
member.guide.furniture.1: "Sit-stand desk stuck? Lower it all the way: a double click means the legs have reset."
member.guide.furniture.2: "Still broken, or another Kinnarps item damaged? Photograph the reference label (under the top or seat) and the problem, and send both to sav@kinnarps.com."
member.guide.furniture.3: "Your own furniture? Only with the team’s approval. Do not climb on furniture."
member.guide.parking.title: "Parking “Bermuda Triangle”"
member.guide.parking.1: "Two spaces on the rue de Genève side, for member coworkers and La Plage suppliers. Not for passing guests. One is reserved for Kinnarps but must still be booked."
member.guide.parking.2: "Book in the Google calendar “Le Triangle des Bermudes” (ask for access as for the rooms). Each space has two calendars: sign up in both."
member.guide.parking.3: "Pick up the barrier badge at reception and bring it back after use (nobody there? in the pen pot on the desk). A lost badge is charged. Fair use: no daily or extended parking."
member.guide.mail.title: "Lockers and mail"
member.guide.mail.1: "Fixed desk members have a personal lockable locker. For other plans a locker is possible on request, with an agreement."
member.guide.mail.2: "Mail and parcels are received at reception. The letterbox is emptied on Mondays, Wednesdays and Fridays."
member.guide.safety.title: "Safety"
member.guide.safety.1: "La Plage is a building open to the public: 200 people at most. Always keep emergency exits clear and openable from inside."
member.guide.safety.2: "Assembly point in case of evacuation: behind the building, on the rue de Genève side."
member.guide.safety.3: "You are responsible for equipment you leave on site: theft insurance is recommended. An organisation under contract must hold professional liability insurance."
member.guide.contact.title: "A question or a problem?"
member.guide.contact.1: "Reception, or contact@laplagedigitale.fr for everything else."
member.guide.contact.2: "Flex: contact+flex@laplagedigitale.fr. Communication, events and partnerships: lucie.dubief@laplagedigitale.fr."
member.guide.contact.3: "An idea to improve the place, a recurring issue? Raise it at the Conseil de la Plage."
member.community.title: "Community life"
member.community.intro: "La Plage is first of all the people who work there. Here is how to take part."
member.community.slack.title: "La Plage’s Slack"
member.community.slack.text: "Practical info, announcements, mutual help and afterworks: it all happens on Slack, especially #général."
member.community.slack.join: "Join the Slack ↗"
member.community.slack.open: "Already in? Open laplagedigitale.slack.com ↗"
member.community.conseil.title: "The Conseil de la Plage"
member.community.conseil.text: "On the first Thursday of the month at noon, coworkers meet for news, ongoing projects, ideas and issues to fix. Can’t make it? Send your topic beforehand."
member.community.conseil.cta: "Suggest a topic ↗"
member.community.rituals.title: "Regular get-togethers"
member.community.rituals.1: "Mardis Gourmands: every Tuesday around 10am, a coworker brings breakfast to share. Want to host one? Tell the team."
member.community.rituals.2: "Table football: meet around 1:30pm and 4pm in the room by the entrance."
member.community.rituals.3: "Afterworks: regularly in nearby bars, and sometimes at La Plage for special occasions."
member.community.rituals.4: "Solidarity: blood-donation groups between noon and 2pm, international solidarity days."
member.community.events.title: "Events"
member.community.events.text: "La Plage hosts meetups, talks and afterworks, and lends its space free of charge to communities and associations. Organising something?"
member.community.events.cta: "Events and how to request one ↗"
member.community.asso.title: "The association"
member.community.asso.text: "La Plage Digitale is an association: as a member you take part in its decisions, and Flex members get one free day each year. Volunteers welcome to staff reception."
member.community.asso.cta: "Join or help: write to us"
member.community.asso.href: "mailto:contact@laplagedigitale.fr?subject=Membership"
member.community.social.title: "Follow us"
member.docs.title: "Rules & documents"
member.docs.intro: "The texts that apply to everyone using La Plage, and the key points."
member.docs.summary.title: "Key points"
member.docs.summary.1: "Safe space: no shocking, violent, sexual or discriminatory words or behaviour, as set out in the Charter of values."
member.docs.summary.2: "Fair use: internet, electricity, printers, meeting rooms, tea and coffee are free as long as nobody else is hindered. Beyond that they may be charged."
member.docs.summary.3: "Everyone looks after the shared spaces and reports problems to reception."
member.docs.summary.4: "Confidentiality: do not look at other people’s screens and papers, and never disclose them."
member.docs.summary.5: "The board may suspend access for anyone who does not follow these rules."
