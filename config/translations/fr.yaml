member.rooms.rules.4: "Un appel rapide ? La salle du baby-foot dépanne, mais les joueurs restent prioritaires."
member.guide.title: "Guide pratique"
member.guide.intro: "Le Kit du Plagiste : tout ce qu'il faut savoir pour travailler à La Plage au quotidien."
member.guide.toc: "Sur cette page"
member.guide.group.welcome: "Bienvenue à La Plage"
member.guide.group.daily: "Au quotidien"
member.guide.group.equipment: "Équipements"
member.guide.group.help: "Sécurité et contacts"
member.guide.about.title: "C'est quoi, La Plage Digitale ?"
member.guide.about.1: "Une association de droit local (loi 1908), créée en 2019, qui gère un tiers-lieu et un espace de coworking dans les anciens locaux de la Coop, au cœur de Strasbourg : plus de 600 m²."
member.guide.about.2: "Un tiers-lieu pour se rencontrer et créer ensemble, et un coworking pour les indépendants, les associations et les entreprises."
member.guide.about.3: "Adresse : 13 rue Jacques Peirotes, 67000 Strasbourg. Porte coulissante à l'avant, porte vitrée à l'arrière côté rue de Genève."
member.guide.access.title: "Horaires et accès"
member.guide.access.1: "L'accueil est assuré du lundi au vendredi, de 9h à 17h30. Les Flex viennent de 9h à 17h."
member.guide.access.2: "Fixe, Nomade et Box accèdent aux locaux 24h/24 et 7j/7 avec leurs clés ou badges, remis contre caution. Ils ne se prêtent pas et ne se reproduisent pas."
member.guide.access.3: "Le premier arrivé ouvre le rideau métallique arrière : il ferme une sortie de secours. Le dernier parti éteint les lumières, règle la porte avant pour qu'elle reste fermée, verrouille la porte arrière et baisse le rideau."
member.guide.access.4: "Une personne inconnue de l'association est accompagnée pendant sa visite. Une nouvelle recrue dans votre équipe (salarié·e, stagiaire) ? Prévenez-nous."
member.guide.net.title: "Internet et Wi-Fi"
member.guide.net.1: "Fibre en filaire aux bureaux et Wi-Fi dans toutes les salles. Le nom du réseau et son mot de passe sont affichés dans les salles, ou demandez-les à l'accueil."
member.guide.net.2: "Pas de routeur ni de répéteur sans l'accord de l'association, et aucun téléchargement illégal. Un très gros volume de données ? Une ligne dédiée est possible."
member.guide.print.title: "Imprimer et scanner"
member.guide.print.1: "Imprimantes et scanners servent aux documents courants de votre activité. Les impressions personnelles, commerciales (flyers, affiches) ou en gros volume sortent de l'usage équitable."
member.guide.print.2: "Pour scanner vers votre ordinateur : installez le pilote Brother MFC-L8690CDW, puis « Numériser » et choisissez l'imprimante de La Plage."
member.guide.print.cta: "Télécharger le pilote Brother ↗"
member.guide.kitchen.title: "Cuisine et frigos"
member.guide.kitchen.1: "Fours, micro-ondes et plaques sont à tous. Nettoyez votre place et votre vaisselle, videz le lave-vaisselle quand il est propre."
member.guide.kitchen.2: "Frigo libre-service : étiquette orange 🟠 avec la date du jour, ce qu'il contient se partage. Frigo personnel : étiquette bleue 🔵 avec votre nom."
member.guide.kitchen.3: "Tout produit sans étiquette, ou périmé, est jeté lors du nettoyage. Le papier va à côté des imprimantes, les emballages dans la poubelle jaune."
member.guide.together.title: "Vivre ensemble"
member.guide.together.1: "Téléphones en silencieux, voix basses dans les salles partagées, appels et visios hors de l'open space, repas odorants à la cuisine."
member.guide.together.2: "Les plantes sont entretenues par les Jardins de Gally : ne les arrosez pas et n'y versez rien. Vos propres plantes restent à votre charge."
member.guide.together.3: "Ni tabac ni vapoteuse. L'alcool, seulement lors d'événements autorisés par le conseil d'administration. Pas d'animaux, sauf d'assistance ou de soutien émotionnel."
member.guide.together.4: "La température des salles de bureaux est réglée par l'équipe. Malade et contagieux ? Restez chez vous, ou portez un masque."
member.guide.furniture.title: "Mobilier"
member.guide.furniture.1: "Bureau assis-debout bloqué ? Baissez-le au maximum : un double clic indique que les pieds se sont réinitialisés."
member.guide.furniture.2: "Toujours en panne, ou un autre meuble Kinnarps abîmé ? Photographiez l'étiquette de référence (sous le plateau ou le siège) et le problème, et envoyez le tout à sav@kinnarps.com."
member.guide.furniture.3: "Votre propre mobilier ? Seulement avec l'accord de l'équipe. On ne monte pas sur les meubles."
member.guide.parking.title: "Parking « Triangle des Bermudes »"
member.guide.parking.1: "Deux places côté rue de Genève, pour les coworkers adhérents et les fournisseurs de La Plage. Pas pour les invités de passage. Une place est réservée à Kinnarps, mais se réserve quand même."
member.guide.parking.2: "Réservez dans l'agenda Google « Le Triangle des Bermudes » (demandez l'accès comme pour les salles). Chaque place a deux agendas : inscrivez-vous dans les deux."
member.guide.parking.3: "Prenez le badge de la barrière à l'accueil et rapportez-le après usage (personne à l'accueil ? dans le pot à stylos du bureau). Un badge perdu est refacturé. Usage équitable : pas de stationnement quotidien ni prolongé."
member.guide.mail.title: "Casiers et courrier"
member.guide.mail.1: "Les Fixe ont un casier personnel fermé à clé. Pour les autres formules, un casier est possible sur demande, avec une convention."
member.guide.mail.2: "Courrier et colis sont reçus à l'accueil. La boîte aux lettres est relevée les lundis, mercredis et vendredis."
member.guide.safety.title: "Sécurité"
member.guide.safety.1: "La Plage est un établissement recevant du public : 200 personnes au plus. Laissez toujours les sorties de secours dégagées, et ouvrables de l'intérieur."
member.guide.safety.2: "Point de rassemblement en cas d'évacuation : derrière le bâtiment, côté rue de Genève."
member.guide.safety.3: "Vous êtes responsable du matériel que vous laissez sur place : une assurance contre le vol est recommandée. Une structure sous contrat doit avoir une responsabilité civile professionnelle."
member.guide.contact.title: "Une question, un problème ?"
member.guide.contact.1: "L'accueil, ou contact@laplagedigitale.fr pour tout le reste."
member.guide.contact.2: "Flex : contact+flex@laplagedigitale.fr. Communication, événements et partenariats : lucie.dubief@laplagedigitale.fr."
member.guide.contact.3: "Une idée pour améliorer le lieu, un souci qui revient ? Proposez-le au Conseil de la Plage."
member.community.title: "Vie de la communauté"
member.community.intro: "La Plage, ce sont d'abord celles et ceux qui y travaillent. Voici comment en faire partie."
member.community.slack.title: "Le Slack de La Plage"
member.community.slack.text: "Infos pratiques, annonces, entraide et afterworks : tout passe par le Slack, en particulier #général."
member.community.slack.join: "Rejoindre le Slack ↗"
member.community.slack.open: "Déjà inscrit ? Ouvrir laplagedigitale.slack.com ↗"
member.community.conseil.title: "Le Conseil de la Plage"
member.community.conseil.text: "Le premier jeudi du mois à midi, les coworkers se retrouvent pour les nouvelles du lieu, les projets en cours, les idées et les problèmes à régler. Absent ? Envoyez votre sujet avant."
member.community.conseil.cta: "Proposer un sujet ↗"
member.community.rituals.title: "Les rendez-vous"
member.community.rituals.1: "Mardis Gourmands : chaque mardi vers 10h, un coworker offre un petit-déjeuner à partager. Envie d'en organiser un ? Dites-le à l'équipe."
member.community.rituals.2: "Baby-foot : rendez-vous vers 13h30 et 16h dans la salle à l'entrée."
member.community.rituals.3: "Afterworks : régulièrement dans les bars du quartier, et parfois à La Plage pour les grandes occasions."
member.community.rituals.4: "Démarches solidaires : groupes de don du sang entre 12h et 14h, journées internationales solidaires."
member.community.events.title: "Événements"
member.community.events.text: "La Plage accueille meetups, conférences et afterworks, et prête gracieusement ses espaces aux communautés et associations. Vous organisez quelque chose ?"
member.community.events.cta: "Les événements et la demande ↗"
member.community.asso.title: "L'association"
member.community.asso.text: "La Plage Digitale est une association : en devenant adhérent·e, vous participez à ses décisions, et en Flex une journée vous est offerte chaque année. Bénévoles bienvenus pour tenir la permanence de l'accueil."
member.community.asso.cta: "Adhérer ou aider : écrivez-nous"
member.community.asso.href: "mailto:contact@laplagedigitale.fr?subject=Adh%C3%A9sion"
member.community.social.title: "Suivez-nous"
member.docs.title: "Règlement & documents"
member.docs.intro: "Les textes qui s'appliquent à toutes celles et ceux qui utilisent La Plage, et l'essentiel à retenir."
member.docs.summary.title: "L'essentiel"
member.docs.summary.1: "Safe space : aucun propos ni comportement choquant, violent, sexuel ou discriminatoire, conformément à la Charte des valeurs."
member.docs.summary.2: "Usage équitable : internet, électricité, imprimantes, salles de réunion, thé et café sont libres tant que cela ne gêne personne. Au-delà, ils peuvent être facturés."
member.docs.summary.3: "Chacun prend soin des espaces partagés et signale les problèmes à l'accueil."
member.docs.summary.4: "Confidentialité : on ne regarde pas les écrans et documents des autres, et on n'en divulgue rien."
member.docs.summary.5: "Le conseil d'administration peut suspendre l'accès de toute personne qui ne respecte pas ces règles."
