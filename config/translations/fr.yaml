legal.meta.title: "Mentions légales — La Plage Digitale"
legal.meta.description: "Mentions légales du site de La Plage Digitale : éditeur, directeur de la publication, hébergeur, propriété intellectuelle et responsabilité."
legal.eyebrow: "Informations légales"
