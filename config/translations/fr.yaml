# ── coworkers ──
coworkers.meta.title: Nos coworkers — La Plage Digitale
coworkers.meta.description: "Designers, développeurs, entrepreneurs : rencontrez celles et ceux qui travaillent au quotidien à La Plage Digitale, coworking associatif à Strasbourg."
coworkers.eyebrow: Nos coworkers
coworkers.title: Celles et ceux qui font la Plage
coworkers.lead: "Salariés à distance, indépendants, fondatrices et fondateurs : ils ont choisi La Plage Digitale pour travailler, et ils vous disent pourquoi."
coworkers.list.title: Portraits de coworkers
coworkers.caroline.alt: Portrait de Caroline Bosc
coworkers.caroline.p1: "Après un master en commerce international, Caroline a voulu compléter ses connaissances par un master dans le domaine du web à Strasbourg."
coworkers.caroline.p2: "Aujourd'hui UX designer chez Impact Positif, elle est coworkeuse à La Plage Digitale depuis mars 2022."
coworkers.frederic.alt: Portrait de Frédéric Fuchs
coworkers.frederic.p1: "Frédéric est responsable des opérations de vente chez OpenClassrooms, une entreprise dont l'objectif est de rendre l'éducation accessible à tous."
coworkers.frederic.p2: "Après trois ans de travail à domicile, il nous a rejoints pour séparer vie privée et vie professionnelle, et pour rencontrer de nouvelles personnes."
coworkers.roland.alt: Portrait de Roland Margelidon
coworkers.roland.p1: "Ingénieur en informatique, Roland a créé sa société, Rolrom. Il développe un logiciel de gestion d'entreprise pour les cabinets d'architectes."
coworkers.roland.p2: "Il a choisi La Plage Digitale parce que c'est un espace de coworking associatif."
coworkers.bastien.company: Freelance
coworkers.bastien.alt: Portrait de Bastien Remy
coworkers.bastien.p1: "Développeur web à son compte, Bastien conçoit des applications sur mesure pour les entreprises qui ont besoin d'outils web."
coworkers.bastien.p2: "Il travaille à La Plage Digitale depuis cinq ans et s'y sent très bien. Pour lui, la Plage, c'est la tranquillité, la liberté et la flexibilité !"
coworkers.sylvaine.alt: Portrait de Sylvaine Gross
coworkers.sylvaine.p1: "Un vrai couteau suisse alsacien : après plus de 20 ans comme secrétaire polyvalente, assistante commerciale et assistante de direction, Sylvaine s'est lancée dans l'aventure entrepreneuriale avec Mu.se, son activité d'assistanat administratif. Elle a été trésorière de La Plage Digitale, dont Mu.se est membre depuis 2019."
coworkers.sylvaine.p2: "C'est aussi la fournisseuse officieuse d'agrafes, de trombones, de Tipp-Ex et de papier brouillon des coworkers."
coworkers.eleonore.alt: Portrait d'Eléonore Greif
coworkers.eleonore.p1: "Documentariste dans une autre vie, Eléonore a récemment rejoint, comme assistante administrative, la joyeuse équipe de Mu.se — et celle, plus joyeuse encore, de La Plage Digitale !"
coworkers.eleonore.p2: "L'occasion de travailler hors de chez soi, au contact de personnes impliquées dans la vie associative."
coworkers.cta.title: Et si votre portrait était le prochain ?
coworkers.cta.text: Rejoignez la communauté de La Plage Digitale, pour une journée ou pour longtemps.
