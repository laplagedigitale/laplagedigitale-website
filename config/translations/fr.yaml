# ── coworkers ──
coworkers.caroline.alt: Portrait de Caroline Bosc
coworkers.caroline.p1: "Après un master en commerce international, Caroline a voulu compléter ses connaissances par un master dans le domaine du web à Strasbourg."
coworkers.caroline.p2: "Aujourd'hui UX designer chez Impact Positif, elle est coworkeuse à La Plage Digitale depuis mars 2022."
coworkers.frederic.alt: Portrait de Frédéric Fuchs
coworkers.frederic.p1: "Frédéric est responsable des opérations de vente chez OpenClassrooms, une entreprise dont l'objectif est de rendre l'éducation accessible à tous."
coworkers.frederic.p2: "Après trois ans de travail à domicile, il nous a rejoints pour séparer vie privée et vie professionnelle, et pour rencontrer de nouvelles personnes."
coworkers.roland.alt: Portrait de Roland Margelidon
coworkers.roland.p1: "Ingénieur en informatique, Roland a créé sa société, Rolrom. Il développe un logiciel de gestion d'entreprise pour les cabinets d'architectes."
coworkers.roland.p2: "Il a choisi La Plage Digitale parce que c'est un espace de coworking associatif."
coworkers.bastien.company: Freelance
coworkers.bastien.alt: Portrait de Bastien Remy
coworkers.bastien.p1: "Développeur web à son compte, Bastien conçoit des applications sur mesure pour les entreprises qui ont besoin d'outils web."
coworkers.bastien.p2: "Il travaille à La Plage Digitale depuis cinq ans et s'y sent très bien. Pour lui, la Plage, c'est la tranquillité, la liberté et la flexibilité !"
coworkers.sylvaine.alt: Portrait de Sylvaine Gross
coworkers.sylvaine.p1: "Un vrai couteau suisse alsacien : après plus de 20 ans comme secrétaire polyvalente, assistante commerciale et assistante de direction, Sylvaine s'est lancée dans l'aventure entrepreneuriale avec Mu.se, son activité d'assistanat administratif. Elle a été trésorière de La Plage Digitale, dont Mu.se est membre depuis 2019."
coworkers.sylvaine.p2: "C'est aussi la fournisseuse officieuse d'agrafes, de trombones, de Tipp-Ex et de papier brouillon des coworkers."
coworkers.eleonore.alt: Portrait d'Eléonore Greif
coworkers.eleonore.p1: "Documentariste dans une autre vie, Eléonore a récemment rejoint, comme assistante administrative, la joyeuse équipe de Mu.se — et celle, plus joyeuse encore, de La Plage Digitale !"
coworkers.eleonore.p2: "L'occasion de travailler hors de chez soi, au contact de personnes impliquées dans la vie associative."

# ── legal ──
legal.meta.title: "Mentions légales — La Plage Digitale"
legal.meta.description: "Mentions légales du site de La Plage Digitale : éditeur, directeur de la publication, hébergeur, propriété intellectuelle et responsabilité."
legal.eyebrow: "Informations légales"
legal.title: "Mentions légales"
legal.lead: "En application de l’article 6 de la loi n° 2004-575 du 21 juin 2004 pour la confiance dans l’économie numérique (LCEN), voici l’identité des intervenants du site laplagedigitale.fr."
legal.updated: "Dernière mise à jour : octobre 2026"
legal.editor.title: "Éditeur du site"
legal.editor.p1: "Le site laplagedigitale.fr est édité par La Plage Digitale, association de droit local alsacien-mosellan régie par la loi de 1908, qui gère le tiers-lieu et l’espace de coworking du même nom."
legal.editor.p2: "Siège : 13 rue Jacques Peirotes, 67000 Strasbourg, France"
legal.editor.p3: "Téléphone : 09 77 42 59 29 · 06 24 41 32 03 · E-mail : contact@laplagedigitale.fr"
legal.director.title: "Directeur de la publication"
legal.director.p1: "Simon THIERRY, président de l’association La Plage Digitale."
legal.host.title: "Hébergeur"
legal.host.p1: "Scalingo SAS, société par actions simplifiée au capital de 35 291,90 €, SIRET 808 665 483 00034 · 13 rue Jacques Peirotes, 67000 Strasbourg, France · https://scalingo.com"
legal.host.p2: "Le site et ses données sont hébergés au sein de l’Union européenne."
legal.build.title: "Conception et réalisation"
legal.build.p1: "Le site est construit avec Sovrium (https://sovrium.com), une plateforme applicative pilotée par configuration. Textes et photographies : La Plage Digitale, sauf mention contraire. Photographies des locaux : Naïs Massing."
legal.ip.title: "Propriété intellectuelle"
legal.ip.p1: "L’ensemble des éléments du site — textes, photographies, illustrations, logos et identité visuelle — est la propriété de La Plage Digitale ou est utilisé avec l’autorisation de ses titulaires. Ces éléments sont protégés par le Code de la propriété intellectuelle."
legal.ip.p2: "Toute reproduction, représentation, modification ou adaptation de tout ou partie de ces éléments, par quelque procédé que ce soit, sans l’autorisation écrite préalable de La Plage Digitale est interdite et constitue une contrefaçon sanctionnée par les articles L.335-2 et suivants du Code de la propriété intellectuelle. Les noms, logos et marques des entreprises et partenaires cités appartiennent à leurs titulaires respectifs."
legal.liability.title: "Responsabilité"
legal.liability.p1: "La Plage Digitale s’efforce de publier des informations exactes et à jour (formules, tarifs, horaires, services). Ces informations sont données à titre indicatif et peuvent évoluer ; l’association ne saurait être tenue responsable d’une omission, d’une inexactitude ou d’un retard de mise à jour. N’hésitez pas à nous contacter pour toute confirmation."
legal.liability.p2: "Le site est en principe accessible en permanence, mais peut être interrompu, notamment pour des opérations de maintenance. La Plage Digitale ne saurait être tenue responsable des dommages résultant de l’utilisation du site ou de l’impossibilité d’y accéder."
legal.links.title: "Liens hypertextes"
legal.links.p1: "Le site contient des liens vers des sites tiers (HelloAsso, réseaux sociaux, sites de nos coworkers et partenaires). La Plage Digitale n’exerce aucun contrôle sur leur contenu et décline toute responsabilité à leur égard. Les liens pointant vers le présent site sont les bienvenus, dès lors qu’ils ne portent pas atteinte à l’image de l’association."
legal.data.title: "Données personnelles et cookies"
legal.data.p1: "Le site ne dépose aucun cookie publicitaire ni de mesure d’audience. Les informations transmises via le formulaire de contact servent uniquement à répondre à votre demande. Le détail des traitements, des durées de conservation et de vos droits figure dans notre politique de confidentialité."
legal.data.link: "Lire la politique de confidentialité →"
legal.law.title: "Droit applicable"
legal.law.p1: "Les présentes mentions légales sont régies par le droit français. Pour toute question, écrivez-nous à contact@laplagedigitale.fr."

