member.formule.referral.text: "Une personne de ton entourage cherche un bureau ? Si elle s'installe à La Plage, elle a 50 € de réduction sur ses 3 premiers mois, et tu reçois au choix un mois de réduction ou un cadeau d'une valeur équivalente (chocolats, plante en pot, carte cadeau…). Elle n'a qu'à donner ton nom à son inscription."
