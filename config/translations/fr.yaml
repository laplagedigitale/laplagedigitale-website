# ── activities ──
activities.meta.title: Nos activités — La Plage Digitale
activities.meta.description: "Conseil de la Plage, bibliothèque partagée, meetups, Hack SXB, permanences conseil, Bidouillothèque : la vie du tiers-lieu La Plage Digitale à Strasbourg."
activities.eyebrow: Tiers-lieu · Communauté · Événements
activities.title: Nos activités
activities.lead: "La Plage, ce n'est pas qu'un bureau : c'est une communauté qui se retrouve, partage ses ressources et ouvre ses portes aux associations et aux communautés tech de Strasbourg."
activities.offer.eyebrow: Pour nos coworkers
activities.offer.title: Nous proposons…
activities.offer.lead: Des rendez-vous et des services pensés pour faire vivre la communauté des plagistes.
activities.council.title: Le Conseil de la Plage
activities.council.text: "Une fois par mois, le Conseil de la Plage réunit les coworkers : actualités de l'espace, attentes de chacun et présentation des nouveaux arrivants."
activities.council.imageAlt: Quatre personnes échangent autour d'une table couverte de documents
activities.library.title: Bibliothèque partagée
activities.library.text: Des livres couvrant des thématiques variées sont à la disposition des plagistes.
activities.library.imageAlt: Les étagères de la bibliothèque partagée
activities.startupce.title: Startup CE
activities.startupce.text: "Grâce à notre partenariat avec la plateforme Startup CE, profitez d'un large panel d'avantages et de réductions pour vos sorties culturelles et sociales."
activities.startupce.imageAlt: Illustration d'une fusée qui décolle au-dessus d'une ville
activities.ecology.title: Démarche écologique
activities.ecology.text: "Tri sélectif, sensibilisation aux bons gestes et solutions anti-gaspillage : nous agissons au quotidien pour réduire notre impact."
activities.ecology.imageAlt: Illustration de la démarche écologique de La Plage Digitale
activities.host.eyebrow: Ouverts sur la ville
activities.host.title: Nous accueillons…
activities.host.lead: Des communautés, des experts et des passionnés qui font de la Plage un lieu d'apprentissage ouvert.
activities.meetups.title: Meetups
activities.meetups.text: "Des communautés de développeurs (Go SXB Go!, Strasbourg JS…) organisent régulièrement des meetups pour échanger autour des langages de programmation et de leurs évolutions."
activities.meetups.imageAlt: Un meetup de développeurs dans l'espace Flex
activities.advice.title: Permanences conseil
activities.advice.text: "Les 1er et 3e vendredis du mois, bénéficiez de conseils et trouvez réponse à vos questions sur la propriété industrielle et la fiscalité."
activities.advice.imageAlt: Deux personnes en rendez-vous conseil près d'une fenêtre
activities.hack.title: Hack SXB
activities.hack.text: "Le dernier vendredi de chaque mois, le Hack SXB propose une soirée de programmation sur des sujets libres : chacun vient avec son projet ou rejoint un projet commun."
activities.hack.imageAlt: Une soirée Hack SXB à La Plage Digitale
activities.hack.link: hacksxb.com →
activities.bidouillo.title: Bidouillothèque
activities.bidouillo.text: "Un centre de ressources partagées pour apprendre en pratiquant et réaliser des projets numériques et créatifs : casques VR, ordinateurs, tablettes, robots… à louer pour des projets éducatifs."
activities.bidouillo.imageAlt: Des mains assemblent un petit robot électronique
activities.cta.title: Envie de participer ?
activities.cta.lead: Adhérez à l'association pour prendre part à la vie de la Plage, ou contactez-nous pour proposer votre événement.
