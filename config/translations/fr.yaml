# ── about ──
about.meta.title: Qui sommes-nous ? — La Plage Digitale
about.meta.description: "La Plage Digitale, association loi 1908 née d'Alsace Digitale, gère un tiers-lieu de plus de 600 m² au cœur de Strasbourg. Le projet, le bureau, l'équipe."
about.eyebrow: Qui sommes-nous ?
about.title: Un tiers-lieu au cœur de Strasbourg
about.lead: La Plage Digitale vous accueille dans son espace de coworking, au cœur de son tiers-lieu.
about.place.eyebrow: Le lieu
about.place.title: Plus de 600 m² dans les anciens locaux de la Coop
about.place.p1: "Implantée dans les anciens locaux de la Coop, rue Jacques Peirotes, en plein cœur de Strasbourg, la Plage Digitale, c'est plus de 600 m² dédiés aux entrepreneurs, innovateurs et créatifs de la région. Lieu de rencontres et d'échanges de l'écosystème entrepreneurial strasbourgeois, l'espace est propice aux initiatives créatives, individuelles comme collectives."
about.place.p2: "C'est aussi l'un des plus grands espaces de coworking de Strasbourg : 52 bureaux fixes pour les coworkers et 30 places accessibles sans réservation, du lundi au vendredi de 9 h à 17 h. Des salles de réunion entièrement équipées accueillent vos séminaires et réunions d'équipe."
about.place.p3: "Dernier atout, et pas des moindres : notre espace Flex peut recevoir jusqu'à 60 personnes lors des meetups et soirées organisés avec nos partenaires associatifs, institutionnels ou privés — et vous pouvez le louer pour vos événements professionnels."
about.place.imageAlt: "L'openspace de La Plage Digitale : bureaux, suspensions et verrières sous une charpente en béton"
about.project.title: Le projet
about.project.p1: "La Plage Digitale a vocation à accélérer le développement de projets innovants. Elle encourage les échanges entre coworkers tout en réservant un accueil personnalisé à chaque visiteur."
about.project.p2: "Notre espace de coworking est ouvert à tous. C'est la richesse de cette diversité qui favorise un « vivre ensemble » bienveillant et chaleureux : travailler ensemble en partageant des services et des valeurs, dans le respect de chacun."
about.project.motto: Mutualisation et sérendipité sont les maîtres mots qui guident nos choix et nos actions.
about.association.title: L'association
about.association.p1: "La Plage Digitale est une association de droit local (loi 1908), née en 2019 de l'externalisation d'une partie de l'activité de l'association Alsace Digitale."
about.association.p2: "Elle assure la gestion du tiers-lieu et de son espace de coworking. La Plage Digitale, c'est donc à la fois le nom de l'association et celui de ce lieu à double vocation."
about.board.eyebrow: Gouvernance
