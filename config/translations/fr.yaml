tierslieu.hero.eyebrow: "Le tiers-lieu"
tierslieu.hero.title: "Un coworking géré par et pour ses membres"
tierslieu.hero.lead: "La Plage Digitale est une association. Elle fait vivre 600 m² dans le quartier de la Krutenau, en plein centre de Strasbourg, où indépendants, entrepreneurs, créatifs et porteurs de projet travaillent et se croisent tous les jours."
tierslieu.story.eyebrow: "Notre histoire"
tierslieu.story.title: "Une association, depuis 2019"
tierslieu.story.p1: "La Plage Digitale est une association de droit local (loi 1908), née en 2019 quand l'association Alsace Digitale lui a confié une partie de son activité."
tierslieu.story.p2: "Elle s'est installée dans les anciens locaux de la Coop, rue Jacques Peirotes. « La Plage », c'est à la fois l'association et le lieu qu'elle gère, et ses membres sont les Plagistes."
tierslieu.story.imageAlt: "L'openspace de La Plage Digitale : bureaux, suspensions et verrières sous une charpente en béton"
tierslieu.life.eyebrow: "La vie à la Plage"
tierslieu.life.title: "Les rendez-vous de la Plage"
tierslieu.life.lead: "À la Plage, les membres se croisent à la cuisine, se donnent un coup de main sur un projet et se recommandent des clients. Et il y a des rendez-vous fixes :"
tierslieu.life.conseil.title: "Le Conseil de la Plage"
tierslieu.life.conseil.text: "Le premier jeudi du mois à midi, les coworkers se retrouvent : nouvelles du lieu, projets en cours, idées, problèmes à régler, et accueil des nouveaux."
tierslieu.life.mardis.title: "Les Mardis gourmands"
tierslieu.life.mardis.text: "Chaque mardi vers 10 h, un coworker offre un petit-déjeuner à partager."
tierslieu.life.events.title: "Soirées et rencontres"
tierslieu.life.events.text: "Apéro recruteurs, Fail Club, conférences « Regards », Biz'dej solopreneurs : des rendez-vous pour parler d'entreprise entre pairs."
tierslieu.life.advice.title: "Les permanences"
tierslieu.life.advice.text: "L'INPI et la CCI tiennent des permanences à la Plage pour répondre à tes questions d'entrepreneur."
tierslieu.communities.title: "Les communautés accueillies"
tierslieu.communities.text: "La Plage prête gracieusement ses espaces aux communautés et aux associations. On y croise notamment Go SXB Go!, Strasbourg JS, Software Crafters, Pixels & Bretzels ou la Strasbourg Games Community."
tierslieu.host.title: "Organiser un événement à la Plage"
tierslieu.host.text: "La salle Narval accueille jusqu'à 50 personnes assises. Pour une communauté ou une association, le prêt est possible après accord et adhésion ; pour un événement professionnel, la salle se loue."
tierslieu.host.cta: "Proposer un événement"
tierslieu.people.title: "Celles et ceux qui font la Plage"
tierslieu.support.eyebrow: "Ils nous soutiennent"
tierslieu.support.title: "Nos soutiens et nos réseaux"
tierslieu.support.lead: "La Plage Digitale est soutenue par la Région Grand Est et l'Eurométropole de Strasbourg. Elle est membre du réseau Tiers-Lieux Grand Est et labellisée Centre Collaboratif Connecté."
tierslieu.member.eyebrow: "L'adhésion"
tierslieu.member.title: "Devenir membre"
tierslieu.member.p1: "Tu travailles à la Plage ? Tu es déjà membre : l'adhésion est comprise dans ta première facture."
tierslieu.member.p2: "Tu veux soutenir la Plage sans louer d'espace ? Tu peux adhérer pour soutenir le projet et participer à la vie de l'association."
tierslieu.member.cta: "Adhérer en ligne"
tierslieu.contact.title: "Viens rencontrer la communauté"
