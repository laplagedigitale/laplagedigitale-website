legal.build.title: "Conception et réalisation"
legal.build.p1: "Le site est construit avec Sovrium (https://sovrium.com), une plateforme applicative pilotée par configuration. Textes et photographies : La Plage Digitale, sauf mention contraire."
legal.ip.title: "Propriété intellectuelle"
legal.ip.p1: "L’ensemble des éléments du site — textes, photographies, illustrations, logos et identité visuelle — est la propriété de La Plage Digitale ou est utilisé avec l’autorisation de ses titulaires. Ces éléments sont protégés par le Code de la propriété intellectuelle."
legal.ip.p2: "Toute reproduction, représentation, modification ou adaptation de tout ou partie de ces éléments, par quelque procédé que ce soit, sans l’autorisation écrite préalable de La Plage Digitale est interdite et constitue une contrefaçon sanctionnée par les articles L.335-2 et suivants du Code de la propriété intellectuelle. Les noms, logos et marques des entreprises et partenaires cités appartiennent à leurs titulaires respectifs."
legal.liability.title: "Responsabilité"
legal.liability.p1: "La Plage Digitale s’efforce de publier des informations exactes et à jour (formules, tarifs, horaires, services). Ces informations sont données à titre indicatif et peuvent évoluer ; l’association ne saurait être tenue responsable d’une omission, d’une inexactitude ou d’un retard de mise à jour. N’hésitez pas à nous contacter pour toute confirmation."
legal.liability.p2: "Le site est en principe accessible en permanence, mais peut être interrompu, notamment pour des opérations de maintenance. La Plage Digitale ne saurait être tenue responsable des dommages résultant de l’utilisation du site ou de l’impossibilité d’y accéder."
legal.links.title: "Liens hypertextes"
legal.links.p1: "Le site contient des liens vers des sites tiers (HelloAsso, réseaux sociaux, sites de nos coworkers et partenaires). La Plage Digitale n’exerce aucun contrôle sur leur contenu et décline toute responsabilité à leur égard. Les liens pointant vers le présent site sont les bienvenus, dès lors qu’ils ne portent pas atteinte à l’image de l’association."
legal.data.title: "Données personnelles et cookies"
legal.data.p1: "Le site ne dépose aucun cookie publicitaire ni de mesure d’audience. Les informations transmises via le formulaire de contact servent uniquement à répondre à votre demande. Le détail des traitements, des durées de conservation et de vos droits figure dans notre politique de confidentialité."
legal.data.link: "Lire la politique de confidentialité →"
legal.law.title: "Droit applicable"
legal.law.p1: "Les présentes mentions légales sont régies par le droit français. Pour toute question, écrivez-nous à contact@laplagedigitale.fr."

# ── privacy ──
privacy.meta.title: "Politique de confidentialité — La Plage Digitale"
privacy.meta.description: "Comment La Plage Digitale traite vos données : formulaire de contact, mesure d’audience sans cookie, durées de conservation et droits RGPD."
privacy.eyebrow: "Vos données"
privacy.title: "Politique de confidentialité"
privacy.lead: "Nous collectons le strict nécessaire, nous ne revendons rien et nous n’utilisons aucun traceur publicitaire. Voici, en clair, ce que le site laplagedigitale.fr fait de vos données."
privacy.updated: "Dernière mise à jour : octobre 2026"
privacy.controller.title: "Responsable du traitement"
privacy.controller.p1: "Le responsable du traitement est l’association La Plage Digitale, 13 rue Jacques Peirotes, 67000 Strasbourg, représentée par son président, Simon THIERRY."
privacy.controller.p2: "Pour toute question relative à vos données : contact@laplagedigitale.fr."
privacy.contact.title: "Formulaire de contact"
privacy.contact.p1: "Lorsque vous nous écrivez via le formulaire de la page Contact, nous enregistrons votre nom, votre adresse e-mail, votre numéro de téléphone (facultatif), l’objet et le contenu de votre message, ainsi que la date d’envoi, dans la base de données du site."
privacy.contact.p2: "Ces données servent uniquement à répondre à votre demande (visite, bureau, salle, événement, adhésion…) et, le cas échéant, à vous adresser une proposition. Base légale : les mesures précontractuelles prises à votre demande et notre intérêt légitime à répondre aux personnes qui nous sollicitent (article 6.1 b et f du RGPD)."
privacy.contact.p3: "Pour protéger le formulaire contre les envois automatisés, chaque envoi est également journalisé avec l’identification de votre navigateur (user agent) et une empreinte irréversible (hachage salé) de votre adresse IP ; l’adresse IP elle-même n’est jamais conservée."
privacy.analytics.title: "Mesure d’audience sans cookie"
privacy.analytics.p1: "Pour savoir quelles pages sont consultées, nous utilisons l’outil de statistiques intégré à notre plateforme, qui fonctionne sur notre propre serveur. Il ne dépose aucun cookie, n’utilise aucune technique d’empreinte (fingerprinting) et ne transmet aucune donnée à un tiers : pas de Google Analytics, pas de pixel publicitaire."
privacy.analytics.p2: "Il enregistre les pages vues, la page de provenance, les paramètres de campagne (UTM) et le type d’appareil. Les visites sont regroupées au moyen d’un identifiant pseudonyme calculé sur le serveur à partir de la date, de l’adresse IP et du navigateur, qui change chaque jour ; l’adresse IP n’est pas stockée."
privacy.analytics.p3: "Si votre navigateur envoie le signal « Do Not Track », votre visite n’est pas enregistrée. Les statistiques sont supprimées automatiquement au bout de 365 jours, et les pages Mentions légales et Confidentialité ne sont pas mesurées. Limitée à des statistiques agrégées, cette mesure d’audience ne nécessite pas votre consentement."
privacy.accounts.title: "Comptes de l’équipe éditoriale"
privacy.accounts.p1: "Seuls les membres de l’équipe de La Plage Digitale disposent d’un compte, créé par un administrateur, pour publier les actualités du blog : le site ne propose pas d’inscription au public. Pour ces comptes, nous conservons le nom, l’adresse e-mail, un mot de passe haché de manière irréversible et les informations de session nécessaires à la connexion."
privacy.cookies.title: "Cookies"
privacy.cookies.p1: "Le site ne dépose aucun cookie publicitaire, de profilage ou de mesure d’audience. Seuls des cookies strictement nécessaires peuvent être déposés : le cookie de session des membres de l’équipe connectés à l’espace de rédaction et, si vous changez de langue, un cookie qui mémorise ce choix."
privacy.cookies.p2: "Ces cookies techniques sont exemptés de consentement (article 82 de la loi Informatique et Libertés) : c’est pourquoi le site n’affiche pas de bandeau cookies."
privacy.thirdparty.title: "Contenus de tiers"
privacy.thirdparty.p1: "La page Contact intègre une carte Google Maps. Lorsqu’elle s’affiche, Google reçoit votre adresse IP et peut déposer ses propres cookies, conformément à sa politique de confidentialité (policies.google.com/privacy). L’adresse complète figurant en toutes lettres sur la page, vous pouvez vous passer de la carte."
privacy.thirdparty.p2: "Les liens vers HelloAsso (adhésion) et vers nos réseaux sociaux mènent à des services tiers soumis à leurs propres politiques de confidentialité. Nous ne leur transmettons aucune donnée."
privacy.recipients.title: "Destinataires et hébergement"
privacy.recipients.p1: "Vos données ne sont accessibles qu’aux membres habilités de l’équipe de La Plage Digitale. Elles ne sont ni vendues, ni louées, ni cédées à des fins commerciales."
privacy.recipients.p2: "Le site et sa base de données sont hébergés par notre sous-traitant technique Scalingo SAS (Strasbourg), au sein de l’Union européenne. Aucune donnée n’est transférée hors de l’Union européenne."
privacy.retention.title: "Durées de conservation"
privacy.retention.p1: "Messages du formulaire de contact : 3 ans à compter de notre dernier échange, puis suppression. · Statistiques de visite : 365 jours, puis suppression automatique. · Comptes de l’équipe : tant que la personne contribue au site, puis suppression."
privacy.security.title: "Sécurité"
privacy.security.p1: "Les échanges avec le site sont chiffrés (HTTPS), les mots de passe sont hachés et l’accès aux données est réservé aux personnes habilitées. Aucune méthode de transmission ou de stockage n’étant infaillible, nous nous engageons à vous informer dans les meilleurs délais si un incident venait à affecter vos données, conformément au RGPD."
privacy.rights.title: "Vos droits"
privacy.rights.p1: "Conformément au RGPD et à la loi Informatique et Libertés, vous disposez d’un droit d’accès, de rectification, d’effacement, de limitation et d’opposition au traitement de vos données, d’un droit à la portabilité, ainsi que du droit de définir des directives relatives au sort de vos données après votre décès."
privacy.rights.p2: "Pour les exercer, écrivez-nous à contact@laplagedigitale.fr ou par courrier à La Plage Digitale, 13 rue Jacques Peirotes, 67000 Strasbourg. Nous vous répondrons dans un délai d’un mois. En cas de doute raisonnable sur votre identité, un justificatif pourra vous être demandé."
privacy.rights.p3: "Si, après nous avoir contactés, vous estimez que vos droits ne sont pas respectés, vous pouvez adresser une réclamation à la CNIL (Commission nationale de l’informatique et des libertés) : www.cnil.fr/fr/plaintes."
privacy.changes.title: "Évolution de cette politique"
privacy.changes.p1: "Nous pouvons mettre à jour cette politique pour tenir compte de l’évolution du site ou de la réglementation. La date de la dernière mise à jour figure en haut de cette page."

