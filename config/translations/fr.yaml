legal.lead: "En application de l’article 6 de la loi n° 2004-575 du 21 juin 2004 pour la confiance dans l’économie numérique (LCEN), voici l’identité des intervenants du site laplagedigitale.fr."
legal.updated: "Dernière mise à jour : octobre 2026"
legal.editor.title: "Éditeur du site"
legal.editor.p1: "Le site laplagedigitale.fr est édité par La Plage Digitale, association de droit local alsacien-mosellan régie par la loi de 1908, qui gère le tiers-lieu et l’espace de coworking du même nom."
legal.editor.p2: "Siège : 13 rue Jacques Peirotes, 67000 Strasbourg, France"
legal.editor.p3: "Téléphone : 09 77 42 59 29 · 06 24 41 32 03 · E-mail : contact@laplagedigitale.fr"
legal.director.title: "Directeur de la publication"
legal.director.p1: "Simon THIERRY, président de l’association La Plage Digitale."
legal.host.title: "Hébergeur"
