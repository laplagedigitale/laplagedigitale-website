tarifs.faq.title: "Avant de te lancer"
tarifs.faq.q1: "Je peux essayer avant de m'engager ?"
tarifs.faq.a1: "Oui : viens travailler une journée en Flex pour 14 € HT, sans réserver, ou écris-nous pour une visite."
tarifs.faq.q2: "L'adhésion est obligatoire ?"
tarifs.faq.a2: "Oui, pour louer un espace : l'association met ses locaux à disposition de ses membres. Elle coûte 5 € par personne ou 20 € par entreprise et par an."
tarifs.faq.q3: "Je peux changer de formule ?"
tarifs.faq.a3: "Oui : écris-nous à contact@laplagedigitale.fr et on regarde ensemble."
tarifs.faq.q4: "Comment je reçois mes factures ?"
tarifs.faq.a4: "Par e-mail, et dans ton Espace Membre, où tu peux aussi mettre en place le prélèvement automatique."
tarifs.faq.q5: "Les salles sont incluses avec le bureau fixe ?"
tarifs.faq.a5: "Crevette, Requin et Baleine, oui, en fair use : pas pour une activité payante, ni à la journée plusieurs fois par mois. Narval est facturée."
tarifs.faq.q6: "Que comprend la domiciliation ?"
tarifs.faq.a6: "L'adresse de ton siège, la réception de ton courrier aux heures d'ouverture, le retrait de tes recommandés, un message à chaque arrivée et une salle pour tes réunions de gouvernance. La réexpédition coûte 10 € HT par mois."
