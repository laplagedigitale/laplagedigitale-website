legal.meta.title: "Impressum — La Plage Digitale"
legal.meta.description: "Impressum der Website von La Plage Digitale: Herausgeber, Verantwortlicher für den Inhalt, Hosting-Anbieter, Urheberrecht und Haftung."
legal.eyebrow: "Rechtliche Hinweise"
legal.title: "Impressum"
legal.lead: "Gemäß Artikel 6 des französischen Gesetzes Nr. 2004-575 vom 21. Juni 2004 über das Vertrauen in die digitale Wirtschaft (LCEN) finden Sie hier die Angaben zu den Verantwortlichen der Website laplagedigitale.fr."
