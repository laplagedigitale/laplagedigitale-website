tarifs.member.eyebrow: "Der Verein"
tarifs.member.title: "Mitglied im Verein"
tarifs.member.p1: "Ob du einen Tag oder das ganze Jahr kommst: Du wirst Mitglied des Vereins. Der Beitrag steht auf deiner ersten Rechnung, du musst nichts weiter tun."
tarifs.member.p2: "5 € pro Person, 20 € pro Unternehmen; die Mitarbeitenden eines Mitgliedsunternehmens sind mit abgedeckt. Sie gilt bis zum 31. Dezember (nach dem 14. Dezember bezahlt: bis Ende des Folgejahres)."
tarifs.member.p3: "Du kannst zum Conseil de la Plage und zu den internen Veranstaltungen kommen und bekommst den monatlichen Newsletter."
cta.support: "Mitglied werden, ohne zu mieten →"
tarifs.faq.eyebrow: "Häufige Fragen"
tarifs.faq.title: "Bevor du loslegst"
tarifs.faq.q1: "Kann ich es vorher ausprobieren?"
tarifs.faq.a1: "Ja: Arbeite einen Flex-Tag für 14 € netto, ohne Reservierung, oder schreib uns für einen Besuch."
tarifs.faq.q2: "Ist die Mitgliedschaft Pflicht?"
tarifs.faq.a2: "Ja, um einen Platz zu mieten: Der Verein stellt seine Räume seinen Mitgliedern zur Verfügung. Sie kostet 5 € pro Person oder 20 € pro Unternehmen und Jahr."
tarifs.faq.q3: "Kann ich den Tarif wechseln?"
tarifs.faq.a3: "Ja: Schreib an contact@laplagedigitale.fr, wir schauen es uns gemeinsam an."
tarifs.faq.q4: "Wie bekomme ich meine Rechnungen?"
tarifs.faq.a4: "Per E-Mail und in deinem Mitgliederbereich, wo du auch das Lastschriftverfahren einrichten kannst."
tarifs.faq.q5: "Sind die Räume beim festen Platz inklusive?"
tarifs.faq.a5: "Crevette, Requin und Baleine ja, nach Fair Use: nicht für bezahlte Veranstaltungen und nicht mehrmals im Monat ganztägig. Narval wird berechnet."
tarifs.faq.q6: "Was umfasst die Geschäftsadresse?"
tarifs.faq.a6: "Die Adresse deines Firmensitzes, die Annahme deiner Post zu den Öffnungszeiten, die Abholung deiner Einschreiben, eine Nachricht bei jedem Eingang und ein Raum für deine Gremiensitzungen. Die Weiterleitung kostet 10 € netto im Monat."
tarifs.contact.title: "Eine Frage zu den Tarifen? Komm vorbei und sprich mit uns"
tarifs.meta.title: "Coworking-Preise in Straßburg | La Plage Digitale"
tarifs.meta.description: "Tag 14 €, Nomade 175 €/Monat, fester Platz 275 €/Monat, Räume ab 87 € für 4 Std., Geschäftsadresse 40 €/Monat, alles netto, mitten in Straßburg."
tierslieu.hero.eyebrow: "Der Dritte Ort"
tierslieu.hero.title: "Ein Coworking von und für seine Mitglieder"
tierslieu.hero.lead: "La Plage Digitale ist ein Verein. Er betreibt 600 m² im Viertel Krutenau, mitten in Straßburg, wo Selbstständige, Gründerinnen, Kreative und Projektleute jeden Tag arbeiten und sich begegnen."
tierslieu.story.eyebrow: "Unsere Geschichte"
tierslieu.story.title: "Ein Verein, seit 2019"
tierslieu.story.p1: "La Plage Digitale ist ein Verein nach elsässisch-lothringischem Ortsrecht (Gesetz von 1908), gegründet 2019, als der Verein Alsace Digitale ihm einen Teil seiner Tätigkeit übertrug."
tierslieu.story.p2: "Er zog in die ehemaligen Räume der Coop in der rue Jacques Peirotes. « La Plage » ist zugleich der Verein und der Ort, den er betreibt; seine Mitglieder heißen Plagistes."
tierslieu.story.imageAlt: "Der Open Space von La Plage Digitale: Schreibtische, Hängeleuchten und Glaswände unter einer Betondecke"
tierslieu.life.eyebrow: "Leben auf der Plage"
tierslieu.life.title: "Feste Termine"
tierslieu.life.lead: "Auf der Plage trifft man sich in der Küche, hilft sich bei Projekten und empfiehlt sich gegenseitig Kundschaft. Und es gibt feste Termine:"
tierslieu.life.conseil.title: "Der Conseil de la Plage"
tierslieu.life.conseil.text: "Am ersten Donnerstag im Monat um 12 Uhr treffen sich die Coworker: Neuigkeiten, laufende Projekte, Ideen, offene Probleme und die Begrüßung der Neuen."
tierslieu.life.mardis.title: "Die Mardis gourmands"
tierslieu.life.mardis.text: "Jeden Dienstag gegen 10 Uhr bringt jemand ein Frühstück für alle mit."
tierslieu.life.events.title: "Abende und Treffen"
tierslieu.life.events.text: "Apéro recruteurs, Fail Club, die Vortragsreihe « Regards », Biz'dej solopreneurs: Treffen, um sich unter Gleichgesinnten über Unternehmerisches auszutauschen."
tierslieu.life.advice.title: "Sprechstunden"
tierslieu.life.advice.text: "INPI (Patentamt) und CCI (Handelskammer) bieten auf der Plage Sprechstunden für deine Unternehmensfragen an."
tierslieu.communities.title: "Die Communities bei uns"
tierslieu.communities.text: "Die Plage stellt Communities und Vereinen ihre Räume kostenlos zur Verfügung. Hier treffen sich unter anderem Go SXB Go!, Strasbourg JS, Software Crafters, Pixels & Bretzels und die Strasbourg Games Community."
tierslieu.host.title: "Eine Veranstaltung auf der Plage"
tierslieu.host.text: "Der Raum Narval bietet bis zu 50 Sitzplätze. Communities und Vereinen leihen wir ihn nach Absprache und mit Mitgliedschaft; für berufliche Veranstaltungen wird er vermietet."
tierslieu.host.cta: "Veranstaltung vorschlagen"
tierslieu.people.title: "Die Menschen der Plage"
tierslieu.support.eyebrow: "Unsere Unterstützer"
tierslieu.support.title: "Förderer und Netzwerke"
tierslieu.support.lead: "La Plage Digitale wird von der Region Grand Est und der Eurométropole de Strasbourg unterstützt. Sie gehört zum Netzwerk Tiers-Lieux Grand Est und trägt das Label Centre Collaboratif Connecté."
tierslieu.member.eyebrow: "Mitgliedschaft"
tierslieu.member.title: "Mitglied werden"
tierslieu.member.p1: "Du arbeitest auf der Plage? Dann bist du schon Mitglied: Der Beitrag steht auf deiner ersten Rechnung."
tierslieu.member.p2: "Du willst die Plage unterstützen, ohne einen Platz zu mieten? Du kannst Mitglied werden, das Projekt unterstützen und am Vereinsleben teilnehmen."
tierslieu.member.cta: "Online Mitglied werden"
tierslieu.contact.title: "Lerne die Community kennen"
