member.guide.title: "Praktischer Leitfaden"
member.guide.intro: "Das Strand-Kit: alles, was Sie für den Alltag bei La Plage wissen müssen."
member.guide.about.title: "Was ist La Plage Digitale?"
member.guide.about.1: "Ein Verein nach Lokalrecht (Gesetz von 1908), 2019 gegründet, der einen Dritten Ort und Coworking-Space in den ehemaligen Räumen der Coop im Zentrum Straßburgs betreibt: über 600 m²."
member.guide.about.2: "Ein Dritter Ort zum Begegnen und gemeinsamen Gestalten, und ein Coworking für Selbstständige, Vereine und Unternehmen."
member.guide.about.3: "Adresse: 13 rue Jacques Peirotes, 67000 Straßburg. Schiebetür vorne, Glastür hinten zur rue de Genève."
member.guide.access.title: "Öffnungszeiten und Zugang"
member.guide.access.1: "Der Empfang ist Montag bis Freitag von 9 bis 17:30 Uhr besetzt. Flex-Mitglieder kommen zwischen 9 und 17 Uhr."
member.guide.access.2: "Fester Arbeitsplatz, Nomade und Box haben mit Schlüsseln oder Badges, gegen Kaution ausgegeben, rund um die Uhr Zugang. Nicht verleihen oder nachmachen."
member.guide.access.3: "Wer zuerst kommt, öffnet den hinteren Rollladen: Er versperrt einen Notausgang. Wer zuletzt geht, schaltet das Licht aus, stellt die Vordertür auf geschlossen, verriegelt die Hintertür und lässt den Rollladen herunter."
member.guide.access.4: "Personen, die der Verein nicht kennt, werden während ihres Besuchs begleitet. Neu in Ihrem Team (Mitarbeitende, Praktikant:in)? Sagen Sie uns Bescheid."
member.guide.net.title: "Internet und WLAN"
member.guide.net.1: "Glasfaser per Kabel an den Arbeitsplätzen und WLAN in allen Räumen. Netzwerkname und Passwort hängen in den Räumen aus, oder fragen Sie am Empfang."
member.guide.net.2: "Kein Router oder Repeater ohne Zustimmung des Vereins, keine illegalen Downloads. Sehr viel Datenvolumen? Eine eigene Leitung ist möglich."
member.guide.print.title: "Drucken und Scannen"
member.guide.print.1: "Drucker und Scanner sind für alltägliche Geschäftsdokumente. Private, werbliche (Flyer, Plakate) oder große Druckaufträge fallen nicht unter faire Nutzung."
member.guide.print.2: "Zum Scannen auf den Computer: den Treiber Brother MFC-L8690CDW installieren, dann „Scannen“ und den Drucker von La Plage wählen."
member.guide.print.cta: "Brother-Treiber herunterladen ↗"
member.guide.kitchen.title: "Küche und Kühlschränke"
member.guide.kitchen.1: "Öfen, Mikrowellen und Kochplatten sind für alle da. Reinigen Sie Ihren Platz und Ihr Geschirr und räumen Sie die saubere Spülmaschine aus."
member.guide.kitchen.2: "Gemeinschaftskühlschrank: orangefarbenes Etikett 🟠 mit Datum, der Inhalt ist für alle. Persönlicher Kühlschrank: blaues Etikett 🔵 mit Ihrem Namen."
member.guide.kitchen.3: "Alles ohne Etikett oder Abgelaufene wird beim Putzen entsorgt. Papier kommt neben die Drucker, Verpackungen in die gelbe Tonne."
member.guide.together.title: "Zusammenleben"
member.guide.together.1: "Telefone stumm, leise Stimmen in gemeinsamen Räumen, Anrufe und Videokonferenzen außerhalb des Großraums, stark riechendes Essen in der Küche."
member.guide.together.2: "Die Pflanzen pflegen die Jardins de Gally: Bitte nicht gießen und nichts hineinschütten. Eigene Pflanzen pflegen Sie selbst."
member.guide.together.3: "Weder Rauchen noch Dampfen. Alkohol nur bei vom Vorstand genehmigten Veranstaltungen. Keine Tiere außer Assistenz- und emotionalen Unterstützungstieren."
member.guide.together.4: "Die Temperatur in den Büroräumen regelt das Team. Krank und ansteckend? Bleiben Sie zu Hause oder tragen Sie eine Maske."
member.guide.furniture.title: "Möbel"
member.guide.furniture.1: "Steh-Sitz-Tisch klemmt? Ganz nach unten fahren: Ein doppeltes Klicken bedeutet, dass die Beine zurückgesetzt sind."
member.guide.furniture.2: "Immer noch defekt oder ein anderes Kinnarps-Möbel beschädigt? Fotografieren Sie das Typenschild (unter der Platte oder dem Sitz) und das Problem und senden Sie beides an sav@kinnarps.com."
member.guide.furniture.3: "Eigene Möbel? Nur mit Zustimmung des Teams. Nicht auf Möbel steigen."
member.guide.parking.title: "Parkplatz „Bermuda-Dreieck“"
member.guide.parking.1: "Zwei Plätze zur rue de Genève, für Coworker mit Vereinsmitgliedschaft und Lieferanten von La Plage. Nicht für Gäste. Einer ist für Kinnarps reserviert, muss aber trotzdem gebucht werden."
member.guide.parking.2: "Buchen Sie im Google-Kalender „Le Triangle des Bermudes“ (Zugang wie bei den Räumen anfragen). Jeder Platz hat zwei Kalender: In beiden eintragen."
member.guide.parking.3: "Holen Sie den Schranken-Badge am Empfang und bringen Sie ihn danach zurück (niemand da? in den Stiftebecher auf dem Tisch). Ein verlorener Badge wird berechnet. Faire Nutzung: kein tägliches oder langes Parken."
member.guide.mail.title: "Schließfächer und Post"
member.guide.mail.1: "Feste Arbeitsplätze haben ein persönliches abschließbares Schließfach. Für andere Tarife ist ein Schließfach auf Anfrage mit Vereinbarung möglich."
member.guide.mail.2: "Post und Pakete werden am Empfang angenommen. Der Briefkasten wird montags, mittwochs und freitags geleert."
member.guide.safety.title: "Sicherheit"
member.guide.safety.1: "La Plage ist eine öffentlich zugängliche Einrichtung: höchstens 200 Personen. Notausgänge immer frei und von innen zu öffnen halten."
member.guide.safety.2: "Sammelpunkt bei Evakuierung: hinter dem Gebäude, zur rue de Genève."
member.guide.safety.3: "Sie haften für Geräte, die Sie vor Ort lassen: Eine Diebstahlversicherung wird empfohlen. Eine Organisation mit Vertrag braucht eine Berufshaftpflicht."
member.guide.contact.title: "Eine Frage, ein Problem?"
member.guide.contact.1: "Der Empfang, oder contact@laplagedigitale.fr für alles andere."
member.guide.contact.2: "Flex: contact+flex@laplagedigitale.fr. Kommunikation, Veranstaltungen und Partnerschaften: lucie.dubief@laplagedigitale.fr."
member.guide.contact.3: "Eine Idee für den Ort, ein wiederkehrendes Problem? Bringen Sie es in den Conseil de la Plage ein."
member.community.title: "Gemeinschaft"
member.community.intro: "La Plage sind vor allem die Menschen, die dort arbeiten. So machen Sie mit."
member.community.slack.title: "Der Slack von La Plage"
member.community.slack.text: "Praktisches, Ankündigungen, gegenseitige Hilfe und Afterworks: Alles läuft über Slack, vor allem #général."
member.community.slack.join: "Dem Slack beitreten ↗"
member.community.slack.open: "Schon dabei? laplagedigitale.slack.com öffnen ↗"
member.community.conseil.title: "Der Conseil de la Plage"
member.community.conseil.text: "Am ersten Donnerstag im Monat um 12 Uhr treffen sich die Coworker zu Neuigkeiten, laufenden Projekten, Ideen und Problemen. Verhindert? Schicken Sie Ihr Thema vorab."
member.community.conseil.cta: "Ein Thema vorschlagen ↗"
member.community.rituals.title: "Feste Termine"
member.community.rituals.1: "Mardis Gourmands: Jeden Dienstag gegen 10 Uhr bringt jemand ein Frühstück zum Teilen mit. Lust, eins auszurichten? Sagen Sie es dem Team."
member.community.rituals.2: "Kicker: Treffpunkt gegen 13:30 und 16 Uhr im Raum am Eingang."
member.community.rituals.3: "Afterworks: regelmäßig in Bars in der Nähe und manchmal bei La Plage zu besonderen Anlässen."
member.community.rituals.4: "Solidarität: Blutspendegruppen zwischen 12 und 14 Uhr, internationale Aktionstage."
member.community.events.title: "Veranstaltungen"
member.community.events.text: "La Plage beherbergt Meetups, Vorträge und Afterworks und stellt Communities und Vereinen ihre Räume kostenlos zur Verfügung. Planen Sie etwas?"
member.community.events.cta: "Veranstaltungen und Anfrage ↗"
member.community.asso.title: "Der Verein"
member.community.asso.text: "La Plage Digitale ist ein Verein: Als Mitglied entscheiden Sie mit, und Flex-Mitglieder erhalten jedes Jahr einen freien Tag. Freiwillige für den Empfangsdienst sind willkommen."
member.community.asso.cta: "Beitreten oder helfen: schreiben Sie uns"
member.community.asso.href: "mailto:contact@laplagedigitale.fr?subject=Mitgliedschaft"
member.community.social.title: "Folgen Sie uns"
member.docs.title: "Regeln & Dokumente"
member.docs.intro: "Die Texte, die für alle Nutzenden von La Plage gelten, und das Wichtigste daraus."
member.docs.summary.title: "Das Wichtigste"
member.docs.summary.1: "Safe Space: keine schockierenden, gewalttätigen, sexuellen oder diskriminierenden Äußerungen oder Verhaltensweisen, gemäß der Wertecharta."
member.docs.summary.2: "Faire Nutzung: Internet, Strom, Drucker, Besprechungsräume, Tee und Kaffee sind frei, solange niemand beeinträchtigt wird. Darüber hinaus können sie berechnet werden."
member.docs.summary.3: "Alle pflegen die gemeinsamen Räume und melden Probleme am Empfang."
member.docs.summary.4: "Vertraulichkeit: Nicht auf fremde Bildschirme und Unterlagen schauen und nichts davon weitergeben."
member.docs.summary.5: "Der Vorstand kann Personen, die diese Regeln nicht einhalten, den Zugang entziehen."
member.docs.files.title: "Die vollständigen Texte"
