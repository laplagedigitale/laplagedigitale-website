legal.build.p1: "Die Website wurde mit Sovrium (https://sovrium.com) erstellt, einer konfigurationsgesteuerten Anwendungsplattform. Texte und Fotos: La Plage Digitale, sofern nicht anders angegeben."
legal.ip.title: "Urheberrecht"
legal.ip.p1: "Sämtliche Inhalte dieser Website – Texte, Fotos, Illustrationen, Logos und visuelle Identität – sind Eigentum von La Plage Digitale oder werden mit Genehmigung der Rechteinhaber verwendet. Sie sind durch das französische Gesetzbuch über geistiges Eigentum geschützt."
legal.ip.p2: "Jede Vervielfältigung, Wiedergabe, Änderung oder Bearbeitung dieser Inhalte, ganz oder teilweise und gleich in welcher Form, ist ohne vorherige schriftliche Zustimmung von La Plage Digitale untersagt und stellt eine Verletzung im Sinne der Artikel L.335-2 ff. des französischen Gesetzbuchs über geistiges Eigentum dar. Namen, Logos und Marken der genannten Unternehmen und Partner gehören ihren jeweiligen Inhabern."
legal.liability.title: "Haftung"
legal.liability.p1: "La Plage Digitale ist bemüht, zutreffende und aktuelle Informationen zu veröffentlichen (Angebote, Preise, Öffnungszeiten, Leistungen). Diese Angaben sind unverbindlich und können sich ändern; der Verein übernimmt keine Haftung für Auslassungen, Ungenauigkeiten oder verspätete Aktualisierungen. Bitte kontaktieren Sie uns, wenn Sie eine Bestätigung wünschen."
legal.liability.p2: "Die Website ist grundsätzlich jederzeit erreichbar, kann jedoch – insbesondere wegen Wartungsarbeiten – vorübergehend nicht verfügbar sein. La Plage Digitale haftet nicht für Schäden, die aus der Nutzung der Website oder ihrer Nichterreichbarkeit entstehen."
legal.links.title: "Links"
legal.links.p1: "Diese Website enthält Links zu Websites Dritter (HelloAsso, soziale Netzwerke, Websites unserer Coworker und Partner). La Plage Digitale hat keinen Einfluss auf deren Inhalte und übernimmt dafür keine Verantwortung. Links auf diese Website sind willkommen, sofern sie dem Ansehen des Vereins nicht schaden."
legal.data.title: "Personenbezogene Daten und Cookies"
legal.data.p1: "Diese Website setzt keine Werbe- oder Analyse-Cookies. Die über das Kontaktformular übermittelten Angaben werden ausschließlich zur Beantwortung Ihrer Anfrage verwendet. Einzelheiten zur Verarbeitung, zu Speicherfristen und zu Ihren Rechten finden Sie in unserer Datenschutzerklärung."
legal.data.link: "Zur Datenschutzerklärung →"
legal.law.title: "Anwendbares Recht"
legal.law.p1: "Dieses Impressum unterliegt französischem Recht. Bei Fragen schreiben Sie uns gerne an contact@laplagedigitale.fr."

