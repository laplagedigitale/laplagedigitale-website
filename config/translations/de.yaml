# ── coworkers ──
coworkers.meta.title: Unsere Coworker — La Plage Digitale
coworkers.meta.description: "Designer, Entwickler, Gründerinnen: Lernen Sie die Menschen kennen, die täglich bei La Plage Digitale arbeiten, dem gemeinnützigen Coworking in Straßburg."
coworkers.eyebrow: Unsere Coworker
coworkers.title: Die Menschen, die die Plage ausmachen
coworkers.lead: "Angestellte im Homeoffice, Selbstständige, Gründerinnen und Gründer: Sie haben sich für La Plage Digitale entschieden – und erzählen, warum."
coworkers.list.title: Porträts unserer Coworker
coworkers.caroline.alt: Porträt von Caroline Bosc
coworkers.caroline.p1: "Nach einem Master in internationalem Handel hat Caroline ihr Wissen mit einem Master im Webbereich in Straßburg ergänzt."
coworkers.caroline.p2: "Heute ist sie UX-Designerin bei Impact Positif und arbeitet seit März 2022 bei La Plage Digitale."
coworkers.frederic.alt: Porträt von Frédéric Fuchs
coworkers.frederic.p1: "Frédéric leitet das Sales Operations bei OpenClassrooms, einem Unternehmen, das Bildung für alle zugänglich machen will."
coworkers.frederic.p2: "Nach drei Jahren im Homeoffice ist er zu uns gekommen, um Privat- und Berufsleben zu trennen und neue Menschen kennenzulernen."
coworkers.roland.alt: Porträt von Roland Margelidon
coworkers.roland.p1: "Der Informatikingenieur Roland hat sein eigenes Unternehmen, Rolrom, gegründet und entwickelt eine Unternehmenssoftware für Architekturbüros."
coworkers.roland.p2: "Er hat sich für La Plage Digitale entschieden, weil es ein gemeinnütziger, vereinsgetragener Coworking-Space ist."
coworkers.bastien.company: Freelancer
coworkers.bastien.alt: Porträt von Bastien Remy
coworkers.bastien.p1: "Als selbstständiger Webentwickler baut Bastien maßgeschneiderte Anwendungen für Unternehmen, die webbasierte Tools benötigen."
coworkers.bastien.p2: "Er arbeitet seit fünf Jahren bei La Plage Digitale und fühlt sich hier sehr wohl. Für ihn steht die Plage für Ruhe, Freiheit und Flexibilität!"
coworkers.sylvaine.alt: Porträt von Sylvaine Gross
coworkers.sylvaine.p1: "Ein echtes elsässisches Schweizer Taschenmesser: Nach über 20 Jahren als Sekretärin, Vertriebsassistentin und Assistentin der Geschäftsführung hat Sylvaine sich mit Mu.se, ihrem Büroservice, selbstständig gemacht. Sie war Schatzmeisterin von La Plage Digitale, wo Mu.se seit 2019 Mitglied ist."
coworkers.sylvaine.p2: "Außerdem ist sie die inoffizielle Lieferantin für Heftklammern, Büroklammern, Tipp-Ex und Schmierpapier."
coworkers.eleonore.alt: Porträt von Eléonore Greif
coworkers.eleonore.p1: "In einem früheren Leben Dokumentarfilmerin, ist Eléonore vor Kurzem als Verwaltungsassistentin zum fröhlichen Team von Mu.se gestoßen – und zum noch fröhlicheren Team von La Plage Digitale!"
coworkers.eleonore.p2: "Eine Gelegenheit, außerhalb der eigenen vier Wände zu arbeiten, umgeben von Menschen, die sich im Vereinsleben engagieren."
coworkers.cta.title: Wird Ihr Porträt das nächste sein?
coworkers.cta.text: Werden Sie Teil der Community von La Plage Digitale – für einen Tag oder für lange Zeit.
