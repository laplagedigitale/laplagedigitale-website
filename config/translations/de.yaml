legal.editor.title: "Herausgeber"
legal.editor.p1: "Die Website laplagedigitale.fr wird herausgegeben von La Plage Digitale, einem gemeinnützigen Verein nach elsass-lothringischem Ortsrecht (Vereinsrecht von 1908), der den gleichnamigen Dritten Ort und Coworking-Space betreibt."
