# ── privacy ──
privacy.meta.title: "Datenschutzerklärung — La Plage Digitale"
privacy.meta.description: "Wie La Plage Digitale Ihre Daten verarbeitet: Kontaktformular, cookiefreie Reichweitenmessung, Speicherfristen und Ihre Rechte nach der DSGVO."
privacy.eyebrow: "Ihre Daten"
privacy.title: "Datenschutzerklärung"
privacy.lead: "Wir erheben nur das Nötigste, verkaufen nichts und setzen keine Werbe-Tracker ein. Hier erfahren Sie in klaren Worten, was laplagedigitale.fr mit Ihren Daten macht."
privacy.updated: "Zuletzt aktualisiert: Oktober 2026"
privacy.controller.title: "Verantwortlicher"
privacy.controller.p1: "Verantwortlich für die Datenverarbeitung ist der Verein La Plage Digitale, 13 rue Jacques Peirotes, 67000 Straßburg, Frankreich, vertreten durch seinen Präsidenten Simon THIERRY."
privacy.controller.p2: "Bei Fragen zu Ihren Daten: contact@laplagedigitale.fr."
privacy.contact.title: "Kontaktformular"
privacy.contact.p1: "Wenn Sie uns über das Formular auf der Kontaktseite schreiben, speichern wir Ihren Namen, Ihre E-Mail-Adresse, Ihre Telefonnummer (optional), Betreff und Inhalt Ihrer Nachricht sowie das Sendedatum in der Datenbank der Website."
privacy.contact.p2: "Diese Daten dienen ausschließlich der Beantwortung Ihrer Anfrage (Besichtigung, Arbeitsplatz, Raum, Veranstaltung, Mitgliedschaft …) und gegebenenfalls der Zusendung eines Angebots. Rechtsgrundlage: vorvertragliche Maßnahmen auf Ihre Anfrage sowie unser berechtigtes Interesse, Anfragen zu beantworten (Art. 6 Abs. 1 lit. b und f DSGVO)."
privacy.contact.p3: "Zum Schutz vor automatisierten Einsendungen wird jede Übermittlung zusätzlich mit der Kennung Ihres Browsers (User-Agent) und einem nicht umkehrbaren Fingerabdruck (gesalzener Hash) Ihrer IP-Adresse protokolliert; die IP-Adresse selbst wird nie gespeichert."
privacy.analytics.title: "Cookiefreie Reichweitenmessung"
privacy.analytics.p1: "Um zu erfahren, welche Seiten gelesen werden, nutzen wir das in unsere Plattform integrierte Statistik-Tool, das auf unserem eigenen Server läuft. Es setzt keine Cookies, verwendet kein Fingerprinting und übermittelt keine Daten an Dritte: kein Google Analytics, keine Werbepixel."
privacy.analytics.p2: "Erfasst werden aufgerufene Seiten, die verweisende Seite, Kampagnenparameter (UTM) und der Gerätetyp. Besuche werden über eine pseudonyme Kennung zusammengefasst, die serverseitig aus Datum, IP-Adresse und Browser berechnet wird und sich täglich ändert; die IP-Adresse wird nicht gespeichert."
privacy.analytics.p3: "Sendet Ihr Browser das Signal „Do Not Track“, wird Ihr Besuch nicht erfasst. Die Statistiken werden nach 365 Tagen automatisch gelöscht, und die Seiten Impressum und Datenschutz werden nicht gemessen. Da sie auf zusammengefasste Statistiken beschränkt ist, erfordert diese Reichweitenmessung keine Einwilligung."
privacy.accounts.title: "Konten des Redaktionsteams"
privacy.accounts.p1: "Nur Mitglieder des Teams von La Plage Digitale verfügen über ein Konto, das ein Administrator anlegt, um Blog-Neuigkeiten zu veröffentlichen; eine öffentliche Registrierung gibt es nicht. Für diese Konten speichern wir Name, E-Mail-Adresse, ein nicht umkehrbar gehashtes Passwort sowie die für die Anmeldung nötigen Sitzungsdaten."
privacy.cookies.title: "Cookies"
privacy.cookies.p1: "Diese Website setzt keine Werbe-, Profiling- oder Analyse-Cookies. Es können ausschließlich technisch notwendige Cookies gesetzt werden: das Sitzungs-Cookie für Teammitglieder, die im Redaktionsbereich angemeldet sind, und – wenn Sie die Sprache wechseln – ein Cookie, das Ihre Wahl speichert."
privacy.cookies.p2: "Diese technischen Cookies sind nach französischem Datenschutzrecht (Art. 82 des Loi Informatique et Libertés) einwilligungsfrei; deshalb zeigt die Website kein Cookie-Banner an."
privacy.thirdparty.title: "Inhalte Dritter"
privacy.thirdparty.p1: "Die Kontaktseite bindet eine Google-Maps-Karte ein. Beim Laden erhält Google Ihre IP-Adresse und kann eigene Cookies setzen; es gilt die Datenschutzerklärung von Google (policies.google.com/privacy). Da unsere vollständige Adresse auf der Seite ausgeschrieben ist, können Sie auf die Karte verzichten."
privacy.thirdparty.p2: "Links zu HelloAsso (Mitgliedschaft) und zu unseren sozialen Netzwerken führen zu Diensten Dritter mit eigenen Datenschutzbestimmungen. Wir geben keine Daten an sie weiter."
privacy.recipients.title: "Empfänger und Hosting"
privacy.recipients.p1: "Ihre Daten sind nur befugten Mitgliedern des Teams von La Plage Digitale zugänglich. Sie werden weder verkauft noch vermietet noch zu kommerziellen Zwecken weitergegeben."
privacy.recipients.p2: "Die Website und ihre Datenbank werden von unserem technischen Auftragsverarbeiter Scalingo SAS (Straßburg) innerhalb der Europäischen Union gehostet. Es findet keine Übermittlung von Daten außerhalb der Europäischen Union statt."
privacy.retention.title: "Speicherdauer"
privacy.retention.p1: "Nachrichten aus dem Kontaktformular: 3 Jahre ab unserem letzten Austausch, danach Löschung. · Besuchsstatistiken: 365 Tage, danach automatische Löschung. · Konten des Teams: solange die Person an der Website mitwirkt, danach Löschung."
privacy.security.title: "Sicherheit"
privacy.security.p1: "Die Verbindung zur Website ist verschlüsselt (HTTPS), Passwörter werden gehasht und der Zugriff auf Daten ist auf befugte Personen beschränkt. Da keine Übertragungs- oder Speichermethode völlig sicher ist, verpflichten wir uns, Sie gemäß DSGVO unverzüglich zu informieren, sollte ein Vorfall Ihre Daten betreffen."
privacy.rights.title: "Ihre Rechte"
privacy.rights.p1: "Nach der DSGVO und dem französischen Datenschutzgesetz haben Sie das Recht auf Auskunft, Berichtigung und Löschung Ihrer Daten, auf Einschränkung der Verarbeitung und Widerspruch gegen sie, auf Datenübertragbarkeit sowie das Recht, Verfügungen über den Umgang mit Ihren Daten nach Ihrem Tod zu treffen."
privacy.rights.p2: "Um diese Rechte auszuüben, schreiben Sie uns an contact@laplagedigitale.fr oder per Post an La Plage Digitale, 13 rue Jacques Peirotes, 67000 Straßburg, Frankreich. Wir antworten Ihnen innerhalb eines Monats. Bei begründeten Zweifeln an Ihrer Identität können wir einen Nachweis anfordern."
privacy.rights.p3: "Sind Sie nach Ihrer Kontaktaufnahme der Ansicht, dass Ihre Rechte nicht gewahrt werden, können Sie Beschwerde bei der CNIL, der französischen Datenschutzbehörde, einlegen: www.cnil.fr/fr/plaintes."
privacy.changes.title: "Änderungen dieser Erklärung"
privacy.changes.p1: "Wir können diese Datenschutzerklärung anpassen, um Änderungen der Website oder der Rechtslage zu berücksichtigen. Das Datum der letzten Aktualisierung finden Sie oben auf dieser Seite."

