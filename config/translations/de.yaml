# ── about ──
about.meta.title: Über uns — La Plage Digitale
about.meta.description: "La Plage Digitale, ein aus Alsace Digitale hervorgegangener Verein, betreibt einen Dritten Ort mit über 600 m² mitten in Straßburg. Projekt, Vorstand, Team."
about.eyebrow: Über uns
about.title: Ein Dritter Ort mitten in Straßburg
about.lead: La Plage Digitale empfängt Sie in ihrem Coworking-Space, dem Herzstück ihres Dritten Ortes.
about.place.eyebrow: Der Ort
about.place.title: Über 600 m² in den ehemaligen Räumen der Coop
about.place.p1: "In den ehemaligen Räumen der Coop in der Rue Jacques Peirotes, mitten in Straßburg, bietet La Plage Digitale über 600 m² für Gründer, Innovatorinnen und Kreative der Region. Als Treffpunkt der Straßburger Gründerszene fördert der Ort kreative Initiativen – einzeln wie gemeinsam."
about.place.p2: "Zugleich ist er einer der größten Coworking-Spaces Straßburgs: 52 Festplätze für Coworker und 30 Plätze ohne Reservierung, montags bis freitags von 9 bis 17 Uhr. Voll ausgestattete Besprechungsräume bieten Platz für Seminare und Teammeetings."
about.place.p3: "Nicht zuletzt fasst unser Flex-Bereich bis zu 60 Personen für Meetups und Abendveranstaltungen mit unseren Partnern aus Vereinen, Institutionen und Wirtschaft – und Sie können ihn für Ihre eigenen beruflichen Veranstaltungen mieten."
about.place.imageAlt: "Der Open Space von La Plage Digitale: Schreibtische, Hängeleuchten und Glaswände unter einer Betondecke"
about.project.title: Das Projekt
about.project.p1: "La Plage Digitale will die Entwicklung innovativer Projekte beschleunigen. Sie fördert den Austausch zwischen den Coworkern und empfängt jeden Besucher persönlich."
about.project.p2: "Unser Coworking-Space steht allen offen. Gerade diese Vielfalt schafft ein herzliches, wohlwollendes Miteinander: gemeinsam arbeiten, Leistungen und Werte teilen, mit Respekt füreinander."
about.project.motto: Teilen und Serendipität sind die Leitgedanken unserer Entscheidungen und unseres Handelns.
about.association.title: Der Verein
about.association.p1: "La Plage Digitale ist ein Verein nach elsässisch-lothringischem Ortsrecht (loi 1908), 2019 entstanden aus der Ausgliederung eines Teils der Aktivitäten des Vereins Alsace Digitale."
about.association.p2: "Er betreibt den Dritten Ort und seinen Coworking-Space. La Plage Digitale ist damit zugleich der Name des Vereins und des Ortes mit doppelter Bestimmung."
