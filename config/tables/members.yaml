# Table: members — one row per coworker account, linking it to a Pennylane
# customer. The row is created (by email) when the coworker account is created;
# the Pennylane customer is then found by that email.
#
# Only automations and admins write here. A coworker reads exactly their own
# row — matched on the login email, so no user id has to be copied by hand.
# An admin fixes a wrong or missing match by setting pennylane_customer_id and
# match_status: manual, which the matcher then leaves alone.
# association_member is also the admin's to tick (the free Flex day).
# formules is what the member rents — the Espace Membre shows each member the
# pages and sections of their formules. pennylane-sync derives it from their
# active Pennylane subscriptions (and Flex check-ins); an admin who corrects it
# sets formule_source: manual, which the sync then leaves alone.
id: 3
name: members
# Read-only over MCP: Claude lists and reads, never writes. Row-level and
# field rules still apply, as the owner of the API key.
aiAccess:
  description: "Coworker accounts and their match to a Pennylane customer. Use this to find a coworker or check why their invoices are missing."
  operations: [read, list]
fields:
  - { id: 1, name: email, type: email, required: true, unique: true }
  - { id: 2, name: name, type: single-line-text }
  - { id: 3, name: pennylane_customer_id, type: single-line-text, indexed: true }
  - id: 4
    name: match_status
    type: single-select
    default: pending
    options:
      - { value: pending, label: $t:portal.match.pending, color: '#94a3b8' }
      - { value: matched, label: $t:portal.match.matched, color: '#10b981' }
      - { value: not_found, label: $t:portal.match.not_found, color: '#f59e0b' }
      - { value: manual, label: $t:portal.match.manual, color: '#10b981' }
  # Member of the La Plage Digitale association this year — set by an admin.
  # flex-invoicing offers such a member their first full Flex day of each
  # calendar year.
  - { id: 5, name: association_member, type: checkbox }
  # Several at once: a Fixe desk with the Nomade add-on, a Box with a
  # domiciliation. Empty until the sync or an admin sets it.
  - id: 6
    name: formules
    type: multi-select
    options:
      - { value: fixe, label: $t:formule.fixe, color: '#0f766e' }
      - { value: nomade, label: $t:formule.nomade, color: '#2563eb' }
      - { value: flex, label: $t:formule.flex, color: '#f59e0b' }
      - { value: box, label: $t:formule.box, color: '#7c3aed' }
      - { value: domiciliation, label: $t:formule.domiciliation, color: '#64748b' }
  - id: 7
    name: formule_source
    type: single-select
    default: auto
    options:
      - { value: auto, label: $t:formule.source.auto, color: '#94a3b8' }
      - { value: manual, label: $t:formule.source.manual, color: '#10b981' }
  # Who receives the member's invoices: the Pennylane customer's `emails`, one
  # address per line. The coworker edits it on /espace-membre/factures through
  # update-billing-emails, which writes Pennylane first and then this field;
  # pennylane-sync mirrors it back, so a change made in Pennylane shows too.
  - { id: 8, name: billing_emails, type: long-text }
  # The account's id: the one key that survives an e-mail change. Set by
  # member-sign-up, backfilled by pennylane-sync; member-email-sync follows it
  # to move the row (and every member_email copy) to the new address.
  - { id: 9, name: user_id, type: single-line-text, indexed: true }
permissions:
  read: [coworker, admin]
  create: [admin]
  # A coworker updates their own row (row-level rule below), and only
  # billing_emails: every other field is write: [admin].
  update: [coworker, admin]
  delete: [admin]
  # Replaces the built-in field defaults, which would hide `email` from a
  # low-level role. Writes stay admin-only through create/update above.
  fields:
    - { field: email, read: [coworker, admin], write: [admin] }
    - { field: name, read: [coworker, admin], write: [admin] }
    - { field: pennylane_customer_id, read: [coworker, admin], write: [admin] }
    - { field: match_status, read: [coworker, admin], write: [admin] }
    - { field: association_member, read: [coworker, admin], write: [admin] }
    - { field: formules, read: [coworker, admin], write: [admin] }
    - { field: formule_source, read: [coworker, admin], write: [admin] }
    - { field: billing_emails, read: [coworker, admin], write: [coworker, admin] }
    - { field: user_id, read: [admin], write: [admin] }
rowLevelPermissions:
  read:
    when:
      field: email
      operator: eq
      value: { kind: currentUser, path: { kind: scalar, name: email } }
  write:
    when:
      field: email
      operator: eq
      value: { kind: currentUser, path: { kind: scalar, name: email } }
