  - { id: 15, name: notes, label: Précisions, type: long-text }
  - { id: 16, name: sort_order, label: Ordre, type: integer, default: 100 }
  - { id: 17, name: updated_at, label: Modifié le, type: updated-at }
indexes:
  - { name: idx_grant_cost_items_app_order, fields: [application, sort_order] }
permissions:
  read: [admin]
  create: [admin]
  update: [admin]
  delete: [admin]
