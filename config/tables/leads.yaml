# Table: leads — contact form submissions, read by admins in /_admin.
id: 2
name: leads
fields:
  - { id: 1, name: name, label: Nom, type: single-line-text, required: true }
  - { id: 2, name: email, label: E-mail, type: email, required: true }
  - { id: 3, name: phone, label: Téléphone, type: single-line-text }
  - id: 4
    name: subject
    label: Objet
    type: single-select
    options:
      - { value: visite, label: $t:contact.form.subject.visite }
      - { value: bureau-fixe, label: $t:contact.form.subject.bureauFixe }
      - { value: nomade, label: $t:contact.form.subject.nomade }
      - { value: flex, label: $t:contact.form.subject.flex }
      - { value: salle-de-reunion, label: $t:contact.form.subject.salle }
      - { value: domiciliation, label: $t:contact.form.subject.domiciliation }
      - { value: evenement, label: $t:contact.form.subject.evenement }
      - { value: autre, label: $t:contact.form.subject.autre }
  - { id: 5, name: message, label: Message, type: long-text, required: true }
  - { id: 6, name: created_at, type: created-at }

# Anyone may submit; nobody but admins reads.
permissions:
  create: all
