about.title: Qui sommes-nous
about.description: "La Plage Digitale est une association loi 1908 fondée en 2019, issue de l'association Alsace Digitale. Installée dans d'anciens bâtiments coopératifs de la rue Jacques Peirotes, au centre de Strasbourg, elle propose plus de 600m² dédiés au travail collaboratif et à l'innovation."
about.mission.title: Notre mission
about.mission.text: "Accélérer le développement de projets innovants en favorisant la mutualisation et la sérendipité. Nous croyons en une communauté de qualité, bienveillante et chaleureuse où les membres partagent services et valeurs."
about.values.title: Nos valeurs
about.value1: "Mutualisation & entraide"
about.value2: "Innovation & sérendipité"
about.value3: "Bienveillance & diversité"

