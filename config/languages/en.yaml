about.title: About us
about.description: "La Plage Digitale is a non-profit association (loi 1908) founded in 2019, born from the Alsace Digitale association. Located in a former cooperative building on rue Jacques Peirotes in central Strasbourg, it offers over 600m² dedicated to collaborative work and innovation."
about.mission.title: Our mission
about.mission.text: "Accelerate the development of innovative projects by fostering resource sharing and serendipity. We believe in a quality, caring and warm community where members share services and values."
about.values.title: Our values
about.value1: "Sharing & mutual support"
about.value2: "Innovation & serendipity"
about.value3: "Kindness & diversity"

