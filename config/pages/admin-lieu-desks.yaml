# Page: admin-lieu-desks — « Bureaux », reached from Occupation's pill
# sub-nav (pattern A): every desk of the open spaces on three tabs with an
# address (?onglet=libres|occupes|tous), each its own shared-filter channel.
#
# « Occupé » and « Occupé par » are written each morning by
# lieu-occupancy-refresh from the active contracts: a desk is freed or taken
# by its contract (its dates), never by ticking the box. A row opens the
# desk's page, with its contracts.
name: admin-lieu-desks
path: /administration/lieu/bureaux
sitemap: false
access: { require: [admin], redirectTo: /connexion }
query:
  onglet:
    default: libres
    enum: [libres, occupes, tous]
meta:
  favicons:
    $ref: ../favicons.yaml
  title: "Bureaux — Administration"
  description: "Les bureaux de La Plage Digitale, libres et occupés."
  noindex: true
components:
  - type: flex
    props:
      className: 'min-h-screen flex flex-col lg:flex-row bg-background'
    children:
      - component: admin-nav

      - type: container
        element: section
        props:
          className: 'flex-1 min-w-0 px-4 py-8 sm:px-8 lg:px-12 lg:py-10 space-y-8'
        children:
          - type: container
            children:
              - { type: text, element: h1, content: Bureaux, props: { className: 'text-3xl font-bold text-navy' } }
              - { type: text, element: p, content: "Les bureaux fixes et Flex des espaces partagés. Un bureau est occupé tant qu'un contrat en cours le nomme : pour le libérer ou l'attribuer, modifie le contrat. Clique sur une ligne pour voir sa fiche.", props: { className: 'text-text-muted mt-2 max-w-2xl' } }

          # Sub-navigation of Occupation: these pills say which of its three pages is open.
          - type: container
            element: nav
            props:
              aria-label: Occupation
              className: 'flex flex-wrap gap-2 -mt-4'
            children:
              - { type: link, content: Occupation, props: { href: /administration/lieu, className: 'inline-flex items-center min-h-10 px-4 rounded-full text-sm font-semibold transition-colors text-navy hover:text-navy bg-white border border-navy-200 hover:bg-navy-100' } }
              - { type: link, content: Bureaux, props: { href: /administration/lieu/bureaux, 'aria-current': page, className: 'inline-flex items-center min-h-10 px-4 rounded-full text-sm font-semibold transition-colors text-white hover:text-white bg-navy' } }
              - { type: link, content: Casiers, props: { href: /administration/lieu/casiers, className: 'inline-flex items-center min-h-10 px-4 rounded-full text-sm font-semibold transition-colors text-navy hover:text-navy bg-white border border-navy-200 hover:bg-navy-100' } }

          - type: tabs
            defaultTab: $query.onglet
            panels:
              - { id: libres, label: Libres, description: Sans contrat en cours }
              - { id: occupes, label: Occupés, description: Un contrat en cours }
              - { id: tous, label: Tous }
            children:
              - type: card
                props:
                  className: 'p-4 sm:p-6'
                children:
                  - type: container
                    element: div
                    props:
                      role: toolbar
                      aria-label: Outils du tableau
                      className: 'mb-4 flex flex-wrap items-center gap-2'
                    children:
                      - type: search-input
                        placeholder: Rechercher un bureau…
                        props: { aria-label: Rechercher un bureau, className: 'h-9 w-full sm:w-72' }
                        publishes: { bindTo: admin-lieu-desks, param: q }
                      - type: filter-bar
                        publishes: { bindTo: admin-lieu-desks }
                        fieldsFrom: { table: desks }
                      - type: button
                        label: Exporter en CSV
                        variant: outline
                        size: sm
                        props: { className: 'sm:ml-auto' }
                        action: { type: fetch, mode: download, url: '/api/tables/desks/export?format=csv&filterField=occupied&filterValue=false', filename: bureaux.csv }
                  - type: table
                    readOnly: true
                    props:
                      aria-label: Bureaux libres
                    dataSource:
                      bindTo: admin-lieu-desks
                      sharedFilter: {}
                      table: desks
                      filter:
                        - { field: occupied, operator: eq, value: false }
                      sort:
                        - { field: label, direction: asc }
                      pagination: { pageSize: 50, style: numbered }
                    emptyMessage: "Aucun bureau libre : tous ont un contrat en cours aujourd'hui."
                    onRowClick: { type: navigate, path: /administration/lieu/bureaux/$record.id }
                    columns:
                      - { field: label, label: Bureau }
                      - { field: room, label: Pièce }
                      - { field: kind, label: Type }
                      - { field: occupied, label: Occupé, format: check-cross }
                      - { field: current_occupant, label: Occupé par }
                      - { field: notes, label: Notes, truncate: true }
              - type: card
                props:
                  className: 'p-4 sm:p-6'
                children:
                  - type: container
                    element: div
                    props:
                      role: toolbar
                      aria-label: Outils du tableau
                      className: 'mb-4 flex flex-wrap items-center gap-2'
                    children:
                      - type: search-input
                        placeholder: Rechercher un bureau…
                        props: { aria-label: Rechercher un bureau, className: 'h-9 w-full sm:w-72' }
                        publishes: { bindTo: admin-lieu-desks-2, param: q }
                      - type: filter-bar
                        publishes: { bindTo: admin-lieu-desks-2 }
                        fieldsFrom: { table: desks }
                      - type: button
                        label: Exporter en CSV
                        variant: outline
                        size: sm
                        props: { className: 'sm:ml-auto' }
                        action: { type: fetch, mode: download, url: '/api/tables/desks/export?format=csv&filterField=occupied&filterValue=true', filename: bureaux.csv }
                  - type: table
                    readOnly: true
                    props:
                      aria-label: Bureaux occupés
                    dataSource:
                      bindTo: admin-lieu-desks-2
                      sharedFilter: {}
                      table: desks
                      filter:
                        - { field: occupied, operator: eq, value: true }
                      sort:
                        - { field: label, direction: asc }
                      pagination: { pageSize: 50, style: numbered }
                    emptyMessage: "Aucun bureau occupé : aucun contrat en cours ne nomme de bureau."
                    onRowClick: { type: navigate, path: /administration/lieu/bureaux/$record.id }
                    columns:
                      - { field: label, label: Bureau }
                      - { field: room, label: Pièce }
                      - { field: kind, label: Type }
                      - { field: occupied, label: Occupé, format: check-cross }
                      - { field: current_occupant, label: Occupé par }
                      - { field: notes, label: Notes, truncate: true }
              - type: card
                props:
                  className: 'p-4 sm:p-6'
                children:
                  - type: container
                    element: div
                    props:
                      role: toolbar
                      aria-label: Outils du tableau
                      className: 'mb-4 flex flex-wrap items-center gap-2'
                    children:
                      - type: search-input
                        placeholder: Rechercher un bureau…
                        props: { aria-label: Rechercher un bureau, className: 'h-9 w-full sm:w-72' }
                        publishes: { bindTo: admin-lieu-desks-3, param: q }
                      - type: filter-bar
                        publishes: { bindTo: admin-lieu-desks-3 }
                        fieldsFrom: { table: desks }
                      - type: button
                        label: Exporter en CSV
                        variant: outline
                        size: sm
                        props: { className: 'sm:ml-auto' }
                        action: { type: fetch, mode: download, url: '/api/tables/desks/export?format=csv', filename: bureaux.csv }
                  - type: table
                    readOnly: true
                    props:
                      aria-label: Tous les bureaux
                    dataSource:
                      bindTo: admin-lieu-desks-3
                      sharedFilter: {}
                      table: desks
                      sort:
                        - { field: label, direction: asc }
                      pagination: { pageSize: 50, style: numbered }
                    emptyMessage: "Aucun bureau pour le moment : l'import Notion (notion-import-lieu) recopie la liste."
                    onRowClick: { type: navigate, path: /administration/lieu/bureaux/$record.id }
                    columns:
                      - { field: label, label: Bureau }
                      - { field: room, label: Pièce }
                      - { field: kind, label: Type }
                      - { field: occupied, label: Occupé, format: check-cross }
                      - { field: current_occupant, label: Occupé par }
                      - { field: notes, label: Notes, truncate: true }
