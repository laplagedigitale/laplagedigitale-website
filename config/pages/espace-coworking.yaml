# Page: espace-coworking — the space itself: what is available (Box, fixed
# desks, flex places, meeting rooms) and how to come and work here. The
# Giraffe360 virtual tour is gone: the tour itself was deleted at the source. Source: WP page `espace-cowork`.
name: espace-coworking
path: /espace-coworking
meta:
  favicons:
    $ref: ../favicons.yaml
  noindex: true  # pre-launch: keep out of search engines
  title: $t:space.meta.title
  description: $t:space.meta.description
  openGraph:
    type: website
    image: /images/pages/espace-cowork/espace-coworking.webp
components:
  - component: site-header

  # ── Hero ──
  - type: container
    element: section
    props:
      className: 'relative overflow-hidden bg-navy text-white'
    children:
      - type: container
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-20 sm:pt-24 pb-12'
        children:
          - type: text
            element: p
            content: $t:space.eyebrow
            props:
              className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-orange mb-4'
          - type: text
            element: h1
            content: $t:space.title
            props:
              className: '[font-size:var(--text-h1)] [line-height:var(--text-h1--line-height)] [font-weight:var(--text-h1--font-weight)] [letter-spacing:var(--text-h1--letter-spacing)] sm:[font-size:var(--text-display)] sm:[line-height:var(--text-display--line-height)] sm:[font-weight:var(--text-display--font-weight)] sm:[letter-spacing:var(--text-display--letter-spacing)] text-white max-w-4xl'
          - type: text
            element: p
            content: $t:space.lead
            props:
              className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] text-navy-100 max-w-2xl mt-6'
          - type: text
            element: p
            content: 'Coworking · Tiers-lieu · Événements'
            props:
              className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-blue-200 mt-6'
      - type: container
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-16'
        children:
          - type: image
            variant: hero
            props:
              src: /images/pages/espace-cowork/espace-coworking.webp
              alt: $t:space.hero.alt
              className: 'w-full h-48 sm:h-auto object-cover rounded-lg shadow-md'

  # ── What is available ──
  - type: container
    element: section
    props:
      className: 'bg-background'
    children:
      - type: container
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24'
        children:
          - type: text
            element: p
            content: $t:space.offers.eyebrow
            props:
              className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-magenta mb-3'
          - type: text
            element: h2
            content: $t:space.offers.title
            props:
              className: '[font-size:var(--text-h2)] [line-height:var(--text-h2--line-height)] [font-weight:var(--text-h2--font-weight)] [letter-spacing:var(--text-h2--letter-spacing)] text-navy max-w-3xl'
          - type: grid
            props:
              className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mt-12'
            children:
              - type: container
                element: article
                props:
                  className: 'flex flex-col bg-white rounded-lg shadow-md border-t-4 border-navy p-6'
                interactions: { scroll: { animation: fadeInUp, once: true } }
                children:
                  - { type: icon, props: { name: door-closed, size: 28, className: 'text-navy mb-4' } }
                  - { type: text, element: p, content: '3', props: { className: '[font-size:var(--text-display)] [line-height:var(--text-display--line-height)] [font-weight:var(--text-display--font-weight)] [letter-spacing:var(--text-display--letter-spacing)] font-extrabold text-navy leading-none' } }
                  - { type: text, element: h3, content: $t:space.box.title, props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy mt-2' } }
                  - { type: text, element: p, content: $t:space.box.text, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text-muted mt-3 flex-1' } }
                  - { type: link, content: $t:space.more, props: { href: $t:href.pricing.fixe, className: 'inline-flex items-center gap-1 mt-6 font-bold text-navy hover:text-magenta' } }
              - type: container
                element: article
                props:
                  className: 'flex flex-col bg-white rounded-lg shadow-md border-t-4 border-blue p-6'
                interactions: { scroll: { animation: fadeInUp, once: true } }
                children:
                  - { type: icon, props: { name: monitor, size: 28, className: 'text-blue mb-4' } }
                  - { type: text, element: p, content: '52', props: { className: '[font-size:var(--text-display)] [line-height:var(--text-display--line-height)] [font-weight:var(--text-display--font-weight)] [letter-spacing:var(--text-display--letter-spacing)] font-extrabold text-navy leading-none' } }
                  - { type: text, element: h3, content: $t:space.fixed.title, props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy mt-2' } }
                  - { type: text, element: p, content: $t:space.fixed.text, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text-muted mt-3 flex-1' } }
                  - { type: link, content: $t:space.more, props: { href: $t:href.pricing.fixe, className: 'inline-flex items-center gap-1 mt-6 font-bold text-navy hover:text-magenta' } }
              - type: container
                element: article
                props:
                  className: 'flex flex-col bg-white rounded-lg shadow-md border-t-4 border-orange p-6'
                interactions: { scroll: { animation: fadeInUp, once: true } }
                children:
                  - { type: icon, props: { name: laptop, size: 28, className: 'text-navy mb-4' } }
                  - { type: text, element: p, content: '30', props: { className: '[font-size:var(--text-display)] [line-height:var(--text-display--line-height)] [font-weight:var(--text-display--font-weight)] [letter-spacing:var(--text-display--letter-spacing)] font-extrabold text-navy leading-none' } }
                  - { type: text, element: h3, content: $t:space.flex.title, props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy mt-2' } }
                  - { type: text, element: p, content: $t:space.flex.text, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text-muted mt-3 flex-1' } }
                  - { type: link, content: $t:space.more, props: { href: $t:href.pricing.flex, className: 'inline-flex items-center gap-1 mt-6 font-bold text-navy hover:text-magenta' } }
              - type: container
                element: article
                props:
                  className: 'flex flex-col bg-white rounded-lg shadow-md border-t-4 border-magenta p-6'
                interactions: { scroll: { animation: fadeInUp, once: true } }
                children:
                  - { type: icon, props: { name: users, size: 28, className: 'text-magenta mb-4' } }
                  - { type: text, element: p, content: '4', props: { className: '[font-size:var(--text-display)] [line-height:var(--text-display--line-height)] [font-weight:var(--text-display--font-weight)] [letter-spacing:var(--text-display--letter-spacing)] font-extrabold text-navy leading-none' } }
                  - { type: text, element: h3, content: $t:space.rooms.title, props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy mt-2' } }
                  - { type: text, element: p, content: $t:space.rooms.text, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text-muted mt-3 flex-1' } }
                  - { type: link, content: $t:space.more, props: { href: $t:href.pricing.reunion, className: 'inline-flex items-center gap-1 mt-6 font-bold text-navy hover:text-magenta' } }

  # ── How to come and work here ──
  - type: container
    element: section
    props:
      className: 'bg-sand'
    children:
      - type: container
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24'
        children:
          - type: text
            element: p
            content: $t:space.how.eyebrow
            props:
              className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-magenta mb-3'
          - type: text
            element: h2
            content: $t:space.how.title
            props:
              className: '[font-size:var(--text-h2)] [line-height:var(--text-h2--line-height)] [font-weight:var(--text-h2--font-weight)] [letter-spacing:var(--text-h2--letter-spacing)] text-navy max-w-3xl'
          - type: grid
            props:
              className: 'grid grid-cols-1 lg:grid-cols-3 gap-6 mt-12'
            children:
              # Fixed desk
              - type: container
                element: article
                props:
                  className: 'flex flex-col bg-white rounded-lg shadow-md p-6 sm:p-8'
                interactions: { scroll: { animation: fadeInUp, once: true } }
                children:
                  - { type: image, props: { src: /images/pages/espace-cowork/bouee-violette-1.webp, alt: '', className: 'w-8 h-8 mb-4' } }
                  - { type: text, element: h3, content: $t:space.how.fixed.title, props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy' } }
                  - { type: text, element: p, content: $t:space.how.fixed.text, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text-muted mt-3 flex-1' } }
                  - type: flex
                    props:
                      className: 'flex flex-col gap-2 mt-6 [font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] font-bold text-navy'
                    children:
                      - { type: link, props: { href: 'tel:+33977425929', className: 'inline-flex items-center gap-2 hover:text-magenta' }, children: [{ type: icon, props: { name: phone, size: 16 } }, { type: text, element: span, content: '09 77 42 59 29' }] }
                      - { type: link, props: { href: 'tel:+33624413203', className: 'inline-flex items-center gap-2 hover:text-magenta' }, children: [{ type: icon, props: { name: smartphone, size: 16 } }, { type: text, element: span, content: '06 24 41 32 03' }] }
                      - { type: link, props: { href: 'mailto:contact@laplagedigitale.fr', className: 'inline-flex items-center gap-2 hover:text-magenta' }, children: [{ type: icon, props: { name: mail, size: 16 } }, { type: text, element: span, content: 'contact@laplagedigitale.fr' }] }
              # Flex
              - type: container
                element: article
                props:
                  className: 'flex flex-col bg-white rounded-lg shadow-md p-6 sm:p-8'
                interactions: { scroll: { animation: fadeInUp, once: true } }
                children:
                  - { type: image, props: { src: /images/pages/espace-cowork/bouee-bleu-1.webp, alt: '', className: 'w-8 h-8 mb-4' } }
                  - { type: text, element: h3, content: $t:space.how.flex.title, props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy' } }
                  - { type: text, element: p, content: $t:space.how.flex.text, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text-muted mt-3' } }
                  - { type: text, element: p, content: $t:space.how.flex.hours, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] font-bold text-navy mt-4' } }
                  - { type: text, element: p, content: $t:space.how.flex.note, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text-muted mt-4 pl-4 border-l-4 border-orange flex-1' } }
                  - { type: link, content: $t:space.how.flex.cta, props: { href: $t:href.blog, className: 'mt-6 font-bold text-navy hover:text-magenta' } }
              # Meeting rooms
              - type: container
                element: article
                props:
                  className: 'flex flex-col bg-white rounded-lg shadow-md p-6 sm:p-8'
                interactions: { scroll: { animation: fadeInUp, once: true } }
                children:
                  - { type: image, props: { src: /images/pages/espace-cowork/bouee-orange-1.webp, alt: '', className: 'w-8 h-8 mb-4' } }
                  - { type: text, element: h3, content: $t:space.how.rooms.title, props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy' } }
                  - { type: text, element: p, content: $t:space.how.rooms.text, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text-muted mt-3 flex-1' } }
                  - { type: link, content: $t:space.how.rooms.cta, props: { href: $t:href.contact, className: 'self-start inline-flex items-center mt-6 px-6 py-3 rounded-full font-bold text-white bg-navy hover:bg-navy-700 transition-colors' } }
          - type: image
            props:
              src: /images/pages/espace-cowork/acces.webp
              alt: $t:space.how.rooms.alt
              className: 'w-full h-48 sm:h-auto object-cover rounded-lg shadow-md mt-12'

  # ── CTA ──
  - type: container
    element: section
    props:
      className: 'bg-navy text-white'
    children:
      - type: container
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24 text-center'
        children:
          - type: text
            element: h2
            content: $t:space.cta.title
            props:
              className: '[font-size:var(--text-h2)] [line-height:var(--text-h2--line-height)] [font-weight:var(--text-h2--font-weight)] [letter-spacing:var(--text-h2--letter-spacing)] text-white max-w-3xl mx-auto'
          - type: text
            element: p
            content: $t:space.cta.text
            props:
              className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] text-navy-100 max-w-2xl mx-auto mt-4'
          - type: flex
            props:
              className: 'flex flex-col sm:flex-row gap-4 justify-center mt-10'
            children:
              - { type: link, content: $t:space.cta.pricing, props: { href: $t:href.pricing, className: 'inline-flex items-center justify-center px-6 py-3 rounded-full font-bold text-navy bg-orange hover:bg-orange-300 transition-colors' } }
              - { type: link, content: $t:space.cta.contact, props: { href: $t:href.contact, className: 'inline-flex items-center justify-center px-6 py-3 rounded-full font-bold border-2 border-white text-white hover:bg-white hover:text-navy transition-colors' } }

  - component: site-footer
