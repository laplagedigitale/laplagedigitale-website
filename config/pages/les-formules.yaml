                  - type: flex
                    props:
                      className: 'flex flex-col gap-3 mt-6 [font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text'
                    children:
                      - { type: flex, props: { className: 'flex items-start gap-3' }, children: [{ type: icon, props: { name: check, size: 18, strokeWidth: 2.5, className: 'text-forest shrink-0 mt-1' } }, { type: text, element: span, content: $t:pricing.nomade.f1 }] }
