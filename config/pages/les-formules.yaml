                      - { type: text, element: span, content: $t:pricing.fixe.unit, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] font-bold text-text-muted' } }
                  - { type: text, element: p, content: $t:pricing.fixe.ttc, props: { className: '[font-size:var(--text-caption)] [line-height:var(--text-caption--line-height)] text-text-muted mt-2' } }
                  - { type: text, element: p, content: $t:pricing.fixe.desc, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text mt-6' } }
                  - type: flex
                    props:
                      className: 'flex flex-col gap-3 mt-6 [font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text'
                    children:
                      - { type: flex, props: { className: 'flex items-start gap-3' }, children: [{ type: icon, props: { name: check, size: 18, strokeWidth: 2.5, className: 'text-forest shrink-0 mt-1' } }, { type: text, element: span, content: $t:pricing.fixe.f1 }] }
                      - { type: flex, props: { className: 'flex items-start gap-3' }, children: [{ type: icon, props: { name: check, size: 18, strokeWidth: 2.5, className: 'text-forest shrink-0 mt-1' } }, { type: text, element: span, content: $t:pricing.fixe.f2 }] }
                      - { type: flex, props: { className: 'flex items-start gap-3' }, children: [{ type: icon, props: { name: check, size: 18, strokeWidth: 2.5, className: 'text-forest shrink-0 mt-1' } }, { type: text, element: span, content: $t:pricing.fixe.f3 }] }
                      - { type: flex, props: { className: 'flex items-start gap-3' }, children: [{ type: icon, props: { name: check, size: 18, strokeWidth: 2.5, className: 'text-forest shrink-0 mt-1' } }, { type: text, element: span, content: $t:pricing.fixe.f4 }] }
                      - { type: flex, props: { className: 'flex items-start gap-3' }, children: [{ type: icon, props: { name: check, size: 18, strokeWidth: 2.5, className: 'text-forest shrink-0 mt-1' } }, { type: text, element: span, content: $t:pricing.fixe.f5 }] }
                      - { type: flex, props: { className: 'flex items-start gap-3' }, children: [{ type: icon, props: { name: check, size: 18, strokeWidth: 2.5, className: 'text-forest shrink-0 mt-1' } }, { type: text, element: span, content: $t:pricing.fixe.f6 }] }
                      - { type: flex, props: { className: 'flex items-start gap-3' }, children: [{ type: icon, props: { name: check, size: 18, strokeWidth: 2.5, className: 'text-forest shrink-0 mt-1' } }, { type: text, element: span, content: $t:pricing.fixe.f7 }] }
                      - { type: flex, props: { className: 'flex items-start gap-3' }, children: [{ type: icon, props: { name: check, size: 18, strokeWidth: 2.5, className: 'text-forest shrink-0 mt-1' } }, { type: text, element: span, content: $t:pricing.fixe.f8 }] }
                      - { type: flex, props: { className: 'flex items-start gap-3' }, children: [{ type: icon, props: { name: check, size: 18, strokeWidth: 2.5, className: 'text-forest shrink-0 mt-1' } }, { type: text, element: span, content: $t:pricing.fixe.f9 }] }
                      - { type: flex, props: { className: 'flex items-start gap-3' }, children: [{ type: icon, props: { name: check, size: 18, strokeWidth: 2.5, className: 'text-forest shrink-0 mt-1' } }, { type: text, element: span, content: $t:pricing.fixe.f10 }] }
                      - { type: flex, props: { className: 'flex items-start gap-3' }, children: [{ type: icon, props: { name: check, size: 18, strokeWidth: 2.5, className: 'text-forest shrink-0 mt-1' } }, { type: text, element: span, content: $t:pricing.fixe.f11 }] }
                  - type: container
                    props:
                      className: 'mt-8 rounded-lg bg-orange-100 p-5'
                    children:
                      - { type: text, element: p, content: $t:pricing.fixe.offer.title, props: { className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-navy' } }
                      - { type: text, element: p, content: $t:pricing.fixe.offer.who, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-navy mt-2' } }
                      - type: grid
