                          className: 'grid grid-cols-3 gap-2 mt-4 text-center'
                        children:
                          - { type: container, props: { className: 'rounded-md bg-white p-2' }, children: [{ type: text, element: p, content: '−30 %', props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] font-extrabold text-navy' } }, { type: text, element: p, content: $t:pricing.fixe.offer.s1, props: { className: '[font-size:var(--text-caption)] [line-height:var(--text-caption--line-height)] text-text-muted' } }] }
                          - { type: container, props: { className: 'rounded-md bg-white p-2' }, children: [{ type: text, element: p, content: '−20 %', props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] font-extrabold text-navy' } }, { type: text, element: p, content: $t:pricing.fixe.offer.s2, props: { className: '[font-size:var(--text-caption)] [line-height:var(--text-caption--line-height)] text-text-muted' } }] }
                          - { type: container, props: { className: 'rounded-md bg-white p-2' }, children: [{ type: text, element: p, content: '−10 %', props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] font-extrabold text-navy' } }, { type: text, element: p, content: $t:pricing.fixe.offer.s3, props: { className: '[font-size:var(--text-caption)] [line-height:var(--text-caption--line-height)] text-text-muted' } }] }
                      - { type: text, element: p, content: $t:pricing.fixe.offer.note, props: { className: '[font-size:var(--text-caption)] [line-height:var(--text-caption--line-height)] text-navy mt-4' } }
                  - { type: container, props: { className: 'flex-1' } }
