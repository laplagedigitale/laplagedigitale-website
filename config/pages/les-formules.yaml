                interactions: { scroll: { animation: fadeInUp, once: true } }
                children:
                  - { type: text, element: h3, content: $t:pricing.flex.name, props: { className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase tracking-widest text-text-muted' } }
                  - type: flex
