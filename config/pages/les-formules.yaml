# Page: les-formules — plans (Fixe, Nomade, Flex), meeting rooms and
# business domiciliation. Anchors #fixe #nomade #flex #reunion #domiciliation
# are linked from espace-coworking. Source: WP page `les-formules`.

name: les-formules
path: /les-formules
meta:
  favicons:
    $ref: ../favicons.yaml
  noindex: true  # pre-launch: keep out of search engines
  title: $t:pricing.meta.title
  description: $t:pricing.meta.description
  openGraph:
    type: website
    image: /images/pages/les-formules/salle-narval.webp
components:
  - component: site-header

  # ── Hero ──
  - type: container
    element: section
    props:
      className: 'relative overflow-hidden bg-navy text-white'
    children:
      - type: container
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24'
        children:
          - type: text
            element: p
            content: $t:pricing.eyebrow
            props:
              className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-orange mb-4'
          - type: text
            element: h1
            content: $t:pricing.title
            props:
              className: '[font-size:var(--text-h1)] [line-height:var(--text-h1--line-height)] [font-weight:var(--text-h1--font-weight)] [letter-spacing:var(--text-h1--letter-spacing)] sm:[font-size:var(--text-display)] sm:[line-height:var(--text-display--line-height)] sm:[font-weight:var(--text-display--font-weight)] sm:[letter-spacing:var(--text-display--letter-spacing)] text-white max-w-4xl'
          - type: text
            element: p
            content: $t:pricing.lead
            props:
              className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] text-navy-100 max-w-2xl mt-6'
          - type: container
            element: nav
            props:
              'aria-label': $t:pricing.jump.aria
              className: 'flex flex-wrap gap-3 mt-10 [font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] font-bold'
            children:
              - { type: link, content: Fixe, props: { href: '#fixe', className: 'px-4 py-2 rounded-full border-2 border-white/30 text-white hover:bg-white hover:text-navy transition-colors' } }
              - { type: link, content: Nomade, props: { href: '#nomade', className: 'px-4 py-2 rounded-full border-2 border-white/30 text-white hover:bg-white hover:text-navy transition-colors' } }
              - { type: link, content: Flex, props: { href: '#flex', className: 'px-4 py-2 rounded-full border-2 border-white/30 text-white hover:bg-white hover:text-navy transition-colors' } }
              - { type: link, content: $t:pricing.jump.rooms, props: { href: '#reunion', className: 'px-4 py-2 rounded-full border-2 border-white/30 text-white hover:bg-white hover:text-navy transition-colors' } }
              - { type: link, content: $t:pricing.jump.domiciliation, props: { href: '#domiciliation', className: 'px-4 py-2 rounded-full border-2 border-white/30 text-white hover:bg-white hover:text-navy transition-colors' } }

  # ── Plans ──
