                  - { type: container, props: { className: 'flex-1' } }
                  - { type: link, content: $t:pricing.plan.cta, props: { href: $t:href.contact, className: 'inline-flex items-center justify-center mt-8 px-6 py-3 rounded-full font-bold text-white bg-navy hover:bg-navy-700 transition-colors' } }
              - type: container
