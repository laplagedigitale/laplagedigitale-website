# Page: editor-post-new — write a new post. Starts as a draft.
name: editor-post-new
path: /editor/posts/new
sitemap: false
access: { require: [editor, admin], redirectTo: /connexion }
meta:
  favicons:
    $ref: ../favicons.yaml
  title: Nouvel article — Espace rédaction
  description: Rédiger un nouvel article.
  noindex: true
components:
  - type: flex
    props:
      className: 'min-h-screen flex flex-col lg:flex-row bg-background'
    children:
      - component: editor-nav

      - type: container
        element: main
        props:
          className: 'flex-1 min-w-0 px-4 py-8 sm:px-8 lg:px-12 lg:py-10 space-y-6'
        children:
          - { type: link, content: '← Tous les articles', props: { href: /editor/articles, className: 'text-sm text-text-muted hover:text-navy' } }
          - { type: text, element: h1, content: Nouvel article, props: { className: 'text-3xl font-bold text-navy' } }
          # One form, since a new post is created in one request: the
          # two-column layout is the edit page's.
          - type: card
            props:
              className: 'p-6 max-w-3xl'
            children:
              - type: form
                dataSource: { table: posts }
                action:
                  type: crud
                  operation: create
                  table: posts
                  onSuccess:
                    type: navigate
                    navigate: /editor/articles
                    toast: { variant: success, message: Article enregistré. }
                fieldGroups:
                  - { label: Article, fields: [title, slug, excerpt, body] }
                  - { label: Publication, fields: [status, published_at, categories, cover] }
                fields:
                  - { field: title, placeholder: "Titre de l'article" }
                  - { field: slug, placeholder: 'mon-article' }
                  - { field: excerpt, control: textarea }
                  - { field: body }
                  - { field: status, defaultValue: draft }
                  - { field: published_at, defaultValue: $now }
                  - { field: categories }
                  - { field: cover, accept: 'image/jpeg,image/png,image/webp', dropZone: true }
