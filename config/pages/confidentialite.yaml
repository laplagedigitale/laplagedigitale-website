# Page: confidentialite — privacy policy (GDPR): what the site collects, why, for how long, and your rights.
# Generated layout: navy hero, then one h2 per section in a max-w-3xl prose column.
name: confidentialite
path: /confidentialite
meta:
  favicons:
    $ref: ../favicons.yaml
  noindex: true  # pre-launch: keep out of search engines
  title: $t:privacy.meta.title
  description: $t:privacy.meta.description
  openGraph:
    type: website
    image: /images/pages/site/bg-hero.webp
components:
  - component: site-header

  - type: container
    element: section
    props:
      className: 'relative overflow-hidden bg-navy text-white'
    children:
      - type: container
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24'
        children:
          - { type: text, element: p, content: $t:privacy.eyebrow, props: { className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-orange mb-4' } }
          - { type: text, element: h1, content: $t:privacy.title, props: { className: '[font-size:var(--text-h1)] [line-height:var(--text-h1--line-height)] [font-weight:var(--text-h1--font-weight)] [letter-spacing:var(--text-h1--letter-spacing)] sm:[font-size:var(--text-display)] sm:[line-height:var(--text-display--line-height)] sm:[font-weight:var(--text-display--font-weight)] sm:[letter-spacing:var(--text-display--letter-spacing)] text-white max-w-3xl' } }
          - { type: text, element: p, content: $t:privacy.lead, props: { className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] text-navy-100 max-w-2xl mt-6' } }

  - type: container
    element: main
    props:
      className: 'bg-background'
    children:
      - type: container
        element: article
        props:
          className: 'max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16 sm:py-20'
        children:
          - { type: text, element: p, content: $t:privacy.updated, props: { className: '[font-size:var(--text-caption)] [line-height:var(--text-caption--line-height)] text-text-muted mb-10' } }

          # controller
          - { type: text, element: h2, content: $t:privacy.controller.title, props: { className: '[font-size:var(--text-h3)] [line-height:var(--text-h3--line-height)] [font-weight:var(--text-h3--font-weight)] text-navy mt-12 mb-4 pt-6 border-t border-border' } }
          - { type: text, element: p, content: $t:privacy.controller.p1, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text mb-4' } }
          - { type: text, element: p, content: $t:privacy.controller.p2, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text mb-4' } }

          # contact
          - { type: text, element: h2, content: $t:privacy.contact.title, props: { className: '[font-size:var(--text-h3)] [line-height:var(--text-h3--line-height)] [font-weight:var(--text-h3--font-weight)] text-navy mt-12 mb-4 pt-6 border-t border-border' } }
          - { type: text, element: p, content: $t:privacy.contact.p1, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text mb-4' } }
          - { type: text, element: p, content: $t:privacy.contact.p2, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text mb-4' } }
          - { type: text, element: p, content: $t:privacy.contact.p3, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text mb-4' } }

          # analytics
          - { type: text, element: h2, content: $t:privacy.analytics.title, props: { className: '[font-size:var(--text-h3)] [line-height:var(--text-h3--line-height)] [font-weight:var(--text-h3--font-weight)] text-navy mt-12 mb-4 pt-6 border-t border-border' } }
          - { type: text, element: p, content: $t:privacy.analytics.p1, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text mb-4' } }
          - { type: text, element: p, content: $t:privacy.analytics.p2, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text mb-4' } }
