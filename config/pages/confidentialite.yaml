          - { type: text, element: p, content: $t:privacy.cookies.p1, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text mb-4' } }
          - { type: text, element: p, content: $t:privacy.cookies.p2, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text mb-4' } }

          # thirdparty
          - { type: text, element: h2, content: $t:privacy.thirdparty.title, props: { className: '[font-size:var(--text-h3)] [line-height:var(--text-h3--line-height)] [font-weight:var(--text-h3--font-weight)] text-navy mt-12 mb-4 pt-6 border-t border-border' } }
