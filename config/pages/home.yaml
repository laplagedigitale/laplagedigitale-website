# Page: home — Accueil of the 4-page site (request 786): coworking first, the
# tiers-lieu as the reason to choose it. Hero with the one main action
# « Réserver une visite » (a mailto to the team, no form), key figures, the four
# formules, the tiers-lieu, three Plagistes, the rooms, the contact band.
# Generated layout; figures and rules come from the 2026 contracts and the RIA.
name: home
path: "/"
meta:
  favicons:
    $ref: "../favicons.yaml"
  noindex: true
  title: $t:accueil.meta.title
  description: $t:accueil.meta.description
  openGraph:
    type: website
    image: "/images/pages/accueil/hero.webp"
