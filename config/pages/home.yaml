# Page: home.
name: home
path: /
meta:
  title: "La Plage Digitale — Coworking à Strasbourg"
  description: "Tiers-lieu de l'innovation à Strasbourg : coworking, bureaux privés, salles de réunion et espace événementiel. Plus de 600m² au cœur de la ville."
  noindex: true
  keywords: 'coworking, strasbourg, bureau partagé, espace de travail, la plage digitale, tiers-lieu, innovation'
  openGraph:
    type: website
    image: 'https://www.laplagedigitale.fr/wp-content/uploads/2024/03/Sans-titre-8-2plage1.jpg'
    imageAlt: "La Plage Digitale — Coworking à Strasbourg"
  twitter:
    card: summary_large_image
    image: 'https://www.laplagedigitale.fr/wp-content/uploads/2024/03/Sans-titre-8-2plage1.jpg'

components:
  - component: site-header

  # Hero
  - type: container
    element: section
    props:
      className: 'relative min-h-screen flex items-center pt-16 bg-gradient-to-br from-[#1a2767] via-[#2a1a4a] to-[#1a2767]'
    children:
      - type: container
        props:
          className: 'relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-32 text-center'
        children:
          - type: text
            element: h1
            content: $t:hero.title
            props:
              className: 'text-4xl sm:text-5xl lg:text-6xl font-extrabold text-white mb-6 leading-tight'
            interactions:
              entrance:
                animation: fadeInUp
                duration: '600ms'
          - type: text
            element: p
            content: $t:hero.subtitle
            props:
              className: 'text-lg sm:text-xl text-gray-300 max-w-2xl mx-auto mb-10'
            interactions:
              entrance:
                animation: fadeInUp
                duration: '600ms'
                delay: '200ms'
          - type: flex
            props:
              className: 'flex flex-col sm:flex-row items-center justify-center gap-4'
            children:
              - type: link
                content: $t:hero.cta
                props:
                  href: '#spaces'
                  className: 'px-8 py-4 rounded-full bg-[#eb6f18] text-white font-semibold text-lg hover:bg-[#d4610f] transition-colors'
              - type: link
                content: $t:hero.cta2
                props:
                  href: $t:nav.href.contact
                  className: 'px-8 py-4 rounded-full border-2 border-white text-white font-semibold text-lg hover:bg-white hover:text-gray-900 transition-colors'

  # Spaces
  - type: container
    element: section
    props:
      id: spaces
      className: 'py-24 bg-gray-50'
    children:
      - type: container
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8'
        children:
          - type: container
            props:
              className: 'text-center mb-16'
            children:
              - type: text
                element: h2
                content: $t:spaces.title
                props:
                  className: 'text-3xl sm:text-4xl font-bold text-gray-900 mb-4'
              - type: text
                element: p
                content: $t:spaces.subtitle
                props:
                  className: 'text-lg text-gray-600 max-w-2xl mx-auto'

          - type: grid
            props:
              className: 'grid grid-cols-1 md:grid-cols-2 gap-8'
            children:
              - component: space-card
                vars:
                  icon: "\U0001F4BB"
                  name: $t:space.flex.name
                  description: $t:space.flex.description
                  capacity: $t:space.flex.capacity
              - component: space-card
                vars:
                  icon: "\U0001F3E2"
                  name: $t:space.fixed.name
                  description: $t:space.fixed.description
                  capacity: $t:space.fixed.capacity
              - component: space-card
                vars:
                  icon: "\U0001F91D"
                  name: $t:space.meeting.name
                  description: $t:space.meeting.description
                  capacity: $t:space.meeting.capacity
              - component: space-card
                vars:
                  icon: "\U0001F3A4"
                  name: $t:space.event.name
                  description: $t:space.event.description
                  capacity: $t:space.event.capacity

  # Amenities
  - type: container
    element: section
    props:
      className: 'py-24'
    children:
      - type: container
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8'
        children:
          - type: text
            element: h2
            content: $t:amenities.title
            props:
              className: 'text-3xl sm:text-4xl font-bold text-gray-900 text-center mb-16'
          - type: grid
            props:
              className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4'
            children:
              - component: amenity-item
                vars:
                  label: $t:amenities.wifi
              - component: amenity-item
                vars:
                  label: $t:amenities.coffee
              - component: amenity-item
                vars:
                  label: $t:amenities.print
              - component: amenity-item
                vars:
                  label: $t:amenities.locker
              - component: amenity-item
                vars:
                  label: $t:amenities.mail
              - component: amenity-item
                vars:
                  label: $t:amenities.parking
              - component: amenity-item
                vars:
                  label: $t:amenities.kitchen
              - component: amenity-item
                vars:
                  label: $t:amenities.events
              - component: amenity-item
                vars:
                  label: $t:amenities.access

  # Pricing
  - type: container
    element: section
    props:
      id: pricing
      className: 'py-24 bg-gray-50'
    children:
      - type: container
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8'
        children:
          - type: container
            props:
              className: 'text-center mb-16'
            children:
              - type: text
                element: h2
                content: $t:pricing.title
                props:
                  className: 'text-3xl sm:text-4xl font-bold text-gray-900 mb-4'
              - type: text
                element: p
                content: $t:pricing.subtitle
                props:
                  className: 'text-lg text-gray-600 max-w-2xl mx-auto'

          # Coworking plans
          - type: grid
            props:
              className: 'grid grid-cols-1 md:grid-cols-3 gap-8 mb-16'
            children:
              # Flex
              - type: card
                props:
                  className: 'rounded-xl bg-white shadow-md p-8 flex flex-col'
                children:
                  - type: text
                    element: h3
                    content: $t:pricing.flex.name
                    props:
                      className: 'text-lg font-semibold text-gray-900 mb-4'
                  - type: flex
                    props:
                      className: 'flex items-baseline gap-1 mb-6'
                    children:
                      - type: text
                        element: span
                        content: $t:pricing.flex.price
                        props:
                          className: 'text-4xl font-bold text-gray-900'
                      - type: text
                        element: span
                        content: $t:pricing.flex.period
                        props:
                          className: 'text-gray-500'
                  - type: list
                    props:
                      className: 'space-y-3 mb-8 flex-grow text-sm text-gray-600'
                    children:
                      - type: list-item
                        content: $t:pricing.flex.feature1
                      - type: list-item
                        content: $t:pricing.flex.feature2
                      - type: list-item
                        content: $t:pricing.flex.feature3
                      - type: list-item
                        content: $t:pricing.flex.feature4
                  - type: link
                    content: $t:hero.cta2
                    props:
                      href: $t:nav.href.contact
                      className: 'block text-center px-6 py-3 rounded-full font-semibold bg-gray-100 text-gray-900 hover:bg-gray-200 transition-colors'

              # Nomade
              - type: card
                props:
                  className: 'rounded-xl bg-white shadow-md p-8 flex flex-col'
                children:
                  - type: text
                    element: h3
                    content: $t:pricing.nomad.name
                    props:
                      className: 'text-lg font-semibold text-gray-900 mb-4'
                  - type: flex
                    props:
                      className: 'flex items-baseline gap-1 mb-6'
                    children:
                      - type: text
                        element: span
                        content: $t:pricing.nomad.price
                        props:
                          className: 'text-4xl font-bold text-gray-900'
                      - type: text
                        element: span
                        content: $t:pricing.nomad.period
                        props:
                          className: 'text-gray-500'
                  - type: list
                    props:
                      className: 'space-y-3 mb-8 flex-grow text-sm text-gray-600'
                    children:
                      - type: list-item
                        content: $t:pricing.nomad.feature1
                      - type: list-item
                        content: $t:pricing.nomad.feature2
                      - type: list-item
                        content: $t:pricing.nomad.feature3
                      - type: list-item
                        content: $t:pricing.nomad.feature4
                      - type: list-item
                        content: $t:pricing.nomad.feature5
                  - type: link
                    content: $t:nav.cta
                    props:
                      href: $t:nav.href.contact
                      className: 'block text-center px-6 py-3 rounded-full font-semibold bg-gray-100 text-gray-900 hover:bg-gray-200 transition-colors'

              # Fixe (highlighted)
              - type: card
                props:
                  className: 'rounded-xl bg-white shadow-md p-8 flex flex-col ring-2 ring-[#eb6f18]'
                children:
                  - type: text
                    element: h3
                    content: $t:pricing.fixed.name
                    props:
                      className: 'text-lg font-semibold text-gray-900 mb-4'
                  - type: flex
                    props:
                      className: 'flex items-baseline gap-1 mb-6'
                    children:
                      - type: text
                        element: span
                        content: $t:pricing.fixed.price
                        props:
                          className: 'text-4xl font-bold text-gray-900'
                      - type: text
                        element: span
                        content: $t:pricing.fixed.period
                        props:
                          className: 'text-gray-500'
                  - type: list
                    props:
                      className: 'space-y-3 mb-8 flex-grow text-sm text-gray-600'
                    children:
                      - type: list-item
                        content: $t:pricing.fixed.feature1
                      - type: list-item
                        content: $t:pricing.fixed.feature2
                      - type: list-item
                        content: $t:pricing.fixed.feature3
                      - type: list-item
                        content: $t:pricing.fixed.feature4
                      - type: list-item
                        content: $t:pricing.fixed.feature5
                      - type: list-item
                        content: $t:pricing.fixed.feature6
                      - type: list-item
                        content: $t:pricing.fixed.feature7
                  - type: link
                    content: $t:nav.cta
                    props:
                      href: $t:nav.href.contact
                      className: 'block text-center px-6 py-3 rounded-full font-semibold bg-[#eb6f18] text-white hover:bg-[#d4610f] transition-colors'

          # Meeting rooms
          - type: container
            props:
              className: 'mt-8'
            children:
              - type: text
                element: h3
                content: $t:meeting.title
                props:
                  className: 'text-2xl font-bold text-gray-900 mb-2 text-center'
              - type: text
                element: p
                content: $t:meeting.subtitle
                props:
                  className: 'text-gray-600 text-center mb-8'
              - type: container
                props:
                  className: 'space-y-4'
                children:
                  - type: container
                    props:
                      className: 'flex flex-col sm:flex-row sm:items-center justify-between p-6 bg-white rounded-xl shadow-sm'
                    children:
                      - type: container
                        children:
                          - type: text
                            element: h4
                            content: $t:meeting.crevette.name
                            props:
                              className: 'text-lg font-bold text-gray-900'
                          - type: text
                            element: p
                            content: $t:meeting.crevette.capacity
                            props:
                              className: 'text-gray-500 text-sm'
                      - type: text
                        element: span
                        content: $t:meeting.crevette.price
                        props:
                          className: 'text-lg font-bold text-[#eb6f18] mt-2 sm:mt-0'
                  - type: container
                    props:
                      className: 'flex flex-col sm:flex-row sm:items-center justify-between p-6 bg-white rounded-xl shadow-sm'
                    children:
                      - type: container
                        children:
                          - type: text
                            element: h4
                            content: $t:meeting.requin.name
                            props:
                              className: 'text-lg font-bold text-gray-900'
                          - type: text
                            element: p
                            content: $t:meeting.requin.capacity
                            props:
                              className: 'text-gray-500 text-sm'
                      - type: text
                        element: span
                        content: $t:meeting.requin.price
                        props:
                          className: 'text-lg font-bold text-[#eb6f18] mt-2 sm:mt-0'
                  - type: container
                    props:
                      className: 'flex flex-col sm:flex-row sm:items-center justify-between p-6 bg-white rounded-xl shadow-sm'
                    children:
                      - type: container
                        children:
                          - type: text
                            element: h4
                            content: $t:meeting.baleine.name
                            props:
                              className: 'text-lg font-bold text-gray-900'
                          - type: text
                            element: p
                            content: $t:meeting.baleine.capacity
                            props:
                              className: 'text-gray-500 text-sm'
                      - type: text
                        element: span
                        content: $t:meeting.baleine.price
                        props:
                          className: 'text-lg font-bold text-[#eb6f18] mt-2 sm:mt-0'
                  - type: container
                    props:
                      className: 'flex flex-col sm:flex-row sm:items-center justify-between p-6 bg-white rounded-xl shadow-sm'
                    children:
                      - type: container
                        children:
                          - type: text
                            element: h4
                            content: $t:meeting.narval.name
                            props:
                              className: 'text-lg font-bold text-gray-900'
                          - type: text
                            element: p
                            content: $t:meeting.narval.capacity
                            props:
                              className: 'text-gray-500 text-sm'
                      - type: text
                        element: span
                        content: $t:meeting.narval.price
                        props:
                          className: 'text-lg font-bold text-[#eb6f18] mt-2 sm:mt-0'

  # CTA Banner
  - type: container
    element: section
    props:
      className: 'py-24 bg-[#1a2767]'
    children:
      - type: container
        props:
          className: 'max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center'
        children:
          - type: text
            element: h2
            content: $t:cta.title
            props:
              className: 'text-3xl sm:text-4xl font-bold text-white mb-6'
          - type: text
            element: p
            content: $t:cta.subtitle
            props:
              className: 'text-lg text-white/80 mb-10'
          - type: link
            content: $t:hero.cta2
            props:
              href: $t:nav.href.contact
              className: 'inline-block px-8 py-4 rounded-full bg-[#f3ae13] text-white font-semibold text-lg hover:bg-[#e09e0a] transition-colors'

  - component: site-footer
