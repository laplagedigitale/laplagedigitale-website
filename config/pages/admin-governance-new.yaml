# Page: admin-governance-new — pattern C: the back link, then one card holding the declared
# form meeting-new, which creates the sitting and opens it on its own page.
#
# Declared in app.yaml before every :id page under /administration/gouvernance,
# so this address is this page and never read as an :id.
name: admin-governance-new
path: /administration/gouvernance/nouvelle
sitemap: false
access: { require: [admin], redirectTo: /connexion }
meta:
  favicons:
    $ref: ../favicons.yaml
  title: "Nouvelle instance — Administration"
  description: "Planifier un conseil d'administration, une assemblée générale ou un bureau."
  noindex: true
components:
  - type: flex
    props:
      className: 'min-h-screen flex flex-col lg:flex-row bg-background'
    children:
      - component: admin-nav

      - type: container
        element: section
        props:
          className: 'flex-1 min-w-0 px-4 py-8 sm:px-8 lg:px-12 lg:py-10 space-y-6'
        children:
          - { type: link, content: '← Instances', props: { href: '/administration/gouvernance', className: 'inline-flex items-center min-h-11 text-sm text-text-muted hover:text-navy' } }
          - type: card
            props:
              className: 'p-6 sm:p-8 max-w-2xl'
            children:
              - type: form
                formRef: meeting-new
                props: { headingLevel: h1 }
