# Page: portal — « Espace Membre », the coworker space's dashboard: what is left
# to pay, the direct-debit status and the latest invoices at a glance.
#
# Every block reads a table under row-level rules (matched on the login
# email), so a coworker is only ever served their own rows — the filters here
# are not what keeps data apart, the tables are.
name: portal
path: /espace-membre
access: { require: [coworker, admin], redirectTo: /connexion }
meta:
  favicons:
    $ref: ../favicons.yaml
  title: "Espace Membre — La Plage Digitale"
  description: "L'espace des coworkers de La Plage Digitale."
  noindex: true
components:
  - type: flex
    props:
      className: 'min-h-screen flex flex-col lg:flex-row bg-background'
    children:
      - component: espace-membre-nav

      - type: container
        element: main
        props:
          className: 'flex-1 min-w-0 px-4 py-8 sm:px-8 lg:px-12 lg:py-10 space-y-10'
        children:
          - type: container
            children:
              - { type: text, element: p, content: $t:portal.dashboard.hello, props: { className: 'text-sm font-semibold uppercase tracking-wide text-orange' } }
              - { type: text, element: h1, content: $t:nav.portal, props: { className: 'text-4xl font-bold text-navy mt-1' } }
              - { type: text, element: p, content: $t:portal.dashboard.subtitle, props: { className: 'text-text-muted mt-2 max-w-2xl' } }

          # Account link — shown only while the coworker's Pennylane customer
          # is not linked yet, so an empty invoice list is explained.
          - type: list
            dataSource:
              table: members
              filter:
                - { field: match_status, operator: in, value: [pending, not_found] }
              limit: 1
            props:
              className: 'text-sm text-navy [&_li]:rounded-md [&_li]:border [&_li]:border-amber [&_li]:bg-orange-100 [&_li]:px-4 [&_li]:py-3'
            listDisplay:
              emptyMessage: ''
              itemTemplate:
                title: $t:portal.account.unlinked
                subtitle: $record.email

          - type: grid
            props:
              className: 'grid grid-cols-1 sm:grid-cols-3 gap-4'
            children:
              - type: kpi
                label: $t:portal.dashboard.due
                icon: wallet
                dataSource:
                  table: invoices
                  filter:
                    - { field: status, operator: in, value: [upcoming, late, partially_paid] }
                kpiAggregate: { function: sum, field: remaining_amount }
                kpiFormat: { type: currency, options: { currency: EUR } }
              - type: kpi
                label: $t:portal.dashboard.late
                icon: alarm-clock
                dataSource:
                  table: invoices
                  filter:
                    - { field: status, operator: eq, value: late }
                kpiAggregate: { function: count }
                thresholds:
                  - { value: 1, color: red }
              - type: kpi
                label: $t:portal.dashboard.paid
                icon: circle-check
                dataSource:
                  table: invoices
                  filter:
                    - { field: status, operator: eq, value: paid }
                kpiAggregate: { function: count }

          - type: grid
            props:
              className: 'grid grid-cols-1 xl:grid-cols-3 gap-6'
            children:
              - type: card
                props:
                  className: 'xl:col-span-2 p-6 space-y-4'
                children:
                  - type: flex
                    props: { className: 'flex items-center justify-between gap-4' }
                    children:
                      - { type: text, element: h2, content: $t:portal.dashboard.latest, props: { className: 'text-xl font-semibold text-navy' } }
                      - { type: link, content: $t:portal.dashboard.all, props: { href: $t:href.portal.invoices, className: 'text-sm font-semibold text-blue hover:text-navy' } }
                  - type: table
                    dataSource:
                      table: invoices
                      sort:
                        - { field: invoice_date, direction: desc }
                      pagination: { pageSize: 5 }
                    emptyMessage: $t:portal.invoices.none
                    columns:
                      - { field: label, label: $t:portal.invoices.label }
                      - { field: invoice_date, label: $t:portal.invoices.date, format: short-date }
                      - { field: amount, label: $t:portal.invoices.amount, format: currency, align: right }
                      - field: status
                        label: $t:portal.invoices.status
                        valueLabels:
                          paid: $t:portal.status.paid
                          partially_paid: $t:portal.status.partially_paid
                          upcoming: $t:portal.status.upcoming
                          late: $t:portal.status.late
                          incomplete: $t:portal.status.incomplete
                          cancelled: $t:portal.status.cancelled
                          partially_cancelled: $t:portal.status.partially_cancelled
                          credit_note: $t:portal.status.credit_note
                          archived: $t:portal.status.archived

              - type: card
                props:
                  className: 'p-6 space-y-4'
                children:
                  - type: flex
                    props: { className: 'flex items-center justify-between gap-4' }
                    children:
                      - { type: text, element: h2, content: $t:portal.mandate.title, props: { className: 'text-xl font-semibold text-navy' } }
                      - { type: link, content: $t:portal.dashboard.manage, props: { href: $t:href.portal.mandate, className: 'text-sm font-semibold text-blue hover:text-navy' } }
                  - type: table
                    dataSource:
                      table: mandates
                      sort:
                        - { field: signed_at, direction: desc }
                      pagination: { pageSize: 1 }
                    emptyMessage: $t:portal.mandate.none
                    columns:
                      - field: status
                        label: $t:portal.invoices.status
                        valueLabels:
                          active: $t:portal.mandate.active
                          pending_customer_approval: $t:portal.mandate.pending
                          pending_submission: $t:portal.mandate.pending
                          submitted: $t:portal.mandate.pending
                          failed: $t:portal.mandate.failed
                          blocked: $t:portal.mandate.failed
                          bank_disconnected: $t:portal.mandate.failed
                          cancelled: $t:portal.mandate.ended
                          expired: $t:portal.mandate.ended
                          consumed: $t:portal.mandate.ended
                          replaced: $t:portal.mandate.ended
                      - { field: bank_account, label: $t:portal.mandate.account }
