# Page: qui-sommes-nous — the place, the project, the association, the people.
# LinkedIn links from the WordPress page are deliberately dropped: they pointed
# at the wrong people.
name: qui-sommes-nous
path: /qui-sommes-nous
meta:
  noindex: true  # pre-launch: keep out of search engines
  title: $t:about.meta.title
  description: $t:about.meta.description
  openGraph:
    type: website
    image: /images/pages/accueil/coworking-1.webp
components:
  - component: site-header

  # ── Hero ────────────────────────────────────────────────────────────
  - type: container
    element: section
    props:
      className: 'relative overflow-hidden bg-navy text-white'
    children:
      - type: container
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24'
        children:
          - type: text
            element: p
            content: $t:about.eyebrow
            props:
              className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-orange mb-4'
          - type: text
            element: h1
            content: $t:about.title
            props:
              className: '[font-size:var(--text-h1)] [line-height:var(--text-h1--line-height)] [font-weight:var(--text-h1--font-weight)] [letter-spacing:var(--text-h1--letter-spacing)] sm:[font-size:var(--text-display)] sm:[line-height:var(--text-display--line-height)] sm:[font-weight:var(--text-display--font-weight)] sm:[letter-spacing:var(--text-display--letter-spacing)] text-white max-w-3xl'
          - type: text
            element: p
            content: $t:about.lead
            props:
              className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] text-navy-100 max-w-2xl mt-6'

  - type: container
    element: main
    props:
      className: 'bg-background'
    children:
      # ── The place ─────────────────────────────────────────────────────
      - type: container
        element: section
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24'
          'aria-labelledby': about-place-title
        children:
          - type: grid
            props:
              className: 'grid grid-cols-1 lg:grid-cols-2 gap-12 items-center'
            children:
              - type: container
                children:
                  - type: text
                    element: p
                    content: $t:about.place.eyebrow
                    props:
                      className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-magenta mb-3'
                  - type: text
                    element: h2
                    content: $t:about.place.title
                    props:
                      id: about-place-title
                      className: '[font-size:var(--text-h2)] [line-height:var(--text-h2--line-height)] [font-weight:var(--text-h2--font-weight)] [letter-spacing:var(--text-h2--letter-spacing)] text-navy'
                  - type: text
                    element: p
                    content: $t:about.place.p1
                    props:
                      className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text mt-6'
                  - type: text
                    element: p
                    content: $t:about.place.p2
                    props:
                      className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text mt-4'
                  - type: text
                    element: p
                    content: $t:about.place.p3
                    props:
                      className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text mt-4'
              - type: container
                props:
                  className: 'relative'
                children:
                  - type: container
                    props:
                      className: 'absolute inset-0 translate-x-3 translate-y-3 sm:translate-x-5 sm:translate-y-5 rounded-lg bg-blue'
                      'aria-hidden': 'true'
                  - type: image
                    props:
                      src: /images/pages/accueil/coworking-1.webp
                      alt: $t:about.place.imageAlt
                      width: 1600
                      height: 1097
                      className: 'relative w-full h-auto rounded-lg shadow-md'

      # ── Project + association ─────────────────────────────────────────
      - type: container
        element: section
        props:
          className: 'bg-white'
        children:
          - type: grid
            props:
              className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24 grid grid-cols-1 md:grid-cols-2 gap-8'
            children:
              - type: container
                element: article
                props:
                  className: 'bg-background rounded-lg border-t-4 border-orange p-8'
                interactions: { scroll: { animation: fadeInUp, once: true } }
                children:
                  - { type: text, element: h2, content: $t:about.project.title, props: { className: '[font-size:var(--text-h3)] [line-height:var(--text-h3--line-height)] [font-weight:var(--text-h3--font-weight)] text-navy' } }
                  - { type: text, element: p, content: $t:about.project.p1, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text mt-4' } }
                  - { type: text, element: p, content: $t:about.project.p2, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text mt-4' } }
                  - { type: text, element: p, content: $t:about.project.motto, props: { className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] font-bold text-navy mt-6' } }
              - type: container
                element: article
                props:
                  className: 'bg-background rounded-lg border-t-4 border-magenta p-8'
                interactions: { scroll: { animation: fadeInUp, once: true } }
                children:
                  - { type: text, element: h2, content: $t:about.association.title, props: { className: '[font-size:var(--text-h3)] [line-height:var(--text-h3--line-height)] [font-weight:var(--text-h3--font-weight)] text-navy' } }
                  - { type: text, element: p, content: $t:about.association.p1, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text mt-4' } }
                  - { type: text, element: p, content: $t:about.association.p2, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text mt-4' } }
                  - type: flex
                    props:
                      className: 'flex flex-wrap gap-3 mt-8'
                    children:
                      - type: link
                        content: $t:about.cta.join
                        props:
                          href: 'https://www.helloasso.com/associations/la-plage-digitale/adhesions/adhesion-a-la-plage-digitale-2025'
                          target: _blank
                          rel: 'noopener noreferrer'
                          className: 'inline-flex items-center px-6 py-3 rounded-full font-bold text-navy bg-orange hover:bg-orange-300 transition-colors'
                      - type: link
                        content: $t:about.cta.call
                        props:
                          href: 'tel:+33977425929'
                          className: 'inline-flex items-center px-6 py-3 rounded-full font-bold bg-navy text-white hover:bg-navy-700 transition-colors'

      # ── The board ─────────────────────────────────────────────────────
      - type: container
        element: section
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24'
          'aria-labelledby': about-board-title
        children:
          - type: text
            element: p
            content: $t:about.board.eyebrow
            props:
              className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-magenta mb-3'
          - type: text
            element: h2
            content: $t:about.board.title
            props:
              id: about-board-title
              className: '[font-size:var(--text-h2)] [line-height:var(--text-h2--line-height)] [font-weight:var(--text-h2--font-weight)] [letter-spacing:var(--text-h2--letter-spacing)] text-navy'
          - type: grid
            props:
              className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 mt-12'
            children:
              - type: container
                element: article
                props: { className: 'bg-white rounded-lg shadow-md border-t-4 border-navy p-6 text-center' }
                interactions: { scroll: { animation: fadeInUp, once: true } }
                children:
                  - { type: image, props: { src: /images/pages/qui-sommes-nous/simon-thierry.webp, alt: Simon Thierry, width: 205, height: 210, loading: lazy, className: 'w-32 h-32 mx-auto rounded-full object-cover ring-4 ring-navy-100' } }
                  - { type: text, element: h3, content: Simon THIERRY, props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy mt-5' } }
                  - { type: text, element: p, content: $t:about.role.president, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text-muted mt-1' } }
              - type: container
                element: article
                props: { className: 'bg-white rounded-lg shadow-md border-t-4 border-blue p-6 text-center' }
                interactions: { scroll: { animation: fadeInUp, once: true } }
                children:
                  - { type: image, props: { src: /images/pages/qui-sommes-nous/kevin-blenner.webp, alt: Kevin Blenner, loading: lazy, className: 'w-32 h-32 mx-auto rounded-full object-cover ring-4 ring-blue-100' } }
                  - { type: text, element: h3, content: Kevin BLENNER, props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy mt-5' } }
                  - { type: text, element: p, content: $t:about.role.treasurer, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text-muted mt-1' } }
              - type: container
                element: article
                props: { className: 'bg-white rounded-lg shadow-md border-t-4 border-orange p-6 text-center' }
                interactions: { scroll: { animation: fadeInUp, once: true } }
                children:
                  - { type: image, props: { src: /images/pages/qui-sommes-nous/bastien-remy.webp, alt: Bastien Remy, loading: lazy, className: 'w-32 h-32 mx-auto rounded-full object-cover ring-4 ring-orange-100' } }
                  - { type: text, element: h3, content: Bastien REMY, props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy mt-5' } }
                  - { type: text, element: p, content: $t:about.role.secretary, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text-muted mt-1' } }

      # ── The team ──────────────────────────────────────────────────────
      - type: container
        element: section
        props:
          className: 'bg-sand'
          'aria-labelledby': about-team-title
        children:
          - type: container
            props:
              className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24'
            children:
              - type: text
                element: p
                content: $t:about.team.eyebrow
                props:
                  className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-magenta mb-3'
              - type: text
                element: h2
                content: $t:about.team.title
                props:
                  id: about-team-title
                  className: '[font-size:var(--text-h2)] [line-height:var(--text-h2--line-height)] [font-weight:var(--text-h2--font-weight)] [letter-spacing:var(--text-h2--letter-spacing)] text-navy'
              - type: text
                element: p
                content: $t:about.team.lead
                props:
                  className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] text-text-muted max-w-2xl mt-4'
              - type: grid
                props:
                  className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 mt-12'
                children:
                  - type: container
                    element: article
                    props: { className: 'bg-white rounded-lg shadow-md border-t-4 border-magenta p-6 text-center' }
                    interactions: { scroll: { animation: fadeInUp, once: true } }
                    children:
                      - { type: image, props: { src: /images/pages/qui-sommes-nous/celine-verbeck.webp, alt: Céline Verbeck, loading: lazy, className: 'w-32 h-32 mx-auto rounded-full object-cover ring-4 ring-magenta-100' } }
                      - { type: text, element: h3, content: Céline VERBECK, props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy mt-5' } }
                      - { type: text, element: p, content: $t:about.role.manager, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text-muted mt-1' } }
                  - type: container
                    element: article
                    props: { className: 'bg-white rounded-lg shadow-md border-t-4 border-blue p-6 text-center' }
                    interactions: { scroll: { animation: fadeInUp, once: true } }
                    children:
                      - { type: image, props: { src: /images/pages/qui-sommes-nous/lucie-dubief.webp, alt: Lucie Dubief, loading: lazy, className: 'w-32 h-32 mx-auto rounded-full object-cover ring-4 ring-blue-100' } }
                      - { type: text, element: h3, content: Lucie DUBIEF, props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy mt-5' } }
                      - { type: text, element: p, content: $t:about.role.communication, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text-muted mt-1' } }

      # ── CTA ───────────────────────────────────────────────────────────
      - type: container
        element: section
        props:
          className: 'bg-navy text-white'
          'aria-labelledby': about-cta-title
        children:
          - type: container
            props:
              className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 text-center'
            children:
              - type: text
                element: h2
                content: $t:about.cta.title
                props:
                  id: about-cta-title
                  className: '[font-size:var(--text-h2)] [line-height:var(--text-h2--line-height)] [font-weight:var(--text-h2--font-weight)] [letter-spacing:var(--text-h2--letter-spacing)] text-white'
              - type: text
                element: p
                content: $t:about.cta.lead
                props:
                  className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] text-navy-100 max-w-2xl mx-auto mt-4'
              - type: flex
                props:
                  className: 'flex flex-wrap justify-center gap-3 mt-10'
                children:
                  - type: link
                    content: $t:about.cta.join
                    props:
                      href: 'https://www.helloasso.com/associations/la-plage-digitale/adhesions/adhesion-a-la-plage-digitale-2025'
                      target: _blank
                      rel: 'noopener noreferrer'
                      className: 'inline-flex items-center px-6 py-3 rounded-full font-bold text-navy bg-orange hover:bg-orange-300 transition-colors'
                  - type: link
                    content: $t:about.cta.callNumber
                    props:
                      href: 'tel:+33977425929'
                      className: 'inline-flex items-center px-6 py-3 rounded-full font-bold border-2 border-white text-white hover:bg-white hover:text-navy transition-colors'

  - component: site-footer
