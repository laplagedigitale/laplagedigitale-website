# Page: nos-activites — what the association runs ("Nous proposons…") and
# what it hosts ("Nous accueillons…").
name: nos-activites
path: /nos-activites
meta:
  favicons:
    $ref: ../favicons.yaml
  noindex: true  # pre-launch: keep out of search engines
  title: $t:activities.meta.title
  description: $t:activities.meta.description
  openGraph:
    type: website
    image: /images/pages/nos-activites/meetups.webp
components:
  - component: site-header

  - type: container
    element: section
    props:
      className: 'relative overflow-hidden bg-navy text-white'
    children:
      - type: container
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24'
        children:
          - type: text
            element: p
            content: $t:activities.eyebrow
            props:
              className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-orange mb-4'
          - type: text
            element: h1
            content: $t:activities.title
            props:
              className: '[font-size:var(--text-h1)] [line-height:var(--text-h1--line-height)] [font-weight:var(--text-h1--font-weight)] [letter-spacing:var(--text-h1--letter-spacing)] sm:[font-size:var(--text-display)] sm:[line-height:var(--text-display--line-height)] sm:[font-weight:var(--text-display--font-weight)] sm:[letter-spacing:var(--text-display--letter-spacing)] text-white max-w-3xl'
          - type: text
            element: p
            content: $t:activities.lead
            props:
              className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] text-navy-100 max-w-2xl mt-6'

  - type: container
    element: main
    props:
      className: 'bg-background'
    children:
      - type: container
        element: section
        props:
          className: 'bg-background'
          'aria-labelledby': activities-offer-title
        children:
          - type: container
            props:
              className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24'
            children:
              - type: text
                element: p
                content: $t:activities.offer.eyebrow
                props:
                  className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-magenta mb-3'
              - type: text
                element: h2
                content: $t:activities.offer.title
                props:
                  id: activities-offer-title
                  className: '[font-size:var(--text-h2)] [line-height:var(--text-h2--line-height)] [font-weight:var(--text-h2--font-weight)] [letter-spacing:var(--text-h2--letter-spacing)] text-navy'
              - type: text
                element: p
                content: $t:activities.offer.lead
                props:
                  className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] text-text-muted max-w-2xl mt-4'
              - type: grid
                props:
                  className: 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mt-12'
                children:
                  - type: container
                    element: article
                    props: { className: 'flex flex-col bg-white rounded-lg shadow-md overflow-hidden border-t-4 border-navy' }
                    interactions: { scroll: { animation: fadeInUp, once: true } }
                    children:
                      - { type: image, props: { src: /images/pages/nos-activites/conseils-de-la-plage-digitale.webp, alt: $t:activities.council.imageAlt, loading: lazy, className: 'w-full aspect-[4/3] object-cover' } }
                      - type: container
                        props: { className: 'flex flex-col flex-1 p-6' }
                        children:
                          - { type: text, element: h3, content: $t:activities.council.title, props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy' } }
                          - { type: text, element: p, content: $t:activities.council.text, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text-muted mt-3 flex-1' } }
                  - type: container
                    element: article
                    props: { className: 'flex flex-col bg-white rounded-lg shadow-md overflow-hidden border-t-4 border-blue' }
                    interactions: { scroll: { animation: fadeInUp, once: true } }
                    children:
                      - { type: image, props: { src: /images/pages/nos-activites/bibliotheque-partagee.webp, alt: $t:activities.library.imageAlt, loading: lazy, className: 'w-full aspect-[4/3] object-cover' } }
                      - type: container
                        props: { className: 'flex flex-col flex-1 p-6' }
                        children:
                          - { type: text, element: h3, content: $t:activities.library.title, props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy' } }
                          - { type: text, element: p, content: $t:activities.library.text, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text-muted mt-3 flex-1' } }
                  - type: container
                    element: article
                    props: { className: 'flex flex-col bg-white rounded-lg shadow-md overflow-hidden border-t-4 border-orange' }
                    interactions: { scroll: { animation: fadeInUp, once: true } }
                    children:
                      - { type: image, props: { src: /images/pages/nos-activites/startup-ce.webp, alt: $t:activities.startupce.imageAlt, loading: lazy, className: 'w-full aspect-[4/3] object-cover' } }
                      - type: container
                        props: { className: 'flex flex-col flex-1 p-6' }
                        children:
                          - { type: text, element: h3, content: $t:activities.startupce.title, props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy' } }
                          - { type: text, element: p, content: $t:activities.startupce.text, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text-muted mt-3 flex-1' } }
                  - type: container
                    element: article
                    props: { className: 'flex flex-col bg-white rounded-lg shadow-md overflow-hidden border-t-4 border-sage' }
                    interactions: { scroll: { animation: fadeInUp, once: true } }
                    children:
                      - { type: image, props: { src: /images/pages/nos-activites/demarche-ecologique.webp, alt: $t:activities.ecology.imageAlt, loading: lazy, className: 'w-full aspect-[4/3] object-cover' } }
                      - type: container
                        props: { className: 'flex flex-col flex-1 p-6' }
                        children:
                          - { type: text, element: h3, content: $t:activities.ecology.title, props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy' } }
                          - { type: text, element: p, content: $t:activities.ecology.text, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text-muted mt-3 flex-1' } }
      - type: container
        element: section
        props:
          className: 'bg-sand'
          'aria-labelledby': activities-host-title
        children:
          - type: container
            props:
              className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24'
            children:
              - type: text
                element: p
                content: $t:activities.host.eyebrow
                props:
                  className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-magenta mb-3'
              - type: text
                element: h2
                content: $t:activities.host.title
                props:
                  id: activities-host-title
                  className: '[font-size:var(--text-h2)] [line-height:var(--text-h2--line-height)] [font-weight:var(--text-h2--font-weight)] [letter-spacing:var(--text-h2--letter-spacing)] text-navy'
              - type: text
                element: p
                content: $t:activities.host.lead
                props:
                  className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] text-text-muted max-w-2xl mt-4'
              - type: grid
                props:
                  className: 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mt-12'
                children:
                  - type: container
                    element: article
                    props: { className: 'flex flex-col bg-white rounded-lg shadow-md overflow-hidden border-t-4 border-magenta' }
                    interactions: { scroll: { animation: fadeInUp, once: true } }
                    children:
                      - { type: image, props: { src: /images/pages/nos-activites/meetups.webp, alt: $t:activities.meetups.imageAlt, loading: lazy, className: 'w-full aspect-[4/3] object-cover' } }
                      - type: container
                        props: { className: 'flex flex-col flex-1 p-6' }
                        children:
                          - { type: text, element: h3, content: $t:activities.meetups.title, props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy' } }
                          - { type: text, element: p, content: $t:activities.meetups.text, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text-muted mt-3 flex-1' } }
                  - type: container
                    element: article
                    props: { className: 'flex flex-col bg-white rounded-lg shadow-md overflow-hidden border-t-4 border-navy' }
                    interactions: { scroll: { animation: fadeInUp, once: true } }
                    children:
                      - { type: image, props: { src: /images/pages/nos-activites/permanences-conseil.webp, alt: $t:activities.advice.imageAlt, loading: lazy, className: 'w-full aspect-[4/3] object-cover' } }
                      - type: container
                        props: { className: 'flex flex-col flex-1 p-6' }
                        children:
                          - { type: text, element: h3, content: $t:activities.advice.title, props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy' } }
                          - { type: text, element: p, content: $t:activities.advice.text, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text-muted mt-3 flex-1' } }
                  - type: container
                    element: article
                    props: { className: 'flex flex-col bg-white rounded-lg shadow-md overflow-hidden border-t-4 border-blue' }
                    interactions: { scroll: { animation: fadeInUp, once: true } }
                    children:
                      - { type: image, props: { src: /images/pages/nos-activites/hack-sxb.webp, alt: $t:activities.hack.imageAlt, loading: lazy, className: 'w-full aspect-[4/3] object-cover' } }
                      - type: container
                        props: { className: 'flex flex-col flex-1 p-6' }
                        children:
                          - { type: text, element: h3, content: $t:activities.hack.title, props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy' } }
                          - { type: text, element: p, content: $t:activities.hack.text, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text-muted mt-3 flex-1' } }
                          - type: link
                            content: $t:activities.hack.link
                            props:
                              href: 'https://www.hacksxb.com'
                              target: _blank
                              rel: 'noopener noreferrer'
                              className: 'inline-flex items-center font-bold text-navy hover:underline mt-4'
                  - type: container
                    element: article
                    props: { className: 'flex flex-col bg-white rounded-lg shadow-md overflow-hidden border-t-4 border-orange' }
                    interactions: { scroll: { animation: fadeInUp, once: true } }
                    children:
                      - { type: image, props: { src: /images/pages/nos-activites/bidouillotheque.webp, alt: $t:activities.bidouillo.imageAlt, loading: lazy, className: 'w-full aspect-[4/3] object-cover' } }
                      - type: container
                        props: { className: 'flex flex-col flex-1 p-6' }
                        children:
                          - { type: text, element: h3, content: $t:activities.bidouillo.title, props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy' } }
                          - { type: text, element: p, content: $t:activities.bidouillo.text, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text-muted mt-3 flex-1' } }

      - type: container
        element: section
        props:
          className: 'bg-orange'
          'aria-labelledby': activities-cta-title
        children:
          - type: container
            props:
              className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 text-center'
            children:
              - type: text
                element: h2
                content: $t:activities.cta.title
                props:
                  id: activities-cta-title
                  className: '[font-size:var(--text-h2)] [line-height:var(--text-h2--line-height)] [font-weight:var(--text-h2--font-weight)] [letter-spacing:var(--text-h2--letter-spacing)] text-navy'
              - type: text
                element: p
                content: $t:activities.cta.lead
                props:
                  className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] text-navy max-w-2xl mx-auto mt-4'
              - type: flex
                props:
                  className: 'flex flex-wrap justify-center gap-3 mt-10'
                children:
                  - type: link
                    content: $t:activities.cta.join
                    props:
                      href: 'https://www.helloasso.com/associations/la-plage-digitale/adhesions/adhesion-a-la-plage-digitale-2025'
                      target: _blank
                      rel: 'noopener noreferrer'
                      className: 'inline-flex items-center px-6 py-3 rounded-full font-bold bg-navy text-white hover:bg-navy-700 transition-colors'
                  - type: link
                    content: $t:activities.cta.contact
                    props:
                      href: $t:href.contact
                      className: 'inline-flex items-center px-6 py-3 rounded-full font-bold border-2 border-navy text-navy hover:bg-navy hover:text-white transition-colors'

  - component: site-footer
