# Page: formules-et-tarifs — Formules et tarifs (requests 797–802). Four plan
# cards (Flex, Nomade, Bureau fixe, Domiciliation), the comparison, the rooms,
# the membership, the questions the contracts answer, the contact band.
# Facts: 2026 contracts (Nomade, Fixe, Domiciliation, salles) and the RIA. The
# Bureau fixe term is left to the visit: its contract says both 12 months and
# monthly (open question to the association).
