# Page: nos-coworkers — six portraits of the people who work at La Plage.
# Source: WP page `nos-cowork`.
name: nos-coworkers
path: /nos-coworkers
meta:
  noindex: true  # pre-launch: keep out of search engines
  title: $t:coworkers.meta.title
  description: $t:coworkers.meta.description
  openGraph:
    type: website
    image: /images/pages/nos-cowork/bastien-remy.webp
components:
  - component: site-header

  # ── Hero ──
  - type: container
    element: section
    props:
      className: 'relative overflow-hidden bg-navy text-white'
    children:
      - type: container
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24'
        children:
          - { type: text, element: p, content: $t:coworkers.eyebrow, props: { className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-orange mb-4' } }
          - { type: text, element: h1, content: $t:coworkers.title, props: { className: '[font-size:var(--text-h1)] [line-height:var(--text-h1--line-height)] [font-weight:var(--text-h1--font-weight)] [letter-spacing:var(--text-h1--letter-spacing)] sm:[font-size:var(--text-display)] sm:[line-height:var(--text-display--line-height)] sm:[font-weight:var(--text-display--font-weight)] sm:[letter-spacing:var(--text-display--letter-spacing)] text-white max-w-4xl' } }
          - { type: text, element: p, content: $t:coworkers.lead, props: { className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] text-navy-100 max-w-2xl mt-6' } }

  # ── Profiles ──
  - type: container
    element: main
    props:
      className: 'bg-background'
    children:
      - type: container
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24'
        children:
          - type: text
            element: h2
            content: $t:coworkers.list.title
            props:
              className: 'sr-only'
          - type: grid
            props:
              className: 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6'
            children:
              - type: container
                element: article
                props:
                  className: 'flex flex-col bg-white rounded-lg shadow-md overflow-hidden border-t-4 border-navy'
                interactions: { scroll: { animation: fadeInUp, once: true } }
                children:
                  - { type: image, props: { src: /images/pages/nos-cowork/caroline-bosc.webp, alt: $t:coworkers.caroline.alt, className: 'w-full aspect-square object-cover' } }
                  - type: container
                    props:
                      className: 'flex flex-col flex-1 p-6 sm:p-8'
                    children:
                      - { type: text, element: h3, content: 'Caroline Bosc', props: { className: '[font-size:var(--text-h3)] [line-height:var(--text-h3--line-height)] [font-weight:var(--text-h3--font-weight)] text-navy' } }
                      - { type: text, element: p, content: 'Impact Positif', props: { className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-magenta mt-1' } }
                      - { type: text, element: p, content: $t:coworkers.caroline.p1, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text mt-4' } }
                      - { type: text, element: p, content: $t:coworkers.caroline.p2, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text-muted mt-3' } }
              - type: container
                element: article
                props:
                  className: 'flex flex-col bg-white rounded-lg shadow-md overflow-hidden border-t-4 border-blue'
                interactions: { scroll: { animation: fadeInUp, once: true } }
                children:
                  - { type: image, props: { src: /images/pages/nos-cowork/frederic-fuchs.webp, alt: $t:coworkers.frederic.alt, className: 'w-full aspect-square object-cover' } }
                  - type: container
                    props:
                      className: 'flex flex-col flex-1 p-6 sm:p-8'
