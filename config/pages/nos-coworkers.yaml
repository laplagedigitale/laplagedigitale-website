                children:
                  - { type: image, props: { src: /images/pages/nos-cowork/eleonore-greif.webp, alt: $t:coworkers.eleonore.alt, className: 'w-full aspect-square object-cover' } }
                  - type: container
                    props:
                      className: 'flex flex-col flex-1 p-6 sm:p-8'
                    children:
                      - { type: text, element: h3, content: 'Eléonore Greif', props: { className: '[font-size:var(--text-h3)] [line-height:var(--text-h3--line-height)] [font-weight:var(--text-h3--font-weight)] text-navy' } }
                      - { type: text, element: p, content: 'Mu.se', props: { className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-magenta mt-1' } }
                      - { type: text, element: p, content: $t:coworkers.eleonore.p1, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text mt-4' } }
                      - { type: text, element: p, content: $t:coworkers.eleonore.p2, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text-muted mt-3' } }

  # ── CTA ──
  - type: container
    element: section
    props:
      className: 'bg-navy text-white'
    children:
      - type: container
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24 text-center'
        children:
          - { type: text, element: h2, content: $t:coworkers.cta.title, props: { className: '[font-size:var(--text-h2)] [line-height:var(--text-h2--line-height)] [font-weight:var(--text-h2--font-weight)] [letter-spacing:var(--text-h2--letter-spacing)] text-white max-w-3xl mx-auto' } }
          - { type: text, element: p, content: $t:coworkers.cta.text, props: { className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] text-navy-100 max-w-2xl mx-auto mt-4' } }
          - type: flex
            props:
              className: 'flex flex-col sm:flex-row gap-4 justify-center mt-10'
            children:
              - { type: link, content: $t:coworkers.cta.pricing, props: { href: $t:href.pricing, className: 'inline-flex items-center justify-center px-6 py-3 rounded-full font-bold text-navy bg-orange hover:bg-orange-300 transition-colors' } }
              - { type: link, content: $t:coworkers.cta.companies, props: { href: $t:href.companies, className: 'inline-flex items-center justify-center px-6 py-3 rounded-full font-bold border-2 border-white text-white hover:bg-white hover:text-navy transition-colors' } }

