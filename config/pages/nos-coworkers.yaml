                      - { type: text, element: h3, content: 'Frédéric Fuchs', props: { className: '[font-size:var(--text-h3)] [line-height:var(--text-h3--line-height)] [font-weight:var(--text-h3--font-weight)] text-navy' } }
                      - { type: text, element: p, content: 'OpenClassrooms', props: { className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-magenta mt-1' } }
                      - { type: text, element: p, content: $t:coworkers.frederic.p1, props: { className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text mt-4' } }
