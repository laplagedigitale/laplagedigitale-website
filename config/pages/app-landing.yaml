# Page: app-landing — /app, where /connexion sends every session: « Mes
# espaces », one card per role, each left out of the HTML for the other roles
# (visibility). Every role is given exactly one, and the inline script
# forwards them to it straight away:
# - coworker → the Espace Membre (/espace-membre);
# - admin → the Administration de l'association (/administration), whose
#   sidebar links to their own Espace Membre when they are a coworker too;
# - editor → the Administration's « Contenu » section (/administration/contenu).
# A viewer, or a member, is given none and reads spaces.none.
name: app-landing
path: /app
sitemap: false
access: { require: authenticated, redirectTo: /connexion }
meta:
  favicons:
    $ref: ../favicons.yaml
  title: "Mes espaces — La Plage Digitale"
  noindex: true
scripts:
  inlineScripts:
    - position: body-end
      code: |
        var spaces = document.querySelectorAll('a[data-space]')
        if (spaces.length === 1) location.replace(spaces[0].getAttribute('href'))
components:
  - type: container
    element: main
    props:
      className: 'min-h-screen flex items-center justify-center bg-background p-6'
    children:
      - type: container
        props:
          className: 'w-full max-w-2xl space-y-8'
        children:
          - { type: image, props: { src: /brand/logo-couleurs.svg, alt: La Plage Digitale, className: 'h-12 w-auto' } }
          - { type: text, element: h1, content: $t:spaces.title, props: { className: 'text-3xl font-bold text-navy' } }
          - type: grid
            props:
              className: 'grid grid-cols-1 sm:grid-cols-2 gap-4'
            children:
              - type: link
                visibility: { roles: [coworker] }
                props: { href: $t:href.portal, data-space: espace-membre, className: 'block rounded-lg border border-border bg-surface p-6 hover:border-orange hover:shadow-md transition' }
                children:
                  - { type: text, element: p, content: $t:nav.portal, props: { className: 'text-xl font-bold text-navy' } }
                  - { type: text, element: p, content: $t:spaces.member, props: { className: 'text-sm text-text-muted mt-1' } }
              - type: link
                visibility: { roles: [admin] }
                props: { href: /administration, data-space: administration, className: 'block rounded-lg border border-border bg-surface p-6 hover:border-orange hover:shadow-md transition' }
                children:
                  - { type: text, element: p, content: $t:spaces.admin, props: { className: 'text-xl font-bold text-navy' } }
                  - { type: text, element: p, content: $t:spaces.admin.desc, props: { className: 'text-sm text-text-muted mt-1' } }
              - type: link
                visibility: { roles: [editor] }
                props: { href: /administration/contenu, data-space: editor, className: 'block rounded-lg border border-border bg-surface p-6 hover:border-magenta hover:shadow-md transition' }
                children:
                  - { type: text, element: p, content: $t:spaces.editor, props: { className: 'text-xl font-bold text-navy' } }
                  - { type: text, element: p, content: $t:spaces.editor.desc, props: { className: 'text-sm text-text-muted mt-1' } }
          - type: text
            element: p
            visibility: { roles: [viewer, member] }
            content: $t:spaces.none
            props: { className: 'text-text-muted' }
