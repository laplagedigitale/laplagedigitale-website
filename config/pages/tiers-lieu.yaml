# Page: tiers-lieu — Tiers-lieu / Association (requests 803–807): history,
# the regular get-togethers (always shown, so the page is never empty), hosting
# an event, the six Plagistes, supporters and networks, membership, contact.
# Bidouillothèque, shared library, Startup CE and Hack SXB are left out: not
# active in the 2026 AG and newsletter.
