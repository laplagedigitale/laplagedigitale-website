# Page: admin-flex-signups — « Inscriptions Flex », in the Administration's
# Communauté section: the first-visit sign-ups sent from /flex. The check-ins
# themselves are billing, and live in Finances (admin-finances-flex.yaml).
#
# An admin bypasses row-level rules, so the table lists every row without a
# filter. A sign-up creates no account. « Valider », on a sign-up still `new`,
# runs flex-signup-validate: it finds or creates the Pennylane customer, links
# the members row to it (and ticks association_member when they joined the
# association), invites the person as a coworker and sets Suivi to « Invité·e ».
# The button awaits the run, so a refused or failed validation shows the error
# toast; why it failed is the run's error in /_admin. « Refuser » sets the
# sign-up to `declined` through the records API.
#
# Three tabs (?onglet=a-traiter|toutes|historique): what is waiting first,
# then every sign-up (with its Source: the /flex form or Notion), then the
# Flex history imported from Notion by notion-import-flex (status
# `historique`, sorted on the first sign-up date Notion recorded). Each table
# keeps seven columns; the billing details are on the sign-up's own page
# (/administration/inscriptions-flex/:id), which carries the same two buttons.
# readOnly: a sign-up only comes from /flex or the Notion import.
name: admin-flex-signups
path: /administration/inscriptions-flex
query:
  onglet:
    default: a-traiter
    enum: [a-traiter, toutes, historique]
access: { require: [admin], redirectTo: /connexion }
meta:
  favicons:
    $ref: ../favicons.yaml
  title: "Inscriptions Flex — Administration"
  description: "Les inscriptions Flex."
  noindex: true
components:
  - type: flex
    props:
      className: 'min-h-screen flex flex-col lg:flex-row bg-background'
    children:
      - component: admin-nav

      - type: container
        element: section
        props:
          className: 'flex-1 min-w-0 px-4 py-8 sm:px-8 lg:px-12 lg:py-10 space-y-8'
        children:
          - type: container
            children:
              - { type: text, element: h1, content: $t:admin.flex.signups.title, props: { className: 'text-3xl font-bold text-navy' } }
              - { type: text, element: p, content: $t:admin.flex.signups.intro, props: { className: 'text-text-muted mt-2 max-w-2xl' } }

          - type: tabs
            defaultTab: $query.onglet
            panels:
              - { id: a-traiter, label: À traiter }
              - { id: toutes, label: Toutes }
              - { id: historique, label: Historique }
            children:
              - type: card
                props:
                  className: 'p-4 sm:p-6'
                children:
                  - type: table
                    readOnly: true
                    props:
                      id: flex-signups-new
                      aria-label: $t:admin.flex.signups
                    dataSource:
                      table: flex_signups
                      filter:
                        - { field: status, operator: eq, value: new }
                      sort:
                        - { field: created_at, direction: desc }
                      pagination: { pageSize: 25, style: numbered }
                    emptyMessage: "Aucune inscription à traiter : tout est à jour."
                    onRowClick: { type: navigate, path: '/administration/inscriptions-flex/$record.id' }
                    columns:
                      - { field: created_at, label: $t:admin.flex.signups.date, format: short-date }
                      - { field: first_name, label: $t:flex.signup.first_name }
                      - { field: last_name, label: $t:flex.signup.last_name }
                      - { field: email, label: $t:flex.signup.email }
                      - { field: company, label: $t:flex.signup.company }
                      - { field: association, label: $t:admin.flex.signups.association, format: check-cross }
                      - field: status
                        label: $t:admin.flex.signups.status
                        valueLabels:
                          new: $t:flex.signup.status.new
                          invited: $t:flex.signup.status.invited
                          declined: $t:flex.signup.status.declined
                          historique: $t:flex.signup.status.historique
                      - type: actions
                        actions:
                          - label: $t:admin.flex.signups.validate
                            visibleWhen: { field: status, eq: new }
                            confirm:
                              title: $t:admin.flex.signups.validate.title
                              message: $t:admin.flex.signups.validate.message
                              confirmLabel: $t:admin.flex.signups.validate
                            action:
                              type: automation
                              name: flex-signup-validate
                              await: true
                              inputData:
                                signupId: $record.id
                              onSuccess:
                                toast: { variant: success, message: $t:admin.flex.signups.validate.done }
                              onError:
                                toast: { variant: error, message: $t:admin.flex.signups.validate.error }
                          - label: $t:admin.flex.signups.decline
                            variant: ghost
                            visibleWhen: { field: status, eq: new }
                            confirm:
                              title: $t:admin.flex.signups.decline.title
                              message: $t:admin.flex.signups.decline.message
                              confirmLabel: $t:admin.flex.signups.decline
                            action:
                              type: fetch
                              method: PATCH
                              url: /api/tables/flex_signups/records/$record.id
                              body:
                                fields: { status: declined }
                              onSuccess:
                                type: toast
                                variant: success
                                message: $t:admin.flex.signups.decline.done
                                refetch: flex-signups-new
                              onError:
                                type: toast
                                variant: error
                                message: $t:admin.flex.signups.decline.error
              - type: card
                props:
                  className: 'p-4 sm:p-6'
                children:
                  - type: container
                    element: div
                    props:
                      role: toolbar
                      aria-label: Outils du tableau
                      className: 'mb-4 flex flex-wrap items-center gap-2'
                    children:
                      - type: search-input
                        placeholder: Rechercher un nom, un e-mail, une entreprise
                        publishes: { bindTo: admin-flex-signups, param: q }
                        props: { className: 'h-9 w-full sm:w-72', 'aria-label': Rechercher une inscription }
                  - type: table
                    readOnly: true
                    props:
                      id: flex-signups
                      aria-label: $t:admin.flex.signups
                    dataSource:
                      table: flex_signups
                      bindTo: admin-flex-signups
                      sharedFilter: {}
                      sort:
                        - { field: created_at, direction: desc }
                      pagination: { pageSize: 25, style: numbered }
                    emptyMessage: $t:admin.flex.signups.none
                    onRowClick: { type: navigate, path: '/administration/inscriptions-flex/$record.id' }
                    columns:
                      - { field: created_at, label: $t:admin.flex.signups.date, format: short-date }
                      - { field: first_name, label: $t:flex.signup.first_name }
                      - { field: last_name, label: $t:flex.signup.last_name }
                      - { field: email, label: $t:flex.signup.email }
                      - { field: company, label: $t:flex.signup.company }
                      - field: source
                        label: Source
                        valueLabels:
                          formulaire: $t:flex.signup.source.formulaire
                          notion: $t:flex.signup.source.notion
                      - field: status
                        label: $t:admin.flex.signups.status
                        valueLabels:
                          new: $t:flex.signup.status.new
                          invited: $t:flex.signup.status.invited
                          declined: $t:flex.signup.status.declined
                          historique: $t:flex.signup.status.historique
                      - type: actions
                        actions:
                          - label: $t:admin.flex.signups.validate
                            visibleWhen: { field: status, eq: new }
                            confirm:
                              title: $t:admin.flex.signups.validate.title
                              message: $t:admin.flex.signups.validate.message
                              confirmLabel: $t:admin.flex.signups.validate
                            action:
                              type: automation
                              name: flex-signup-validate
                              await: true
                              inputData:
                                signupId: $record.id
                              onSuccess:
                                toast: { variant: success, message: $t:admin.flex.signups.validate.done }
                              onError:
                                toast: { variant: error, message: $t:admin.flex.signups.validate.error }
                          - label: $t:admin.flex.signups.decline
                            variant: ghost
                            visibleWhen: { field: status, eq: new }
                            confirm:
                              title: $t:admin.flex.signups.decline.title
                              message: $t:admin.flex.signups.decline.message
                              confirmLabel: $t:admin.flex.signups.decline
                            action:
                              type: fetch
                              method: PATCH
                              url: /api/tables/flex_signups/records/$record.id
                              body:
                                fields: { status: declined }
                              onSuccess:
                                type: toast
                                variant: success
                                message: $t:admin.flex.signups.decline.done
                                refetch: flex-signups
                              onError:
                                type: toast
                                variant: error
                                message: $t:admin.flex.signups.decline.error
              - type: card
                props:
                  className: 'p-4 sm:p-6'
                children:
                  - { type: text, element: p, content: "Les flexeurs notés dans Notion avant l’app (« Mise à dispositions FLEX »), importés par notion-import-flex. Rien à valider : ils ne reçoivent ni client Pennylane ni invitation.", props: { className: 'text-sm text-text-muted mb-4 max-w-2xl' } }
                  - type: container
                    element: div
                    props:
                      role: toolbar
                      aria-label: Outils du tableau
                      className: 'mb-4 flex flex-wrap items-center gap-2'
                    children:
                      - type: search-input
                        placeholder: Rechercher un nom, un e-mail, une entreprise
                        publishes: { bindTo: admin-flex-signups-2, param: q }
                        props: { className: 'h-9 w-full sm:w-72', 'aria-label': Rechercher dans l’historique }
                  - type: table
                    readOnly: true
                    props:
                      id: flex-signups-history
                      aria-label: Historique Flex
                    dataSource:
                      table: flex_signups
                      bindTo: admin-flex-signups-2
                      sharedFilter: {}
                      filter:
                        - { field: status, operator: eq, value: historique }
                      sort:
                        - { field: first_signup_on, direction: desc }
                      pagination: { pageSize: 25, style: numbered }
                    emptyMessage: "Aucun historique : lance notion-import-flex (après notion-import-communaute) pour reprendre les flexeurs de Notion."
                    onRowClick: { type: navigate, path: '/administration/inscriptions-flex/$record.id' }
                    columns:
                      - { field: first_signup_on, label: 1ère inscription, format: short-date }
                      - { field: first_name, label: $t:flex.signup.first_name }
                      - { field: last_name, label: $t:flex.signup.last_name }
                      - { field: email, label: $t:flex.signup.email }
                      - { field: company, label: $t:flex.signup.company }
                      - { field: membership_2026, label: Cotisation 2026, format: check-cross }
                      - { field: discovery, label: Découverte }
