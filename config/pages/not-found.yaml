# Page: not-found — the app's own 404, answered for any address nothing serves.
# Without it the engine draws a generic page in English that ignores
# design.colorScheme. A coworker whose account has no `members` row yet also
# lands here from /espace-membre/*, hence the second paragraph.
name: not-found
path: /404
sitemap: false
meta:
  favicons:
    $ref: ../favicons.yaml
  noindex: true
  title: $t:notFound.meta.title
components:
  - component: site-header

  - type: container
    element: section
    props:
      className: 'bg-navy text-white'
    children:
      - type: container
        props:
          className: 'max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-28'
        children:
          - { type: text, element: p, content: '404', props: { className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-orange-300 mb-5' } }
          - { type: text, element: h1, content: $t:notFound.title, props: { className: 'text-white [font-size:var(--text-h1)] [line-height:var(--text-h1--line-height)] [font-weight:var(--text-h1--font-weight)] [letter-spacing:var(--text-h1--letter-spacing)]' } }
          - { type: text, element: p, content: $t:notFound.lead, props: { className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] text-navy-100 mt-6' } }
          - { type: text, element: p, content: $t:notFound.member, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-navy-150 mt-4' } }
          - type: flex
            props:
              className: 'flex flex-wrap gap-3 mt-10'
            children:
              - { type: link, content: $t:notFound.home, props: { href: $t:href.home, className: 'inline-flex items-center px-6 py-3 rounded-full font-bold text-navy-700 bg-orange hover:bg-orange-300 transition-colors' } }
              - { type: link, content: $t:notFound.contact, props: { href: 'mailto:contact@laplagedigitale.fr', className: 'inline-flex items-center px-6 py-3 rounded-full font-bold border-2 border-white text-white hover:bg-white hover:text-navy transition-colors' } }

  - component: site-footer
