# Page: admin-finances-invoices — every member invoice, in the
# Administration's Finances section.
#
# The invoices table is a Pennylane mirror (pennylane-sync): read-only here, a
# row opens the invoice PDF in a new tab, as on /espace-membre/factures. An
# admin bypasses row-level rules, so the grid lists every member's invoices
# without a filter.
name: admin-finances-invoices
path: /administration/finances/facturation
sitemap: false
access: { require: [admin], redirectTo: /connexion }
meta:
  favicons:
    $ref: ../favicons.yaml
  title: "Factures — Administration"
  description: "Les factures des membres."
  noindex: true
components:
  - type: flex
    props:
      className: 'min-h-screen flex flex-col lg:flex-row bg-background'
    children:
      - component: admin-nav

      - type: container
        element: section
        props:
          className: 'flex-1 min-w-0 px-4 py-8 sm:px-8 lg:px-12 lg:py-10 space-y-8'
        children:
          - type: container
            children:
              - { type: text, element: h1, content: Factures, props: { className: 'text-3xl font-bold text-navy' } }
              - { type: text, element: p, content: "Toutes les factures des membres, recopiées de Pennylane toutes les 15 minutes. Cliquez sur une facture pour ouvrir son PDF.", props: { className: 'text-text-muted mt-2 max-w-2xl' } }


          # Sub-navigation of Facturation: the sidebar marks « Facturation », these pills say which page.
          - type: container
            element: nav
            props:
              aria-label: Facturation
              className: 'flex flex-wrap gap-2 -mt-4'
            children:
              - { type: link, content: Factures, props: { href: /administration/finances/facturation, 'aria-current': page, className: 'inline-flex items-center min-h-10 px-4 rounded-full text-sm font-semibold transition-colors text-white hover:text-white bg-navy' } }
              - { type: link, content: Facturation Flex, props: { href: /administration/finances/facturation/flex, className: 'inline-flex items-center min-h-10 px-4 rounded-full text-sm font-semibold transition-colors text-navy hover:text-navy bg-white border border-navy-200 hover:bg-navy-100' } }
              - { type: link, content: Prélèvements, props: { href: /administration/finances/facturation/prelevements, className: 'inline-flex items-center min-h-10 px-4 rounded-full text-sm font-semibold transition-colors text-navy hover:text-navy bg-white border border-navy-200 hover:bg-navy-100' } }

          - type: grid
            props:
              className: 'grid grid-cols-1 sm:grid-cols-3 gap-4'
            children:
              - type: kpi
                label: Reste à encaisser (TTC)
                icon: wallet
                dataSource:
                  table: invoices
                  filter:
                    - { field: status, operator: in, value: [upcoming, late, partially_paid] }
                kpiAggregate: { function: sum, field: remaining_amount }
                kpiFormat: { type: currency, options: { currency: EUR } }
              - type: kpi
                label: Factures en retard
                icon: alarm-clock
                dataSource:
                  table: invoices
                  filter:
                    - { field: status, operator: eq, value: late }
                kpiAggregate: { function: count }
                thresholds:
                  - { value: 1, color: red }
              - type: kpi
                label: Facturé ce mois (TTC)
                icon: receipt
                dataSource:
                  table: invoices
                  filter:
                    - { field: invoice_date, operator: gte, value: $startOfMonth }
                kpiAggregate: { function: sum, field: amount }
                kpiFormat: { type: currency, options: { currency: EUR } }

          - type: card
            props:
              className: 'p-4 sm:p-6'
            children:
              - type: container
                element: div
                props:
                  role: toolbar
                  aria-label: Outils du tableau
                  className: 'mb-4 flex flex-wrap items-center gap-2'
                children:
                  - type: search-input
                    placeholder: Rechercher une facture, un membre…
                    props: { aria-label: 'Rechercher une facture, un membre…', className: 'h-9 w-full sm:w-72' }
                    publishes: { bindTo: admin-finances-invoices, param: q }
                  - type: filter-bar
                    publishes: { bindTo: admin-finances-invoices }
                    fieldsFrom: { table: invoices }
                  - type: button
                    label: Exporter en CSV
                    variant: outline
                    size: sm
                    props: { className: 'sm:ml-auto' }
                    action: { type: fetch, mode: download, url: '/api/tables/invoices/export?format=csv', filename: factures.csv }
              - type: table
                readOnly: true
                props:
                  aria-label: Factures
                onRowClick: { type: navigate, path: $record.pdf_url, openInNewTab: true }
                dataSource:
                  bindTo: admin-finances-invoices
                  sharedFilter: {}
                  table: invoices
                  sort:
                    - { field: invoice_date, direction: desc }
                  pagination: { pageSize: 50, style: numbered }
                emptyMessage: Aucune facture pour le moment.
                columns:
                  - { field: invoice_number, label: N° }
                  - { field: member_email, label: Membre }
                  - { field: label, label: Libellé, truncate: true, cellStyle: [{ when: { isNotEmpty: true }, className: 'font-medium text-navy underline underline-offset-2 cursor-pointer' }] }
                  - { field: invoice_date, label: Date, format: short-date }
                  - { field: deadline, label: Échéance, format: short-date }
                  - { field: amount, label: Montant TTC, format: currency, align: right }
                  - { field: remaining_amount, label: Reste dû, format: currency, align: right }
                  - field: status
                    label: Statut
                    valueLabels:
                      paid: Payée
                      partially_paid: Partiellement payée
                      upcoming: À venir
                      late: En retard
                      incomplete: Incomplète
                      cancelled: Annulée
                      partially_cancelled: Partiellement annulée
                      credit_note: Avoir
                      archived: Archivée
