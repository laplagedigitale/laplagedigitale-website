# Page: login — sign-in for coworkers. Accounts are opened by an admin
# invitation; there is no sign-up form on purpose (allowSignUp: false).
name: login
path: /login
meta:
  title: "Connexion — La Plage Digitale"
  description: "Espace membre des coworkers de La Plage Digitale."
  noindex: true
components:
  - component: site-header

  - type: container
    element: section
    props:
      className: 'pt-32 pb-24'
    children:
      - type: container
        props:
          className: 'max-w-md mx-auto px-4 sm:px-6'
        children:
          - type: text
            element: h1
            content: $t:login.title
            props:
              className: 'text-3xl font-bold text-gray-900 mb-2'
          - type: text
            element: p
            content: $t:login.subtitle
            props:
              className: 'text-gray-600 mb-8'
          - type: form
            action:
              type: auth
              method: login
              strategy: email
              onSuccess: { type: navigate, navigate: $t:nav.href.portal }

  - component: site-footer
