# Page: portal-partenaires — partner discounts for coworkers and members (the
# Notion « Les partenariats de La Plage » database, copied). Names and
# addresses are not translated; each advantage is a member.partners.* key.
name: portal-partenaires
path: /espace-membre/partenaires
access: { require: [coworker, admin], redirectTo: /connexion }
meta:
  favicons:
    $ref: ../favicons.yaml
  title: "Partenaires — Espace Membre"
  description: "Les partenaires de La Plage Digitale."
  noindex: true
# The signed-in member's own row: the formule gates (here and in the
# sidebar) read it.
dataSource: { table: members, mode: single, filter: [{ field: email, operator: eq, value: $currentUser.email }] }
components:
  - type: flex
    props:
      className: 'min-h-screen flex flex-col lg:flex-row bg-background'
    children:
      - component: espace-membre-nav

      - type: container
        element: main
        props:
          className: 'flex-1 min-w-0 px-4 py-8 sm:px-8 lg:px-12 lg:py-10 space-y-8'
        children:
          - type: container
            children:
              - { type: text, element: h1, content: $t:member.partners.title, props: { className: 'text-3xl font-bold text-navy' } }
              - { type: text, element: p, content: $t:member.partners.intro, props: { className: 'text-text-muted mt-2 max-w-2xl' } }

          - type: grid
            props: { className: 'grid grid-cols-1 lg:grid-cols-2 gap-6' }
            children:
              - type: card
                props: { className: 'p-5 sm:p-6 space-y-3' }
                children:
                  - { type: text, element: h2, content: $t:member.partners.food, props: { className: 'text-xl font-semibold text-navy' } }
                  - type: container
                    props: { className: 'py-3 border-t border-border first:border-t-0 space-y-1' }
                    children:
                      - { type: text, element: h3, content: "Maison Mésange", props: { className: 'font-semibold text-navy' } }
                      - { type: text, element: p, content: $t:member.partners.mesange, props: { className: 'text-sm text-navy' } }
                      - { type: text, element: p, content: "7 rue de la Mésange, Strasbourg", props: { className: 'text-xs text-text-muted' } }
                      - { type: link, content: "www.maison-mesange.fr", props: { href: 'https://www.maison-mesange.fr/', target: _blank, rel: noopener, className: 'text-xs font-semibold text-blue hover:text-navy' } }
                      - { type: text, element: p, content: $t:member.partners.lunch.terms, props: { className: 'text-xs text-text-muted' } }
                  - type: container
                    props: { className: 'py-3 border-t border-border first:border-t-0 space-y-1' }
                    children:
                      - { type: text, element: h3, content: "Aux Armes de Strasbourg", props: { className: 'font-semibold text-navy' } }
                      - { type: text, element: p, content: $t:member.partners.armes, props: { className: 'text-sm text-navy' } }
                      - { type: text, element: p, content: "9 place Gutenberg, Strasbourg", props: { className: 'text-xs text-text-muted' } }
                      - { type: link, content: "www.auxarmesdestrasbourg.com", props: { href: 'https://www.auxarmesdestrasbourg.com/', target: _blank, rel: noopener, className: 'text-xs font-semibold text-blue hover:text-navy' } }
                      - { type: text, element: p, content: $t:member.partners.lunch.terms, props: { className: 'text-xs text-text-muted' } }
                  - type: container
                    props: { className: 'py-3 border-t border-border first:border-t-0 space-y-1' }
                    children:
                      - { type: text, element: h3, content: "Le Saint-Sépulcre", props: { className: 'font-semibold text-navy' } }
                      - { type: text, element: p, content: $t:member.partners.sepulcre, props: { className: 'text-sm text-navy' } }
                      - { type: text, element: p, content: "15 rue des Orfèvres, Strasbourg", props: { className: 'text-xs text-text-muted' } }
