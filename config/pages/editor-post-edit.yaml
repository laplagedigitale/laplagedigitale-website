# Page: editor-post-edit — edit one post by id.
name: editor-post-edit
path: /editor/posts/:id
sitemap: false
access: { require: [editor, admin], redirectTo: /connexion }
meta:
  title: Modifier l'article — Espace rédaction
  description: Modifier un article.
  noindex: true
components:
  - component: editor-bar

  - type: container
    element: main
    props:
      className: 'max-w-4xl mx-auto px-4 sm:px-6 py-10'
    children:
      - { type: link, content: '← Tous les articles', props: { href: /editor, className: 'text-bodySmall text-text-muted hover:text-navy' } }
      - { type: text, element: h1, content: "Modifier l'article", props: { className: 'text-h2 text-navy mt-3 mb-8' } }
      - type: form
        dataSource: { table: posts, mode: single, param: id }
        action:
          type: crud
          operation: update
          table: posts
          onSuccess:
            type: message
            toast: { variant: success, message: Modifications enregistrées. }
        fieldGroups:
          - { label: Article, fields: [title, slug, excerpt, body] }
          - { label: Illustration, fields: [cover, legacy_cover] }
          - { label: Publication, fields: [status, published_at, categories, author] }
        fields:
          - { field: title }
          - { field: slug }
          - { field: excerpt, control: textarea }
          - { field: body }
          - { field: cover, accept: 'image/jpeg,image/png,image/webp', dropZone: true }
          - { field: legacy_cover, readOnly: true }
          - { field: status }
          - { field: published_at }
          - { field: categories }
          - { field: author }
