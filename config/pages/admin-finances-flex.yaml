# Page: admin-finances-flex — the Flex check-ins in the Administration's
# Finances section: every day of every coworker, editable in place, and what
# the next monthly invoicing will bill.
#
# An admin bypasses row-level rules, so the grid lists every row without a
# filter. It is editable on purpose — this is where a wrong duration is fixed
# (change the amount with it: 14 € a full day, 7 € a half day) or a forgotten
# day added. A row already `invoiced` is in Pennylane: correct the invoice
# there (credit note) before touching the row.
#
# The monthly invoicing runs by itself on the 1st; to preview it, trigger
# flex-invoicing with {"dryRun": true} (see config/automations/flex-invoicing.yaml).
name: admin-finances-flex
path: /administration/finances/flex
access: { require: [admin], redirectTo: /connexion }
meta:
  favicons:
    $ref: ../favicons.yaml
  title: "Flex — Administration"
  description: "Les présences Flex à facturer."
  noindex: true
components:
  - type: flex
    props:
      className: 'min-h-screen flex flex-col lg:flex-row bg-background'
    children:
      - component: admin-nav

      - type: container
        element: main
        props:
          className: 'flex-1 min-w-0 px-4 py-8 sm:px-8 lg:px-12 lg:py-10 space-y-8'
        children:
          - type: container
            children:
              - { type: text, element: h1, content: $t:admin.flex.title, props: { className: 'text-3xl font-bold text-navy' } }
              - { type: text, element: p, content: $t:admin.flex.intro, props: { className: 'text-text-muted mt-2 max-w-2xl' } }

          - type: grid
            props:
              className: 'grid grid-cols-1 sm:grid-cols-2 gap-4'
            children:
              - type: kpi
                label: $t:admin.flex.month
                icon: calendar-check
                dataSource:
                  table: checkins
                  filter:
                    - { field: date, operator: gte, value: $startOfMonth }
                kpiAggregate: { function: count }
              - type: kpi
                label: $t:admin.flex.due
                icon: wallet
                dataSource:
                  table: checkins
                  filter:
                    - { field: status, operator: eq, value: to_invoice }
                kpiAggregate: { function: sum, field: amount }
                kpiFormat: { type: currency, options: { currency: EUR } }

          - type: container
            element: section
            props:
              className: 'space-y-3'
            children:
              - { type: text, element: h2, content: $t:admin.flex.checkins, props: { className: 'text-xl font-semibold text-navy' } }
              - { type: text, element: p, content: $t:admin.flex.checkins.intro, props: { className: 'text-sm text-text-muted max-w-2xl' } }
              - type: card
                props:
                  className: 'p-4 sm:p-6'
                children:
                  - type: table
                    props:
                      aria-label: $t:admin.flex.checkins
                    dataSource:
                      table: checkins
                      sort:
                        - { field: date, direction: desc }
                      pagination: { pageSize: 50, style: numbered }
                    search:
                      placeholder: $t:admin.flex.search
                    emptyMessage: $t:flex.presences.none
                    columns:
                      - { field: date, label: $t:flex.col.date, format: short-date }
                      - { field: member_email, label: $t:admin.members.email }
                      - field: duration
                        label: $t:flex.col.duration
                        valueLabels:
                          full: $t:flex.duration.full
                          half: $t:flex.duration.half
                      - { field: amount, label: $t:flex.col.amount, format: currency, align: right }
                      - field: status
                        label: $t:flex.col.status
                        valueLabels:
                          to_invoice: $t:flex.status.to_invoice
                          invoiced: $t:flex.status.invoiced
                          offered: $t:flex.status.offered
                      - { field: pennylane_invoice_id, label: $t:admin.flex.invoice }
