# Page: admin-post-new — start a new post: its title and its address. The
# draft is created at once and opens in the editor (admin-post-edit.yaml).
name: admin-post-new
path: /administration/contenu/articles/nouveau
sitemap: false
access: { require: [editor, admin], redirectTo: /connexion }
meta:
  favicons:
    $ref: ../favicons.yaml
  title: Nouvel article — Administration
  description: Commencer un nouvel article.
  noindex: true
components:
  - type: flex
    props:
      className: 'min-h-screen flex flex-col lg:flex-row bg-background'
    children:
      - component: admin-nav

      - type: container
        element: main
        props:
          className: 'flex-1 min-w-0 px-4 py-8 sm:px-8 lg:px-12 lg:py-10 space-y-6'
        children:
          - { type: link, content: '← Tous les articles', props: { href: /administration/contenu/articles, className: 'text-sm text-text-muted hover:text-navy' } }
          - type: card
            props:
              className: 'p-6 sm:p-8 max-w-xl'
            children:
              - type: form
                formRef: post-new
                props: { headingLevel: h1 }
