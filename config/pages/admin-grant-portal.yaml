                  - { type: text, element: p, content: "Les lignes à reporter, dans l'ordre du portail : seules celles qui portent un montant. « Copier le montant », puis « Copier les précisions ».", props: { className: 'text-sm text-text-muted' } }
                  - type: table
                    readOnly: true
                    rowHeight: short
                    props: { aria-label: "Lignes du budget prévisionnel à reporter sur le portail" }
                    dataSource:
                      table: grant_budget_rows
                      filter:
                        - { field: application, operator: eq, value: $param.id }
                        - { field: level, operator: in, value: [row, total] }
                        - { field: amount, operator: neq, value: 0 }
                      sort:
                        - { field: side, direction: asc }
                        - { field: sort_order, direction: asc }
                      pagination: { pageSize: 100 }
                    emptyMessage: "Pas encore de budget : lancez « Recalculer » sur la demande."
                    columns:
                      - { field: side, label: Côté }
                      - { field: cerfa_code, label: Compte }
                      - { field: label, label: Poste, frozen: true, width: 300 }
                      - { field: amount, label: Montant, format: currency, align: right }
                      - { field: precisions, label: Précisions, width: 320 }
                      - type: actions
                        actions:
                          - label: Copier le montant
                            action: { type: clipboard, value: $record.amount, onSuccess: { toast: { variant: success, message: "Montant copié." } } }
                          - label: Copier les précisions
                            action: { type: clipboard, value: $record.precisions, onSuccess: { toast: { variant: success, message: "Précisions copiées." } } }
