                                action:
                                  type: clipboard
                                  value: $record.bank_holder
                                  onSuccess:
                                    toast: { variant: success, message: "Titulaire du compte copié." }
                          - type: flex
                            props: { className: 'flex flex-col sm:flex-row sm:items-start gap-1 sm:gap-4 py-3 border-b border-border last:border-b-0' }
                            children:
                              - { type: text, element: span, content: "IBAN", props: { className: 'sm:w-64 sm:flex-none text-sm text-text-muted' } }
                              - { type: record-field, props: { field: iban, className: 'flex-1 min-w-0 text-sm font-medium text-navy whitespace-pre-line [overflow-wrap:anywhere]' } }
                              - type: button
                                visibility: { record: { field: iban, isNotEmpty: true } }
                                content: Copier
                                props:
                                  aria-label: "Copier : IBAN"
                                  className: 'self-start inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold text-navy bg-blue-100 hover:bg-sand transition-colors'
                                action:
                                  type: clipboard
                                  value: $record.iban
                                  onSuccess:
                                    toast: { variant: success, message: "IBAN copié." }
                          - type: flex
                            props: { className: 'flex flex-col sm:flex-row sm:items-start gap-1 sm:gap-4 py-3 border-b border-border last:border-b-0' }
                            children:
                              - { type: text, element: span, content: "BIC", props: { className: 'sm:w-64 sm:flex-none text-sm text-text-muted' } }
                              - { type: record-field, props: { field: bic, className: 'flex-1 min-w-0 text-sm font-medium text-navy whitespace-pre-line [overflow-wrap:anywhere]' } }
                              - type: button
                                visibility: { record: { field: bic, isNotEmpty: true } }
                                content: Copier
                                props:
                                  aria-label: "Copier : BIC"
                                  className: 'self-start inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold text-navy bg-blue-100 hover:bg-sand transition-colors'
                                action:
                                  type: clipboard
                                  value: $record.bic
                                  onSuccess:
                                    toast: { variant: success, message: "BIC copié." }
              - type: card
                props: { className: 'p-4 sm:p-6 space-y-2' }
                children:
                  - { type: text, element: h2, content: "Pièces", props: { className: 'text-xl font-semibold text-navy' } }
                  - { type: text, element: p, content: "Les pièces de la demande, à déposer une à une sur le portail. Les fichiers sont dans la bibliothèque de la Fiche association.", props: { className: 'text-sm text-text-muted' } }
