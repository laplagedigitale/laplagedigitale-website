# Page: admin-grant-portal — the récapitulatif of a demande, laid out in the
# order of the Portail des aides (aides.strasbourg.eu): informations
# générales, the tiers, its représentants, the informations complémentaires,
# the moyens humains, the dossier, the budget prévisionnel, the bank details
# and the pièces. Read-only: each value sits beside a « Copier » button (a
# clipboard action), so the portal's screens are filled field by field
# without retyping. The association's values come from organization_profile
# and org_people through a list bound to them (the page binds the demande);
# the budget is the CERFA rows that carry an amount.
#
# Edits are made on the demande's page or the Fiche association, never here.
# Generated by hand from a short script: each row is label, value, button.
name: admin-grant-portal
path: /administration/subventions/:id/portail
sitemap: false
access: { require: [admin], redirectTo: /connexion }
meta:
  favicons:
    $ref: ../favicons.yaml
  title: "Récapitulatif portail — $record.title"
  description: "Les valeurs d'une demande de subvention, dans l'ordre du portail du financeur."
  noindex: true
dataSource: { table: grant_applications, mode: single, param: id }
components:
  - type: flex
    props:
      className: 'min-h-screen flex flex-col lg:flex-row bg-background'
    children:
      - component: admin-nav

      - type: container
        element: section
        props:
          className: 'flex-1 min-w-0 px-4 py-8 sm:px-8 lg:px-12 lg:py-10'
        children:
          - type: container
            props: { className: 'max-w-5xl space-y-6' }
            children:
              - { type: link, content: '← Retour à la demande', props: { href: '/administration/subventions/$record.id', className: 'text-sm text-text-muted hover:text-navy' } }
              - type: container
                children:
                  - { type: text, element: h1, content: "Récapitulatif pour le portail", props: { className: 'text-3xl font-bold text-navy' } }
                  - { type: text, element: p, content: "$record.title — chaque valeur dans l'ordre des écrans du portail, avec son bouton « Copier ». Une valeur vide se complète sur la page de la demande ou sur la Fiche association.", props: { className: 'text-text-muted mt-2 max-w-2xl [overflow-wrap:anywhere]' } }
              - type: card
                props: { className: 'p-4 sm:p-6' }
                children:
                  - { type: text, element: h2, content: "Informations générales", props: { className: 'text-xl font-semibold text-navy mb-1' } }
                  - { type: text, element: p, content: "L'écran d'accueil de la demande sur le portail.", props: { className: 'text-sm text-text-muted mb-2' } }
                  - type: flex
                    props: { className: 'flex flex-col sm:flex-row sm:items-start gap-1 sm:gap-4 py-3 border-b border-border last:border-b-0' }
                    children:
                      - { type: text, element: span, content: "Exercice", props: { className: 'sm:w-64 sm:flex-none text-sm text-text-muted' } }
                      - { type: record-field, props: { field: exercise_year, className: 'flex-1 min-w-0 text-sm font-medium text-navy whitespace-pre-line [overflow-wrap:anywhere]' } }
                      - type: button
                        visibility: { record: { field: exercise_year, isNotEmpty: true } }
                        content: Copier
                        props:
                          aria-label: "Copier : Exercice"
                          className: 'self-start inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold text-navy bg-blue-100 hover:bg-sand transition-colors'
                        action:
                          type: clipboard
                          value: $record.exercise_year
                          onSuccess:
                            toast: { variant: success, message: "Exercice copié." }
                  - type: flex
                    props: { className: 'flex flex-col sm:flex-row sm:items-start gap-1 sm:gap-4 py-3 border-b border-border last:border-b-0' }
                    children:
