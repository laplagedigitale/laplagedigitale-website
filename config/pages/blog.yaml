# Page: blog — "Actualités", every published post, newest first.
name: blog
path: /blog
meta:
  noindex: true  # pre-launch: keep out of search engines
  title: $t:blog.meta.title
  description: $t:blog.meta.description
  openGraph:
    type: website
    image: /images/pages/accueil/hero.webp
components:
  - component: site-header

  - type: container
    element: section
    props:
      className: 'relative overflow-hidden bg-navy text-white'
    children:
      - type: container
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24'
        children:
          - type: text
            element: p
            content: $t:blog.eyebrow
            props:
              className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-orange mb-4'
          - type: text
            element: h1
            content: $t:blog.title
            props:
              className: '[font-size:var(--text-h1)] [line-height:var(--text-h1--line-height)] [font-weight:var(--text-h1--font-weight)] [letter-spacing:var(--text-h1--letter-spacing)] sm:[font-size:var(--text-display)] sm:[line-height:var(--text-display--line-height)] sm:[font-weight:var(--text-display--font-weight)] sm:[letter-spacing:var(--text-display--letter-spacing)] text-white max-w-3xl'
          - type: text
            element: p
            content: $t:blog.lead
            props:
              className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] text-navy-100 max-w-2xl mt-6'
          - type: text
            element: p
            content: $t:blog.languageNote
            props:
              className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-blue-200 mt-4'

  - type: container
    element: main
    props:
      className: 'bg-background'
    children:
      - type: container
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 sm:py-20'
        children:
          - type: gallery
            layout: grid
            emptyMessage: $t:blog.empty
            gridColumns: { mobile: 1, md: 2, lg: 3 }
            dataSource:
              table: posts
              filter:
                - { field: status, operator: eq, value: published }
              sort:
                - { field: published_at, direction: desc }
              pagination: { pageSize: 12, style: numbered }
            galleryCard:
              coverImage: '$record.legacy_cover'
              aspectRatio: '16:9'
              children:
                - type: text
                  element: p
                  content: '$record.published_at'
                  props:
                    className: '[font-size:var(--text-caption)] [line-height:var(--text-caption--line-height)] uppercase tracking-widest text-magenta px-5 pt-5 mb-2'
                - type: text
                  element: h2
                  content: '$record.title'
                  props:
                    className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy px-5 mb-2'
                - type: text
                  element: p
                  content: '$record.excerpt'
                  props:
                    className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text-muted line-clamp-3 px-5 pb-6'
              onClick: { type: navigate, path: '/blog/$record.slug' }

  - component: site-footer
