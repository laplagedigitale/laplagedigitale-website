# Page: contact — "Informations pratiques": how to reach us, when we are open,
# where we are, and a contact form that writes into the `leads` table.
name: contact
path: /contact
meta:
  favicons:
    $ref: ../favicons.yaml
  noindex: true  # pre-launch: keep out of search engines
  title: $t:contact.meta.title
  description: $t:contact.meta.description
  openGraph:
    type: website
    image: /images/pages/site/bg-hero.webp
components:
  - component: site-header

  # ── Hero ────────────────────────────────────────────────────────────
  - type: container
    element: section
    props:
      className: 'relative overflow-hidden bg-navy text-white'
    children:
      - type: container
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24'
        children:
          - type: text
            element: p
            content: $t:contact.eyebrow
            props:
              className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-orange mb-4'
          - type: text
            element: h1
            content: $t:contact.title
            props:
              className: '[font-size:var(--text-h1)] [line-height:var(--text-h1--line-height)] [font-weight:var(--text-h1--font-weight)] [letter-spacing:var(--text-h1--letter-spacing)] sm:[font-size:var(--text-display)] sm:[line-height:var(--text-display--line-height)] sm:[font-weight:var(--text-display--font-weight)] sm:[letter-spacing:var(--text-display--letter-spacing)] text-white max-w-3xl'
          - type: text
            element: p
            content: $t:contact.lead
            props:
              className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] text-navy-100 max-w-2xl mt-6'

  - type: container
    element: main
    props:
      className: 'bg-background'
    children:
      # ── Contact cards ─────────────────────────────────────────────────
      - type: container
        element: section
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24'
          'aria-labelledby': contact-reach-title
        children:
          - type: text
            element: p
            content: $t:contact.reach.eyebrow
            props:
              className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-magenta mb-3'
          - type: text
            element: h2
            content: $t:contact.reach.title
            props:
              id: contact-reach-title
              className: '[font-size:var(--text-h2)] [line-height:var(--text-h2--line-height)] [font-weight:var(--text-h2--font-weight)] [letter-spacing:var(--text-h2--letter-spacing)] text-navy mb-10'
          - type: grid
            props:
              className: 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6'
            children:
              # Phone
              - type: container
                props:
                  className: 'bg-white rounded-lg shadow-md border-t-4 border-navy p-6'
                interactions: { scroll: { animation: fadeInUp, once: true } }
                children:
                  - type: container
                    props:
                      className: 'grid place-items-center w-12 h-12 rounded-full bg-navy-100 text-navy mb-4'
                    children:
                      - { type: icon, props: { name: phone, size: 22 } }
                  - type: text
                    element: h3
                    content: $t:contact.phone.label
                    props:
                      className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy mb-3'
                  - type: link
                    content: '09 77 42 59 29'
                    props:
                      href: 'tel:+33977425929'
                      className: 'block [font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] font-bold text-navy hover:text-magenta transition-colors'
                  - type: link
                    content: '06 24 41 32 03'
                    props:
                      href: 'tel:+33624413203'
                      className: 'block [font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] font-bold text-navy hover:text-magenta transition-colors mt-1'

              # Email
              - type: container
                props:
                  className: 'bg-white rounded-lg shadow-md border-t-4 border-blue p-6'
                interactions: { scroll: { animation: fadeInUp, once: true } }
                children:
                  - type: container
                    props:
                      className: 'grid place-items-center w-12 h-12 rounded-full bg-blue-100 text-navy mb-4'
                    children:
                      - { type: icon, props: { name: mail, size: 22 } }
                  - type: text
                    element: h3
                    content: $t:contact.email.label
                    props:
                      className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy mb-3'
                  - type: link
                    content: 'contact@laplagedigitale.fr'
                    props:
                      href: 'mailto:contact@laplagedigitale.fr'
                      className: 'block [font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] font-bold text-navy hover:text-magenta transition-colors break-all'

              # Address
              - type: container
                props:
                  className: 'bg-white rounded-lg shadow-md border-t-4 border-orange p-6'
                interactions: { scroll: { animation: fadeInUp, once: true } }
                children:
                  - type: container
                    props:
                      className: 'grid place-items-center w-12 h-12 rounded-full bg-orange-100 text-navy mb-4'
                    children:
                      - { type: icon, props: { name: map-pin, size: 22 } }
                  - type: text
                    element: h3
                    content: $t:contact.address.label
                    props:
                      className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy mb-3'
                  - type: text
                    element: p
                    content: '13 rue Jacques Peirotes<br>67000 Strasbourg'
                    props:
                      className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text'
                  - type: link
                    content: $t:contact.address.directions
                    props:
                      href: 'https://www.google.com/maps/dir/?api=1&destination=13+rue+Jacques+Peirotes+67000+Strasbourg'
                      target: _blank
                      rel: 'noopener noreferrer'
                      className: 'inline-block [font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] font-bold text-navy underline underline-offset-4 hover:text-magenta mt-3'

              # Opening hours
              - type: container
                props:
                  className: 'bg-white rounded-lg shadow-md border-t-4 border-magenta p-6'
                interactions: { scroll: { animation: fadeInUp, once: true } }
                children:
                  - type: container
                    props:
                      className: 'grid place-items-center w-12 h-12 rounded-full bg-magenta-100 text-navy mb-4'
                    children:
                      - { type: icon, props: { name: clock, size: 22 } }
                  - type: text
                    element: h3
                    content: $t:contact.hours.label
                    props:
                      className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy mb-3'
                  - type: text
                    element: p
                    content: $t:contact.hours.weekdays
                    props:
                      className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text'
                  - type: text
                    element: p
                    content: $t:contact.hours.fixed
                    props:
                      className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text-muted mt-2'

      # ── Map + form ────────────────────────────────────────────────────
      - type: container
        element: section
        props:
          className: 'bg-white'
        children:
          - type: container
            props:
              className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24'
            children:
              - type: grid
                props:
                  className: 'grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-16'
                children:
                  # Find us
                  - type: container
                    children:
                      - type: text
                        element: p
                        content: $t:contact.map.eyebrow
                        props:
                          className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-magenta mb-3'
                      - type: text
                        element: h2
                        content: $t:contact.map.title
                        props:
                          className: '[font-size:var(--text-h2)] [line-height:var(--text-h2--line-height)] [font-weight:var(--text-h2--font-weight)] [letter-spacing:var(--text-h2--letter-spacing)] text-navy mb-4'
                      - type: text
                        element: p
                        content: $t:contact.map.lead
                        props:
                          className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text-muted mb-8'
                      - type: container
                        props:
                          className: 'rounded-lg overflow-hidden shadow-md border border-border'
                        children:
                          - type: iframe
                            props:
                              src: 'https://www.google.com/maps?q=13+rue+Jacques+Peirotes+67000+Strasbourg&output=embed'
                              title: $t:contact.map.iframeTitle
                              loading: lazy
                              referrerpolicy: no-referrer-when-downgrade
                              className: 'block w-full h-80 lg:h-[28rem] border-0'

                  # Contact form
                  - type: container
                    props:
                      className: 'bg-sand rounded-lg p-6 sm:p-8 border-t-4 border-orange [&_.embedded-form]:!block [&_.embedded-form]:!w-full'
                    children:
                      - type: text
                        element: p
                        content: $t:contact.form.eyebrow
                        props:
                          className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-magenta mb-3'
                      - type: text
                        element: h2
                        content: $t:contact.form.title
                        props:
                          className: '[font-size:var(--text-h2)] [line-height:var(--text-h2--line-height)] [font-weight:var(--text-h2--font-weight)] [letter-spacing:var(--text-h2--letter-spacing)] text-navy mb-4'
                      - type: text
                        element: p
                        content: $t:contact.form.lead
                        props:
                          className: '[font-size:var(--text-body)] [line-height:var(--text-body--line-height)] [font-weight:var(--text-body--font-weight)] text-text-muted mb-8'
                      - type: form
                        formRef: contact
                        props: { headingLevel: h3 }
                      - type: text
                        element: p
                        content: $t:contact.form.privacy
                        props:
                          className: '[font-size:var(--text-caption)] [line-height:var(--text-caption--line-height)] text-text-muted mt-6'

      # ── CTA band ──────────────────────────────────────────────────────
      - type: container
        element: section
        props:
          className: 'bg-navy text-white'
        children:
          - type: container
            props:
              className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24 text-center'
            children:
              - type: text
                element: p
                content: $t:contact.cta.motif
                props:
                  className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-orange mb-4'
              - type: text
                element: h2
                content: $t:contact.cta.title
                props:
                  className: '[font-size:var(--text-h2)] [line-height:var(--text-h2--line-height)] [font-weight:var(--text-h2--font-weight)] [letter-spacing:var(--text-h2--letter-spacing)] text-white max-w-2xl mx-auto'
              - type: text
                element: p
                content: $t:contact.cta.lead
                props:
                  className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] text-navy-100 max-w-2xl mx-auto mt-4'
              - type: flex
                props:
                  className: 'flex flex-col sm:flex-row items-center justify-center gap-4 mt-10'
                children:
                  - type: link
                    content: $t:contact.cta.pricing
                    props:
                      href: $t:href.pricing
                      className: 'inline-flex items-center px-6 py-3 rounded-full font-bold text-navy bg-orange hover:bg-orange-300 transition-colors'
                  - type: link
                    content: $t:contact.cta.membership
                    props:
                      href: 'https://www.helloasso.com/associations/la-plage-digitale/adhesions/adhesion-a-la-plage-digitale-2025'
                      target: _blank
                      rel: 'noopener noreferrer'
                      className: 'inline-flex items-center px-6 py-3 rounded-full font-bold border-2 border-white text-white hover:bg-white hover:text-navy transition-colors'

  - component: site-footer
