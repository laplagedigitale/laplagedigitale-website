# Page: admin-post-edit — the article editor: a blank page to write on (the
# title, then the rich-text body) with every detail of the article in a column
# beside it — status, publication date, address, summary, categories, author
# and cover.
#
# One form on the record, `layout: main-aside`: the fields with `region: aside`
# and the save button sit in the right column from lg up, everything stacks on
# a phone.
#
# Drawn twice, gated on the status, because saving means something else:
# - a draft saves itself as you type (autoSave), nothing of it is public yet;
# - a published article saves on « Enregistrer » only (stickyActions keeps the
#   bar in view, counts the changes and asks before leaving with some), so a
#   half-written correction never goes live by itself.
# Setting a draft to « Publié » saves it like any other change; the page then
# shows the published form on its next load.
#
# A new article is created by admin-post-new (title and address), which lands
# here on the new draft.
name: admin-post-edit
path: /administration/contenu/articles/:id
sitemap: false
access: { require: [editor, admin], redirectTo: /connexion }
meta:
  favicons:
    $ref: ../favicons.yaml
  title: Éditeur — Administration
  description: Écrire et publier un article.
  noindex: true
dataSource: { table: posts, mode: single, param: id }
components:
  - type: flex
    props:
      className: 'min-h-screen flex flex-col lg:flex-row bg-background'
    children:
      - component: admin-nav

      - type: container
        element: main
        props:
          className: 'flex-1 min-w-0 px-4 py-6 sm:px-8 lg:px-10 lg:py-8 space-y-6'
        children:
          - type: flex
            props:
              className: 'flex items-center justify-between gap-4'
            children:
              - { type: link, content: '← Tous les articles', props: { href: /administration/contenu/articles, className: 'text-sm text-text-muted hover:text-navy' } }
              - { type: text, element: span, content: 'Brouillon — enregistré automatiquement', visibility: { record: { field: status, eq: draft } }, props: { className: 'text-sm text-text-muted' } }
              - type: link
                content: "Voir l'article ↗"
                visibility: { record: { field: status, eq: published } }
                props:
                  href: '/blog/$record.slug'
                  target: _blank
                  className: 'inline-flex items-center px-4 py-2 rounded-full text-sm font-semibold text-navy border border-navy-200 hover:bg-navy-100 transition-colors'

          # Draft: saves itself.
          - type: form
            visibility: { record: { field: status, eq: draft } }
            dataSource: { table: posts, mode: single, param: id }
            layout: main-aside
            asideWidth: 22rem
            showHeader: false
            # The blank page: a tall white writing area and a title set like
            # one, the body typeset as /blog/:slug prints it (blog-post.yaml).
            # The form exposes no part for them, so the classes reach in
            # (.rte / .ProseMirror is the editor's body, input[name=title] the
            # title).
            props: &editor-look
              className: "[&_input[name=title]]:text-3xl [&_input[name=title]]:font-bold [&_input[name=title]]:text-navy [&_input[name=title]]:py-3 [&_input[name=title]]:bg-white [&_.rte]:min-h-[70vh] [&_.rte]:bg-white [&_.rte]:px-6 [&_.rte]:py-5 [&_.ProseMirror]:min-h-[66vh] [&_.ProseMirror]:outline-none [&_.ProseMirror]:prose [&_.ProseMirror]:prose-lg [&_.ProseMirror]:max-w-none [&_.ProseMirror]:prose-headings:text-navy [&_.ProseMirror]:prose-a:text-magenta [&_.ProseMirror]:prose-img:rounded-lg [&_.ProseMirror]:text-text [&_.ProseMirror_h2]:!text-[1.75rem] [&_.ProseMirror_h2]:!leading-tight [&_.ProseMirror_h2]:!font-bold [&_.ProseMirror_h2]:!text-navy [&_.ProseMirror_h2]:!mt-8 [&_.ProseMirror_h2]:!mb-3 [&_.ProseMirror_h3]:!text-xl [&_.ProseMirror_h3]:!font-bold [&_.ProseMirror_h3]:!text-navy [&_.ProseMirror_h3]:!mt-6 [&_.ProseMirror_h3]:!mb-2"
            autoSave: { saveMode: auto, autoSaveDebounceMs: 1500, showSaveIndicator: true, saveIndicatorPosition: inline }
            action:
              type: crud
              operation: update
              table: posts
            fields: &editor-fields
              # The page: title, then the body.
              - { field: title, label: Titre, placeholder: "Titre de l'article" }
              - { field: body, label: Contenu, placeholder: 'Commencez à écrire…' }
              # The details, beside it.
              - { field: status, region: aside }
              - { field: published_at, region: aside }
              - { field: slug, region: aside }
              - { field: excerpt, control: textarea, region: aside }
              - { field: categories, region: aside }
              - { field: author, region: aside }
              # The file types are the column's (allowedFileTypes).
              - { field: cover, region: aside }
              - { field: legacy_cover, readOnly: true, region: aside }

          # Published: saves on « Enregistrer » only.
          - type: form
            visibility: { record: { field: status, eq: published } }
            dataSource: { table: posts, mode: single, param: id }
            layout: main-aside
            asideWidth: 22rem
            showHeader: false
            props: *editor-look
            stickyActions: true
            action:
              type: crud
              operation: update
              table: posts
              onSuccess:
                type: message
                toast: { variant: success, message: Article enregistré. }
            fields: *editor-fields
