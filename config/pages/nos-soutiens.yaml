# Page: nos-soutiens — public supporters, then labels and networks.
# Logo cards link to each organisation's site where the WordPress page did;
# the C³ label had no link of its own there (its anchor was the HelloAsso CTA).
name: nos-soutiens
path: /nos-soutiens
meta:
  noindex: true  # pre-launch: keep out of search engines
  title: $t:supporters.meta.title
  description: $t:supporters.meta.description
  openGraph:
    type: website
    image: /images/pages/accueil/hero.webp
components:
  - component: site-header

  - type: container
    element: section
    props:
      className: 'relative overflow-hidden bg-navy text-white'
    children:
      - type: container
        props:
          className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24'
        children:
          - type: text
            element: p
            content: $t:supporters.eyebrow
            props:
              className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-orange mb-4'
          - type: text
            element: h1
            content: $t:supporters.title
            props:
              className: '[font-size:var(--text-h1)] [line-height:var(--text-h1--line-height)] [font-weight:var(--text-h1--font-weight)] [letter-spacing:var(--text-h1--letter-spacing)] sm:[font-size:var(--text-display)] sm:[line-height:var(--text-display--line-height)] sm:[font-weight:var(--text-display--font-weight)] sm:[letter-spacing:var(--text-display--letter-spacing)] text-white max-w-3xl'
          - type: text
            element: p
            content: $t:supporters.lead
            props:
              className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] text-navy-100 max-w-2xl mt-6'

  - type: container
    element: main
    props:
      className: 'bg-background'
    children:
      - type: container
        element: section
        props:
          className: 'bg-background'
          'aria-labelledby': supporters-public-title
        children:
          - type: container
            props:
              className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24'
            children:
              - type: text
                element: p
                content: $t:supporters.public.eyebrow
                props:
                  className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-magenta mb-3'
              - type: text
                element: h2
                content: $t:supporters.public.title
                props:
                  id: supporters-public-title
                  className: '[font-size:var(--text-h2)] [line-height:var(--text-h2--line-height)] [font-weight:var(--text-h2--font-weight)] [letter-spacing:var(--text-h2--letter-spacing)] text-navy'
              - type: text
                element: p
                content: $t:supporters.public.lead
                props:
                  className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] text-text-muted max-w-2xl mt-4'
              - type: grid
                props:
                  className: 'grid grid-cols-1 md:grid-cols-2 gap-8 mt-12 max-w-4xl'
                children:
                  - type: link
                    props:
                      href: 'https://www.grandest.fr'
                      target: _blank
                      rel: 'noopener noreferrer'
                      className: 'group flex flex-col items-center text-center bg-white rounded-lg shadow-md p-8 hover:shadow-lg hover:-translate-y-1 transition'
                    interactions: { scroll: { animation: fadeInUp, once: true } }
                    children:
                      - { type: image, props: { src: /images/pages/nos-soutiens/region-grand-est.webp, alt: 'Région Grand Est', loading: lazy, className: 'h-20 w-full object-contain grayscale group-hover:grayscale-0 transition duration-300' } }
                      - { type: text, element: h3, content: 'Région Grand Est', props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy mt-6' } }
                      - { type: text, element: p, content: $t:supporters.region.text, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text-muted mt-2' } }
                      - { type: text, element: span, content: $t:supporters.visit, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] font-bold text-navy mt-4 group-hover:underline' } }
                  - type: link
                    props:
                      href: 'https://www.strasbourg.eu'
                      target: _blank
                      rel: 'noopener noreferrer'
                      className: 'group flex flex-col items-center text-center bg-white rounded-lg shadow-md p-8 hover:shadow-lg hover:-translate-y-1 transition'
                    interactions: { scroll: { animation: fadeInUp, once: true } }
                    children:
                      - { type: image, props: { src: /images/pages/nos-soutiens/eurometropole-strasbourg.webp, alt: 'Eurométropole de Strasbourg', loading: lazy, className: 'h-14 w-full object-contain grayscale group-hover:grayscale-0 transition duration-300' } }
                      - { type: text, element: h3, content: 'Eurométropole de Strasbourg', props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy mt-6' } }
                      - { type: text, element: p, content: $t:supporters.ems.text, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text-muted mt-2' } }
                      - { type: text, element: span, content: $t:supporters.visit, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] font-bold text-navy mt-4 group-hover:underline' } }
      - type: container
        element: section
        props:
          className: 'bg-sand'
          'aria-labelledby': supporters-networks-title
        children:
          - type: container
            props:
              className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24'
            children:
              - type: text
                element: p
                content: $t:supporters.networks.eyebrow
                props:
                  className: '[font-size:var(--text-overline)] [line-height:var(--text-overline--line-height)] [font-weight:var(--text-overline--font-weight)] [letter-spacing:var(--text-overline--letter-spacing)] uppercase text-magenta mb-3'
              - type: text
                element: h2
                content: $t:supporters.networks.title
                props:
                  id: supporters-networks-title
                  className: '[font-size:var(--text-h2)] [line-height:var(--text-h2--line-height)] [font-weight:var(--text-h2--font-weight)] [letter-spacing:var(--text-h2--letter-spacing)] text-navy'
              - type: text
                element: p
                content: $t:supporters.networks.lead
                props:
                  className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] text-text-muted max-w-2xl mt-4'
              - type: grid
                props:
                  className: 'grid grid-cols-1 md:grid-cols-2 gap-8 mt-12 max-w-4xl'
                children:
                  - type: link
                    props:
                      href: 'https://tierslieuxgrandest.org'
                      target: _blank
                      rel: 'noopener noreferrer'
                      className: 'group flex flex-col items-center text-center bg-white rounded-lg shadow-md p-8 hover:shadow-lg hover:-translate-y-1 transition'
                    interactions: { scroll: { animation: fadeInUp, once: true } }
                    children:
                      - { type: image, props: { src: /images/pages/nos-soutiens/tiers-lieux-grand-est.webp, alt: 'Tiers-Lieux Grand Est', loading: lazy, className: 'h-20 w-full object-contain grayscale group-hover:grayscale-0 transition duration-300' } }
                      - { type: text, element: h3, content: 'Tiers-Lieux Grand Est', props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy mt-6' } }
                      - { type: text, element: p, content: $t:supporters.tlge.text, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text-muted mt-2' } }
                      - { type: text, element: span, content: $t:supporters.visit, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] font-bold text-navy mt-4 group-hover:underline' } }
                  - type: container
                    element: article
                    props:
                      className: 'group flex flex-col items-center text-center bg-white rounded-lg shadow-md p-8'
                    interactions: { scroll: { animation: fadeInUp, once: true } }
                    children:
                      - { type: image, props: { src: /images/pages/nos-soutiens/centre-collaboratif-connecte.webp, alt: 'Centre Collaboratif Connecté (C³)', loading: lazy, className: 'h-20 w-full object-contain grayscale group-hover:grayscale-0 transition duration-300' } }
                      - { type: text, element: h3, content: 'Centre Collaboratif Connecté (C³)', props: { className: '[font-size:var(--text-h4)] [line-height:var(--text-h4--line-height)] [font-weight:var(--text-h4--font-weight)] text-navy mt-6' } }
                      - { type: text, element: p, content: $t:supporters.c3.text, props: { className: '[font-size:var(--text-bodySmall)] [line-height:var(--text-bodySmall--line-height)] text-text-muted mt-2' } }

      - type: container
        element: section
        props:
          className: 'bg-navy text-white'
          'aria-labelledby': supporters-cta-title
        children:
          - type: container
            props:
              className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 text-center'
            children:
              - type: text
                element: h2
                content: $t:supporters.cta.title
                props:
                  id: supporters-cta-title
                  className: '[font-size:var(--text-h2)] [line-height:var(--text-h2--line-height)] [font-weight:var(--text-h2--font-weight)] [letter-spacing:var(--text-h2--letter-spacing)] text-white'
              - type: text
                element: p
                content: $t:supporters.cta.lead
                props:
                  className: '[font-size:var(--text-lead)] [line-height:var(--text-lead--line-height)] [font-weight:var(--text-lead--font-weight)] text-navy-100 max-w-2xl mx-auto mt-4'
              - type: flex
                props:
                  className: 'flex flex-wrap justify-center gap-3 mt-10'
                children:
                  - type: link
                    content: $t:supporters.cta.join
                    props:
                      href: 'https://www.helloasso.com/associations/la-plage-digitale/adhesions/adhesion-a-la-plage-digitale-2025'
                      target: _blank
                      rel: 'noopener noreferrer'
                      className: 'inline-flex items-center px-6 py-3 rounded-full font-bold text-navy bg-orange hover:bg-orange-300 transition-colors'
                  - type: link
                    content: $t:supporters.cta.about
                    props:
                      href: $t:href.about
                      className: 'inline-flex items-center px-6 py-3 rounded-full font-bold border-2 border-white text-white hover:bg-white hover:text-navy transition-colors'

  - component: site-footer
