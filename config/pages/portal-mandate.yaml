# Page: portal-mandate — the coworker's direct-debit mandate on the Pennylane
# Compte Pro, and the button that asks Pennylane to mail them the signing link.
# The Compte Pro API gives no IBAN, so the card shows the status and the date
# signed; the signed PDF opens from the admin's Prélèvements page.
name: portal-mandate
path: /espace-membre/prelevement
access: { require: [coworker, admin], redirectTo: /connexion }
meta:
  favicons:
    $ref: ../favicons.yaml
  title: "Prélèvement — Espace Membre"
  description: "Votre prélèvement automatique."
  noindex: true
# The signed-in member's own row: the sidebar's formule gates read it.
dataSource: { table: members, mode: single, filter: [{ field: email, operator: eq, value: $currentUser.email }] }
components:
  - type: flex
    props:
      className: 'min-h-screen flex flex-col lg:flex-row bg-background'
    children:
      - component: espace-membre-nav

      - type: container
        element: main
        props:
          className: 'flex-1 min-w-0 px-4 py-8 sm:px-8 lg:px-12 lg:py-10 space-y-8'
        children:
          - type: container
            children:
              - { type: text, element: h1, content: $t:portal.mandate.title, props: { className: 'text-3xl font-bold text-navy' } }
              - { type: text, element: p, content: $t:portal.mandate.intro, props: { className: 'text-text-muted mt-2 max-w-2xl' } }

          - type: grid
            props:
              className: 'grid grid-cols-1 xl:grid-cols-3 gap-6'
            children:
              - type: card
                props:
                  className: 'xl:col-span-2 p-6 space-y-4'
                children:
                  - { type: text, element: h2, content: $t:portal.mandate.current, props: { className: 'text-xl font-semibold text-navy' } }
                  # One mandate per coworker: the latest one, drawn as facts, not
                  # as a one-row table. record-field draws the status as its
                  # option's coloured chip, with the translated label.
                  - type: list
                    dataSource:
                      table: mandates
                      filter:
                        - { field: member_email, operator: eq, value: $currentUser.email }
                      sort:
                        - { field: signed_at, direction: desc }
                      limit: 1
                    listDisplay:
                      emptyMessage: $t:portal.mandate.none
                    props:
                      # Re-read by « Vérifier mon mandat ».
                      id: mandate-card
                      className: 'list-none p-0 m-0'
                    children:
                      - type: grid
                        props:
                          className: 'grid grid-cols-1 sm:grid-cols-2 gap-4 rounded-lg border border-border p-4'
                        children:
                          - type: container
                            children:
                              - { type: text, element: p, content: $t:portal.invoices.status, props: { className: 'text-xs uppercase tracking-wide text-text-muted' } }
                              - { type: record-field, props: { field: status, className: 'mt-1' } }
                          - type: container
                            children:
                              - { type: text, element: p, content: $t:portal.mandate.since, props: { className: 'text-xs uppercase tracking-wide text-text-muted' } }
                              - { type: record-field, format: short-date, props: { field: signed_at, className: 'mt-1 text-navy' } }
                  # A list, not the bare button: `$record.email` in a fetch body is
                  # filled from a list item's row, never from the page binding or
                  # `$currentUser` (both are sent as written in 0.37).
                  - type: list
                    dataSource:
                      table: members
                      filter:
                        - { field: email, operator: eq, value: $currentUser.email }
                      limit: 1
                    props:
                      className: 'list-none p-0 m-0'
                    children:
                      # One row wraps both buttons: the gap is between them, not
                      # between list items (they share the one member row's item).
                      - type: flex
                        props:
                          className: 'flex flex-wrap items-center gap-3'
                        children:
                          - type: button
                            content: $t:portal.mandate.cta
                            props:
                              className: 'self-start w-auto inline-flex items-center px-5 py-2.5 rounded-full text-sm font-semibold text-navy bg-orange hover:bg-orange-300 transition-colors'
                            # Calls the manual trigger directly so the run's own message —
                            # sent, or why it was refused — is shown in #mandate-status.
                            action:
                              type: fetch
                              method: POST
                              url: /api/automations/request-mandate/trigger
                              # The member row's address (the list below binds it to the
                              # signed-in user): the run's three reads filter on it, which
                              # keeps an admin to their own rows. Row-level rules still
                              # apply, so a coworker naming another address is refused.
                              body: { email: $record.email }
                              onSuccess:
                                type: toast
                                message: $t:portal.mandate.done
                                status: { target: mandate-status, message: $response.output.message }
                              onError:
                                type: toast
                                message: $t:portal.mandate.error
                          # Re-reads the mandate from Pennylane now rather than at the
                          # next 15-minute sync: Pennylane sends no webhook for mandates.
                          # Same body and same status region as the request button.
                          - type: button
                            content: $t:portal.mandate.verify
                            props:
                              className: 'self-start w-auto inline-flex items-center px-5 py-2.5 rounded-full text-sm font-semibold text-navy bg-surface border border-navy hover:bg-blue-100 transition-colors'
                            action:
                              type: fetch
                              method: POST
                              url: /api/automations/verify-mandate/trigger
                              body: { email: $record.email }
                              onSuccess:
                                type: toast
                                message: $t:portal.mandate.verify.done
                                status: { target: mandate-status, message: $response.output.message }
                                refetch: mandate-card
                              onError:
                                type: toast
                                message: $t:portal.mandate.verify.error
                  # The run's own message: link sent by email, refused, or failed. The
                  # toast cannot carry it (only `status` reads $response), and a
                  # failed run still answers 200, so the outcome is told here.
                  # Hidden while empty: `!` beats the region's inline display style.
                  - type: text
                    element: p
                    props:
                      id: mandate-status
                      className: 'text-sm font-medium text-navy p-4 rounded-lg bg-blue-100 empty:hidden!'

              - type: card
                props:
                  className: 'p-6 space-y-3 bg-blue-100'
                children:
                  - { type: text, element: h2, content: $t:portal.mandate.how, props: { className: 'text-lg font-semibold text-navy' } }
                  - { type: text, element: p, content: $t:portal.mandate.how.1, props: { className: 'text-sm text-navy' } }
                  - { type: text, element: p, content: $t:portal.mandate.how.2, props: { className: 'text-sm text-navy' } }
                  - { type: text, element: p, content: $t:portal.mandate.how.3, props: { className: 'text-sm text-navy' } }
