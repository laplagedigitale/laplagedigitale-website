# Connection: sovrium-admin — this app's own admin API, called by
# pennylane-sync to read the account ids members.user_id holds, and by
# flex-signup-validate to say in its dry run whether the address already has
# an account.
#
# Only reads under /api/admin/*. Up to 0.45 it also sent the coworker
# invitation (POST /api/auth/admin/invite-user); since 0.46 an API key is
# answered 404 on every /api/auth/* route, an admin's included, and the
# invitation is the built-in `auth` action inviteUser (flex-signup-validate).
#
# INVITE_API_KEY (the name is historical): mint it in /_admin (API keys) signed
# in as an admin, then `scalingo env-set INVITE_API_KEY=…`. A key acts as its
# owner, so the owner must stay an admin. Since 0.46 a new key expires after a
# year (keys minted earlier do not), and a password reset or turning on
# two-step verification revokes every key of its owner: mint a new one then.
# Hand-written rather than installed with `sovrium library`: there is no
# library entry for the app's own API.
#
# Locally BASE_URL is a loopback address, which the outbound guard refuses:
# start with SOVRIUM_ALLOW_PRIVATE_OUTBOUND=1 to exercise it.
name: sovrium-admin
type: apiKey
label: Sovrium (admin API of this app)
description: "This app's own admin reads (account directory), authenticated with an admin API key on x-api-key"
props:
  key: $env.INVITE_API_KEY
  header: x-api-key
baseUrl: $env.BASE_URL
operations:
  # The account directory, searched by e-mail or name. An invited account is in
  # it from the invitation on, accepted or not.
  - name: get-users
    method: GET
    path: /api/admin/users
    summary: List the app's accounts, searched by e-mail or name
    params:
      q:
        in: query
        type: string
      limit:
        in: query
        type: integer
      page:
        in: query
        type: integer
