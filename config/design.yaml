# Design system — the 2026 charte graphique ("2026-02 charte plage.pdf").
#
# Palette principale: navy leads, blue / orange / magenta follow, each with
# the lighter tints the charte shows under its swatch. Magenta has no hex in
# the PDF; #cf1769 is read from the logo itself, as is sage #92aa58 (the PDF
# misprints it "#692aa58").
#
# Contrast: orange and amber are fills and accents only — navy text on them,
# never orange text on white (fails WCAG AA at body size).
#
# The charte has no dark palette: since 0.38 an app with no colorScheme
# follows the visitor's OS and paints the engine's default dark palette.
colorScheme: light

# The square mark: the rosette of public/brand/logo-couleurs.svg without the
# wordmark (the favicon). The /_admin console draws it on its sign-in card and
# at the head of its sidebar, beside the app's name — a square mark, because
# the name is already written next to it. Coral and sage read on both
# surfaces, so no srcDark.
logo:
  src: /favicon.svg
  alt: La Plage Digitale

colors:
  # Palette principale
  navy: '#273a61'
  navy-700: '#1c2b4a'
  navy-300: '#5d6a88'
  navy-200: '#929caf'
  # Muted text ON navy: navy-200 there is 4.1:1, under AA; this blue-leaning tint is 7.0:1.
  navy-150: '#bfcde6'
  navy-100: '#e4e6eb'
  blue: '#6290bc'
  blue-300: '#8fb2d6'
  blue-200: '#b5cce4'
  blue-100: '#e3ecf5'
  orange: '#f08137'
  orange-300: '#f6a66b'
  orange-200: '#f9c296'
  orange-100: '#fde3cc'
  # Orange as TEXT on white / paper / sand (≥ 4.5:1). #f08137 stays a fill.
  orange-700: '#b04f16'
  magenta: '#cf1769'
  magenta-300: '#e0538f'
  magenta-200: '#ec8bb3'
  magenta-100: '#f9dbe8'
  # Palette secondaire
  forest: '#455b32'
  sage: '#92aa58'
  amber: '#f9af25'
  coral-red: '#e83d3b'
  # Engine roles — since 0.38 the components read shadcn/ui's names, and
  # `secondary` / `accent` are neutral surfaces there (a secondary button, a
  # hover), not brand colours. The page markup never uses these utilities.
  primary: '#273a61'
  secondary: '#e4e6eb'
  secondary-foreground: '#273a61'
  accent: '#f4ede4'
  accent-foreground: '#273a61'
  foreground: '#273a61'
  card: '#ffffff'
  card-foreground: '#273a61'
  popover: '#ffffff'
  popover-foreground: '#273a61'
  muted: '#f4ede4'
  muted-foreground: '#5d6a88'
  destructive: '#e83d3b'
  input: '#929caf'
  ring: '#6290bc'
  # The Espace Membre sidebar sits on sand; the Administration's restyles its
  # own for navy (admin-nav).
  sidebar: '#f4ede4'
  sidebar-foreground: '#273a61'
  sidebar-accent: '#ffffff'
  sidebar-accent-foreground: '#273a61'
  sidebar-border: '#e4e6eb'
  sidebar-ring: '#6290bc'
  # Chart series take these by position: in 0.40 a series `color` naming a
  # token is not applied, and the default palette is grey. Each series is
  # ≥ 3:1 on white (a non-text mark): orange and orange-300 were 2.7 and 2.0.
  chart-1: '#6290bc'
  chart-2: '#d9651c'
  chart-3: '#273a61'
  chart-4: '#455b32'
  chart-5: '#cf1769'
  highlight: '#cf1769'
  success: '#92aa58'
  danger: '#e83d3b'
  background: '#fbf8f4'
  sand: '#f4ede4'
  surface: '#ffffff'
  text: '#273a61'
  text-muted: '#5d6a88'
  border: '#e4e6eb'

# The page markup's own corners. Since 0.38 the engine's components round on
# shadcn/ui's steps (`rounded-lg` a button, `rounded-xl` a card, derived from
# its `--radius`): redefining sm…xl here turned every button, field and card
# into a pill, so the charte's corners carry names of their own.
radius:
  tile: '1rem'
  panel: '1.5rem'
  full: '9999px'

elevation:
  sm: '0 1px 2px 0 rgb(39 58 97 / 0.06)'
  md: '0 8px 24px -8px rgb(39 58 97 / 0.18)'
  lg: '0 24px 48px -16px rgb(39 58 97 / 0.28)'

motion:
  animations:
    fadeInUp:
      duration: '0.6s'
      easing: ease-out
      keyframes:
        '0%': { opacity: '0', transform: 'translateY(20px)' }
        '100%': { opacity: '1', transform: 'translateY(0)' }
    fadeIn:
      duration: '0.4s'
      easing: ease-in-out
      keyframes:
        '0%': { opacity: '0' }
        '100%': { opacity: '1' }

# Sidebars: the group headings keep the small capitals they had before 0.38
# (the shadcn recipe sets them in plain case), and the entries keep their size.
components:
  # Public forms: the recipe draws 32px fields in 12px text (iOS zooms on
  # focus, and 44px is the touch target). 16px text, 44px fields and button.
  form:
    parts:
      input: h-11 text-base
      body: '[&_textarea]:min-h-32 [&_textarea]:text-base [&_.help-text]:text-sm'
      submit: h-11 px-5 text-base
      description: text-sm
  # A card's children sat 0.5rem apart before 0.38 (now 1rem): the pages'
  # cards space their own content.
  card:
    parts:
      root: gap-2
  sidebar:
    parts:
      groupLabel: h-auto py-1 uppercase tracking-wide
      link: text-md

breakpoints:
  sm: '640px'
  md: '768px'
  lg: '1024px'
  xl: '1280px'

# One face, SUSE, self-hosted as a variable font (300–800) from /fonts.
# Sizes, leading and weight live on the steps; the signage look — tight,
# heavy capitals — is the display / h1 rungs.
typeScale:
  families:
    title:
      family: 'SUSE'
      fallback: 'system-ui, sans-serif'
      url: '/fonts/fonts.css'
    body:
      family: 'SUSE'
      fallback: 'system-ui, sans-serif'
      url: '/fonts/fonts.css'

  steps:
    display:
      size: '4.5rem'
      lineHeight: 1
      weight: 800
      letterSpacing: '-0.03em'
      font: title
    h1:
      size: '3.25rem'
      lineHeight: 1.05
      weight: 800
      letterSpacing: '-0.025em'
      font: title
    h2:
      size: '2.5rem'
      lineHeight: 1.1
      weight: 700
      letterSpacing: '-0.02em'
      font: title
    h3:
      size: '1.5rem'
      lineHeight: 1.25
      weight: 700
      font: title
    h4:
      size: '1.125rem'
      lineHeight: 1.35
      weight: 600
      font: title
    lead:
      size: '1.25rem'
      lineHeight: 1.55
      weight: 400
      font: body
    body:
      size: '1rem'
      lineHeight: 1.65
      weight: 400
      font: body
    bodySmall:
      size: '0.9375rem'
      lineHeight: 1.55
      font: body
    caption:
      size: '0.8125rem'
      lineHeight: 1.4
      font: body
    overline:
      size: '0.8125rem'
      lineHeight: 1.2
      weight: 700
      letterSpacing: '0.16em'
      font: title
