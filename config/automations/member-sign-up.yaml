# Automation: member-sign-up — files a members row when a coworker or an admin
# account is created (an admin invitation or create-user). Admins are filed
# too: at La Plage they are often coworkers as well, and La Chaloupe admits
# them. The pennylane-sync cron then links the row to its Pennylane customer
# and mirrors its invoices within 15 minutes; an auth-triggered run cannot
# call another automation, so nothing is matched here.
#
# It listens to signUp, not signIn: in Sovrium 0.30 an email-and-password
# sign-in does not fire the signIn event, and no event fires on a role change.
# An existing account switched to `coworker` later therefore needs its members
# row added by hand (just the email); the next pennylane-sync links it.
name: member-sign-up
trigger:
  type: auth
  events: [signUp]
actions:
  - name: gate
    type: path
    operator: branch
    props:
      mode: first-match
      paths:
        - name: coworker
          condition:
            logic: or
            conditions:
              - { field: '{{trigger.data.user.role}}', operator: equals, value: coworker }
              - { field: '{{trigger.data.user.role}}', operator: equals, value: admin }
          actions:
            - name: fileMember
              type: record
              operator: upsert
              props:
                table: members
                filter:
                  conditions:
                    - { field: email, operator: equals, value: '{{trigger.data.user.email}}' }
                data:
                  email: '{{trigger.data.user.email}}'
                  name: '{{trigger.data.user.name}}'
        - name: other
          actions:
            - name: skip
              type: flow
              operator: stop
              props: { status: success, message: Neither a coworker nor an admin — nothing to file }
