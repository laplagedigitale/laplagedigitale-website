# Automation: request-mandate — the portal's "set up direct debit" button.
# Pennylane mails the coworker the link to sign a Compte Pro SEPA mandate.
#
# A run started by hand reads and writes as the person who started it, and
# every read below is filtered on the address the button sends (`email`, the
# signed-in user's). The filter is what keeps an admin to their own rows: the
# row-level rules on email let an admin read every member, mandate and
# request, so unfiltered reads took the first member, refused on anyone's
# active mandate and on anyone's request of the last 24 hours. For a coworker
# the rules still apply: naming another address reads no member row and is
# refused. The Pennylane customer id never comes from the browser. Refused when the account
# is not linked yet, when a mandate is already active or pending, or when a
# request was sent in the last 24 hours. Every outcome returns `message`, which
# the portal button shows inline.
name: request-mandate
trigger:
  type: manual
  label: Request a direct-debit mandate
  requiredRole: coworker
  inputSchema:
    email: { type: string }
actions:
  - name: me
    type: record
    operator: list
    props:
      table: members
      filter:
        conditions:
          - { field: email, operator: equals, value: '{{trigger.input.email}}' }
      limit: 1
  - name: mandates
    type: record
    operator: list
    props:
      table: mandates
      filter:
        conditions:
          - { field: member_email, operator: equals, value: '{{trigger.input.email}}' }
      limit: 50
  - name: lastRequest
    type: record
    operator: list
    props:
      table: mandate_requests
      filter:
        conditions:
          - { field: member_email, operator: equals, value: '{{trigger.input.email}}' }
      sort: [{ field: requested_at, direction: desc }]
      limit: 1
  - name: check
    type: code
    operator: runTypescript
    props:
      inputData:
        me: '{{steps.me.records}}'
        mandates: '{{steps.mandates.records}}'
        lastRequest: '{{steps.lastRequest.records}}'
        email: '{{trigger.input.email}}'
      code: |
        async function execute(context) {
          const refuse = (message) => ({ ok: 'no', message, memberId: '', customerId: 0, email: '' })
          const me = (context.inputData.me ?? [])[0]
          // An empty address would match nothing anyway; say so plainly.
          if (!String(context.inputData.email ?? '').trim()) {
            return refuse('La demande n’a pas pu être identifiée. Rechargez la page et réessayez.')
          }
          if (!me || !me.pennylane_customer_id) {
            return refuse('Votre compte n’est pas encore relié à Pennylane. Contactez l’équipe de La Plage Digitale.')
          }
          const live = new Set(['active', 'pending'])
          if ((context.inputData.mandates ?? []).some((m) => live.has(m.status))) {
            return refuse('Un mandat de prélèvement est déjà en place ou en cours de validation.')
          }
          const last = (context.inputData.lastRequest ?? [])[0]
          const at = last ? Date.parse(last.requested_at ?? last.createdAt) : NaN
          if (Number.isFinite(at) && Date.now() - at < 24 * 60 * 60 * 1000) {
            return refuse('Une demande a déjà été envoyée il y a moins de 24 heures. Vérifiez votre boîte mail.')
          }
          // The default message is the failure one: a run whose Pennylane call fails
          // still answers 200, and the top-level `confirm` step replaces it only on success.
          // The Compte Pro request takes the customer id alone: Pennylane writes
          // the mail and sends it to the customer's own e-mails (the invoice
          // recipients), so no recipient, subject or body is sent from here.
          return { ok: 'yes', message: 'La demande n’a pas pu être envoyée à Pennylane. Réessayez plus tard ou contactez-nous.', memberId: String(me.id), customerId: Number(me.pennylane_customer_id), email: me.email }
        }
  # A refusal is an expected outcome, not a failure: it stops the run as a
  # success so it raises no operator alert. The button reads `message` from
  # the run's output, which carries the check step's verdict either way.
  - name: route
    type: path
    operator: branch
    props:
      mode: first-match
      paths:
        - name: refused
          condition:
            conditions:
              - { field: '{{steps.check.ok}}', operator: equals, value: 'no' }
          actions:
            - name: refuse
              type: flow
              operator: stop
              props:
                status: success
                message: '{{steps.check.message}}'
                output: { message: '{{steps.check.message}}' }
        - name: send
          actions:
            - name: mail
              type: connection
              operator: call
              props:
                connection: pennylane
                operation: post-pro-account-mandate-mail-requests
                params:
                  customer_id: '{{steps.check.customerId}}'
            - name: log
              type: record
              operator: create
              props:
                table: mandate_requests
                data: { member: '{{steps.check.memberId}}', member_email: '{{steps.check.email}}' }
  # Top level, not inside `send`: the trigger answers with the top-level steps'
  # outputs merged in order, and an output produced inside a path never reaches
  # it. Only reached once `send` completed — a refusal stopped the run, a failed
  # Pennylane call failed it — so its `message` replaces check's failure default.
  - name: confirm
    type: code
    operator: runTypescript
    props:
      code: |
        async function execute(context) {
          return { message: `C’est envoyé ! Pennylane vous a envoyé par e-mail, à l’adresse de vos factures, un lien vers sa page sécurisée : saisissez votre IBAN et signez le mandat. Pensez à vérifier vos courriers indésirables. Une fois le mandat signé, revenez ici : il s’affiche sous 15 minutes.` }
        }
