# Automation: lieu-occupancy-refresh — every morning at 05:00 (Europe/Paris),
# marks each desk and locker occupied or free, with its occupant, from the
# active contracts (config/actions/lieu-occupancy-compute.yaml). A contract
# ending yesterday frees its desk this morning; one starting today takes it.
#
# On demand (admin), e.g. right after editing a contract:
#   POST /api/automations/lieu-occupancy-refresh/trigger {}                  writes
#   POST /api/automations/lieu-occupancy-refresh/trigger {"dryRun": "true"}  counts only
name: lieu-occupancy-refresh
label: Recalculer l'occupation des bureaux et casiers
description: >-
  Chaque matin, marque chaque bureau et chaque casier libre ou occupé (et par
  qui) d'après les contrats en cours.
trigger:
  type: cron
  expression: "0 5 * * *"
  timezone: Europe/Paris
timeout: 180000
concurrency:
  limit: 1
tags: [lieu]
actions:
  - name: refresh
    $ref: lieu-occupancy-compute
    $vars:
      # Absent on scheduled fires (renders empty, which writes).
      dryRun: '{{trigger.data.body.dryRun}}'
