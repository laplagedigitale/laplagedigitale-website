# Weekly Notion → Slack digest (solutions S10 + S15 of the Notion V2 plan).
#
# Every Monday 08:30 (Europe/Paris) the `build` step reads the task database
# through the `notion` connection (bearer token injected by Sovrium, cursor
# pagination in the body, adaptive page size under the 64 KiB response cap),
# composes a French mrkdwn message and, unless dry-run, upserts the week's
# row in « Indicateurs d'usage Notion ». `post` sends it through the `slack`
# connection; `assertPosted` fails the run when Slack answers 200 + ok:false.
#
# On demand (admin): POST /api/automations/notion-hebdo/trigger
#   {"dryRun": true, "channel": "C0123456789"}   → test in another channel, no metrics row
name: notion-hebdo
label: Hebdo Notion → Slack
description: >-
  Chaque lundi 08:30, publie dans #notion-hebdo d'abord les cartes bloquées (avec
  qui on attend) et en retard, puis le CA, les échéances proches, ce qui a été
  en cours, ce qui a été terminé dans la semaine et ce qui a avancé — chaque carte
  une seule fois.
trigger:
  type: cron
  expression: "30 8 * * 1"
  timezone: Europe/Paris
timeout: 300000
concurrency:
  limit: 1
tags: [notion, slack, digest]
actions:
  - name: build
    label: Lire Notion et composer le message
    type: code
    operator: runTypescript
    props:
      timeout: 240000
      inputData:
        # Absent on scheduled fires (renders empty); set by an on-demand POST body.
        dryRun: "{{trigger.data.body.dryRun}}"
        channelOverride: "{{trigger.data.body.channel}}"
        channel: $env.SLACK_CHANNEL_ID
        tasksDataSourceId: $env.NOTION_TASKS_DATA_SOURCE_ID
        metricsDataSourceId: $env.NOTION_METRICS_DATA_SOURCE_ID
      code: |
        async function execute(context) {
          const inp = context.inputData
          const TZ = 'Europe/Paris'
          const NOTION = 'https://api.notion.com/v1'
          const HEADERS = { 'Notion-Version': '2026-03-11' }
          const CLOSED = new Set(['Terminé', 'Annulé', 'Archivé'])
          const MAX_LINES = 15
          const DAY = 86400000

          const dryRun = String(inp.dryRun ?? '').toLowerCase() === 'true'
          const channel = String(inp.channelOverride ?? '').trim() || String(inp.channel ?? '').trim()
          const tasksDs = String(inp.tasksDataSourceId ?? '').trim()
          const metricsDs = String(inp.metricsDataSourceId ?? '').trim()
          if (!tasksDs) throw new Error('NOTION_TASKS_DATA_SOURCE_ID est vide')
          if (!channel) throw new Error('Aucun canal Slack (SLACK_CHANNEL_ID ou body.channel)')

          // --- Notion over the connection (token injected, 429 retried by the engine)
          const notion = async (method: string, path: string, opts: { body?: unknown; query?: Record<string, unknown> } = {}): Promise<any> => {
            let res: any
            try {
              res = await context.actions.http[method]({
                url: NOTION + path,
                connection: 'notion',
                headers: HEADERS,
                timeout: 20000,
                ...(opts.body !== undefined ? { body: opts.body } : {}),
                ...(opts.query !== undefined ? { query: opts.query } : {}),
              })
            } catch (e) {
              throw new Error(`Notion ${method.toUpperCase()} ${path} a échoué : ${e?.message ?? String(e)}`)
            }
            if (res?.truncated) throw new Error(`TRUNCATED:${path}`)
            const body = typeof res?.body === 'string' ? JSON.parse(res.body) : res?.body
            if (!body || typeof body !== 'object') throw new Error(`Notion ${path} : réponse illisible`)
            if (body.object === 'error') throw new Error(`Notion ${path} : ${body.code} ${body.message}`)
            return body
          }

          // --- dates in Europe/Paris
          const now = new Date()
          const sinceIso = new Date(now.getTime() - 7 * DAY).toISOString()
          const ymd = (d) => new Intl.DateTimeFormat('fr-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d)
          const todayYmd = ymd(now)
          const horizonYmd = ymd(new Date(now.getTime() + 14 * DAY))
          const mondayOf = (d) => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() - ((x.getUTCDay() + 6) % 7)); return x.toISOString().slice(0, 10) }
          const monday = mondayOf(todayYmd)
          const longDate = new Intl.DateTimeFormat('fr-FR', { timeZone: TZ, day: 'numeric', month: 'long', year: 'numeric' }).format(now)
          const ddmm = (iso) => `${iso.slice(8, 10)}/${iso.slice(5, 7)}`

          // --- schema: works on V1 (Status/status) and V2 (Statut/status with 4 options)
          const schema = await notion('get', `/data_sources/${tasksDs}`)
          const props = schema.properties ?? {}
          const pick = (...names) => names.find((n) => props[n] !== undefined)
          const P = {
            title: Object.keys(props).find((k) => props[k]?.type === 'title') ?? 'Task name',
            status: pick('Statut', 'Status'),
            owner: pick('Responsable'),
            priority: pick('Priorité'),
            due: pick('Date de clôture estimée'),
            ca: pick('Décision CA'),
            waiting: pick('En attente de'),
            doneOn: pick('Terminé le', 'Date de fin', 'Date de clôture'),
          }
          const statusType = P.status ? props[P.status].type : undefined
          const caIsCheckbox = !!P.ca && props[P.ca].type === 'checkbox'
          const caIsStatusOption = !caIsCheckbox && !!statusType && (props[P.status][statusType]?.options ?? []).some((o) => o.name === 'Décision CA')
          context.log.info('Propriétés détectées', JSON.stringify({ ...P, statusType }))

          // --- query: edited in the last 7 days OR still open; cursor in the body
          const filter = statusType === 'select' || statusType === 'status'
            ? { or: [
                { timestamp: 'last_edited_time', last_edited_time: { on_or_after: sinceIso } },
                { property: P.status, [statusType]: { does_not_equal: 'Terminé' } },
              ] }
            : undefined
          const pages: any[] = []
          let cursor: string | undefined
          let pageSize = 20
          for (let guard = 0; guard < 200; guard++) {
            let page: any
            try {
              page = await notion('post', `/data_sources/${tasksDs}/query`, { body: { page_size: pageSize, ...(filter ? { filter } : {}), ...(cursor ? { start_cursor: cursor } : {}) } })
            } catch (e) {
              if (String(e?.message).startsWith('TRUNCATED:') && pageSize > 5) { pageSize = Math.max(5, Math.floor(pageSize / 2)); context.log.warn('Réponse > 64 KiB, page_size →', pageSize); continue }
              throw e
            }
            pages.push(...(page.results ?? []))
            if (!page.has_more || !page.next_cursor) break
            cursor = page.next_cursor
          }

          // --- readers
          const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          const plain = (rt) => (rt ?? []).map((t) => t.plain_text ?? '').join('').trim()
          const choice = (p) => p?.select?.name ?? p?.status?.name ?? ''
          // « En attente de » may be people, text, a select or a relation: read whatever it is.
          // Relations come back as page ids, resolved to titles below for the blocked cards only.
          // A person keeps its Notion id and email (when the integration may read emails),
          // so it can be matched to a Slack account and pinged.
          const named = (names) => names.filter(Boolean).map((name) => ({ name, email: '', id: '' }))
          const waitingOf = (p) => {
            if (!p) return { people: [], relIds: [] }
            if (p.type === 'people') return { people: (p.people ?? []).map((u) => ({ name: u.name ?? '', email: u.person?.email ?? '', id: u.id ?? '' })).filter((u) => u.name || u.email), relIds: [] }
            if (p.type === 'multi_select') return { people: named((p.multi_select ?? []).map((o) => o.name)), relIds: [] }
            if (p.type === 'select' || p.type === 'status') return { people: named([choice(p)]), relIds: [] }
            if (p.type === 'rich_text') return { people: named([plain(p.rich_text)]), relIds: [] }
            if (p.type === 'formula') return { people: named([String(p.formula?.string ?? '').trim()]), relIds: [] }
            if (p.type === 'relation') return { people: [], relIds: (p.relation ?? []).map((r) => r.id).filter(Boolean) }
            return { people: [], relIds: [] }
          }
          const cards = pages.filter((pg) => !pg.archived && !pg.in_trash).map((pg) => {
            const pr = pg.properties ?? {}
            return {
              url: pg.url,
              title: plain(pr[P.title]?.title) || 'Sans titre',
              status: P.status ? choice(pr[P.status]) : '',
              owners: P.owner ? (pr[P.owner]?.people ?? []).map((u) => u.name ?? '').filter(Boolean) : [],
              priority: P.priority ? choice(pr[P.priority]) : '',
              due: P.due ? String(pr[P.due]?.date?.start ?? '').slice(0, 10) : '',
              doneOn: P.doneOn && pr[P.doneOn]?.type === 'date' ? String(pr[P.doneOn]?.date?.start ?? '').slice(0, 10) : '',
              waiting: P.waiting ? waitingOf(pr[P.waiting]) : { people: [], relIds: [] },
              ca: caIsCheckbox ? pr[P.ca]?.checkbox === true : false,
              edited: String(pg.last_edited_time ?? ''),
              editorId: pg.last_edited_by?.id,
            }
          })

          // --- sections
          const moved = cards.filter((c) => c.edited >= sinceIso)
          const blocked = cards.filter((c) => c.status === 'Bloquée')
          // Finished since the last digest: the completion date when the base has one,
          // otherwise the last edit of a « Terminé » card within the 7-day window.
          const sinceYmd = ymd(new Date(now.getTime() - 7 * DAY))
          const done = cards.filter((c) => c.status === 'Terminé' && (c.doneOn ? c.doneOn > sinceYmd : c.edited >= sinceIso))
          const awaitingCa = caIsCheckbox ? cards.filter((c) => c.ca && !CLOSED.has(c.status))
            : caIsStatusOption ? cards.filter((c) => c.status === 'Décision CA') : null
          const due = cards.filter((c) => c.due && !CLOSED.has(c.status) && c.due <= horizonYmd).sort((a, b) => a.due.localeCompare(b.due))
          const overdue = due.filter((c) => c.due < todayYmd)

          // --- relation targets of « En attente de » (blocked cards only, cached)
          const relTitles: Record<string, string> = {}
          for (const id of [...new Set(blocked.flatMap((c) => c.waiting.relIds))].slice(0, 30)) {
            try {
              const pg = await notion('get', `/pages/${id}`)
              const t = Object.values(pg.properties ?? {}).find((v: any) => v?.type === 'title') as any
              relTitles[id] = plain(t?.title)
            } catch (e) { context.log.warn('En attente de : page illisible', id) }
          }
          const waitingOn = (c) => [...c.waiting.people, ...named(c.waiting.relIds.map((id) => relTitles[id]))]

          // --- editors (distinct humans among last_edited_by)
          const users: Record<string, { name: string; bot: boolean; email: string }> = {}
          let ucursor: string | undefined
          for (let guard = 0; guard < 20; guard++) {
            const u = await notion('get', '/users', { query: { page_size: 100, ...(ucursor ? { start_cursor: ucursor } : {}) } })
            for (const x of u.results ?? []) users[x.id] = { name: x.name ?? '', bot: x.type === 'bot', email: x.person?.email ?? '' }
            if (!u.has_more || !u.next_cursor) break
            ucursor = u.next_cursor
          }
          const editorIds = [...new Set(moved.map((c) => c.editorId).filter((id) => !!id && !users[id]?.bot))]
          const editorNames = editorIds.map((id) => users[id]?.name).filter(Boolean)

          // --- Slack mentions for « En attente de »: Notion email → users.lookupByEmail.
          // Email from the person itself, else the Notion user list (by id, then by name).
          // Needs Slack scopes users:read + users:read.email; any miss falls back to the name.
          const norm = (s) => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase()
          const emailByName: Record<string, string> = {}
          for (const u of Object.values(users)) if (!u.bot && u.email && u.name) emailByName[norm(u.name)] ??= u.email
          const emailOf = (w) => w.email || (w.id && users[w.id]?.email) || emailByName[norm(w.name)] || ''
          const slackIds: Record<string, string> = {}
          let slackWarned = false
          for (const email of [...new Set(blocked.flatMap((c) => waitingOn(c).map(emailOf)).filter(Boolean))].slice(0, 30)) {
            try {
              const res = await context.actions.http.get({ url: 'https://slack.com/api/users.lookupByEmail', connection: 'slack', query: { email }, timeout: 10000 })
              const body = typeof res?.body === 'string' ? JSON.parse(res.body) : res?.body
              if (body?.ok && body.user?.id) slackIds[email] = body.user.id
              else if (body?.error !== 'users_not_found' && !slackWarned) { slackWarned = true; context.log.warn('Slack users.lookupByEmail :', body?.error ?? 'réponse illisible') }
            } catch (e) { if (!slackWarned) { slackWarned = true; context.log.warn('Slack users.lookupByEmail a échoué :', e?.message ?? String(e)) } }
          }
          const mention = (w) => { const id = slackIds[emailOf(w)]; return id ? `<@${id}>` : `*${esc(w.name || emailOf(w))}*` }

          // --- metrics history (optional; upsert on the Monday key so a replay is idempotent)
          let previous: { edited: number; editors: number } | null = null
          if (metricsDs) {
            const hist = await notion('post', `/data_sources/${metricsDs}/query`, { body: { page_size: 5, sorts: [{ property: 'Date', direction: 'descending' }] } })
            const rows = (hist.results ?? []).map((r) => ({ id: r.id, date: String(r.properties?.Date?.date?.start ?? '').slice(0, 10), edited: r.properties?.['Cartes modifiées']?.number ?? 0, editors: r.properties?.['Éditeurs']?.number ?? 0 }))
            const prev = rows.find((r) => r.date < monday)
            if (prev) previous = { edited: prev.edited, editors: prev.editors }
            if (!dryRun) {
              const properties = {
                Semaine: { title: [{ text: { content: `Semaine du ${ddmm(monday)}/${monday.slice(0, 4)}` } }] },
                Date: { date: { start: monday } },
                'Cartes modifiées': { number: moved.length },
                'Éditeurs': { number: editorIds.length },
                'Bloquées': { number: blocked.length },
                'En retard': { number: overdue.length },
              }
              const existing = rows.find((r) => r.date === monday)
              if (existing) await notion('patch', `/pages/${existing.id}`, { body: { properties } })
              else await notion('post', '/pages', { body: { parent: { type: 'data_source_id', data_source_id: metricsDs }, properties } })
            }
          }

          // --- Slack mrkdwn: urgent first, each card shown once, empty sections omitted
          const link = (c) => `<${c.url}|${esc(c.title).replace(/\|/g, '¦')}>`
          const who = (c) => (c.owners.length ? c.owners.map(esc).join(', ') : '_sans responsable_')
          const plural = (n, s, p) => (n > 1 ? p : s)
          const daysLate = (c) => Math.round((Date.parse(todayYmd) - Date.parse(c.due)) / DAY)
          const shown = new Set<string>()
          const take = (items) => items.filter((c) => !shown.has(c.url))
          const section = (title, items, render, max = MAX_LINES) => {
            if (!items.length) return null
            items.forEach((c) => shown.add(c.url))
            const rows = items.slice(0, max).map((c) => `• ${render(c)}`)
            if (items.length > max) rows.push(`_… et ${items.length - max} ${plural(items.length - max, 'autre', 'autres')}_`)
            return `${title} (${items.length})\n${rows.join('\n')}`
          }

          const blockedRender = (c) => {
            const w = waitingOn(c)
            const late = c.due && c.due < todayYmd ? ` · ${daysLate(c)} j de retard` : ''
            return `${link(c)} · ${who(c)}` + (w.length ? ` · ⏳ en attente de ${w.map(mention).join(', ')}` : ' · _on attend qui ?_') + late
          }
          const lateRender = (c) => `${link(c)} · ${who(c)} · prévu le ${ddmm(c.due)}, ${daysLate(c)} j de retard`
          const urgent = [
            section('*⛔ Bloquées*', take(blocked), blockedRender),
            section('*⏰ En retard*', take(overdue), lateRender),
          ].filter(Boolean)
          const later = [
            awaitingCa ? section('*🏛️ En attente du CA*', take(awaitingCa), (c) => `${link(c)} · ${who(c)}`) : null,
            section('*📅 À venir (14 jours)*', take(due.filter((c) => c.due >= todayYmd)), (c) => `${ddmm(c.due)} · ${link(c)} · ${who(c)}`),
            section('*🚧 En cours*', take(cards.filter((c) => c.status === 'En cours')), (c) => `${link(c)} · ${who(c)}`),
            section('*✅ Terminées cette semaine*', take(done), (c) => `${link(c)} · ${who(c)}`),
            section('*🔄 Ont avancé*', take(moved.filter((c) => !CLOSED.has(c.status))), (c) => `${link(c)} · ${who(c)}${c.status ? ` · _${esc(c.status)}_` : ''}`, 10),
          ].filter(Boolean)

          const sections: string[] = []
          sections.push(`*📋 Hebdo Notion — ${longDate}*${dryRun ? '  _(test, sans écriture)_' : ''}`)
          sections.push(urgent.length ? `*À traiter en priorité*\n\n${urgent.join('\n\n')}` : '✨ Rien de bloqué ni en retard cette semaine.')
          sections.push(...later)
          const cmp = previous ? ` (semaine précédente : ${previous.edited} ${plural(previous.edited, 'carte', 'cartes')}, ${previous.editors} ${plural(previous.editors, 'personne', 'personnes')})` : ''
          sections.push(`_${moved.length} ${plural(moved.length, 'carte modifiée', 'cartes modifiées')} par ${editorIds.length} ${plural(editorIds.length, 'personne', 'personnes')}${editorNames.length ? ` (${editorNames.map(esc).join(', ')})` : ''}${cmp} · Rituel du lundi : 15 minutes pour balayer le tableau ensemble._`)

          const text = sections.join('\n\n')
          const summary = { cards: cards.length, slackMentions: Object.keys(slackIds).length, moved: moved.length, editors: editorIds.length, blocked: blocked.length, awaitingCa: awaitingCa ? awaitingCa.length : null, due: due.length, done: done.length, overdue: overdue.length, previous, dryRun, metricsWritten: !!metricsDs && !dryRun }
          context.log.info('Résumé', JSON.stringify(summary))
          return { text, channel, summary }
        }

  - name: post
    label: Publier dans Slack
    type: connection
    operator: call
    retry:
      maxAttempts: 3
      delayMs: 5000
      strategy: exponential
    props:
      connection: slack
      operation: post-message
      timeout: 20000
      params:
        channel: "{{steps.build.channel}}"
        text: "{{steps.build.text}}"
        unfurl_links: false
        unfurl_media: false

  - name: assertPosted
    label: Échouer si Slack répond ok:false
    type: code
    operator: runTypescript
    props:
      inputData:
        ok: "{{steps.post.data.ok}}"
        error: "{{steps.post.data.error}}"
        ts: "{{steps.post.data.ts}}"
        summary: "{{steps.build.summary}}"
      code: |
        async function execute(context) {
          const { ok, error, ts, summary } = context.inputData
          if (ok !== true && String(ok) !== 'true') {
            throw new Error(`Slack a refusé le message : ${error || 'réponse sans ok:true'}`)
          }
          context.log.info('Message publié', ts)
          return { ts, ...(summary && typeof summary === 'object' ? summary : {}) }
        }
