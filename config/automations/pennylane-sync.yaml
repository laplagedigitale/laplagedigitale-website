# Automation: pennylane-sync — every 15 minutes, links every member to their
# Pennylane customer and mirrors the invoices and Compte Pro mandates of every
# linked member, so a new coworker sees all their invoices, with their status,
# at the latest 15 minutes after their members row exists.
#
#   1. link    — a member not yet linked is linked to the Pennylane customer
#                whose emails include the member's login email. Exactly one
#                match links it; none or several marks the row not_found for
#                an admin to settle (set pennylane_customer_id and
#                match_status: manual, which this step then leaves alone).
#                It also mirrors each linked member's invoice recipients (the
#                customer's emails) into billing_emails.
#   2. mirror  — one filtered read per resource (customer_id in [...]) for all
#                linked members, well inside Pennylane's 25 requests / 5 s.
#                Every run rewrites each invoice, which keeps its 30-minute
#                pdf_url fresh and its status current. Drafts and proformas
#                are never mirrored.
#   3. formules — what each member rents, for the Espace Membre: read from
#                the active Pennylane subscriptions of their customer (a
#                company's subscription counts for each of its coworkers),
#                plus `flex` for anyone who checked in over the last 90 days
#                or whose Flex sign-up was accepted (invited), so a new Flex
#                coworker sees the check-in before their first day.
#                A row an admin set by hand (formule_source: manual) is never
#                touched; a row whose formules did not change is not written.
#   4. user ids — fills members.user_id from the account directory (see the
#                step).
#
# Every step is top-level, on purpose: in Sovrium 0.30 a step nested in a
# `path` branch cannot read a sibling nested step (`{{steps.<sibling>.*}}`
# resolves to nothing). The previous version read the invoices from inside a
# branch, received an empty list and mirrored nothing. With no linked member
# the reads are filtered on customer id 0, which matches nothing.
#
# Matching lives here rather than in its own automation because in 0.30 a cron
# run cannot call another automation, and a member linked in one run should
# get their invoices in the same run.
name: pennylane-sync
trigger:
  type: cron
  expression: '*/15 * * * *'
  timezone: Europe/Paris
timeout: 300000
concurrency:
  limit: 1
actions:
  - name: members
    type: record
    operator: list
    props: { table: members, limit: 1000 }
  - name: customers
    type: connection
    operator: call
    props:
      connection: pennylane
      operation: get-customers
      params: { limit: 100 }
      paginate: all
  - name: link
    type: code
    operator: runTypescript
    props:
      inputData:
        members: '{{steps.members.records}}'
        customers: '{{steps.customers.data}}'
      code: |
        async function execute(context) {
          const norm = (s: unknown) => String(s ?? '').trim().toLowerCase()
          const byEmail = new Map<string, string[]>()
          for (const c of context.inputData.customers ?? []) {
            for (const e of new Set<string>((c.emails ?? []).map(norm))) {
              if (e) byEmail.set(e, [...(byEmail.get(e) ?? []), String(c.id)])
            }
          }
          const updates: any[] = []
          const linked: any[] = []
          for (const m of context.inputData.members ?? []) {
            const settled = (m.match_status === 'matched' || m.match_status === 'manual') && m.pennylane_customer_id
            if (settled) {
              linked.push({ id: String(m.id), email: m.email, customerId: String(m.pennylane_customer_id) })
              continue
            }
            const ids = byEmail.get(norm(m.email)) ?? []
            if (ids.length === 1) {
              updates.push({ email: m.email, pennylane_customer_id: ids[0], match_status: 'matched' })
              linked.push({ id: String(m.id), email: m.email, customerId: ids[0] })
              context.log.info(`${m.email}: linked to Pennylane customer ${ids[0]}`)
            } else {
              context.log.warn(`${m.email}: ${ids.length} Pennylane customers carry this email`)
              if (m.match_status !== 'not_found') updates.push({ email: m.email, pennylane_customer_id: '', match_status: 'not_found' })
            }
          }
          // Mirror who receives each linked member's invoices (the customer's
          // emails, one per line) into billing_emails, written only on change.
          const emailsById = new Map<string, string>()
          for (const c of context.inputData.customers ?? []) {
            emailsById.set(String(c.id), [...new Set<string>((c.emails ?? []).map(norm).filter(Boolean))].join('\n'))
          }
          for (const l of linked) {
            const m = (context.inputData.members ?? []).find((x: any) => String(x.id) === l.id)
            const billing = emailsById.get(l.customerId)
            if (!m || billing === undefined || billing === String(m.billing_emails ?? '').trim()) continue
            const u = updates.find((x) => x.email === m.email)
            if (u) u.billing_emails = billing
            else updates.push({ email: m.email, billing_emails: billing })
          }
          const ids = [...new Set(linked.map((l) => Number(l.customerId)).filter((n) => Number.isFinite(n) && n > 0))]
          context.log.info(`${linked.length} linked members, ${updates.length} member rows to update`)
          return {
            updates,
            linked,
            filter: JSON.stringify([{ field: 'customer_id', operator: 'in', value: ids.length > 0 ? ids : [0] }]),
          }
        }
  - name: saveMembers
    type: record
    operator: batchUpsert
    props:
      table: members
      items: '{{steps.link.updates}}'
      matchField: email
      continueOnItemError: true
  - name: invoices
    type: connection
    operator: call
    props:
      connection: pennylane
      operation: get-customer-invoices
      params: { filter: '{{steps.link.filter}}', limit: 100, sort: '-date' }
      paginate: all
  - name: mandates
    type: connection
    operator: call
    props:
      connection: pennylane
      operation: get-pro-account-mandates
      params: { filter: '{{steps.link.filter}}', limit: 100 }
      paginate: all
  - name: rows
    type: code
    operator: runTypescript
    props:
      inputData:
        linked: '{{steps.link.linked}}'
        invoices: '{{steps.invoices.data}}'
        mandates: '{{steps.mandates.data}}'
      code: |
        async function execute(context) {
          // A Pennylane customer shared by two members (one company, two
          // coworkers) is mirrored onto the first of them: an invoice row has
          // one owner, and pennylane_id is unique.
          const memberOf = new Map<string, any>()
          for (const l of context.inputData.linked ?? []) if (!memberOf.has(l.customerId)) memberOf.set(l.customerId, l)
          const invoiceStatuses = new Set(['paid', 'partially_paid', 'upcoming', 'late', 'incomplete', 'cancelled', 'partially_cancelled', 'credit_note', 'archived'])
          // Pennylane does not publish the Compte Pro mandate statuses (only
          // `enabled` is documented), so they are folded into our four. An
          // unknown one reads as pending and is logged, to be added here.
          // pennylane-direct-debit keeps the same rule for `active`.
          const mandateStatus = (m: any): string => {
            const s = String(m.status ?? '').toLowerCase()
            if (s === 'enabled' || s === 'active') return 'active'
            if (/fail|reject|refus|block/.test(s)) return 'failed'
            if (/disabl|revok|cancel|expir|terminat|clos/.test(s)) return 'ended'
            if (!m.pdf_url || /pend|request|wait|sent|creat/.test(s)) return 'pending'
            context.log.warn(`unknown Compte Pro mandate status "${m.status}", read as pending`)
            return 'pending'
          }
          // One row per customer: its mandate request turns into a mandate with
          // nothing to tie the two, so only the most relevant one is kept —
          // active, then pending, then failed, then ended, newest first.
          const rank: Record<string, number> = { active: 0, pending: 1, failed: 2, ended: 3 }
          const skipped = new Map<string, number>()
          const skip = (why: string) => skipped.set(why, (skipped.get(why) ?? 0) + 1)
          const num = (v: unknown) => (v === null || v === undefined || v === '' ? null : Number(v))
          const invoices: any[] = []
          for (const i of context.inputData.invoices ?? []) {
            const member = memberOf.get(String(i.customer?.id))
            if (!member) { skip('invoice of no linked member'); continue }
            if (!invoiceStatuses.has(i.status)) { skip(`invoice status ${i.status}`); continue }
            invoices.push({
              pennylane_id: String(i.id),
              member: member.id,
              member_email: member.email,
              invoice_number: i.invoice_number ?? '',
              label: i.label ?? '',
              invoice_date: i.date ?? null,
              deadline: i.deadline ?? null,
              amount: num(i.amount),
              remaining_amount: num(i.remaining_amount_with_tax),
              status: i.status,
              paid: Boolean(i.paid),
              pdf_url: i.public_file_url ?? null,
            })
          }
          const best = new Map<string, any>()
          for (const m of context.inputData.mandates ?? []) {
            const customerId = String(m.customer?.id ?? '')
            const member = memberOf.get(customerId)
            if (!member) { skip('mandate of no linked member'); continue }
            const row = {
              pennylane_id: `pro-${customerId}`,
              member: member.id,
              member_email: member.email,
              status: mandateStatus(m),
              pennylane_status: String(m.status ?? ''),
              pdf_url: m.pdf_url ?? null,
              signed_at: m.signed_at ?? null,
              created: String(m.created_at ?? ''),
            }
            const kept = best.get(customerId)
            if (!kept || rank[row.status] < rank[kept.status] || (rank[row.status] === rank[kept.status] && row.created > kept.created)) best.set(customerId, row)
          }
          const mandates = [...best.values()].map(({ created, ...row }) => row)
          const perMember = new Map<string, number>()
          for (const i of invoices) perMember.set(i.member_email, (perMember.get(i.member_email) ?? 0) + 1)
          for (const l of context.inputData.linked ?? []) context.log.info(`${l.email}: ${perMember.get(l.email) ?? 0} invoices`)
          if (skipped.size > 0) context.log.info(`skipped: ${JSON.stringify(Object.fromEntries(skipped))}`)
          context.log.info(`${invoices.length} invoices, ${mandates.length} mandates`)
          return { invoices, mandates }
        }
  - name: saveInvoices
    type: record
    operator: batchUpsert
    props:
      table: invoices
      items: '{{steps.rows.invoices}}'
      matchField: pennylane_id
      continueOnItemError: true
  - name: saveMandates
    type: record
    operator: batchUpsert
    props:
      table: mandates
      items: '{{steps.rows.mandates}}'
      matchField: pennylane_id
      continueOnItemError: true
  # Subscriptions are ~2 KiB each and a response is read up to 64 KiB, so
  # pages of 20.
  - name: subscriptions
    type: connection
    operator: call
    props:
      connection: pennylane
      operation: get-billing-subscriptions
      params: { filter: '{{steps.link.filter}}', limit: 20 }
      paginate: all
  - name: checkins
    type: record
    operator: list
    props:
      table: checkins
      sort: [{ field: date, direction: desc }]
      limit: 5000
  - name: flexSignups
    type: record
    operator: list
    props: { table: flex_signups, limit: 5000 }
  - name: formules
    type: code
    operator: runTypescript
    props:
      inputData:
        members: '{{steps.members.records}}'
        linked: '{{steps.link.linked}}'
        subscriptions: '{{steps.subscriptions.data}}'
        checkins: '{{steps.checkins.records}}'
        flexSignups: '{{steps.flexSignups.records}}'
      code: |
        async function execute(context) {
          // The total TTC of a subscription names its formule: the amounts
          // La Plage bills today (Fixe and its half-time, reduced and
          // multi-desk variants, Fixe + Nomade, Nomade, domiciliation monthly
          // or yearly, the Box offices). An amount not listed falls back to
          // the words of the label; neither leaves the subscription unread,
          // with a warning, for an admin to set by hand.
          const BY_AMOUNT: Record<string, string[]> = {
            '330': ['fixe'], '165': ['fixe'], '303.6': ['fixe'], '1320': ['fixe'],
            '540': ['fixe', 'nomade'], '210': ['nomade'],
            '48': ['domiciliation'], '576': ['domiciliation'],
            '2808': ['box'], '3120': ['box'],
          }
          const byText = (text: string): string[] => {
            const t = text.toLowerCase()
            if (/\bbox\b|bureaux? priv|sardine|clipper|sloop|go[ée]lette/.test(t)) return ['box']
            const out: string[] = []
            if (/fixe/.test(t)) out.push('fixe')
            if (/nomade/.test(t)) out.push('nomade')
            if (/domicil/.test(t)) out.push('domiciliation')
            return out
          }
          const membersOf = new Map<string, string[]>()
          for (const l of context.inputData.linked ?? []) membersOf.set(l.customerId, [...(membersOf.get(l.customerId) ?? []), l.email])
          const derived = new Map<string, Set<string>>()
          // Keyed by lower-cased email: a sign-up, a check-in and a login may not
          // spell an address alike.
          const add = (email: string, f: string) => {
            const e = email.trim().toLowerCase()
            derived.set(e, (derived.get(e) ?? new Set<string>()).add(f))
          }
          for (const s of context.inputData.subscriptions ?? []) {
            if (s.status !== 'in_progress' && s.status !== 'not_started') continue
            const amount = String(Number(s.customer_invoice_data?.amount))
            const found = BY_AMOUNT[amount] ?? byText(`${s.label ?? ''} ${s.customer_invoice_data?.pdf_invoice_subject ?? ''}`)
            if (found.length === 0) context.log.warn(`subscription ${s.id} (${amount} €): formule not recognised`)
            for (const email of membersOf.get(String(s.customer?.id)) ?? []) for (const f of found) add(email, f)
          }
          const since = new Date(Date.now() - 90 * 86400000).toISOString().slice(0, 10)
          for (const c of context.inputData.checkins ?? []) if (String(c.date ?? '') >= since && c.member_email) add(c.member_email, 'flex')
          for (const f of context.inputData.flexSignups ?? []) if (f.status === 'invited' && f.email) add(String(f.email), 'flex')

          const ORDER = ['fixe', 'nomade', 'flex', 'box', 'domiciliation']
          const updates: any[] = []
          for (const m of context.inputData.members ?? []) {
            if (m.formule_source === 'manual') continue
            const next = ORDER.filter((f) => derived.get(String(m.email).trim().toLowerCase())?.has(f))
            const current = ORDER.filter((f) => (m.formules ?? []).includes(f))
            if (next.join() === current.join()) continue
            updates.push({ email: m.email, formules: next, formule_source: 'auto' })
            context.log.info(`${m.email}: formules ${current.join('+') || '—'} → ${next.join('+') || '—'}`)
          }
          return { updates }
        }
  - name: saveFormules
    type: record
    operator: batchUpsert
    props:
      table: members
      items: '{{steps.formules.updates}}'
      matchField: email
      continueOnItemError: true
  # 4. user ids — the account id of every members row that has none yet, read
  #    from this app's own user directory (connection sovrium-admin, the
  #    INVITE_API_KEY admin key). member-email-sync follows it when a coworker
  #    changes their e-mail; member-sign-up sets it on new accounts and
  #    member-email-sync on each sign-in, so this only catches rows filed
  #    before user_id existed. Skipped without the key; a failure is logged and
  #    never fails the sync.
  - name: userIds
    type: code
    operator: runTypescript
    props:
      timeout: 60000
      inputData:
        members: '{{steps.members.records}}'
      code: |
        async function execute(context) {
          const norm = (s: unknown) => String(s ?? '').trim().toLowerCase()
          const missing = ((context.inputData.members ?? []) as any[]).filter((m) => !m.user_id)
          if (missing.length === 0) return { filled: 0 }
          if (!String(context.env.INVITE_API_KEY ?? '').trim()) {
            context.log.warn(`${missing.length} members rows without user_id, and no INVITE_API_KEY to read the accounts`)
            return { filled: 0 }
          }
          const ids = new Map<string, string>()
          try {
            for (let page = 1; page <= 50; page++) {
              const r: any = await context.actions.connection.call({ connection: 'sovrium-admin', operation: 'get-users', params: { limit: 200, page } })
              const users: any[] = r?.data?.users ?? []
              for (const u of users) if (u.id && u.email) ids.set(norm(u.email), String(u.id))
              if (users.length < 200) break
            }
          } catch (error) {
            context.log.error(`account directory not read — ${String((error as any)?.message ?? error)}`)
            return { filled: 0 }
          }
          let filled = 0
          for (const m of missing) {
            const id = ids.get(norm(m.email))
            if (!id) continue
            await context.actions.record.update({ table: 'members', id: String(m.id), data: { user_id: id } })
            filled++
          }
          context.log.info(`${filled} of ${missing.length} members rows given their user_id`)
          return { filled }
        }
