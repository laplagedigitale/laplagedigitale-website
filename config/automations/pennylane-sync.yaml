# Automation: pennylane-sync — mirrors the invoices and GoCardless mandates of
# every linked member from Pennylane, every 15 minutes.
#
# One filtered read per resource (customer_id in [...]) whatever the number of
# members, well inside Pennylane's 25 requests / 5 s. Every run rewrites each
# invoice, which keeps its 30-minute pdf_url fresh and its status current.
# Drafts and proformas are never mirrored.
name: pennylane-sync
trigger:
  type: cron
  expression: '*/15 * * * *'
  timezone: Europe/Paris
actions:
  - name: linked
    type: record
    operator: list
    props:
      table: members
      filter:
        conditions:
          - { field: pennylane_customer_id, operator: isNotEmpty }
      limit: 1000
  - name: plan
    type: code
    operator: runTypescript
    props:
      inputData: { members: '{{steps.linked.records}}' }
      code: |
        async function execute(context) {
          const members = context.inputData.members ?? []
          const ids = members.map((m) => Number(m.pennylane_customer_id)).filter((n) => Number.isFinite(n) && n > 0)
          return {
            any: ids.length > 0 ? 'yes' : 'no',
            filter: JSON.stringify([{ field: 'customer_id', operator: 'in', value: ids }]),
          }
        }
  - name: route
    type: path
    operator: branch
    props:
      mode: first-match
      paths:
        - name: nobody
          condition:
            conditions:
              - { field: '{{steps.plan.any}}', operator: equals, value: 'no' }
          actions:
            - name: done
              type: flow
              operator: stop
              props: { status: success, message: No linked member yet }
        - name: sync
          actions:
            - name: invoices
              type: connection
              operator: call
              props:
                connection: pennylane
                operation: get-customer-invoices
                params: { filter: '{{steps.plan.filter}}', limit: 100, sort: '-date' }
                paginate: all
            - name: mandates
              type: connection
              operator: call
              props:
                connection: pennylane
                operation: get-gocardless-mandates
                params: { filter: '{{steps.plan.filter}}', limit: 100 }
                paginate: all
            - name: rows
              type: code
              operator: runTypescript
              props:
                inputData:
                  members: '{{steps.linked.records}}'
                  invoices: '{{steps.invoices.data}}'
                  mandates: '{{steps.mandates.data}}'
                code: |
                  async function execute(context) {
                    const memberOf = new Map()
                    for (const m of context.inputData.members ?? []) memberOf.set(String(m.pennylane_customer_id), { id: String(m.id), email: m.email })
                    const invoiceStatuses = new Set(['paid', 'partially_paid', 'upcoming', 'late', 'incomplete', 'cancelled', 'partially_cancelled', 'credit_note', 'archived'])
                    const mandateStatuses = new Set(['active', 'pending_customer_approval', 'pending_submission', 'submitted', 'failed', 'blocked', 'bank_disconnected', 'cancelled', 'expired', 'consumed', 'replaced'])
                    const num = (v) => (v === null || v === undefined || v === '' ? null : Number(v))
                    const invoices = []
                    for (const i of context.inputData.invoices ?? []) {
                      const member = memberOf.get(String(i.customer?.id))
                      if (!member || !invoiceStatuses.has(i.status)) continue
                      invoices.push({
                        pennylane_id: String(i.id),
                        member: member.id,
                        member_email: member.email,
                        invoice_number: i.invoice_number ?? '',
                        label: i.label ?? '',
                        invoice_date: i.date ?? null,
                        deadline: i.deadline ?? null,
                        amount: num(i.amount),
                        remaining_amount: num(i.remaining_amount_with_tax),
                        status: i.status,
                        paid: Boolean(i.paid),
                        pdf_url: i.public_file_url ?? null,
                      })
                    }
                    const mandates = []
                    for (const m of context.inputData.mandates ?? []) {
                      const member = memberOf.get(String(m.customer?.id))
                      if (!member || !mandateStatuses.has(m.status)) continue
                      mandates.push({
                        pennylane_id: String(m.id),
                        member: member.id,
                        member_email: member.email,
                        status: m.status,
                        bank_account: m.external_customer_account ?? '',
                        signed_at: m.created_at ?? null,
                      })
                    }
                    context.log.info(`${invoices.length} invoices, ${mandates.length} mandates`)
                    return { invoices, mandates }
                  }
            - name: saveInvoices
              type: record
              operator: batchUpsert
              props:
                table: invoices
                items: '{{steps.rows.invoices}}'
                matchField: pennylane_id
                continueOnItemError: true
            - name: saveMandates
              type: record
              operator: batchUpsert
              props:
                table: mandates
                items: '{{steps.rows.mandates}}'
                matchField: pennylane_id
                continueOnItemError: true
