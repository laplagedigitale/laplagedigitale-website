# Automation: pennylane-match-pending — links every member not yet linked to
# the Pennylane customer whose emails include the member's login email.
# Exactly one match links it; none or several marks the row not_found for an
# admin to settle by hand (set pennylane_customer_id and match_status: manual).
#
# Runs every 30 minutes, so a customer created in Pennylane after the account
# is picked up on its own. The matching is inline: in 0.30 neither a cron nor
# an auth-triggered run may call another automation.
#
# Every step is top-level: in 0.30 a step nested in a loop or a path branch
# cannot read a sibling nested step (`{{steps.<sibling>.*}}` resolves to
# nothing), which once left the update with no values. So the customers are
# read once, every member is classified in one code step, and the result is
# written in one batch. With nothing pending the run still reads the customers
# (a `stop` inside a branch ends only the branch) and writes an empty batch.
name: pennylane-match-pending
trigger:
  type: cron
  expression: '*/30 * * * *'
  timezone: Europe/Paris
actions:
  - name: pending
    type: record
    operator: list
    props:
      table: members
      # Two `notEquals` rather than an `or` of `equals`: an `or` filter on a
      # list step matched no row in 0.30.
      filter:
        conditions:
          - { field: match_status, operator: notEquals, value: matched }
          - { field: match_status, operator: notEquals, value: manual }
      limit: 500
  - name: customers
    type: connection
    operator: call
    props:
      connection: pennylane
      operation: get-customers
      params: { limit: 100 }
      paginate: all
  - name: classify
    type: code
    operator: runTypescript
    props:
      inputData:
        members: '{{steps.pending.records}}'
        customers: '{{steps.customers.data}}'
      code: |
        async function execute(context) {
          const norm = (s: unknown) => String(s ?? '').trim().toLowerCase()
          const byEmail = new Map<string, string[]>()
          for (const c of context.inputData.customers ?? []) {
            for (const e of new Set<string>((c.emails ?? []).map(norm))) {
              if (e) byEmail.set(e, [...(byEmail.get(e) ?? []), String(c.id)])
            }
          }
          const rows = (context.inputData.members ?? []).map((m: any) => {
            const ids = byEmail.get(norm(m.email)) ?? []
            if (ids.length !== 1) context.log.warn(`${m.email}: ${ids.length} Pennylane customers carry this email`)
            return ids.length === 1
              ? { email: m.email, pennylane_customer_id: ids[0], match_status: 'matched' }
              : { email: m.email, pennylane_customer_id: '', match_status: 'not_found' }
          })
          context.log.info(`${rows.filter((r: any) => r.match_status === 'matched').length}/${rows.length} matched`)
          return { rows }
        }
  - name: save
    type: record
    operator: batchUpsert
    props:
      table: members
      items: '{{steps.classify.rows}}'
      matchField: email
      continueOnItemError: true
