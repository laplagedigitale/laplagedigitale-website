# Automation: lead-notify — mails every contact-form submission to the team
# inbox (LEADS_NOTIFY_EMAIL, contact@laplagedigitale.fr by default), so a
# request is seen the day it arrives rather than when someone opens the
# Administration. « Répondre » in the mail client answers the visitor directly
# (replyTo is their address).
#
# The visitor's text is run data: the email action renders it as text, so a
# message cannot slip a link or markup into the mail. A row an admin creates by
# hand is mailed too — there is no such flow today.
name: lead-notify
trigger:
  type: record
  table: leads
  events: [create]
actions:
  - name: mail
    type: email
    operator: send
    props:
      to: $env.LEADS_NOTIFY_EMAIL
      replyTo: '{{trigger.data.record.email}}'
      subject: 'Nouvelle demande via le site : {{trigger.data.record.name}}'
      body: |
        <p><strong>Nom :</strong> {{trigger.data.record.name}}</p>
        <p><strong>E-mail :</strong> {{trigger.data.record.email}}</p>
        <p><strong>Téléphone :</strong> {{trigger.data.record.phone}}</p>
        <p><strong>Objet :</strong> {{trigger.data.record.subject}}</p>
        <p><strong>Message :</strong></p>
        <p style="white-space: pre-line">{{trigger.data.record.message}}</p>
        <p>Toutes les demandes : {{$env.BASE_URL}}/administration/demandes. Répondre à ce mail écrit directement à la personne.</p>
