name: space-card
type: card
children:
  - type: card
    props:
      className: 'group overflow-hidden rounded-xl bg-white shadow-md hover:shadow-lg transition-shadow'
    children:
      - type: div
        props:
          className: 'aspect-[4/3] overflow-hidden bg-gradient-to-br from-[#fef3e2] to-[#fde5c8]'
        children:
          - type: div
            props:
              className: 'w-full h-full flex items-center justify-center text-[#eb6f18] text-6xl'
            children:
              - type: span
                content: '$icon'
      - type: card-body
        props:
          className: 'p-6'
        children:
          - type: h3
            content: '$name'
            props:
              className: 'text-xl font-bold text-gray-900 mb-2'
          - type: p
            content: '$description'
            props:
              className: 'text-gray-600 mb-4'
          - type: badge
            content: '$capacity'
            props:
              className: 'inline-block px-3 py-1 rounded-full text-sm font-medium bg-[#fef3e2] text-[#eb6f18]'
