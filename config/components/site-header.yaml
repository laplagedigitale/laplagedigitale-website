# Reusable component template: site-header.
# Sticky white bar: logo · the four pages · language switcher · Espace Membre (/app, which forwards each role to its own space) ·
# the one main action « Réserver une visite » (a mailto to the team, visible at
# every width). Below lg the navigation folds into the « Menu » dropdown; below
# sm the language switcher moves to the footer. « Adhérer » lives in the footer
# and on the Tiers-lieu page.
name: site-header
type: container
children:
  - type: container
    element: header
    props:
      className: "sticky top-0 z-50 w-full bg-white/95 backdrop-blur border-b border-navy-100"
    children:
      - type: container
        element: nav
        props:
          className: "max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-4 h-20"
          aria-label: $t:nav.aria
        children:
          - type: link
            props:
              href: $t:href.home
              className: "flex items-center shrink-0"
              aria-label: "La Plage Digitale"
            children:
              - type: image
                variant: default
                props:
                  src: "/brand/logo-couleurs.svg"
                  alt: "La Plage Digitale"
                  loading: eager
                  width: 120
                  height: 48
                  className: "h-10 sm:h-12 w-auto"
          - type: navigation-menu
            props:
              className: "hidden lg:flex [&_[data-slot=navigation-menu-link]]:text-md"
            navItems:
              - label: $t:nav.home
                href: $t:href.home
              - label: $t:nav.tarifs
                href: $t:href.pricing
              - label: $t:nav.tierslieu
                href: $t:href.thirdPlace
              - label: $t:nav.infos
                href: $t:href.contact
          - type: flex
            props:
              className: "flex items-center gap-2 sm:gap-3"
            children:
              - type: language-switcher
                props:
                  className: "hidden sm:block text-sm [&_button]:h-11 [&_button]:px-3"
              - type: link
                content: $t:nav.portal
                props:
                  href: /app  # routes by role: coworker → Espace Membre, admin → Administration, signed out → /connexion
                  className: "hidden md:inline-flex items-center min-h-11 px-1 text-sm font-medium text-navy hover:text-orange-700 transition-colors"
              - type: link
                content: $t:cta.visit
                props:
                  href: "mailto:contact@laplagedigitale.fr?subject=Visite%20de%20la%20Plage"
                  className: "inline-flex items-center min-h-11 px-4 sm:px-5 rounded-full text-sm font-bold text-navy-700 bg-orange hover:bg-orange-300 transition-colors whitespace-nowrap"
              - type: dropdown-menu
                triggerLabel: $t:nav.menu
                props:
                  className: lg:hidden
                menuItems:
                  - label: $t:nav.home
                    action:
                      type: navigate
                      path: $t:href.home
                  - label: $t:nav.tarifs
                    action:
                      type: navigate
                      path: $t:href.pricing
                  - label: $t:nav.tierslieu
                    action:
                      type: navigate
                      path: $t:href.thirdPlace
                  - label: $t:nav.infos
                    action:
                      type: navigate
                      path: $t:href.contact
                  - separator: true
                  - label: $t:nav.portal
                    action:
                      type: navigate
                      path: /app
