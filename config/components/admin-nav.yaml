# Reusable component template: admin-nav — the left column of the
# Administration de l'association (/administration/*). Logo on top, then the
# navigation. French only, like the rest of the Administration. A new article
# starts from « Contenu » (the editor sidebar keeps its « Nouvel article »).
#
# Below lg the column becomes a top bar and the navigation folds into a drawer
# behind its menu button. A template cannot take children, so each page places
# this column itself, beside its content section.
#
# Two audiences, one shell. A sidebar group cannot be gated on its own, so the
# navigation is declared twice, each sidebar gated on a role (and left out of
# the HTML for the other):
# - admin — Pilotage, Communauté, Lieu, Finances, Subventions, Contenu, and Compte, which below lg
#   sits in the drawer and from lg up in the pinned footer (always in view);
# - editor — Contenu and Compte only (the pages behind the other groups refuse
#   them anyway: access is admin only).
#
# « Mon Espace Membre » — an admin who is also a coworker (their members row
# is linked to a Pennylane customer) gets the way to their own Espace Membre.
# A list bound to that one row, drawing nothing when there is none, rather
# than a `visibility.record` gate: that would make every page bind a members
# row, and an admin without one would get a 404.
#
# The light-on-navy link colours are lg-only: below lg the navigation is a
# drawer on the theme's light panel, where they would be unreadable. The
# sidebar drops the panel colour (`sidebar`, the Espace Membre's sand) that
# 0.38 paints behind it, and below lg its menu button is the white-outlined
# pill of the navy top bar.
#
# From lg up the column is three rows and only the middle one scrolls: the
# header (the logo) and the footer (« Mon Espace Membre »)
# stay in place however long the navigation is. The column itself is clipped
# (lg:overflow-hidden); the wrapper around the sidebars takes the height left
# (lg:flex-1 lg:min-h-0) and scrolls (lg:overflow-y-auto). The sidebars inside
# keep their own height (lg:flex-none): a sidebar stretched to fill its box is
# cut to the height left over, and its last groups overflow onto what follows.
# Below lg both wrappers are `contents`, so the top bar lays out as before.
#
# « Console Sovrium » (/_admin) — the built-in console: users and roles, API
# keys, automation runs, raw tables. Admins only, like the console itself.
#
# The entries' hrefs are literal paths: the current-entry match runs on the
# unresolved href, so a translated one is never marked.
name: admin-nav
type: container
element: aside
props:
  className: 'flex flex-row items-center justify-between gap-4 bg-navy px-4 py-3 text-white lg:sticky lg:top-0 lg:h-screen lg:overflow-hidden lg:w-64 lg:flex-none lg:flex-col lg:items-stretch lg:justify-start lg:px-3 lg:py-6'
children:
  - type: link
    props: { href: /administration, className: 'flex flex-col gap-1 lg:flex-none lg:px-3 lg:mb-6', 'aria-label': "Administration de l'association" }
    children:
      - { type: image, props: { src: /brand/logo-blanc.svg, alt: La Plage Digitale, className: 'h-9 w-auto self-start' } }
      - { type: text, element: span, content: Administration, props: { className: 'hidden lg:inline text-xs font-bold uppercase tracking-widest text-orange-300' } }

  # The navigation: the one part of the column that scrolls.
  - type: container
    element: div
    props:
      className: 'max-lg:contents lg:flex-1 lg:min-h-0 lg:overflow-y-auto'
    children:
      # Admins: the whole back office.
      - type: sidebar
        visibility: { roles: [admin] }
        drawer: { below: lg, label: Menu }
        props:
          className: 'max-lg:ml-auto lg:flex-none bg-transparent max-lg:[&_[data-slot=sidebar-trigger]]:rounded-full max-lg:[&_[data-slot=sidebar-trigger]]:border-white/40 max-lg:[&_[data-slot=sidebar-trigger]]:px-3.5 max-lg:[&_[data-slot=sidebar-trigger]]:text-white max-lg:[&_[data-slot=sidebar-trigger]:hover]:bg-navy-700 lg:text-white lg:[&_[data-slot=sidebar-group-label]]:text-navy-150 lg:[&_a]:text-navy-100 lg:[&_a:hover]:text-white lg:[&_a:hover]:bg-navy-700 lg:[&_a[aria-current=page]]:bg-navy-700 lg:[&_a[aria-current=page]]:text-white [&_a[aria-current=page]]:font-semibold lg:[&_svg]:text-navy-200 lg:[&_[data-sidebar-group=Compte]]:hidden'
        groups:
          - label: Pilotage
            items:
              - { label: Tableau de bord, href: /administration, icon: layout-dashboard }
              - { label: Calendrier, href: /administration/calendrier, icon: calendar-clock, activeMatch: prefix }
              - { label: Demandes, href: /administration/demandes, icon: inbox }
          - label: Communauté
            items:
              - { label: Contacts, href: /administration/contacts, icon: contact, activeMatch: prefix }
              - { label: Adhésions, href: /administration/adhesions, icon: id-card, activeMatch: prefix }
              - { label: Membres, href: /administration/membres, icon: users, activeMatch: prefix }
              - { label: Inscriptions Flex, href: /administration/inscriptions-flex, icon: user-plus, activeMatch: prefix }
          # Occupation matches exactly: authored entries do not let the longest
          # href win, so a prefix would also mark it on Contrats and Salles. Its
          # Bureaux and Casiers pages say where you are with their pill sub-nav.
          - label: Lieu
            items:
              - { label: Occupation, href: /administration/lieu, icon: map }
              - { label: Contrats, href: /administration/lieu/contrats, icon: file-signature, activeMatch: prefix }
              - { label: Salles de réunion, href: /administration/lieu/salles, icon: presentation, activeMatch: prefix }
          - label: Finances
            items:
              - { label: Vue d'ensemble, href: /administration/finances, icon: chart-pie }
              - { label: Trésorerie, href: /administration/finances/tresorerie, icon: piggy-bank }
              - { label: Prévisionnel, href: /administration/finances/previsionnel, icon: chart-line, activeMatch: prefix }
              - { label: Opérations, href: /administration/finances/operations, icon: arrow-left-right, activeMatch: prefix }
              - { label: Facturation, href: /administration/finances/facturation, icon: receipt, activeMatch: prefix }
          - label: Subventions
            items:
              - { label: Demandes de subvention, href: /administration/subventions, icon: hand-coins, activeMatch: prefix }
              - { label: Fiche association, href: /administration/association, icon: building-2 }
          - label: Contenu
            items:
              - { label: Blog, href: /administration/contenu, icon: newspaper }
              - { label: Articles, href: /administration/contenu/articles, icon: files, activeMatch: prefix }
          # Below lg only: from lg up the same three links sit in the pinned footer.
          - label: Compte
            items:
              - { label: Mon compte, href: /administration/compte, icon: user-round }
              - { label: Console Sovrium, href: /_admin, icon: settings }
              - { label: Voir le site, href: /, icon: external-link }

      # Editors: the blog and their account.
      - type: sidebar
        visibility: { roles: [editor] }
        drawer: { below: lg, label: Menu }
        props:
          className: 'max-lg:ml-auto lg:flex-none bg-transparent max-lg:[&_[data-slot=sidebar-trigger]]:rounded-full max-lg:[&_[data-slot=sidebar-trigger]]:border-white/40 max-lg:[&_[data-slot=sidebar-trigger]]:px-3.5 max-lg:[&_[data-slot=sidebar-trigger]]:text-white max-lg:[&_[data-slot=sidebar-trigger]:hover]:bg-navy-700 lg:text-white lg:[&_[data-slot=sidebar-group-label]]:text-navy-150 lg:[&_a]:text-navy-100 lg:[&_a:hover]:text-white lg:[&_a:hover]:bg-navy-700 lg:[&_a[aria-current=page]]:bg-navy-700 lg:[&_a[aria-current=page]]:text-white [&_a[aria-current=page]]:font-semibold lg:[&_svg]:text-navy-200'
        groups:
          - label: Contenu
            items:
              - { label: Tableau de bord, href: /administration/contenu, icon: layout-dashboard }
              - { label: Tous les articles, href: /administration/contenu/articles, icon: newspaper }
              - { label: Brouillons, href: /administration/contenu/articles/brouillons, icon: pencil-line }
              - { label: Publiés, href: /administration/contenu/articles/publies, icon: globe }
              - { label: Nouvel article, href: /administration/contenu/articles/nouveau, icon: square-pen }
          - label: Compte
            items:
              - { label: Mon compte, href: /administration/compte, icon: user-round }
              - { label: Voir le blog, href: /blog, icon: external-link }

  # The footer, pinned under the navigation from lg up; hidden below lg, where
  # the drawer carries the Compte group and the dashboard the Espace Membre link.
  - type: container
    element: div
    props:
      className: 'hidden lg:flex lg:flex-none lg:flex-col lg:gap-1 lg:mx-3 lg:mt-4 lg:border-t lg:border-navy-700 lg:pt-4'
    children:
      - type: container
        element: nav
        visibility: { roles: [admin] }
        props:
          aria-label: Compte
          className: 'flex flex-col gap-0.5 text-sm'
        children:
          - { type: link, content: Mon compte, props: { href: /administration/compte, className: 'rounded-lg px-3 py-2 text-navy-100 hover:text-white hover:bg-navy-700 transition-colors' } }
          - { type: link, content: Console Sovrium, props: { href: /_admin, className: 'rounded-lg px-3 py-2 text-navy-100 hover:text-white hover:bg-navy-700 transition-colors' } }
          - { type: link, content: Voir le site, props: { href: /, className: 'rounded-lg px-3 py-2 text-navy-100 hover:text-white hover:bg-navy-700 transition-colors' } }
      # An admin who is also a coworker: the way to their own Espace Membre.
      - type: list
        visibility: { roles: [admin] }
        dataSource:
          table: members
          filter:
            - { field: email, operator: eq, value: $currentUser.email }
            - { field: pennylane_customer_id, operator: isNotEmpty }
          limit: 1
        props:
          className: 'mt-3'
        listDisplay:
          hideWhenEmpty: true
        children:
          - type: link
            content: Mon Espace Membre →
            props:
              href: /espace-membre
              className: 'flex items-center justify-center px-4 py-2.5 rounded-full text-sm font-semibold text-white hover:text-white border border-white/40 hover:bg-navy-700 transition-colors'
