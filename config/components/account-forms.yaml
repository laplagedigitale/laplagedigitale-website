# Reusable component template: account-forms — the body of an account page,
# shared by the Espace Membre (/espace-membre/compte) and the Administration
# (/administration/compte): display name, e-mail address, password, sign-out.
#
# Both forms post to the auth routes as the signed-in caller (the session is
# the only identity), and read the reply status only (`raw`).
name: account-forms
type: container
props:
  className: 'grid grid-cols-1 xl:grid-cols-2 gap-6 max-w-5xl'
children:
  - type: card
    props:
      className: 'p-6 space-y-4'
    children:
      - { type: text, element: h2, content: $t:account.profile, props: { className: 'text-xl font-semibold text-navy' } }
      - type: form
        endpoint:
          # Better Auth's own route: the PATCH /api/auth/user/update the
          # Sovrium 0.30 docs list answers "not yet implemented".
          url: /api/auth/update-user
          method: POST
          responseEnvelope: raw
          submitLabel: $t:account.save
          onSuccess: { type: toast, variant: success, message: $t:account.profile.saved }
          onError: { type: toast, variant: destructive, message: $t:account.error }
        fields:
          - { field: name, control: text, label: $t:account.name, defaultValue: $session.name }

  # The sign-in address. Better Auth mails a confirmation link to the new
  # address and switches the account only once it is followed; member-email-sync
  # then moves the Espace Membre (members row, invoices, mandate, check-ins,
  # Pennylane recipients) to it.
  - type: card
    props:
      className: 'p-6 space-y-4'
    children:
      - { type: text, element: h2, content: $t:account.email, props: { className: 'text-xl font-semibold text-navy' } }
      - { type: text, element: p, content: $t:account.email.intro, props: { className: 'text-sm text-text-muted' } }
      # No callbackURL: an endpoint form shows every field (`hidden` is not
      # honoured in 0.37), so the confirmation link lands on the home page,
      # signed in.
      - type: form
        endpoint:
          url: /api/auth/change-email
          method: POST
          responseEnvelope: raw
          submitLabel: $t:account.email.submit
          onSuccess: { type: toast, variant: success, message: $t:account.email.sent, duration: 10000 }
          onError: { type: toast, variant: destructive, message: $t:account.email.error }
        fields:
          - { field: newEmail, control: email, label: $t:account.email.new, required: true }

  - type: card
    props:
      className: 'p-6 space-y-4'
    children:
      - { type: text, element: h2, content: $t:account.password, props: { className: 'text-xl font-semibold text-navy' } }
      - type: form
        endpoint:
          url: /api/auth/change-password
          method: POST
          responseEnvelope: raw
          submitLabel: $t:account.password.submit
          onSuccess: { type: toast, variant: success, message: $t:account.password.saved }
          onError: { type: toast, variant: destructive, message: $t:account.password.error }
        fields:
          - { field: currentPassword, control: password, label: $t:account.password.current }
          - { field: newPassword, control: password, label: $t:account.password.new, description: $t:account.password.rule }
          - { field: revokeOtherSessions, control: switch, label: $t:account.password.revoke, defaultValue: true }

  - type: card
    props:
      className: 'p-6 space-y-4'
    children:
      - { type: text, element: h2, content: $t:account.session, props: { className: 'text-xl font-semibold text-navy' } }
      - { type: text, element: p, content: $t:account.session.intro, props: { className: 'text-sm text-text-muted' } }
      - type: form
        action: { type: auth, method: logout, submitLabel: $t:account.logout, onSuccess: { type: navigate, navigate: /connexion } }
