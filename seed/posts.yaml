  - key: "demo-night-17"
    fields:
      title: "Démo Night #17 – Nouveau lieu : EPITECH"
      slug: "demo-night-17"
      excerpt: "?Alsace Digitale et sa communauté French Tech Strasbourg organise la dix-septième Démo Night le Jeudi 19 décembre 2019 à partir de 18H30 à la l’EPITECH, 4 rue…"
      body: "<p>?<strong>Alsace Digitale</strong> et sa communauté <strong>French Tech Strasbourg</strong> organise la dix-septième <strong>Démo Night</strong> le <strong>Jeudi 19 décembre 2019</strong> à partir de <strong>18H30</strong> à la <b>l’EPITECH</b>, 4 rue du Dôme, 67000 Strasbourg.</p>\n<p>Une <strong>Démo Night</strong> est une soirée qui donne la possibilité aux startups, d’intégrer la communauté <strong>French Tech Strasbourg</strong>. Pour cela, une seule règle : faire une démonstration de son produit ou de son service.</p>\n<p>?Des démos de startups en 5 minutes vont animer cette soirée pleine en émotions ! Une épreuve qui marque toujours, que l’on soit celui / celle sur la scène ou juste dans le public. Une expérience enrichissante qui ne peut qu’inspirer les futurs entrepreneurs et la rencontre des acteurs de l’écosystème Startups.</p>\n<p>➡️ Voici les startups à découvrir pendant cette Démo Night :</p>\n<ul><li><strong>Alterealities</strong> : Laser Game en réalité virtuelle</li><li><strong>Travel Kit (<a href=\"https://www.travelkit.care/\" rel=\"noopener\">https://www.travelkit.care/</a>) </strong> : Véritable compagnon de voyage, Travel kit est une application web et mobile de conseil en santé personnalisé.</li><li><strong>Cairn Devices</strong> : Cairn Devices développe un projet d’ordinateur portable modulaire, réparable et évolutif.</li><li><strong>Frippy</strong> (<a href=\"https://frippy.co/\" rel=\"noopener\">https://frippy.co/</a>) : Réservation en ligne de vêtement en friperie</li><li><strong>qFluidics</strong> (<a href=\"http://www.qfluidics.com/\" rel=\"noopener\">http://www.qfluidics.com/</a>) : Fabrication de tubes en Ferro fluides</li></ul>\n<p>En plus de vous en mettre pleins la vue vous pourrez partager un moment convivial avec nos Startups ! ?</p>\n<p>? Réservez vos billets dès maintenant sur <a href=\"https://www.eventbrite.fr/e/billets-demo-night-17-83147322881\" rel=\"noopener\">Eventbrite</a> ! ?</p>"
