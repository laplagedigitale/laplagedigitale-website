  - key: "strasbourg-startups-meeting-6"
    fields:
      title: "Strasbourg Startups Meeting #6"
      slug: "strasbourg-startups-meeting-6"
      excerpt: "Pour cette soirée un thème hyper sexy : Les métriques en SaaS Spotify (musique), Dropbox (partage de fichier), Mailchimp (envoi de mails) ou Basecamp/Trello…"
      body: "<p>Pour cette soirée un thème hyper sexy : <strong>Les métriques en SaaS</strong></p>\n<p>Spotify (musique), Dropbox (partage de fichier), Mailchimp (envoi de mails) ou Basecamp/Trello (gestion de projet), comme les business de « box » mensuels, sont des business en SaaS (Software as a Service), c’est-à-dire où les clients payent un abonnement mensuel. Le pilotage des business en SaaS est assez technique et rempli de termes et acronymes souvent incompréhensibles que nous vous proposons d’expliquer durant cette soirée. Et il y aura toujours un buffet pour networker après les interventions !</p>\n<p>Les 6 métriques sont :</p>\n<p>1. Revenu récurrent signé mensuel ou annuel (cmrr /arpu)</p>\n<p>2. Cash flow</p>\n<p>3. Pipeline (cmrr)</p>\n<p>4. Taux d’attrition (churn)</p>\n<p>5. Coût d’acquisition d’un client (cac)</p>\n<p>6. Valeur du client/entreprise à long terme (ltv)</p>\n<p><strong>Intervenants</strong> : <strong>Julien Lavault</strong> (www.fysiki.com), <strong>Yann Klis</strong> (www.scalingo.com)<br>\nDate et lieu : le <strong>jeudi 15 octobre de 19h à 22h</strong> au <strong>Shadok<br>\nInscription gratuite </strong><a href=\"https://www.eventbrite.fr/e/billets-strasbourg-startups-meeting-6-18791555047\" rel=\"noopener\">disponible ici</a></p>"
      legacy_cover: "/images/blog/startupune1.webp"
      status: "published"
      published_at: "2015-10-07"
      categories: ["actualites", "evenements"]
      legacy_path: "/strasbourg-startups-meeting-6/"
      created_at: "2015-10-07T13:07:23Z"
  - key: "coworking-party"
    fields:
      title: "Coworking Party"
      slug: "coworking-party"
      excerpt: "La coworking party, qu’est-ce que c’est ? Pour célébrer les 10 ans du coworking, BAP (pour Bureaux à Partager) a demandé à chaque espace de coworking…"
      body: "<h2>La coworking party, qu’est-ce que c’est ?</h2>\n<p>Pour célébrer les 10 ans du coworking, BAP (pour Bureaux à Partager) a demandé à chaque espace de coworking participant d’organiser un événement le jeudi 15 octobre, qui reflète à la fois son identité propre, preuve de la variété et de la diversité du coworking en France, tout en célébrant les valeurs communes aux coworkers : <strong>entraide</strong>, <strong>collaboration</strong> et <strong>partage</strong>.</p>\n<p>Pour l’occasion, les espaces de coworking ouvriront leurs portes à un public encore novice de ce mode de travail, qui pourra découvrir le coworking via des visites d’espaces, des rencontres avec des coworkers ou encore des activités mettant les valeurs du coworking au cœur cette rencontre.</p>\n<h2>La participation de la Plage Digitale</h2>\n<p>Plus de 50 espaces en France vont participer à l’événement. Et c’est évidemment le cas d’Alsace Digitale. C’est donc à l’issue du <a href=\"/blog/strasbourg-startups-meeting-6\">Strasbourg Startups Meeting #6</a> que nous célébrerons la coworking party dans les locaux du Shadok. Un apéro débutera aux alentours de 20h30 avec visite de l’espace de coworking « la Plage Digitale du Shadok ».</p>\n<p>Date : <strong>Jeudi 15 octobre à l’issue du Meet-up de Strasbourg Startups</strong><br>\nLieu : <strong>La Plage du Shadok</strong>, 25 presqu’ile André Malraux, 67100 Strasbourg<br>\nPour toute information complémentaire, rendez-vous sur <a href=\"https://www.bureauxapartager.com/blog/presse/coworking-party/\" rel=\"noopener\">le site de la BAP</a></p>"
      legacy_cover: "/images/blog/coworking.webp"
      status: "published"
      published_at: "2015-10-08"
      categories: ["actualites", "evenements"]
      legacy_path: "/coworking-party/"
      created_at: "2015-10-08T08:41:30Z"
  - key: "startup-weekend-strasbourg-du-20-au-22-novembre"
    fields:
      title: "Startup Weekend Strasbourg du 20 au 22 novembre"
      slug: "startup-weekend-strasbourg-du-20-au-22-novembre"
      excerpt: "Retour du Startup Week-end à Strasbourg du 20 au 22 novembre 2015 Alsace Digitale organise pour la 5ème année le Startup Weekend dans le cadre de la Semaine…"
      body: "<h2>Retour du Startup Week-end à Strasbourg du 20 au 22 novembre 2015</h2>\n<p>Alsace Digitale organise pour la 5ème année le Startup Weekend dans le cadre de la <strong>Semaine de l’Entrepreneur Européen 2015</strong>.</p>\n<p>Le principe est le même que pour tous les Startup weekends. Organisée sur trois jours,<strong> cette manifestation est ouverte à tous</strong> (étudiants, développeurs, experts, porteurs de projet). Elle propose de <strong>travailler et tester une idée de startup</strong>. Chacun est invité à présenter son idée en une minute et reçoit en retour les commentaires et les votes de ses pairs. Des équipes se forment sur place autour des meilleures idées et c’est parti pour 54 heures effrénées de recherches d’informations, de définition du business model, de prototypage et de marketing ! Tout au long du weekend, un accompagnement sous forme de conférences et de mentorats est fourni afin d’accélérer au maximum le développement des projets. Le dimanche soir, les équipes devront convaincre <strong>un jury de professionnels</strong> qui élira les trois projets les plus persuasifs.</p>\n<p>A Strasbourg, il est devenu rapidement un <strong>évènement emblématique de la création d’entrepreneurs</strong> de par sa fréquentation (plus d’une centaine de participants à chaque édition), mais aussi par les résultats obtenus.</p>\n<p>Le Startup Week-end Strasbourg s’inscrit dans la semaine de l’entrepreneur européen.</p>\n<p>Plus d’infos sur le <a href=\"http://strasbourg.startupweekend.org/\" rel=\"noopener\">site officiel Strasbourg StartupWeekend</a></p>\n<p>Date :<strong> Du 20 au 22 Novembre 2015<br>\n</strong>Lieu : <strong>Pôle Formation CCI Alsace </strong>au 234 Avenue de Colmar, 67021 Strasbourg<br>\nTél. : <strong>03 88 41 86 95</strong></p>"
      legacy_cover: "/images/blog/logo-swsxb-1.webp"
      status: "published"
      published_at: "2015-10-20"
      categories: ["actualites", "evenements"]
      legacy_path: "/startup-weekend-strasbourg-du-20-au-22-novembre/"
      created_at: "2015-10-20T09:47:27Z"
  - key: "la-social-cup-arrive-a-strasbourg-2"
    fields:
      title: "La Social Cup arrive à Strasbourg"
      slug: "la-social-cup-arrive-a-strasbourg-2"
      excerpt: "La Social Cup, c’est la première coupe de France de l’entreprenariat social et environnemental destinée aux étudiants. Elle se déroule dans les plus grandes…"
      body: "<p>La Social Cup, c’est la première <strong>coupe de France de l’entreprenariat social et environnemental </strong>destinée aux étudiants. Elle se déroule dans les plus grandes villes françaises (dont Strasbourg) et est co-organisée par MakeSense, Kisskissbankbank et La Banque Postale. L’objectif est simple : dynamiser les projets qui répondent à une problématique sociétale.</p>\n<h2>Le déroulement de la compétition</h2>\n<ul><li><strong>L’échauffement</strong> : Depuis la rentrée de septembre, la Social Cup parcourt les écoles des plus grandes villes de France pour présenter les enjeux de l’entreprenariat social.</li><li><strong>Les événements SenseFiction</strong> : Un après-midi destiné à l’élaboration des projets. Les meilleurs d’entre eux seront sélectionnés par un jury pour représenter leur ville lors de la Battle Finale.</li><li><strong>L’épreuve finale, la Battle de Créateurs :</strong> Les projets s’affronteront au mois de janvier et le public votera pour les meilleurs projets en format éliminatoire à trois tours : poule, demi-finale et finale.</li></ul>\n<h2>Pour participer à la SenseFiction de Strasbourg, rendez-vous le 5 décembre !</h2>\n<p>Bonne nouvelle ! La Social Cup vient à vous :<strong> à Strasbourg, c’est le samedi 5 décembre</strong> que cet événement aura lieu. Pour y participer et espérer gagner votre place pour la Battle de Créateurs, <a href=\"https://www.lasocialcup.com/views/register.html\" rel=\"noopener\"><strong>inscrivez-vous dès maintenant.</strong></a></p>\n<p>Les <strong>SenseFiction</strong>, c’est un après-midi dynamique dédié à l’entreprenariat social, pendant lequel vous pourrez constituer votre équipe, développer votre projet et le présenter devant un jury et espérer gagner une place en finale, lors de la Battle de Créateurs.</p>\n<p>À la clé, une place pendant 6 mois au sein de l’accélérateur SenseCube développé par MakeSense et une dotation financière de La Banque Postale sur votre collecte sur KissKissBankBank en fonction des votes lors de l’événement : 3 000€ pour le lauréat, 1 500€ pour le finaliste, 1 000€ pour les demi-finalistes, 500€ pour les poules.</p>\n<p>Plus d’infos sur le site officiel de <a href=\"https://www.lasocialcup.com/\" rel=\"noopener\">La Social Cup<br>\n</a><strong>Date de la SenseFiction à Strasbourg : le samedi 5 décembre, <a href=\"https://www.lasocialcup.com/views/register.html\" rel=\"noopener\">inscriptions ici</a></strong></p>"
