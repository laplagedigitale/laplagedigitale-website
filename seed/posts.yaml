  - key: "act-in-space"
    fields:
      title: "Act in Space"
      slug: "act-in-space"
      excerpt: "20 et 21 mai La 2nd édition du Act In Space c’est pour bientôt ! PEPITE-ETENA avec le soutien de l’Université de Strasbourg et de l’Eurométropole de…"
      body: "<p>20 et 21 mai</p>\n<p>La 2nd édition du Act In Space c’est pour bientôt !</p>\n<p><strong>PEPITE-ETENA</strong> avec le soutien de l’Université de Strasbourg et de l’Eurométropole de Strasbourg, en partenariat avec l’ISU, l’ENSIIE, le SERTIT et Alsace Digitale organise le hackaton de Strasbourg.</p>\n<p>En équipes de 5 maximum, le but est de relever en 24 heures l’un des défis proposés par le CNES et ses partenaires, sur les thèmes des technologies spatiales.</p>\n<p>Ces hackathons sont réalisés dans plusieurs villes internationales simultanément. <strong>Si vous aimez les défis c’est le moment.</strong></p>\n<p>Envie de relever un défi, rendez-vous <a href=\"http://www.actinspace.org/fr/defis\" rel=\"noopener\">ici</a><br>\nPour vous inscrire, direction le <a href=\"http://www.actinspace.org/fr/inscription\" rel=\"noopener\">site de l’act in space.</a>Toutes les infos complémentaires <a href=\"http://www.actinspace.org/fr\" rel=\"noopener\">ici</a></p>\n<p>ISU Strasbourg,1 Rue Jean Dominique Cassini, 67400 Illkirch-Graffenstaden</p>"
      legacy_cover: "/images/blog/unnamed-201605.webp"
      status: "published"
      published_at: "2016-05-03"
