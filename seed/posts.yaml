  - key: "edgeday-edgefest-2016"
    fields:
      title: "Edgeday – Edgefest 2016"
      slug: "edgeday-edgefest-2016"
      excerpt: "Alsace Digitale accueille toute la journée le public du festival pour faire découvrir l’effervescence du numérique strasbourgeois. C’est l’opportunité de…"
      body: "<p>Alsace Digitale accueille toute la journée le public du festival pour faire découvrir l’effervescence du numérique strasbourgeois. C’est l’opportunité de rencontrer et d’échanger avec l’ensemble des acteurs impliqués dans cette dynamique : entrepreneurs, artistes, clusters… C’est également l’occasion d’explorer le potentiel du coworking, une organisation innovante du travail basée sur la collaboration et le partage de compétences.</p>\n<p>Cette année encore, Edge Day comprendra <b>Maker Day</b> : un évènement consacré à des workshops originaux, et <b>Demo Day</b> : une journée de démonstration-test, de prototypes de productions créatives.</p>\n<h3>Demo Day</h3>\n<p><strong>Date</strong> : Samedi 9 juillet de 14h à 19h</p>\n<p><strong>Lieux </strong>: Le Shadok / UGC</p>\n<p><strong>Événement gratuit, entrée libre.</strong></p>\n<p>Ateliers de « B’ta-Test », de prototypes de productions créatives, démonstration de robotique et autres innovations. Ces ateliers ont pour but d’initier une large cible d’utilisateurs à des usages créatifs et innovants, tout en favorisant les échanges avec les professionnels présents.</p>\n<h3>Maker Day</h3>\n<p><strong>Date </strong>: Samedi 9 juillet de 14h à 17h</p>\n<p><strong>Lieux </strong>: Extérieur / UGC</p>\n<p><strong>Événement gratuit, entrée libre.</strong></p>\n<p>Événement consacré à des workshops originaux : fabrication de potentiels bolides roulants ou de petits robots dessinateurs grâce à des objets du quotidien et ateliers de programmation. Les professionnels présents seront <a href=\"http://ouhackpo.eu/\" rel=\"noopener\">OuHackPo</a>, <a href=\"http://www.av-lab.net/\" rel=\"noopener\">AV Lab</a>, <a href=\"https://hackstub.netlib.re/landpage/\" rel=\"noopener\">Hackstub</a>, <a href=\"http://lafab.org/wp/\" rel=\"noopener\">La Fabrique</a> et <a href=\"https://www.facebook.com/RoboticJE/\" rel=\"noopener\">Robotic Junior Entrepreneur</a>.</p>"
      legacy_cover: "/images/blog/makerday2.webp"
      status: "published"
      published_at: "2016-06-23"
      categories: ["actualites", "edgefest", "evenements"]
      legacy_path: "/edgeday-edgefest-2016/"
      created_at: "2016-06-23T14:03:24Z"
  - key: "edgefest-2016"
    fields:
      title: "Edgefest 2016"
      slug: "edgefest-2016"
      excerpt: "Du 30 juin au 9 juillet Cette année encore, EdgeFest, le festival des communautés numériques et créatives à Strasbourg est de retour pour une 5ème édition.…"
      body: "<p>Du 30 juin au 9 juillet</p>\n<p>Cette année encore, EdgeFest, le festival des communautés numériques et créatives à Strasbourg est de retour pour une 5ème édition.</p>\n<p>Organisé par Alsace Digitale, ce festival des communautés numériques et créatives, invite startupers, inventeurs et curieux à échanger autour des dernières avancées technologiques, à dresser une carte de<br>\npossibles, à investir de nouveaux espaces d’explorations. <strong>Une e-topie ludique, artistique</strong><br>\n<strong>et créative.</strong></p>\n<p>Durant l’événement des ateliers à destination d’adultes, d’enfants et d’adolescents seront réalisés.<br>\nLes démonstrations et les rencontres permettront à chacun de participer à ce mouvement d’échange et de<br>\ncollaboration.</p>\n<p>T<strong>ous les événements sont ouverts à tous publics et gratuits.</strong></p>\n<p>Les événements ont lieu sur la Plage <b>devant la Médiathèque André Malraux, à l’UGC, au Shadok.</b></p>\n<p>Plus d’informations sur <a href=\"http://www.edgefest.fr/\" rel=\"noopener\">http://www.edgefest.fr/</a></p>"
      legacy_cover: "/images/blog/bandeauwordpress2.webp"
      status: "published"
      published_at: "2016-06-23"
      categories: ["actualites", "evenements"]
      legacy_path: "/edgefest-2016/"
      created_at: "2016-06-23T14:16:45Z"
  - key: "cet-ete-je-travaille-a-la-plage-2"
    fields:
      title: "Cet été je travaille à la Plage"
      slug: "cet-ete-je-travaille-a-la-plage-2"
      excerpt: "Juillet-août Essayez l’espace de coworking pendant 5 jours gratuitement ! Besoin d’un espace calme pour travailler ? Le tout dans une ambiance conviviale avec…"
      body: "<p><b>Juillet-août</b></p>\n<p><b>Essayez l’espace de coworking pendant 5 jours gratuitement !</b></p>\n<p>Besoin d’un espace calme pour travailler ? Le tout dans une ambiance conviviale avec wifi, imprimante, café et climatisation ? </p>\n<p>Face au plébiscite, la Plage Digitale renouvelle son opération et ouvre ses portes à nouveau cet été. 5 jours d’essai en flex sont offerts sur nos deux plages au choix : La Plage Rivétoile et la Plage du Shadok.</p>\n<p>Cette offre est proposée à tous : free-lance, étudiants, télétravailleurs, entrepreneurs…</p>\n<p>Ces 5 jours d’essai seront l’occasion de profiter de tous nos avantages et de découvrir l’ambiance studieuse et conviviale des plages dans lesquelles on peut se concentrer sur ses projets tout en se sentant entouré.</p>\n<p>Un véritable espace de travail avec un environnement agréable, cinéma, bar, médiathèque sur la Presqu’île Malraux.</p>\n<p><a href=\"https://docs.google.com/a/alsacedigitale.org/forms/d/1GF0V9TYBvU3EAJo5233PDwgbqaAahplQJA1oa-ZN2Mc/viewform\" rel=\"noopener\">Lien pour profiter de cette offre !<br>\n</a>Sur inscription préalable dans la limite des places Flex disponibles</p>\n<p>Contact : La Plage Digitale 15 Avenue du Rhin – Strasbourg / 03 88 41 86 95 contact@alsacedigitale.org</p>"
      legacy_cover: "/images/blog/banniere-coworking-weblight.webp"
      status: "published"
      published_at: "2016-06-27"
      categories: ["actualites"]
      legacy_path: "/cet-ete-je-travaille-a-la-plage-2/"
      created_at: "2016-06-27T09:58:41Z"
  - key: "appel-a-projet-2016-kit-emergence"
    fields:
      title: "Appel à projet 2016 Kit Emergence"
      slug: "appel-a-projet-2016-kit-emergence"
      excerpt: "Le Shadok, Fabrique du numérique lance la 2e édition d’un appel à projets de résidences d’entreprises en association avec l’Eurométropole de Strasbourg et…"
      body: "<p><strong>Le Shadok, Fabrique du numérique</strong> lance la 2e édition d’un appel à projets de résidences d’entreprises en association avec l<strong>’Eurométropole de Strasbourg</strong> et l’association <strong>Alsace Digitale</strong>. Sont associés également au <strong>Kit Émergence Shadok</strong> en tant que co-partenaires : ACCRO – opérateur de l’économie créative ; la CCI Strasbourg Bas-Rhin ; Orange.</p>\n<p><strong>Date limite de candidature au 1er septembre 2016</strong></p>\n<p><strong>formulaire_de_candidature_Kit Emergence Shadok 2016 </strong></p>\n<p><strong>Cdc Kit Emergence Shadok 2016</strong></p>\n<h3>&gt; Objectif du Kit Émergence Shadok</h3>\n<p>L’objectif du Kit Émergence Shadok est d’accompagner en 2016 – 2017 deux jeunes entreprises indépendantes ayant au maximum trois ans d’existence en vue de leur permettre de consolider leur modèle économique, d’accélérer leur croissance et de concrétiser leur position sur leurs marchés en France et à l’international.</p>\n<h3>&gt; Eligibilité</h3>\n<p>Sont éligibles des entreprises indépendantes des secteurs créatif ou numérique domiciliées sur le territoire de l’Eurométropole ayant au maximum trois ans d’existence. La nomenclature des secteurs créatif ou numérique est téléchargeable ci-dessous.</p>\n<p>L’appel à projets vise prioritairement des entreprises porteuses d’un projet innovant, à fort potentiel économique, et susceptibles d’une forte croissance en France et à l’international.</p>\n<h3>&gt; Modalités</h3>\n<p>Les entreprises lauréates du Kit Émergence Shadok bénéficieront sur l’année 2016 – 2017 :</p>\n<p><strong>D’un lieu et d’équipements de travail pour une durée de six mois maximum :</strong></p>\n<p>• une à trois places dans l’espace de coworking du Shadok en fonction des besoins de l’équipe</p>\n<p>• l’accès aux services et aux équipements de l’espace de coworking (réseau, imprimante, rangements, etc.) ainsi qu’aux espaces et ressources du Shadok (salles de réunion, espaces de travail, FabLab sur abonnement, bar-salon) dans les mêmes conditions que les occupants de l’espace de coworking</p>\n<p><strong>D’un parcours d’accompagnement sur mesure composé des services complémentaires des partenaires :</strong></p>\n<p>• un suivi personnalisé et régulier équivalent à deux jours plein, réalisé par Alsace Digitale ;</p>\n<p>• l’organisation par le Shadok d’une soirée de mise en réseau ainsi que d’espaces-temps dédiés au processus d’innovation de la structure en partenariat avec ACCRO ;</p>\n<p>• une session de coaching et de conseils par des experts sélectionnés par ACCRO selon les besoins de l’entreprise ;</p>\n<p>• un accès privilégié aux outils d’accompagnement de la CCI Strasbourg Bas-Rhin en matière d’appui au développement des jeunes entreprises (stage de formation offert, conseils) ainsi qu’à ses compétences et réseaux thématiques (commerce, numérique, export, industrie, intelligence économique, innovation, etc.) ;</p>\n<p>• un accès à des ateliers, des showrooms de l’accélérateur d’Orange à destination des startups </p>\n<p><strong>D’un financement de 7 500 € TTC versé par l’Eurométropole de Strasbourg destiné à contribuer au financement de dépenses prioritaires de développement dans un ou plusieurs des domaines suivants :</strong></p>\n<p>• Conseil expert (juridique, économique, technologique, fiscal, ressources humaines, marketing et commercialisation)</p>\n<p>• Prototypage et achat de matériel</p>\n<p>• Communication, promotion, mise en réseau</p>"
      legacy_cover: "/images/blog/bandeau2-shadok.webp"
      status: "published"
      published_at: "2016-07-26"
      categories: ["actualites"]
      legacy_path: "/appel-a-projet-2016-kit-emergence/"
      created_at: "2016-07-26T08:57:27Z"
  - key: "strasbourg-startups-un-nouveau-site-tout-beau-tout-neuf"
    fields:
      title: "Strasbourg Startups, un nouveau site tout neuf tout beau !"
      slug: "strasbourg-startups-un-nouveau-site-tout-beau-tout-neuf"
      excerpt: "Strasbourg Startups est une initiative lancée par Alsace Digitale. Divers événements sont organisés tout au long de l’année afin de développer l’écosystème…"
      body: "<p><img src=\"/images/blog/jm-demonight-3.webp\" alt=\"OLYMPUS DIGITAL CAMERA\" loading=\"lazy\"> <a href=\"http://www.strasbourg-startups.com/\" rel=\"noopener\">Strasbourg Startups</a> est une initiative lancée par Alsace Digitale. Divers événements sont organisés tout au long de l’année afin de développer l’écosystème numérique et entrepreneurial en Alsace.</p>\n<p>Le principal objectif est de faire grandir cet écosystème en rassemblant autant des professionnels que des étudiants.</p>\n<p>Strasbourg Startups se concentre autour de trois fondamentaux :</p>\n<ul><li>Une <strong>Demo Night</strong> par trimestre : cet événement permet aux nouveaux talents de se faire connaître, de grandir et de prospérer grâce à l’accompagnement de la communauté.</li><li>Des<strong> meetups</strong> mensuels : ces réunions régulières permettent de rassembler tout le monde autour de sujets centraux pour les startups comme la levée de fonds, le recrutement, le financement ou encore le paiement électronique.</li><li>Le <strong>Founder’s Club</strong> : les créateurs de startups acceptés dans la communauté ont accès à un tchat et une mailing list, qui leur permet d’échanger régulièrement. Quatre fois par an dîners ou workshops sont planifiés et l’un des participants aura l’occasion de présenter son expertise sur un sujet.</li></ul>\n<p>Pour plus d’informations ou si vous êtes une startup et vous souhaitez rejoindre l’aventure, voici leur site : <a href=\"http://www.strasbourg-startups.com/\" rel=\"noopener\">http://www.strasbourg-startups.com/</a></p>"
      legacy_cover: "/images/blog/sstartup.webp"
      status: "published"
      published_at: "2016-08-23"
      categories: ["actualites"]
      legacy_path: "/strasbourg-startups-un-nouveau-site-tout-beau-tout-neuf/"
      created_at: "2016-08-23T09:50:16Z"
  - key: "les-hackers-dalsace-digitale"
    fields:
      title: "Les hackers d’Alsace Digitale !"
      slug: "les-hackers-dalsace-digitale"
      excerpt: "Image du nouveau site d’HackSXB : http://www.hacksxb.com/ Les thèmes varient beaucoup et tout le monde est invité à y apporter ses connaissances. HackSXB est…"
      body: "<p>Image du nouveau site d’HackSXB : <a href=\"http://www.hacksxb.com/\" rel=\"noopener\">http://www.hacksxb.com/</a></p>\n<p><img src=\"/images/blog/10460902-794553063939410-6794301670438838847-o.webp\" alt=\"10460902_794553063939410_6794301670438838847_o\" loading=\"lazy\">Les thèmes varient beaucoup et tout le monde est invité à y apporter ses connaissances. HackSXB est le lieu où l’esprit critique d’Alsace Digitale s’épanouit. L’objectif au cœur de cette dynamique est de créer un cercle d’amateurs mais aussi de connaisseurs, qui se réunissent régulièrement pour partager leurs connaissances autour de leurs projets propres ou d’un projet commun.</p>\n<p>Le partage des données, la mutualisation des compétences, la décentralisation, la libre circulation de l’information, voilà quelques-uns des principes moteurs du hacking et de cette communauté.</p>\n<p>Les années passées, plusieurs projets organisés par le HackSXB ont eu lieu : un atelier « boîte inutile », un pong géant au laser, des jeux pour le festival Edgefest et la participation aux Hackathons.</p>\n<p>Cette innovation en groupe permet de tisser des liens forts et renforce la créativité et l’autonomie des divers participants. Pour plus d’informations vous pouvez vous rendre sur leur site internet à l’adresse suivante : <a href=\"http://www.hacksxb.com/\" rel=\"noopener\">http://www.hacksxb.com/</a></p>"
      legacy_cover: "/images/blog/hacksxb.webp"
      status: "published"
      published_at: "2016-08-23"
      categories: ["actualites"]
      legacy_path: "/les-hackers-dalsace-digitale/"
      created_at: "2016-08-23T12:38:08Z"
  - key: "objectif-hacking-industry-camp-inscription-workshops"
    fields:
      title: "Objectif Hacking Industry Camp ! Inscription Workshops"
      slug: "objectif-hacking-industry-camp-inscription-workshops"
      excerpt: "La deuxième édition du Hacking Industry Camp aura lieu du 14 au 16 octobre à l’INSA Strasbourg. Vous trouverez toutes les informations sur ce prochain…"
      body: "<p>La deuxième édition du Hacking Industry Camp aura lieu du 14 au 16 octobre à l’INSA Strasbourg. Vous trouverez toutes les informations sur ce prochain hackathon :</p>\n<p>sur le site <a href=\"http://www.hackingindustry.camp/\" rel=\"noopener\">www.hackingindustry.camp</a></p>\n<p>Comme un hackathon, 48h d’innovation collaborative, c’est aussi une compétition, un challenge, pour y participer il est nécessaire de bien se préparer.</p>\n<p>Pour cette deuxième édition, Rhenatic s’associe à Alsace Digitale pour créer des workshops en amont du Hacking Industry Camp.</p>\n<p>Deux sessions d’idéation de deux demi-journées, animées par la<a href=\"http://www.xfive.be/fr/\" rel=\"noopener\"> société Xfive </a>sont proposées. (Depuis octobre 2013, xFIVE collabore avec INSA Strasbourg, ArcelorMittal, MBDA, Socomec, ExelOP, Time-To-Innovate…).</p>\n<p>L’idée est de transformer vos problématiques en défis prêts à être lancés le temps d’un week-end.</p>\n<p>C’est avant tout une méthode qui vous est proposée que vous pourrez déployer également en interne par la suite.</p>\n<p>Inscription gratuite mais obligatoire aux deux demi-journées d’une session (deux sessions au choix)</p>\n<p>31/08 première partie des workshops :</p>\n<p><a href=\"https://www.helloasso.com/associations/alsace-digitale/evenements/worshop-hacking-industry-camp-1\" rel=\"noopener\">#1 : 31/08 de 09h à 13h chez Siemens Schiltigheim</a></p>\n<p><a href=\"https://www.helloasso.com/associations/alsace-digitale/evenements/worshop-hacking-industry-camp-2-31-08-17h\" rel=\"noopener\">#2 : 31/08 de 17h à 21h chez Velum Bischoffsheim</a></p>\n<p>09/09 deuxième partie des workshops :</p>\n<p><a href=\"https://www.helloasso.com/associations/alsace-digitale/evenements/workshop-09-09-9h-hic-3-1\" rel=\"noopener\">#3 : 09/09 de 09h à 13h à le Fédération des Industries d’Alsace</a></p>\n<p><a href=\"https://www.helloasso.com/associations/alsace-digitale/evenements/workshop-09-09-9h-hic-3\" rel=\"noopener\">#4 : 09/09 de 17h à 21h chez Hager</a></p>"
      legacy_cover: "/images/blog/3526522573-8f40a675b6.webp"
      status: "published"
