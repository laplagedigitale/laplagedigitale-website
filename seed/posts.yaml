  - key: "cet-ete-decouvrez-le-travail-a-la-plage-et-teste-le-co-working"
    fields:
      title: "Cet été découvrez le travail à la plage et testé le co-working !"
      slug: "cet-ete-decouvrez-le-travail-a-la-plage-et-teste-le-co-working"
      excerpt: "Vous avez besoin d’un espace calme pour travailler ? Le tout dans une ambiance conviviale avec Wifi, imprimante, café et climatisation ? Nous avons ce qu’il…"
      body: "<p>Vous avez besoin d’un espace calme pour travailler ?</p>\n<p>Le tout dans une ambiance conviviale avec Wifi, imprimante, café et climatisation ?</p>\n<p>Nous avons ce qu’il vous faut !</p>\n<p>L’association Alsace Digitale renouvelle son opération et ouvre ses portes à nouveau cet été !</p>\n<p>5 jours d’essai en Flex sont offerts sur nos deux plages au choix, et oui vous ne rêvez pas, nous avons deux espaces au choix :</p>\n<p>La Plage Rivétoile, 15 avenue du Rhin à Strasbourg et la Plage du Shadok, 26 rue du bassin d’Austerlitz.</p>\n<p>Cette offre est proposée à tous : free­lance, étudiants, télétravailleurs, entrepreneurs…</p>\n<p>Ces 5 jours d’essai sont l’occasion de profiter de tous nos avantages et de découvrir l’ambiance studieuse et conviviale des plages dans lesquelles vous pouvez vous concentrer sur vos projets tout en vous sentant entouré.</p>\n<p>Ces deux espaces de travail sont au cœur d’un environnement agréable où l’on y trouve cinéma, bars et restaurants sans oublier une des plus grandes ressources documentaires de Strasbourg ; la médiathèque Malraux !</p>\n<p>Alors pour ne pas manquer cette occasion vous retrouverez, ci-dessous, le Lien et le QRcode pour profiter de cette offre ;</p>\n<p><a href=\"https://goo.gl/forms/DCh2DOw1kWaTFnxy1\" rel=\"noopener\">https://goo.gl/forms/DCh2DOw1kWaTFnxy1</a></p>\n<p><img src=\"/images/blog/qrcode.webp\" alt=\"QRCode\" loading=\"lazy\"></p>\n<p>Cette offre est valable tout le mois d’août, profitez-en !</p>"
