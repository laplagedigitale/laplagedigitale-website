  - key: "startups-mannalas"
    fields:
      title: "Startup & Mannalas"
      slug: "startups-mannalas"
      excerpt: "Startup & Mannalas fédére chaque année l’écosystème startup Mulhousien autour d’un café, des chocolat, d’un thé, de vin chaud et des traditionnels mannalas…"
      body: "<p>Startup &amp; Mannalas fédére chaque année l’écosystème startup Mulhousien autour d’un café, des chocolat, d’un thé, de vin chaud et des <strong>traditionnels mannalas alsaciens</strong> !</p>\n<p>Cette soirée simple et informelle vous propose de rencontrer du monde dans un moment convivial dans l’espace de coworking « Le 34 » se situant sur l’arrière de la pépinière du Technopole Mulhouse.</p>\n<p>Au programme pour les plus actifs un concours de pitchs en 1 minute avec à la clef une suprise !</p>\n<p>Vous n’avez pas d’idée ? Vous voulez vous lancez ? On a pensé à tout ! Laissez aller votre créativité autour d’une folle partie de Pitch Card en première partie de soirée (un super serious game autour de la prise de parole en public et spécifiquement du pitch training).</p>\n<p>On vous attend nombreux pour parler de vos projets et déguster les traditionnels mannalas de la Saint Nicolas !</p>\n<p><strong>Mercredi 6 décembre 2017, de 18h à 21h</strong><br>\n<strong>Le 34 (40 Rue Marc Seguin – 68200 Mulhouse)</strong></p>\n<p><strong>Inscription gratuite sur <a href=\"https://www.eventbrite.fr/e/billets-startups-mannalas-28918482961\" rel=\"noopener\">Eventbrite</a></strong></p>"
      legacy_cover: "/images/blog/sm.webp"
      status: "published"
      published_at: "2017-12-04"
      categories: ["actualites"]
      legacy_path: "/startups-mannalas/"
      created_at: "2017-12-04T11:20:06Z"
  - key: "demo-night-13"
    fields:
      title: "Demo Night #13"
      slug: "demo-night-13"
      excerpt: "Alsace Digitale et sa communauté Strasbourg Startups organisent la treizième Demo Night le jeudi 14 décembre 2017 à 18h30 au Centre de Culture Numérique de…"
      body: "<p>Alsace Digitale et sa communauté Strasbourg Startups organisent la treizième Demo Night  le  <strong>jeudi 14 décembre 2017 à 18h30</strong> au Centre de Culture Numérique de Strasbourg (16 rue René Descartes – 67000 Strasbourg).</p>\n<p>Des démos de startups en 5 minutes vont animer cette soirée riche en émotions ! Une épreuve qui marque toujours, que l’on soit celui / celle sur la scène ou juste dans le public. Une expérience enrichissante qui ne peut qu’inspirer les futurs entrepreneurs et la rencontre des acteurs de l’écosystème Startups.</p>\n<p>Les startups déjà annoncées :</p>\n<p><strong>Dokkito :</strong> Vos produits de producteurs préférés sans aucun frais de livraison, à deux pas de chez vous, grâce aux m² inutilisés de vos voisins (<a href=\"http://dokkito.com/\" rel=\"noopener\">http://dokkito.com</a>)</p>\n<p><strong>Byblos :</strong> Un outil pour pouvoir facilement trouver des livres qui vous intéressent et les ajouter à votre liste pour les consulter plus tard ou les commander (<a href=\"http://byblosapp.com/\" rel=\"noopener\">http://byblosapp.com</a>)</p>\n<p><strong>MyQuintus :</strong> Une collection unique de têtes et de pieds de lit confortables et faciles à installer, signée par des artistes talentueux (<a href=\"https://www.myquintus.com/fr\" rel=\"noopener\">https://www.myquintus.com/fr</a>)</p>\n<p><strong>HypnoVR :</strong> La médecine du futur, en utilisant la réalité virtuelle pour effectuer des anesthésies sur des patients sous hypnose (<a href=\"http://hypnovr.launchrock.com/\" rel=\"noopener\">http://hypnovr.launchrock.com</a>)</p>\n<p><strong>TransChain :</strong> Plateforme digitale commune pour assurer la sécurisation de données sensibles grâce à la technologie de la Blockchain (<a href=\"https://transchain.io/fr\" rel=\"noopener\">https://transchain.io/fr</a>)</p>\n<p><strong>Yo News :</strong> Un média innovant qui vous fournit l’actualité de vos sujets préférés sur votre Messenger (<a href=\"http://m.me/YoNewsOfficiel\" rel=\"noopener\">http://m.me/YoNewsOfficiel</a>)</p>\n<p>Petite nouveauté, fête de fin d’année oblige, une vitrine rassemblant des startups sera présente pour vous proposer des idées de cadeaux originaux, innovants et locaux. Un vrai marché de Noël des startups !</p>\n<p>Pour plus d’information vous pouvez consulter notre page <a href=\"https://www.facebook.com/alsace.digitale/\" rel=\"noopener\">Facebook</a></p>\n<p>Inscription gratuite sur <a href=\"https://www.eventbrite.fr/e/billets-demo-night-13-41019432226\" rel=\"noopener\">Eventbrite</a></p>"
      legacy_cover: "/images/blog/13141217.webp"
      status: "published"
      published_at: "2017-12-05"
      categories: ["actualites", "evenements"]
      legacy_path: "/demo-night-13/"
      created_at: "2017-12-05T10:28:43Z"
  - key: "le-noel-de-startups-a-particuliers"
    fields:
      title: "Le Noël de Startups à Particuliers !"
      slug: "le-noel-de-startups-a-particuliers"
      excerpt: "Pour ce Noël 2017, nous vous avons sélectionné des cadeaux originaux, innovants et locaux ! Tout comme le Noël de la French Tech au niveau national, Alsace…"
      body: "<p>Pour ce Noël 2017, nous vous avons sélectionné des cadeaux originaux, innovants et locaux ! Tout comme le Noël de la French Tech au niveau national, Alsace Digitale a décidé de réunir des produits purement startups de la région afin de vous donner des idées de cadeaux à offrir à vos proches lors des fêtes de fin d’année.</p>\n<p>Petite nouveauté, en plus de cet article, nous vous proposons de rencontrer certaines d’entre elles le 14 décembre au Centre de Culture Numérique de Strasbourg après la <strong>Démo Night #13</strong>. Si vous souhaitez aussi y aller c’est <a href=\"https://www.eventbrite.fr/e/billets-demo-night-13-41019432226\" rel=\"noopener\"><strong>ICI</strong></a> !</p>\n<p><strong>La sélection de cadeaux 100% startups :</strong></p>\n<p><strong>Les cadeaux qui font rêver !</strong></p>\n<p><strong>Epopia </strong></p>\n<p>Cette startup offre la plus magique des aventures sous forme de correspondance postale qui fait lire et écrire les enfants, de 5 à 12 ans, à travers des histoires dont ils sont les héros. C’est  une expérience littéraire ludique,  personnalisée et interactive en faisant de la lecture et de l’écriture un véritable jeu ! Sous forme d’abonnement plusieurs lots de lettres et surprises sont proposées de 39,99 euros à 119 euros. Vous pouvez retrouver la startup dans le programme du Noël de la French Tech : <strong><a href=\"https://noeldelafrenchtech.fr/\" rel=\"noopener\">https://noeldelafrenchtech.fr/</a></strong> et également sur le site de Strasbourg Startups : <strong><a href=\"https://www.strasbourg-startups.com/\" rel=\"noopener\">https://www.strasbourg-startups.com/</a></strong></p>\n<p>Vous voulez tenter l’aventure maintenant ?</p>\n<p>C’est ICI :  <strong><a href=\"https://www.epopia.com/\" rel=\"noopener\">https://www.epopia.com/</a></strong></p>\n<p><strong>Skimlab </strong></p>\n<p>Celle-ci fait rêver les grands en ligne en leur permettant grâce à des outils de création 3D gratuits, de créer les objets qu’il ont toujours rêvé d’avoir et en plus c’est sur demande regardez : <strong><a href=\"http://www.skimlab.com/editor/\" rel=\"noopener\">http://www.skimlab.com/editor/</a></strong></p>\n<p>Une petite nouveauté s’ajoute cette année, à travers Skimlab vous pouvez réaliser un bijou fantaisie sur mesure : <strong><a href=\"https://www.jweel.com/fr/\" rel=\"noopener\">https://www.jweel.com/fr/</a></strong></p>\n<p>Ce Noël, même si vous n’offrez pas de bijoux directement soyez certain de faire plaisir en offrant un chèque-cadeau Jweel : <strong><a href=\"https://www.jweel.com/fr/giftvoucher/\" rel=\"noopener\">https://www.jweel.com/fr/giftvoucher/</a></strong></p>\n<p>Et si vous hésitez encore, le chèque est valable pendant 1 an ! De quoi avoir le temps de réfléchir à sa future création.</p>\n<p><strong>Geek’n’Juice</strong></p>\n<p>Michael, créateur de la marque vous propose de styliser vos chargeurs de téléphone portable ! Plutôt Fun non ? Sur le même principe des coques pour téléphone il applique ses “dreems” sur les chargeurs. Vous pouvez les retrouver sur leur site internet ; <strong><a href=\"https://geeknjuice.fr/\" rel=\"noopener\">https://geeknjuice.fr/</a></strong></p>\n<p>Pour l’avoir vu lors des Meetup de Strasbourg Startups, une des nombreuses communautés de l’association Alsace Digitale, nous avons tous craqué sur les Ananas aussi bien en Jaune qu’en rose ou bleu, il y en a pour tous les goûts ! En plus d’être personnalisable les Dreems vous permettrons de protéger vos chargeurs pour un tarif compétitif qui débute à 10 euros et qui monte au maximum à 29,99 euros ! De quoi vous faire rêver un peu plus vous et votre entourage et surtout à petit prix !</p>\n<p><strong>Les cadeaux qui régalent :</strong></p>\n<p><strong>Wine Cluster </strong></p>\n<p>Fondée par Arnaud Tarry, Wine Cluster rassemble plus d’une vingtaine de vignerons indépendants alsaciens afin de proposer des solutions innovantes pour simplifier la vie des amoureux du vin au travers d’offres de service de proximité.</p>\n<p><strong>En parlant d’offrir, pour la soirée du 14 décembre des coffrets de Noël seront proposés rien que pour vous !</strong></p>\n<p>Sur le stand vous retrouverez :</p>\n<p>Un coffret découverte des vins d’Alsace : 14,99 euros pour une bouteille, 19,99 euros pour deux et 29,99 euros pour trois !</p>\n<p>Un coffret sélection Wine Cluster qui regroupe des grands crus et des vins d’exception : 29,99 euros pour une bouteille, 49,99 euros pour deux bouteilles et 59,99 euros pour trois !</p>\n<p>L’ensemble peut être autant acheté sur place que livré à domicile. Pour la livraison c’est jusqu’au samedi 23 décembre !</p>\n<p>Et si vous souhaitez déjà réserver votre coffret vous pouvez nous contacter à l’adresse mail suivante : <strong><a href=\"mailto:contact@strasbourg-startups.com\">contact@strasbourg-startups.com</a></strong></p>\n<p>Vous pouvez les retrouver en avance sur leur site internet : <strong><a href=\"https://cluster.wine/fr/\" rel=\"noopener\">https://cluster.wine/fr/</a></strong></p>\n<p><strong>Cuisine Aventure</strong></p>\n<p>Nicolas-Jean, créateur de la startup, propose tout comme Epopia, un apprentissage ludique de la cuisine par correspondance, aux enfants de 6 à 12 ans, en s’adaptant à leur niveau, aux ustensiles et à leurs indispositions alimentaires. Les enfants cuisinent avec plaisir et acquièrent par la découverte des compétences tout en développant leurs sens ce qui les rendra heureux et autonomes. Un concept qui réinvente la cuisine en famille ! Les abonnements proposés vont de 3 mois pour 45 euros à 12 mois pour 145 euros ! Une affaire !</p>\n<p>Pour les réticents aux abonnements de plusieurs mois vous pouvez essayer un mois pour seulement 15 euros !</p>\n<p>Pour plus d’informations vous pouvez rejoindre Cuisine Aventure sur son site internet : <strong><a href=\"https://www.cuisineaventure.com/\" rel=\"noopener\">https://www.cuisineaventure.com/</a></strong></p>\n<p><strong>Alsace Saveurs </strong></p>\n<p>Vos produits alsaciens préférés sous forme de box mensuelle ? C’est eux qui le font ! A offrir sous le sapin ou à déguster sur votre table de réveillon vous ne pouvez pas vous tromper ! Les saveurs de Noël comme le Foie Gras Entier de Canard ou le Saumon fumé Label Rouge sont également présentés et vendus en ce moment !</p>\n<p>Tenez regarder ça ne peut que vous donner envie : <strong><a href=\"https://www.alsacesaveurs.com/\" rel=\"noopener\">https://www.alsacesaveurs.com/</a></strong></p>\n<p><strong>Le Noël du Partage</strong></p>\n<p><strong>Mummyz</strong></p>\n<p>Si vous ne voulez pas jeter les restes de vos merveilleuses préparations des Fêtes de fin d’année, l’application que cette startup a créée va vous permettre de vous mettre en relation avec des gourmands. L’avantage c’est qu’on lutte contre le gaspillage et qu’on permet à tous de commander à petits prix tout en se faisant plaisir !</p>\n<p>Pour plus d’informations vous pouvez les retrouver sur le blog de Strasbourg Startups : <strong><a href=\"https://www.strasbourg-startups.com/startups/mummyz\" rel=\"noopener\">https://www.strasbourg-startups.com/startups/mummyz</a></strong></p>\n<p>Et si vous ne pouvez pas attendre les fêtes pour manger sans gaspiller allez sur leur site internet : <strong><a href=\"https://www.mummyz.fr/\" rel=\"noopener\">https://www.mummyz.fr/</a></strong></p>\n<p><strong>Les cadeaux bons pour notre santé :</strong></p>\n<p><strong>Fizimed</strong></p>\n<p>Emy est le produit phare de Fizimed ! Cette sonde de rééducation périnéale connectée associée à des exercices ludiques vous permettra en toute intimité chez vous d’atteindre vos objectifs santé tranquillement tout en étant encadré de manière sérieuse.</p>\n<p>Vous pouvez précommander dès maintenant Emy sur Indiegogo à 119 euros au lieu de 179 euros en cliquant sur le lien suivant : <strong><a href=\"http://www.fizimed.com/emy/\" rel=\"noopener\">http://www.fizimed.com/emy/</a></strong></p>\n<p><strong>Fizzup </strong></p>\n<p>Cette startup de coaching sportif en ligne lance un programme spécial pour les fêtes sous forme de réduction impressionnante !</p>\n<p>Votre programme fizzup pro annuel à 9,99 euros par mois au lieu de 19,99 euros ! soit 50% de réduction ! Profitez en, c’est maintenant mais si vous hésitez encore vous pouvez essayer gratuitement les fonctionnalités de base, cependant nous vous conseillons également le forfait qui vous permet d’accéder aux fonctionnalités avancées et qui est plus rentable qu’une salle de sport classique. Regardez c’est ici : <strong><a href=\"https://www.fizzup.com/fr/\" rel=\"noopener\">https://www.fizzup.com/fr/</a></strong> et ici aussi : <strong><a href=\"https://www.facebook.com/FizzUpFR/\" rel=\"noopener\">https://www.facebook.com/FizzUpFR/</a></strong></p>\n<p>5 fonctionnalités avancées sont proposées dans le forfait FizzUpPro :</p>\n<p>Des objectifs avancés, des programmes focus, la personnalisation manuelle des entrainements, l’accès à tous les contenus d’entraînement et l’accès au guide nutritionnel.</p>\n<p>Petit plus avec cette startup pour les fêtes : ils ont un calendrier de l’avent tip top ! 25 challenges concoctés spécialement pour vous !</p>\n<p><strong><a href=\"http://www.fizzup.com/fr/blog/le-calendrier-de-lavent-fizzup/\" rel=\"noopener\">http://www.fizzup.com/fr/blog/le-calendrier-de-lavent-fizzup/</a></strong></p>\n<p><strong>Les cadeaux sécurité :</strong></p>\n<p><strong>Awaken</strong></p>\n<p>La startup basée à Strasbourg est spécialisée dans les objets connectés qui sauvent des vies. En effet leur première solution, un boitier connecté qui réduit le temps d’intervention des secours lors d’un accident mais également en cas de vol ou de panne, va vous aider plus que vous ne pouvez l’imaginer. Grand Gagnant du prix de l’innovation sécurité routière 2017, Awaken a décidé de partager son succès en baissant les prix de leur boitier ;</p>\n<p>Un boitier vous coûtera 399,99 euros mais si vous en achetez deux en même temps vous en avez pour 749,99 euros soit une économie de 49,99 euros si vous souhaitiez l’offrir à vos proches. Regardez ; <strong><a href=\"https://awaken.fr/fr/accueil/\" rel=\"noopener\">https://awaken.fr/fr/accueil/</a></strong></p>\n<p>Rien n’est plus beau que la sécurité de ceux qui nous entourent.</p>\n<p><strong>My Quintus</strong></p>\n<p>Pour finir en beauté cette liste de Noël nous vous avons réservé votre lit ! Un lit personnalisable de la tête au pied ! Votre lit ne sera plus ce meuble que l’on rencontre quand le sommeil nous gagne, mais il deviendra un véritable lieu de vie rassemblant le théâtre de vos émotions. Unique en son genre My Quintus a poussé son projet encore plus loin et résout le problème du cognage de pieds à pieds, avec My Quintus Light vous pourrez enfin vous lever la nuit en toute sérénité à partir de seulement 55 euros !</p>\n<p>Pour les retrouver allez sur leur site internet ici : <strong><a href=\"https://www.myquintus.com/fr/\" rel=\"noopener\">https://www.myquintus.com/fr/</a></strong></p>\n<p>Une autre idée ?  N’hésitez pas à nous contacter via : <strong><a href=\"mailto:contact@strasbourg-startups.com\">contact@strasbourg-startups.com</a></strong></p>\n<p>Bonnes Fêtes de fin d’années à tous !</p>\n<p>Le lien de l’évènement Facebook c’est <strong><a href=\"https://www.facebook.com/events/1572493712834579/\" rel=\"noopener\">LA</a></strong> !</p>\n<p>Pour vous inscrire c’est <strong><a href=\"https://www.eventbrite.fr/e/billets-demo-night-13-41019432226?aff=erelexpmlt\" rel=\"noopener\">ICI</a></strong> !</p>\n<p>Et pour plus de renseignements sur les startups et l’écosystème c’est juste en bas :</p>\n<p><strong><a href=\"https://www.strasbourg-startups.com/startups\" rel=\"noopener\">STRASBOURG STARTUPS</a></strong></p>"
      legacy_cover: "/images/blog/lenoeldesstartups2017.webp"
