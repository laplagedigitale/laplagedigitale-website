  - key: "meetup-29-la-business-intelligence-pour-les-startups"
    fields:
      title: "Meetup #29 : La Business Intelligence pour les Startups"
      slug: "meetup-29-la-business-intelligence-pour-les-startups"
      excerpt: "Si un jour vous avez déjà extrait un fichier CSV d’une base de données puis nettoyer ses données et avez construit une série de graphiques à partir de ses…"
      body: "<p>Si un jour vous avez déjà extrait un <strong>fichier CSV</strong> d’une base de données puis nettoyer ses données et avez construit une série de graphiques à partir de ses données, vous avez déjà fait de la <strong>Business Intelligence</strong> (Informatique Décisionnelle en français) !</p>\n<p>Ce n’est donc pas sale et encore moins réservé aux grosses boîtes : en tant que startup vous devez connaître vos données, vous avez besoin de reporting et vous devez en produire pour vos investisseurs.</p>\n<p>Dans ce meetup nous verrons :</p>\n<ul><li><strong>Un entrepôt de données</strong> : comment et pourquoi ? Récupération et structuration des données par <a href=\"https://twitter.com/sebventures\" rel=\"noopener\">Sébastien Derivaux</a>, consultant en Data Science, Business Angel et éditeur du logiciel <a href=\"https://databrewery.co/\" rel=\"noopener\">DataBrewery</a></li><li><strong>un cas pratique</strong> : rapports et découverte simples et efficaces avec Metabase par <a href=\"https://twitter.com/radiothomas_\" rel=\"noopener\">Thomas Wickham</a>, Business Developer chez <a href=\"https://scalingo.com/\" rel=\"noopener\">Scalingo</a></li></ul>\n<p>Comme pour chaque meetup, nous finirons par une séance de questions – réponses suivie d’un moment de networking autour d’un buffet.</p>\n<p><strong>N’hésitez pas à venir échanger ! </strong>?</p>\n<p>?<strong>Où </strong>: Le Shadok </p>\n<p>?<strong>Quand</strong> : Jeudi 27 février 2020 </p>\n<p>?<strong>Lien billetterie </strong>: <a href=\"https://www.eventbrite.fr/e/billets-meetup29-la-business-intelligence-pour-les-startups-88631811133\" rel=\"noopener\">Billetterie Meetup #29</a></p>"
