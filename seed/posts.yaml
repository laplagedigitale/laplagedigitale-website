      legacy_path: "/coworker-de-la-semaine-yves-hertwig-lhomme-dun-seul-client/"
      created_at: "2013-10-14T12:39:55Z"
  - key: "coworker-de-la-semaine-kevin-soltysiak"
    fields:
      title: "[COWORKER DE LA SEMAINE] Kevin Soltysiak, le polyglotte de la programmation"
      slug: "coworker-de-la-semaine-kevin-soltysiak"
      excerpt: "C’est tout une réputation que s’est créé Kevin Soltysiak, à la Plage Digitale. Mais comme tous les coworkers, il doit aussi se présenter à vous ! Il prend…"
      body: "<p><strong> C’est tout une réputation que s’est créé Kevin Soltysiak, à la Plage Digitale. Mais comme tous les coworkers, il doit aussi se présenter à vous ! Il prend sans plus tarder la parole, pour remplir cette tâche :</strong></p>\n<p><strong>1) Qu’est-ce que Novelys ? Quelle est ta place dans cette boîte ?</strong></p>\n<p>Novelys est une entreprise de service informatique, développant des applications web et mobiles. Je suis développeur web, spécialisé dans la mécanique interne (= « backend ») des sites web. Je ne suis pas restreint, je fais un peu de tout : intégration,hébergement, gestion de clients et projets, devis et facturation.</p>\n<p>A la base, j’ai effectué deux stages chez Novelys. La première fois lorsque l’entreprise avait 4-5 ans et une seconde fois pour deux mois, à la fin de mes études en décembre 2011. Yann Klis, le fondateur, m’a engagé à la fin de cette période. A terme, je souhaite prendre plus de responsabilités, et pourquoi pas devenir associé.</p>\n<p><strong>2) Novelys est spécialisée dans des langages de programmation plutôt atypiques, non ?</strong></p>\n<p><img src=\"/images/blog/kevin-blog1.webp\" alt=\"kevin blog\" loading=\"lazy\">En effet, Novelys a été créé par des experts du web et de Ruby. Nous connaissons plusieurs langages de programmation mais, à vrai dire, tous nos projets sont développés en Ruby et Ruby on Rails car c’est la technologie qui nous semble la plus adaptée pour le type de travail que l’on fait. Néanmoins, avec le temps qui passe, le web et les technologies associées évoluent et progressent. Si une technologie autre que Ruby ou Rails nous paraît plus appropriée pour ce que l’on souhaite en faire, nous nous en servirons.</p>\n<p><strong>3) Vous venez de fêter vos 8 ans. Tu as quelque chose à dire pour l’occasion, sur tes projets ou sur ce que vous avez accompli avec Yann ?</strong></p>\n<p>En 8 ans, le web a changé et l’utilisation qu’on en fait aussi. Nous avons diversifié nos connaissances et nos langages (javascript client-side, base de données « NoSQL », …). On songe  également à faire des applications mobiles natives, c’est-à-dire des applications développées spécifiquement pour un iPhone ou un Android par exemple. Bien qu’il y ait des avantages non négligeables (disponibilité, mise à jour immédiate), le web n’est pas encore adapté à tous les projets d’application mobile. Mais ça avance dans le bon sens.</p>\n<p>De son côté, Yann est en train de développer Appsdeck, un service d’hébergement d’applications dans le cloud qu’il a présenté lors de la DemoNight #2. Quant à moi, j’ai quelques envies et idées auxquelles je réfléchis pour le moment, mais rien de concret à l’heure actuelle.</p>\n<p><strong>4) Qu’est-ce qui te plaît le plus dans le coworking et à la Plage ?</strong></p>\n<p>Les gens ont un vrai respect pour les autres. Il n’y a pas trop de bruit et l’ambiance est sympa. On a pu assister et participer à des réels échanges avec les autres coworkers, en développant des applications mobiles pour <a href=\"www.rue89strasbourg.com\">Rue89 Strasbourg</a> entre autres.</p>\n<p>Si je n’avais pas été dans un espace de coworking en travaillant chez Novelys, je pense que j’aurai quand même choisi ce mode de travail.</p>\n<blockquote><p>Kevin Soltysiak, novelys<br>\n<a href=\"http://www.novelys.com/\" rel=\"noopener\">Novelys.com</a>    <a href=\"https://www.facebook.com/novelyscompany\" rel=\"noopener\"><img src=\"/images/blog/test1.webp\" alt=\"test1\" loading=\"lazy\"></a>      <a href=\"https://twitter.com/novelys\" rel=\"noopener\"><img src=\"/images/blog/test2.webp\" alt=\"test2\" loading=\"lazy\"></a></p></blockquote>"
      legacy_cover: "/images/blog/kevin-en-vignette.webp"
      status: "published"
      published_at: "2013-10-28"
      categories: ["actualites"]
      legacy_path: "/coworker-de-la-semaine-kevin-soltysiak/"
      created_at: "2013-10-28T11:33:19Z"
  - key: "coworker-de-la-semaine-thierry-joly"
    fields:
      title: "[COWORKER DE LA SEMAINE] Thierry Joly,la sécurité assurée"
      slug: "coworker-de-la-semaine-thierry-joly"
      excerpt: "Nous avons vu récemment qu’une faible attention est accordée à la sécurité des données des entreprises dans le cadre du télétravail. Parmi nos coworkers…"
      body: "<p><strong>Nous avons vu récemment qu’une faible attention est accordée à <a href=\"http://sco.lt/7Gxzof\" rel=\"noopener\">la sécurité des données des entreprises</a> dans le cadre du télétravail. Parmi nos coworkers, Thierry est bien placé pour nous en parler ! Initialement informaticien, il a créé sa propre entreprise dans le domaine de la sécurité. Il nous en parle en détails :</strong></p>\n<p><strong>1) Qu’est-ce qu’est C2RIS ?</strong></p>\n<p>C2RIS est à la fois une société de service informatique et un cabinet de conseil. Je suis informaticien de formation, j’ai travaillé dans la Recherche &amp; Développement puis dans la recherche pure avant de devenir consultant en infrastructure, réseaux et sécurité informatique. J’ai souhaité ensuite monter ma propre boîte. Après une  première création qui s’est soldée par un échec, C2RIS est née en novembre 2011.</p>\n<p><img src=\"/images/blog/thierry-blog.webp\" alt=\"Thierry Joly, fondateur de c2ris, cabinet de conseil informatique et en sécurité\" loading=\"lazy\">C2RIS propose un large éventail de services destinés principalement aux PME. Nous pouvons les classer en trois catégories. La première, les services professionnels, regroupe l’audit, les analyses de risques, le conseil et l’assistance en infrastructure et sécurité. Ensuite, il y a les services hébergés. Ça inclut par exemple le déploiement en local d’un serveur de stockage / sauvegarde, qui est supervisé et répliqué vers un data center. Enfin, je propose des services infogérés, comme par exemple la gestion du changement et la supervision de toutes les solutions de sécurité du client,  ou bien encore  des serveurs virtuels hébergés en data center, englobant l’exploitation des OS, des bases de données, des sauvegardes et des accès distants.</p>\n<blockquote><p>[En sécurité] Nous passons d’un modèle d’investissement à un modèle de service</p></blockquote>\n<p><strong>2) Pourquoi les entreprises sont-elles prêtes à externaliser tout ça ?</strong></p>\n<p>Avant, les entreprises investissaient dans du matériel et formaient du personnel pour gérer leurs infrastructures. Mais par manque de temps, de moyens et de compétences, elles se sont rendu compte que ce n’était pas leur métier et qu’il était plus avantageux de faire appel à des tiers. Nous passons d’un modèle d’investissement à un modèle de service, l’outil informatique est devenu  un service comme un autre.  Toutes les entreprise utilisent aujourd’hui internet dans leurs relations avec les clients et les fournisseurs, et les dirigeants prennent conscience peu à peu que la sécurité est un point essentiel. Cette dernière se déclinant traditionnellement suivant les trois axes : Disponibilité, Intégrité et Confidentialité des données.</p>\n<p>Très souvent ce sont des intégrateurs généralistes, ceux qui fournissent PC, imprimantes, serveurs qui mettent aussi en place des solutions du type anti-virus, logiciels de sauvegarde et pare-feu, puis les laissent ensuite en l’état sans aucune gestion ni supervision. Une solution de sécurité n’est efficace que si elle est gérée au quotidien. C’est la raison pour laquelle toutes les solutions proposées par C2RIS sont supervisées et produisent des tableaux de bord périodiques du fonctionnement.</p>\n<p><strong>3) Arrives-tu à gérer tous les domaines pour développer ton entreprise ?</strong></p>\n<p>Evidemment, je ne peux pas tout faire, c’est la raison pour laquelle je travaille avec un réseau de partenaires locaux spécialisés et certifiés (solutions Microsoft, authentification biométrique, …), De plus, étant informaticien de formation et non pas commercial, je travaille avec une société de développement commercial qui définit mes offres et ciblent les prospects.</p>\n<p>Pour le moment je suis seul, mais C2RIS se développant, j’espère pouvoir recruter prochainement.</p>\n<p><img src=\"/images/blog/logo-c2ris.webp\" alt=\"Logo C2ris, cabinet de conseil informatique et en sécurité\" loading=\"lazy\"></p>\n<p><strong>4) Comment t’es-tu retrouvé à la Plage ?</strong></p>\n<p>Ayant eu l’expérience des bureaux privatifs par le passé,  j’ai commencé à travailler depuis chez moi lors du lancement de C2RIS, mais j’ai rapidement souhaité ne pas rester seul. Le coworking était pour moi une sorte de melting pot au potentiel intéressant, car lors de la création d’entreprise, tu as aussi une difficulté que sont les aspects communication,  visibilité et retour d’expérience.</p>\n<p>J’ai donc choisi délibérément de venir pour rencontrer des gens et voir d’autres horizons. La situation géographique était primordiale. En plein centre, l’accès à la Plage est facile : à pied, en vélo, en tram, de plus les clients peuvent facilement venir et stationner avant d’arriver dans une des salles de réunion.</p>\n<blockquote><p>Thierry joly, fondateur de c2ris<br>\n<a href=\"http://www.c2ris.com/\" rel=\"noopener\">c2ris.com</a></p></blockquote>"
      legacy_cover: "/images/blog/thierry-en-vignette.webp"
      status: "published"
      published_at: "2013-11-04"
      categories: ["actualites"]
      legacy_path: "/coworker-de-la-semaine-thierry-joly/"
      created_at: "2013-11-04T08:23:34Z"
  - key: "coworkers-de-la-semaine-good-morning-major-4-plagistes-en-un"
    fields:
      title: "[COWORKERS DE LA SEMAINE] Good Morning Major, 4 Plagistes en un"
      slug: "coworkers-de-la-semaine-good-morning-major-4-plagistes-en-un"
      excerpt: "Good Morning Major est une agence web composée de 4 professionnels. Agence de création et de stratégie digitale, cette structure s’intègre parfaitement à la…"
      body: "<p><strong>Good Morning Major est une agence web composée de 4 professionnels. Agence de création et de stratégie digitale, cette structure s’intègre parfaitement à la Plage Digitale. Jérémy Kieger, gérant de la web agency répond à nos questions :</strong></p>\n<p><strong>1) En tant qu’agence de création et de stratégie digitale, le travail doit être énorme. Comment vous répartissez-vous les tâches ?</strong></p>\n<p>Nous voulons une agence performante pour nos clients alliant création visuelle impactante, technique de grande exigence et stratégie e-marketing efficace. Good Morning Major propose ces compétences transversales pour positionner efficacement nos clients sur le web. Nous mettons en place des outils adaptés aux besoins de l’entreprise, ergonomiques et commercialement efficaces. Nous fonctionnons par pôle de compétences : création graphique-webdesign, intégration-développement et e-marketing. Notre organisation en interne est en constante optimisation afin d’améliorer notre productivité et nous travaillons en amont avec nos clients pour cibler les objectifs attendus et baliser les projets.</p>\n<p><strong>2) Quelle histoire y a-t-il derrière l’agence GMM ?</strong></p>\n<p><img src=\"/images/blog/gmm-blog1.webp\" alt=\"Good Morning Major, agence de communication à Strasbourg\" loading=\"lazy\">Nous avons imaginé Good Morning Major il y a un peu plus de 2 ans avec la volonté de créer une agence avec une offre transparente, complète et accessible. Nous avions travaillé ensemble pendant 2 ans avant de créer GMM. Nous partageons une vision commune du digital où le marketing est au cœur des prestations pour que chaque outil accompagne le développement des clients, en chiffre d’affaires ou en contacts.</p>\n<p><strong>3) A quel genre de clients avez-vous à faire ?</strong></p>\n<p>Il s’agit souvent de PME qui sont implantées depuis longtemps et qui abordent le virage digital. Nous travaillons également avec des institutions, créateurs d’entreprises, chargé(e)s de communication et e-commerçants. Selon la taille de la structure et des compétences en interne, nous adaptons nos champs d’intervention : de la prestation clé en main aux formations personnalisées. Nous sommes heureux de nos clients avec lesquels nous échangeons de très bonnes relations.</p>\n<p><strong>4) Pourquoi être venus à la Plage ?</strong></p>\n<p>Cet espace répond à nos besoins en flexibilité et nous a permis de nous installer rapidement. La Plage Digitale permet d’accueillir nos clients dans de bonnes conditions, notamment grâce à la mise à disposition de salles de réunions très confortables. Notre métier nécessite beaucoup de « veille technologique » et nous échangeons souvent les technicités entre co-workeurs.</p>\n<p><strong>5) Quels projets avez-vous mis en place avec les autres Plagistes ?</strong></p>\n<p>Certaines structures nous ont fait confiance pour la création d’outils web et création visuelle : site vitrine, site e-commerce, supports de communication. Nous menons plusieurs projets en co-traitance avec différentes entreprises de la Plage afin de proposer un éventail de prestations plus large à nos clients. Good Morning Major souhaite continuer son développement au sein de la Plage Digitale et s’impliquer dans son évolution.</p>\n<blockquote><p> Good Morning Major : Caroline Boehrer, Jérémy Kieger, Sébastien Lorentz et Thomas Keck.<br>\n<a href=\"http://www.goodmorningmajor.com\" rel=\"noopener\">goodmorningmajor.com</a>     <a href=\"https://www.facebook.com/goodmorningmajor\" rel=\"noopener\"><img src=\"/images/blog/test1.webp\" alt=\"test1\" loading=\"lazy\"></a>     <a href=\"https://twitter.com/actudigitale\" rel=\"noopener\"><img src=\"/images/blog/test2.webp\" alt=\"test2\" loading=\"lazy\"></a>     <a href=\"https://plus.google.com/u/0/113920994099455921614/posts\" rel=\"noopener\"><img src=\"/images/blog/06003950-photo-logo-google-plus.webp\" alt=\"06003950-photo-logo-google-plus\" loading=\"lazy\"></a></p></blockquote>"
      legacy_cover: "/images/blog/gmm-en-vignette.webp"
      status: "published"
      published_at: "2013-11-11"
