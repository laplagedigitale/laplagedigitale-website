      legacy_path: "/meetup-1-la-premiere-de-mulhouse-startups/"
      created_at: "2017-02-02T10:51:04Z"
  - key: "bizz-and-buzz-les-evenements-alsace-digitale"
    fields:
      title: "Bizz and Buzz : les événements Alsace Digitale"
      slug: "bizz-and-buzz-les-evenements-alsace-digitale"
      excerpt: "Du 7 au 9 mars prochain se déroulera Bizz & Buzz, le Festival du Numérique en Alsace et dans le Grand Est, organisé par la CCI Alsace Eurométropole. Plusieurs…"
      body: "<p><strong>Du 7 au 9 mars prochain se déroulera Bizz &amp; Buzz, le Festival du Numérique en Alsace et dans le Grand Est, organisé par la CCI Alsace Eurométropole. Plusieurs événements auront lieu durant ces 3 jours, dont certains sont orchestrés par Alsace Digitale. Petit tour d’horizon…</strong></p>\n<ul><li><h4><strong>Matinée Vin et Digital</strong></h4></li></ul>\n<p>Trackers et capteurs pour optimiser la vinification, drones cartographes pour faciliter l’exploitation des vignes, gestion personnalisée de caves à vin, ainsi qu’une brasserie centenaire à l’ère du numérique… Venez découvrir  la diversité des acteurs qui participent aujourd’hui à<strong> la réinvention du vin.</strong></p>\n<p>L’idée est d’échanger sur les pratiques, de pouvoir dialoguer avec des entreprises innovantes et de partager son expérience. De plus, <strong>une vidéoconférence sera établie en direct avec le Japon !<br>\n</strong></p>\n<p>La matinée se clôturera par une découverte de l’hôtel d’entreprises japonaises de l’<a href=\"http://www.ceeja-japon.com/\" rel=\"noopener\"><strong>Agence Japon Alsace</strong></a> (AJA / CEEJA), unique en Europe,  autour d’un moment de convivialité franco-japonais ! <strong>Une dégustation de vins sera proposée par <a href=\"http://www.divinesdalsace.com/\" rel=\"noopener\">Divines d’Alsace</a>.</strong></p>\n<p><strong>Y aller : Jeudi 9 mars de 10h à 12h à l’Agence Japon Alsace (AJA / CEEJA)  – 8 route d’Ammerschwihr 68240 Kientzheim</strong></p>\n<p><strong><a href=\"http://bizzandbuzz.fr/billetterie/\" rel=\"noopener\">JE PARTICIPE !</a></strong></p>\n<ul><li><h4><strong>Atelier Coding Club par Play2Code.</strong></h4></li></ul>\n<p>Le codage informatique représente l’avenir, c’est pourquoi il est nécessaire d’en acquérir les bases de plus en plus tôt. <strong><a href=\"http://www.play2code.eu/\" rel=\"noopener\">Play2Code</a></strong> propose tout au long de l’année des ateliers pour <strong>initier les jeunes à la culture numérique et à la programmation informatique</strong>, encadrés par des étudiants d’<a href=\"http://www.epitech.eu/\" rel=\"noopener\"><strong>Epitech</strong></a>.</p>\n<p>A l’occasion de Bizz &amp; Buzz, un atelier est proposé à <strong>Mulhouse le mercredi 8 mars pour les jeunes de 14 à 18 ans</strong>, en partenariat avec e-nov Campus. C’est gratuit et aucune compétence préalable en programmation n’est nécessaire !</p>\n<p><strong>Y aller : Mercredi 8 mars de 14h à 15h30 à la Maison de l’entrepreneur – 11 Rue du 17 Novembre, 68100 Mulhouse<br>\n</strong></p>\n<p><strong><a href=\"http://bizzandbuzz.fr/sessions/coding-club/\" rel=\"noopener\">JE PARTICIPE !</a></strong></p>\n<ul><li><h4><strong> Workshop Propriété intellectuelle et numérique<br>\n</strong></h4></li></ul>\n<p>Propriété intellectuelle, droit d’auteur, droit des logiciels, droit des médias, encadrement juridique des nouvelles technologies et des jeux vidéo, nouvelles réglementations européennes sur la protection des données… <strong>un cadre juridique vaste et en pleine mutation</strong>, dans lequel il est aisé de se perdre pour les non-initiés.</p>\n<p>Or, une startup qui propose du contenu audiovisuel ou interactif, qui produit des jeux vidéo (notamment des « serious games ») ou des applications, qui crée ou utilise des logiciels ou qui manie de nombreuses données ne possède généralement pas l’expertise nécessaire sur ces sujets et doit donc être conseillée afin d’<strong>éviter les erreurs qui peuvent bloquer les projets…</strong></p>\n<p><strong>Gilles Vercken</strong>, avocat aux Barreaux de Paris et de Strasbourg (en partenariat avec <strong><a href=\"http://www.fidal.com/\" rel=\"noopener\">Fidal</a></strong> à Strasbourg) répondra à toutes vos questions durant cette matinée.</p>\n<p><strong>Y aller : </strong><strong>Mercredi 8 mars de 9h à 13h à la Plage Digitale Rivetoile – 15 route du Rhin, 67100 Strasbourg</strong></p>\n<p><strong>COMPLET</strong></p>\n<p>Toute la programmation du Festival Bizz &amp; Buzz <a href=\"http://bizzandbuzz.fr/programme/\" rel=\"noopener\"><strong>ICI</strong></a>.</p>"
      legacy_cover: "/images/blog/articlebizzad.webp"
      status: "published"
      published_at: "2017-02-23"
      categories: ["actualites", "evenements"]
      legacy_path: "/bizz-and-buzz-les-evenements-alsace-digitale/"
      created_at: "2017-02-23T10:35:58Z"
  - key: "code-ton-avenir-parce-que-le-futur-se-programme"
    fields:
      title: "Code ton #Avenir, parce que le futur se programme"
      slug: "code-ton-avenir-parce-que-le-futur-se-programme"
      excerpt: "Prenez votre futur en main grâce au digital ! Le 31 mars et 1er avril, le numérique sera à l’honneur dans le cadre du forum « Code ton #Avenir » ! Ce forum se…"
      body: "<p><strong>Prenez votre futur en main grâce au digital ! Le 31 mars et 1er avril, le numérique sera à l’honneur dans le cadre du forum « Code ton #Avenir » ! Ce forum se déroulera au Shadok à Strasbourg.</strong></p>\n<p><strong>Code ton #Avenir</strong> a pour but d’inciter les <strong>jeunes</strong> (filles et garçons) à s’engager dans la <strong>révolution numérique</strong>. Il est vrai que le digital se crée une place de plus en plus important dans notre société, et même auprès des professions qui en semblent aujourd’hui éloignées. En effet, des branches comme l’horticulture, la restauration ou encore la joaillerie nécessitent une bonne utilisation des nouvelles technologies.</p>\n<p>Durant ce forum, des <strong>ateliers</strong> seront organisés par différentes associations spécialistes du digital afin de promouvoir les activités du numérique, telles que les collectifs <strong><a href=\"http://ouhackpo.eu\" rel=\"noopener\">OUhackpO</a></strong>, <strong><a href=\"http://lespetitsdebrouillards.org\" rel=\"noopener\">Les petits débrouillards</a></strong>, <strong><a href=\"http://www.CoderDojo.Alsace\" rel=\"noopener\">CoderDojo</a>Alsace</strong>, <a href=\"http://codingclub.epitech.eu\" rel=\"noopener\"><strong>Coding Club</strong></a>, <strong><a href=\"http://supercoders.orange.com/fr/accueil\" rel=\"noopener\">Orange</a></strong>, <a href=\"http://www.methodinthemadness.eu/\" rel=\"noopener\"><strong>Method in the Madness</strong></a>, <a href=\"https://www.av-lab.net/\" rel=\"noopener\"><strong>AV Lab</strong></a>, <strong>IC Lab</strong> et <strong><a href=\"https://iuthaguenau.unistra.fr/\" rel=\"noopener\">l’IUT de Haguenau</a>, <a href=\"https://www.strataggem.com/fr/\" rel=\"noopener\">Strataggem</a>, <a href=\"https://www.facebook.com/FormMaker-1653710084867857/\" rel=\"noopener\">Form Maker</a>, <a href=\"http://www.u-gems.com/\" rel=\"noopener\">Ugems</a>,<a href=\"http://supercoders.orange.com/en/home\" rel=\"noopener\"> Supers Codeurs Orange</a>.</strong></p>\n<p>Ces ateliers et rencontres sont sources de <strong>motivation</strong> pour les jeunes et les mettent face à des perspectives professionnelles réalistes. De plus, ils participent à la lutte contre le décrochage scolaire en suscitant l’envie de découvrir et d’acquérir de nouvelles connaissances.</p>\n<p>Les contenus pédagogiques seront transmis aux enseignants, afin que ces derniers puissent continuer à <strong>transmettre cette culture</strong> dans leurs classes.</p>\n<p><strong>Entrée libre et gratuite !</strong></p>\n<p>Lien Facebook de l’événement : <a href=\"https://www.facebook.com/events/1847596738820689/\" rel=\"noopener\">https://www.facebook.com/events/1847596738820689/</a></p>\n<p><strong>Atelier de formation pour adultes</strong></p>\n<p><strong>Dans le cadre du <a href=\"/blog/code-ton-avenir-parce-que-le-futur-se-programme\">Forum Code ton #avenir</a>, une matinée de formation au code informatique pour adulte a lieu le vendredi 31 mars.<br>\n</strong></p>\n<p><strong><a href=\"http://www.alsacedigitale.org/\" rel=\"noopener\">Alsace Digitale</a></strong> propose depuis quelques années des <strong>ateliers d’apprentissage</strong> du code destinés aux <strong>jeunes</strong>. Le but de cette formation est de démultiplier les énergies et les lieux ressources en <strong>formant des adultes relais</strong> qui à leur tour pourraient animer des <strong>ateliers</strong>.</p>\n<p>Cette formation est gratuite <strong><a href=\"https://www.eventbrite.fr/e/billets-code-ton-avenir-formation-adulte-relais-32532160568\" rel=\"noopener\">SUR INSCRIPTION</a>. </strong>En savoir plus<strong> <a href=\"/blog/code-ton-avenir-formation-adulte-relais\">ICI</a>.</strong></p>\n<p><strong>Y aller : Vendredi 31 mars et samedi 1er avril au Shadok – 25 presqu’ile André Malraux, 67000 Strasbourg</strong></p>\n<p>Cet évènement est soutenu par <strong>Orange, l’Eurométropole de Strasbourg, Tango &amp; Scan et Epitech</strong>.</p>"
      legacy_cover: "/images/blog/capture-decran-2017-02-23-a-15-33-22.webp"
