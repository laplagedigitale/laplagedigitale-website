  - key: "demo-night-8"
    fields:
      title: "Démo night #8"
      slug: "demo-night-8"
      excerpt: "Chers entrepreneurs, s’il y a bien un évènement à ne pas louper en cette fin d’année, c’est la traditionnelle Demo Night organisée par Strasbourg Startups by…"
      body: "<p>Chers entrepreneurs, s’il y a bien un évènement à ne pas louper en cette fin d’année, c’est la traditionnelle <strong>Demo Night</strong> organisée par<strong> Strasbourg Startups</strong> by Alsace Digitale.</p>\n<p>Le principe est de faire découvrir des startups alsaciennes innovantes. Les entrepreneurs disposent de 5 minutes chacun pour présenter leur projet, nous faire rêver et “make the world a better place” ! Pour ce faire, pas de blabla, uniquement de la démo. En d’autres termes, c’est une plongée concrète dans la fabrique des produits et services émergents : une vraie performance, un vrai show !</p>\n<p>Les cinq entrepreneurs qui présenteront leurs projets ce 17 décembre seront :</p>\n<ul><li><a href=\"https://gust.com/companies/adgero\" rel=\"noopener\">Adgero</a> : Un système qui transforme n’importe quel poids-lourd en véhicule hybride électrique pour réduire sa consommation de carburant jusqu’à 25%.</li><li><a href=\"http://awaken.fr/fr/accueil/\" rel=\"noopener\">Awaken</a> : La voiture connectée qui sauve des vies et prévient des vols grâce à la pertinence de ses notifications en temps réel.</li><li><a href=\"https://www.jeemix.com/\" rel=\"noopener\">Jeemix</a> : Une application smartphone gratuite qui offre à ses utilisateurs l’opportunité de s’approprier les espaces commerciaux qu’ils visitent, d’y partager leurs goûts et d’y exprimer leur personnalité en choisissant la musique qui y est diffusée.</li><li><a href=\"http://www.jesuisriskmanager.com/\" rel=\"noopener\">JeSuisRiskManager</a> : Le premier simulateur de risk management pour les entreprises. Conçu pour améliorer la performance des Petites et Moyennes Entreprises par une gestion collective et ciblée de leurs vulnérabilités.</li><li><a href=\"http://www.kalendoc.com/\" rel=\"noopener\">Kalendoc</a> : Un site qui vous permet de prendre rendez-vous en moins d’une minute avec des médecins ou des dentistes, en ligne ou par téléphone.</li><li><a href=\"https://www.mummyz.fr/\" rel=\"noopener\">Mummyz</a> : Une application qui permet à des cuisiniers en herbe de partager leurs parts supplémentaires de plats cuisinés à la maison en échange d’une contribution financière raisonnable.</li><li><a href=\"http://www.strataggem.com/\" rel=\"noopener\">Strataggem</a> : L’internet des objets qui vous permet de localiser et retrouver les objets qui vous sont chers. Soyez assuré de toujours savoir où se trouve votre vélo !</li></ul>\n<p>Cet événement est soutenu par Etena-pepite.<br>\n<a href=\"http://www.eventbrite.fr/e/billets-demonight-8-19234879041\" rel=\"noopener\">Inscrivez-vous gratuitement</a></p>\n<p><strong>Date : Jeudi 17 décembre 2015</strong><br>\n<strong>Lieu : Centre de Culture Numerique rue Descartes</strong></p>"
      legacy_cover: "/images/blog/demonight22.webp"
      status: "published"
      published_at: "2015-11-30"
      categories: ["actualites", "evenements"]
      legacy_path: "/demo-night-8/"
      created_at: "2015-11-30T13:51:34Z"
  - key: "devenez-voyageur-du-code"
    fields:
      title: "Devenez voyageur du code"
      slug: "devenez-voyageur-du-code"
      excerpt: "Alsace Digitale propose depuis quelques années des ateliers d’apprentissage du code destinés aux collégiens et aux lycéens. Pour démultiplier les énergies et…"
      body: "<p><img src=\"/images/blog/logo-vdc2.webp\" alt=\"logo_vdc2\" loading=\"lazy\"></p>\n<p>Alsace Digitale propose depuis quelques années des ateliers d’apprentissage du code destinés aux collégiens et aux lycéens. Pour démultiplier les énergies et les lieux ressources, elle s’associe aujourd’hui à Bibliothèques sans Frontières  pour former des <strong>adultes relais qui à leur tour pourraient animer des ateliers.</strong></p>\n<p><strong>Rendez- vous :</strong></p>\n<h4><strong>Mercredi 20 janvier : 09h/13h à la Plage Rivétoile – Alsace Digitale – Strasbourg</strong></h4>\n<h4><strong>Jeudi 21 janvier : 09h/13h à la Fonderie – E-nov Campus – Mulhouse</strong></h4>\n<p>Cette formation est gratuite sur <a href=\"https://docs.google.com/forms/d/157xbpfAWsY9-8sgKsYZxT2XSMmhi3-WSnE4C5P-dBXs/viewform\" rel=\"noopener\">inscription</a>.</p>\n<p>Il s’agit de vous présenter les outils et la plateforme « <a href=\"http://www.voyageursducode.fr/\" rel=\"noopener\">Voyageurs du Code</a> » qui vous permettront d’animer vos ateliers ultérieurement. Bien sur, nous ne vous laisserons pas dans la nature et Alsace Digitale en lien avec des étudiants de l’école Epitech assurera également un suivi de proximité.</p>\n<p><img src=\"/images/blog/shema-vdcvf.webp\" alt=\"shema_vdcVF\" loading=\"lazy\"><img src=\"/images/blog/shema-vdcvf.webp\" alt=\"shema_vdcVF\" loading=\"lazy\">invitation-vdc-Strasbourg                                            invitation-vdc-Mulhouse-copie</p>\n<p>Les ateliers qui pourront être déployés à posteriori par ces adultes relais, permettent d’amener les enfants à se poser des questions sur le fonctionnement de l’ordinateur et des jeux qu’ils côtoient au quotidien. L’approche créative et collaborative de la programmation informatique leur permet de s’amuser tout en découvrant une nouvelle façon de s’exprimer avec le langage informatique.</p>\n<p><img src=\"http://fr.flossmanuals.net/le-guide-du-voyageur-du-code/presentation-de-voyageurs-du-code/static/shema_vdcVF.jpg\" alt=\"Afficher l&#x27;image d&#x27;origine\" loading=\"lazy\"></p>\n<p>Ces ateliers offrent des clés nouvelles pour comprendre un quotidien hautement numérique et permettent aux plus motivés de se former et d’ouvrir des perspectives professionnelles nouvelles à travers le code.</p>\n<p>La programmation peut être <strong>ludique et créative</strong>. Il s’agit de <strong>dédramatiser et démystifier la programmation</strong>. Elle représente un levier pour développer des<strong> capacités annexes </strong>:</p>\n<ul><li><strong>la créativité</strong>, par le passage d’une position de consommateur de produits numériques à celle d’acteur et de producteur ;</li><li><strong>le sens logique</strong>, par l’acquisition d’une méthode de raisonnement et la capacité à résoudre un problème dans son ensemble ;</li><li><strong>l’autonomie et la confiance en soi</strong>,par le contrôle acquis sur l’environnement grâce à une nouvelle compréhension de son fonctionnement ;</li><li><strong>la rigueur et l’attention</strong>,deux exigences intrinsèques à l’apprentissage du code et à ses subtilités syntaxiques et orthographiques ;</li><li><strong>l’esprit d’entrepreneuriat</strong>,par toutes les possibilités offertes par la programmation informatique.</li></ul>\n<p>En marge de l’apprentissage du code et des langages, le programme insiste sur les notions de littératie numérique. Les participants sont accompagnés dans leur maîtrise des outils numériques, afin de de passer du statut de consommateur de produits numériques à celui de <strong>consommateur éclairé et averti, voire de créateur.</strong></p>"
      legacy_cover: "/images/blog/logo-vdc2.webp"
      status: "published"
      published_at: "2015-12-22"
      categories: ["actualites", "coding-club", "evenements"]
      legacy_path: "/devenez-voyageur-du-code/"
      created_at: "2015-12-22T12:08:00Z"
