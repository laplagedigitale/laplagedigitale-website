  - key: "startup-weekend-mulhouse-3"
    fields:
      title: "Startup Weekend Mulhouse #3"
      slug: "startup-weekend-mulhouse-3"
      excerpt: "Startup Weekend : Créez l’entreprise de vos rêves en 54h ! Vous avez un projet et vous souhaitez trouver une équipe pour y travailler ? Vous n’avez pas d’idée…"
      body: "<h2>Startup Weekend : Créez l’entreprise de vos rêves en 54h !</h2>\n<p>\nVous avez un projet et vous souhaitez trouver une équipe pour y travailler ? Vous n’avez pas d’idée et vous aimeriez collaborer sur un projet innovant et motivant ?</p>\n<p>Quel que soit votre profil, le <b>Startup Weekend Mulhouse vous permettra de vivre une expérience entrepreneuriale</b> décoiffante ! Venez seul ou entre amis pour faire des rencontres et participer à l’élaboration d’un projet ou de votre projet !</p>\n<p>Startup Weekend est un mouvement mondial d’entrepreneurs actifs et confirmés, qui transmet les bases de la création de startups et du lancement de projets. C’est la plus grande communauté d’entrepreneurs, comptant plusieurs centaines d’évènements dans autant de villes du monde.</p>\n<p>Tous les événements Startup Weekend suivent le même principe : <b>chacun présente son idée et reçoit ensuite les avis des autres participants</b>. Les équipes se forment autour des meilleures idées élues par les participants. </p>\n<p>C’est le début de<b> 54 heures de brainstorming déchaîné autour du développement de l’idée, de la création d’un business model, de design, de développement, de marketing</b>… entouré par des coachs passionnés et pertinents. Les coachs sont des professionnels aguerris dans leur domaine de compétence (management, techniques, marketing, droit, communication…).</p>\n<p>Des mini-conférences sont organisées pour inspirer les participants. Les speakers partagent leurs expériences, leurs victoires, mais aussi et surtout, leurs défaites et leurs rebonds.</p>\n<p>Le tout s’achève par la présentation des projets devant un jury d’experts et d’entrepreneurs qui voteront pour les projets les plus prometteurs. Les lauréats remporteront de quoi faciliter la validation et la création de leur projet.</p>\n<p>Que vous souhaitiez trouver des associés, faire de nouvelles rencontres professionnelles ou encore tout simplement élargir vos compétences,cette expérience vous permettra d’approcher le monde des startups différemment, avec pour cet édition une ouverture trinationale : France / Allemagne/ Suisse.</p>\n<h3>Un startup weekend c’est un moment intense, inspirant dédié à votre créativité dans une ambiance unique. Alors n’attendez-plus et <a href=\"http://www.eventbrite.com/event/15181291652?aff=UP%20Community%20Sites\" rel=\"noopener\">inscrivez-vous</a> !</h3>\n<p><strong>Lieu</strong> : ENSISA, 12 rue des Frère Lumière<br>\n<strong>Date :</strong> Du 22 au 24 avril 2016<br>\n<strong>Site Startup Weekend Mulhouse :</strong> <a href=\"http://swmlh.eu\" rel=\"noopener\">http://swmlh.eu</a></p>"
      legacy_cover: "/images/blog/swmlh.webp"
      status: "published"
      published_at: "2016-03-30"
      categories: ["actualites", "evenements"]
      legacy_path: "/startup-weekend-mulhouse-3/"
      created_at: "2016-03-30T09:41:48Z"
