    fields:
      title: "Découvrez les Spring Camps et événements Play2Code du mois d’avril"
      slug: "decouvrez-les-spring-camps-et-evenements-play2code-du-mois-davril"
      excerpt: "Plusieurs événements Play2Code sont organisés durant les vacances scolaires du mois d’avril, l’occasion pour les collégiens et les lycéens de s’initier aux…"
      body: "<p><strong>Plusieurs événements <a href=\"http://www.play2code.eu/\" rel=\"noopener\">Play2Code </a>sont organisés durant les vacances scolaires du mois d’avril, l’occasion pour les collégiens et les lycéens de s’initier aux outils numériques et à la programmation informatique.</strong></p>\n<h3><strong>Les Spring Camps</strong></h3>\n<p>Profitons des vacances scolaires pour coder !</p>\n<p>Les Spring Camp Coding Club (lycéens) et les Code4Kids Spring Camps (collégiens) sont de retour durant les congés scolaires de printemps. La recette est la même : chacun avance à son rythme, les participants mobilisent d’abord leurs compétences en suivant des tutoriels sur-mesure et des animateurs sont présents pour les aider.</p>\n<ul><li><strong>Code4kids Spring Camps :</strong></li></ul>\n<p>Lundi 10 avril de 14h à 17h au Shadok</p>\n<p>Mardi 11 avril de 10h à 17h au Shadok</p>\n<p><strong>Y aller :</strong> 10-14 ans. Gratuit sur inscription – Le Shadok, 25 presqu’île André Malraux 67100 Strasbourg</p>\n<p>Inscription <a href=\"http://www.play2code.eu/events/code4kids-spring-camp/\" rel=\"noopener\"><strong>ICI</strong></a>.</p>\n<ul><li><strong>Spring Camps Coding Club</strong></li></ul>\n<p>Mercredi 12 avril de 10h à 17h à <strong>Epitech</strong></p>\n<p>Jeudi 13 avril de 10h à 17h à <strong><a href=\"http://www.epitech.eu/strasbourg/ecole-informatique-strasbourg.aspx\" rel=\"noopener\">Epitech</a></strong></p>\n<p><strong>Y aller :</strong> 15-18 ans. Gratuit sur inscription – <a href=\"http://www.epitech.eu/strasbourg/ecole-informatique-strasbourg.aspx\" rel=\"noopener\">Epitech</a>, 4 rue du Dôme, 67000 Strasbourg</p>\n<p>Inscription <a href=\"https://docs.google.com/a/alsacedigitale.org/forms/d/e/1FAIpQLSc6VtrMKvm1NDWre1r8qg1Ako1Msi0C0TQqhmd6BnOhkUTKkA/viewform?c=0&amp;w=1\" rel=\"noopener\"><strong>ICI</strong></a>.</p>\n<h3><strong>La NeoCast</strong></h3>\n<p>La <a href=\"http://www.neocast.fr/\" rel=\"noopener\"><strong>salon des vidéastes</strong></a> fait son retour au Zénith de Strasbourg pour sa 3e édition. Au programme, près de 80 vidéastes seront présents et 70 conférences sont annoncées. <strong><a href=\"http://www.alsacedigitale.org/\" rel=\"noopener\">Alsace Digitale</a></strong> et <a href=\"http://www.play2code.eu/\" rel=\"noopener\"><strong>Play2Code</strong> </a>animeront un stand de démos et de tutoriels vidéo.</p>\n<p>Les visiteurs pourront s’initier de façon ludique aux robots <strong>Thymio</strong> et à l’<strong>Artduino</strong> et apprendre comment réaliser leurs propres<strong> tutoriels vidéo.</strong></p>\n<p><strong>Y aller </strong>: Samedi 22 (9h-19h) et dimanche 23 avril (10h-18h) – Zenith de Strasbourg, 1 allée du Zénith, 67000 Strasbourg</p>\n<p>Billets sur place ou en prévente <a href=\"http://www.neocast.fr/billetterie-neocast/\" rel=\"noopener\"><strong>ICI</strong></a>.</p>\n<h3><strong>Ateliers Code4Kids</strong></h3>\n<p>Les ateliers Code4Kids s’adressent aux 10-14 ans et leur permettent d’apprendre les bases de la programmation et du développement informatique dans une ambiance conviviale. De plus, ils développent ainsi un esprit critique et averti sur leur environnement et sur la culture numérique.</p>\n<ul><li><h4><strong>Centre Socioculturel du Neufeld</strong></h4></li></ul>\n<p>Y aller : Mercredi 19 avril de 14h à 17h – 42 Rue du Neufeld, 67100 Strasbourg</p>\n<p>Gratuit. Inscription auprès du <a href=\"https://www.cscneudorf.org/\" rel=\"noopener\"><strong>CSC du Neufeld.</strong></a></p>\n<ul><li><strong>Médiathèque de Barr</strong></li></ul>\n<p>Y aller :  Jeudi 20 et vendredi 21 avril de 10h à 17h – 34 Avenue des Vosges, 67140 Barr</p>\n<p>Gratuit. Inscription auprès de la <strong><a href=\"http://www.mediatheque-barr.fr/index\" rel=\"noopener\">médiathèque</a></strong> de Barr.</p>\n<p><strong>En savoir plus sur <a href=\"http://www.play2code.eu/\" rel=\"noopener\">Play2Code </a>et <a href=\"http://www.epitech.eu/strasbourg/ecole-informatique-strasbourg.aspx\" rel=\"noopener\">Epitech</a>.</strong></p>"
      legacy_cover: "/images/blog/springcamps.webp"
