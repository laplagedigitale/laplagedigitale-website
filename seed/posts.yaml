  - key: "coding-gouter"
    fields:
      title: "Coding Gouter"
      slug: "coding-gouter"
      excerpt: "Coding Goûter Mercredi 15 octobre – de 13h à 17h Médiathèque Andrè Malraux – Strasbourg Devoxx4kids revient avec une nouvelle proposition, un « Coding Goûter…"
      body: "<p><strong>Coding Goûter</strong></p>\n<p><strong>Mercredi 15 octobre – de 13h à 17h</strong></p>\n<p><strong>Médiathèque Andrè Malraux – Strasbourg</strong></p>\n<p>Devoxx4kids revient avec une nouvelle proposition, un « Coding Goûter » dans le cadre de la manifestation nationale Codeweek ; une initiation à la <strong>programmation</strong>, au <strong>développement de jeux vidéo et à la robotique.</strong></p>\n<p>C’est <strong>gratuit</strong> et <strong>aucune compétence</strong> préalable en programmation n’est nécessaire !</p>\n<p><strong>Aucun matériel</strong> n’est à prévoir, un ordinateur est à disposition pour chacun des participants. Cependant si vous disposez de votre propre ordinateur portable, vous êtes libre de l’utiliser.</p>\n<p>Trois groupes seront organisés en fonction de l’âge :</p>\n<p><b>Pour les 9/12 ans</b> : découverte du code, demonstration de robots et de drônes</p>\n<p><b>Pour les 13/15 ans </b>: initiation  au code à travers Codecombat (initiation au langage Java)</p>\n<p><b>Pour les 15/18 ans</b> : initiation en utilisant Unity3D</p>\n<p><b>Inscription préalable indispensable (en précisant l’âge du participant) nb de places limité :</b></p>\n<p>http://codeandgame.epitech.eu/inscription-strasbourg.html</p>\n<p><b>Contact : Epitech  </b><a href=\"mailto:strasbourg@epitech.eu\"><b>strasbourg@epitech.eu</b></a></p>\n<p><b>Manifestation proposée dans le cadre de Code Week, </b>une semaine pour célébrer et promouvoir l’apprentissage du code en Europe du 11- 17 Octobre 2014.</p>\n<p>Manifestation proposée par les jeunes conseillers de Neelie Kroes (Vice-Présidente de la Commission européenne).</p>\n<p>Des centaines d’activités sont prévues partout en France et en Europe : ateliers, compétitions, conférences, hackthon, meetups… où chacun et chacune peuvent se rencontrer et apprendre ensemble les concepts de base de la programmation, du web development, le dévelopement d’applications mobilela data visualisation, la robotique…</p>\n<p>Toutes les informations sur : www.codeweek.eu</p>"
      legacy_cover: "/images/blog/image-coding-gouter.webp"
      status: "published"
      published_at: "2014-10-08"
      categories: ["actualites", "evenements"]
      legacy_path: "/coding-gouter/"
      created_at: "2014-10-08T21:21:00Z"
  - key: "quichejecode"
    fields:
      title: "quichejecode"
      slug: "quichejecode"
      excerpt: "Apéro : « quichejecode » Jeudi 16 octobre – de 18h à 20h Epitech – 4 rue du Dôme – Strasbourg Si vous aussi toute fière d’avoir créé une page, un blog, un…"
      body: "<p><strong>Apéro : « quichejecode »</strong></p>\n<p><strong>Jeudi 16 octobre – de 18h à 20h</strong></p>\n<p><strong>Epitech – 4 rue du Dôme – Strasbourg</strong></p>\n<p>Si vous aussi toute fière d’avoir créé une page, un blog, un profil… vous vous heurtez désormais à vos limites</p>\n<p>« quichejecode » est fait pour vous… une petite initiation, un question/réponse, voici le moment de décomplexer !</p>\n<p>Des sites informatiques aux réseaux sociaux, les étudiants et les enseignants d’Epitech sont là pour partager avec vous leurs trucs et astuces.</p>\n<p><strong>Il y a près d’un siècle c’est une femme, Ada Lovelace, qui inventait ce qui devinrent les prémisses du code informatique ! Alors courage !</strong></p>\n<p><strong>C’est gratuit !</strong>Pour assurer la convivialité, les participants sont invités à amener une « quiche » ou tout autre spécialité culinaire, à partager.</p>\n<p><strong>Aucune compétence</strong> préalable en programmation n’est nécessaire !</p>\n<p><strong>Aucun matériel</strong> n’est à prévoir, un ordinateur est à disposition de chaque participant. Cependant si vous disposez de votre propre ordinateur portable, vous êtes libre de l’utiliser.</p>\n<p><b>Contact : Epitech  </b><a href=\"mailto:strasbourg@epitech.eu\"><b>strasbourg@epitech.eu</b></a></p>\n<p><b>Manifestation proposée dans le cadre de Code Week, </b>une semaine pour célébrer et promouvoir l’apprentissage du code en Europe du 11- 17 Octobre 2014.</p>\n<p>Manifestation proposée par les jeunes conseillers de Neelie Kroes (Vice-Présidente de la Commission européenne).</p>\n<p>Des centaines d’activités sont prévues partout en France et en Europe : ateliers, compétitions, conférences, hackthon, meetups… où chacun et chacune peuvent se rencontrer et apprendre ensemble les concepts de base de la programmation, du web development, le dévelopement d’applications mobilela data visualisation, la robotique…</p>\n<p>www.codeweek.eu</p>"
      legacy_cover: "/images/blog/image-quichejecode.webp"
      status: "published"
      published_at: "2014-10-08"
      categories: ["actualites", "evenements"]
      legacy_path: "/quichejecode/"
      created_at: "2014-10-08T21:26:41Z"
  - key: "ulule-tour-2015"
    fields:
      title: "Ulule Tour 2015"
      slug: "ulule-tour-2015"
      excerpt: "Venez rencontrer la Team Ulule à Strasbourg le 14 avril ! Pour sa deuxième édition, le Ulule Tour parcourt la France à la rencontre de sa communauté, des…"
      body: "<p><strong><img src=\"/images/blog/map2015.webp\" alt=\"map2015\" loading=\"lazy\"></strong></p>\n<p><strong>Venez rencontrer la Team Ulule à Strasbourg le 14 avril !</strong></p>\n<p>Pour sa deuxième édition, le Ulule Tour parcourt la France à la rencontre de sa communauté, des réseaux d’accompagnateurs de projets et plus largement des acteurs qui font le monde demain. A bord d’un bus itinérant, l’équipe d’Ulule fera étape dans 10 grandes villes françaises : Nantes, Bordeaux, Toulouse, Marseille, Grenoble, Lyon, Clermont-Ferrand, Strasbourg, Lille et Paris.</p>\n<p>Au programme :</p>\n<ul><li><p>à partir de 18h30 : accueil.</p></li><li><p><strong>à 19h : table-ronde.</strong></p></li><li><p><strong>de 20h à minuit : meet-up.</strong></p></li></ul>\n<p>La table-ronde s’intéressera à <em>In’bô ou comment un projet étudiant s’est transformé en une aventure entrepreneuriale</em>, avec la participation de :</p>\n<p>– Aurèle Charlet, co-fondateur d’In’Bô et Connecteur Ulule.</p>\n<p>Modérateur : Mathieu Maire du Poset, directeur général adjoint d’Ulule.</p>\n<p>Mot d’accueil : Alsace Digitale.</p>\n<p>Le meet-up sera l’occasion de rencontrer les membres de l’équipe Ulule, des porteurs de projets, contributeurs, le tout autour d’un cocktail dînatoire.</p>\n<p>Echanger autour du crowdfunding, partager ses expériences, mettre en valeur des porteurs de projets locaux et passer un moment convivial tous ensemble tout en rassemblant la communauté Ulule et les acteurs qui lui permettent d’exister, autour de la création, de l’innovation et des bonnes idées : voilà l’objectif de cette soirée !</p>\n<p><strong><em>Inscription : www.eventbrite.fr/e/billets-ulule-tour-2015-table-ronde-meet-up-a-strasbourg-155995115</em></strong></p>"
      legacy_cover: "/images/blog/map2015.webp"
      status: "published"
      published_at: "2015-04-07"
      categories: ["actualites", "evenements"]
      legacy_path: "/ulule-tour-2015/"
      created_at: "2015-04-07T12:59:30Z"
