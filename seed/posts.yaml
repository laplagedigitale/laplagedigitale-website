  - key: "les-plagistes-a-mulhouse"
    fields:
      title: "Les Plagistes à Mulhouse"
      slug: "les-plagistes-a-mulhouse"
      excerpt: "A partir de septembre les coworkers de la Plage Digitale pourront développer leur activité à Mulhouse ! En tant que Plagistes ils auront accès 4 journées par…"
      body: "<p>A partir de septembre les coworkers de la Plage Digitale pourront développer leur activité à Mulhouse !<br>\nEn tant que Plagistes ils auront accès 4 journées par mois au tout nouveau tout beau Espace 34 du Technopôle de Mulhouse. Ils pourront même y organiser une réunion une demi-journée par semaine.  Inversement l’espace d’une journée les coworkers du 34 deviendront plagistes. C’est ça le soft landing.<br>\nVivement la rentrée !<br>\n<a href=\"http://www.technopole-mulhouse.com/fr/espace-coworking-mulhouse-34/\" rel=\"noopener\">http://www.technopole-mulhouse.com/…/espace-coworking-mulh…/</a></p>"
