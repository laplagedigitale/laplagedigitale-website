  - key: "code-ton-avenir-formation-adulte-relais"
    fields:
      title: "Code ton #Avenir : Formation adulte relais"
      slug: "code-ton-avenir-formation-adulte-relais"
      excerpt: "Dans le cadre du Forum Code ton #avenir, une matinée de formation au code informatique pour adulte est organisée vendredi 31 mars au Shadok à Strasbourg.…"
      body: "<p><img src=\"/images/blog/capture-decran-2017-02-23-a-15-33-22.webp\" alt=\"Capture d’écran 2017-02-23 à 15.33.22\" loading=\"lazy\"></p>\n<p><strong>Dans le cadre du <a href=\"/blog/code-ton-avenir-parce-que-le-futur-se-programme\">Forum Code ton #avenir</a>, une matinée de formation au code informatique pour adulte est organisée vendredi 31 mars au Shadok à Strasbourg.</strong></p>\n<p><strong><a href=\"http://www.alsacedigitale.org/\" rel=\"noopener\">Alsace Digitale</a></strong> propose depuis quelques années des <strong>ateliers d’apprentissage</strong> du code destinés aux <strong>jeunes</strong>. Le but de cette formation est de démultiplier les énergies et les lieux ressources en <strong>formant des adultes relais</strong> qui à leur tour pourraient animer des <strong>ateliers</strong>.</p>\n<p>Les ateliers qui pourront être déployés à posteriori par ces adultes relais, permettent d’amener les enfants à se poser des questions sur le fonctionnement de l’ordinateur et des jeux qu’ils côtoient au quotidien. L’approche créative et collaborative de la programmation informatique leur permet de s’amuser tout en découvrant une nouvelle façon de s’exprimer avec le langage informatique.</p>\n<p>Ces ateliers offrent des clés nouvelles pour comprendre un quotidien hautement numérique et permettent aux plus motivés de se former et d’ouvrir des perspectives professionnelles nouvelles à travers le code.</p>\n<p>En effet, la programmation peut être <strong>ludique et créative</strong>. Il s’agit de <strong>dédramatiser et démystifier la programmation</strong>. Elle représente un levier pour développer des<strong> capacités annexes </strong>:</p>\n<ul><li><strong>la créativité</strong>, par le passage d’une position de consommateur de produits numériques à celle d’acteur et de producteur ;</li><li><strong>le sens logique</strong>, par l’acquisition d’une méthode de raisonnement et la capacité à résoudre un problème dans son ensemble ;</li><li><strong>l’autonomie et la confiance en soi</strong>,par le contrôle acquis sur l’environnement grâce à une nouvelle compréhension de son fonctionnement ;</li><li><strong>la rigueur et l’attention</strong>,deux exigences intrinsèques à l’apprentissage du code et à ses subtilités syntaxiques et orthographiques ;</li><li><strong>l’esprit d’entrepreneuriat</strong>,par toutes les possibilités offertes par la programmation informatique.</li></ul>\n<p>Bien sûr, vous ne serez pas seul dans cette aventure. Alsace Digitale en lien avec des étudiants de l’école Epitech (<strong><a href=\"http://www.play2code.eu/\" rel=\"noopener\">Play2Code</a></strong>) assurera également un suivi de proximité.</p>\n<p>Alors si vous vous sentez prêt à animer l’un de ces ateliers, n’attendez plus et rejoignez-nous !</p>\n<p>Cette formation est gratuite <strong><a href=\"https://www.eventbrite.fr/e/billets-code-ton-avenir-formation-adulte-relais-32532160568\" rel=\"noopener\">sur inscription.</a></strong></p>\n<p>L’événement sur <strong><a href=\"https://www.facebook.com/events/1844819275806831/\" rel=\"noopener\">Facebook</a></strong>.</p>\n<p><strong>Y aller: </strong>Vendredi 31 mars 2017 de 09:00 à 12:00 Shadok –  25 presqu’île André Malraux Strasbourg</p>\n<p>En savoir plus sur le <strong><a href=\"/blog/code-ton-avenir-parce-que-le-futur-se-programme\">Forum Code ton #avenir.</a></strong></p>"
