  - key: "septembre-2023"
    fields:
      title: "Septembre 2023 🍷"
      slug: "septembre-2023"
      excerpt: "Août mûrit, septembre vendange. En ces deux mois tout bien s’arrange"
      body: "<p><strong>Août mûrit, septembre vendange. En ces deux mois tout bien s’arrange</strong></p>\n<p><strong>Découvrez l’agenda du mois de juillet de la Plage Digitale </strong></p>\n<figure><img src=\"/images/blog/format-newsletter-11-1.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Assemblée Générale – 13/09/2023 – à 18h00</strong></p>\n<p><strong>L’Assemblée Générale de la Plage Digitale approche à grands pas !</strong></p>\n<p> Si vous souhaitez y participer, et que vous souhaitez avoir un pouvoir décisionnaire en votant, il faut impérativement devenir membre avant cette date.<br><br> ✅ 3 points seront abordés lors de cette Assemblée : <br><br>1️⃣ Bilan moral (année civile 2022 + début 2023)<br>2️⃣ Bilan financier (année civile 2022)<br>3️⃣ Budget prévisionnel 2023</p>\n<p><a href=\"https://www.helloasso.com/associations/la-plage-digitale/adhesions/adhesions-la-plage-digitale-2023\" rel=\"noopener\"><strong>Devenir membre de la Plage Digitale</strong></a></p>\n<figure><img src=\"/images/blog/format-newsletter-12.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Achen’ight – 15/09/2023 – à 19h00</strong></p>\n<p><strong>La communauté Achencraft vous attend !</strong></p>\n<p> Jusqu’à présent, la communauté se limitait à construire la Grande Île de Strasbourg.</p>\n<p>✅ Mais, depuis peu, elle utilise une nouvelle méthode qui présente plein d’avantages :<br> Ne plus se limiter au centre-ville<br> Avoir une meilleure précision<br> Gagner du temps<br> Pouvoir accueillir plus de personnes volontaires</p>\n<p> Un seul inconvénient : Tout le travail effectué depuis 8 ans ne peut être repris. Il faut repartir de 0.<br><br>Bonne nouvelle : La carte existante reste visitable</p>\n<p><a href=\"https://www.facebook.com/Achencraft\" rel=\"noopener\"><strong>Rejoindre la communauté </strong></a></p>\n<figure><img src=\"/images/blog/format-newsletter-30.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Invi Kids – 19/09/2023 – De 18h00 à 19h00</strong></p>\n<p><strong>Les idées reçues, comment y remédier ?</strong></p>\n<p>Invikids est une bibliothèque de livres numériques qui permet aux enfants, de 4 à 12 ans, de mieux comprendre les maladies invisibles</p>\n<p>Vous pouvez suivre leurs histoires en consultant leur site internet : https://www.invikids.com</p>\n<p>Participez à une conférence animée par Fatimata Toure, autrice de livres pour enfants, suivie d’un temps d’échange</p>\n<p>Cette conférence est gratuite et ouverte à tous (adultes et enfants) !</p>\n<p> Elle vous aidera à :</p>\n<p>Mieux percevoir ce qu’est une idée reçue<br> Comprendre l’impact des idées reçues<br> Comprendre l’importance de mieux écouter l’autre<br> Découvrir le mode d’emploi contre les idées reçues</p>\n<p><a href=\"https://my.weezevent.com/invi-kids?_gl=1*q6tii7*_gcl_au*MTEwMDI1MDI3NC4xNjkxOTk5NTE5*_ga*MTUyMTM2MDMyMy4xNjkxOTk5NTE5*_ga_39H9VBFX7G*MTY5MjcwNjE1Mi4xMC4xLjE2OTI3MDYxNTguNTQuMC4w\" rel=\"noopener\"><strong>Participer à l’atelier</strong></a></p>\n<figure><img src=\"/images/blog/format-newsletter-26.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Les Foliweb – 21/09/2023 – De 18h30 à 20h30</strong></p>\n<p><strong>8 indispensables pour réussir votre présence en ligne</strong></p>\n<p>Cet événement est organisé par Les Foliweb et sera animé par Ricardo Gomes, Directeur de production chez Supraheadstudio‍</p>\n<p>‍ Vous êtes :</p>\n<p> Dirigeant de TPE, entrepreneur ou porteur de projets<br> Niveau débutant à intermédiaire<br> Motivé et vous avez très envie d’apprendre et de partager avec nous, dans une ambiance conviviale et bienveillante</p>\n<p> Contenu de l’atelier :<br>14 % des indépendants, TPE et PME n’ont aucune solution de visibilité en ligne. Et alors que la transformation numérique des entreprises s’est accélérée ces dernières années, 20 % d’entre elles ne disposaient toujours pas de site web en 2022 pour promouvoir leur activité.</p>\n<p>En faites-vous partie ❓</p>\n<p>Création de site web, réseaux sociaux, emailing, création de contenus, publicité, etc. Les solutions accessibles aux petites et moyennes entreprises sont nombreuses pour développer leur visibilité sur internet et leur entreprise.</p>\n<p>Sont-elles toutes pertinentes pour votre activité ? Comment les prioriser ? Quelle stratégie adopter pour répondre à vos objectifs business ? Comment mesurer le résultat de vos actions ?</p>\n<p>Cet atelier en présentiel vous propose de prendre un peu de hauteur sur votre présence en ligne pour ne pas perdre votre temps et votre énergie.</p>\n<p> Nous vous proposons un tour d’horizon des 8 principales opportunités que le web vous apporte pour :<br>• Développer votre visibilité et attirer de nouveaux prospects<br>• Générer des ventes<br>• Fidéliser vos clients<br>• Gagner du temps au quotidien</p>\n<p>⏰ Déroulé de l’atelier :<br>Un temps d’échange et de réseautage entre participants vous sera proposé à l’issue de cet atelier.<br> 45 min de présentation / mise en contexte<br> 45 min de cas pratique, exemples concrets issus de la salle (et pourquoi pas le vôtre) et questions / réponses pour repartir avec les idées claires sur vos prochaines actions</p>\n<p>L’objectif, à travers cet atelier, est que vous puissiez prendre du recul et les bonnes décisions pour développer votre activité professionnelle grâce au web</p>\n<p><a href=\"https://www.eventbrite.fr/e/billets-8-indispensables-pour-reussir-votre-presence-en-ligne-704290370457?aff=Partenairesplage-digitale\" rel=\"noopener\"><strong>Participer gratuitement</strong></a></p>\n<figure><img src=\"/images/blog/format-newsletter-29.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>HackSXB – 29/09/2023 – à 19h00</strong></p>\n<p><strong>Le HackSXB est une communauté créée par Alsace Digitale</strong></p>\n<p>Venez partager votre passion pour la création avec un groupe d’étudiants et professionnels !</p>\n<p>Présentez vos propres projets ou rejoignez des projets collectifs sur des sujets variés, parfois thématiques, lors de cette soirée de programmation et de bricolage</p>\n<p><a href=\"https://www.facebook.com/HackSXB\" rel=\"noopener\"><strong>Retrouver la communauté</strong></a></p>\n<figure><img src=\"/images/blog/format-newsletter-28.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>C’est arrivé le mois dernier … et près de chez vous !</strong></p>\n<p><strong>À la Plage Digitale, il s’en est passé des choses en août :</strong></p>\n<p> La journée internationale du coworking, une rencontre Achen’ight, et une rencontre HackSXB … mais également de bonnes vacances pour la plupart de nos coworkers qui en ont profité pour se reposer !</p>\n<p>Suivez-nous sur nos réseaux sociaux pour ne rien louper !</p>"
      legacy_cover: "/images/blog/format-newsletter-32.webp"
      status: "published"
      published_at: "2023-08-22"
      categories: ["actualites", "newsletter"]
