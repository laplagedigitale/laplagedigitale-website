      slug: "juin-2024"
      excerpt: "Juin est le commencement de l’été, où chaque jour est une promesse de lumière, de chaleur et de moments inoubliables 💭"
      body: "<p><strong>« Juin est le commencement de l’été, où chaque jour est une promesse de lumière, de chaleur et de moments inoubliables. » 💭</strong></p>\n<p><strong>Découvrez l’agenda du mois de juin de la Plage Digitale 🗓</strong></p>\n<figure><img src=\"/images/blog/fresque-du-climat.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>La Fresque du Climat – 05/06/2024 – De 18h00 à 21h00</strong></p>\n<p><strong>La Fresque du Climat, un atelier collaboratif et ludique visant à sensibiliser les participants aux enjeux du changement climatique !</strong></p>\n<p>⚠️ PLACES LIMITÉES 📣</p>\n<p>🔸 Le jeu La Fresque du Climat est un outil neutre et objectif.<br>✚ Il est fondé sur les données issues des rapports scientifiques du GIEC (Groupe d’experts intergouvernemental sur l’évolution du climat) dont les recommandations orientent les décisions politiques et économiques à l’échelle mondiale.<br><br>🔸 Son approche ludique et pédagogique permet à tous les publics de s’approprier le sujet des changements climatiques. <br>✚ Cette approche vise à éviter une descente verticale du savoir. Durant l’atelier, les participant·es relient les liens de cause à effets et intègrent les enjeux climatiques dans leur globalité.<br><br>🔸 Sans culpabiliser et par une compréhension partagée des mécanismes à l’oeuvre, La Fresque engage les individus dans un échange constructif.<br>✚ À l’issue de l’atelier, les participant·es sont motivé·es et outillé·es pour agir à leur échelle.</p>\n<p><a href=\"https://a3awo.r.bh.d.sendibt3.com/mk/cl/f/sh/6rqJfgqBpdQZRU6N1lpf4G30C1N/5SGPBHHtTBJZ\" rel=\"noopener\">Participer</a></p>\n<figure><img src=\"/images/blog/meetup-edouard.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Meetup Software Craft Strasbourg – 06/06/2024 – De 19h30 à 21h30</strong></p>\n<p><strong>Throw exceptions… out of your codebase</strong></p>\n<p><strong>En partenariat avec Strasbourg JS </strong></p>\n<p>Les exceptions sont souvent utilisées pour gérer les erreurs, les validations et d’autres cas d’utilisation spécifiques. Elles sont considérées par beaucoup comme la manière standard d’indiquer une situation inattendue ou un échec. Cependant, cette approche présente plusieurs inconvénients : elle est difficile à anticiper, elle rend le flux de contrôle moins prévisible et peut laisser le système dans un état invalide.</p>\n<p>Dans cette présentation, je souhaite vous présenter une alternative axée sur la transparence et la prévisibilité. Nous explorerons la manière d’intégrer des concepts du paradigme fonctionnel, tels que les « Monads », dans une codebase de code orientée objet en utilisant un projet concret : le SDK .NET de Vonage. Cette présentation sera l’occasion idéale de vous démystifier ce concept et démontrer à quel point ils sont simples à utiliser.</p>\n<p><strong>Présentation de l’animateur :</strong><br>Actuellement Senior .NET Developer Advocate chez Vonage, Guillaume évolue dans l’industrie du logiciel depuis une quinzaine d’années. Impliqué dans le mouvement du Software Craftsmanship, notamment en tant que co-organisateur du meetup Craft Luxembourg, il partage volontiers ses idées et ses expériences lors d’ateliers, de conférences ou de séances de mentoring.</p>\n<p>Il se passionne notamment pour l’intégration continue, la qualité du code, le mob programming ou des code katas. En dehors de la tech, il apprécie passer du temps en famille avec sa femme et sa fille, aller à la salle ou sur des sessions gaming.</p>\n<p><a href=\"https://www.meetup.com/software-crafters-strasbourg/events/300993143/\" rel=\"noopener\">Participer</a></p>\n<figure><img src=\"/images/blog/action-coach.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Atelier des 5 Leviers du Jeu des Affaires – 10/06/2024 – De 18h30 à 21h</strong></p>\n<p><strong>🔥 Événement exclusif 🔥</strong></p>\n<p>Nous sommes impatients de vous accueillir dans une semaine à notre Atelier des 5 Leviers du Jeu des Affaires, en partenariat avec la <strong>@ActionCOACH-Alsace-Strasbourg</strong></p>\n<p>✨ Si vous n’avez pas encore confirmé votre présence, c’est le moment de le faire ! Les places sont limitées, et nous sommes sur le point de vivre une soirée mémorable pleine d’astuces stratégiques et de partage d’expériences.</p>\n<p>🚀 Au programme :<br>• Affinez votre compréhension des 5 Leviers du Jeu des Affaires<br>• Préparez-vous à des échanges interactifs enrichissants<br>• Développez votre entreprise de façon ludique avec d’autres entrepreneurs passionnés !</p>\n<p><a href=\"https://tally.so/r/31KAZL\" rel=\"noopener\">Participer</a></p>\n<figure><img src=\"/images/blog/bataille-de-lia.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>La Bataille de l’IA – 13/06/2024 – De 18h00 à 20h00</strong></p>\n<p><strong>Organisé par l’association </strong><a href=\"https://a3awo.r.bh.d.sendibt3.com/mk/cl/f/sh/6rqJfgqBpdQZRU6N1lpf4G30C1N/-uHa9BNk2kPi\" rel=\"noopener\"><strong>Latitudes</strong></a><strong> qui oeuvre pour un numérique plus vertueux </strong>🤝</p>\n<p>🗣 Animatrice :<a href=\"https://a3awo.r.bh.d.sendibt3.com/mk/cl/f/sh/6rqJfgqBpdQZRU6N1lpf4G30C1N/1RASPVWg8yLg\" rel=\"noopener\"> Laura Slendzak</a>, Consultante et Formatrice en stratégie de communication</p>\n<p>Au programme ⤵️</p>\n<p>▷ Un jeu de cartes pour explorer les enjeux sociaux et environnementaux de l’IA Générative en 2h ! ⏳</p>\n<p>Démystifier l’IA Générative et ses enjeux sociétaux !</p>\n<p>En s’appuyant sur le rapport de Data for Good sur l’IA Générative, la Bataille de l’IA vous permet de découvrir de manière ludique les enjeux sociaux et environnementaux de l’Intelligence Artificielle.</p>\n<p>L’atelier est pensé pour générer la discussion par petits groupes de 5 personnes, une bonne manière de créer du lien entre participants et participantes ✨</p>\n<p><a href=\"https://tally.so/r/3xd5Y9\" rel=\"noopener\">Participer</a></p>\n<figure><img src=\"/images/blog/permanence-bg.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Permanence Professionnelle Gratuite – 13/06/2024 – De 10h00 à 12h00</strong></p>\n<p><strong>Conseil en Création et Développement d’Entreprises </strong></p>\n<p>🗣 Intervenant : <strong>Benjamin Gonzalez</strong>, conseiller en création d’entreprise à la <strong>CCI Alsace Eurométropole</strong> 🤩</p>\n<p>Au programme ⤵️</p>\n<p>Vous êtes en train de démarrer votre entreprise ou vous dirigez une jeune entreprise de moins de trois ans ? Profitez de notre session de conseil individuelle de 30 minutes, gratuite et personnalisée, avec un expert en création et développement d’entreprise de la <strong>Chambre de Commerce et de l’Industrie Alsace Eurométropole.</strong></p>\n<p><strong>Au programme de votre rendez-vous de 30 minutes :</strong></p>\n<p>🔸 <strong>Évaluation de votre projet</strong> : Faisons le point ensemble sur l’état actuel de votre projet d’entreprise.<br>🔸 <strong>Réponses à vos questions</strong> : Posez vos premières questions et clarifiez vos doutes avec l’aide d’un expert.<br>🔸 Si besoin, recevez des conseils sur les prochaines étapes et les possibilités d’accompagnement adaptées à votre projet</p>\n<p><strong>Pour qui ? <br></strong>🔸 Les porteurs de projets en phase de création d’entreprise<br>🔸 Les dirigeants de jeunes entreprises de moins de 3 ans</p>\n<p><a href=\"https://my.weezevent.com/plage-digitale-prise-de-rendez-vous?_gl=1*8p148a*_gcl_au*MTI2ODExMDk5OS4xNzE2NTcwNzM0*_ga*MTE4NDg1OTg1OS4xNzE2NTcwNzM1*_ga_39H9VBFX7G*MTcxNjU3MDczNC4xLjEuMTcxNjU3MTE5Ni40LjAuMA..\" rel=\"noopener\">Prendre rendez-vous</a></p>\n<figure><img src=\"/images/blog/meetup-lydia.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Meetup Réalité Virtuelle – 19/06/2024 – De 18h00 à 19h30</strong></p>\n<p><strong>Quel avenir pour la formation en réalité virtuelle ? </strong></p>\n<p>👉🏼 Venez découvrir et tester les solutions innovantes proposées par l’entreprise franco-allemande <a href=\"https://a3awo.r.bh.d.sendibt3.com/mk/cl/f/sh/6rqJfgqBpdQZRU6N1lpf4G30C1N/MXmxE5x7GiOJ\" rel=\"noopener\">Actimage GmbH</a>, du simple scénario de training au mode multi-player.</p>\n<p>Des casques VR seront à disposition pour les tests.</p>\n<p>👀 Un focus sera fait sur la plate-forme collaborative open XR Cortex² pour le lancement d’un prochain appel à candidatures européen.</p>\n<p>✅🎉 L’appel à candidatures européen propose 100 K€ par co-développement !</p>\n<p>Cet atelier sera suivie d’un apéroooooo’ 🤩🍸</p>\n<p><a href=\"https://tally.so/r/31r2zg\" rel=\"noopener\">S’inscrire</a></p>\n<figure><img src=\"/images/blog/gamerzvoice.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Tournoi Jeux Vidéos – 27/06/2024 – À partir de 19h00</strong></p>\n<p><strong>Organisé par l’association GamerZ Voice </strong>🎮</p>\n<p>L’association GamerZ Voice vous invite à la Plage Digitale le jeudi 27 juin pour une soirée Mario Kart.</p>\n<p>Venez jouer sur nos consoles par groupe de 4 pour savoir qui sera la meilleure personne à mériter son permis Mario ! 🏆</p>\n<p><a href=\"https://forms.gle/hgFnRX9GCu4FS3Ra8\" rel=\"noopener\">Participer</a></p>\n<figure><img src=\"/images/blog/format-newsletter-62.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Les rendez-vous mensuels !</strong></p>\n<p><strong>Achen’ight – 14/06/2024 – 19h00-23h00 </strong>👾</p>\n<p>Achen’ight, c’est une soirée par mois où se rassemble l’équipe d’Achencraft pour discuter, rencontrer, rigoler, concevoir, …. bref tout ce qui permet au projet Achencraft de progresser ! 🤩</p>\n<p><strong>Strasbourg Flutter Meetup Group – 11/06/2024 et 25/06/2024 – 18h30-20h30 </strong>🚀</p>\n<p>Les participants échangent en anglais 🇬🇧 ou allemand 🇩🇪 !</p>\n<p>▹ Aborder des sujets liés à Flutter<br>▹ Présentation des résultats des deux dernières semaines, ainsi que prévision pour la prochaine itération<br>▹ Échange sur les actualités Flutter (par exemple, notes de version ou nouveaux produits autour de Flutter)</p>\n<p>▶️ Canal Discord (<a href=\"https://discord.gg/AMfvWZEM\" rel=\"noopener\">https://discord.gg/AMfvWZEM</a>). Si vous ne pouvez pas participer sur place, n’hésitez pas à visiter la réunion virtuellement.</p>\n<p><strong>Hack SXB – 28/06/2024 – 18h00-23h00 </strong>🛠</p>\n<p>Venez partager votre passion pour la création avec un groupe d’étudiants et professionnels ! 💡</p>\n<p>Présentez vos propres projets ou rejoignez des projets collectifs sur des sujets variés, parfois thématiques, lors de cette soirée de programmation et de bricolage 🛠</p>\n<p><a href=\"https://www.facebook.com/Achencraft\" rel=\"noopener\">Achen’ight</a></p>\n<p><a href=\"https://www.flutter-sxb.dev\" rel=\"noopener\">SFMG</a></p>\n<p><a href=\"https://www.facebook.com/HackSXB\" rel=\"noopener\">HackSXB</a></p>\n<figure><img src=\"/images/blog/mai-2024.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>C’est arrivé le mois dernier … et près de chez vous !</strong></p>\n<p><strong>À la Plage Digitale, il s’en est passé des choses en mai :</strong></p>\n<p>👉🏼 Une rencontre Deep Learning, un atelier rempotage des plantes de la Plage Digitale avec les coworkers, un meetup Entrepreneurs Naissants en partenariat avec Réseau Entreprendre Alsace etc. 🤩</p>\n<p>Suivez-nous sur nos réseaux sociaux pour ne rien louper !</p>\n<p><a href=\"https://www.helloasso.com/associations/la-plage-digitale/adhesions/adhesion-la-plage-digitale-2024\" rel=\"noopener\">Je deviens membre de la Plage Digitale</a></p>"
