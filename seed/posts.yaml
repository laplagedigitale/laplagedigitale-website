  - key: "pitch-night-testez-vous-devant-des-investisseurs"
    fields:
      title: "Pitch Night : Testez-vous devant des investisseurs"
      slug: "pitch-night-testez-vous-devant-des-investisseurs"
      excerpt: "Vous êtes entrepreneur ou hésitez à lancer votre startup ? Dans les deux cas vous devez savoir convaincre ! Profitez alors de la Pitch Night, une soirée où…"
      body: "<p><strong>Vous êtes entrepreneur ou hésitez à lancer votre startup ? Dans les deux cas vous devez savoir convaincre ! Profitez alors de la Pitch Night, une soirée où vous pourrez améliorer et expérimenter votre pitch investisseurs. Elle se déroulera le jeudi 27 avril au Shadok à Strasbourg.</strong></p>\n<p>Lever des fonds pour une startup est une étape cruciale et difficile. La Pitch Night est une soirée où vous pourrez mettre votre écosystème au travail pour parfaire ce périlleux exercice.</p>\n<p>Vous pourrez :</p>\n<p>– Tester votre pitch en conditions réelles devant un jury d’investisseurs bienveillants</p>\n<p>– Bénéficier d’un accompagnement au pitch investisseur en amont</p>\n<p>– Recevoir des retours de l’ensemble de l’écosystème</p>\n<p>… Tout ce qu’il faut pour maximiser vos chances !</p>\n<p>Cette soirée est conjointement organisée par <strong><a href=\"http://www.alsacedigitale.org/\" rel=\"noopener\">Alsace Digitale</a></strong>, <strong><a href=\"http://www.alsacebusinessangels.com/\" rel=\"noopener\">Alsace Business Angels</a></strong>, <strong><a href=\"http://www.semia-incal.com/\" rel=\"noopener\">SEMIA</a></strong>, <strong><a href=\"http://www.rhenatic.eu/\" rel=\"noopener\">Rhenatic</a></strong>, <strong><a href=\"http://www.lafrenchtech-alsace.eu/\" rel=\"noopener\">French Tech Alsace</a></strong>, <strong><a href=\"https://www.caisse-epargne.fr/alsace/particuliers/espace-regional\" rel=\"noopener\">Caisse d’Epargne</a></strong> et <strong><a href=\"http://capitalgrandest.eu/\" rel=\"noopener\">Capital Grand Est</a>.</strong></p>\n<p>Que vous souhaitez vous tester ou simplement être spectateur, vous êtes les bienvenus !</p>\n<p><strong>Y aller :</strong> Jeudi 27 avril de 18h30 à 22h au Shadok – 25 presqu’île André Malraux 67100 STRASBOURG.</p>\n<p><strong>Pour vous inscrire c’est par <a href=\"https://www.eventbrite.fr/e/billets-pitch-night-32621474709\" rel=\"noopener\">ICI </a>!</strong></p>\n<p><strong>Contacts : sderivaux@gmail.com</strong></p>"
