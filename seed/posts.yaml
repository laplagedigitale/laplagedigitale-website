  - key: "coworker-de-la-semaine-jerome-schneider-le-tiers-de-confiance"
    fields:
      title: "[COWORKER DE LA SEMAINE] Jérôme Schneider, le tiers de confiance"
      slug: "coworker-de-la-semaine-jerome-schneider-le-tiers-de-confiance"
      excerpt: "Jérôme a récemment créé Net Gusto, sa société de conseil et développement web. Faisant preuve de multiples compétences, il gère des projets en prenant compte…"
      body: "<p><b>Jérôme a récemment créé Net Gusto, sa société de conseil et développement web. Faisant preuve de multiples compétences, il gère des projets en prenant compte des besoins du client mais aussi des développeurs auquel il fait appel. Comment se passent les premiers pas cette nouvelle société ? Réponse :</b></p>\n<p><strong>1) Tu viens de créer Net Gusto. Peux-tu nous en dire plus ? </strong></p>\n<p>Net Gusto est une société de conseil et développement Web. Notre activité de développement est centrée sur PHP, et toutes les technologies frontend du Web (Javascript/CSS/HTML/…). Nous intégrons des CMS/Frameworks open-source pour la réalisation des besoins Web de nos clients, comme par exemple TYPO3, sur lequel notre expertise est très poussée, ou encore Symfony 2.</p>\n<p><img src=\"/images/blog/jerome-photo-blog.webp\" alt=\"jerome photo blog\" loading=\"lazy\">En complément de cette activité de développement, nous avons une activité de conseil informatique. J’ai fait des études de programmation, puis un master de gestion de projet. J’ai donc une double formation à la fois technique et de gestion. Dans le cadre d’un projet, je peux aussi bien m’adresser aux équipes de développement qu’au client. Je suis donc dans ces deux mondes à la fois, ce qui me permet de superviser tout le déroulement d’un projet, pour éviter les incompréhensions et déconvenues.</p>\n<p>Pour imager, c’est un peu comme dans un garage. Quand on y va pour faire réparer sa voiture sans y rien connaître en mécanique, on s’en remet entièrement au garagiste, qui peut être tenté de vous vendre des choses dont vous n’avez pas réellement besoin. En y allant avec une personne de confiance, et qui s’y connait, on a beaucoup plus de chance d’obtenir satisfaction au juste prix. De par ma double compétence, je suis ce tiers de confiance, ma loyauté allant à mon client, et non pas au prestataire.</p>\n<p><strong>2) Ça sonne un peu comme un travail de titan !</strong></p>\n<p>À vrai dire, ayant une vision transversale des projets qu’on me confie, je suis capable d’identifier rapidement les points problématiques ou qui vont le devenir, et de fluidifier ainsi toute la réalisation du projet. Cela fait gagner du temps à tout le monde.</p>\n<p>Je n’interviens pas cependant systématiquement des deux côtés développement ou gestion pour un même projet. Selon le besoin de mes clients, je sais trouver la place qui maximisera mon efficacité dans le projet, que ce soit uniquement au conseil, à l’analyse, à la rédaction des spécifications, au développement ou à la recette du projet.</p>\n<p><strong>3) Comment se déroule ton expérience d’entrepreneur ? </strong></p>\n<p>Mon horizon n’est pas bouché, comme ça peut être le cas en tant que salarié. Les perspectives sont celles que je m’accorde, je suis libre de mes décisions. Cependant, même si je fixe mon propre cap, il me faut toujours trouver des clients. Pour faire face au flot de prestataires et sortir du lot, il faut mettre l’accent sur la qualité, et se faire connaître. Le tout est de gagner en visibilité.</p>\n<p><img src=\"/images/blog/logo-netgusto.webp\" alt=\"logo-netgusto\" loading=\"lazy\"></p>\n<p><strong>4) Travailles-tu sur des projets annexes ?</strong></p>\n<p>Je réalise un projet open-source de gestion centralisée de calendriers et de contacts, <a href=\"http://baikal-server.com\" rel=\"noopener\">Baïkal</a>. C’est un serveur de calendrier/contact, un peu comme Google Calendar. Mais sa particularité est que les données sont hébergées votre propre machine, et pas confiées à Google. Ainsi, contrairement au service de Google, personne ne récolte vos informations.</p>\n<p>En ce moment, l’information personnelle est de plus en plus convoitée et exploitée par de grosses entreprises commerciales qui servent leurs intérêts, pas les vôtres. Je me propose de la préserver.</p>\n<blockquote><p> De par ma double compétence, je suis ce tiers de confiance</p></blockquote>\n<p><strong>5) Quand es-tu arrivé à la Plage ? Y a-t-il des opportunités de travail ?</strong></p>\n<p>Je suis arrivé en août 2012. Je cherchais un espace de coworking pour disposer d’un environnement de travail. C’est en participant à l’EdgeFest 2012 que j’ai rencontré Yann Klis, vice-président d’Alsace Digitale. Et me voici.</p>\n<p>Je mesure la chance qui est la mienne d’avoir pu trouver un espace de travail attrayant, lumineux, dynamique et convivial, merci Alsace Digitale.</p>\n<p>À la Plage, les opportunités de projet sont nombreuses. Il y a un flux permanent de personnes, contacts qui se transforment ensuite en clients. Je dirais qu’à la Plage, la marée est souvent haute, et apporte son lot de richesses pour qui sait se retrousser les manches et reconnaître les opportunités quand elles se présentent.</p>\n<blockquote><p>Jérôme schneider, fondateur de Net Gusto<br>\n<a href=\"http://netgusto.com/\" rel=\"noopener\">Netgusto.com</a>  <a href=\"https://twitter.com/netgusto\" rel=\"noopener\"><img src=\"/images/blog/test2.webp\" alt=\"test2\" loading=\"lazy\"></a>     <a href=\"https://plus.google.com/u/0/b/112928904090839853310/115552817498224951219/posts\" rel=\"noopener\"><img src=\"/images/blog/06003950-photo-logo-google-plus.webp\" alt=\"06003950-photo-logo-google-plus\" loading=\"lazy\"></a></p></blockquote>"
      legacy_cover: "/images/blog/jerome.webp"
      status: "published"
      published_at: "2013-09-23"
      categories: ["actualites"]
      legacy_path: "/coworker-de-la-semaine-jerome-schneider-le-tiers-de-confiance/"
      created_at: "2013-09-23T09:20:55Z"
  - key: "la-rentree-programmee-delsass-jug"
    fields:
      title: "La rentrée programmée d’Elsass JUG"
      slug: "la-rentree-programmee-delsass-jug"
      excerpt: "La semaine dernière, Elsass JUG commençait sa rentrée avec une conférence et un atelier agrémentés de deux petites nouveautés qui en a ravis plus d’un ! Si…"
      body: "<p><strong>La semaine dernière, <a href=\"http://www.elsassjug.org/xwiki/bin/view/Main/WebHome\" rel=\"noopener\">Elsass JUG</a> commençait sa rentrée avec une conférence et un atelier agrémentés de deux petites nouveautés qui en a ravis plus d’un ! Si vous voulez passer directement aux photos, <a href=\"https://www.facebook.com/media/set/?set=a.367131256751745.1073741827.102650599866480&amp;type=1\" rel=\"noopener\">rendez-vous sur <strong>notre page Facebook.</strong></a></strong></p>\n<h3>Une première…</h3>\n<p>Mercredi soir, <strong>David Pilato</strong> vantait les mérites <strong>d’Elasticsearch</strong>. Sur les spectateurs, tous n’étaient pas dans la salle ! Eh oui, cette rentrée fut l’opportunité de tester le <strong>livestreaming de la Plage</strong> pour en faire profiter les absents. Si le système n’est pas encore parfait, nous y remédions en améliorant constamment le service. Pour l’intervention de David, près de 50 personnes étaient au rendez-vous dont 19 téléspectateurs. Certains sont conquis :</p>\n<blockquote><p>Excellente initiative, c’est génial de se retrouver à la plage à distance. – F4EGY</p></blockquote>\n<p>Sur le fond, la présentation d’Elasticsearch fut très complète. Ce moteur de recherche indexe des documents d’une rapidité déconcertante. « 30 secondes suffisent pour démarrer un projet » affirme David Pilato. « Quand j’ai découvert Elasticsearch, je n’ai pas dormi pendant une semaine car je me demandais comment une seule personne avait pu créer tout ça » se remémore-t-il. Le moteur fonctionne sur le principe de rivière. Plus précisément, il n’est pas fait pour aller chercher des informations mais pour les récupérer. Décrire le champ de possibilités d’Elasticsearch serait trop long. À lui seul, le motto résume bien la chose : <em>« your data, your usecase »</em>.</p>\n<p>Nous vous invitons à visionner le livestreaming et/ou à découvrir les slides de présentations généreusement partagées par David. Sachez que le « technical advocate » envisage de faire appel à sa <a href=\"https://twitter.com/ElasticsearchFR\" rel=\"noopener\">communauté française Elasticsearch </a> pour produire et traduire du contenu français sur Elasticsearch. Les adeptes pourront l’aider dans cette tâche 😉</p>\n<p><em>Visionnez la rediffusion de la soirée (début vers 00:37:00)</em></p>\n<p><a href=\"https://www.slideshare.net/slideshow/embed_code/26488368\">Voir la présentation sur SlideShare</a></p>\n<h3>Elsass JUG se met à l’Agile.</h3>\n<p>Afin de préparer l’<a href=\"http://at2013.agiletour.org/fr/strasbourg_programme.html\" rel=\"noopener\">Agile Tour Strasbourg</a> qui démarre <strong>le 17 octobre à l’ECAM Strasbourg</strong> , Elsass JUG a créé un groupe Elsass Agile. En ce jeudi 19 septembre, la première réunion portait sur le <strong>leadership</strong>. Transposant le conte de Pinocchio à la réalité (cassant le charme Disney que nous avons tous pour référence), les 6 participants ont pu échanger leurs idées et leurs expériences pour « devenir un bon manager ». Pierre Parrend, qui animait cette session, explique cette comparaison :</p>\n<blockquote><p>pour devenir un enfant, le pantin pinocchio devait être honnête, courageux et généreux. Pour passer du manager au vrai leader, c’est pareil. à force d’aventures, il prend ses responsabilités.</p></blockquote>\n<p>C’est ainsi que la soirée s’est transformée en <strong>peercoaching</strong> où chacun y va de ses conseils et de ses commentaires pour améliorer le comportement de son voisin. Les différentes méthodes de management sont amenées sur la table. Parmi elles, il y avait le<a href=\"http://bbh-labs.com/how-the-cia-define-problems-plan-solutions-the-phoenix-checklist/\" rel=\"noopener\"> Protocole Phoenix</a> utilisé par la CIA, <a href=\"http://www.marshallgoldsmithlibrary.com/cim/articles_display.php?aid=363\" rel=\"noopener\">la stop-doing list </a>de Goldsmith ou encore les séances de Hansei (se blâmer en public). Quand vient l’heure de se quitter, tout le monde conviendra d’une chose : « Pour manager les autres, il faut s’assumer et se manager soi-même ».</p>\n<p><a href=\"https://www.slideshare.net/slideshow/embed_code/26376689\">Voir la présentation sur SlideShare</a></p>\n<p><em>Apprenez à devenir un bon manager grâce à Pinocchio.</em></p>"
      legacy_cover: "/images/blog/vignette-elastic.webp"
