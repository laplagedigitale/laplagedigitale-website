  - key: "faites-exploser-votre-creativite-avec-fireworks"
    fields:
      title: "Faites exploser votre créativité avec Fireworks"
      slug: "faites-exploser-votre-creativite-avec-fireworks"
      excerpt: "Antony le précise d’entrée de jeu : « Fireworks, c’est un logiciel de webdesign. Son but n’est pas de remplacer photoshop qui, lui, est fait pour l’édition…"
      body: "<p><b>Antony le précise d’entrée de jeu : «<em> Fireworks, c’est un logiciel de webdesign. Son but n’est pas de remplacer photoshop qui, lui, est fait pour l’édition d’image. </em>» A ces mots, l’intervenant commence sa présentation de Fireworks… Dans Fireworks !</b></p>\n<p>Jeudi 23 mai, la Plage Digitale accueillait l’atelier « Découverte de Fireworks », initiative de <strong>WDSTR</strong>. Une bonne trentaine de graphistes en tout genre ont été piqués de curiosité. Antony, créatif parisien autodidacte, était venu leur faire une démonstration du logiciel d’Adobe. Utilisé surtout par les graphistes et intégrateurs, <strong>Fireworks</strong> a déjà une bonne base d’adhérents –dont Antony, qui a quasi-délaissé Photoshop –.<img src=\"/images/blog/04.webp\" alt=\"atelier &quot;découverte de fireworks&quot; par wdstr à la Plage Digitale, Strasbourg\" loading=\"lazy\"></p>\n<p>Pour Antony, « <em>Fireworks est plus cohérent et adapté pour la création de sites et d’applications </em>». Une plus-value qui se concrétise par plusieurs fonctions disponibles. Le premier constat est que les templates disponibles sont variés. Il est aussi possible de faire du wireframing pour un projet sur Ipad, par exemple. <strong>Fireworks</strong> emprunte beaucoup à <strong>Photoshop</strong> ou <strong>Illustrator</strong>, notamment pour la gestion des éléments ou des styles. Les symboles, eux, sont tirés du flash. Ces derniers constituent un vrai atout puisque la bibliothèque est commune. Ainsi, vous pourrez partager vos symboles entre différents projets. Une vraie alternative au plug-in payant <b>Photoshop pixeldropr</b> !</p>\n<p><strong>Fireworks</strong> est plein de ressources. <b>Son utilisation permet un gain de temps considérable</b>. C’est le cas pour les alignements. Vous pouvez avoir la même distance entre plusieurs éléments, au pixel près. Mais la démonstration qui a fait le plus d’effet sur l’assistance reste la découpe. Oubliez toutes les manipulations que vous faisiez, la découpe de plusieurs éléments sur une même page se fait en 2 clics. N’oublions pas les styles. Comme pour les pages, chaque modification est impactée sur toute la création. Et le petit plus qui en ravira plus d’un : avec <strong>Fireworks</strong>, vous pouvez importer un PDF avec tous les styles en prime.</p>\n<p>L’atelier arrive à sa fin et les questions s’enchaînent. C’est alors que le nom de <b>Sketch</b> vient à l’esprit de certaines personnes. Antony n’hésite pas à faire un comparatif : « <em>Sketch manque énormément de fonctionnalités comparé à Fireworks. Je n’en suis pas fan, quand on ouvre sketch, on a l’impression d’ouvrir word. Si les développeurs font ce qu’ils ont dit, alors là seulement Sketch pourra remplacer Fireworks. On verra son évolution </em>».</p>\n<p><img src=\"/images/blog/07.webp\" alt=\"©laplagedigitale\" loading=\"lazy\"><br>\n<em>Petit défi lancé par le public :<br>\nretranscrire une page Instagram en quelques minutes avec fireworks</em></p>\n<p>Devant tous ces aspects positifs, pourquoi Fireworks ne rencontre pas le succès qu’il mérite ? Sûrement par habitude de <strong>Photoshop</strong>. Et un peu à cause d’HAPODI. Les développeurs ont affirmé vouloir faire des patchs aussi longtemps que possible mais pas de features. Son développement est ainsi abandonné et, depuis, une pétition circule afin de rendre ce logiciel en open-source. En attendant, pour ceux qui veulent changer de <strong>Photoshop</strong>, adoptez <strong>Fireworks </strong>!</p>\n<blockquote><p><i><i>Antony – @graffr_</i><br>\nCréatif parisien, autodidacte avec 7 ans d’expérience entre agences, startups et freelance. Il est fan de typographie et organisateur de l’événement TypoCamp, illustrateur et photographe amateur.</i></p></blockquote>\n<p><img src=\"/images/blog/05.webp\" alt=\"atelier &quot;découverte de fireworks&quot; par wdstr à la Plage Digitale, Strasbourg\" loading=\"lazy\"></p>"
      legacy_cover: "/images/blog/couverture.webp"
      status: "published"
      published_at: "2013-05-28"
      categories: ["actualites"]
      legacy_path: "/faites-exploser-votre-creativite-avec-fireworks/"
