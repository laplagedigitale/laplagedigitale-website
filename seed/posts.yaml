  - key: "la-programmation-agile-savoir-sorganiser-pour-programmer"
    fields:
      title: "La programmation agile, savoir s’organiser pour programmer"
      slug: "la-programmation-agile-savoir-sorganiser-pour-programmer"
      excerpt: "Le mardi 2 Juillet, la Plage Digitale a accueilli Elsass JUG pour une soirée particulière. En effet, aucune conférence n’était à l’ordre du jour comme ça a pu…"
      body: "<p>Le mardi 2 Juillet, la Plage Digitale a accueilli Elsass JUG pour une soirée particulière. En effet, aucune conférence n’était à l’ordre du jour comme ça a pu être le cas avec les soirées <a href=\"http://bit.ly/10YcVUG\" rel=\"noopener\">Couchbase </a>ou <a href=\"http://bit.ly/ZmtmJR\" rel=\"noopener\">Google Cloud</a>. Les organisateurs ont préféré axer le tout sur la pratique pour faire découvrir la programmation agile.</p>\n<p>C’est sous les conseils de Jean-Laurent Morlhon qu’une dizaine de participants ont relevé le défi imposé. Se mettant dans la peau d’un développeur lambda, ils étaient recrutés par une entreprise de machines à café. En binôme, les groupes ont choisi leur langage de programmation (scala, java, python et coffee) pour commencer l’exercice. Seulement, cela aurait été trop simple ! Jean-Laurent a semé quelques difficultés en ajoutant une spécificité toutes les 20 minutes. Les équipes devaient ainsi tester régulièrement leurs projets. « Le tout est d’apprendre à faire du testing au lieu d’avancer à l’aveuglette » explique l’intervenant.</p>\n<p><img src=\"/images/blog/bolz6fycaaaqmm4-jpg-large.webp\" alt=\"Soirée Coffee Machine - atelier de programmation à la Plage Digitale, Strasbourg\" loading=\"lazy\"><img src=\"/images/blog/bomd3xfceaaf4g7-jpg-large.webp\" alt=\"Soirée Coffee Machine - atelier de programmation à la Plage Digitale, Strasbourg\" loading=\"lazy\"></p>\n<p>Mais quelles sont ces spécificités ? Plus précisément, chacun démarra avec une consigne : « Vous devez coder pour que la machine fonctionne, c’est-à-dire que si une personne appuie sur un bouton, le café doit sortir ! ». Puis viennent d’autres facteurs : « Maintenant, vous devez ajouter deux autres choix, le thé et le chocolat chaud. Ainsi que la possibilité d’ajouter ou non une touillette. » […]  « Très bien mais je veux que vous limitiez le nombre de sucres à 3 et que vous preniez en compte l’argent ». L’air de rien, c’est tout un travail pour que la bonne boisson soit versée dans le gobelet…</p>\n<p>En quelques heures, on voit les personnes qui ont foncé tête baissée et les autres qui y sont allés habilement…  Rien ne sert de courir, surtout quand il faut coder à partir de rien !</p>\n<p><a href=\"https://vine.co/v/haYrv0KgEWt\">Voir la vidéo sur Vine</a></p>"
      legacy_cover: "/images/blog/untitled-1-201307.webp"
      status: "published"
      published_at: "2013-07-22"
      categories: ["actualites"]
      legacy_path: "/la-programmation-agile-savoir-sorganiser-pour-programmer/"
      created_at: "2013-07-22T13:01:44Z"
  - key: "jobs-venez-visionner-et-debattre-du-film-avec-nous"
    fields:
      title: "« Jobs » : venez visionner et débattre du film avec nous"
      slug: "jobs-venez-visionner-et-debattre-du-film-avec-nous"
      excerpt: "À l’occasion de la sortie du biopic Jobs, Alsace Digitale et Rue89 Strasbourg organisent une soirée débat à l’UGC Ciné Cité de Strasbourg. Pourquoi se…"
      body: "<p>À l’occasion de la sortie du biopic <strong>Jobs</strong>,  Alsace Digitale et Rue89 Strasbourg organisent une soirée débat à l’UGC Ciné Cité de Strasbourg. Pourquoi se cantonner à seulement regarder le film ? Le 21 août prochain, à 19h45, venez échanger avec nous !</p>\n<p><strong>Jobs</strong> retrace l’ascension de Steve Jobs et le success-story d’Apple. Une histoire qui commence au fond d’un garage pour devenir l’une des plus grosses entreprises au monde (n’en déplaise qu’aux anti-Apple). Considéré comme un génie et ayant su créer une large communauté de fans, Steve Jobs revit au travers du jeu d’acteur d’Ashton Kutcher. Découvrez la vie d’une icône visionnaire.</p>\n<p>Il y en a des choses à dire sur Apple. Cette soirée est idéale pour relancer les débats enflammés passionnés sur les sujets tels que <em>« Qu’est-ce qui a changé en terme d’innovation depuis la création d’Apple dans les années 70 ? Où se trouvent les garages de notre époque ? Peut-on encore innover à 2 au fond d’un garage ? » </em>. La séance de projection est ouverte à tous (comme toute séance de cinéma), les spectateurs pourront ensuite rester dans la salle pour participer au débat. Ce dernier sera animé par Pierre France, journaliste chez notre partenaire Rue89 Strasbourg.</p>\n<p>Tout ceci est bien beau mais nous vous avons réservé des surprises ! Cet évènement accueillera les intervenants professionnels que voici :</p>\n<ul><li>Yannick Lafue, spécialiste de l’innovation et de son écosystème;</li><li>Me Sandrine Hilaire, avocate spécialisée en propriété intellectuelle, pour parler de la guerre des brevets;</li><li>Philippe Astier, président de l’Apple user group de Strasbourg et consultant Apple.</li></ul>\n<p><strong>Rue89 Strasbourg vous propose de gagner votre place pour la soirée. Pour participer, <a href=\"http://www.rue89strasbourg.com/index.php/2013/08/12/blogs/gagnez-des-places-pour-la-soiree-projection-debat-pour-la-sortie-du-film-jobs/\" rel=\"noopener\">rendez-vous sur ce lien</a>.</strong></p>\n<p><strong>Le débat est ouvert à tous et reste gratuit. Il n’y a pas besoin de s’inscrire pour participer à la projection et au débat ! </strong><a href=\"https://www.facebook.com/events/180036435511301/\" rel=\"noopener\">Toutes les informations sont sur notre page évènement Facebook !</a></p>\n<p><iframe src=\"https://www.youtube-nocookie.com/embed/FrvkCS0ZGPU\"></iframe></p>"
      legacy_cover: "/images/blog/couv-jobs.webp"
      status: "published"
      published_at: "2013-08-02"
      categories: ["evenements"]
      legacy_path: "/jobs-venez-visionner-et-debattre-du-film-avec-nous/"
      created_at: "2013-08-02T15:11:02Z"
  - key: "coworker-de-la-semaine-greg-massa-lentrepreneur-qui-aime-le-concret"
    fields:
      title: "[COWORKER DE LA SEMAINE] Greg Massa, l’entrepreneur qui aime le concret"
      slug: "coworker-de-la-semaine-greg-massa-lentrepreneur-qui-aime-le-concret"
      excerpt: "Greg Massa nous fait l’honneur d’inaugurer cette nouvelle rubrique en se confiant à nous. Cet entrepreneur est actuellement en train de finaliser sa startup…"
      body: "<p><b>Greg Massa nous fait l’honneur d’inaugurer cette nouvelle rubrique en se confiant à nous. Cet entrepreneur est actuellement en train de finaliser sa startup, MonProchainJob. Fraîchement arrivé à la Plage, il a vite su trouver sa place parmi les autres Plagistes. Une intégration facilitée par la bonhomie du personnage. Voyez par vous-même :</b></p>\n<p><b>1) </b><b>Bonjour Greg, merci de prendre le temps de te dévoiler à nos lecteurs. Sans plus attendre, la première question : Qui es-tu ?</b></p>\n<p>Je me définis comme un entrepreneur pragmatique et enthousiaste. Pragmatique parce qu’à l’époque de la bulle internet, je travaillais sur les marchés boursiers, j’étais aux premières loges lorsque la bulle internet a éclaté. Des concepts intéressants ont été créés à l’époque, mais en laissant de côté l’idée qu’il fallait des clients pour assurer la pérennité… Le retour à un certain formalisme dans le business a été dur, mais l’envie de concevoir et lancer des business de manière différente était posée (typiquement l’esprit des start-ups). Par conséquent, j’ai fait le choix d’innover mais dans le cadre d’une adéquation la plus forte possible avec mes clients de demain. Le côté enthousiaste se matérialise surtout par l’investissement personnel – financier et humain – que je mets dans mon job. Tu sais, c’est assez révélateur de l’époque : avec une belle idée, un peu de temps et de sueur, d’accompagnement et d’esprit critique, et avec le support des nombreux outils dont on dispose en ligne développés par un certain nombre de gens talentueux à travers le monde (gestion de projets, CRM…), tu peux te lancer peut être plus facilement qu’avant.</p>\n<p>À condition d’aimer entreprendre avec ferveur. Car l’esprit d’entreprendre, tu l’as ou ou tu l’as pas !<img src=\"/images/blog/logo-monprochainjob.webp\" alt=\"logo-monprochainjob\" loading=\"lazy\"></p>\n<p><b>2) </b><b>Mais alors, sur quoi travailles-tu en ce moment ?</b> <b>Dis-nous en un peu plus sur ta startup.</b></p>\n<p>En quelques mots, et sans trop en dévoiler avant la campagne de communication de Mon Prochain Job prévue à la rentrée, il s’agit d’une solution d’aide au retour à l’emploi que j’ai commencé à développer en solo fin 2012 et qui sera lancée le 30 septembre.</p>\n<p>Tout est parti de mon expérience personnelle de cadre en recherche de job. Je me suis alors demandé : « Comment reprendre les rennes pour être plus efficace dans mes recherches, et avancer le mieux possible dans mes journées de prospection d’emploi (identifier tout ce qui n’était pas couvert en terme de compétences par les acteurs habituels – Pôle Emploi, APEC, job boards ).</p>\n<p>J’ai rapidement compris que quand tu sors du système professionnel, tu n’as plus vraiment accès aux infos et au réseau. Or c’est de l’information sur les entreprises que provient la valeur ajoutée qui permettra de construire candidature pertinente : une offre d’emploi, ou une candidature spontanée, c’est plus qu’un énoncé de compétences recherchées : c’est un contexte – caché pour qui ne dispose pas des bonnes informations au bon moment – qui caractérise les besoins en face desquels le candidat va positionner son offre de services.</p>\n<p>Avec MonProchainJob, la personne en recherche de job disposera d’un maximum d’informations sur un panel d’entreprises sélectionnées afin d’être paré à postuler. Tout ça en se créant son réseau et du lien social. C’est ça la valeur ajoutée de mon projet. En plus de s’adresser à une population un peu délaissée, parfois vilipendée, et souvent en désarroi. La notion de communauté n’est pas non plus à prendre à la légère, je pense même qu’elle peut amener à donner du relief à une recherche. C’est un levier que je vais chercher à développer.</p>\n<p>Tu ne peux pas obliger les gens à retrouver un job. Mais tu peux leur fournir tout l’outillage qui permettra de le faire dans les meilleures conditions. C’est un de mes souhaits au travers du projet.</p>\n<h2>« L’esprit d’entreprendre tu l’as ou pas !»</h2>\n<p><b>3) </b><b>Pourquoi avoir choisi le coworking ? En quoi cette méthode de travail est propice au développement de ton entreprise ?</b></p>\n<p>Le coworking fut un élément accélérateur dans la vitesse insufflée au projet. Un bureau dans un espace comme la Plage est plus un investissement qu’une charge au niveau comptable… Surtout avec le réseautage.</p>\n<p>Quel que soit le business, le petit monde des entrepreneurs se retrouve confronté à des problématiques communes – fiscales, commerciales, etc. Ici, les gens qui sont des experts sur leurs domaines respectifs, avec des compétences complémentaires. La Plage, c’est un melting-pot fort. Se retrouver dans un espace de coworking, c’est lutter contre la solitude du créateur d’entreprise.</p>\n<p>Pourquoi la Plage, ça s’est fait par évidence. Je suis passé une fois par curiosité et j’ai gardé un bon souvenir du lieu et de l’ambiance générale. J’ai eu naturellement envie d’approfondir, et la première impression a été la bonne.</p>\n<p><b><img src=\"/images/blog/gregmassa.webp\" alt=\"gregmassa\" loading=\"lazy\">4) </b><b>Qu’est ce qui te plait le plus dans le coworking ?</b></p>\n<p>L’atmosphère de travail. Certains paieraient pour travailler chez eux loin de leurs collègues, moi je paye pour travailler avec des collègues qui ne sont même pas mes collègues !</p>\n<p>La productivité s’améliore car on reste concentrés ; et il y a de nombreux échanges informels avec des professionnels agissant sur des périmètres métiers différents. Dans le même temps, je reste totalement libre dans mon organisation dans mon travail et la flexibilité de mon activité.</p>\n<p><b>5) </b><b>Et à la Plage Digitale ?</b></p>\n<p>L’avantage de la Plage réside dans le fait qu’on se trouve dans un pôle orienté digital avec des coworkers compétents et ouverts. Puisque nous sommes dans les métiers de l’économie numérique, on se retrouve en première ligne des changements. Nous sommes témoins (parfois acteurs) des changements du web de notre époque. Et ces changements vont au-delà de simples phénomènes de mode ou autres gadgets pour geeks : ils peuvent aussi impacter la société elle-même, tous les utilisateurs de Facebook ou de services dans le cloud (chez Google par exemple) le comprendront facilement.</p>\n<p>Sur place, l’atmosphère est très studieuse. L’apparente décontraction des gens ne doit pas faire oublier que chacun travaille pour son propre business, par conséquent, tout le monde se manage par son obligation personnelle de résultat. Ce qui frappe les gens d’ailleurs, en arrivant à la Plage, c’est le caractère paisible de l’open space. C’est d’ailleurs la première fois dans mon expérience professionnelle que je valorise le travail sur un plateau plutôt que dans un bureau fermé!</p>\n<h2>« La Plage, c’est un melting-pot fort. »</h2>\n<p><b>6) </b><b>En un mot, comment définirais-tu ton expérience parmi les Plagistes ?</b></p>\n<p>Conviviale. Les gens s’entendent bien et s’entraident. Certains business se nouent même entre les sociétés présentes sur place ; pour ma part, j’y ai trouvé des fournisseurs potentiels.</p>\n<p>En parallèle, le cadre est plaisant entre Malraux et Rivetoile. Je viens au travail avec la banane et si je veux venir en short l’été, rien ne m’en empêche *rires*. C’est le plaisir de travailler à l’état pur. Tu peux t ‘investir énormément (entre 12 et 15 heures/jours) à la réussite dans ton business, mais la valeur plaisir doit être prédominante. Sinon, autant laisser tomber et redevenir salarié dans un cadre plus formel et moins fun.</p>\n<p><b>7) </b><b>Un dernier conseil ?</b></p>\n<p>Oui. À ceux qui recherchent un endroit pour travailler au calme dans un environnement agréable hors de chez eux, ne faites pas comme moi en remettant ça au lendemain: venez le plus tôt possible !</p>\n<p>Aux candidats : faites des recherches poussées sur les entreprises qui vous intéressent et vous trouverez des problématiques professionnelles auxquelles répondre. C’est ça qui vous distinguera des autres et vous permettra de décrocher… Votre prochain job !</p>\n<p>Aux managers : laissez les gens reprendre la main sur leur job. Privilégier la convivialité, proposer un cadre de travail agréable et déléguer permet d’obtenir des gens le meilleur d’eux-mêmes et la motivation d’atteindre les objectifs. Et qu’on en finisse avec le management par la peur ! La crise ne se résoudra pas par des positions défensives mais par de l’innovation pour les clients et de l’audace.</p>\n<blockquote><p>Greg Massa, fondateur et dirigeant de mon prochain job<br>\n<a href=\"http://www.monprochainjob.com/\" rel=\"noopener\">www.monprochainjob.com/</a>    <a href=\"https://twitter.com/MonProchainJob\" rel=\"noopener\"><img src=\"/images/blog/test2.webp\" alt=\"test2\" loading=\"lazy\"></a>       <a href=\"https://www.facebook.com/MonProchainJob\" rel=\"noopener\"><img src=\"/images/blog/test1.webp\" alt=\"test1\" loading=\"lazy\"></a>        <a href=\"https://plus.google.com/u/0/101136206540973719964/posts\" rel=\"noopener\"><img src=\"/images/blog/06003950-photo-logo-google-plus.webp\" alt=\"06003950-photo-logo-google-plus\" loading=\"lazy\"> </a><br>\n(lancement du portail au 30 septembre et du blog Emploi à la rentrée)</p></blockquote>"
      legacy_cover: "/images/blog/gregcouv.webp"
      status: "published"
      published_at: "2013-08-12"
      categories: ["actualites"]
      legacy_path: "/coworker-de-la-semaine-greg-massa-lentrepreneur-qui-aime-le-concret/"
      created_at: "2013-08-12T15:04:06Z"
  - key: "coworker-de-la-semaine-francois-huynh-les-opportunites-a-la-pelle"
    fields:
      title: "[COWORKER DE LA SEMAINE] François Huynh, les opportunités à la pelle"
      slug: "coworker-de-la-semaine-francois-huynh-les-opportunites-a-la-pelle"
      excerpt: "Notre second coworker à nous accorder une interview se prénomme François Huynh. Sur ses 6 mois d’activité à la Plage Digitale, François a pu travailler sur…"
      body: "<p><b>Notre second coworker à nous accorder une interview se prénomme François Huynh. Sur ses 6 mois d’activité à la Plage Digitale, François a pu travailler sur beaucoup de projets avec les autres Plagistes. Nous pourrions le définir comme un hyperactif. Des projets, des campagnes, des opportunités qu’il ne cesse de concrétiser. Il nous en dit plus.</b></p>\n<p><strong>1) Quelle est ta profession ?</strong></p>\n<p>Je ne sais comment définir mon métier si ce n’est une multitude de casquettes. J’ai plusieurs professions et plusieurs fonctions. Je me dis tout d’abord entrepreneur. J’ai monté mon agence (AD Avenue) de conseils en stratégie internet après plusieurs années dans des grands groupes. Ayant participé au développement du digital chez Crédit Mutuel Centre Est Europe, Sanofi, Yahoo !, je me suis donné le challenge d’innover pour les petites structures en France. Pourquoi les petites entreprises ? Je pense sincèrement que ces entreprises ont autant de valeur que les grandes ! L’important est de raisonner en leader pour innover et les petites structures sont tout de même plus réactives et flexibles.</p>\n<p><strong>2) Pourquoi avoir choisi l’enseignement, à côté de tout ce que tu fais ?</strong></p>\n<p><img src=\"/images/blog/me.webp\" alt=\"François Huynh, directeur d&#x27;AD Avenue\" loading=\"lazy\">Ce fut une réelle opportunité. J’avais repris des études il y a quelques années. Avec ma maturité, de bons résultats et un relationnel efficace avec la direction, je me suis proposé d’apporter ma valeur ajoutée et ma pédagogie à l’école. J’ai vu que je pouvais apporter quelque chose de nouveau et d’amusant. Tout s’est fait naturellement. Je poursuis à présent par la formation professionnelle avec une certification récente.</p>\n<p>J’enseigne également le marketing internet aux étudiants d’Ecole de Commerce pour l’INSEEC, l’Université de Paris 8 et l’EM de Strasbourg. Mon métier est à la fois passionnant, terrifiant et motivant. Amoureux de l’innovation, je cherche à redéfinir le sens du mot entreprendre… Pas seulement pour moi-même, mais pour les autres.</p>\n<p><strong>3) Dis-nous en un peu plus sur AD Avenue.</strong></p>\n<p>J’ai créé AD Avenue lorsque je travaillais pour Sanofi-Aventis à Genève. Mon travail était de monter une agence de communication digitale en interne, une stratégie que j’ai mise en place avec une équipe de créatifs. Au final, j’ai voulu réaliser ce même parcours pour moi-même, puisque j’avais les connaissances et la motivation pour réussir. Au fil du temps, de mon expérience et de ma culture, j’ai développé cet esprit entrepreneurial qui m’accompagne aujourd’hui. « Tu prends le risque et tu te lances ».</p>\n<p>L’agence AD Avenue est divisée en deux grandes familles, l’agence digitale et les produits (éditeurs de sites) en régie. L’agence digitale est divisée en 8 domaines d’activité stratégique : Consulting/Formation, Création Graphique, Web, Référencement, Médias Sociaux, Communication/Relations presse, Email/Social Marketing, et Publicité en ligne.</p>\n<p>AD Avenue est à la fois conseiller et exécutant car nous disposons des ressources matérielles et humaines pour mettre en application les réponses aux problématiques des entreprises désirant vendre sur internet. Nous nous occupons de leur présence sur les réseaux sociaux, de leurs campagnes e-mail marketing, de leur stratégie de développement sur internet, de la promotion de leurs nouveaux produits/services, mais aussi du développement de leur site vitrine ou e-commerce.</p>\n<h2>« L’important est de raisonner en leader pour innover et les petites structures sont tout de même plus réactives et flexibles. »</h2>\n<p><strong>4) Sur quelles campagnes/clients travailles-tu en ce moment ?</strong></p>\n<p>Nous sommes actuellement sur une problématique d’entreprise datant des années 70 qui aimerait performer et mesurer leur impact sur internet. Il s’agit d’établir un premier diagnostic et d’effectuer un audit sur son existence sur internet, puis de préparer une recommandation concrète afin de mettre en place avec les commerciaux une stratégie efficace sous forme de séminaire. C’est moins glamour que de faire des opérations sur Facebook, mais ces problématiques là nous aident à innover et à apprendre plus.</p>\n<p>Nous préparons également la rentrée pour les annonceurs et les campagnes e-mail des clients – surtout quand on sait que la rentrée est une période très promotionnelle. Au sein d’une agence, il y a toujours à faire : retravailler ses offres, repenser sa stratégie ou même avancer sur des projets pour amener de la croissance. Pour la rentrée, nous allons proposer des nouveaux produits et services. Nous sommes en flux continu sur notre portefeuille de produits et nous préparons en ce moment même 4 lancements de produits.</p>\n<p>Je ne peux que vous dévoiler les tags à suivre. Il va falloir attendre la rentrée pour découvrir les 4 nouveaux produits de la marque AD Avenue.</p>\n<p>#pmebooster #euneva #OnlineAsk #Landing’Pay</p>\n<p><img src=\"/images/blog/logo-ad-avenue2.webp\" alt=\"Logo Ad Avenue, stratégie et marketing internet\" loading=\"lazy\"></p>\n<p><strong>5) D’où te viens cette passion du web ?</strong></p>\n<p>Disons que c’est dans la continuité de mon métier de base – la communication visuelle. J’ai acquis une certaine liberté en me penchant sur le web. Sa richesse, son contenu intéressant… Ça bouge beaucoup, c’est en évolution perpétuelle. J’en veux pour preuve que n’importe quelle entreprise, même si elle a un commerce physique, se tourne vers le web. C’est un passage obligatoire.</p>\n<p>On peut apprendre des règles et des méthodes mais tu ne sauras jamais tout sur le web. C’est pour cette raison qu’il faut toujours réfléchir et s’adapter en fonction du marché, du client ou même de l’époque.</p>\n<h2>« Au bout de 6 mois ici, j’ai trouvé des clients mais aussi de futurs collaborateurs. »</h2>\n<p><strong>6) Pourquoi avoir choisi le coworking et plus particulièrement la Plage ?</strong></p>\n<p>Encore une fois, c’était une opportunité. Je me déplace régulièrement, j’avais besoin d’un bureau mobile. Quand j’ai fait mes recherches préliminaires, les prix étaient forts et les horaires peu flexibles. C’est aberrant. Je veux dire, quand tu commences ta boîte, tu ne peux pas te permettre de travailler de 8h à 18h. C’est alors que j’ai découvert La Cantine à Paris. J’ai voulu retrouver le même concept sur Strasbourg. Puis tout a découlé naturellement, je suis venu visiter la Plage Digitale et je me suis rendu compte qu’elle répondait à mes besoins. D’ailleurs, il y a beaucoup d’évènements qui se passent à la Plage, comme le WDSTR.</p>\n<p>Au bout de 6 mois ici, j’ai trouvé des clients mais aussi de futurs collaborateurs. Il y a beaucoup de talents et de compétences ici, cela te permet de créer des partenariats avec des collègues de bureau et de prendre des décisions rapidement. Ce sont des opportunités à saisir. En fait, si je monte beaucoup de projets c’est pour ne pas me retrouver seul. Je lance ma vision sur un sujet et on me suit (ou pas).</p>\n<blockquote><p>François Huynh, directeur d’AD avenue<br>\n<a href=\"ad-avenue.fr/\">AD-Avenue.fr</a>   <a href=\"https://twitter.com/ad_avenue\" rel=\"noopener\"><img src=\"/images/blog/test2.webp\" alt=\"test2\" loading=\"lazy\"></a>      <a href=\"https://www.facebook.com/agenceadavenue?fref=ts\" rel=\"noopener\"><img src=\"/images/blog/test1.webp\" alt=\"test1\" loading=\"lazy\"></a>      <a href=\"https://plus.google.com/u/0/108156442399788767116/posts\" rel=\"noopener\"><img src=\"/images/blog/06003950-photo-logo-google-plus.webp\" alt=\"06003950-photo-logo-google-plus\" loading=\"lazy\"></a></p></blockquote>"
