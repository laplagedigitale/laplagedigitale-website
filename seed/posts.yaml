  - key: "coworker-de-la-semaine-simon-thierry-lhumain-avant-tout"
    fields:
      title: "[COWORKER DE LA SEMAINE] Simon Thierry, l’humain avant tout"
      slug: "coworker-de-la-semaine-simon-thierry-lhumain-avant-tout"
      excerpt: "Simon est ce qu’on pourrait appeler un fédérateur de la Plage Digitale. Avec une énergie débordante, il a toujours une idée pour réunir les coworkers en…"
      body: "<p><strong>Simon est ce qu’on pourrait appeler un fédérateur de la Plage Digitale. Avec une énergie débordante, il a toujours une idée pour réunir les coworkers en dehors du travail (ou pendant avec une petite partie de Killer). Lumières sur un profil qui cherche constamment à « apporter sa pierre » à la communauté :</strong></p>\n<p><strong>1) Quelle est ta profession ?</strong></p>\n<p>Je suis cofondateur et directeur associé – avec Emmanuelle Ebel-Jost – d’Adoc Métis, cabinet de conseil en Ressources Humaines (RH) pour l’enseignement supérieur et la recherche (ESR). Outre la gestion quotidienne de l’entreprise, je suis consultant et formateur en Ressources Humaines pour les universités et les écoles de l’enseignement supérieur.</p>\n<p>Le but est d’améliorer le dispositif de recrutement pour ces institutions. Avant 2009, les RH relevaient de la responsabilité du Ministère. Depuis, c’est aux universités de s’en charger.</p>\n<p><strong>2) Si je comprends bien, vous leur apprenez donc à recruter ?</strong></p>\n<p><img src=\"/images/blog/simon1-226x300.webp\" alt=\"simon1-226x300\" loading=\"lazy\">À recruter et, plus généralement, à gérer des carrières. On amène nos clients à établir tout un dispositif qui va de la définition des postes à pourvoir à la formation des cadres.  Notre premier client fût les Assises de l’Enseignement Supérieur et de la Recherche afin de dresser un paysage du monde académique actuel. Aujourd’hui, on travaille avec l’Université de Strasbourg pour former des encadrants doctoraux, c’est l’une des premières universités françaises à le faire.</p>\n<p>Très bientôt, nous serons amenés à travailler avec l’AMUE, une agence qui mutualise les formations pour les universités. C’est une des premières fois qu’ils font appel à un cabinet privé pour des formations, ce qui est pour nous une reconnaissance de la valeur de notre expertise. Nous manquons encore de références aux yeux de certains prospects, et ce partenariat va nous permettre de nous démarquer !</p>\n<p><strong>3) Pourquoi se spécialiser dans l’enseignement supérieur et de la recherche ?</strong></p>\n<p>Emmanuelle et moi-même avons travaillé chacun 5 ans en tant qu’enseignants-chercheurs, elle en art, moi en informatique. On y a vu comment fonctionne la gestion RH dans les établissement d’ESR. On a aussi été bénévoles dans la Confédération des Jeunes Chercheurs qui porte sa réflexion sur la gestion des RH pour le doctorat, et nous n’avons eu « qu’à » étendre cette expertise à l’ensemble des carrières de l’enseignement supérieur. On est vraiment attirés par ce monde et on a le sentiment d’améliorer les choses à notre niveau tout en étant pertinents. Notre objectif est de remettre de l’humain dans les ressources humaines.</p>\n<blockquote><p>NDR : Adoc Metis a récemment créé un blog original sur le sujet. <a href=\"http://lapin-blanc.blogs.docteo.net\" rel=\"noopener\">Suivez le lapin blanc !</a></p></blockquote>\n<p><strong>4) Pourquoi avoir choisi le coworking et la Plage Digitale ?</strong></p>\n<p>À l’origine, j’avais entendu parler de la Cantine, à Paris,et je m’étais dit que ça serait bien d’avoir la même chose sur Strasbourg. Quand j’ai appris que ça allait se faire, j’ai voulu essayer. Il y a plusieurs raisons qui me font rester à la Plage : il y a du monde au bureau et j’ai besoin de fun et d’une bonne ambiance pendant la journée, pour relâcher la pression à mon travail ; le côté financier avec des bureaux abordables et des services disponibles ; et j’ai besoin d’une coupure entre mon chez-moi et mon espace de travail, d’une hygiène de vie avec une séparation entre les deux environnements.</p>\n<p>Si, aujourd’hui, l’ambiance était la même qu’à mon arrivée, je ne serais pas resté. On était un peu comme dans une bibliothèque où tu dois chuchoter à ton voisin. Maintenant, on se marre régulièrement, tout en respectant le fait que du monde travaille dans l’open space. Je m’y sens bien alors j’essaie d’apporter ma petite pierre à la communauté !</p>\n<p><img src=\"/images/blog/adoc-metis.webp\" alt=\"Logo Adoc Métis, cabinet privé de ressources humaines\" loading=\"lazy\"></p>\n<blockquote><p>Simon Thierry, cofondateur d’Adoc métis<br>\n<a href=\"http://adoc-metis.com\" rel=\"noopener\">adoc-metis.com </a>  <a href=\"https://twitter.com/AdocMetis\" rel=\"noopener\"><img src=\"/images/blog/test2.webp\" alt=\"test2\" loading=\"lazy\"></a>        <a href=\"https://www.facebook.com/AdocMetis?fref=ts\" rel=\"noopener\"><img src=\"/images/blog/test1.webp\" alt=\"test1\" loading=\"lazy\"></a>        <a href=\"https://plus.google.com/103528652232769267056/posts\" rel=\"noopener\"><img src=\"/images/blog/06003950-photo-logo-google-plus.webp\" alt=\"06003950-photo-logo-google-plus\" loading=\"lazy\"></a></p></blockquote>"
      legacy_cover: "/images/blog/vignette-adoc.webp"
