      title: "Juin 2023 ☀️"
      slug: "juin-2023"
      excerpt: "Abeilles de mai valent de l’or, en juin, c’est chance encore"
      body: "<h2>Abeilles de mai valent de l’or, en juin, c’est chance encore </h2>\n<h2>Découvrez l’agenda du mois de juin de la Plage Digitale ☀️</h2>\n<figure><img src=\"/images/blog/15.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Achen’ight – 16/06/2023 – à 19h00</strong></p>\n<p><strong>Le rendez-vous du mois pour les passionnés de Minecraft</strong></p>\n<p>La communauté d’Achencraft se réunit chaque mois pour concevoir autour de projets communs dans une ambiance conviviale </p>\n<p>Pour les personnes souhaitant rejoindre cet événement, il suffit de venir avec un ordinateur et une petite collation à partager ! </p>\n<p><a href=\"https://www.facebook.com/Achencraft\" rel=\"noopener\"><strong>Participer</strong></a></p>\n<figure><img src=\"/images/blog/14-1.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Les Foliweb – 22/06/2023 – à 18h30</strong></p>\n<p><strong>Besoin d’aide pour faire remonter votre site en première page ? </strong></p>\n<p>Grâce à quelques techniques de référencement naturel (SEO), vous serez en mesure de positionner votre site web sur les requêtes les plus utiles pour votre business.</p>\n<p>Comment définir votre stratégie d’optimisation ? Quels sont les essentiels d’un site bien optimisé ? Quels outils utiliser ?<br>Cet atelier en présentiel vous permettra d’appréhender les bases du référencement naturel et mettre en place les bonnes actions pour gagner en visibilité <br><br>✅ Cet atelier vous propose de comprendre :<br>• Les enjeux liés au référencement naturel<br>• Les indispensables techniques pour optimiser votre site<br>• Comment définir les expressions clés utiles pour votre activité<br>• L’importance du référencement local<br><br>⏰ Déroulé de l’atelier :<br>Un temps d’échange et de réseautage entre participants vous sera proposé à l’issue de cet atelier.<br>• 45 min de présentation / mise en contexte<br>• 45 min de cas pratique, exemples concrets issus de la salle (et pourquoi pas le vôtre) et questions / réponses pour repartir avec les idées claires sur vos prochaines actions<br><br>Notre objectif, à travers cet atelier, est que vous puissiez prendre du recul et les bonnes décisions pour développer votre activité professionnelle grâce au web </p>\n<p><a href=\"https://www.eventbrite.fr/e/billets-remontez-sur-les-moteurs-de-recherche-grace-au-referencement-naturel-639325227967?utm_source=Partenaire/?&amp;utm_campaign=plage-digitale\" rel=\"noopener\"><strong>Participer</strong></a></p>\n<figure><img src=\"/images/blog/13.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Atelier d’initiation WordPress – 28/06/2023 – à 17h00 – 60,00€</strong></p>\n<p><strong> Vous êtes débutant(e) dans le monde du web et souhaitez-vous créer votre propre site internet ? </strong><br><strong> Vous cherchez une formation de qualité à un prix abordable ?</strong></p>\n<p>✅  Nous avons la solution parfaite pour vous : notre atelier d’initiation à WordPress avec Bryan Rassen, Formateur et Consultant en Marketing Digital &amp; Growth Hacking !</p>\n<p>Au cours de cette session de 3 heures, vous apprendrez toutes les bases nécessaires pour construire et gérer votre propre site web sur WordPress ⭐️</p>\n<p> Contenu de l’Atelier :</p>\n<p>1️⃣ Installation et configuration de WordPress<br>2️⃣ Choix et personnalisation du thème<br>3️⃣ Gestion des pages et des articles<br>4️⃣ Référencement naturel</p>\n<p>⚠️ N’oubliez pas d’apporter votre ordinateur portable, de préférence sous Mac OS ou Windows, pour pouvoir installer et utiliser WordPress et les outils associés facilement </p>\n<p>Nous vous attendons nombreux pour cet atelier pratique et enrichissant en création de site internet sur WordPress ! </p>\n<p><a href=\"https://www.eventbrite.fr/e/billets-creez-votre-site-internet-en-3h-a-strasbourg-633889108387\" rel=\"noopener\"><strong>S’inscrire</strong></a></p>\n<figure><img src=\"/images/blog/16-2-202306.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>HackSXB – 30/06/2023 – à 19h00</strong></p>\n<p><strong>Le HackSXB est une communauté créée par Alsace Digitale </strong><br><br>Elle rassemble une communauté d’étudiants et de professionnels qui partagent une passion pour la création. Chaque dernier vendredi du mois, cette soirée dédiée à la programmation et à la bidouille permet à chacun de venir avec son projet ou de participer à un projet commun, sur des sujets libres ou parfois plus thématiques <br><br>Des passionnés aux compétences variées y participent et proposent divers projets, allant du développement de jeux vidéo à la soudure de composants électroniques </p>\n<p><a href=\"https://www.facebook.com/HackSXB\" rel=\"noopener\"><strong>Rejoindre la communauté</strong></a></p>\n<figure><img src=\"/images/blog/format-newsletter-19-2.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>C’est arrivé le mois dernier … et près de chez vous !</strong></p>\n<p><strong>À la Plage Digitale, il s’en est passé des choses en mai :</strong></p>\n<p> Meetup Software Crafters Strasbourg, la société Qwenty nous a rejoint, des séances de brainstorming, etc. Un mois très productif </p>\n<p>Suivez-nous sur nos réseaux sociaux pour ne rien louper !</p>\n<p><a href=\"https://www.helloasso.com/associations/la-plage-digitale/adhesions/adhesions-la-plage-digitale-2023\" rel=\"noopener\"><strong>Devenir plagiste ! </strong></a></p>"
