  - key: "le-shadok-lance-un-appel-a-projets-de-residences-dentreprises"
    fields:
      title: "Envie de développer vos projets d’entrepreneur à la Plage du Shadok ?"
      slug: "le-shadok-lance-un-appel-a-projets-de-residences-dentreprises"
      excerpt: "Réalisé en collaboration avec l’association Alsace Digitale et l’Eurométropole de Strasbourg, l’objectif du Kit Shadok d’Accompagnement d’Entreprises est…"
      body: "<p>Réalisé en collaboration avec l’association <strong>Alsace Digitale</strong> et l’<strong>Eurométropole de Strasbourg</strong>, l’objectif du <strong>Kit Shadok d’Accompagnement d’Entreprises</strong> est d’accueillir deux jeunes entreprises indépendantes en 2015-2016 et leur permettre de consolider leur modèle économique, d’accélérer leur croissance et de concrétiser leur position sur leurs marchés en France et à l’international.</p>\n<h3><strong>Les Modalités</strong></h3>\n<p>L’appel à projets vise prioritairement des entreprises porteuses d’un projet innovant, à fort potentiel économique et susceptibles d’une forte croissance en France et à l’international.</p>\n<p>Pour être éligibles, ces entreprises des secteurs créatifs doivent être domiciliées sur le territoire de l’Eurométropole et avoir au maximum trois ans d’existence. La nomenclature des secteurs créatif ou numérique est spécifiée dans le cahier des charges.</p>\n<p>Les entreprises lauréates du Kit Shadok d’Accompagnement d’Entreprises bénéficieront</p>\n<ul><li><strong>Pour une durée de six mois maximum de :</strong>\n<ul><li>une à trois places à<strong> la</strong> <strong>Plage du Shadok</strong> en fonction des besoins de l’équipe</li><li>l’accès aux services et aux équipements de l’espace de coworking</li></ul></li></ul>\n<ul><li><strong>D’un appui pour leur développement lors de ces six mois comprenant :</strong>\n<ul><li>un suivi personnalisé équivalent à deux jours pleins, réalisé par Alsace Digitale</li><li>une soirée de mise en réseau</li><li>un accès à des ateliers organisés par l’accélérateur d’Orange à destination des startups</li><li>un accompagnement sur mesure et en fonction des besoins de l’entreprise par <a href=\"http://www.creaccro.eu/\" rel=\"noopener\">l’association ACCRO </a>(conseil, mise en réseau).</li><li>un financement de 7 500 € TTC destiné à contribuer au financement de dépenses prioritaires de développement dans un ou plusieurs des domaines suivants :</li><li>des conseils expert (juridique, économique, technologique, fiscal, ressources humaines, marketing et commercialisation)</li><li>Prototypage et achat de matériel</li><li>Communication, promotion, mise en réseau</li></ul></li></ul>\n<p><a href=\"http://www.shadok.strasbourg.eu/wp-content/uploads/2015/11/Kit-accompagnement-e-Shadok.pdf\" rel=\"noopener\">Téléchargez l’appel à projet</a></p>\n<p><a href=\"http://www.shadok.strasbourg.eu/wp-content/uploads/2015/11/formulaire_de_participation_Residence-Shadok_2015-1.doc\" rel=\"noopener\">Téléchargez le formulaire de candidature</a></p>\n<p><a href=\"http://www.shadok.strasbourg.eu/wp-content/uploads/2015/11/code_nafa_et_nafa.pdf\" rel=\"noopener\">Téléchargez les codes NAF et NAFA des industries créatives </a></p>"
      legacy_cover: "/images/blog/uneshadok.webp"
      status: "published"
      published_at: "2015-11-09"
      categories: ["actualites", "evenements"]
      legacy_path: "/le-shadok-lance-un-appel-a-projets-de-residences-dentreprises/"
