  - key: "mars-2024"
    fields:
      title: "Mars 2024"
      slug: "mars-2024"
      excerpt: "En mars, cultivons notre détermination et notre persévérance pour atteindre de nouveaux sommets professionnels 🏔"
      body: "<p><strong>En mars, cultivons notre détermination et notre persévérance pour atteindre de nouveaux sommets professionnels 🏔</strong></p>\n<p><strong><strong>Découvrez l’agenda du mois de février de la Plage Digitale</strong></strong> 🗓</p>\n<figure><img src=\"/images/blog/65ccc66ccb7c0409590460c1.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Permanence Propriété Industrielle – 12/03/2024 – De 9h00 à 12h00</strong></p>\n<p><strong>Prenez rendez-vous avec Pauline Wendehenne, Chargée d’affaires en Propriété Industrielle à l’INPI. 🧠</strong></p>\n<p>Voici quelques questions sur lesquelles Pauline pourra vous accompagner ⤵️</p>\n<p>▷ J’ai un nom pour ma société ou mon produit : est-ce que j’ai le droit de l’utiliser ? Est-ce que c’est un bon choix ? Est-ce que je peux le protéger par une marque ?<br>▷ Je voudrais déposer une marque : combien ça coûte ? Comment je choisis le type de marque et les classes (c’est quoi une classe ?!) ? Quels outils peuvent m’aider ?<br>▷ Mon identité visuelle comporte un logo : à qui appartiennent les droits sur le logo ? Puis-je le modifier par exemple ?<br>▷ Comment protéger mon innovation ? Le dépôt d’une demande de brevet est-il pertinent pour mon projet ?<br>▷ Quel est l’intérêt de dater et comment faire ?<br>▷ Je développe une application mobile, un site internet ou un logiciel : à qui appartiennent les droits d’auteur sur le code ? Comment je peux le protéger ? Y a-t-il d’autres mécanismes de protection possibles ?<br>▷ Comment combiner les titres de Propriété Industrielle et construire ma protection pour accélérer le développement de mon entreprise ?<br>▷ Je souhaite conquérir des marchés étrangers : quelles précautions peuvent être prises ?<br>▷ Comment l’INPI peut m’accompagner ? Quelles aides existent ?</p>\n<p><a href=\"https://tally.so/r/w5x6zM\" rel=\"noopener\">Prendre rdv</a></p>\n<figure><img src=\"/images/blog/65ccc6901f523d1de45de3f3.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Meetup Go SXB Go – 28/03/2024 – De 18h00 à 20h30</strong></p>\n<p><strong>Ce groupe est ouvert à toute personne intéressée par Go : du curieux à l’utilisateur expérimenté 🦄</strong></p>\n<p>Au programme ⤵️</p>\n<p>Petit topo sur la performance ! On discutera de quelques trucs et astuces pour optimiser nos programmes Go.</p>\n<p><a href=\"https://www.meetup.com/fr-FR/go-sxb-go/\" rel=\"noopener\">Rejoindre l’événement</a></p>\n<figure><img src=\"/images/blog/65b79a2ac456be11fe229293.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Les rendez-vous mensuels !</strong></p>\n<p><strong>Achen’ight – 15/03/2024 – 19h00-23h00 👾</strong></p>\n<p>Achen’ight, c’est une soirée par mois où se rassemble l’équipe d’Achencraft pour discuter, rencontrer, rigoler, concevoir, …. bref tout ce qui permet au projet Achencraft de progresser ! 🤩</p>\n<p><strong>Strasbourg Flutter Meetup Group – 05/03/2024 et 19/03/2024 – 18h30-20h30 🚀</strong></p>\n<p>Les participants échangent en anglais 🇬🇧 ou allemand 🇩🇪 !</p>\n<p>▹ Aborder des sujets liés à Flutter<br>▹ Présentation des résultats des deux dernières semaines, ainsi que prévision pour la prochaine itération<br>▹ Échange sur les actualités Flutter (par exemple, notes de version ou nouveaux produits autour de Flutter)</p>\n<p>▶️ Canal Discord (https://discord.gg/AMfvWZEM). Si vous ne pouvez pas participer sur place, n’hésitez pas à visiter la réunion virtuellement.</p>\n<p><strong>Hack SXB – 22/03/2024 – 18h00-23h00 🛠</strong></p>\n<p>Venez partager votre passion pour la création avec un groupe d’étudiants et professionnels !💡</p>\n<p>Présentez vos propres projets ou rejoignez des projets collectifs sur des sujets variés, parfois thématiques, lors de cette soirée de programmation et de bricolage 🛠</p>\n<p><a href=\"https://www.facebook.com/Achencraft\" rel=\"noopener\">Achencraft</a></p>\n<p><a href=\"https://www.meetup.com/fr-FR/strasbourg-flutter-meetup-group/events/297562393/\" rel=\"noopener\">Strasbourg Flutter <br>Meetup Group</a></p>\n<p><a href=\"https://www.facebook.com/HackSXB\" rel=\"noopener\">Hack SXB</a></p>\n<figure><img src=\"/images/blog/65ccc8c5cb7c0409590461b4.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>C’est arrivé le mois dernier … et près de chez vous !</strong></p>\n<p><strong>À la Plage Digitale, il s’en est passé des choses en février :</strong></p>\n<p>👉🏼 2 permanences professionnelles, un meetup Deep Learning, un meetup Data Science, une conférence sur l’IA, une matinée crêpes… ! 🤩</p>\n<p>Suivez-nous sur nos réseaux sociaux pour ne rien louper !</p>"
