  - key: "ouverture-du-nouvel-espace-de-coworking-la-plage-du-shadok"
    fields:
      title: "Ouverture du nouvel espace de coworking : la Plage du Shadok"
      slug: "ouverture-du-nouvel-espace-de-coworking-la-plage-du-shadok"
      excerpt: "Lundi 13 avril, Alsace Digitale a ouvert son nouvel espace de coworking au Shadok. Après un premier espace ouvert en 2012 dans les locaux de Rivétoile, qui…"
      body: "<p>Lundi 13 avril, Alsace Digitale a ouvert son<strong> nouvel espace de coworking</strong> au <strong>Shadok</strong>.</p>\n<p>Après un premier espace ouvert en 2012 dans les locaux de Rivétoile, qui s’appelle désormais la plage Rivétoile, l’espace de la plage du Shadok vient apporter de nouvelles possibilités aux coworkers de Strasbourg et des environs, mais aussi plus d’espaces de travail et de salles de réunion.<br>\nTout ça, dans un environnement stimulant et convivial avec des nouveaux espaces fixe et flex. A la journée ou à l’année, venez vous installer pour travailler.</p>\n<p>Avec en France plus de <b>250 espaces</b> qui y sont consacrés et <b>10.000 coworkers</b>, le coworking est un concept qui prend de l’ampleur. Créateur de business et de lien social, il offre une possibilité souple et financièrement accessible de travailler dans un espace de travail  partagé;  seul,  ou en collaboration.<br>\n<strong>Lancez-vous, <b>rejoignez le mouvement</b> !</strong></p>"
      legacy_cover: "/images/blog/d62a2612.webp"
      status: "published"
      published_at: "2015-04-23"
      categories: ["actualites"]
      legacy_path: "/ouverture-du-nouvel-espace-de-coworking-la-plage-du-shadok/"
      created_at: "2015-04-23T12:57:24Z"
  - key: "geeks-on-a-farm-edition-2015-2"
    fields:
      title: "Geeks On A Farm : édition 2015 !"
      slug: "geeks-on-a-farm-edition-2015-2"
      excerpt: "Après une première édition en 2014 qui fut une franche réussite, Geeks On A Farm est de retour cette année, et vous réserve encore plus de surprises. Geeks On…"
      body: "<p>Après une première édition en 2014 qui fut une franche réussite, <strong>Geeks On A Farm est de retour</strong> cette année, et vous réserve encore plus de surprises.</p>\n<p>Geeks On A Farm est un évènement qui permet aux passionnés d’entrepreneuriat, de startups,  de design.. et à tous les curieux de France, d’Allemagne et du monde entier de se rencontrer et d’échanger pendant quelques jours, autour de conférences, ateliers et activités diverses.<br>\nLe but est de rencontrer des personnes ayant les mêmes centres d’intérêt et de découvrir les startups du moment, mais aussi de passer un moment agréable et convivial.</p>\n<p>Cette année, 6 invités d’honneur seront présents pour parler de leur parcours et leur expérience :</p>\n<ul><li><strong>Jeremy Chatelaine</strong>, entrepreneur et créateur de <a href=\"https://quickmail.io/\" rel=\"noopener\">Quickmail.io</a>, spécialiste du<em> cold mailing</em></li><li><strong>Yann-Erik Decorde</strong>, « activateur de changement », spécialisé dans le management des affaires internationales et les techniques d’évolution de la conscience. <a href=\"http://www.programmerlareussite.com/\" rel=\"noopener\">Son site internet</a></li><li><strong>Thibaut Vincent</strong>, fondateur de <a href=\"http://lemonfactory.fr/\" rel=\"noopener\">Lemon Factory</a>, entreprise spécialisée dans l’optimisation du taux de conversion des sites web</li><li><strong>Kathleen Fritzsche</strong>, co-fondatrice d’<a href=\"http://accelerate-stuttgart.de/\" rel=\"noopener\">Accelerate Stuttgart</a>, entreprise d’événementiel Allemande</li><li><strong>Alexandre Winter</strong>, fondateur et PDG de <a href=\"http://www.placemeter.com/\" rel=\"noopener\">Placemeter</a>, mais aussi co-fondateur et ex-PDG de LTU Technologies</li><li><strong>Matthias Hornberger, </strong>directeur financier de <a href=\"http://www.kizoo.com/de/\" rel=\"noopener\">Kizoo</a>, entreprise de conseil en e-marketing</li></ul>\n<p><strong>L’évènement aura lieu du jeudi 28 mai au samedi 30 mai, </strong><strong>à Ortenberg, en Allemagne</strong>.</p>\n<p>La place coûte <strong>99,00€ en pré-vente</strong> (jusqu’au 17 mai), et <strong>139,00€</strong> si vous l’achetez après le 17 mai.<br>\nLe billet comprend le séjour, l’hébergement et les repas, ainsi que la participation à toutes les activités de l’évènement!</p>\n<p>Plus d’informations sur <a href=\"http://www.geeks-on-a-farm.com/\" rel=\"noopener\">le site internet de l’évènement</a>.</p>\n<p>Pour obtenir dès maintenant vos billets, <a href=\"http://www.eventbrite.fr/e/billets-geeks-on-a-farm-2015-16294328776\" rel=\"noopener\">rendez-vous sur la billetterie en ligne Eventbrite</a>.</p>\n<p>Retrouvez l’évènement sur les réseaux sociaux dédiés :<br>\n<a href=\"https://www.facebook.com/geeksonafarm?fref=ts\" rel=\"noopener\"><img src=\"https://www.facebook.com/images/fb_icon_325x325.png\" alt=\"\" loading=\"lazy\"></a> <a href=\"https://twitter.com/geeksonafarm\" rel=\"noopener\"><img src=\"https://lh3.ggpht.com/lSLM0xhCA1RZOwaQcjhlwmsvaIQYaP3c5qbDKCgLALhydrgExnaSKZdGa8S3YtRuVA=w300\" alt=\"Twitter\" loading=\"lazy\"></a></p>"
      legacy_cover: "/images/blog/goatftfttftf1.webp"
      status: "published"
      published_at: "2015-04-29"
      categories: ["actualites"]
      legacy_path: "/geeks-on-a-farm-edition-2015-2/"
      created_at: "2015-04-29T07:46:06Z"
  - key: "matchs-amicaux-de-robots-par-alsace-digitale-a-digital-game-show"
    fields:
      title: "Matchs de robots à Digital & Game Show"
      slug: "matchs-amicaux-de-robots-par-alsace-digitale-a-digital-game-show"
      excerpt: "Alsace Digitale, avec le soutien de Planète Sciences, organise des matchs amicaux de robotique, dans le cadre du Digital & Game Show 2015, à Strasbourg. Ces…"
      body: "<p><a href=\"http://www.alsacedigitale.org/\" rel=\"noopener\">Alsace Digitale</a>, avec le soutien de <a href=\"http://www.planete-sciences.org/national/\" rel=\"noopener\">Planète Sciences</a>, organise des matchs amicaux de robotique, dans le cadre du <a href=\"http://digital-and-gameshow.com/\" rel=\"noopener\">Digital &amp; Game Show</a> 2015, à Strasbourg.</p>\n<p>Ces matchs auront lieu <strong>Dimanche 07 juin de 15h à 16h, au Parc d’Exposition Wacken</strong>.</p>\n<p>Véritables défis scientifiques et techniques, ces rencontres sont des moments ludiques où les robots s’affrontent de challenge en challenge.</p>\n<p>Les équipes, constituées d’amateurs de robotique, ont conçu puis réalisé un robot autonome apte à prendre ses propres décisions.<br>\nLes robots sont amusants, intelligents et performants, tout autant que les passionnés qui les font évoluer et que vous aurez l’occasion de rencontrer.<br>\nCes démonstrations sont faites sur la base d’un règlement écrit par Planète Sciences pour la Coupe de France de Robotique, rencontre rassemblant chaque année près de 200 équipes.</p>\n<p><em>L’association <strong>Planète Sciences</strong> a pour objectifs de favoriser, auprès des jeunes de 8 à 25 ans, l’intérêt, la découverte et la pratique des sciences et des techniques. Elle sera présente sur le salon pour échanger autour de ses pratiques et événements phares.</em></p>\n<p>Nous vous attendons nombreux pour soutenir les équipes !</p>"
      legacy_cover: "/images/blog/couv-concours-robots.webp"
      status: "published"
      published_at: "2015-06-01"
      categories: ["actualites"]
      legacy_path: "/matchs-amicaux-de-robots-par-alsace-digitale-a-digital-game-show/"
      created_at: "2015-06-01T14:10:06Z"
  - key: "edgefest-2015-le-programme-complet-est-pret"
    fields:
      title: "EdgeFest 2015"
      slug: "edgefest-2015-le-programme-complet-est-pret"
      excerpt: "EdgeFest, le festival des communautés numériques et créatives à Strasbourg est de retour pour une quatrième édition, cet été. “Edge”, pour la bordure…"
      body: "<p><b><a href=\"http://www.edgefest.fr/\" rel=\"noopener\">EdgeFest</a></b>, le festival des communautés numériques et créatives à Strasbourg est de retour pour une quatrième édition, cet été.</p>\n<p>“<i>Edge</i>”, pour la bordure, l’espace de créativité qui fait de ce festival un évènement unique.</p>\n<p>“<i>Fest</i>”, de “festival”, la fête de l’innovation et du numérique, de l’été et de la Plage.<br>\n<b>Organisé par </b><b><a href=\"http://www.alsacedigitale.org/\" rel=\"noopener\">Alsace Digitale</a></b><b>, en collaboration avec <a href=\"http://www.shadok.strasbourg.eu/\" rel=\"noopener\">le</a></b><a href=\"http://www.shadok.strasbourg.eu/\" rel=\"noopener\"><b> Sh</b><b>a</b><b>do</b><b>k</b></a> <b>et </b><b>Strasbourg Eurométropole</b>, et en partenariat avec <a href=\"http://www.av-lab.net/\" rel=\"noopener\">Av-Lab</a>, EdgeFest c’est également l’occasion de découvrir la presqu’île Malraux d’une toute nouvelle manière.</p>\n<p>Au programme cette année, sept évènements principaux :</p>\n<ul><li><b>Atelier Game Jam</b>, soirée atelier de présentation du concept de Game Jam, marathon de création de jeux vidéo, et test de jeux créés lors d’une précédente Game Jam, en lien avec le festival du film fantastique.</li><li><b>Startup Stories</b>, à la manière de veillées, les créateurs de Startups alsaciennes conteront leur parcours, leurs succès et leurs échecs.</li><li><b>Edgenight</b>, l’immanquable soirée électro, mapping et performances musicales au programme, une soirée à la Plage sur le sable devant la Médiathèque !</li><li><b>Maker Day</b>, évènement consacré à des workshops originaux ; fabrication de bateaux télécommandés, pilotage de crazyflies et atelier AV Lab.</li><li><b>Demo Day</b>, journée de démonstration-test, avec des innovations présentées pour le Millénaire de la Cathédrale.</li><li><b>Kinojam</b>, journée “booste ton projet” audiovisuel, transmédia en partenariat avec la <a href=\"http://safirealsace.com/\" rel=\"noopener\">Safire </a>et l’<a href=\"http://www.culture-alsace.org/\" rel=\"noopener\">agence culturelle d’Alsace</a>.</li><li><b>Exposition “Espaces Sonores”</b>, autour de la place du numérique dans la musique actuelle, en lien avec le festival mondial du saxophone : “SaxOpen”.</li></ul>\n<p>Comme chaque année, <b>tous les évènements sont ouverts à tous publics et gratuits.</b></p>\n<p>C’est aussi le moment de (re)découvrir <a href=\"/nos-coworkers\">les coworkers de la Plage Digitale</a> et leur travail, dans une ambiance conviviale et détendue, et d’en savoir plus sur le milieu des startups Strasbourgeoises et ce qu’elles projettent.</p>\n<p>Les évènements ont lieu sur la Plage <b>devant la Médiathèque André Malraux, à l’UGC, au Shadok</b>…</p>"
      legacy_cover: "/images/blog/edgefest.webp"
      status: "published"
      published_at: "2015-06-01"
      categories: ["actualites"]
      legacy_path: "/edgefest-2015-le-programme-complet-est-pret/"
      created_at: "2015-06-01T14:34:20Z"
  - key: "hacking-health-cafe-au-shadok"
    fields:
      title: "Hacking Health Café au Shadok"
      slug: "hacking-health-cafe-au-shadok"
      excerpt: "Le prochain Hacking Health Café se tiendra mercredi 17 juin à partir de 19h au Shadok. Quelles sont les tendances santé de demain? Qui sont les nouveaux…"
      body: "<p><strong>Le prochain Hacking Health Café se tiendra mercredi 17 juin à partir de 19h au Shadok.</strong></p>\n<p>Quelles sont les tendances santé de demain?</p>\n<p>Qui sont les nouveaux acteurs?</p>\n<p>Comment pouvons-nous accompagner ce mouvement?Bienvenue au Hacking Health Café!<br>\nChaque mois, venez découvrir un panorama des innovations médicales émergentes aux 4 coins du monde ainsi que des exemples locaux.</p>\n<p><strong>Pour Qui?</strong><br>\nMédecins, Professionnels de Santé, Ingénieurs, Patients, Designers, Cadres Hospitaliers, Assureurs, Chirurgiens, Etudiants, Informaticiens…<br>\nCar les idées les plus prometteuses naissent de la convergence entre toutes les disciplines.</p>\n<p><strong>Le Thème du Mois </strong>: <em>La Santé Mentale</em></p>\n<p>20% des adultes dans nos pays développés sont touchés par un trouble de santé mentale au cours de leur vie. Grâce aux nouvelles technologies et une meilleure connaissance scientifique, des solutions créatives apparaissent dans les domaines de l’addiction, la dépression ou les troubles alimentaires.</p>\n<p><strong>Venez nombreux!</strong></p>"
      legacy_cover: "/images/blog/hackinghealth.webp"
      status: "published"
      published_at: "2015-06-02"
      categories: ["actualites"]
      legacy_path: "/hacking-health-cafe-au-shadok/"
      created_at: "2015-06-02T13:00:54Z"
  - key: "demo-night-7"
    fields:
      title: "Démo Night #7"
      slug: "demo-night-7"
      excerpt: "Démo Night #7, organisée par Strasbourg Startups by Alsace Digitale. Ça se passe le jeudi 25 juin 2015, à 19h, à la Plage Rivétoile. Durant cette soirée, des…"
      body: "<p>Démo Night #7, organisée par <a href=\"http://www.strasbourg-startups.com/\" rel=\"noopener\">Strasbourg Startups</a> by <a href=\"http://www.alsacedigitale.org/\" rel=\"noopener\">Alsace Digitale</a>.</p>\n<p>Ça se passe le <strong>jeudi 25 juin 2015, à 19h</strong>, à <a href=\"/espace-coworking\">la Plage Rivétoile</a>.</p>\n<p>Durant cette soirée, des entrepreneurs présentent leur projet de startup sous forme de démo de leur produit ou service <strong>pendant 5 minutes</strong>.</p>\n<p><strong>Zéro bullshit, que de la démo !</strong></p>\n<p>L’évènement est gratuit, sur inscription.<br>\nPour participer il suffit de s’inscrire sur <a href=\"https://www.eventbrite.fr/e/billets-demonight-7-17224977371\" rel=\"noopener\">la billetterie en ligne Eventbrite de cette Démo Night</a>.</p>"
