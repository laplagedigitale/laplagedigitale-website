  - key: "strasbourg-startups-meetup-11-jeudi-27-octobre-2016"
    fields:
      title: "Strasbourg Startups Meetup #11"
      slug: "strasbourg-startups-meetup-11-jeudi-27-octobre-2016"
      excerpt: "Ce onzième Meetup de Strasbourg Startups est proposé en partenariat avec EY et portera sur la relation entre entreprises et startups. Date : jeudi 27 octobre…"
      body: "<p><img src=\"/images/blog/14708324-1025102510945536-1078737385014541248-n.webp\" alt=\"14708324_1025102510945536_1078737385014541248_n\" loading=\"lazy\"></p>\n<p>Ce onzième Meetup de Strasbourg Startups est proposé en partenariat avec <a href=\"https://webforms.ey.com/fr/fr\" rel=\"noopener\">EY</a> et portera sur la relation entre entreprises et startups.</p>\n<p><em>Date</em> : <strong>jeudi 27 octobre</strong> 2016, à partir de <strong>19h</strong></p>\n<p><em>Lieu</em> : au <strong>Shadok</strong>, 25 presqu’île André Malraux, 67100 Strasbourg</p>\n<p>Nous aurons le plaisir de recevoir Laurence Cuillier, avocate, qui nous parlera de :</p>\n<p><strong>L’[é]change entre entreprises établies et jeunes pousses : clé du développement ?</strong></p>\n<p><em>Les risques de « disruption » conduisent les entreprises établies à être vigilantes : le principal danger vient pour elles de nouveaux acteurs qui réinventent complètement les marchés. Les jeunes pousses quant à elles ont besoin d’accéder à des financements, d’asseoir leur crédibilité ou de pénétrer de nouveaux marchés. La coopération entre les deux catégories d’entreprises n’est-il pas un moyen pour chacun d’obtenir ce qui lui manque ? L’échange entre grands groupes et jeunes pousses n’est-il pas une clé de l’innovation future et un fort vecteur de développement et de croissance ? Toutefois, pour un échange réussi, les règles du jeu doivent être clairement définies dès le début de la relation : quels sont les intérêts des deux parties en jeu ? Le partenariat envisagé est-il équilibré ? Cet atelier, grâce à une présentation de praticiens d’EY et le témoignage d’une startup local, sera l’occasion de présenter les modalités d’échanges entre grands groupes et start-ups ainsi que les écueils à éviter et bonne pratiques à adopter.</em></p>\n<p>Cette conférence sera suivie du traditionnel buffet, offert par EY.</p>\n<p>Pour participer, <strong>réservez votre billet</strong> : <a href=\"https://www.eventbrite.fr/e/billets-strasbourg-startups-meetup-11-28558201349\" rel=\"noopener\">https://www.eventbrite.fr/e/billets-strasbourg-startups-meetup-11-28558201349</a></p>\n<p>Vous pouvez également montrer votre participation sur l’<a href=\"https://www.facebook.com/events/286728658392568/\" rel=\"noopener\">événement Facebook</a>.</p>"
      legacy_cover: "/images/blog/14708324-1025102510945536-1078737385014541248-n.webp"
      status: "published"
      published_at: "2016-10-13"
      categories: ["actualites"]
      legacy_path: "/strasbourg-startups-meetup-11-jeudi-27-octobre-2016/"
      created_at: "2016-10-13T08:12:35Z"
  - key: "after-work-grand-est-numerique-au-shadok"
    fields:
      title: "After Work Grand Est Numérique au Shadok"
      slug: "after-work-grand-est-numerique-au-shadok"
      excerpt: "L’association Grand Est Numérique organise un After Work ce jeudi 20 octobre à 18h30 au Shadok à Strasbourg, en partenariat avec Alsace Digitale. L’occasion…"
      body: "<p><strong>L’association Grand Est Numérique organise un After Work ce jeudi 20 octobre à 18h30 au Shadok à Strasbourg, en partenariat avec Alsace Digitale. L’occasion pour les acteurs du numérique de se rencontrer et partager.</strong></p>\n<p>Cela fait près de 4 ans que Grand Est Numérique parcours les villes de la région pour organiser ce type d’événements, qui tendent à répondre à plusieurs objectifs :</p>\n<p>Premièrement, l’association tient à favoriser les moments conviviaux au cours desquels les acteurs du tissu économique du grand est  peuvent se rencontrer et échanger. Etudiants, salariés, dirigeants ou encore freelances, tout le monde y est le bienvenu.</p>\n<p>A travers cet After Work, Grand Est Numérique cherche également à rencontrer le plus grand nombre de ces acteurs, afin de mieux connaître les activités, les tendances et les problématiques liées aux territoires et aux professions. A travers ces liens, l’association cherche à créer du business non seulement dans l’Est de la France, mais également au Luxembourg.</p>\n<p><strong>Pour participer :</strong></p>\n<ol><li>Inscrivez-vous <a href=\"https://www.weezevent.com/after-work-a-strasbourg-le-20-octobre\" rel=\"noopener\">ICI</a>, c’est gratuit mais l’inscription préalable est nécessaire.</li><li>Présentez-vous à l’entrée et recevez votre badge</li><li>Ecoutez les mots de bienvenue par Grand Est Numérique et ses partenaires</li><li>Échangez avec les acteurs présents (idéalement ce que vous ne connaissez pas encore).</li><li>En même temps, découvrez les adhérents de l’association, grâce aux slides de présentation qui défileront sur l’écran dans la salle.</li><li>Repartez d’une soirée conviviale en ayant découvert de nouveaux contacts.</li></ol>\n<p><strong>Début de l’After Work à 18h30. Les consommations sont offertes.</strong></p>\n<p>Y aller : Le Shadok, 25 presqu’île André Malraux, 67100 Strasbourg.</p>\n<p>Et pour tout savoir de l’actualité de Grand Est Numérique : <a href=\"http://grandestnumerique.org/\" rel=\"noopener\">http://grandestnumerique.org/</a></p>"
      legacy_cover: "/images/blog/bandeau-slide-stras-aw-20oct-1.webp"
      status: "published"
      published_at: "2016-10-18"
      categories: ["actualites"]
      legacy_path: "/after-work-grand-est-numerique-au-shadok/"
      created_at: "2016-10-18T15:29:59Z"
  - key: "la-code-week-sinvite-a-rivetoile"
    fields:
      title: "La Code Week s’invite à Rivetoile"
      slug: "la-code-week-sinvite-a-rivetoile"
      excerpt: "Ce samedi 22 octobre dans le cadre de la Code Week, Alsace Digitale en partenariat avec le Coding Club d’Epitech et la Fondation Orange, organise un atelier…"
      body: "<p><strong>Ce samedi 22 octobre dans le cadre de la Code Week, Alsace Digitale en partenariat avec le Coding Club d’Epitech et la Fondation Orange, organise un atelier de démonstration et d’initiation aux nouveaux objets du numérique dans le centre commercial Rivetoile à Strasbourg.</strong></p>\n<p>La Code Week est une semaine dédiée au code et à la programmation numérique pour célébrer l’apprentissage du code. Elle se déroule à l’échelle mondiale, du 15 au 23 octobre 2016.</p>\n<p>Pour cette 4e édition, Alsace Digitale s’invite à Rivetoile et vous propose de découvrir et manipuler des drones, des robots Thymio programmables, des casques de réalité virtuelle et la technologie Leap Motion, ainsi qu’une imprimante 3D.</p>\n<p>Le code est également mis à l’honneur. Les plus curieux pourront s’exercer à la pratique du développement web et de la programmation, de façon ludique et accessible, sur des ordinateurs mis à disposition par l’association.</p>\n<p><strong>L’animation est gratuite. Elle se déroulera de 10 à 17 heures, à l’étage -1 du centre commercial, en face de Leroy Merlin.<br>\n</strong></p>\n<p>Y aller : Centre commercial Rivetoile, 17 Route du Rhin, 67100 Strasbourg</p>\n<p>Le Coding Club à Strasbourg : <a href=\"http://codingclub.epitech.eu/\" rel=\"noopener\">http://codingclub.epitech.eu/</a></p>\n<p>Plus d’infos sur la Code Week : <a href=\"http://www.codeweekfrance.org/\" rel=\"noopener\">http://www.codeweekfrance.org/</a></p>"
      legacy_cover: "/images/blog/tumblr-inline-nyf1j77zsk1ttjavp-500.webp"
      status: "published"
      published_at: "2016-10-19"
      categories: ["actualites"]
      legacy_path: "/la-code-week-sinvite-a-rivetoile/"
      created_at: "2016-10-19T12:10:23Z"
  - key: "startup-assembly-strasbourg"
    fields:
      title: "Startup Assembly Strasbourg"
      slug: "startup-assembly-strasbourg"
      excerpt: "Le mardi 15 novembre se déroulera à Strasbourg, la Startup Assembly, un événement coordonné nationalement par France Digitale. C’est la journée “portes…"
      body: "<p>Le <b>mardi 15 novembre</b> se déroulera à Strasbourg, la <a href=\"http://www.francedigitaleday.com/evenement/startupassembly/\" rel=\"noopener\"><b>Startup Assembly</b></a>, un événement coordonné nationalement par France Digitale. C’est la journée “portes ouvertes” des startups, permettant au grand public de venir à la rencontre des startups locales.</p>\n<p>En partenariat avec la Mission French Tech, les entrepreneurs de la French Tech vous ouvrent leurs portes partout en France. Depuis 2012, la communauté des entreprises des nouvelles technologies se mobilise pour ces « journées du patrimoine des Startups ».</p>\n<p>A Strasbourg, Alsace Digitale vous propose de venir découvrir quelques startups strasbourgeoises dans les deux espaces de coworking : la <a href=\"/espace-coworking\"><b>Plage Rivétoile</b></a>  et la <a href=\"/espace-coworking\"><b>Plage du Shadok</b></a>.</p>\n<p>Participent à l’événement :</p>\n<ul><li><a href=\"http://www.scalingo.com\" rel=\"noopener\"><b>Scalingo</b></a> : une plateforme permettant aux développeurs d’héberger et de gérer leurs applications</li><li><a href=\"http://careacting.com\" rel=\"noopener\"><b>Careacting</b></a>  : une plateforme participative permettant de s’informer sur des maladies, à destination des accompagnants de personnes malades</li><li><a href=\"https://www.scoledge.com\" rel=\"noopener\"><b>Scoledge</b></a> : un outil de communication “zéro-emails” à destination des établissements de l’enseignement supérieur</li><li><a href=\"http://www.teewii.fr/\" rel=\"noopener\"><b>TeeWii</b></a> : un système de rémunération des étudiants en leur proposant de porter des t-shirts sponsorisés sur leur campus.</li></ul>\n<p>Startup Assembly permet de créer du lien en offrant une visibilité aux acteurs des écosystèmes innovants partout en France. Il s’agit de découvrir ces entreprises au cœur de l’innovation en suscitant de nouvelles opportunités et des vocations.</p>\n<p>Rejoignez l’événement sur <strong><a href=\"https://www.facebook.com/events/1822680751310637/\" rel=\"noopener\">Facebook</a></strong> !</p>\n<p><i>Quand ça ?</i> <b>mardi 15 novembre</b> de<b> 17h </b>à<b> 19h</b></p>\n<p><i>Où ça ?</i></p>\n<p><b>Plage Rivétoile       </b><br>\n15 avenue du Rhin<br>\n67100 Strasbourg</p>\n<p>&amp;</p>\n<p><b>Plage du Shadok</b><br>\n25 presqu’ile André Malraux<br>\n67100 Strasbourg</p>"
      legacy_cover: "/images/blog/logovecto-sa-couleur-1.webp"
      status: "published"
      published_at: "2016-11-02"
      categories: ["actualites"]
      legacy_path: "/startup-assembly-strasbourg/"
      created_at: "2016-11-02T15:29:48Z"
  - key: "meetup-12"
    fields:
      title: "Meetup #12"
      slug: "meetup-12"
      excerpt: "Jeudi 24 novembre se déroulera le douzième meetup de Strasbourg Startups sur le thème des solutions de financement pour les startups, avec l’exemple du Crédit…"
      body: "<p>Jeudi 24 novembre se déroulera le douzième meetup de Strasbourg Startups sur le thème des solutions de financement pour les startups, avec l’exemple du <strong>Crédit Impôt Recherche</strong> (CIR).</p>\n<p>Intervenants : <strong>Julien Gossa</strong>, maître de Conférences en informatique à l’Université de Strasbourg et expert CIR.</p>\n<p><strong>Pascale Laurain</strong>, Chargée de mission CIR-JEI au Ministère de l’Enseignement Supérieur et de la Recherche, sera le Grand Témoin de ce Meetup.</p>\n<p><strong>Stéphane Becker</strong>, Président d’Alsace Digitale, interviendra également pour parler de son expérience.</p>\n<p><em>Où ?</em> au <strong>Shadok</strong>, 25 presqu’île André Malraux 67100 Strasbourg</p>\n<p><em>Quand ?</em> <strong>Jeudi 24 novembre</strong> à partir de <strong>19h</strong></p>\n<p><strong>Inscrivez-vous dès maintenant</strong> sur l’Eventbrite : <a href=\"https://www.eventbrite.fr/e/billets-meetup-strasbourg-startups-12-29077975006\" rel=\"noopener\">https://www.eventbrite.fr/e/billets-meetup-strasbourg-startups-12-29077975006</a></p>\n<p>—</p>\n<p>Le Crédit Impôt Recherche est un dispositif du gouvernement pour aider les entreprises (sans restriction de taille ou de secteur) à développer leurs activités de recherche et de développement (R&amp;D). Pour les startups, le CIR est avant tout une aide à la prise de risque pour le développement de solutions innovantes, comme un produit, un programme ou un équipement qui va au-delà des techniques déjà existantes.</p>\n<p>Pour nous parler de ce sujet, nous recevrons Julien Gossa, maître de Conférences en informatique à l’Université de Strasbourg et expert CIR auprès du Ministère de l’Enseignement supérieur et de la Recherche, ainsi que de nombreuses Délégations régionales à la recherche et à la technologie (DRRT). Depuis 2010, il a réalisé plus de 150 expertises dans le cadre de contrôles fiscaux. Il nous présentera ce qu’est un CIR, mais également, les bonnes pratiques pour son obtention : « Établir un véritable programme de R&amp;D et devenir autonome sur le CIR”.</p>\n<p><em>Les Crédit d’Impôt en Faveur de la Recherche (CIR), Crédit d’Impôt Innovation (CII) et Jeunes Entreprises Innovantes (JEI) sont des dispositifs fiscaux dont l’ampleur est unique au monde. Ils permettent de supporter partiellement ou totalement les coûts de R&amp;D et d’innovation des PME. Mais quelles sont réellement les dépenses éligibles ? Quelle est la différence entre R&amp;D et Innovation ? Comment interpréter des textes parfois datés ou sibyllins dans le domaine du numérique ? Comment construire son dossier de justification et comment réagir en cas de contrôle ? Au delà de la présentation des dispositifs fiscaux, cette conférence propose d’expliquer comment devenir autonome dans leur déclaration, mais surtout saisir l’opportunité pour élaborer un véritable programme de R&amp;D visant à renforcer les compétences et capacité d’innovation de l’entreprise.</em></p>\n<p>Cette présentation sera suivie du témoignage d’une startup ayant pu bénéficier de ce dispositif et du traditionnel buffet de networking.</p>\n<p><em>Plus d’informations à suivre.</em></p>"
      legacy_cover: "/images/blog/meetup12.webp"
      status: "published"
      published_at: "2016-11-03"
