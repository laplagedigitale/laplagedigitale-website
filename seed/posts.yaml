  - key: "avril-2024"
    fields:
      title: "Avril 2024"
      slug: "avril-2024"
      excerpt: "Avril, mois de renaissance et de promesses printanières 🌹"
      body: "<p><strong>Avril, mois de renaissance et de promesses printanières 🌹</strong></p>\n<p><strong>Découvrez l’agenda du mois d’avril de la Plage Digitale 🗓</strong></p>\n<figure><img src=\"/images/blog/6602cc4e45015045f351305d.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Software Crafters Strasbourg – 03/04/2024 – De 18h30 à 21h30</strong></p>\n<p><strong>Mieux collaborer avec les testeurs grâce au Behavior Drive Development 🤩</strong></p>\n<p>L’adoption de l’Agilité par les organisations est de plus en plus prégnante dans notre société. Néanmoins, nous observons régulièrement qu’en matière de test, les pratiques évoluent peu (peu de collaboration entre testeurs et développeurs. Même lorsque les testeurs sont intégrés dans l’équipe, les tests sont effectués à la fin, etc.). Ceci engendre des goulots d’étranglement et impacte la capacité de l’équipe à délivrer dans l’itération.</p>\n<p>Au travers de cette présentation, nous souhaitons mettre en exergue comment la collaboration entre Développeur et Testeur peut ⤵️<br>– Aider à réduire le gaspillage<br>– Améliorer la qualité des livrables<br>– Accélérer la vitesse de mise en production<br>– Améliorer l’agilité</p>\n<p>19:00 — Accueil chaleureux<br>19:15 — Talk par Davy METANGMO et Edouard MANGEL<br>20:00 — Apéro offert !<br>20:15 — Discussions, échanges, coding pour celles et ceux qui souhaitent<br>21:30 — Au revoir émouvant</p>\n<p><a href=\"https://www.meetup.com/software-crafters-strasbourg/events/299677480/?utm_medium=referral&amp;utm_campaign=announceModal_savedevents_share_modal&amp;utm_source=linkedin\" rel=\"noopener\">Participer</a></p>\n<figure><img src=\"/images/blog/6602cc4f45015045f351305e.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Conférence INPI – 15/04/2024 – De 18h00 à 19h00</strong></p>\n<p><strong>Découvrir la Propriété Industrielle et en apprendre plus sur le rôle de l’INPI 🤩</strong></p>\n<p>Au programme ⤵️</p>\n<p>Qui n’a jamais entendu parler d’une marque ou d’un brevet ? A quoi cela sert-il ? Comment cela fonctionne-t-il ? Et les logiciels, comment peut-on les protéger ?</p>\n<p>L’INPI, la maison des innovateurs, est l’Institut National de la Propriété Industrielle 🧠</p>\n<p>👉🏼 Outre la délivrance des titres de propriété industrielle tels que les brevets, les marques et les dessins et modèles, l’INPI possède également une mission de sensibilisation et d’accompagnement.</p>\n<p>Venez découvrir la Propriété Industrielle et en apprendre plus sur le rôle de l’INPI lors de ce meet-up ! 🤩</p>\n<p><a href=\"https://tally.so/r/wa6jx9\" rel=\"noopener\">Rejoindre l’événement</a></p>\n<figure><img src=\"/images/blog/65b79a2ac456be11fe229293-1-1.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Les rendez-vous mensuels !</strong></p>\n<p><strong>Achen’ight – 12/04/2024 – 19h00-23h00 👾</strong></p>\n<p>Achen’ight, c’est une soirée par mois où se rassemble l’équipe d’Achencraft pour discuter, rencontrer, rigoler, concevoir, …. bref tout ce qui permet au projet Achencraft de progresser ! 🤩</p>\n<p><strong>Strasbourg Flutter Meetup Group – 02/04/2024 et 16/04/2024 – 18h30-20h30 🚀</strong></p>\n<p>Les participants échangent en anglais 🇬🇧 ou allemand 🇩🇪 !</p>\n<p>▹ Aborder des sujets liés à Flutter<br>▹ Présentation des résultats des deux dernières semaines, ainsi que prévision pour la prochaine itération<br>▹ Échange sur les actualités Flutter (par exemple, notes de version ou nouveaux produits autour de Flutter)</p>\n<p>▶️ Canal Discord (https://discord.gg/AMfvWZEM). Si vous ne pouvez pas participer sur place, n’hésitez pas à visiter la réunion virtuellement.</p>\n<p><strong>Hack SXB – 26/04/2024 – 18h00-23h00 🛠</strong></p>\n<p>Venez partager votre passion pour la création avec un groupe d’étudiants et professionnels !💡</p>\n<p>Présentez vos propres projets ou rejoignez des projets collectifs sur des sujets variés, parfois thématiques, lors de cette soirée de programmation et de bricolage 🛠</p>\n<p><a href=\"https://www.facebook.com/Achencraft\" rel=\"noopener\">Achencraft</a></p>\n<p><a href=\"https://www.meetup.com/fr-FR/strasbourg-flutter-meetup-group/events/297562393/\" rel=\"noopener\">Strasbourg Flutter<br>Meetup Group</a></p>\n<p><a href=\"https://www.facebook.com/HackSXB\" rel=\"noopener\">Hack SXB</a></p>\n<figure><img src=\"/images/blog/6602cd7a1d30f4095ec9a4d1.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>C’est arrivé le mois dernier … et près de chez vous !</strong></p>\n<p><strong>À la Plage Digitale, il s’en est passé des choses en mars :</strong></p>\n<p>👉🏼 1 permanence professionnelle, un meetup Deep Learning, un meetup Go, une journée internationale sans viande… ! 🤩</p>\n<p>Suivez-nous sur nos réseaux sociaux pour ne rien louper !</p>"
