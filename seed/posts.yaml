  - key: "vin-digital-les-initiatives-dici-et-dailleurs"
    fields:
      title: "Vin & digital : les initiatives d’ici et d’ailleurs"
      slug: "vin-digital-les-initiatives-dici-et-dailleurs"
      excerpt: "Le jeudi 9 mars, Strasbourg Startups a eu la chance d’être accueilli au CEEJA (Centre Européen d’Études Japonaises) pour une matinée co-organisé avec Epitech…"
      body: "<p><strong>Le jeudi 9 mars,  Strasbourg Startups a eu la chance d’être accueilli au CEEJA (Centre Européen d’Études Japonaises) pour une matinée co-organisé avec Epitech, dans le cadre du festival Bizz &amp; Buzz, autour du Vin et du Digital. Le but de cet événement était de mettre en lumière les initiatives participant au renouvellement de la production et de la consommation du vin en Alsace, ainsi que de partager d’autres expériences venues d’ailleurs… !</strong></p>\n<p>Huit participants ont présenté leur projet : le Syndicat Général des Vignerons de la Champagne, mais aussi des startups dans le domaine de la Wine Tech et une productrice de saké qui nous a honoré de sa présence, en direct du Japon. Un grand merci à Grand Est Numérique pour la mise en relation avec les startups de Lorraine.</p>\n<p>Pour les absents, voici une petite leçon de rattrapage :</p>\n<ul><li><strong>Wine Cluster (Strasbourg)</strong></li></ul>\n<p>Wine Cluster est une startup fondée par Arnaud Tarry et dont l’ambition est de réinventer le circuit de distribution du vin en revalorisant les vignerons. Son objectif est de développer des outils numériques pour leur permettre de suivre les tendances de ce marché et de se le réapproprier sans passer par des intermédiaires. Grâce à “Boxdevignerons”, la première étape est de fidéliser le consommateur auprès des vignerons indépendants, en recevant chaque mois une sélection de vins à domicile. Une application proposera également un système de gestion personnalisé de caves à vins.</p>\n<p>Arnaud Tarry</p>\n<p>contact@cluster.wine</p>\n<p><strong>→ <a href=\"https://cluster.wine/fr/\" rel=\"noopener\">https://cluster.wine/fr/</a></strong></p>\n<ul><li><strong>Wino (Nancy)</strong></li></ul>\n<p>Nans Thomas représentait Wino, une société créée à Paris et qui se développe aujourd’hui dans la région Grand-Est. Wino est une application permettant au consommateur de trouver rapidement un bon vin en adéquation avec ses envies. L’approche est avant tout ludique, par exemple : quel vin pour une soirée sushis entre amies ? Grâce à l’application, l’utilisateur définit ses attentes et l’application choisit, grâce à un algorithme, le meilleur vin dans sa base données, puis le géolocalise. Disponible uniquement sur iOS.</p>\n<p>Nans Thomas</p>\n<p><a href=\"mailto:hello@wino.fr\">hello@wino.fr</a></p>\n<p>→<strong> <a href=\"https://wino.fr/\" rel=\"noopener\">https://wino.fr/</a></strong></p>\n<ul><li><strong>Myrissi (Nancy)</strong></li></ul>\n<p>Muriel Jacquot, chercheuse et co-fondatrice de Myrissi, met son expertise scientifique autour des liens “odeurs – couleurs – émotions”. Les études réalisées en chimie, neuroscience et modélisation informatique leur ont permis de développer différentes solutions faisant le lien entre l’olfaction, les couleurs et l’état émotionnel du sujet. Leur démarche est d’augmenter la satisfaction du consommateur en adaptant l’environnement olfactif ou la coloration d’un produit. Grâce aux données récoltées, Myrissi a créé plusieurs outils dont une application ludique “My Cocktail Detective” qui permet de proposer une boisson, en fonction de l’état émotionnel du consommateur.</p>\n<p>Muriel Jacquot</p>\n<p><a href=\"mailto:contact@myrissi.fr\">contact@myrissi.fr</a></p>\n<p>→ <strong><a href=\"https://myrissi.fr/\" rel=\"noopener\">https://myrissi.fr/</a></strong></p>\n<ul><li><strong>Aero Vision (Ostwald)</strong></li></ul>\n<p>Arnaud Sohler a fondé Aero Vision, une société de diagnostic des vignes par imagerie aérienne à l’aide de drones. Grâce aux différentes caméras, il est possible de modéliser les sols et les parcelles jusqu’à l’ordre du mm, mais également de surveiller la structure de la vigne (hauteur des pieds, par exemple). En utilisant divers capteurs qui analysent les différents spectres lumineux il est possible de recueillir des informations sur la santé de la plante. Par exemple, une feuille stressée ne renverra pas les mêmes longueurs d’ondes qu’une feuille saine. Cela permettra, dans le futur, de repérer les maladies ou d’analyser les dégâts naturels.</p>\n<p>Arnaud Sohler</p>\n<p><a href=\"mailto:arnaud.sohler@aero-vision.fr\">arnaud.sohler@aero-vision.fr</a></p>\n<ul><li><strong>Strataggem (Strasbourg)</strong></li></ul>\n<p>Strataggem propose des systèmes d’infrastructures pour communiquer des informations récoltées par des capteurs (hygrométrie du sol, température d’une cave…) et les traiter. Le but est de pouvoir surveiller à distance les données critiques d’une installation et de les suivre en temps réel grâce à un système de communication radio. En parallèle de ce système de communication, il est également possible de récolter des informations très précises (de l’ordre du cm) sur la géolocalisation du capteur. Appliqué à la vigne, cela permet d’avoir un suivi hygrométrique du sol et également, de suivre les variations de diamètre des pieds de vigne.</p>\n<p>Manuel Yguel</p>\n<p><a href=\"mailto:contact@strataggem.com\">contact@strataggem.com</a></p>\n<p>→ <strong><a href=\"https://www.strataggem.com/\" rel=\"noopener\">https://www.strataggem.com/</a></strong></p>\n<ul><li><strong>Sommelier Particulier (Paris)</strong></li></ul>\n<p>Mathieu Lasne-Villoing, avec Sommelier Particulier, a envie de démystifier l’image du sommelier. Le sommelier n’est pas juste celui qui ouvre la bouteille de vin au restaurant : c’est avant tout une personne de terrain, qui connaît les vignerons et qui possède une grande expérience et convivialité. Sommelier Particulier est une plateforme de conseil conversationnelle. Elle permet aux consommateurs de profiter des conseils de ces sommeliers passionnés, en étant directement en contact avec l’un d’eux par téléphone. Grâce à cette conversation, le sommelier va établir une sélection de vins spécialement pensée selon les goûts et les envies du consommateur avec lequel il aura discuté.</p>\n<p>Mathieu Lasne-Villoing</p>\n<p><a href=\"mailto:contact@sommelierparticulier.com\">contact@sommelierparticulier.com</a></p>\n<p>→ <strong><a href=\"http://sommelierparticulier.com\" rel=\"noopener\">http://sommelierparticulier.com</a>/</strong></p>\n<ul><li><strong>Syndicat des Vignerons de Champagne et leur coiffe “Cloé” (Reims)</strong></li></ul>\n<p>Éric Lamaille et Typhen Ferry étaient présents pour présenter le projet “Cloé”. Ce projet est né suite à des vols de coiffes de bouteilles de Champagne qui étaient ensuite utilisées pour vendre des contrefaçons. “Cloé” est une coiffe intelligente dotée d’un Datamatrix unitaire permettant d’assurer la traçabilité et l’authentification de la bouteille. Elle est munie de deux QR codes : un sur sa partie visible et un l’intérieur de la languette, ainsi que d’un numéro de sécurité et d’une signature numérique. La coiffe Cloé existe dans 2 modèles, un standard et un modèle premium.</p>\n<p>Typhen Ferry et Éric Lamaille</p>\n<p><a href=\"mailto:tferry@sgv-champagne.fr\">tferry@sgv-champagne.fr</a></p>\n<p><strong>→ <a href=\"http://cloe.sgv-champagne.com\" rel=\"noopener\">http://cloe.sgv-champagne.com</a></strong></p>\n<ul><li><strong>Asako Watanabe, brasseuse de saké (Gifu, Japon)</strong></li></ul>\n<p>En direct du Japon, Asako Watanabe nous a raconté son expérience en matière de production de saké. Dans les années 1900, les femmes n’avaient pas le droit de pénétrer dans les brasserie de saké. Bien qu’elles soient aujourd’hui autorisées à travailler dans ce domaine, elles sont peu nombreuses à en diriger la production. Asako Watanabe est la seule femme à être maître de production (“Toji”) dans la région de Gifu, réputée pour la pureté de son eau. Le saké est produit à partir de l’amidon de riz transformé en sucre par un procédé de fermentation. Sa qualité dépend intégralement du savoir-savoir du “Toji”. La brasserie Watanabe est très réputée depuis 1903 et Asako Watanabe y produit un saké nommé “Blanche Neige”.</p>\n<p><strong>→ <a href=\"http://www.minonishiki.com/\" rel=\"noopener\">http://www.minonishiki.com/</a></strong></p>"
