  - key: "nos-10-livres-coup-de-coeur-a-offrir-a-un-apprenti-entrepreneur-pour-noel-2018"
    fields:
      title: "Nos 10 livres coup de cœur à offrir à un apprenti entrepreneur pour Noël 2018"
      slug: "nos-10-livres-coup-de-coeur-a-offrir-a-un-apprenti-entrepreneur-pour-noel-2018"
      excerpt: "A J-20 du déballage des cadeaux, au sein de la capitale de Noël, on s’active afin que nos apprentis entrepreneurs soient gâtés. Pour ce faire Strasbourg…"
      body: "<p>A J-20 du déballage des cadeaux, au sein de la <strong>capitale de Noël</strong>, on s’active afin que nos apprentis entrepreneurs soient gâtés. Pour ce faire Strasbourg Startups vous soumets une liste de ses 10 livres coups de cœur sur l’entreprenariat.<br>\nD’ailleurs, lors du Start-up Week-End 2018, ces 10 livres ont été offert par Clément Schneider Co-fondateur d’AR24, la startup qui dépoussière le courrier recommandé d’antan, au 2 -ème prix, obtenu par Frippy.</p>\n<p>Voici notre sélection :</p>\n<p>1- <em>The Lean Startup : How Constant Innovation Creates Radically Successful Businesses</em> (Eric Ries) : Ce chef d’œuvre vous dit tout sur le Lean Startup, cette nouvelle approche des affaires qui est en train d’être adoptée dans le monde entier.</p>\n<p>2- <em>The Hard Thing About Hard Things: Building a Business When There Are No Easy Answers</em> (Ben Horowitz) : Ben Horowitz, un des entrepreneurs les plus respectés et les plus expérimentés de la Silicon Valley, offre des conseils essentiels sur la création et la gestion de startups.</p>\n<p>3- <em>Business Model Generation: A Handbook for Visionaries, Game Changers, and Challengers</em> (<a href=\"https://www.google.fr/search?q=Alex+Osterwalder&amp;stick=H4sIAAAAAAAAAOPgE-LRT9c3NEoqLkwrybNU4tLP1TeIr0opSivWkslOttJPys_P1i8vyiwpSc2LL88vyrZKLC3JyC8CAGEhClE6AAAA&amp;sa=X&amp;ved=2ahUKEwiChr3gwYbfAhUDUBoKHU11BHQQmxMoATAPegQIBxAH\" rel=\"noopener\">Alex Osterwalder</a>, <a href=\"https://www.google.fr/search?q=Yves+Pigneur&amp;stick=H4sIAAAAAAAAAOPgE-LRT9c3NEoqLkwrybNU4tbP1TcwNE4xLUwz05LJTrbST8rPz9YvL8osKUnNiy_PL8q2SiwtycgvAgCtA16DOwAAAA&amp;sa=X&amp;ved=2ahUKEwiChr3gwYbfAhUDUBoKHU11BHQQmxMoAjAPegQIBxAI\" rel=\"noopener\">Yves Pigneur</a>) : Business Model Generation est un manuel pour les visionnaires, les changeurs de jeu et les challengers qui s’efforcent de défier les modèles d’affaires démodés et de concevoir les entreprises de demain.</p>\n<p>4- <em>Zero to One: Notes on Start Ups, or How to Build the Future</em> (Peter Thiel) : Zero to One est le premier livre que tout entrepreneur en activité ou en herbe doit lire – point final.</p>\n<p>5-<em> Traction: How Any Startup Can Achieve Rapid Customer Growth</em> (Gabriel Weinberg) : Fondé sur des entrevues avec plus de 40 fondateurs d’entreprises dont Paul English (Kayak), Jimmy Wales (Wikipedia),  » Traction  » a de quoi vous apprendre.</p>\n<p>6- <em>Hooked: How to Build Habit-Forming Products (Nir Eyal)</em> : Hooked s’adresse aux fondateurs de startup et à tous ceux qui cherchent à comprendre comment les produits influencent notre comportement.</p>\n<p>7- Growth Hacker Marketing: A Primer on the Future of PR, Marketing, and Advertising (Ryan Holiday) : Les mégabrands comme Facebook, Dropbox, n’ont pas dépensé un sou en marketing traditionnel. Pas de communiqués de presse, pas de publicités télévisées. Ils s’appuient sur une nouvelle stratégie le growth hacking – pour atteindre beaucoup plus de gens malgré des budgets de marketing modestes.</p>\n<p>8-<em> Who: The A Method for Hiring</em> (<a href=\"https://www.google.fr/search?q=geoff+smart&amp;stick=H4sIAAAAAAAAAOPgE-LSz9U3MK0sN80yUQKzzUzjczLKtWSyk630k_Lzs_XLizJLSlLz4svzi7KtEktLMvKLAOjiefY4AAAA&amp;sa=X&amp;ved=2ahUKEwj12YSHuIbfAhUOxxoKHVPtAYcQmxMoATASegQIBhAH\" rel=\"noopener\">Geoff Smart</a>, <a href=\"https://www.google.fr/search?q=who:+the+a+method+for+hiring+randy+street&amp;stick=H4sIAAAAAAAAAOPgE-LSz9U3MK0sN80yUUKwk7RkspOt9JPy87P1y4syS0pS8-LL84uyrRJLSzLyiwApGwAxOAAAAA&amp;sa=X&amp;ved=2ahUKEwj12YSHuIbfAhUOxxoKHVPtAYcQmxMoAjASegQIBhAI\" rel=\"noopener\">Randy Street</a>) : vous découvrirez quels sont les secrets pour réussir à embaucher les meilleures recrues.</p>\n<p>9- <em>Storytelling et marketing : tous les marketeurs racontent des histoires</em> (Seth Godin) : Le marketing est un outil puissant .Ce livre détaille le concept et montre comment le mettre en pratique. Il intéressera tous ceux qui veulent comprendre comment les marketeurs font pour convaincre.</p>\n<p>10- <em><a href=\"https://fr.wikipedia.org/wiki/Uncle_Scrooge\" rel=\"noopener\">Uncle Scrooge</a></em> (Carl Barks) : Picsou a réussi à créer une entreprise sans argent et vous ?</p>\n<p>A vos papiers cadeaux !</p>"
