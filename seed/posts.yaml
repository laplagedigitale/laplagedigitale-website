      slug: "cet-ete-je-travaille-a-la-plage"
      excerpt: "Essayez l’espace de coworking pendant 5 jours gratuitement Besoin d’un espace au calme avec imprimante, wifi et café, d’un espace stimulant, permettant de se…"
      body: "<p><img src=\"/images/blog/la-plage-cet-ete.webp\" alt=\"La Plage cet ete\" loading=\"lazy\"></p>\n<p>Essayez l’espace de coworking pendant 5 jours gratuitement</p>\n<p>Besoin d’un espace au calme avec imprimante, wifi et café,</p>\n<p> d’un espace stimulant, permettant de se concentrer,</p>\n<p> d’un espace convivial où rencontrer des personnes aux projets multiples</p>\n<p>La Plage Digitale vous ouvre ses portes cet été.</p>\n<p>Profitez de 5 jours d’essai pour vous rafraîchir les idées et booster vos projets.</p>\n<p>Deux plages au choix : La Plage Digitale Rivétoile et la Plage Digitale du Shadok.</p>\n<p>Cette offre est proposée à tous : free-lance, étudiants, télétravailleurs, entrepreneurs…</p>\n<p>Un véritable espace de travail avec un environnement agréable, cinéma, bar, médiathèque sur la Presqu’île Malraux.</p>\n<p><a href=\"http://goo.gl/forms/TrHJnHBG4K\" rel=\"noopener\">Lien pour profitez de cette offre !</a></p>\n<p>Sur inscription préalable dans la limite des places Flex disponibles</p>"
