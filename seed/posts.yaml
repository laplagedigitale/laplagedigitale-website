      excerpt: "07 et 08 mai / Hall Rhenus Strasbourg Alsace Digitale sera présente au Digital Game’ Manga Show ! Les curieux pourront s’initier à la robotique, découvrir le…"
      body: "<p>07 et 08 mai / Hall Rhenus Strasbourg</p>\n<blockquote><p>Alsace Digitale sera présente au Digital Game’ Manga Show !</p><p>Les curieux pourront s’initier à la robotique, découvrir le Coding Club et tester des jeux inédits développés dans le cadre des Game Jam organisées par l’association…</p><p>Le robot Thymio vous aidera à tester vos aptitude à la programmation. Les jeux de la Game Jam illustreront toute la créativité, la multiplicité de compétences et la technicité nécessaires à la réalisation d’un jeu. Suivez le processus de l’autre côté de la manette.</p></blockquote>\n<p><a href=\"http://digital-and-gameshow.com/#/home\" rel=\"noopener\">http://digital-and-gameshow.com/#/home</a><img src=\"/images/blog/logo-dgs201682.webp\" alt=\"logo_dgs201682\" loading=\"lazy\"></p>"
