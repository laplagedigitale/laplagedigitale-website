  - key: "demo-night-10"
    fields:
      title: "Demo Night #10"
      slug: "demo-night-10"
      excerpt: "Strasbourg Startups organise la 10e édition de la Demo Night, jeudi 22 septembre 2016 à 18h30 au Centre de Culture Numérique. Les Demo Night sont l’occasion…"
      body: "<p>Strasbourg Start<img src=\"/images/blog/demonight10-big.webp\" alt=\"DemoNight10_Big\" loading=\"lazy\">ups organise la 10e édition de la Demo Night,  jeudi 22 septembre 2016 à 18h30 au Centre de Culture Numérique.</p>\n<p>Les Demo Night sont l’occasion de s’ouvrir à la création en entreprise. La ligne directrice est de faire connaître les startups alsaciennes. Chaque entrepreneur dispose de 5 minutes pour présenter à la communauté son projet. Pour ce faire, uniquement de la démo ! Du show sans blabla ! À l’issue de la soirée, les membres de la communauté votent pour ou contre l’entrée de chaque startup dans le groupe.</p>\n<p>Lineup en construction</p>\n<p>Cette 10e édition de la Demo Night sera organisée en collaboration avec les Apéros du Management, qui à pour objectif de promouvoir l’esprit d’entreprise en Alsace.</p>\n<p>Le Centre de Culture Numérique (CCN) se situe au rez-de-chaussé du bâtiment Atrium, 16, rue René Descartes.</p>\n<p>Pré-inscriptions par <a href=\"https://www.eventbrite.fr/e/billets-demonight-10-27306525553\" rel=\"noopener\">ICI</a>.</p>"
      legacy_cover: "/images/blog/demonight10-big.webp"
      status: "published"
      published_at: "2016-08-26"
      categories: ["actualites", "evenements"]
      legacy_path: "/demo-night-10/"
      created_at: "2016-08-26T16:01:10Z"
  - key: "1-journee-1-entrepreneur-1-etudiant-1-tag-mit-dem-chef"
    fields:
      title: "1 Journée, 1 Entrepreneur, 1 Étudiant / 1 Tag mit dem Chef"
      slug: "1-journee-1-entrepreneur-1-etudiant-1-tag-mit-dem-chef"
      excerpt: "« 1 Journée, 1 Entrepreneur, 1 Etudiant » / « 1 Tag mit dem Chef » lance sa 6ème édition du 3 Octobre au 18 Novembre 2016. Cet événement propose aux étudiants…"
      body: "<p>« 1 Journée, 1 Entrepreneur, 1 Etudiant » / « 1 Tag mit dem Chef » lance sa 6ème édition du 3 Octobre au 18 Novembre 2016.</p>\n<p>Cet événement propose aux étudiants et entrepreneurs de part et d’autre du Rhin de se rencontrer. Les étudiants badois ou alsaciens pourront passer une journée avec des entrepreneurs français ou allemands.</p>\n<p>Cette journée donnera l’occasion aux étudiants de découvrir le monde du travail de part et d’autre du Rhin, de partager le quotidien d’un professionnel et de préciser leur propre projet professionnel. Quant aux entrepreneurs, cette journée leur donnera l’occasion de transmettre le goût d’entreprendre aux jeunes générations, mais aussi de faire découvrir et rendre accessible l’entrepreneuriat de part et d’autre du Rhin.</p>\n<p>Cet événement se démarque par ses partenariats avec des institutions historiques franco-allemandes. Depuis le succès de la première édition en 2011, le bureau EY région Est, continue d’organiser l’événement dans le cadre de la Semaine de l’Entrepreneur Européen à l’échelle de l’Eurodistrict Strasbourg-Ortenau, de l’Alsace et du Pays de Bade.</p>\n<p>Vous pouvez télécharger le formulaire de candidature ICI (étudiants + entrepreneurs).</p>"
      legacy_cover: "/images/blog/ey.webp"
      status: "published"
      published_at: "2016-09-06"
      categories: ["actualites"]
      legacy_path: "/1-journee-1-entrepreneur-1-etudiant-1-tag-mit-dem-chef/"
      created_at: "2016-09-06T15:17:00Z"
  - key: "reactjs-strasbourg-revient"
    fields:
      title: "ReactJS Strasbourg revient !"
      slug: "reactjs-strasbourg-revient"
      excerpt: "Après près d’un an de stand-by ReactJS Strasbourg revient pour un nouveau meetup ! Cet événement aura lieu lundi 19 septembre 2016, à partir de 19h, à La…"
      body: "<p>Après près d’un an de stand-by ReactJS Strasbourg revient pour un nouveau meetup ! Cet événement aura lieu lundi 19 septembre 2016, à partir de 19h, à La Plage Rivétoile.</p>\n<p>ReactJS est une bibliothèque JavaScript, qui a pour objectif de rendre plus souple la création d’application web monopage. Cette bibliothèque est développée par Facebook depuis 2013 et est disponible sous licence libre.</p>\n<p>Les meetups organisés par ReactJS Strasbourg proposent plusieurs sujets afin de rassembler les férus d’informatique et de code : techniques de développement, architecture d’application, construction de composants, ou encore tooling.</p>\n<p>La soirée du 19 septembre propose :</p>\n<ul><li>Présentation de ReactJS : la librairie JavaScript à la mode pour vos UI par Sven</li><li>Présentation de la plateforme freecodecamp.com par Cédric</li></ul>\n<p>Les présentations seront suivies d’un tour de table de questions ainsi que d’un apéro.</p>\n<p>Inscription et infos <a href=\"https://www.meetup.com/fr-FR/StrasbourgJS/events/233589042/\" rel=\"noopener\">ICI</a>.</p>"
      legacy_cover: "/images/blog/reactjs-strasbourg-petit.webp"
      status: "published"
      published_at: "2016-09-13"
      categories: ["actualites"]
      legacy_path: "/reactjs-strasbourg-revient/"
      created_at: "2016-09-13T09:56:32Z"
  - key: "meetup-vim-strasbourg-2"
    fields:
      title: "Meetup Vim Strasbourg #2 !"
      slug: "meetup-vim-strasbourg-2"
      excerpt: "Pour son 2nd meetup, Vim Strasbourg revient le mercredi 21 septembre 2016, à 19h, à La Plage Rivétoile. Vim est un logiciel, qui permet de traiter des…"
      body: "<p>Pour son 2nd meetup, Vim Strasbourg revient le mercredi 21 septembre 2016, à 19h, à La Plage Rivétoile.</p>\n<p>Vim est un logiciel, qui permet de traiter des fichiers texte. Cet éditeur est personnalisable presque sans limite et malgré le nombre élevé de fonctionnalités son temps de démarrage reste court. Depuis sa sortie en 1991, il n’a pas cessé d’être amélioré et est disponible sous licence libre.</p>\n<p>Les meetups organisés par Vim Strasbourg ont pour objectif de proposer des présentations diverses sur : un outil en ligne de commande, votre propre configuration Vim, un plugin Vim ou encore un logiciel inspiré de Vim.</p>\n<p>La soirée du 21 septembre propose :</p>\n<ul><li>Présentation de Mutt par Thomas</li><li>Présentation du plugin Surround.vim</li></ul>\n<p>Les présentations seront suivies d’un tour de table de questions ainsi que d’un apéro. Un petit Vimgolf aura aussi éventuellement lieu si le temps imparti le permet.</p>\n<p>Inscriptions et infos <a href=\"https://www.meetup.com/fr-FR/Vim-Strasbourg/events/233588785/\" rel=\"noopener\">ICI</a>.</p>"
      legacy_cover: "/images/blog/vim-strasbourg-petit.webp"
      status: "published"
      published_at: "2016-09-13"
      categories: ["actualites"]
      legacy_path: "/meetup-vim-strasbourg-2/"
      created_at: "2016-09-13T10:00:21Z"
  - key: "conferences-inspirantes-ouvertes-a-tous"
    fields:
      title: "Conférences inspirantes ouvertes à tous !"
      slug: "conferences-inspirantes-ouvertes-a-tous"
      excerpt: "Ne ratez pas, les deux conférences organisées lors de la deuxième édition du Hacking Industry Camp. Elles auront lieu le samedi 15 octobre et sont gratuites…"
      body: "<p>Ne ratez pas, les deux conférences organisées lors de la deuxième édition du Hacking Industry Camp. Elles auront lieu le <strong>samedi 15 octobre</strong> et sont <strong>gratuites</strong> et <strong>ouvertes au public</strong>, il suffit de vous inscrire !</p>\n<h2><strong>Industrie 4.0 : une utopie allemande ?</strong></h2>\n<p><img src=\"/images/blog/keynote-industrie4-0.webp\" alt=\"keynote-industrie4-0\" loading=\"lazy\">Dès l’origine, Industrie 4.0 se présente comme un rêve technologique : une application de l’internet des objets au monde des biens d’équipement. Le projet Industrie 4.0 vise ni plus ni moins à dessiner les contours d’une 4ème révolution industrielle portée par la vision d’une mise en réseau de tous les éléments du processus de production pour construire l’usine ultra-connectée du futur, baptisée integrated industry, smart factory ou encore digital factory.</p>\n<p>À travers ses expériences, Jean-Daniel Weisz, associé du cabinet Kohler C&amp;C, propose des clés pour comprendre comment l’État et les industries allemandes s’adaptent à la numérisation des processus industriels. En constatant que le changement fait aujourd’hui partie intégrante de la dynamique d’entreprise, celui-ci n’est plus perçu comme une phase d’incertitude, mais est conçu comme un avantage compétitif qui crée de la valeur. En France sommes-nous prêts à de telles modifications ? Pouvons-nous saisir cette opportunité de différenciation conjointement avec nos voisins d’Outre-Rhin ?<br>\nLe cabinet Kohler C&amp;C, experts en stratégie de transformation et en développement des organisations et auteur de l’ouvrage éponyme, a notamment collaboré avec la BPI sur le rapport « Industrie 4.0 : quelles stratégies numériques ? La numérisation de l’industrie dans les entreprises du Mittelstand allemand ».</p>\n<p>Présentée par Jean-Daniel Weisz, associé du <a href=\"http://kohler-cc.com/industrie-4-0/\" rel=\"noopener\">Cabinet Kohler C&amp;C</a>.</p>\n<p>Conférence suivie d’une collation, organisée en partenariat avec <a href=\"http://adira.com/\" rel=\"noopener\">ADIRA</a>.</p>\n<p><strong>INSCRIPTION GRATUITE <a href=\"https://www.eventbrite.fr/e/billets-conference-1-hacking-industry-camp-lindustrie-40-une-utopie-allemande-27727464593\" rel=\"noopener\">ICI</a>.</strong></p>\n<h2><strong>Oser innover !<br>\n</strong></h2>\n<p><img src=\"/images/blog/keynote-oser-innover.webp\" alt=\"keynote-oser-innover\" loading=\"lazy\">« Comment jauger une idée, comment s’en emparer, comment trouver les bons soutiens, la bonne structuration… », voilà la ligne directrice de ce passionné de sciences et d’informatiques devenu entrepreneur.</p>\n<p>Après avoir occupé plusieurs postes aux diverses responsabilités dans de grandes entreprises et avoir créer sa propre entreprise, il entre en 2014 à l’Inria, établissement de recherche dédié aux sciences du numérique. Il y exercera en tant que chargé des partenariats et de la propriété intellectuelle jusqu’à récemment. Suite à la campagne « Horizon Start-up » de 2015, organisée par l’Inria et qui avait pour objectif d’attirer l’attention des chercheurs vers la création d’entreprise, Arnaud Laprévote décide lui aussi de se lancer dans l’aventure entrepreneuriale en créant début 2016, Lybero.net. Ce système innovant qui permet de protéger des données par une technologie de chiffrement contenant une clé de recouvrement à seuil, sonnera peut-être le glas de la cybercriminalité.</p>\n<p>Présentée par Arnaud Laprévote, Fondateur de <a href=\"http://lybero.net/\" rel=\"noopener\">Lybero.net</a>.</p>\n<p>Conférence suivie d’une collation, organisée en partenariat avec <a href=\"http://alsace.cci.fr/\" rel=\"noopener\">CCI Alsace</a>.</p>\n<p><strong>INSCRIPTION GRATUITE <a href=\"https://www.eventbrite.fr/e/billets-conference-2-hacking-industry-camp-oser-innover-27727494683\" rel=\"noopener\">ICI</a>.</strong></p>"
      legacy_cover: "/images/blog/hic-logo-28.webp"
      status: "published"
      published_at: "2016-09-21"
      categories: ["actualites"]
      legacy_path: "/conferences-inspirantes-ouvertes-a-tous/"
      created_at: "2016-09-21T13:39:40Z"
  - key: "lancement-mulhouse-startups-mercredi-20-octobre-2016"
    fields:
      title: "Lancement Mulhouse Startups"
      slug: "lancement-mulhouse-startups-mercredi-20-octobre-2016"
      excerpt: "Save the date : Mulhouse Startups organise un premier meetup à l’occasion de son lancement ! Quand ça ? mercredi 20 octobre à 19h Où ça ? dans les locaux de…"
      body: "<p><img src=\"/images/blog/mulhouse-startup-1.webp\" alt=\"mulhouse_startup-1\" loading=\"lazy\"></p>\n<p>Save the date : <a href=\"http://mulhouse-startups.com/\" rel=\"noopener\">Mulhouse Startups</a> organise un premier meetup à l’occasion de son lancement !</p>\n<p><em>Quand ça ?</em> <strong>mercredi 20 octobre à 19h<br>\n</strong><em>Où ça ?</em> dans les locaux de <strong>KM0, 5 Rue Jules Ehrmann, 68100 Mulhouse</strong></p>\n<p>Cette soirée a un double objectif : présenter le groupe Mulhouse Startups et faire découvrir deux startups déjà membres.</p>\n<ul><li><a href=\"https://www.mummyz.fr/\" rel=\"noopener\">Mummyz</a> : également membre de Strasbourg Startups, Mummyz est une plateforme “anti-gaspi” permettant de partager les parts supplémentaires d’un plat.</li><li><a href=\"https://givenjoy.fr/\" rel=\"noopener\">Give’n’Joy</a> : ancien lauréat du Startups Weekend Mulhouse 2015, Give’n’Joy est une application mobile qui, sur le modèle des “cafés suspendus”, permet de faire un don à un restaurant qui sera reversé aux personnes dans le besoin se rendant dans ce même restaurant.</li></ul>\n<p>Pour participer à la soirée, <strong>réservez vos billets ici</strong> : <a href=\"https://www.eventbrite.fr/e/billets-mulhouse-startups-meetup-0-lancement-28189846590\" rel=\"noopener\">https://www.eventbrite.fr/e/billets-mulhouse-startups-meetup-0-lancement-28189846590</a></p>\n<p>Toute l’actualité : <a href=\"http://mulhouse-startups.com/\" rel=\"noopener\">http://mulhouse-startups.com/<br>\n</a>Retrouvez également Mulhouse Startups sur Facebook : <a href=\"https://www.facebook.com/MulhouseStartups/\" rel=\"noopener\">https://www.facebook.com/MulhouseStartups/</a></p>"
      legacy_cover: "/images/blog/mulhouse-startup-1.webp"
      status: "published"
