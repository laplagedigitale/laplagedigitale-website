  - key: "hacking-business-workshop-2-peaufiner-son-business-plan"
    fields:
      title: "Hacking Business Workshop #2 : Peaufiner son business plan"
      slug: "hacking-business-workshop-2-peaufiner-son-business-plan"
      excerpt: "Vous avez une idée de startup? Vous avez encore des détails du business plan à peaufiner? Des questions sur la création du business plan à 5 ans? Le Hacking…"
      body: "<p><strong>Vous avez une idée de startup? Vous avez encore des détails du business plan à peaufiner? Des questions sur la création du business plan à 5 ans? Le Hacking Business Workshop est fait pour vous ! Co-organisé par Alsace Business Angel et Alsace Digitale, il se tiendra le mardi 13 décembre à La Plage Digitale.</strong></p>\n<p>Entreprendre est un parcours long et souvent tortueux. Il est alors nécessaire de bien s’organiser, notamment à l’aide d’un business plan solide. Lors de ce Workshop, venez trouvez des réponses à vos interrogations dans une atmosphère conviviale où <strong>chacun pourra avancer sur la structuration business de son projet.</strong></p>\n<p><strong>Au programme de ce Workshop :</strong><br>– pourquoi faire un business plan?<br>– présentation du business plan FISY : <a href=\"http://l.facebook.com/l.php?u=http%3A%2F%2Fwww.fisy.fr%2F&amp;h=HAQGOnJef&amp;enc=AZPBrxyCwBp4JOk7qA8Ih_ShvTszRWhGINnJVaC3CbC36gHpUnmXBU0JTLZ1DsbhSSg&amp;s=1\" rel=\"noopener\">http://www.fisy.fr/</a><br>– comment incorporer son business model dans Fisy</p>\n<p>L’idée est de faire circuler les bonnes pratiques business dans l’écosystème startups de Strasbourg avec une approche #nobullshit.</p>\n<p><strong>Attention</strong>, il faudra avoir un ordinateur portable avec Excel (compatibilité Open Office à tester). Il est possible de bénéficier d’un portable de prêt sur demande (contacter <a href=\"https://www.facebook.com/sebastien.derivaux\" rel=\"noopener\">Sébastien Derivaux</a> en MP).</p>\n<p>Pensez à vous inscrire <strong><a href=\"https://www.weezevent.com/hacking-business-2-business-plan\" rel=\"noopener\">ICI</a></strong>, l’événement est gratuit !</p>\n<p><strong>Y aller</strong> : Mardi 13 décembre de 10h à 13h – La Plage Digitale – 15 Avenue du Rhin, 67100 Strasbourg</p>\n<p><strong><a href=\"https://www.facebook.com/groups/1790804594527230/\" rel=\"noopener\">Rejoindre la communauté Hacking Business.</a></strong></p>"
