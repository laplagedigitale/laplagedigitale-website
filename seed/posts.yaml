  - key: "meetup15-starting-up-feeling-down-la-psychopathologie-de-lentrepreneur"
    fields:
      title: "MEETUP#15 : Starting Up & Feeling Down, la psychopathologie de l’entrepreneur."
      slug: "meetup15-starting-up-feeling-down-la-psychopathologie-de-lentrepreneur"
      excerpt: "Notre prochain rendez-vous de la communauté des entrepreneurs strasbourgeois traitera la notion de charge mentale. Ce sujet déjà évoqué dans les années 60…"
      body: "<p><strong>Notre prochain rendez-vous de la communauté des entrepreneurs strasbourgeois traitera la notion de charge mentale.</strong></p>\n<p>Ce sujet déjà évoqué dans les années 60 résonne de façon prononcée aujourd’hui dans la vie active et dans le domaine tout particulièrement du numérique et de l’entrepreneuriat ou la séparation vie privée, vie professionnelle s’amincit.</p>\n<p>En effet, autant dans notre vie personnelle que professionnelle nous rencontrons des tâches multiples à effectuer de plus en plus rapidement, nous le savons tous le critère de rentabilité aussi bien économique qu’horaire ou encore social est de plus en plus exigeant. Les systèmes organisationnels demandent une grande réactivité, productivité et compétitivité avec comme conséquence éventuelle une surcharge mentale. L’évolution inquiétante de certaines méthodes contribuent à mettre en évidence les effets délétères de nouvelles organisations qui, paradoxalement, prônent l’autonomie et la responsabilité individuelle, sans en fournir la formation ni les moyens, ce qui est ressenti comme un facteur majeur d’agression psychologique : sentiment d’inefficacité, d’incompétence, perte de l’estime de soi, doute de la valeur de son travail.</p>\n<p><strong>Au final, le nombre de dépression ne serait-il pas un des secrets les mieux gardés de la planète startup ?</strong></p>\n<p>Nous avons invité le docteur Frédéric GRABLI afin qu’il puisse nous aider à comprendre et aussi à mieux appréhender ce phénomène qui nous touche tous. Ce spécialiste en santé mentale prévient et diagnostique depuis déjà plusieurs années des souffrances psychiques et des maladies mentales qui peuvent être liées. Jean-Christophe GAY témoignera également de son ressenti d’entrepreneur.</p>\n<p>Vous pourrez également à la fin de cette rencontre poser directement vos questions et échanger avec le docteur sur le sujet.</p>\n<p><a href=\"https://yourstory.com/2015/01/startup-depression/\" rel=\"noopener\">Petit lien en anglais sur le sujet de la dépression</a></p>\n<p><strong>Renseignements et inscriptions :</strong></p>\n<p><a href=\"https://www.eventbrite.fr/e/billets-meetup15-starting-up-felling-down-la-psychopathologie-de-lentrepreneur-avec-le-docteur-frederic-38387868147\" rel=\"noopener\">Inscription gratuite ici </a></p>\n<p><strong>Où :</strong> au Shadok, 25 Presqu’île André Malraux 67100 STRASBOURG</p>\n<p><strong>Page Facebook :</strong> <a href=\"https://www.facebook.com/alsace.digitale/\" rel=\"noopener\">https://www.facebook.com/alsace.digitale/</a></p>\n<p><strong>Prochain Meetup :</strong></p>\n<p><strong>Plus d’infos sur Strasbourg Startups :</strong> <a href=\"http://www.strasbourg-startups.com/\" rel=\"noopener\">http://www.strasbourg-startups.com/</a></p>"
      legacy_cover: "/images/blog/meetup15lachargem.webp"
