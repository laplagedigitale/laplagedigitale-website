      title: "Permanences de l’INPI"
      slug: "permanences-de-linpi"
      excerpt: "Vous avez des questions sur la propriété industrielle ? Nous vous rappelons que l’Institut National de la Propriété Industrielle assure des permanences à La…"
      body: "<p><img src=\"/images/blog/inpi-1200pxl.webp\" alt=\"\" loading=\"lazy\"></p>\n<p>Vous avez des questions sur la propriété industrielle ? Nous vous rappelons que l’<strong>Institut National de la Propriété Industrielle</strong> assure des permanences à La Plage Digitale une fois par mois. Des créneaux d’une heure sont disponibles, dans notre Petite Salle de réunion.</p>\n<p>Pour réserver un créneau, il vous suffit de vous <strong>inscrire sur le Doodle</strong> :</p>\n<ul><li><a href=\"https://doodle.com/poll/97usuu4gygd99dem\" rel=\"noopener\">Vendredi 12 Janvier 2018</a> : 9h-13h</li><li><a href=\"https://doodle.com/poll/hbyidavtrpivsuuv\" rel=\"noopener\">Vendredi 2 Février 2018</a> : 9h-13h</li><li><a href=\"https://doodle.com/poll/ekh4sbdf3sqxf2p7\" rel=\"noopener\">Vendredi 2 Mars 2018</a> : 9h-13h</li><li><a href=\"https://doodle.com/poll/eq46griehkxmhqa5\" rel=\"noopener\">Vendredi 6 Avril 2018</a> : 9h-13h</li><li><a href=\"https://doodle.com/poll/grc97tsizr75q3vs\" rel=\"noopener\">Vendredi 4 Mai 2018</a> : 9h-13h</li><li><a href=\"https://doodle.com/poll/wytkgrkx249sphz5\" rel=\"noopener\">Vendredi 1er Juin 2018</a> : 9h-13h</li></ul>\n<p><em>L’INPI est un établissement public autofinancé et placé sous la tutelle du ministère chargé de la Propriété Industrielle. Il participe activement à l’élaboration et la mise en œuvre des politiques publiques dans le domaine de la propriété intellectuelle, de soutien à l’innovation et à la compétitivité des entreprises et dans la lutte anti-contrefaçon.</em></p>\n<p><a href=\"https://www.inpi.fr/fr\" rel=\"noopener\">Site Internet de l’INPI</a></p>"
