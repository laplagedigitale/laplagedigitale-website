  - key: "edgefest-approche-a-grands-pas"
    fields:
      title: "? EdgeFest approche à grands pas !"
      slug: "edgefest-approche-a-grands-pas"
      excerpt: "Vous l’attendiez avec impatience ? EdgeFest revient du mardi 27 juin au vendredi 7 juillet pour faire vibrer la Presqu’île Malraux lors d’une sixième édition.…"
      body: "<p><strong>Vous l’attendiez avec impatience ? <a href=\"http://www.edgefest.fr/\" rel=\"noopener\">EdgeFest</a> revient du mardi 27 juin au vendredi 7 juillet pour faire vibrer la Presqu’île Malraux lors d’une sixième édition.</strong></p>\n<p>Jeunes ou moins jeunes, inventeurs du dimanche ou amateurs de nouvelles technologies, startuppers accomplis ou grands rêveurs,  retrouvons nous tous pour faire rayonner Strasbourg en ce début d’été. Quoi de mieux que de déambuler entre les robots et les animations 3D au bord de l’eau ? C’est ça, la formidable aventure Edgefest : une invitation aux rencontres, à la réflexion, à la découverte et à la fête; une ôde à la créativité !</p>\n<p>Faisons de la Presqu’île Malraux le temps de deux semaines le théâtre de nos inventions. En quelques jours devenons des développeurs en herbe, des bidouilleurs audacieux, des penseurs du monde de demain. Et qui de mieux que des startupers, génies du code et artistes de tous horizons afin de faire vivre ce festival ? </p>\n<p>Pour finir en beauté, <a href=\"https://www.facebook.com/events/430096677371073/\" rel=\"noopener\">EdgeNight</a> clôturera les festivités avec une projection murale sur les notes d’un DJ set envoûtant.</p>\n<p>Alors embarquez dans cette expérience particulière et unique dans la région ! </p>\n<p>Organisé par <a href=\"http://www.alsacedigitale.org/\" rel=\"noopener\">Alsace Digitale</a>, le festival est gratuit et ouvert à tous.</p>\n<p>Pour plus d’infos :</p>\n<p>Site internet : <a href=\"http://www.edgefest.fr/\" rel=\"noopener\">http://www.edgefest.fr/</a></p>\n<p>Page Facebook : <a href=\"https://www.facebook.com/EdgeFestStrasbourg/\" rel=\"noopener\">https://www.facebook.com/EdgeFestStrasbourg/</a></p>\n<p>Retrouvez tous les liens des billetteries et événements Facebook sur ces pages.</p>"
      legacy_cover: "/images/blog/bandeaumanonnews.webp"
      status: "published"
      published_at: "2017-06-20"
      categories: ["actualites"]
      legacy_path: "/😎-edgefest-approche-a-grands-pas/"
