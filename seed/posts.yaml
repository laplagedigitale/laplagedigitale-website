      slug: "juillet-2023"
      excerpt: "On ne sait si juillet est bon, qu’après faite la moisson ‍"
      body: "<h2><strong>On ne sait si juillet est bon, qu’après faite la moisson </strong>‍</h2>\n<p><strong>Découvrez l’agenda du mois de juillet de la Plage Digitale</strong></p>\n<figure><img src=\"/images/blog/format-newsletter-21-1.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Les Foliweb – 12/07/2023 – à 18h30</strong></p>\n<p><strong>Comment appréhender la cybercriminalité et prendre les bonnes mesures pour en limiter les risques❓</strong> <br><br>➡️ Cet atelier en présentiel vous permettra de découvrir les bonnes pratiques afin de vous prémunir des principaux risques que votre entreprise rencontrera sur Internet. Nous verrons ensemble comment protéger vos noms de domaine, sécuriser vos sites Web et e-mails ou bien encore anticiper les atteintes potentielles à votre enseigne.<br><br> ✅ Contenu de l’atelier :<br>‧ 40 % des attaques par rançongiciel visaient des TPE, PME et ETI en 2022 d’après l’ANSSI.<br>‧ Et si 54 % des PME se pensent à l’abri d’une cyberattaque en raison de leur petite taille, elles restent les cibles privilégiées par les hackers à cause de leur faible niveau de protection. </p>\n<p> Au-delà de leur impact sur la productivité de l’entreprise, ces attaques entraînent généralement une perte de chiffre d’affaires (c’était le cas de la moitié des entreprises touchées en 2022). </p>\n<p> Rançongiciels, hameçonnage, fraudes aux virements, vol de données… Les risques sont nombreux et peuvent avoir un impact désastreux sur la réputation d’une entreprise et ses activités. </p>\n<p>⏰ Déroulé de l’atelier :<br>Un temps d’échange et de réseautage entre participants vous sera proposé à l’issue de cet atelier.<br>– 45 min de présentation / mise en contexte<br>– 45 min de cas pratique, exemples concrets issus de la salle (et pourquoi pas le vôtre) et questions / réponses pour repartir avec les idées claires sur vos prochaines actions. </p>\n<p>✅ Notre objectif, à travers cet atelier, est que vous puissiez prendre du recul et les bonnes décisions pour développer votre activité professionnelle grâce au web.</p>\n<p><a href=\"https://bit.ly/3P4IzhU\" rel=\"noopener\"><strong>S’inscrire gratuitement</strong></a></p>\n<figure><img src=\"/images/blog/format-newsletter-19-4.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Meetup Deep Learning – 22/07/2023 – à 10h00</strong></p>\n<p><strong>Introduction à la rétropropagation</strong></p>\n<p> Si vous voulez comprendre l’intelligence artificielle et comment les réseaux neuronaux profonds sont entraînés, il est essentiel de comprendre la rétropropagation.</p>\n<p> Apportez un stylo et du papier si vous souhaitez calculer comment les gradients sont rétropropagés à travers un graphe computationnel.</p>\n<p> Si vous préférez, amenez votre ordinateur portable pour pouvoir l’implémenter en Python.</p>\n<p> Ou venez simplement si vous êtes curieux de savoir comment cela fonctionne.</p>\n<p><a href=\"https://www.meetup.com/strasbourg-deep-learning-meetup/events/294304836/\" rel=\"noopener\"><strong>Participer</strong></a></p>\n<figure><img src=\"/images/blog/format-newsletter-22-1.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>HackSXB – 28/07/2023 – 19h00</strong></p>\n<p>Le HackSXB est une communauté d’Alsace Digitale, composée d’étudiants et d’actifs qui partagent l’envie de créer.</p>\n<p>Organisé les derniers vendredis de chaque mois, le HackSXB est une soirée dédiée à la programmation et à la bidouille. Sur des sujets libres et parfois plus thématiques, chacun vient avec son projet ou participe à un projet commun<br>Du développement de jeux vidéo à la soudure de composants électroniques, on y retrouve des passionnés avec des compétences variées</p>\n<p><a href=\"https://www.facebook.com/HackSXB\" rel=\"noopener\"><strong>Je veux en savoir plus !</strong></a></p>\n<figure><img src=\"/images/blog/format-newsletter-20-1.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>La Plage Digitale, ouverte tout l’été !</strong></p>\n<p><strong>Passez vos vacances avec nous à la Plage !☀️</strong></p>\n<p>Notre tiers-lieu restera ouvert tout l’été, avec les mêmes horaires d’ouverture !</p>\n<p>Nous comprenons l’importance de disposer d’un espace de travail collaboratif et inspirant, même pendant la période estivale.</p>\n<p>Que vous soyez entrepreneurs, freelances, étudiants ou simplement à la recherche d’un endroit convivial pour travailler, notre espace de coworking sera à votre disposition pour répondre à tous vos besoins</p>\n<p>Que vous ayez un projet à développer, des idées à concrétiser ou simplement besoin d’un environnement propice à la productivité, nous serons là pour vous accompagner.</p>\n<p>Pendant l’été, nous maintiendrons notre offre complète de services, y compris l’accès à nos salles de réunion équipées, ainsi qu’à notre connexion Internet.</p>\n<p>Vous pourrez également bénéficier de notre café et de notre espace détente pour une pause bien méritée ☕️</p>\n<p><a href=\"/contact\"><strong>Je veux travailler à la Plage Digitale !</strong></a></p>"
