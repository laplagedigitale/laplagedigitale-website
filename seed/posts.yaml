  - key: "strasbourg-startup-weekend-2018"
    fields:
      title: "Strasbourg Startup Weekend 2018"
      slug: "strasbourg-startup-weekend-2018"
      excerpt: "STRASBOURG STARTUP WEEKEND 2018 Are you ready? du 23 au 25 Novembre 2018 CCI Campus Qu’est-ce que le Startup Weekend ? C’est un hackathon annuel de 54h qui…"
      body: "<h3><strong>STRASBOURG STARTUP WEEKEND 2018<br>\nAre you ready?</strong></h3>\n<p>du <strong>23 au 25 Novembre 2018</strong><br>\nCCI Campus</p>\n<h2>Qu’est-ce que le Startup Weekend ?</h2>\n<p>C’est un hackathon annuel de 54h  qui permet de regrouper des entrepreneurs bouillonnant d’idées et d’ambition dans le but de lancer sa startup. Ils forment ensemble une communauté internationale de développeurs, graphistes, marketeurs et autres curieux qui s’entraident dans la création de leur startup et tout cela, dans le but d’en faire une grande entreprise à succès.</p>\n<h2>A quelle échelle ?</h2>\n<p>La startup weekend, c’est 1800 événements à son actif à travers 120 pays dans le monde et répartis dans 200 villes. L’échelle internationale permet d’élargir ses horizons et de partager de nouvelles idées au-delà des frontières.</p>\n<h2>Mais concrètement, comment ça se passe ?</h2>\n<p><strong>Le weekend se déroule en trois étapes :</strong></p>\n<p>– Premièrement, les participants, qu’ils soient étudiants, développeurs, chefs de projet, experts, ou tout simplement intéressés par l’événement, présentent leur projet en soixante secondes. Ils doivent  le synthétiser pour obtenir le meilleur pitch et se positionner comme l’un des plus convaincants. En découle alors un vote par l’assemblée afin d’élire les plus favorables à la réalisation.</p>\n<p>– Par la suite, des équipes de travail sont formées afin de concrétiser les projets présentés. Le commencement du projet prend forme ! Pendant les 54h de folie qui suivront, ils devront passer par les étapes cruciales de la formation d’entreprise, telles que l’étude de marché, l’élaboration de la stratégie commerciale et marketing ou encore la conception du premier prototype. Tout au long de leur épopée, ils seront guidés par des coachs qui leur seront d’une aide précieuse dans leur démarrage. En plus de cela, les conférences et le mentoring qui s’ajoute aux séances de réflexion viendront prêter main forte à ces épatants chefs d’entreprise en devenir.</p>\n<p>– Finalement, chaque groupe vient défendre son travail, en fin de weekend, devant un jury de professionnels et d’entrepreneurs. Ils leurs présenteront leurs critiques, leurs conseils d’amélioration, les orientant ainsi vers le succès. La clôture du weekend se fait par l’élection des meilleurs projets.</p>\n<h2>Pourquoi devrais-je participer à la Startup Weekend cette année ?</h2>\n<p>Déjà, rassembler des entrepreneurs motivés, qui viennent aussi pour se faire plaisir, c’est créer un tourbillon de folie dans le monde chaotique de la création de startups. Le travail en équipe permet de nouvelles rencontres, poussant chacun à trouver des entreprises mais aussi des co-entrepreneurs avec d’autres expériences et différentes visions. Le challenge est non seulement inspirant, mais aussi stimulant ! Pas forcément besoin de venir avec un projet en tête, vous pouvez participer pour le plaisir d’apprendre ensemble et de goûter aux joies de l’entrepreneuriat. Les coachs accélèrent la progression du projet, au même titre que le jury final, ou que les conférenciers tout au long du weekend. Cette expérience collective prépare les audacieux au monde de l’aventure startup.</p>\n<p>Lien fb: <a href=\"https://www.facebook.com/StartupWeekendStrasbourg/\" rel=\"noopener\">https://www.facebook.com/StartupWeekendStrasbourg/</a><br>\nInscription : Cliquez <a href=\"http://eventbrite.swstrasbourg.eu/\" rel=\"noopener\">ICI</a>  <br>\n<a href=\"http://swstrasbourg.eu/\" rel=\"noopener\">Planning et infos </a><br>\n<a href=\"https://www.youtube.com/watch?v=Y2RJjA68p3k/\" rel=\"noopener\">Vidéo documentaire sur le Startup Weekend</a></p>"
      legacy_cover: "/images/blog/45643894-2138526729502419-3295610186693083136-n.webp"
      status: "published"
      published_at: "2018-11-16"
      categories: ["actualites"]
      legacy_path: "/4319/"
      created_at: "2018-11-16T12:44:15Z"
  - key: "demo-night-15-29-novembre-a-la-cci"
    fields:
      title: "Démo Night #15 – 29 Novembre à la CCI"
      slug: "demo-night-15-29-novembre-a-la-cci"
      excerpt: "Alsace Digitale et sa communauté Strasbourg Startups organise la quinzième Démo Night le jeudi 29 Novembre 2018 de 18h30 à 22h00 à la CCI de Strasbourg (10…"
      body: "<p><strong>Alsace Digitale et sa communauté Strasbourg Startups organise la quinzième Démo Night  le  jeudi 29 Novembre 2018 de 18h30 à 22h00 à la CCI de Strasbourg (10 place Gutenberg 67081 Strasbourg).  </strong></p>\n<p><strong>Une Démo Night est une soirée organisée par Alsace Digitale qui donne la possibilité aux startups, d’intégrer la communauté Strasbourg Startups. Pour cela, une seule règle : faire une démonstration de son produit ou de son service. </strong><br>\n<strong>Des démos de startups en 5 minutes vont animer cette soirée pleine en émotions ! Une épreuve qui marque toujours, que l’on soit celui / celle sur la scène ou juste dans le public. Une expérience enrichissante qui ne peut qu’inspirer les futurs entrepreneurs et la rencontre des acteurs de l’écosystème Startups.</strong></p>\n<p><strong>Pour terminer la soirée en beauté, tout le monde est invité à un apéro convivial.</strong></p>\n<p><i><strong>Elles s’y préparent et seront présentes; voici les startups annoncées :</strong></i></p>\n<p><strong>Testmonjob : Testmonjob vous fait découvrir un métier rapidement et sans engagement. Choix de carrière, reconversion, pendant une journée ou une semaine, validez votre orientation et abordez le futur avec sérénité (</strong><a href=\"https://testmonjob.fr\" rel=\"noopener\"><strong>https://testmonjob.fr</strong></a><strong>)</strong></p>\n<p><strong>StockBooking : Solution de stockage facile et temporaire, avec ou sans services logistiques supplémentaires, mais avec un maximum de flexibilité (</strong><a href=\"http://www.stock-booking.com/\" rel=\"noopener\"><strong>http://www.stock-booking.com</strong></a><strong>)</strong></p>\n<p><strong>Orisun : Apporte conseils, outils et expertises aux entreprises afin d’accompagner leur entrée sur le marché de l’internet des objets et conçoit des solutions clés en main pour optimiser les process (</strong><a href=\"https://www.orisun-iot.fr/\" rel=\"noopener\"><strong>https://www.orisun-iot.fr/</strong></a><strong>)</strong></p>\n<p><strong>Myfood : fournit des serres connectées clé en main équipées de tours de culture verticales à tous ceux qui souhaitent produire leur propre alimentation. (</strong><a href=\"https://myfood.eu/fr/\" rel=\"noopener\"><strong>https://myfood.eu/fr/</strong></a><strong>)</strong></p>\n<p><strong>HILDR : Une nouvelle boisson originale lauréate du Startup Week end Strasbourg 2018.</strong></p>\n<p><strong>Et puis, fête de fin d’année oblige, une vitrine rassemblant des startups sera présente pour vous proposer des idées de cadeaux originaux, innovants et locaux. Un vrai marché de noël des startups !</strong></p>\n<p><strong>En plus de vous en mettre pleins la vue vous pourrez partager un moment convivial avec nos Startups ! Pour vous inscrire, c’est par </strong><a href=\"https://www.eventbrite.fr/e/billets-demo-night-15-52488572734?utm-medium=discovery&amp;utm-campaign=social&amp;utm-content=attendeeshare&amp;aff=escb&amp;utm-source=cp&amp;utm-term=listing\" rel=\"noopener\"><strong>ici </strong></a></p>\n<p><strong>Evénement </strong><a href=\"https://www.facebook.com/events/755105164822143/\" rel=\"noopener\"><strong>facebook</strong></a></p>"
      legacy_cover: "/images/blog/demonight15.webp"
      status: "published"
      published_at: "2018-11-27"
      categories: ["actualites"]
      legacy_path: "/demo-night-15-29-novembre-a-la-cci/"
      created_at: "2018-11-27T15:06:07Z"
  - key: "le-noel-des-startups-edition-2018"
    fields:
      title: "Le Noël des Startups Edition 2018"
      slug: "le-noel-des-startups-edition-2018"
      excerpt: "Noël 2018 approche à grands pas et nous avons pensé à vous et vos proches ! Quoi de mieux qu’une sélection de cadeaux originaux, innovants et locaux pour…"
      body: "<p>Noël 2018 approche à grands pas et nous avons pensé à vous et vos proches !</p>\n<p>Quoi de mieux qu’une sélection de cadeaux originaux, innovants et locaux pour s’organiser en ce mois de décembre !</p>\n<p>Alsace Digitale a décidé de réunir des produits purement startups de la région afin de vous aider dans votre quête des cadeaux parfaits ! Comme l’année dernière nous vous proposons de rencontrer certaines d’entre elles le 29 novembre à la CCI place Gutenberg pendant la prochaine Démo Night de 18h30 à 21h30 !</p>\n<p><strong>La sélection de cadeaux 100% startups :</strong></p>\n<p><strong>Le cadeau qui fait rêver !</strong></p>\n<p><strong>EPOPIA</strong></p>\n<p>Epopia, les aventures magiques pour Noël (de 5 à 10 ans)</p>\n<p>Et si votre enfant recevait au pied du sapin une enveloppe remplie de magie et de rêve ? Pour Noël, offrez la plus féerique des histoires. Plongez-le dans une aventure où il est le héros ! En recevant des lettres à son nom, il va devoir prendre son stylo pour écrire aux personnages de l’histoire et décider avec eux de la suite des péripéties. Avec Epopia, son imagination prend vie !</p>\n<p>Découvrez nos aventures avec 5% de remise sur toutes nos offres : EpopiaAlsaceDigitale2018 (respecter les majuscules, code valable jusqu’au 31 décembre 2018).</p>\n<p>Pour commencer dès à présent votre aventure rejoignez les sur leur site web :<a href=\"https://www.epopia.com/\" rel=\"noopener\"> <strong>https://www.epopia.com</strong></a></p>\n<p><strong>EMY</strong></p>\n<p>Existe-t-il Un produit 100% Français et qui vous permet de rééduquer votre périnée facilement sans tabou ?</p>\n<p>OUI ! Avec la sonde connectée Emy et son app plus aucune rééducation ne sera difficile !</p>\n<p>Ce dispositif médical innovant est le premier conçu par des femmes pour des femmes et fabriqué avec des matériaux biocompatibles et de qualité médicale.</p>\n<p>Pensez à vos proches pensez Emy !</p>\n<p>Nous vous préparons une offre spéciale pour ce Noël 2018 !</p>\n<p>En utilisant le code DEMONIGHT30 vous pouvez bénéficier de 30 euros de réduction !</p>\n<p>Offre Valable jusqu’au 31 décembre 2018 !</p>\n<p>Retrouvez La Startup sur son stand le 29 Novembre de 18h30 à 21h30 à la CCI !</p>\n<p>Pour plus d’informations regarder sur le site internet de cette startup :</p>\n<p><a href=\"https://www.fizimed.com/\" rel=\"noopener\"><strong>https://www.fizimed.com</strong></a></p>\n<p><strong>Les cadeaux qui régalent :</strong></p>\n<p><strong>BREWNATION</strong></p>\n<p>Cette Startup vous propose un panel de bières artisanales qu’elle distribue grâce au travail de 30 brasseurs artisanaux et locaux ! En vente via internet ou aux particuliers directement, ces produits sont accessibles même si pour vous Noël se passera au soleil ! Quoi de mieux qu’une bière d’Alsace pour profiter de ses vacances de Noël en voyage, entre amis ou en famille.</p>\n<p>Retrouver votre ou même vos bières favorites sur :<a href=\"http://brewnation.fr\" rel=\"noopener\"> <strong>http://brewnation.fr</strong></a></p>\n<p><strong>CUISINE AVENTURE</strong></p>\n<p>Cuisine Aventure que vous retrouverez sur le stand de Noël à la CCI va vous présenter son univers culinaire qui va régaler les grands comme les petits ! Grâce à un code promotionnel qui vous permet de bénéficier de 10% de remise (tout abonnement confondu) : CADEAU NOEL (valable jusqu’au 14 décembre) vous pourrez apprendre à cuisiner et relever le défi d’éveiller en chaque enfant la conscience et l’ambition de manger sainement grâce à des colis mensuels personnalisés.</p>\n<p>En plus des colis vous pouvez échanger avec la brigade de Cuisine Aventure sur une plateforme que vous retrouvez sur leur site internet : <a href=\"http://www.cuisineaventure.com\" rel=\"noopener\"><strong>http://www.cuisineaventure.com</strong></a></p>\n<p>Entre des recettes adaptées aux compétences de chacun, les éventuelles restrictions alimentaires et le matériel dont vous disposez vous reprendrez confiance de manière ludique et adapté en cuisinant !  </p>\n<p><strong>ALSACE SAVEUR</strong></p>\n<p>Retrouvez vos produits alsaciens préférés sous forme de box mensuelles ! Alsace saveur va vous permettre de partager un moment de bonheur ! En Famille c’est l’occasion de partager des traditions, entre amis de faire découvrir un univers culinaire extraordinaire et au travail de faire découvrir pour ceux qui ne le connaissent pas encore une Alsace délicieuse ! Avec cet apéritif, repas ou cadeau vous ne pouvez pas vous tromper !</p>\n<p>Attention si vous regardez ça ne peut que vous donner envie de craquer : <a href=\"https://www.alsacesaveurs.com/\" rel=\"noopener\"><strong>https://www.alsacesaveurs.com</strong></a></p>\n<p><strong>Les cadeaux bons pour notre santé :</strong></p>\n<p><strong>FIZZUP</strong></p>\n<p>Cette Startup a pour objectif de favoriser la pratique d’une activité sportive régulière. L’application web et mobile propose un coaching sportif personnalisé et interactif grâce à des programmes de musculation, fitness, entretien, etc. adaptés à chaque usager. Personnalisés et intuitifs les programmes proposés vous permettront d’éliminer de transpirer avant ou après les fêtes. À votre rythme vous pouvez essayer la plateforme gratuitement ! D’autres programmes seront proposés pour les fêtes mais … chuuuut c’est encore une surprise dont nous vous tiendrons informés !</p>\n<p>En attendant vous pouvez déjà commencer votre aventure sportive en cliquant sur le lien ci-dessous :</p>\n<p><a href=\"https://www.fizzup.com/fr/\" rel=\"noopener\"><strong>https://www.fizzup.com/fr</strong></a></p>\n<p><strong>Le cadeau qui sécurise :</strong></p>\n<p><strong>AWAKEN</strong></p>\n<p>Quoi de plus beau que la sécurité de ceux qui nous entourent au pied de votre sapin ?</p>\n<p>Grâce à une startup Strasbourgeoise spécialisée dans les objets connectés qui sauvent des vies vous pouvez offrir ce cadeau à votre entourage.</p>\n<p>En effet leur première solution, un boitier connecté qui réduit le temps d’intervention des secours lors d’un accident mais également en cas de vol ou de panne, va vous aider plus que vous ne pouvez l’imaginer. Grand Gagnant du prix de l’innovation sécurité routière 2017, Awaken a décidé de partager son succès en vous proposant des boîtiers innovants.</p>\n<p>Découvrez ce boitier en cliquant sur le lien de la vidéo : https://www.youtube.com/watch?v=hAg_XDBpzm0&amp;feature=youtu.be</p>\n<p>Pour commander votre objet connecté c’est sur leur site internet ; <a href=\"https://awaken.fr/fr/accueil/\" rel=\"noopener\"><strong>https://awaken.fr/fr/accueil</strong></a></p>\n<p><strong>Un cadeau pour construire son avenir :</strong></p>\n<p><strong>J’AIME MON ARTISAN</strong></p>\n<p>Sur leur site <a href=\"https://www.jaimemonartisan.com/\" rel=\"noopener\"><strong>https://www.jaimemonartisan.com</strong></a> vous pourrez comparer, personnaliser et commander vos travaux « clé en main » à des professionnels de votre région.</p>\n<p>Un gain de temps et d’argent dédiée dédié aux particuliers sur un seul et même lieu : une place de marché dédiée réservée aux particuliers qui souhaitent réaliser des travaux et aux professionnels qui souhaitent vendre leurs produits grâce à internet.</p>\n<p>Une autre idée ?  N’hésitez pas à nous contacter via : contact@strasbourg-startups.com</p>\n<p>Bonnes Fêtes de fin d’années à tous !</p>\n<p>Le lien de l’évènement Facebook c’est <a href=\"https://www.facebook.com/events/755105164822143/\" rel=\"noopener\"><strong>LA</strong></a></p>\n<p>Pour vous inscrire c’est <a href=\"https://www.eventbrite.fr/e/billets-demo-night-15-52488572734?fbclid=IwAR1oFxlnBfDhpQY3zgu8w1IPwZSugMx451PXuN0O6_ItAG6ecbsL_nfeBMQ\" rel=\"noopener\"><strong>ICI</strong></a></p>\n<p>Et pour plus de renseignements sur les startups et l’écosystème c’est juste en bas :</p>\n<p><strong>STRASBOURG STARTUPS LE BLOG : https://www.strasbourg-startups.com</strong></p>"
