  - key: "global-game-jam-2018"
    fields:
      title: "Global Game Jam 2018"
      slug: "global-game-jam-2018"
      excerpt: "La Global Game Jam 2018 à Strasbourg On a passé douze mois à l’attendre, mais elle est enfin de retour ! La Global Game Jam 2018, organisée par le Game Dev…"
      body: "<h2><strong>La Global Game Jam 2018 à Strasbourg</strong></h2>\n<p>On a passé douze mois à l’attendre, mais elle est enfin de retour ! La Global Game Jam 2018, organisée par le <a href=\"http://strasbourg.gamedevgroup.eu/\" rel=\"noopener\">Game Dev Group</a> de l’école <a href=\"http://www.epitech.eu/strasbourg/ecole-informatique-strasbourg.aspx\" rel=\"noopener\">Epitech Strasbourg</a> et <a href=\"http://www.alsacedigitale.org/\" rel=\"noopener\">Alsace Digitale</a>, vous ouvre grand ses portes du 26 au 28 janvier 2018.</p>\n<p>Qu’est-ce que la <strong>Global Game Jam</strong> ? C’est un événement annuel à l’échelle mondiale, centré autour de la création de jeux vidéo ou de jeux de société, ouvert à tout le monde (programmeurs, créatifs ou amateurs passionnés). Le thème est imposé et celui de cette année ne sera révélé qu’avant le début de la GGJ. Durant deux jours, les participants créeront des jeux qui seront ensuite accessibles au public sur le <a href=\"https://globalgamejam.org/\" rel=\"noopener\">site officiel</a> de la Global Game Jam.</p>\n<p>En janvier 2017, il y avait plus de 700 villes dans 95 pays participants, avec <strong>7263 jeux</strong> crées en un seul weekend. Cette année, ce sera à vous de faire exploser le compteur !</p>\n<p><strong>Inscription gratuite</strong> sur <a href=\"https://www.eventbrite.fr/e/billets-global-game-jam-strasbourg-2018-39181739638\" rel=\"noopener\">Eventbrite</a></p>\n<p><strong>Forfait repas sur place</strong> : 28€ (à reserver avant le 20 janvier; petits-déjeuners offerts)</p>\n<p>Rendez-vous en 2018 au <a href=\"http://www.shadok.strasbourg.eu/\" rel=\"noopener\">Shadok</a>, du vendredi 26 janvier (16h00) au  dimanche 28 janvier (18h00), au 25 Presqu’île André Malraux – 67100 Strasbourg.</p>\n<p>Si vous souhaitez devenir partenaire de cet événement ou éventuellement faire partie du jury final, veuillez contacter <a href=\"mailto:jonathan.marchal@epitech.eu\">Jonathan Marchal</a>.</p>"
