  - key: "avril-2023"
    fields:
      title: "Avril 2023 🐠"
      slug: "avril-2023"
      excerpt: "En avril, ne vous découvrez pas d’un fil !"
      body: "<p>En avril, ne vous découvrez pas d’un fil<strong> ! </strong></p>\n<p><strong>Découvrez l’agenda du mois d’avril de la Plage Digitale</strong></p>\n<figure><img src=\"/images/blog/1-2.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Meetup Go SXB, Go ! – 06/04/2023</strong></p>\n<p><strong>Cette rencontre est ouverte à toute personne intéressée par le Go : du curieux à l’utilisateur expérimenté. </strong></p>\n<p><strong> Le programme :</strong><br>▪️Des talks avec questions/réponses<br>▪️Pause nourriture et boisson<br>▪️Discussions et partages sur le Go et le métier de développeuse/développeur.</p>\n<p> <strong>Les talks :</strong><br>▪️Métaphores utiles pour enseigner la concurrence en Go<br>▪️Mocking interfaces in your tests : présentation of the gomock library<br>▪️Ton talk/lightning talk ? On est preneur si vous avez des choses à présenter ou tout simplement envie de partager un module/package Go intéressant.</p>\n<p>Tanguy, Julien et Léo pour Go SXB, Go!</p>\n<figure><img src=\"/images/blog/4-202304.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Achen’ight – 14/04/2023</strong></p>\n<p>La Plage Digitale a toujours le grand plaisir d’accueillir les Achen’ight</p>\n<p>Achen’ight, c’est une soirée par mois où se rassemble l’équipe d’Achencraft pour discuter, rencontrer, rigoler, concevoir, …. bref tout ce qui permet au projet Achencraft de progresser !</p>\n<p>D’ailleurs, chaque participant amène une petite collation à partager, et il paraît qu’on y mange très bien</p>\n<p> Si cette rencontre vous intéresse, il y a deux choses à faire :</p>\n<p>▪️Emmener votre ordinateur portable</p>\n<p>▪️Vous marquer présent sur l’événement Facebook  !</p>\n<p><a href=\"https://www.facebook.com/Achencraft\" rel=\"noopener\"><strong>Participer</strong></a></p>\n<figure><img src=\"/images/blog/2.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Plusieurs permanences conseils pros à venir…</strong></p>\n<p>La Plage Digitale accueille chaque mois des <strong>permanences</strong>, lors desquelles vous pouvez <strong>obtenir des conseils personnalisés pour votre projet d’entreprise</strong> sur diverses thématiques. </p>\n<p>➡️ En avril, retrouvez :</p>\n<p>▪️Une permanence CCI Alsace Eurométropole avec Benjamin Gonzalez, qui viendra vous conseiller sur la <strong>création d’entreprise</strong> le vendredi 21/04/2023 de 10h00 à 12h00, sur rendez-vous. </p>\n<p>▪️Une permanence avec Bryan Rassen, sur le <strong>Growth Hacking</strong>, <em>qui est un ensemble de stratégies qui se concentrent exclusivement sur la croissance rapide d’une entreprise</em>, le jeudi 27/04/2023  de 11h00 à 13h00, sur rendez-vous. qui est un ensemble de stratégies qui se concentrent exclusivement sur la croissance rapide d’une entreprise</p>\n<p>▪️Une permanence sur la <strong>Propriété Intellectuelle</strong>, avec Alexis Martin, le vendredi 28/04/2023 de 10h00 à 12h00, sur rendez-vous. L’occasion pour vous d’obtenir des conseils sur les droits exclusifs accordés à la création intellectuelle.</p>\n<p>N’hésitez pas à vous inscrire ⤵️</p>\n<p><a href=\"https://my.weezevent.com/plage-digitale-prise-de-rendez-vous?_gl=1*17skprp*_gcl_aw*R0NMLjE2NzUyNzU0NzguQ2p3S0NBaUF1T2llQmhBSUVpd0FnakN2Y2lLWk15NWNmYmw4QWljSnhWM21jVUw1WERhZmNyTkdMbHk0cWp3U2VXbnRlajhnYVE2bV9Sb0NrMDRRQXZEX0J3RQ\" rel=\"noopener\">S’inscrire pour la permanence<br>« Création d’entreprise »</a></p>\n<p><a href=\"https://tally.so/r/mJ1Yqo\" rel=\"noopener\">S’inscrire pour la permanence<br>« Growth Hacking »</a></p>\n<p><a href=\"https://tally.so/r/w7qLNP\" rel=\"noopener\">S’inscrire pour la permanence<br>« Propriété intellectuelle »</a></p>\n<figure><img src=\"/images/blog/3.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>C’est arrivé le mois dernier … et près de chez vous !</strong></p>\n<p><strong>À la Plage Digitale, il s’en est passé des choses en mars :</strong></p>\n<p> La journée internationale du bonheur, une rencontre HackSXB (communauté d’Alsace Digitale), Software Crafters Strasbourg, etc.</p>\n<p>On a même accueilli le tournage d’un clip musical du groupe OUTED le temps d’un week-end</p>\n<p>Suivez-nous sur nos réseaux sociaux pour ne rien louper !</p>\n<p><a href=\"https://www.helloasso.com/associations/la-plage-digitale/adhesions/adhesions-la-plage-digitale-2023\" rel=\"noopener\">Rejoindre la Plage Digitale !</a></p>"
