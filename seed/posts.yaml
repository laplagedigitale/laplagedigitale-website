  - key: "steve-jobs-en-fait-on-trop-sur-le-personnage"
    fields:
      title: "Steve Jobs : en fait-on trop sur le personnage ?"
      slug: "steve-jobs-en-fait-on-trop-sur-le-personnage"
      excerpt: "Pour la sortie du film « Jobs », le mercredi 21 août, Alsace Digitale et Rue89 Strasbourg ont organisé une soirée cinéma spéciale. Les spectateurs ont pu…"
      body: "<p><strong>Pour la sortie du film « Jobs », le mercredi 21 août, <a href=\"http://alsacedigitale.org/\" rel=\"noopener\">Alsace Digitale</a> et <a href=\"http://www.rue89strasbourg.com/\" rel=\"noopener\">Rue89 Strasbourg</a> ont organisé une soirée cinéma spéciale. Les spectateurs ont pu manger leur popcorn devant le film mais, surtout, devant le débat.</strong></p>\n<p>Salle 13, UGC Ciné Cité de Strasbourg, 236 sièges. C’est dans cette salle comble que le long-métrage « Jobs », biopic sur la figure icônique d’Apple, a démarré. Deux heures pour retracer l’histoire de Steve Jobs, de l’étudiant au PDG. Deux heures pour raconter l’histoire d’un homme visionnaire mais marginal. Deux heures de film qui ont laissé le public sur sa faim… Les lumières s’allument, la moitié de la salle disparait par la porte de sortie et l’autre moitié reste pour prendre part au débat. Trois intervenants ont alors pu leurs visions sur des domaines bien spécifiques : Pierre France (journaliste à Rue89 Strasbourg) animait le débat, Sandrine Hilaire (avocate) a avancé les problèmes juridiques auxquels était confronté Apple et Philippe Astier (consultant <em>evangelist</em> Apple) a défendu la marque et a apporté son expertise.</p>\n<p><img src=\"/images/blog/dsc04608-copie.webp\" alt=\"Soirée Steve Jobs, débat sur le film avec Philippe Astier, Sandrine Hilaire et Pierre France de Rue89 Strasbourg\" loading=\"lazy\"></p>\n<p>Pierre France mit d’emblée en évidence un aspect du film : Apple a eu ses périodes d’innovations comme ses périodes sombres. Comment ont réagi les fans ? C’est à Philippe de répondre en expliquant que Steve Jobs a toujours eu une bonne base de fans. Pour preuve, lorsque le futur PDG d’Apple a quitté l’entreprise puis fondé NeXT, les vrais fans l’ont suivi. « Steve Jobs n’est pas un bon gestionnaire, on l’a vu. Mais il revient toujours à la charge après s’être trompé » affirme-t-il.  C’est le charisme de la personne et sa détermination qui font de lui une icône.</p>\n<p>Si Steve Jobs avait conçu plusieurs produits avant de mourir, comme « ultime héritage à l’humanité », la tendance actuelle d’Apple n’est pas vraiment à l’innovation. La firme à la pomme croquée serait plutôt en période de guerre des brevets avec Samsung. Une histoire de confrontation qui se répète puisque ce fut déjà le cas avec Bill Gates. À cela, Sandrine Hilaire justifie :</p>\n<blockquote><p>On n’innove pas tous les ans. Il y a des périodes creuses et des cycles longs comme pour toute entreprise. La technologie prend du temps. Aujourd’hui, le « think different » se transforme de plus en plus en « thing global ».<br>\nD’ailleurs, ce que tout le monde ne sait pas, c’est qu’apple et samsung ont 10 ans d’histoire commune. samsung travaillait pour apple en créant des microprocesseurs ou des écrans. la guerre des brevets est aussi une guerre commerciale.</p></blockquote>\n<p>Ces attaques entre sociétés n’est pas prête de s’arrêter. Les verdicts sont différents selon chaque pays et chacun essaye de gagner sa part du gâteau. Les grandes entreprises forcent même les PME à céder les brevets. Où est passée l’innovation ? Est-ce que cette guerre interminable ne tue pas les start-ups de garage ?</p>\n<p><img src=\"/images/blog/dsc04631.webp\" alt=\"Soirée Steve Jobs, débat sur le film avec Philippe Astier, Sandrine Hilaire et Pierre France de Rue89 Strasbourg\" loading=\"lazy\"></p>\n<p>Le public prend la parole pour exposer son point de vue. Pour l’un des spectateurs, tout dépend du pays. En France, l’innovation est freinée par l’écosystème compliqué où l’Etat ne cesse de taxer. Sandrine et Philippe partagent cette vision :</p>\n<blockquote><p>Philippe astier : C’est exactement ce qu’avait dit steve jobs lors d’un interview accordé à antenne 2 (ndr : vidéo disponible en fin d’article) . en france, on a de bonnes idées mais on ne sait pas les appliquer.</p><p>Sandrine Hilaire : En France, on forme des experts et non pas des visionnaires. Nos etudes en sont l’exemple type, on se spécialise dans une matière alors qu’aux états-unis, comme steve jobs, on peut faire de l’informatique et de la calligraphie.</p></blockquote>\n<p>N’oublions pas, en effet, qu’Apple est aussi un entreprise avec de véritables fanboys. « Le terme n’est pas approprié » intervient Philippe. Tout n’est pas parfait non plus, Steve Jobs a son côté sombre que l’on peut voir dans le film. Cependant, il aura toujours des fans. Cette communauté a souvent été tourné en dérision jusqu’à être qualifiée aujourd’hui de culte, voire de secte. Pour sûr, la personnalité de Steve Jobs joue un rôle important – et son entourage nuance l’avocate. « C’est parce qu’il a la folie » clâme une personne du public. Un psychiatre prend la parole pour nous faire part de son analyse sur l’homme. Pour lui, Jobs est un paranoïaque et, pour ce genre d’individu, c’est soit la réussite soit la descente en enfer.  » Comme toute religion, le culte Apple se réfère à son messie », conclut-il.</p>\n<p>Alors, pour vous, Steve Jobs est-il un véritable visionnaire, un fou ou un imposteur ?</p>\n<p><iframe src=\"https://www.youtube-nocookie.com/embed/Od_PCFksRK8?rel=0\" loading=\"lazy\" allowfullscreen></iframe></p>\n<p><em>Encore merci à Rue89 Strasbourg pour avoir co-organisé la soirée et à l’UGC Ciné Cité de Strasbourg pour nous avoir prêté la salle de cinéma pour le débat. Toutes les photos sont <a href=\"http://on.fb.me/1d7s8Jv\" rel=\"noopener\">à cette adresse</a>.<br>\n</em></p>"
