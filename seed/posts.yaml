  - key: "les-winter-camps-sinstallent-en-fevrier"
    fields:
      title: "Les Winter Camps s’installent en février"
      slug: "les-winter-camps-sinstallent-en-fevrier"
      excerpt: "Cet hiver à Strasbourg, Play2Code organise les Winter Camps, 4 ateliers d’initiation à la programmation informatique, à destination des enfants et des…"
      body: "<p><strong>Cet hiver à Strasbourg, Play2Code organise les Winter Camps, 4 ateliers d’initiation à la programmation informatique, à destination des enfants et des adolescents.</strong></p>\n<p>Play2Code réunit sous une même bannière les ateliers d’apprentissage à la programmation et au développement informatique à destination des enfants et adolescents, tels que <strong>Code4Kids</strong> (pour les 10-14 ans) et le <strong>Coding Club</strong> (pour les 15-18 ans).</p>\n<p>Durant les vacances scolaires hivernales, 4 ateliers sont organisés dans le cadre des <strong>Winter Camps :</strong></p>\n<p>– Jeudi 16 février de 10h à 17h : <strong>Code4Kids</strong></p>\n<p>– Vendredi 17 février de 10h à 17h : <strong>Coding Club (Thème : La sécurité informatique)</strong></p>\n<p>– Jeudi 23 février de 10h à 17h : <strong>Code4Kids</strong></p>\n<p>– Vendredi 24 février de 10h à 17h : <strong>Coding Club (Thème : La sécurité informatique)</strong></p>\n<p>Ces ateliers ont tous lieu dans les locaux d’<strong>Epitech</strong> – 4 rue du Dôme à Strasbourg.</p>\n<p>C’est <strong>gratuit</strong> et aucune compétence préalable en programmation n’est nécessaire. Les enfants doivent ramener à manger le midi. Tout le matériel est fourni mais vous pouvez ramener votre ordinateur portable si vous le souhaitez.</p>\n<p>Pour vous <strong>inscrire</strong> vous ou votre enfant à l’une de ces sessions, c’est par <strong><a href=\"http://www.play2code.eu/event-directory/\" rel=\"noopener\">ICI</a></strong></p>\n<p>Play2Code permet donc de <strong>développer des compétences en informatique</strong>, mais également d’être <strong>créatif</strong> et de travailler de façon <strong>autonome</strong>. Chacun avance à son rythme, les participants mobilisent d’abord leurs compétences en suivant des tutoriels sur-mesures et des coachs sont présents pour les aider.</p>\n<p>Plus d’informations sur le site de <a href=\"http://www.play2code.eu/\" rel=\"noopener\"><strong>Play2Code</strong></a>.</p>\n<p>Vous pouvez également les soutenir <a href=\"https://www.helloasso.com/associations/alsace-digitale/collectes/apprendre-en-s-amusant-grace-au-play2code\" rel=\"noopener\"><strong>ICI</strong></a>.</p>"
      legacy_cover: "/images/blog/dsc-0032.webp"
