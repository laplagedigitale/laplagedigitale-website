  - key: "reouverture-de-la-plage"
    fields:
      title: "Réouverture de La Plage"
      slug: "reouverture-de-la-plage"
      excerpt: "La Plage Digitale a pu rouvrir ses portes suite à l’annonce du déconfinement. Dans l’optique de garantir la sécurité sanitaire de nos coworkers et…"
      body: "<p>La Plage Digitale a pu rouvrir ses portes suite à l’annonce du déconfinement. Dans l’optique de garantir la sécurité sanitaire de nos coworkers et collaborateurs, nous avons, au cours de ces deux mois, mené une réflexion quant à l’aménagement des locaux et les règles à établir pour une reprise et une réouverture dans des conditions optimales. </p>\n<p>Ceci se matérialise par :</p>\n<ul><li>un espacement des bureaux et la mise en place de cloisons pour séparer les bureaux en face-à-face.</li><li>la mise à disposition de lingettes et produits désinfectants, de solutions hydroalcooliques et de masques</li><li>un passage plus régulier de notre prestataire de ménage</li><li>l’établissement d’un sens de circulation au seins de l’espace de coworking</li><li>la limitation des jauges des salles de réunion</li><li>une restriction au niveau de la cuisine et des équipements collectifs de cette dernière (vaisselle, couvert, frigo)</li></ul>\n<p>Malheureusement, l’espace Flex demeure fermé pour le moment et les locations de salles de réunion suspendues. Le babyfoot n’est pas utilisable non plus, mais les barrières de plexiglas se prêteront bien à un morpion ou une bataille navale ! ;P</p>\n<p>N’hésitez pas à nous contacter à l’adresse mail <a href=\"mailto:contact@alsacedigitale.org\">contact@alsacedigitale.org</a> pour plus d’informations. </p>"
      legacy_cover: "/images/blog/plage-digitale.webp"
      status: "published"
      published_at: "2020-05-20"
      categories: ["actualites"]
      legacy_path: "/reouverture-de-la-plage/"
      created_at: "2020-05-20T14:22:58Z"
  - key: "vers-une-nouvelle-plage-digitale"
    fields:
      title: "Vers une nouvelle Plage Digitale"
      slug: "vers-une-nouvelle-plage-digitale"
      excerpt: "Le projet d’une nouvelle Plage Digitale a été abordé depuis déjà quelques années. Durant tout ce temps la réflexion autour de ce nouveau lieu a pu mûrir…"
      body: "<p><strong>Le projet d’une nouvelle Plage Digitale a été abordé depuis déjà quelques années. Durant tout ce temps la réflexion autour de ce nouveau lieu a pu mûrir autour de plusieurs questions. Quelle sera l’identité de ce lieu ? Qu’est ce qu’il proposera ? Un espace de coworking classique ou quelque chose en plus ? </strong></p>\n<p>A ce jour le projet a pu prendre un nouveau tournant, bien que ralenti par le contexte actuel, depuis que nous avons le permis de construire et d’aménager les locaux de l’ancienne Coop située rue Jacques Peirotes. La volonté est claire : proposer un tiers-lieu, ouvert à tous et surtout permettant à chacun de mettre la main à la pâte afin de le façonner à son image.</p>\n<p>Ce sera également un tournant pour l’association Alsace Digitale, qui laisse la gestion de l’espace à une nouvelle association créée spécialement pour le projet : La Plage Digitale. Les deux associations travailleront main dans la main, mais dans un souci de clarté et de positionnement, l’association Alsace Digitale deviendra membre du coworking, et la gestion du tiers-lieu sera assurée par un bureau différent.</p>\n<p>La Plage Digitale de la rue Peirotes sera plus grande, plus flexible avec des possibilités d’accueil plus diversifiées pour accueillir du coworking, des réunions et des événements. Une partie des locaux sera réservée à la Bidouillothèque, centre de ressources partagées et outil de diffusion de la culture numérique. La partie flex sera quant à elle aménageable afin de permettre à qui le veut de disposer d’un espace dédié à l’événementiel, que ce soit pour des meetups, des conférences ou des rencontres entre les coworkers. </p>\n<p>Bien que le projet soit bien amorcé, nous avons comme volonté que ce lieu résonne avec les différentes communautés d’Alsace Digitale, c’est pourquoi nous sommes à l’écoute de vos questions, de vos remarques ainsi que de vos suggestions pour que la prochaine Plage Digitale soit un lieu vivant, hétérogène et avec une vraie identité : la votre. </p>"
      legacy_cover: "/images/blog/img-20200313-163624.webp"
      status: "published"
      published_at: "2020-05-20"
      categories: ["actualites"]
      legacy_path: "/vers-une-nouvelle-plage-digitale/"
      created_at: "2020-05-20T14:33:08Z"
  - key: "newsletter-mars-2023"
    fields:
      title: "Mars 2023"
      slug: "newsletter-mars-2023"
      excerpt: "Le printemps est là, bourgeonnons ensemble !"
      body: "<p><strong>Le printemps est là, bourgeonnons ensemble !</strong></p>\n<p><strong>Découvrez l’agenda du mois de mars  de la Plage Digitale</strong></p>\n<figure><img src=\"/images/blog/64105011d60b3d69661ff2fb.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Software Crafters Strasbourg – 22/03/2023 </strong></p>\n<p>Cat-matic (antonyme de dogmatic) est un atelier pour découvrir ce que les autres pensent des règles (ou de leur absence) dans le développement de logiciels </p>\n<p><strong>‍ L’atelier lui-même dure 45 minutes. Il comporte 3 parties : </strong></p>\n<p>1️⃣ Les participants sont invités <em>à écrire leurs outils, modèles, processus, idées préférés</em> et à les placer les uns à côté des autres sur le sol ; </p>\n<p>2️⃣ Les gens s’autoorganisent en <em>groupes de 4 à 6 personnes </em>et sont invités à ramasser toutes les cartes qu’ils veulent sur le sol et à essayer de les démonter ; c’est-à-dire penser à des circonstances ou des situations où la “meilleure pratique” ne serait pas adéquate ou s’il existe un meilleur outil pour le travail à accomplir ; </p>\n<p>3️⃣ <em>Rétrospective partagée</em>, phase de mutualisation dans laquelle chaque groupe partage ses résultats avec les autres groupes. </p>\n<p>Si vous souhaitez participer à cet atelier, n’hésitez pas à l’indiquer en cliquant sur le bouton “Participer” ci-dessous ⤵️</p>\n<figure><img src=\"/images/blog/6410507406cc5009c3517973.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>HackSXB – 31/03/2023</strong></p>\n<p><strong>HackSXB</strong> est une communauté créative d’Alsace Digitale, constituée d’étudiants et d’actifs qui partagent l’envie de créer. Les ateliers, du même nom, organisés les derniers vendredis de chaque mois, sont des soirées dédiées à la programmation et à la bidouille. Sur des sujets libres et parfois avec des thématiques ciblées, chacun vient avec son projet ou participe à un projet commun<br><br>Du développement de jeux vidéo à la soudure de composants électroniques, on y retrouve des passionnés avec des compétences variées, qui partagent leur passion.<br><br><strong>Le HackSXB est ouvert à tous</strong> : pour créer ensemble et apprendre les uns des autres</p>\n<figure><img src=\"/images/blog/6419885e9dabee17a46e2d45-1.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Adhérer à l’association “La Plage Digitale” </strong></p>\n<p>En devenant membre de l’association, vous pourrez profiter de ce<strong> lieu de rencontres et d’échanges de l’écosystème entrepreneurial strasbourgeois</strong>. Cet espace est propice aux initiatives créatives tant individuelles que collectives. Dotée de nombreux espaces adaptés à sa vocation, la Plage Digitale est le <strong>point de départ incontournable pour votre futur projet</strong>. Vous pourrez également <strong>profiter des meetups</strong> ou soirées organisés par nos partenaires associatifs, institutionnels ou privés </p>\n<p>Il n’est jamais trop tard pour bien faire, alors rejoignez-nous en adhérant à la Plage Digitale‍</p>\n<p><a href=\"https://www.helloasso.com/associations/la-plage-digitale/adhesions/adhesions-la-plage-digitale-2023\" rel=\"noopener\">Adhérer à la Plage Digitale</a></p>\n<figure><img src=\"/images/blog/6419d2d3eeb05a7dbb00caaf.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>C’est arrivé le mois dernier … et près de chez vous ! </strong></p>\n<p><strong>À la Plage Digitale, il s’en est passé des choses en février : </strong></p>\n<p> Le Bootcamp Digi Start, le concours de La Tribune, deux événements organisés par Alsace Digitale, une journée carnaval, etc. </p>\n<p>Suivez-nous sur nos réseaux sociaux pour ne rien louper !</p>"
