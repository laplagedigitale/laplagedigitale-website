  - key: "soiree-vpn-freelan-mercredi-20-novembre-a-19h"
    fields:
      title: "Soirée VPN & Freelan mercredi 20 novembre à 19h"
      slug: "soiree-vpn-freelan-mercredi-20-novembre-a-19h"
      excerpt: "Inquiet par le buzz PRISM ? Agacé que la NSA puisse surveiller vos faits et gestes sur Internet ? Peut-être avez-vous entendu que le VPN est la solution ?…"
      body: "<p>Inquiet par le buzz PRISM ? Agacé que la NSA puisse surveiller vos faits et gestes sur Internet ?<br>\nPeut-être avez-vous entendu que le VPN est la solution ?</p>\n<p>L’ElsassJUG revient ce moi ci en compagnie de <a href=\"https://twitter.com/julienkauffmann\" rel=\"noopener\">Julien Kauffmann</a> qui viendra présenter dans un premier temps les VPN : les différents types, les solutions existantes, les contraintes des réseaux VPN.<br>\nPuis dans un second temps, il nous présentera la solution qu’il développe (<a href=\"http://www.freelan.org/\" rel=\"noopener\">Freelan</a>, vu chez <a href=\"http://korben.info/freelan.html\" rel=\"noopener\">Korben</a>), ses objectifs et ses différences avec les autres solutions VPN.</p>\n<p>Rendez-vous à La Plage le mercredi 20 novembre à 19h et n’oubliez pas de vous <a href=\"http://www.jugevents.org/jugevents/event/52535\" rel=\"noopener\">inscrire</a></p>"
