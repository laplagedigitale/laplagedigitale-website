  - key: "hackathon-invinotech"
    fields:
      title: "Hackathon InVinoTech"
      slug: "hackathon-invinotech"
      excerpt: "Le Hackathon InVinoTech est un véritable challenge qui se déroulera sur le weekend du vendredi 16 au dimanche 18 février 2018, au Château Kiener de Colmar. La…"
      body: "<p><img src=\"/images/blog/untitled-10x.webp\" alt=\"\" loading=\"lazy\"></p>\n<p>Le Hackathon InVinoTech est un véritable challenge qui se déroulera sur le weekend du <b>vendredi 16 au dimanche 18 février 2018</b>, au Château Kiener de Colmar.</p>\n<p>La sphère viticole évolue, les relations entre producteur et consommateur se modifient, la logistique et le stockage sont en train de se réinventer. Alors plutôt que de voir ces évolutions comme une contrainte, pourquoi ne pas les vivre comme une formidable opportunité pour se réinventer et utiliser tous les avantages d’un hackathon pour faire émerger de nouvelles pratiques collaboratives ? </p>\n<p>Petit nouveau dans ce monde des hackathons, <b>Invinotech</b> réunit professionnels et passionnés autour du monde viticole alsacien. Initiative soutenue par de nombreux acteurs dont le <i>CIVA</i> et la <i>ville de Colmar,</i> son objectif est de fédérer des acteurs de tous bords qui veulent s’impliquer, expérimenter et échanger autour de nouvelles solutions, soutenir l’innovation durable et la création de valeur dans la filière du vins alsaciens.</p>\n<p>La valeur ajoutée du hackathon permettra un échange de points de vue entre professionnels avertis, entrepreneurs dynamiques, étudiants prometteurs autour de problématiques communes comme de permettre aux viticulteurs de développer une expérience touristique augmentée, optimiser la production tout en conservant l’excellence, le travail artisanal de génération de vignerons et de savoir-faire, d’imaginer de nouvelles solutions pour diminuer l’impact du gibier durant les vendanges… et bien d’autres défis.</p>\n<p><b>Le Hackathon, un formidable outil d’innovation</b></p>\n<p>Un hackathon est une merveilleuse aventure humaine et de partage qui rassemble des talents, des compétences et des profils divers autour de projets communautaires. Développeurs, marketeurs, graphistes, entrepreneurs forment le temps d’un week-end des équipes autour de thématiques communes et passent 54h à réfléchir et à concevoir des projets innovants pour répondre à des problématiques préalablement formulées.</p>\n<p>Tel un marathon de la technologie, un tel rassemblement de part sa diversité, permet de faire émerger en un temps record, des solutions innovantes aux défis identifiés par les parties-prenantes du secteur et les participants.</p>\n<p>Le Hackathon Invinotech aura ainsi pour objectif d’améliorer le secteur viticole de la production à la commercialisation en France ou à l’export en combinant les opinions, les visions et les connaissances des hackathoniens.</p>\n<p><b>Au programme de cet évènement des dizaines de porteurs de projets autour desquels se constitueront les équipes : étudiants,  vignerons et oenologues, experts, startuppers, influenceurs ou simple curieux, tous férus d’innovation.</b></p>\n<p>Depuis plusieurs semaines, ces personnes réfléchissent aux défis qui leurs tiennent à coeur et qu’ils souhaitent proposer aux participants du #Invinotech. Les défis sont disponible sur : </p>\n<ul><li>Le sparkboard : <a href=\"https://invinotechcamp.sparkboard.com/\" rel=\"noopener\">https://invinotechcamp.sparkboard.com/</a></li><li>Le site officiel : <a href=\"https://invinotech.fr/\" rel=\"noopener\">http://invinotech.fr/</a></li></ul>\n<p><a href=\"https://www.eventbrite.fr/e/billets-hackathon-invinotech-40190195958#tickets\" rel=\"noopener\"><strong>Inscription sur Eventbrite</strong></a></p>"
      legacy_cover: "/images/blog/untitled-10x.webp"
      status: "published"
      published_at: "2018-01-31"
      categories: ["actualites", "evenements"]
      legacy_path: "/hackathon-invinotech/"
      created_at: "2018-01-31T12:11:25Z"
  - key: "challenge-industrie-mulhouse-2eme-edition"
    fields:
      title: "Challenge Industrie Mulhouse, 2ème Edition"
      slug: "challenge-industrie-mulhouse-2eme-edition"
      excerpt: "Suivez les défis en direct sur le Sparkboard du CIM Qu’est-ce que le Challenge Industrie Mulhouse ? UN VECTEUR D’INNOVATION POUR VOTRE ENTREPRISE Pour innover…"
      body: "<h2><img src=\"/images/blog/logo-cimdateslogan-e1511520154506.webp\" alt=\"\" loading=\"lazy\"></h2>\n<h4><strong><em>Suivez les défis en direct sur le <a href=\"https://cim2018.sparkboard.com/\" rel=\"noopener\">Sparkboard du CIM</a></em></strong></h4>\n<h2><strong>Qu’est-ce que le Challenge Industrie Mulhouse ?</strong></h2>\n<p><strong>UN VECTEUR D’INNOVATION POUR VOTRE ENTREPRISE</strong></p>\n<p><strong>Pour innover vite et ensemble</strong>. Le Challenge Industrie Mulhouse <strong>(CIM)</strong> est un événement destiné à faire émerger de nouveaux projets ou solutions dans un temps donné en s’appuyant sur la collaboration d’équipes composées de talents, de compétences, de parcours divers qui relèvent les défis lancés par votre entreprise.</p>\n<p><strong>Pour stimuler l’innovation par la collaboration dans votre entreprise</strong> : faire exprimer la créativité et le savoir-faire de vos salariés par la rencontre et l’échanges avec d’autres participants dans une dynamique de collaboration et de co-construction.</p>\n<p><strong>UNE COMPÉTITION CRÉATIVE DANS UN ESPRIT D’ÉMULATION LUDIQUE</strong></p>\n<p>Pour stimuler le partage et la créativité, <strong>les participants travaillent en équipes</strong> autour de défis posés par les porteurs de projets avec pour objectif la <strong>présentation d’un prototype à la fin de l’évènement.</strong></p>\n<p><strong>UN EVENEMENT DE CO-APPRENTISSAGE OUVERT A TOUS</strong></p>\n<p>Les participants ne se connaissent pas au préalable. Ils sont étudiants, collaborateurs d’entreprises, entrepreneurs, en recherche d’emploi. Ils sont graphistes, industriels, développeurs, marketeurs, ingénieurs, désigners, utilisateurs…chacun amène son expertise, ses idées et ses compétences.</p>\n<p>Tous vont cogiter spontanément et ensemble pendant 48h. Faire des rencontres improbables, échanger, procrastiner… Un évènement de ce type est un accélérateur de savoir par le faire, par la dynamique de co-apprentissage qui s’installe et qui permet l’émergence de nouvelles idées et de nouvelles compétences.</p>\n<p>C’est une opportunité d’expérimentation et une aventure humaine et de partage, où chacun dépasse ses limites et sort de sa zone de confort.</p>\n<p><strong>Même sans être porteur de défi, tout le monde gagne à participer</strong></p>\n<p><strong>DEROULEMENT DE L’EVENEMENT</strong></p>\n<p><strong>Jeudi 8 février à partir de 17h30 à l’ENSISA – rue des Frères Lumière :</strong></p>\n<ul><li>Accueil des participants</li><li>Présentation des défis par les porteurs de projet</li><li>Vote des participants et constitution des équipes autour des projets retenus</li></ul>\n<p><strong>Jusqu’au samedi 13h00 :</strong></p>\n<ul><li>Développement et expérimentations des solutions par les équipes</li></ul>\n<p><strong>Samedi 10 février à partir de 14h00 :</strong></p>\n<ul><li>Présentation des résultats de chaque équipe</li><li>Délibération du jury avec remise du prix vers 16h00</li></ul>\n<p><strong>Frais de participation</strong> pour chaque participant (comprenant :  repas, encadrement…) :</p>\n<ul><li>Etudiants et chômeurs : 20 € TTC (10 euros ENSISA)</li><li>Tarif plein : 60 € TTC (Early birds : 35 € TTC – inscription avant le 15 janvier 2018)</li></ul>\n<p><strong><a href=\"https://www.eventbrite.fr/e/billets-challenge-industrie-mulhouse-2018-41004548709\" rel=\"noopener\">Inscription sur Eventbrite</a></strong></p>"
      legacy_cover: "/images/blog/logo-cimdateslogan-e1511520154506.webp"
      status: "published"
      published_at: "2018-01-31"
      categories: ["actualites", "evenements"]
      legacy_path: "/challenge-industrie-mulhouse-2eme-edition/"
      created_at: "2018-01-31T12:44:44Z"
  - key: "strasbourg-startup-meetup-18-faire-les-bons-choix-technologiques-pour-sa-strategie-mobile"
    fields:
      title: "Strasbourg Startup Meetup #18 : “Faire les bons choix technologiques pour sa stratégie mobile”"
      slug: "strasbourg-startup-meetup-18-faire-les-bons-choix-technologiques-pour-sa-strategie-mobile"
      excerpt: "Vous avez un projet d’app mobile en tête ? Vous avez une Startup et vous voulez développer votre activité sur mobile ? Pas de panique, pour ce Meetup#18…"
      body: "<p><img src=\"/images/blog/ssu18bis.webp\" alt=\"\" loading=\"lazy\"></p>\n<p>Vous avez un projet d’app mobile en tête ? Vous avez une Startup et vous voulez développer votre activité sur mobile ? Pas de panique, pour ce Meetup#18, Strasbourg Startups by Alsace Digitale vous propose de venir à la rencontre d’experts de l’application mobile.</p>\n<p>On le sait, le marché de l’application mobile est en développement constant, mais si cela est fructueux pour certain, la concurrence devient de plus en plus rude. Pour percer, il faut donc s’armer au mieux et prendre les bonnes décisions dès le début.</p>\n<p>Se lancer dans un projet mobile nécessite de faire des choix technologiques adaptés pour ne pas se retrouver dans une impasse. Profitez du retour d’expérience et de l’expertise des intervenants pour réussir à développer votre stratégie mobile grâce à des choix technologiques adaptés à vos ambitions tout en optimisant votre budget .</p>\n<p>Voici une rapide présentations de nos intervenants</p>\n<ul><li><strong>Yoann Nussbaumer –  Founder de Chargemap</strong></li></ul>\n<p><em>Il présentera sa startup et fera son retour d’expérience 6 ans de développement et 4 versions de son application mobile.</em></p>\n<ul><li><strong>Pierre Fritsch – UX Designer</strong></li></ul>\n<p><em>Expert dans la création d’application mobile, il partagera son expérience sur design UI et sur les différents tests d’utilisateurs pour une app mobile !</em></p>\n<p>Pour participer à ce Meetup sur la stratégie de marque, rendez-vous le jeudi 29 mars, de 18h30 à 21h30 au Shadok, 25 Presqu’île André Malraux – 67100 Strasbourg.</p>\n<p>Inscriptions gratuites sur <a href=\"https://www.eventbrite.fr/e/billets-strasbourg-startup-meetup-18-strategie-mobile-43829604527\" rel=\"noopener\">Eventbrite</a></p>\n<p>Plus d’infos sur :</p>\n<ul><li><strong>La <a href=\"https://www.facebook.com/alsace.digitale/\" rel=\"noopener\">page Facebook d’Alsace Digitale</a></strong></li><li><strong>Le <a href=\"http://www.strasbourg-startups.com/\" rel=\"noopener\">site de Strasbourg Startups</a></strong></li></ul>"
      legacy_cover: "/images/blog/ssu18bis.webp"
