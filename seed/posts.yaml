      title: "Protection des données : Le Meetup #14 de Strasbourg Startups"
      slug: "protection-des-donnees-le-meetup-14-de-strasbourg-startups"
      excerpt: "Ce 14ème rendez-vous de la communauté des entrepreneurs strasbourgeois a lieu le mardi 23 mai et porte sur la question de la nouvelle réglementation sur les…"
      body: "<p><strong>Ce 14ème rendez-vous de la communauté des entrepreneurs strasbourgeois a lieu le mardi 23 mai et porte sur la question de la nouvelle réglementation sur les données et son approche par les startups ou entreprises innovantes.</strong></p>\n<p>En effet, au printemps 2018 entrera en vigueur cette nouvelle réglementation européenne, le <strong>GDPR</strong>, qui s’applique à <strong>toute entreprise qui « collecte, traite et stocke des données personnelles </strong>dont l’utilisation peut directement ou indirectement, via un tiers, identifier une personne ». Elle repose sur le <strong>droit fondamental</strong> que constitue, pour chaque citoyen, la <strong>protection de sa vie privée et de ses données personnelles.</strong></p>\n<p>Pour en parler, nous accueillerons <strong>Sébastien Heitzmann</strong>, gérant de 2le et <strong><a href=\"http://www.kiwi-backup.com/\" rel=\"noopener\">Kiwi Backup</a></strong> qui nous parlera de son expérience et de l’approche que peuvent avoir les startups et les entreprises innovantes, et <strong>Florence Gaullier</strong>, avocate, associée du cabinet <a href=\"http://www.verckengaullier.com/\" rel=\"noopener\"><strong>Vercken &amp; Gaullier</strong></a>.</p>\n<p>A l’issue des interventions, un moment convivial vous permettra d’échanger et de poser vos questions sur le sujet. Pour en savoir plus sur cette nouvelle réglementation en amont du Meetup, découvrez notre article sur le sujet <strong><a href=\"/blog/focus-sur-la-nouvelle-reglementation-de-protection-des-donnees\">ICI</a></strong>.</p>\n<p><strong>Y aller : Mardi 23 mai à 18h30 au Shadok – 26 presqu’île Malraux 67100 Strasbourg</strong></p>\n<p><strong><a href=\"https://www.eventbrite.fr/e/billets-meetup-14-strasbourg-startups-nouvelle-reglementation-europeenne-sur-les-donnees-cauchemar-ou-34567623693\" rel=\"noopener\">Inscription gratuite ICI</a></strong></p>\n<p>Page Facebook de l’événement : <a href=\"https://www.facebook.com/events/136378660240341/\" rel=\"noopener\">https://www.facebook.com/events/136378660240341/</a></p>\n<p>De plus, un atelier « <strong>Nouvelle directive sur les données personnelles (fichiers), comment se préparer au règlement européen</strong> ? » est organisé par le <strong>Club de la Presse</strong> le <strong>vendredi 9 juin de 8h30 à 10h.</strong></p>\n<p>Sera abordé les outils permettant de clarifier et de rendre pleinement opératoires les nouvelles règles européennes, en présence de <strong>Ralph Roggenbuck</strong>, juriste et <strong>Elphège Tignel</strong>, chargée de communication du Centre Européen de la Consommation.</p>\n<p><strong>Renseignements et inscription :</strong> <a href=\"mailto:info@club-presse-strasbourg.com\">info@club-presse-strasbourg.com</a></p>\n<p>Plus d’infos sur Strasbourg Startups : <a href=\"http://www.strasbourg-startups.com/\" rel=\"noopener\">http://www.strasbourg-startups.com/</a></p>"
      legacy_cover: "/images/blog/meetup14.webp"
      status: "published"
      published_at: "2017-05-16"
      categories: ["actualites", "evenements"]
      legacy_path: "/protection-des-donnees-le-meetup-14-de-strasbourg-startups/"
