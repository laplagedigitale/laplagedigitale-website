      slug: "janvier-2024"
      excerpt: "Janvier est le premier chapitre d’un livre de 365 pages, alors écrivons-le bien !"
      body: "<p><strong>Janvier est le premier chapitre d’un livre de 365 pages, alors écrivons-le bien ! </strong></p>\n<p><strong>Découvre l’agenda du mois de janvier de la Plage Digitale</strong></p>\n<figure><img src=\"/images/blog/facilitateurs-17-01-2.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Les Facilitateurs d’Alsace – 17/01/2024 – 18h30-20h30</strong></p>\n<p><strong>Quoi de mieux que de découvrir des outils de facilitation par l’action ? </strong></p>\n<p>Les Facilitateurs d’Alsace vous invitent à vivre l’expérience du Stuck à travers le Social Presencing Theather. </p>\n<p>Cette approche cherche à rendre visible l’invisible par des gestes ou des mouvements véritables. « Un « vrai mouvement » est une action qui naît de l’ouverture – un espace dans lequel notre corps, notre esprit et notre environnement sont synchronisés et ne sont pas en guerre les uns contre les autres. », ce vrai mouvement exprime notre essence et fait rayonner notre présence.</p>\n<p>  Cet atelier est ouvert à 20 facilitateurs maximum<br> La rencontre se poursuivra par un dîner en commun pour celles et ceux qui le souhaitent</p>\n<p><a href=\"https://a3awo.r.ag.d.sendibm3.com/mk/cl/f/sh/1f8JIKXwHGYox99KakIm5GCsI1/tsQHcSwzIRXY\" rel=\"noopener\">Participer à l’événement</a></p>\n<figure><img src=\"/images/blog/meetup-go-18-01.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Meetup Go SXB Go – 18/01/2024 – 18h00-20h30</strong></p>\n<p><strong>Premier rendez-vous des Gophers en 2024 ! </strong></p>\n<p>Quelques semaines après les fêtes, on reprend en douceur avec une discussion de ce que Go 1.22 nous réserve … </p>\n<p><a href=\"https://a3awo.r.ag.d.sendibm3.com/mk/cl/f/sh/1f8JIKXwHGZDuLoXXuodLdFHO9/g-zSAAnjICn4\" rel=\"noopener\">Contacter la communauté</a></p>\n<figure><img src=\"/images/blog/conf-inpi-22-01-2.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Conférence Propriété Industrielle – 22/01/2024 – 18h00-20h00</strong></p>\n<p><strong>Venez découvrir la Propriété Industrielle et en apprendre plus sur le rôle de l’INPI lors de ce meet-up ! </strong></p>\n<p>Qui n’a jamais entendu parler d’une marque ou d’un brevet ? A quoi cela sert-il ? Comment cela fonctionne-t-il ? Et les logiciels, comment peut-on les protéger ? </p>\n<p>L’INPI, la maison des innovateurs, est l’Institut National de la Propriété Industrielle. Outre la délivrance des titres de propriété industrielle tels que les brevets, les marques et les dessins et modèles, l’INPI possède également une mission de sensibilisation et d’accompagnement. </p>\n<p><a href=\"https://a3awo.r.ag.d.sendibm3.com/mk/cl/f/sh/1f8JIKXwHGZcrYTkV5KUc0HgUH/OOc8kcwjqQ5q\" rel=\"noopener\">Participer gratuitement</a></p>\n<figure><img src=\"/images/blog/16.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Les rendez-vous mensuels  !</strong></p>\n<p><strong>Achen’ight – 19/01/2024 – 19h00-23h00 </strong></p>\n<p>Achen’ight, c’est une soirée par mois où se rassemble l’équipe d’Achencraft pour discuter, rencontrer, rigoler, concevoir, …. bref tout ce qui permet au projet Achencraft de progresser !</p>\n<p><strong>Strasbourg Flutter Meetup Group – 09/01/2024 – 18h30-20h30</strong></p>\n<p>Les participants échangent en anglais ou allemand !</p>\n<p>▹ Join us for an engaging and interactive meetup where Flutter enthusiasts and developers come together. Our agenda for the evening is as follows:</p>\n<p>1️⃣ TechPress Debate: Riverpod vs. Cubit – Kick off the meetup with an in-depth discussion comparing Riverpod and Cubit. This session will explore the strengths and differences of these state management solutions, offering insights into their practical applications.</p>\n<p>2️⃣ Project Exchange – Share and discuss the current state of your projects. This is a great opportunity to gain insights, share challenges, and get feedback from fellow developers.</p>\n<p>3️⃣ Free Organization and Socializing – After the formal discussions, join us for a casual social gathering. We’ll head to a local pub to enjoy some beers, continue our conversations in a relaxed setting, and strengthen our community bonds.</p>\n<p>This meetup is not just about learning and sharing knowledge, but also about building connections and enjoying the camaraderie of the Flutter community. Don’t miss this chance to network, learn, and have fun!</p>\n<p><strong>Hack SXB – 26/01/2024 – 18h00-23h00</strong></p>\n<p>Venez partager votre passion pour la création avec un groupe d’étudiants et professionnels !</p>\n<p>Présentez vos propres projets ou rejoignez des projets collectifs sur des sujets variés, parfois thématiques, lors de cette soirée de programmation et de bricolage </p>\n<p><a href=\"https://a3awo.r.ag.d.sendibm3.com/mk/cl/f/sh/1f8JIKXwHGa1ol8xSFqLsNK5aP/hF5uu3SBHUml\" rel=\"noopener\">Achen’ight</a></p>\n<p><a href=\"https://a3awo.r.ag.d.sendibm3.com/mk/cl/f/sh/1f8JIKXwHGaQlxoAPQMD8kMUgX/Y3eCS-iZ0WFQ\" rel=\"noopener\">Strasbourg Flutter <br>Meetup Group</a></p>\n<p><a href=\"https://a3awo.r.ag.d.sendibm3.com/mk/cl/f/sh/1f8JIKXwHGapjATNMas4P7Otmf/bDgoGXZNdKne\" rel=\"noopener\">Hack SXB</a></p>\n<figure><img src=\"/images/blog/format-newsletter-53.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>C’est arrivé le mois dernier … et près de chez vous !</strong></p>\n<p><strong>À la Plage Digitale, il s’en est passé des choses en décembre :</strong></p>\n<p> Plusieurs rencontres de la communauté Strasbourg Flutter Meetup Group, un meetup Strasbourg Games Community, une rencontre Achen’ight, un meetup Deep Learning, un Strasbourg Developer Meetup, un meetup ADA Horizon… ! </p>\n<p>Suivez-nous sur nos réseaux sociaux pour ne rien louper !</p>\n<figure><img src=\"/images/blog/format-newsletter-52-1.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Adhérez à “La Plage Digitale” pour cette nouvelle année 2024 !</strong></p>\n<p>En devenant membre de l’association, vous pourrez profiter de ce <strong>lieu de rencontres et d’échanges de l’écosystème entrepreneurial strasbourgeois</strong>. Cet espace est propice aux initiatives créatives tant individuelles que collectives. Dotée de nombreux espaces adaptés à sa vocation, la Plage Digitale est le <strong>point de départ incontournable pour votre futur projet</strong>. Vous pourrez également <strong>profiter des meetups</strong> ou soirées organisés par nos partenaires associatifs, institutionnels ou privés </p>\n<p>Il n’est jamais trop tard pour bien faire, alors rejoignez-nous en adhérant à la Plage Digitale ‍</p>\n<p><a href=\"https://a3awo.r.ag.d.sendibm3.com/mk/cl/f/sh/1f8JIKXwHGbEgN8aJlNvfURIsn/9yqHkgoOt5zE\" rel=\"noopener\">Devenir un plagiste</a></p>"
