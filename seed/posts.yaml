  - key: "soiree-elasticsearch-maitrisez-le-projet-open-source-le-18-septembre"
    fields:
      title: "Soirée Elasticsearch : maîtrisez le projet open source le 18 septembre"
      slug: "soiree-elasticsearch-maitrisez-le-projet-open-source-le-18-septembre"
      excerpt: "La soirée L’ElsassJUG organise sa soirée de rentrée le mercredi 18 septembre à 19h à La Plage Digitale. Le thème de la soirée sera Elasticsearch et sera…"
      body: "<h2>La soirée</h2>\n<p>L’<a href=\"http://www.elsassjug.org/xwiki/bin/view/Main/WebHome\" rel=\"noopener\"><strong>ElsassJUG</strong> </a>organise sa soirée de rentrée le mercredi 18 septembre à 19h à La Plage Digitale. Le thème de la soirée sera <a href=\"http://www.elasticsearch.org/\" rel=\"noopener\"><strong>Elasticsearch</strong></a> et sera animée par <a href=\"https://github.com/dadoonet\" rel=\"noopener\"><strong>David Pilato</strong></a>.</p>\n<p>Vous utilisez encore des requêtes SQL pour faire des recherches ? Vos utilisateurs vous reprochent de ne pas pouvoir chercher sur toutes les rubriques ? Votre temps de réponse moyen est supérieur à la demi-seconde avec seulement quelques millions de documents ? Il vous faut 3 jours pour produire des statistiques sur vos données ? Vous rêvez d’offrir une recherche « à la google » sur les données de votre SI ?</p>\n<p><strong>Ne cherchez plus ! Cette conférence est faite pour vous.</strong></p>\n<p>David présentera au cours de la soirée pourquoi et comment il est passé de la recherche SQL à Elasticsearch en détaillant les apports de ce moteur par rapport à une solution pure Lucene. Voici le déroulé de la conférence :<br>\n– Pourquoi Elasticsearch ?<img src=\"/images/blog/1aecf795625bbc7251068cfbc39800ab.webp\" alt=\"Logo elasticsearch\" loading=\"lazy\"><br>\n– L’indexation<br>\n– La recherche<br>\n– La collecte de données (rivers)<br>\n– Les facettes et le principe de navigation par facettes<br>\n– La scalabilité horizontale<br>\n– L’analyse et le mapping<br>\n– La percolation<br>\n– La communauté</p>\n<p><strong>Pour vous inscrire, cliquez sur <a href=\"http://www.jugevents.org/jugevents/event/51515\" rel=\"noopener\">ce lien</a> !</strong></p>\n<p><strong>Cette soirée sera live-streamé, une première à la Plage Digitale. Il faudra vous rendre sur <a href=\"http://www.livestream.com/laplagedigitale\" rel=\"noopener\">notre chaîne LiveStream</a>, au début de la soirée, pour accéder au live-stream.<br>\n</strong></p>\n<h2>Le speaker</h2>\n<p>David Pilato est « technical advocate » chez Elasticsearch.com, après avoir passé les deux dernières années à promouvoir le projet open-source Elasticsearch, dont il anime la communauté française. Fidèle des JUG, il a donné une conférence sur le sujet lors de la première édition de Devoxx France en avril 2012 et sillonne désormais les routes de France pour partager sa passion.</p>\n<p>Il a implémenté un certain nombre de plugins pour l’écosystème Elasticsearch (Rivers RSS, FileSystem et DropBox, Factories Spring). Il a également implémenté Elasticsearch pour plusieurs projets, dont une importante administration française. Il est le co-auteur du projet open-source [<a href=\"http://www.scrutmydocs.org/\" rel=\"noopener\">Scrutmydocs.org</a>] basé sur Elasticsearch qui permet de disposer d’un moteur de recherche « à la google » des documents de vos disques durs.</p>\n<blockquote><p><img src=\"/images/blog/test2.webp\" alt=\"test2\" loading=\"lazy\">@dadoonet et @ElasticsearchFR</p></blockquote>"
      legacy_cover: "/images/blog/eslogo.webp"
      status: "published"
      published_at: "2013-09-03"
      categories: ["evenements"]
      legacy_path: "/soiree-elasticsearch-maitrisez-le-projet-open-source-le-18-septembre/"
      created_at: "2013-09-03T12:41:52Z"
  - key: "demonight-promouvoir-la-scene-startup-strasbourgeoise"
    fields:
      title: "DemoNight #2 : promouvoir la scène startup strasbourgeoise"
      slug: "demonight-promouvoir-la-scene-startup-strasbourgeoise"
      excerpt: "L’une des caractéristiques d’Alsace Digitale est de s’impliquer dans l’écosystème des startups à Strasbourg. Tout d’abord, en les accueillant au sein de la…"
      body: "<p>L’une des caractéristiques d’Alsace Digitale est de s’impliquer dans l’écosystème des startups à Strasbourg. Tout d’abord, en les accueillant au sein de la Plage Digitale. Ensuite, en leur proposant des outils pour les aider à se développer et se faire connaître (<a href=\"http://strasbourg.startupweekend.org/\" rel=\"noopener\">Startup Weekend Strasbourg </a>et <a href=\"http://strasbourg-startups.com/\" rel=\"noopener\">Strasbourg Startups</a>). Enfin, en les mettant sous le feu des projecteurs.</p>\n<p>Après une première édition à fort succès, Alsace Digitale a décidé d’organiser une DemoNight #2 à la Plage Digitale le 26 septembre prochain. Lancé lors de l’<a href=\"/blog/fetez-lete-a-strasbourg-avec-ledgefest\">EdgeFest</a>, le principe est de découvrir 10 startups alsaciennes innovantes. Chacune aura cinq minutes et pas une minute de plus pour présenter son projet. Une vraie performance, un vrai show !<br>\n<strong>Alors n’attendez plus et réservez gratuitement votre billet pour la soirée. Les places sont limitées à 50 spectateurs, nous live-streamerons la soirée pour les autres 😉</strong></p>\n<p>Lors de la première édition, les spectateurs ont pu découvrir huit startups. Certaines ont, depuis, obtenu une couverture médiatique. C’est le cas notamment de <a href=\"http://reveauxlettres.fr/\" rel=\"noopener\">Rêve aux Lettres</a>, un système de correspondance pour développer l’imaginaire des enfants. E-Alsace et les DNA se sont intéressés au projet.<br>\n<strong>Vous voulez pitcher votre idée à Demo Night ? Envoyez-nous un mail à </strong><strong>hello@strasbourg-startups.com en présentant votre projet et son état d’avancement.</strong></p>\n<p><a href=\"http://www.eventbrite.fr/event/8186446883?ref=ebtn\" rel=\"noopener\"><img src=\"http://www.eventbrite.fr/custombutton?eid=8186446883\" alt=\"Eventbrite - DemoNight #2\" loading=\"lazy\"></a></p>\n<blockquote><p>Lieu: La Plage<br>\nDate: jeudi 26 septembre à 19h<br>\nPlaces: 50 personnes<br>\nLive-Stream: OUI<br>\nPrésenter Un projet: Envoyer un mail à hello@strasbourg-startups.com</p></blockquote>"
      legacy_cover: "/images/blog/vignette-demo-night.webp"
      status: "published"
      published_at: "2013-09-05"
      categories: ["evenements"]
      legacy_path: "/demonight-promouvoir-la-scene-startup-strasbourgeoise/"
      created_at: "2013-09-05T14:04:40Z"
  - key: "coworker-de-la-semaine-helene-ehrhart-la-freelance-convertie-au-coworking"
    fields:
      title: "[COWORKER DE LA SEMAINE] Hélène Ehrhart, la freelance convertie au coworking"
      slug: "coworker-de-la-semaine-helene-ehrhart-la-freelance-convertie-au-coworking"
      excerpt: "Changeons un peu notre habitude : le coworkeur de la semaine sera une coworkeuse ! Hélène, graphiste freelance, est à la Plage Digitale depuis presque 6 mois.…"
      body: "<p><strong>Changeons un peu notre habitude : le coworkeur de la semaine sera une coworkeuse ! Hélène, graphiste freelance, est à la Plage Digitale depuis presque 6 mois. Après avoir vécu le côté « cosy » du télétravail à la maison, elle a vite adopté le principe de coworking. Cette indépendance, elle la gère sous le nom de <a href=\"http://caico.fr/\" rel=\"noopener\">Caïco</a>. Voici donc le témoignage d’une freelance créative parmi les geeks.</strong></p>\n<p><b>1) </b><b>Quelle est ta profession ?</b></p>\n<p><img src=\"/images/blog/helene1.webp\" alt=\"Hélène Ehrhart, graphiste freelance - Caïco\" loading=\"lazy\"></p>\n<p>Je suis graphiste freelance. Issu d’un BTS en communication visuelle, j’ai intégré 2 ans après ma formation, une petite agence de communication, où j’ai fait mes armes. Je me suis mise ensuite à mon compte. Je travaille toujours avec l’agence dans laquelle j’étais salariée. À côté, le bouche-à-oreille et les contacts me ramène le reste de mes clients.</p>\n<p>Concrètement, je travaille essentiellement dans le domaine du print pour les petites et moyens entreprises. Je conçois logos et chartes graphiques, ainsi que tous les supports imprimables : cartes de visite, plaquettes, catalogues, affiches, flyers, signalétique, etc…agence de communication, où j’ai fait mes armes. Je me suis mise ensuite à mon compte. Je travaille toujours avec l’agence dans laquelle j’étais salariée. À côté, le bouche-à-oreille et les contacts me ramène le reste de mes clients.</p>\n<p><b>2) </b><b>Pourquoi avoir opté pour l’indépendance par la suite ?</b></p>\n<p>C’est d’abord une histoire de challenge personnel, en plus dans mon métier c ‘est possible sans trop d’investissements. Dans mon agence il n’y avait plus de progression possible, et j’avais fait un peu le tour de mon poste. C’est toujours intéressant de s’ouvrir à de nouvelles compétences, la comptabilité, la gestion, les relations fournisseurs, …</p>\n<p><img src=\"/images/blog/logo-caico.webp\" alt=\"logo-caïco\" loading=\"lazy\"></p>\n<p><b>3) </b><b>Salarié, freelance… Et le coworking dans tout ça ?</b></p>\n<p>Mes anciens bureaux étaient déjà « partagés », nous étions cinq entreprises dans les mêmes locaux,  mais chacun avait son espace fermé. Ma première maternité m’a amené à travailler de chez moi, mais au bout de quelques mois ce n’était plus possible. Il y en a qui y arrivent et d’autres qui n’y arrivent pas ! Il me fallait un lieu hors de la maison, histoire de « débrancher » et surtout de retrouver une vie sociale. La Plage a été une très bonne solution, en plus de retrouver en cadre, c’est très intéressant de rencontrer d’autres entrepreneurs et de partager avec eux.</p>\n<blockquote><p>Hélène Ehrhart, graphiste freelance<br>\n<a href=\"http://caico.fr/\" rel=\"noopener\">caïco.fr</a></p></blockquote>"
      legacy_cover: "/images/blog/helene2.webp"
