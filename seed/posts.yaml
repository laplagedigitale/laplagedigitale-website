  - key: "les-6-cles-pour-lentrepreneur-juilletiste"
    fields:
      title: "Les 6 clés pour l’Entrepreneur juilletiste !"
      slug: "les-6-cles-pour-lentrepreneur-juilletiste"
      excerpt: "1 – Je vais écouter les témoignages des super entrepreneurs de ma région lors de Startup Stories jeudi 29 juin dans le style Raconte ta vie, ton oeuvre. 2…"
      body: "<p>1 – Je vais écouter les témoignages des super entrepreneurs de ma région lors de <a href=\"https://www.eventbrite.fr/e/billets-startup-stories-4-35265706678\" rel=\"noopener\">Startup Stories</a> jeudi 29 juin dans le style Raconte ta vie, ton oeuvre.</p>\n<p>2 – Je prends mes tickets pour assister à la <a href=\"https://www.eventbrite.fr/e/billets-demo-night-12-35265413802\" rel=\"noopener\">Démo Night</a> du mercredi 5 juillet (et j’emmène mes amis) Garanti 100% demo, 0% blabla.</p>\n<p>3 – Je vais networker sur la terrasse de l’UGC à l’<a href=\"https://www.facebook.com/events/247719512381123/\" rel=\"noopener\">Apéro Entrepreneur</a> le jeudi 6 juillet (en plus il paraît qu’il y aura des lorrains et des franc comtois).</p>\n<p>4 – Je vais <a href=\"/espace-coworking\">coworker à la Plage Digitale</a> pour ne pas perdre le rythme pendant l’été (les idées c’est comme le jardin, ça s’entretient !). Y’a la clim ?</p>\n<p>5 – Je prends un peu de repos le 7 juillet à <a href=\"https://www.facebook.com/events/430096677371073/\" rel=\"noopener\">EdgeNight</a> et me laisse porter par la musique sur la plage, casque aux oreilles. </p>\n<p>6 – J’<a href=\"https://www.helloasso.com/associations/alsace-digitale\" rel=\"noopener\">adhère à Alsace Digitale</a> parce que je kiffe trop ! </p>\n<p>A toi de jouer !</p>"
