  - key: "le-rendez-vous-professionnel-du-numerique-2018-cest-a-gen-au-centre-des-congres-robert-schuman-a-metz"
    fields:
      title: "Le rendez-vous professionnel du numérique 2018 c’est à #GEN !"
      slug: "le-rendez-vous-professionnel-du-numerique-2018-cest-a-gen-au-centre-des-congres-robert-schuman-a-metz"
      excerpt: "Retrouvez l’association Alsace Digitale le 13 septembre de 11h45 à 12h30 autour d’un verre pour débuter cet évènement ! Vous pouvez y retrouverez les Startups…"
      body: "<p>Retrouvez l’association Alsace Digitale le 13 septembre de 11h45 à 12h30 autour d’un verre pour débuter cet évènement !</p>\n<p>Vous pouvez y retrouverez les Startups Schlouk Map, Knot, TrackInMedia et d’autres.</p>\n<p>Nous serons également sur le stand de la CCI Alsace Eurométropole !</p>\n<p>Découvrir le monde du numérique et l’écosystème de la région Grand-Est, Lancer son activité, se perfectionner, gagner en compétences : toutes les raisons sont bonnes pour nous rejoindre à #GEN !</p>\n<p>Plus d’information sur notre évènement Facebook <a href=\"https://www.facebook.com/events/285578775376955/\" rel=\"noopener\">LA</a>.</p>\n<p>Toute la programmation sur le site officiel de l’évènement #GEN : <a href=\"https://gen.grandestnumerique.org/venir-a-gen/\" rel=\"noopener\">ICI</a></p>\n<p>#GEN 2018 c’est  Jeudi 13 et vendredi 14 septembre</p>\n<p>Au Centre des Congrès Robert Schuman<br>\nParvis de l’Amphithéâtre<br>\n110 rue aux Arènes<br>\n57000 Metz</p>"
