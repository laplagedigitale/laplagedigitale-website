  - key: "barcamp-startup-weekend-concours-comment-booster-mon-demarrage"
    fields:
      title: "Barcamp, Startup weekend, concours… Comment booster mon démarrage ?"
      slug: "barcamp-startup-weekend-concours-comment-booster-mon-demarrage"
      excerpt: "Dans le cadre du salon “Créer et Développer sa Boîte en Alsace”, Alsace Digitale propose un atelier pour vous prouver de B à S comment doper son démarrage en…"
      body: "<p>Dans le cadre du salon <em>“Créer et Développer sa Boîte en Alsace”</em>, Alsace Digitale propose un atelier pour vous prouver de B à S comment doper son démarrage en s’ouvrant aux autre tout en gardant le CAP.</p>\n<p>Voici déjà quelques commandements :</p>\n<p>– Tester, tester, tester : confronter / conforter ses idées<br>\n– Se faire un réseau<br>\n– Savoir s’entourer / Approfondir ses connaissances</p>\n<p>Bref passer en mode open !</p>\n<p>Mais n’en perdons pas notre alphabet :</p>\n<p><strong>B comme Barcamp</strong></p>\n<p>Un Barcamp est une rencontre, une non-conférence ouverte qui prend la forme d’ateliers-événements participatifs où le contenu est fourni par les participants qui doivent tous, à un titre ou à un autre, apporter quelque chose au Barcamp</p>\n<p><strong>C comme Co-Working</strong></p>\n<p>Chez Alsace Digitale c’est tous les jours à la Plage ! Les Plages Digitales sont plus que des espaces de co-working, elles sont des Tiers Lieux ou l’entrepreneur va pouvoir évoluer grâce à son environnement : l’infrastructure matérielle certes mais aussi “ses collègues”, les animations proposées (permanences, rencontres…)</p>\n<p><strong>C comme Concours</strong></p>\n<p>L’attrait des concours est vraiment de tester son discours. Plus une idée est percutante plus elle doit être comprise aisément.<br>\nFaire face à un jury de professionnels qui vont pouvoir être là pour vous aider à vous améliorer, trouver les failles dans votre discours et finalement vraiment challenger votre solution, est un passage obligatoire. Et qui sait ? Vous trouverez peut-être vos premiers investisseurs.</p>\n<p><strong>H comme Hackathon</strong></p>\n<p>C’est l’évènement phare de l’open innovation. 48 à 54h intense où vous collaborez avec des personnes que vous ne connaissez pas, dont les compétences vous échappent mais toutes mues par une même envie. Innover. Le terme est constitué de hack (activité émergente, qui semble devoir s’épanouir avec l’Internet) et marathon. La référence au « Marathon » se justifie par le travail sans interruption des développeurs pendant deux jours, généralement lors d’un week-end.</p>\n<p><strong>M comme Meetup</strong></p>\n<p>Pour reprendre la baseline de cette application dont les technophiles se sont emparées. L’idée est simple : nous faisons mieux ce qui compte pour nous lorsque nous le faisons à plusieurs. Et c’est ce que fait Meetup, rassembler les gens pour faire, explorer et apprendre. “Meetup” rassemble des personnes dans des milliers de villes afin qu’elles fassent ensemble ce qu’elles aiment.</p>\n<p><strong>S comme Startup Week-end</strong></p>\n<p>Un startup week-end permet de tester une idée ou un projet. A l’instar d’un hackathon, il permet aussi de constituer des équipes aux profils variés et complémentaires. La partie la plus importante est l’expérience humaine qui marque chaque participant. C’est The Place to be pour lancer sa startup, il permet de tester son projet, trouver des associés, des futurs collaborateurs…</p>\n<p>Infos pratiques :</p>\n<p>Salon <em>“Créer et Développer sa Boîte en Alsace”</em><br>\nAu Palais de la Musique et des Congrès, Place de Bordeaux, à Strasbourg<br>\nMardi 14 novembre de 9h à 19h en continu (<strong>Atelier Alsace Digitale à 10h</strong>)<br>\nInformations et inscription gratuite sur le <a href=\"http://www.creer-sa-boite-en-alsace.fr/\" rel=\"noopener\">site officiel</a></p>"
      legacy_cover: "/images/blog/actu-salon-csbea-500x368.webp"
      status: "published"
      published_at: "2017-10-25"
      categories: ["actualites"]
      legacy_path: "/barcamp-startup-weekend-concours-comment-booster-mon-demarrage/"
      created_at: "2017-10-25T08:53:22Z"
  - key: "workshop-pitch-ta-startup"
    fields:
      title: "Workshop « Pitch ta Startup »"
      slug: "workshop-pitch-ta-startup"
      excerpt: "Pour vous préparer à la quatrième édition de La Social Cup 2018 ainsi que le prochain Startup Weekend Strasbourg (du 24 au 26 novembre), Alsace Digitale et…"
      body: "<p>Pour vous préparer à la quatrième édition de <a href=\"/blog/la-social-cup-2018\">La Social Cup 2018</a> ainsi que le prochain <a href=\"/blog/startup-weekend-strasbourg-7\">Startup Weekend Strasbourg</a> (du 24 au 26 novembre), Alsace Digitale et MakeSense vous proposent un workshop SenseFiction afin de vous entraîner à pitcher votre projet comme un pro. Lors de cette soirée, nous tenterons de définir quels points de votre projet mettre en avant, quels mots-clés utiliser, quel ton prendre ou encore quelle attitude adopter.</p>\n<p>Bref, du brainstorming et du coaching de haut niveau pour vous permettre de donner le meilleur de vous-même afin de convaincre le jury et le public lors de La Social Cup 2018, qui opposera douze grandes villes et dont la grande finale aura lieu au mois de février, à Paris. Nous croyons en vos ambitions et sommes persuadés que vous ferez honneur à l’esprit startup de notre belle ville de Strasbourg ! </p>\n<p>Le mercredi 15 novembre de 19h à 22h, à La Plage Digitale<br>\nInscription gratuite obligatoire sur <a href=\"https://www.eventbrite.fr/e/billets-workshop-pitch-ta-startup-37496862124\" rel=\"noopener\">EventBrite</a></p>"
      legacy_cover: "/images/blog/microphone-1159791-640.webp"
      status: "published"
      published_at: "2017-10-25"
      categories: ["actualites"]
      legacy_path: "/workshop-pitch-ta-startup/"
      created_at: "2017-10-25T15:11:42Z"
  - key: "startup-weekend-strasbourg-7"
    fields:
      title: "Startup Weekend Strasbourg #7"
      slug: "startup-weekend-strasbourg-7"
      excerpt: "Vous l’attendiez tous avec impatience ! Le Startup Weekend revient à Strasbourg en 2017 ! Vous vous sentez prêt à endosser le rôle du jeune entrepreneur que…"
      body: "<p>Vous l’attendiez tous avec impatience ! Le Startup Weekend revient à Strasbourg en 2017 ! Vous vous sentez prêt à endosser le rôle du jeune entrepreneur que vous rêvez tant de devenir ? Si la réponse est oui, Alsace Digitale vous donne rendez-vous, du 24 au 26 novembre, pour trois jours de plongée dans l’univers trépidant de la startup.</p>\n<p>Tout d’abord, vous aurez à élaborer et tester votre idée principale, puis vous aurez 60 secondes top chrono pour en faire le pitch face à un public de vos pairs. Les meilleures idées seront conservées durant l’élaboration organique des groupes de travail. Une fois que vous aurez trouvé vos nouveaux collègues de travail, la véritable compétition commence : les 54 heures suivantes seront consacrées aux études de marché, au prototypage, à l’élaboration d’un business model… bref, toutes les étapes nécessaires à la création de votre futur bébé.</p>\n<p>La tâche peut sembler ardue, mais n’ayez pas peur : de nombreuses conférences auront lieu durant ces trois jours afin de vous aider à stimuler votre matière grise. Sans oublier nos coachs, qui se feront un plaisir de venir vous prêter main-forte en cas de besoin. Le dernier jour, dimanche, aura lieu la finale : les équipes devront convaincre un jury composé de professionnels. Au final les équipes primées pourront continuer l’aventure coachées par des partenaires efficaces et impliqués.</p>\n<p>Pas de projet ? Mais l’envie de participer à une aventure collective unique. Le Startup Weekend est là pour vous. Apprendre des autres en construisant ensemble un projet qui pourra voir le jour dans la vraie vie. Quoi de plus excitant !</p>\n<p>Les conférences inspirantes sont également ouvertes à tous les publics.</p>\n<p>Pour plus d’informations, le site officiel de <a href=\"http://communities.techstars.com/france/strasbourg/startup-weekend/11431\" rel=\"noopener\">Startup Weekend Strasbourg</a><br>\nInscriptions sur <a href=\"https://www.eventbrite.com/e/startup-weekend-strasbourg-1117-tickets-36444991952\" rel=\"noopener\">Eventbrite</a><br>\nDate : du 24 au 26 novembre 2017<br>\nLieu : CCI Campus Alsace (234 avenue de Colmar, 67100 Strasbourg)</p>"
      legacy_cover: "/images/blog/sw-banner.webp"
      status: "published"
      published_at: "2017-10-25"
      categories: ["actualites", "evenements"]
      legacy_path: "/startup-weekend-strasbourg-7/"
      created_at: "2017-10-25T15:12:01Z"
  - key: "la-social-cup-2018"
    fields:
      title: "La Social Cup 2018"
      slug: "la-social-cup-2018"
      excerpt: "Vos deux grandes passions dans la vie sont l’entrepreneuriat et le social. Après des années passées à rechercher comment concilier les deux, vous avez…"
      body: "<p>Vos deux grandes passions dans la vie sont l’entrepreneuriat et le social. Après des années passées à rechercher comment concilier les deux, vous avez malheureusement baissé les bras… Réjouissez-vous, <a href=\"https://www.makesense.org/\" rel=\"noopener\">MakeSense</a>, <a href=\"https://www.kisskissbankbank.com/\" rel=\"noopener\">KissKissBankBank</a> et <a href=\"https://www.labanquepostale.fr/\" rel=\"noopener\">La Banque Postale</a> vous ont entendu et vous offrent la possibilité de lier l’utile à l’agréable à l’occasion de La Social Cup 2018. Vous allez pouvoir découvrir l’entrepreneuriat social, et créer votre propre startup, grâce aux conseils avisés de MakeSense et d’Alsace Digitale.</p>\n<p>Ce n’est pas une surprise, notre société fait face à de nombreux problèmes (pollution, chômage, exclusion sociale, vieillissement, éducation…) et c’est à <strong>vous</strong> de prendre les choses en mains pour créer des lendemains qui chantent. MakeSense vous accompagnera durant toutes les étapes de votre projet social, afin de s’assurer qu’il puisse se réaliser et vous permettre de peut-être changer le monde !</p>\n<p>La Social Cup est un exemple de solidarité, voilà pourquoi votre travail sera avant tout un travail d’équipe. Plusieurs disciplines et personnes se rencontreront, riches de leurs expériences et de leurs compétences. A la clé pour les équipes gagnantes lors de la Battle Final à Paris le 07 février 2018: une campagne de crowdfunding (financement participatif) allant de 500€ à 3000€ sur KissKissBankBank, soutenue par La Banque Postale, ainsi qu’une incubation de 12 mois au SenseCube, grâce à MakeSense.</p>\n<p>Même principe qu’un startup week-end. C’est un évènement collaboratif où toutes les energies sont les bienvenues.</p>\n<p>La Social Cup à Strasbourg a lieu dans le cadre de la <a href=\"http://www.strasbourg.eu/developpement-rayonnement/developpement-economique/entrepreneuriat-emploi/see\" rel=\"noopener\">Semaine de l’Entrepreneur Européen</a></p>\n<p>Inscrivez-vous à <a href=\"https://www.lasocialcup.com/je-minscris\" rel=\"noopener\">l’atelier SenseFictions de Strasbourg</a>, organisé par Alsace Digitale et MakeSense.</p>"
      legacy_cover: "/images/blog/59d776e375838.webp"
      status: "published"
      published_at: "2017-10-25"
      categories: ["actualites", "evenements"]
      legacy_path: "/la-social-cup-2018/"
