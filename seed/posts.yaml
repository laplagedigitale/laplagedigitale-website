  - key: "challenge-industrie-mulhouse-2019"
    fields:
      title: "Challenge Industrie Mulhouse 2019"
      slug: "challenge-industrie-mulhouse-2019"
      excerpt: "Co-organisée par le Technopole de Mulhouse, Alsace Digitale et l’ENSISA, la 3ème édition du Challenge Industrie Mulhouse se déroulera du 29 au 30 mars 2019 à…"
      body: "<p><strong>Co-organisée par le Technopole de Mulhouse, Alsace Digitale et l’ENSISA, la 3ème édition du Challenge Industrie Mulhouse se déroulera du 29 au 30 mars 2019 à l’INSISA. </strong></p>\n<p><b>Retrouvez les défis sur le </b><a href=\"https://cim2019.sparkboard.com/\" rel=\"noopener\"><b>Sparkboard du CIM</b></a></p>\n<h2><b>Le Challenge Industrie Mulhouse</b></h2>\n<p>Cet hackathon est un événement destiné à démultiplier les idées et faire émerger de nouveaux projets en l’espace de deux jours en équipe. Composés de participants de tout horizon avec des talents et compétences variés, les équipes s’affrontent pour relever des défis d’innovations liés à un thème ou secteur d’activité et générer de nouvelles solutions à des problématiques d’entreprises.</p>\n<p><b>48 heures pour prototyper une solution innovante</b> et la présenter devant un jury de professionnel : tel est l’objectif des équipes et les participants doivent collaborer ensemble pour y arriver. C’est un moment de co-apprentissage favorisant les idées et les partages de connaissances.</p>\n<p>Les projets résultant de cet événement pourront se poursuivre au sein de l’entreprise proposé le défi ou permettre la création d’une startup.</p>\n<p><b>Même sans proposer de défi, tout le monde gagne à y participer ! <br>\n</b>Rencontrer et échanger avec des personnes que vous ne connaissiez pas avant, créer et expérimenter : venez vivre cette aventure humaine où chacun dépasse ses limites et sort de sa zone de confort.</p>\n<h4><b>Déroulement de l’événement, </b>à l’ENSISA, rue des Frères Lumière, Mulhouse</h4>\n<p><b>Vendredi 29 mars, à partir de 08h00 :</b></p>\n<ul><li>Accueil des participants</li><li>Présentation des défis par les porteurs de projet</li><li>Vote des participants et constitution des équipes autour des projets retenus</li><li>Développement et expérimentations des solutions par les équipes</li></ul>\n<p><b>Samedi 30 mars, à partir de 14h :</b></p>\n<ul><li>Présentation des résultats de chaque équipe</li><li>Délibération du jury avec remise des prix vers 16h00</li></ul>\n<h4><b>Frais de participation</b> pour chaque participant (comprend repas, encadrement, …)</h4>\n<p><a href=\"https://www.eventbrite.fr/e/billets-challenge-industrie-mulhouse-2019-53387509478\" rel=\"noopener\">Prendre mon billet</a></p>\n<ul><li>Étudiants et demandeurs d’emploi : 20 € TTC (10 € ENSISA)</li><li>Plein tarif : 60 € TTC (early birds : 35 € – inscription jusqu’au 28 février 2019)</li></ul>\n<p><b>Plus d’informations</b> : <a href=\"http://www.technopole-mulhouse.com/nos-evenements/challenge-industrie-mulhouse\" rel=\"noopener\">Challenge Industrie Mulhouse</a></p>"
      legacy_cover: "/images/blog/cim-2019-logo.webp"
      status: "published"
      published_at: "2019-01-25"
      categories: ["actualites"]
      legacy_path: "/challenge-industrie-mulhouse-2019/"
      created_at: "2019-01-25T13:31:22Z"
  - key: "ecole-dhiver-2019-industrie-du-futur"
    fields:
      title: "École d’Hiver 2019 – Industrie du futur"
      slug: "ecole-dhiver-2019-industrie-du-futur"
      excerpt: "Organisée par la Faculté des Sciences Économiques et de Gestion en partenariat avec l’IUT d’Haguenau et Alsace Digitale, la 1ère édition de l’École d’Hiver…"
      body: "<p><b>Organisée par la Faculté des Sciences Économiques et de Gestion en partenariat avec l’IUT d’Haguenau et Alsace Digitale, la 1ère édition de l’École d’Hiver sur l’Industrie du Futur se déroulera du 25 au 27 février 2019.</b></p>\n<h2><b>École d’Hiver – Industrie du Futur</b></h2>\n<p>Cet événement est l’opportunité d’une <b>véritable rencontre</b> autour d’une problématique commune : la <b>transition vers l’Industrie 4.0</b>.</p>\n<p>Au cours de ces trois jours, seront proposés des conférences, ateliers sur des thèmes variés, visites d’entreprises et un salon. Un programme riche et diversifié qui permettra d’aborder sous un nouvel angle qui favorise les échanges entre professionnels de tout horizon, partenaires académiques et politiques, étudiants, praticiens, …</p>\n<p>L’École d’Hiver sur l’Industrie du Futur s’inscrit dans les actions du programme “<a href=\"https://upperrhine40.eu/\" rel=\"noopener\">Upper Rhine 4.0</a>”. Ce projet, soutenu par le Fonds européen de développement régional (FEDER), vise à faire du Rhin supérieur un territoire de référence et de compétitivité dans le domaine de l’industrie 4.0.</p>\n<h4><b>Programme</b></h4>\n<h4>Journée 1 – 25/02/2019</h4>\n<p>La 1ère journée est une journée inspirante avec au programme des conférences, débats, tables rondes et retours d’expérience des intervenants issus du monde professionnel et de la recherche engagés dans l’Industrie du Futur</p>\n<p><a href=\"https://www.eventbrite.fr/e/billets-ecole-hiver-industrie-du-futur-journee-1-25-fevrier-2019-54753230386\" rel=\"noopener\">Inscription journée 1 – 25/02/2019</a></p>\n<h4>Journée 2 – 26/02/2019</h4>\n<p>Cette seconde journée est dédiée à la visite de sites industriels de pointe situé en Alsace, terre industrielle par excellence, et permettra aux participants de plonger au coeur de l’Industrie 4.0 : Siemens et SEW Usocome.</p>\n<p><a href=\"https://www.eventbrite.fr/e/billets-ecole-hiver-industrie-du-futur-journee-2-26-fevrier-2019-54754713823\" rel=\"noopener\">Inscription journée 2 – 26/02/2019</a></p>\n<h4>Journée 3 – 27/02/2019</h4>\n<p>La dernière journée est conçue comme une vitrine de l’Industrie du Futur. Au programme : des conférences, des serious game, des ateliers de réalité virtuelle appliquée à l’industrie (maintenance, …) ou encore de prototypage. Des offreurs de solution 4.0 seront également présents pour vous prodiguer des conseils lors d’un stand organisé spécialement pour les participants. </p>\n<p><a href=\"https://www.eventbrite.fr/e/billets-ecole-hiver-industrie-du-futur-journee-3-27-fevrier-2019-54755147119\" rel=\"noopener\">Inscription journée 3 – 27/02/2019</a></p>\n<h4><b>Plus d’informations</b></h4>\n<p>Le programme détaillé et les inscriptions sont disponibles sur le site de l’<a href=\"https://www.winterschoolindustry.eu/\" rel=\"noopener\">École d’Hiver sur l’Industrie du Futur.</a></p>"
      legacy_cover: "/images/blog/visuel-article-plage-digitale-2.webp"
      status: "published"
      published_at: "2019-01-29"
      categories: ["actualites"]
      legacy_path: "/ecole-dhiver-2019-industrie-du-futur/"
      created_at: "2019-01-29T13:41:59Z"
  - key: "meetup22-startup-produits-physiques-comment-reussir-a-distribuer-aux-clients"
    fields:
      title: "Meetup#22 : Startup & produits physiques : Comment réussir à distribuer aux clients?"
      slug: "meetup22-startup-produits-physiques-comment-reussir-a-distribuer-aux-clients"
      excerpt: "La distribution des produits physiques aux clients concerne nombreuses des startups. L’enjeu de ce meetup sera de comprendre comment réussir à distribuer aux…"
      body: "<p>La distribution des produits physiques aux clients concerne nombreuses des startups.<br>\nL’enjeu de ce meetup sera de comprendre comment réussir à distribuer aux clients tout en respectant ses attentes.</p>\n<p>Les startups du<strong> hardware</strong> (<i>qui ont pour vocation de créer, commercialiser, un produit physique accompagné par un smartphone ou logiciel</i>) sont sujettes à des difficultés qui leur sont propres mais pourquoi ça coince ? <br>\nComme dit un proverbe de la Silicon Valley, « <i>Hardware is Hard </i>»<br>\nAlors, concurrence féroce ? Problème de production qui entraîne des retards ? Coûts qui dépassent le budget initial ou encore marché moins prometteur qu’on l’espérait, ils nous expliquent :</p>\n<p>Les <strong>intervenants</strong> :</p>\n<p>Jérôme Scalia, Founder &amp; CEO d’<a href=\"https://awaken.fr/fr/awaken-car-fr/\" rel=\"noopener\"><strong>Awaken</strong></a>, société spécialisée dans les objets connectés qui sauvent des vies. <br>\nAWAKEN Car est un boitier électronique qui se branche sur le port diagnostic des voitures et camionnettes. Il permet de détecter et de mesurer l’intensité du choc lors d’un accident, de transmettre une notification instantanément et automatiquement aux services des secours. Le but étant de réduire le temps d’intervention du SAMU sur le lieu de l’accident et donc de sauver des vies.</p>\n<p>Renaud Uhl, fondateur de <a href=\"https://www.myquintus.com/fr/\" rel=\"noopener\"><strong>MyQuintus</strong></a> dont l’objectif est de mettre à l’honneur, le lit, théatre d’émotions et de belles histoires en imaginant une collection unique de têtes et de pieds de lit, signée par des artistes talentueux.</p>\n<p>Emeline Hahn ou julien co-fondateur de <a href=\"https://www.fizimed.com/\" rel=\"noopener\"><strong>FIZIMED</strong></a><br>\nEmy, c’est la 1ère sonde sans fil conçue et assemblée en France pour la rééducation périnéale. Connectée à une application mobile ludique, Emy vous permet de faire votre rééducation à domicile seule ou en complément des séances réalisées chez votre professionnel de santé.</p>\n<p>RDV: <i><strong>28 Février 2018 à 18h30</strong></i><br>\nOù : Le Shadok<br>\nLien billetterie : <a href=\"https://www.eventbrite.fr/e/billets-meetup22-startup-produits-physiques-comment-reussir-a-distribuer-aux-clients-55979808113\" rel=\"noopener\">ici</a>  <br>\nEvénement facebook : <a href=\"https://www.facebook.com/events/545645005927935/\" rel=\"noopener\">ici</a></p>"
      legacy_cover: "/images/blog/meetup22-9.webp"
      status: "published"
      published_at: "2019-02-15"
