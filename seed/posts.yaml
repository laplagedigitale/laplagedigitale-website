  - key: "aout-2024"
    fields:
      title: "Août 2024"
      slug: "aout-2024"
      excerpt: "En août, le coworking inspire collaboration et créativité sous le soleil d’été. 😎"
      body: "<p>« En août, le coworking inspire collaboration et créativité sous le soleil d’été. » 😎</p>\n<h2><strong>Découvrez l’agenda du mois d’août de la Plage Digitale 🗓</strong></h2>\n<figure><img src=\"/images/blog/66a9e3cadca8087d89842ee0.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong><strong>Permanence Propriété Intellectuelle – 08/08/2024 – De 10h00 à 12h00</strong></strong></p>\n<p><strong><strong>Vous aurez la possibilité de venir vous entretenir gratuitement avec Alexis Martin, consultant en stratégie de Propriété Intellectuelle, au sein du cabinet Bleger-Rhein-Poupon.</strong></strong></p>\n<p>🤝 Il accompagne quotidiennement les entreprises/porteurs de projets innovants afin de les sensibiliser à la protection de leur(s) création(s). </p>\n<p>🧑🏻‍💻 Il effectue également des audits d’entreprises/de projets gratuits. Son objectif est de vous montrer que la Propriété Intellectuelle est avant tout un outil qui vous permet de consolider votre avantage concurrentiel !</p>\n<p><a href=\"https://tally.so/r/mBB2AK\" rel=\"noopener\">Prendre rdv</a></p>\n<figure><img src=\"/images/blog/66a9e685ea8bef7130931ecd.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Kaffee und Kuchen – Tous les mardis – De 10h00 à 11h00</strong></p>\n<p><strong>Rejoignez-nous pour découvrir la Plage Digitale et ses membres ! ☕️🥐</strong></p>\n<p>Tous les mardis, de 10h00 à 11h00, nous partageons un « Kaffee und Kuchen » à la Plage Digitale. </p>\n<p>Ceux qui souhaitent se joindre à nous sont les bienvenus !</p>\n<figure><img src=\"/images/blog/66a9edd804a36c0a242e44ec.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong><strong>Offres d’été à la Plage Digitale – Du 15/07/2024 au 15/09/2024</strong></strong></p>\n<p><strong><strong>🌞 Offres spéciales  🌞</strong></strong></p>\n<p>Cet été, la Plage Digitale vous propose deux offres spéciales pour vous faire découvrir son tiers-lieu et son espace de coworking !</p>\n<p>1️⃣ Une formule « 3 jours » avec un bureau personnel en open space !</p>\n<p>2️⃣ Une journée de flex offerte pour les nouveaux arrivants !</p>\n<p>Ne manquez pas cette opportunité de vous connecter, innover et collaborer dans un environnement propice à la créativité et à l’innovation !</p>\n<figure><img src=\"/images/blog/66a9f4ca04a36c0a242e46f4.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong><strong>Les Dej’ Freelances débarquent à la Plage Digitale !</strong></strong></p>\n<p><strong><strong>Une nouvelle initiative portée par Edouard, un de nos coworkers !</strong></strong></p>\n<p>Après une discussion avec un ami, ils se sont rendus compte qu’il existait plein de meetups sur la tech, mais … rien sur le business.<br><br>C’est pourquoi, Edouard a décidé de lancer des réunions de freelances de la tech, afin de partager leurs expériences sur le business :</p>\n<p><strong>-Développement commercial, marketing,</strong></p>\n<p><strong>-Gestion, organisation,</strong></p>\n<p><strong>-Juridique, finance…</strong></p>\n<p>Pour optimiser leur temps, ils font ça autour d’un déjeuner dans une salle de la Plage Digitale.</p>\n<p>Déjà deux éditions ont eu lieu, et ce que les participants ont préféré ce sont : </p>\n<p><strong>-Confronter leur vision avec celle d’un expert</strong></p>\n<p><strong>-Remettre en question des idées reçues</strong></p>\n<p><strong>-Découvrir des restaurateurs du quartier 😋</strong></p>\n<p>Edouard : « <em>Le Meetup business pour freelances et entrepreneurs tech a l’air parti pour durer.</em>« </p>\n<p><strong>Le prochain dej’ freelances, c’est le 9 septembre ! N’hésite pas à cliquer sur le bouton ci-dessous pour contacter  Edouard et avoir plus d’informations !</strong></p>\n<p><a href=\"https://www.linkedin.com/in/edouard-mangel-/\" rel=\"noopener\">En savoir plus</a></p>"
