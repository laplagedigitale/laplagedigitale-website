      slug: "hacking-health-camp-appel-a-benevoles"
      excerpt: "Les équipes sont à la recherche de personnes majeures , motivées, dynamiques pour aider à l’organisation et au bon déroulement de l’événement durant les…"
      body: "<p>Les équipes sont à la recherche de personnes majeures , motivées, dynamiques pour aider à l’organisation et au bon déroulement de l’événement durant les quatre jours.<br>\nPour rappel, le <strong>Hacking Health Camp</strong> se tiendra à Strasbourg du 17 au 20 Mars 2016.</p>\n<p>Les missions des bénévoles seront :</p>\n<ul><li>Accueil du public</li><li>Gestion des équipes du Hackathon</li><li>Renseignement et encadrement des participants</li><li>Restauration, service</li><li>Aide au montage et au démontage, rangement et nettoyage</li></ul>\n<p>Pour plus de détails :<strong>Une réunion d’informations aura lieu à la Plage Rivétoile le 3 mars à 18h30<br>\n15 Route du Rhin, 67100 Strasbourg<br>\n</strong>Vous pouvez également contacter Sophie à l’adresse suivante : contact@alsacedigitale.org</p>\n<p><a href=\"http://hackinghealth.camp/\" rel=\"noopener\">Site du Hacking Health Camp </a></p>\n<p>Rejoignez l’aventure !</p>"
