  - key: "mai-2023"
    fields:
      title: "Mai 2023 🌳"
      slug: "mai-2023"
      excerpt: "En mai, faites ce qu’il vous plaît !"
      body: "<p>En mai, faites ce qu’il vous plaît !</p>\n<p>Découvrez l’agenda du mois de mai de la Plage Digitale</p>\n<figure><img src=\"/images/blog/8.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Software Crafters Strasbourg – 10/05/2023 – à 19h00</strong></p>\n<p><strong>Comment s’améliorer en tant que développeur ? </strong><br> <br>Pour faire la différence en tant que développeur, le niveau technique ne suffit pas. Les domaines émotionnels et relationnels sont tout aussi importants. Avec de la méthode, il est possible de les développer de la même manière que les compétences techniques. À la clé : ✚ de motivation, ✚ d’impact et ✚ d’opportunités professionnelles  <br><br>Dans cet atelier nous parlerons de ce qu’on peut appliquer à notre métier de développeur de la psychologie, et plus particulièrement des recherches récentes en sciences cognitives et comportementales, ainsi que des thérapies d’acceptation et d’engagement (ACT), pour améliorer notre motivation, nos compétences techniques, émotionnelles et relationnelles  <br><br>1️⃣ La première partie comprendra une présentation des concepts avec des exemples actionnables. <br>2️⃣ La seconde partie sera composée d’échanges en petits groupe pour partager nos méthodes personnelles. <br><br>Ce meetup sera animé par Geoffrey Huck  </p>\n<p><a href=\"https://www.meetup.com/software-crafters-strasbourg/events/293081316\" rel=\"noopener\"><strong>Je veux assister au meetup</strong></a></p>\n<figure><img src=\"/images/blog/12-1.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Strasbourg Developer Meetup – 11/05/2023 – à 19h00</strong></p>\n<p>➡️ Tu as déjà entendu parler d’architecture hexagonale, d’architecture en oignon ou encore de clean architecture ? Ce sont différents concepts d’organisation de ton code en différentes couches.<br><br>Rejoignez le Strasbourg Developer Meetup pour profiter d’une introduction au concept de Clean Architecture introduit par Robert “Uncle Bob” Martin en 2012<br><br>1️⃣ En première partie, vous aurez  le plaisir d’avoir un talk sur les risques sous-estimés du métier de développeur.<br><br>✅ <strong>Voici le programme complet</strong> :<br>19h15 : Développeur, un métier à risque pour la santé – Arnaud Becher‍⚕️<br> La sédentarité induite par le travail devant l’écran est une menace très sérieuse pour la santé du développeur, et pourtant largement sous-estimée. Pendant cette courte présentation d’une vingtaine de minutes vous prendrez conscience comment et combien nous mettons, sans nous en rendre compte, notre santé en danger. <br> Au programme, il y a aussi de bonnes nouvelles : il existe des solutions pour limiter les risques et celles-ci sont à la portée de tous !<br>20h00 : Introduction à la Clean Architecture – Mael Sicard-Cras<br> La Clean Architecture, ce n’est pas un Hello World. Venez découvrir une explication des fondamentaux du pattern architectural et une démonstration de ses avantages<br>21h15 : Discussions &amp; Apéro tous ensemble<br><br>Il y aura bien évidemment des snacks, de la bière et des boissons non alcoolisées (eau &amp; soda)</p>\n<p><a href=\"https://www.meetup.com/fr-FR/strasbourg-developer-meetup/events/293143237/?fbclid=IwAR353Zrx8Cs6VQ9Yssx0RXE782Qbqs0Pex_LdvdvQAkP1-W3OmkcZsVRzm8\" rel=\"noopener\"><strong>Participer</strong></a></p>\n<figure><img src=\"/images/blog/9.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Meetup Deep Learning – 13/05/2023 – à 10h00</strong></p>\n<p><strong>Écrire votre premier modèle d’apprentissage profond pour classifier les chiens et les chats</strong></p>\n<p>✅ Lors de ce meetup, l’intervenant mettra en œuvre un réseau de neurones et entraînera un classificateur sur les serveurs de Kaggle.</p>\n<p> Vous pouvez exécuter du code avec lui si vous le souhaitez (apportez alors votre ordinateur portable) ou simplement regarder.</p>\n<p> Si vous voulez mettre la main à la pâte, vous devrez créer un compte sur www.kaggle.com</p>\n<p><a href=\"https://www.meetup.com/strasbourg-deep-learning-meetup/events/293101878/?utm_medium=referral&amp;utm_campaign=share-btn_savedevents_share_modal&amp;utm_source=link\" rel=\"noopener\"><strong>Rejoindre l’événement</strong></a></p>\n<figure><img src=\"/images/blog/7-1.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Meetup Data Science – 31/05/2023 – à 19h00</strong></p>\n<p> Retrouvez les <strong>deux speakers</strong> ainsi que les sujets qu’ils aborderont :</p>\n<p><strong>◾️ Dr. Robert Maria</strong> : « <strong>Learning disentangled representations in neural networks</strong> » : L’apprentissage de représentations désenchevêtrées dans les réseaux de neurones est importante dans l’apprentissage génératif profond. Les représentations désenchevêtrées offrent une meilleure interprétabilité, en séparant les différents facteurs de variation des données, facilitant ainsi la compréhension de leur contribution aux prédictions du modèle. Elles permettent également une meilleure généralisation, en capturant la structure des données, rendant le modèle plus robuste face aux changements de distribution des entrées. Ces représentations favorisent l’apprentissage par transfert, l’efficacité des données et le raisonnement causal en apprenant des caractéristiques significatives au lieu de mémoriser les modèles. Enfin, elles contribuent à l’équité et à l’éthique en aidant à atténuer les biais dans les modèles de machine learning en isolant les facteurs de variation qui peuvent affecter injustement les prédictions.<br><br><strong>◾️ Dr. Mounir Bendali-Braham</strong> : « <strong>Stable Diffusion: High-Resolution Image Synthesis with Latent Diffusion Models</strong> » : Présentation du fonctionnement et des applications de Stable Diffusion. Stable Diffusion est une méthode gratuite et open-source de génération d’images à partir de descriptions textuelles.</p>\n<p><a href=\"https://www.meetup.com/fr-FR/data-science-strasbourg/events/293077556/\" rel=\"noopener\"><strong>Participer au meetup</strong></a></p>\n<figure><img src=\"/images/blog/4.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>C’est arrivé le mois dernier … et près de chez vous !</strong></p>\n<p><strong>À la Plage Digitale, il s’en est passé des choses en avril :</strong></p>\n<p> La journée internationale de la créativité et de l’innovation, un don du sang, plusieurs permanences conseils professionnels, la sortie du clip “Vie tranquille” tourné au sein de notre espace de coworking, etc. </p>\n<p>Suivez-nous sur nos réseaux sociaux pour ne rien louper !</p>\n<p><a href=\"https://www.helloasso.com/associations/la-plage-digitale/adhesions/adhesions-la-plage-digitale-2023\" rel=\"noopener\"><strong>Devenir plagiste !</strong></a></p>"
