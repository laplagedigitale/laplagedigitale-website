  - key: "elsass-jug-relance-les-soirees-agile-le-19-septembre"
    fields:
      title: "Elsass JUG relance les soirées Agile le 19 septembre"
      slug: "elsass-jug-relance-les-soirees-agile-le-19-septembre"
      excerpt: "Nous avons pu découvrir la méthode agile il y a quelques mois, cela remonte à début Juillet avec la soirée « Coffee Machine ». Elsass Agile – qui est…"
      body: "<p><img src=\"/images/blog/logoelsassjug.webp\" alt=\"LogoElsassJUG\" loading=\"lazy\">Nous avons pu découvrir la méthode agile il y a quelques mois, cela remonte à début Juillet avec la <a href=\"/blog/la-programmation-agile-savoir-sorganiser-pour-programmer\">soirée « Coffee Machine »</a>.  Elsass Agile – qui est maintenant intégrée au JUG – relance les soirées Agile Games avec une soirée ‘leadership’ le <strong>19 septembre 2013 à 19 h à la Plage Digitale</strong>.</p>\n<p>Histoire de changer un peu de SCRUM et du ball point game, nous vous invitons à vivre une soirée peer-coaching. Nous partagerons un moment de peer-coaching avec Pinocchio, et la communauté alsacienne: comment apprendre des autres ? Comment être efficace en équipe ? Comment gagner en leadership ? En somme : comment devenir un manager avec Pinocchio ?</p>\n<p>Pour cette nouvelle rentrée, et pour préparer l’agile tour, nous vous proposons de découvrir la facette ‘coaching’ des jeux agiles ! </p>\n<p><strong>Entrée libre. <a href=\"https://plus.google.com/u/0/b/112928904090839853310/events/ct2141l2vqlefcp2rruo8uge1uo?authkey=CPCLgcHm9u-XNQ\" rel=\"noopener\">L’évènement sur Google+</a></strong></p>"
      legacy_cover: ""
      status: "published"
