      slug: "permanences-du-cabinet-mazars"
      excerpt: "Vous souhaitez avoir des informations sur la comptabilité ? Nous vous rappelons que le cabinet Mazars Société d’Avocats assure des permanences à La Plage…"
      body: "<p><img src=\"/images/blog/mazars.webp\" alt=\"\" loading=\"lazy\"></p>\n<p>Vous souhaitez avoir des informations sur la comptabilité ? Nous vous rappelons que le cabinet <strong>Mazars Société d’Avocats</strong> assure des permanences à La Plage Digitale tous les mois. Des créneaux d’une heure sont disponibles, dans notre Petite Salle de réunion.</p>\n<p>Pour réserver un créneau, il vous suffit de vous <strong>inscrire sur le Doodle</strong> :</p>\n<ul><li><a href=\"https://doodle.com/poll/qnz6aymb3582runv\" rel=\"noopener\">Vendredi 19 Janvier 2018</a> : 9h-13h</li><li><a href=\"https://doodle.com/poll/2eskcriyixfpvtui\" rel=\"noopener\">Vendredi 16 Février 2018</a> : 9h-13h</li><li><a href=\"https://doodle.com/poll/v3gsw7e7qcyiium8\" rel=\"noopener\">Vendredi 16 Mars 2018</a> : 9h-13h</li><li><a href=\"https://doodle.com/poll/hye5m54g3ap8hynq\" rel=\"noopener\">Vendredi 20 Avril 2018</a> : 9h-13h</li><li><a href=\"https://doodle.com/poll/79wfxziieneuyhxn\" rel=\"noopener\">Vendredi 18 Mai 2018</a> : 9h-13h</li><li><a href=\"https://doodle.com/poll/y8u6r5xcs8u2m3aa\" rel=\"noopener\">Vendredi 15 Juin 2018</a> : 9h-13h</li></ul>\n<p><em>Mazars Société d’Avocats est un cabinet spécialisé en droit des affaires et en fiscalité, et membre de Mazars (groupe international d’audit et de conseil). Mazars réunit les meilleurs experts aux compétences pluridisciplinaires, spécialisés en conseil et en contentieux, pour accompagner les PME comme les grands groupes à tous les stades de leur développement, afin d’assurer la réussite de leurs projets.</em></p>\n<p><a href=\"https://www.avocats-mazars.com/\" rel=\"noopener\">Site Internet de Mazars Société d’Avocats</a></p>"
