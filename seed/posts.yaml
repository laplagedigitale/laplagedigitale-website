      slug: "demonight-edgefest-2016"
      excerpt: "Date : Jeudi 30 juin à 19h Lieu : UGC Événement gratuit sur inscription. Participer ici ! Soirée consacrée aux startups alsaciennes. Ils seront 7 à être…"
      body: "<p><strong>Date</strong> : Jeudi 30 juin à 19h</p>\n<p><strong>Lieu</strong> : UGC</p>\n<p><strong>Événement gratuit sur inscription. <a href=\"https://www.eventbrite.fr/e/billets-demonight-9-19234879041\" rel=\"noopener\">Participer ici !</a></strong></p>\n<p>Soirée consacrée aux startups alsaciennes. Ils seront 7 à être présents pour présenter leurs projets pendant les cinq minutes dont chacun disposera. Une vraie performance, un vrai show !</p>\n<p>Pas de blabla, que de la démo !</p>\n<p>Événement organisé par Strasbourg Startups, une initiative lancée par Alsace Digitale pour fédérer, développer et animer la scène startup strasbourgeoise.</p>\n<p>La soirée se terminera par un buffet convivial.</p>"
