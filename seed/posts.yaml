  - key: "cafe-laprimaire-rencontre-debat-participatif-a-strasbourg"
    fields:
      title: "Café LaPrimaire : rencontre & débat participatif à Strasbourg"
      slug: "cafe-laprimaire-rencontre-debat-participatif-a-strasbourg"
      excerpt: "Dans le cadre de la primaire ouverte citoyenne organisée par LaPrimaire.org, les 5 candidats finalistes viendront présenter leurs idées lors de leur passage à…"
      body: "<p><strong>Dans le cadre de la primaire ouverte citoyenne organisée par <a href=\"https://laprimaire.org/\" rel=\"noopener\">LaPrimaire.org</a>, les 5 candidats finalistes viendront présenter leurs idées lors de leur passage à Strasbourg, le jeudi 8 décembre prochain, de 19 à 22h à la Maison des Associations.</strong></p>\n<p><a href=\"https://laprimaire.org/\" rel=\"noopener\">LaPrimaire.org</a> est une primaire ouverte, organisée pour permettre aux Français de choisir librement, de manière <b>transparente</b> et <b>démocratique</b>, les candidats qu’ils souhaitent voir se présenter à l’élection présidentielle de 2017.</p>\n<p>Aujourd’hui en France, les partis politiques (soit 0,5% de la population) désignent les candidats aux élections alors que les citoyens les rejettes massivement. L’objectif de<a href=\"https://laprimaire.org/\" rel=\"noopener\"> LaPrimaire.org</a> est d’<strong>insuffler un nouvel élan démocratique</strong> à notre pays en favorisant le renouvellement de notre classe politique.</p>\n<p>Le 1er tour de vote de <a href=\"http://LaPrimaire.org/\" rel=\"noopener\">LaPrimaire.org</a> s’est clôturé le 6 novembre dernier et vos votes ont révélé les 5 candidat(e)s finalistes : Charlotte Marchandise, Nicolas Bernabeu, Roxane Revon, Michel Bourgeois et Michaël Pettini.</p>\n<p>Les propositions des candidat(e)s ont besoin d’être confrontées à la vie réelle pour se consolider, se préciser.</p>\n<p>Ce Café LaPrimaire spécial « finalistes » sera l’occasion pour vous de rencontrer et d’échanger avec eux sous un format convivial et participatif.</p>\n<p><strong>Y aller : </strong>Jeudi 8 décembre de 19 à 22h à la Maison des Associations  – 1, Place des Orphelins, 67000 Strasbourg</p>\n<p><strong><a href=\"http://www.meetup.com/fr-FR/Cafes-LaPrimaire/events/235319558/\" rel=\"noopener\">Réservez votre billet</a></strong></p>\n<p>Plus d’informations sur l’événement Facebook <a href=\"https://www.facebook.com/events/1839270479625126/\" rel=\"noopener\"><strong>ICI</strong></a>.</p>"
