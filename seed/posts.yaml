    fields:
      title: "Julien Gérard, un photographe plagiste"
      slug: "julien-gerard-un-photographe-plagiste"
      excerpt: "by Isabelle Schmidt Vendredi dernier, La Plage a joué les prolongations pour accueillir la projection photo du photographe Julien Gérard. Un beau moment…"
      body: "<p><em>by Isabelle Schmidt</em></p>\n<p>Vendredi dernier, La Plage a joué les prolongations pour accueillir la projection photo du photographe <a href=\"http://www.juliengerard.com\" rel=\"noopener\">Julien Gérard</a>. Un beau moment d’échanges, autour de la photo et du voyage.</p>\n<p><strong>Apéro photo</strong></p>\n<p>En plein milieu des vacances scolaires, avec une météo alsacienne mouvementée, l’apéro-photo du vendredi soir à La Plage nous a emmené loin, très loin. D’abord à Marseille, à la rencontre des dauphins, puis à Ganvié au Bénin, en Indonésie pour revenir enfin à Strasbourg avec des clichés inédits.</p>\n<p>La véritable valeur ajoutée de ce rdv ? Des anecdotes, des explications, du vécu. Et bien-sûr, les échanges, la discussion pendant la projection.</p>\n<p>« <em>J’ai l’impression d’avoir voyagé</em> » nous confiaient les invités de la soirée pendant le pot post-projection. Et ce fut bien le cas. Si certains sont repartis avec des lots, La Plage a gardé un tirage dibon qui égayera un de ses murs. Elle continue à héberger Julien aussi, qui est depuis 2 mois un heureux occupant des lieux.</p>\n<p><strong>Zoom sur Ganvié</strong></p>\n<p>Parce que le reportage le plus marquant est celui de Ganvié, la Venise de l’Afrique, nous ne pouvons que vous conseiller de découvrir le livre auto-édité par Julien sur <a href=\"http://www.blurb.fr/user/store/JulienGERARD\" rel=\"noopener\">Blurb</a>, également disponible en ebook.</p>\n<p>Merci aux participants pour leur bonne humeur, pour avoir continué à échanger après la projection et ainsi contribué à faire de cet apéro-photo un moment de convivialité qui colle très bien aux grandes vacances.</p>\n<p><img src=\"/images/blog/ganvie-juliengerard-d3-20101217-3786-2.webp\" alt=\"\" loading=\"lazy\"></p>\n<p>A bientôt pour un nouvel apéro photo !</p>\n<p><img src=\"/images/blog/alcyon-juliengerard-d3-20120720-3251.webp\" alt=\"\" loading=\"lazy\"></p>\n<p><img src=\"/images/blog/kawahijen-juliengerard-d3-20110706-2298.webp\" alt=\"\" loading=\"lazy\"></p>\n<p><img src=\"/images/blog/strasbourg-juliengerard-d3-20120622-1335.webp\" alt=\"\" loading=\"lazy\"></p>\n<p><strong>Liens utiles :</strong></p>\n<p>Le compte blurb : <a href=\"http://www.blurb.fr/user/store/JulienGERARD\" rel=\"noopener\">http://www.blurb.fr/user/store/JulienGERARD</a></p>\n<p>Lien vers le site de Julien Gérard : <a href=\"http://www.juliengerard.com/\" rel=\"noopener\">http://www.juliengerard.com</a></p>"
      legacy_cover: "/images/blog/ganvie-juliengerard-d3-20101217-3786-2.webp"
