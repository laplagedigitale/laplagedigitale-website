  - key: "global-game-jam-strasbourg-2019"
    fields:
      title: "Global Game Jam Strasbourg 2019"
      slug: "global-game-jam-strasbourg-2019"
      excerpt: "L’édition 2019 de la Global Game Jam aura lieu du 25 au 27 janvier. Alsace Digitale et Epitech – Game Dev Group Strasbourg, vous invitent au Shadok pour y…"
      body: "<p><strong>L’édition 2019 de la Global Game Jam aura lieu du 25 au 27 janvier. Alsace Digitale et  Epitech – Game Dev Group Strasbourg, vous invitent au Shadok pour y participer !</strong></p>\n<p>Ce mouvement international rassemble chaque année des milliers de personnes autour d’un principe   simple : créer en équipe et en 48 heures, des jeux en tous genres autour d’un thème imposé. Les équipes sont formées sur place, en fonction des idées et envies de chacun. Elles sont ensuite libres de créer leur jeu sous n’importe quelle forme : vidéo, de cartes, de plateau, de rôle… </p>\n<p>En 2018, la Global Game Jam c’était 8 606 jeux créés sur le thème de la transmission, dans 108 pays différents  ! Vous êtes mis au défi de faire plus cette année ?</p>\n<p>N’attendez plus, réservez gratuitement votre billet en ligne ! </p>\n<p>➡ <a href=\"https://bit.ly/2BsP6M8\" rel=\"noopener\"> Réserver mes repas</a></p>\n<p>Le Shadok vous propose également une restauration complète à 7 € le repas, petits-déjeuners offerts. Pour en profiter, réservez vos repas avant le 20 janvier. </p>\n<p>➡ <a href=\"https://bit.ly/2Sa2bky\" rel=\"noopener\">Prendre mon billet </a></p>\n<p>À vous de jouer ! ?</p>"
