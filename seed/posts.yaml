  - key: "la-france-aime-le-coworking-portes-ouvertes-de-la-plage"
    fields:
      title: "La France aime le coworking – Portes ouvertes de La Plage"
      slug: "la-france-aime-le-coworking-portes-ouvertes-de-la-plage"
      excerpt: "Les espaces de coworking ont émergé un peu partout en France depuis quelques années, on en compte à ce titre plus de mille dans l’Hexagone. Suite aux récentes…"
      body: "<p>Les espaces de coworking ont émergé un peu partout en France depuis quelques années, on en compte à ce titre plus de mille dans l’Hexagone. </p>\n<p>Suite aux récentes évolutions dans l’organisation des entreprises, et à l’essor de la digitalisation du travail, le coworking répond de plus en plus aux besoins des salariés en télétravail, mais aussi des freelances et des étudiants. </p>\n<p>La première journée dédiée à ces espaces se déroulera le 21 mars et est organisée par le Actipole21 et Neo-Nomade.</p>\n<p>A cette occasion, La Plage Digitale, espace labellisé C3, vous donne rendez-vous dès 14 heures afin de découvrir et échanger sur le coworking, mais également de tester son espace flex. </p>\n<p><a href=\"https://www.eventbrite.fr/e/billets-portes-ouvertes-de-la-plage-digitale-58641158283?aff=efbeventtix&amp;fbclid=IwAR2U2lupE5BLmUQHwZyF2Ixq3zx_1EGQYSAA6AnBzmCH2dDrDi9Lc4ZbGG8\" rel=\"noopener\">Réserver son essai ou sa visite.</a></p>"
      legacy_cover: "/images/blog/bandeau-lafranceaimelecoworkingb.webp"
      status: "published"
      published_at: "2019-03-18"
      categories: ["evenements"]
      legacy_path: "/la-france-aime-le-coworking-portes-ouvertes-de-la-plage/"
      created_at: "2019-03-18T15:54:08Z"
  - key: "meetup23-le-cto-ce-dictateur-eclaire"
    fields:
      title: "Meetup#23 : Le CTO, ce dictateur éclairé"
      slug: "meetup23-le-cto-ce-dictateur-eclaire"
      excerpt: "Meetup#23 : Le CTO, ce dictateur éclairé Le CTO (Chief Technical Officer) ou Directeur Technique est en charge de la conception technique et du déploiement de…"
      body: "<p><strong>Meetup#23 : Le CTO, ce dictateur éclairé</strong></p>\n<p>Le CTO (Chief Technical Officer) ou Directeur Technique est en charge de la conception technique et du déploiement de technologies adaptées au développement et à l’efficacité des activités d’une entreprise. <br>\nDifférentes questions se posent : quels sont tous les différents rôles du CTO? Comment son rôle évolue-t-il avec la croissance de l’entreprise?</p>\n<p>Votre startup a besoin de se démarquer techniquement pour proposer un service de qualité? Votre CTO cherchera à prendre les meilleurs choix techniques pour construire votre produit.</p>\n<p>Le CTO doit-il être associé à votre entreprise ou est-ce que le travail est externalisable ?</p>\n<p>Trois intervenants CTO viendront se confier à nous et partager leurs expériences.</p>\n<p><strong>Les intervenants :</strong></p>\n<p>Hakan Ebabil, CTO de <a href=\"https://fr.chargemap.com/\" rel=\"noopener\">Chargemap</a>, la solution pour déterminer quelles sont les bornes de recharge les plus pertinentes à utiliser sur votre itinéraire. Pour développer la voiture électrique, la France a besoin d’équiper son territoire de bornes de recharge. <br>\nLa communauté de plus de 140 000 membres permet de constituer une des bases de données des bornes de recharge la plus complète et la plus fiable. </p>\n<p>Leo Unbekandt, Co-founder &amp; CTO de <a href=\"https://scalingo.com/fr\" rel=\"noopener\">Scalingo</a>. Du prototypage jusqu’à la production, Scalingo permet aux développeurs de contrôler facilement l’hébergement de leur apps sans avoir à gérer de serveurs. Leur mission est de supprimer le poids de la gestion et de la maintenance des serveurs, des bases de données et des dépendances logicielles.</p>\n<p>Frédéric Soulier, ancien CTO de Caldera (PME/PMI) et actuellement CTO d’une cellule R&amp;D chez MGI digital technology. MGI est spécialisée dans la fabrication d’équipements destinés au marché des Arts Graphiques. Son réseau de distribution couvre plus de 70 pays sur les 5 continents.</p>\n<p>Comme lors de chaque meetup, nous finirons par une séance de questions – réponses suivie d’un moment de networking autour d’un buffet. Entrepreneurs, startupers ou curieux, n’hésitez pas à venir échanger !</p>\n<p>Où : Le Shadok<br>\nJeudi 28 Mars<br>\nLien billetterie : <a href=\"https://www.eventbrite.fr/e/billets-meetup23-le-cto-ce-dictateur-eclaire-59067928765\" rel=\"noopener\">ici</a></p>"
      legacy_cover: "/images/blog/visuel-meetup-23-2.webp"
      status: "published"
      published_at: "2019-03-25"
      categories: ["actualites", "evenements"]
      legacy_path: "/meetup23-le-cto-ce-dictateur-eclaire/"
      created_at: "2019-03-25T14:34:50Z"
  - key: "meetup24-startup-en-croissance-comment-structurer-son-equipe"
    fields:
      title: "Meetup#24 – Startup en croissance : comment structurer son équipe ?"
      slug: "meetup24-startup-en-croissance-comment-structurer-son-equipe"
      excerpt: "Meetup#24 – Startup en croissance : comment structurer son équipe ? La phase de croissance soulève les questions de structuration d’équipe, de recrutement et…"
      body: "<p>Meetup#24 – Startup en croissance : comment structurer son équipe ?</p>\n<p>La phase de croissance soulève les questions de structuration d’équipe, de recrutement et de transmission de l’information. Lorsque la taille d’une équipe vient à doubler, la culture d’entreprise est fragilisée. <br>\nAlors, comment structurer une équipe ? Comment réorganiser la prise de décision ? Comme évoluent les responsabilités et les différents postes ? Comment recruter les bons profils ? <br>\nComment manager quand le modèle économique évolue? Quelle posture doit adopter le dirigeant en phase de croissance ?<br>\nQuelle procédure d’accueil pour les nouveaux salariés (aussi appelé onboarding) ? Comment réorganiser la transmission de l’information ? Comment conserver sa culture d’entreprise ? Quels sont les pièges à éviter ? <br>\nTrois entrepreneurs et entrepreneuses, ayant connu et surmonté ces difficultés, animeront ce meetup#24. Une réponse à toutes ces questions !</p>\n<p>Les intervenants :</p>\n<p>Julien Lavault a créé Fizzup, l’application de fitness la plus téléchargée et utilisée en France avec 5,4 millions d’utilisateurs, présent dans 5 pays à travers le monde. La promesse est simple : soyez en forme en 6 semaines, grâce à des entrainements courts et efficaces, qui ne nécessitent aucun matériel! </p>\n<p>Séverine Sigrist, docteur en science, est présidente fondatrice de Defymed qui a été créée en 2011. Elle travaille avec son équipe sur le développement de dispositif médicaux innovants permettant le délivrance physiologique et ciblée de médicament. Fort d’une première preuve de concept dans le diabète avec le pancréas bioartificiel, ils développent aujourd’hui leur technologie pour d’autres pathologies chroniques.</p>\n<p>Jeremy Wies, founder &amp; CEO de Synovo est immergé depuis plus de 6 ans dans le monde de l’ambulance. Il a d’abord créé la société New Web pour apporter un service spécialisé dans l’hébergement de type Cloud et dans la maintenance de solutions informatiques pour les transporteurs sanitaires. Après avoir observé pendant 3 ans ce domaine, il a décidé de créer Synovo afin de développer une solution logicielle complète adaptée aux besoins des structures ambulancières françaises.</p>\n<p>Comme à chaque meetup, nous finirons par une séance de questions – réponses suivie d’un moment de networking autour d’un buffet. Entrepreneurs, startupers ou curieux, n’hésitez pas à venir échanger !</p>\n<p>Où : Le Shadok<br>\nEvent fb : <a href=\"https://www.facebook.com/events/441844563226702/\" rel=\"noopener\">ici </a><br>\nLien billetterie : <a href=\"https://l.facebook.com/l.php?u=https%3A%2F%2Fmeetup24.eventbrite.fr%2F%3Ffbclid%3DIwAR1UtfKu2YTb_FMPMBenxmFWdOxbQiWIQHAJRRVyhTsuEVpWrMOa6RzxY0Q&amp;h=AT1Bufu6pqJzVZ-sBzUI-bsg9PZ2FwV28iefC7yHxbtvKFzUPHiYa_94hF63PMM9SR7eCyEs84yevbqnN6H1w1YWVs09oMJHClgLEgdvV2ToecJWwdKB08uCNyUhrpEBpwy5hm2j-ho_Gd9_Yw\" rel=\"noopener\">https://meetup24.eventbrite.fr</a></p>"
      legacy_cover: "/images/blog/startup-1.webp"
      status: "published"
      published_at: "2019-04-10"
      categories: ["actualites"]
      legacy_path: "/meetup24-startup-en-croissance-comment-structurer-son-equipe/"
      created_at: "2019-04-10T15:40:18Z"
  - key: "meetup25-aarrr-comment-developper-sa-startup-comme-un-pirate"
    fields:
      title: "Meetup#25 : AARRR : Comment développer sa Startup comme un pirate ?"
      slug: "meetup25-aarrr-comment-developper-sa-startup-comme-un-pirate"
      excerpt: "« AARRR » est un sigle pour Acquisition – Activation – Rétention – Recommandation – Revenu. Cette matrice a été inventée par l’entrepreneur et business Angel…"
      body: "<p>« AARRR » est un sigle pour Acquisition – Activation – Rétention – Recommandation – Revenu. Cette matrice a été inventée par l’entrepreneur et business Angel Dave Mc Clure en 2007. Il résume en 5 lettres le modèle économique et le modèle de développement des startups. Ce modèle s’applique au moment où le produit est lancé sur le marché, ce qui représente une étape cruciale à l’entreprise.</p>\n<p>Alors comment acquérir des clients grâce à cette démarche ? A quoi peut servir concrètement le schéma AARRR ?</p>\n<p>Comment comprendre ces 5 étapes ? Quelles sont les erreurs fréquentes à éviter ? Est-ce la seule stratégie ?</p>\n<p>Deux entrepreneurs viendront partager leurs expériences et animeront ce meetup#25 de Strasbourg Startups by Alsace Digitale</p>\n<p><strong>Les intervenants </strong></p>\n<p><strong>Romain Chavon</strong>, Directeur Marketing chez Epopia, la startup qui fait vivre des aventures incroyables à vos enfants, développé par des écrivains et des professionnels de la pédagogie.  Ancien Chef de projet Web de chez Novembre, Co-fondateur de  Black Angus et CTO chez Vazee, partagera <em>une présentation théorique du Framework. </em></p>\n<p><strong>Julien Lavault</strong> créateur de  Fizzup, l’application de fitness la plus téléchargée et utilisée en France avec 5,4 millions d’utilisateurs, présent dans 5 pays à travers le monde. La promesse est simple : soyez en forme en 6 semaines, grâce à des entrainements courts et efficaces, qui ne nécessitent aucun matériel. Il a le concept dans le sang et fera un retour d’expérience mobile sur Fizzup avec un retour d’expérience Web.</p>\n<p>Comme à chaque meetup, nous finirons par une séance de questions – réponses suivie d’un moment de networking autour d’un buffet. Entrepreneurs, startupers ou curieux, n’hésitez pas à venir échanger !</p>\n<p>Où : Le Shadok<br>\nQuand : Jeudi 23 Mai à 18h30<br>\nLien billetterie : <a href=\"https://www.eventbrite.fr/e/billets-meetup25-aarrr-comment-developper-sa-startup-comme-un-pirate-61988123145\" rel=\"noopener\">https://aarrr.eventbrite.fr</a></p>"
      legacy_cover: "/images/blog/visuel-meetup25-1.webp"
      status: "published"
      published_at: "2019-05-16"
      categories: ["actualites", "evenements"]
      legacy_path: "/meetup25-aarrr-comment-developper-sa-startup-comme-un-pirate/"
