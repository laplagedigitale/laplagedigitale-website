  - key: "en-decembre-cest-startups-et-mannalas"
    fields:
      title: "En décembre, c’est Startups…et Mannalas !"
      slug: "en-decembre-cest-startups-et-mannalas"
      excerpt: "A l’approche des fêtes, Alsace Digitale vous invite à la 2e édition de Startups & Mannalas, le 8 décembre à l’Espace de Coworking « Le 34 » à Mulhouse.…"
      body: "<p><strong>A l’approche des fêtes, Alsace Digitale vous invite à la 2e édition de Startups &amp; Mannalas, le 8 décembre à l’Espace de Coworking « Le 34 » à Mulhouse. L’occasion d’échanger vos idées autour d’un chocolat ou d’un vin chaud, et des traditionnels Mannalas alsaciens.</strong></p>\n<p>Cette soirée simple et informelle vous propose de rencontrer du monde dans un moment convivial dans l’espace de coworking « Le 34 » se situant sur l’arrière de la pépinière du Technopole Mulhouse.</p>\n<p>Au programme, pour les plus actifs, <strong>un concours de pitchs</strong> !<br>\nVenez présenter votre projet, votre association, votre entreprise en 1 minute avec à la clef un lot comme l’année dernière… <strong>C’est Noël avant l’heure !</strong></p>\n<p>Et si vous n’avez rien à présenter, que vous êtes curieux, ou tout simplement que vous êtes très gourmands, vous êtes les bienvenus !</p>\n<p><strong>Y aller</strong> : Le 8 décembre de 19 à 23 heures</p>\n<p>Espace de Coworking « LE 34 » – Technopole Mulhouse – 34 rue Marc Seguin 68200 Mulhouse</p>\n<p><strong>La participation est gratuite, alors n’hésitez pas à <a href=\"https://www.eventbrite.fr/e/billets-startups-mannalas-28920445832\" rel=\"noopener\">vous inscrire ICI</a>.</strong></p>\n<p>Plus d’infos sur <a href=\"https://www.facebook.com/events/764461787027699/\" rel=\"noopener\">Facebook</a>.</p>"
