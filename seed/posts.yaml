      title: "Mai 2024"
      slug: "mai-2024"
      excerpt: "Dans le doux mois de mai, chaque jour est un bouquet de fleurs 💐"
      body: "<p><strong>Dans le doux mois de mai, chaque jour est un bouquet de fleurs 💐</strong></p>\n<p><strong>Découvrez l’agenda du mois de mai de la Plage Digitale 🗓</strong></p>\n<figure><img src=\"/images/blog/662a0d3d59962a32ee2fb269.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Atelier par ActionCOACH – 13/05/2024 – De 18h30 à 20h30</strong></p>\n<p><strong>Réussissez à coup sûr : Découvrez l’Atelier 6 Étapes en partenariat avec ActionCOACH Alsace Strasbourg, n°1 Mondial du Business Coaching 🤝</strong></p>\n<p>Nous sommes ravis de vous présenter une opportunité unique de transformer votre entreprise et d’atteindre de nouveaux sommets de réussite. En partenariat avec ActionCOACH Alsace Strasbourg, nous sommes heureux de vous inviter à participer à notre Atelier 6 Étapes, conçu spécialement pour les entrepreneurs ambitieux comme vous. 💼💡</p>\n<p><strong>Qu’est-ce que l’Atelier 6 Étapes ?</strong></p>\n<p>L’Atelier 6 Étapes est un programme intensif de formation et de coaching qui vous guide à travers les étapes essentielles pour développer votre entreprise de manière durable et rentable. Basé sur des stratégies éprouvées et des techniques de coaching de classe mondiale, cet atelier vous fournira les outils nécessaires pour :<br><br>– Clarifier votre vision 🌟 : Définissez vos objectifs à court et à long terme et créez un plan d’action clair pour les atteindre</p>\n<p>– Améliorer votre leadership 👑 : Apprenez à inspirer et à motiver votre équipe pour obtenir des performances optimales et une culture d’entreprise forte.</p>\n<p>– Optimiser votre système 🛠️ : Identifiez les processus inefficaces et mettez en place des systèmes et des structures pour maximiser la productivité et la rentabilité.</p>\n<p>– Accroître vos ventes 💰 : Développez des stratégies de vente efficaces pour générer plus de prospects, convertir plus de clients et augmenter vos revenus.</p>\n<p>– Gérer vos finances 💼 : Maîtrisez les bases de la gestion financière et apprenez à prendre des décisions éclairées pour assurer la croissance et la stabilité de votre entreprise.</p>\n<p>– Équilibrer votre vie professionnelle et personnelle ⚖️ : Trouvez l’harmonie entre votre vie professionnelle et personnelle pour vivre pleinement et profiter du succès que vous avez construit.</p>\n<p><strong>Pourquoi participer à l’Atelier 6 Étapes ?</strong></p>\n<p>En rejoignant cet atelier, vous bénéficierez non seulement de l’expertise de nos coachs certifiés en entrepreneuriat, mais vous ferez également partie d’une communauté dynamique d’entrepreneurs partageant les mêmes idées. Vous aurez l’occasion de partager vos défis, vos succès et vos meilleures pratiques, tout en recevant un soutien inestimable pour faire avancer votre entreprise. 🤝💼</p>\n<p><strong>Réservez votre place dès maintenant !</strong></p>\n<p>Ne manquez pas cette occasion exceptionnelle de transformer votre entreprise et de réaliser vos aspirations entrepreneuriales. Les places sont limitées, alors inscrivez-vous dès maintenant pour garantir votre participation à l’Atelier 6 Étapes. 📅🚀</p>\n<p><strong>Rejoignez-nous dans cette aventure excitante et prenez le contrôle de votre succès entrepreneurial dès maintenant !</strong> 🌟🚀</p>\n<p><a href=\"https://tally.so/r/mOzpq7\" rel=\"noopener\">Participer</a></p>\n<figure><img src=\"/images/blog/662a0d672dc9a28514538d45.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Permanence Propriété Industrielle – 15/05/2024 – De 9h00 à 12h00</strong></p>\n<p><strong>Événement réalisé en partenariat avec l’INPI, prenez rendez-vous gratuitement avec Pauline Wendehenne, chargée d’affaires en Propriété Industrielle à l’INPI ! 🔐🧠</strong></p>\n<p>Quelques questions auxquelles Pauline pourra vous répondre ⤵️</p>\n<p>▷ J’ai un nom pour ma société ou mon produit : est-ce que j’ai le droit de l’utiliser ? Est-ce que c’est un bon choix ? Est-ce que je peux le protéger par une marque ?</p>\n<p>▷ Je voudrai déposer une marque : combien ça coûte ? Comment je choisis le type de marque et les classes (c’est quoi une classe ?!) ? Quels outils peuvent m’aider ?</p>\n<p>▷ Mon identité visuelle comporte un logo : à qui appartiennent les droits sur le logo ? Puis-je le modifier par exemple ?</p>\n<p>▷ Comment protéger mon innovation ? Le dépôt d’une demande de brevet est-il pertinent pour mon projet ?</p>\n<p>▷ Quel est l’intérêt de dater et comment faire ?</p>\n<p>▷ Je développe une application mobile, un site internet ou un logiciel : à qui appartiennent les droits d’auteur sur le code ? Comment je peux le protéger ? Y a-t-il d’autres mécanismes de protection possibles ?</p>\n<p>▷ Comment combiner les titres de Propriété Industrielle et construire ma protection pour accélérer le développement de mon entreprise ?</p>\n<p>▷ Je souhaite conquérir des marchés étrangers : quelles précautions peuvent être prises ?</p>\n<p>▷ Comment l’INPI peut m’accompagner ? Quelles aides existent ?</p>\n<p><a href=\"https://tally.so/r/nWARzQ\" rel=\"noopener\">Prendre rdv (45 min)</a></p>\n<figure><img src=\"/images/blog/662a0e5a1a6889478d66326e.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>La Bataille de la Tech – 16/05/2024 – De 18h00 à 20h00</strong></p>\n<p><strong>Organisé par l’association </strong><a href=\"https://www.linkedin.com/company/latitudes%E2%80%93exploringtechforgood/\" rel=\"noopener\"><strong>Latitudes</strong></a><strong> qui oeuvre pour un numérique plus vertueux 🤝</strong></p>\n<p>Ce jeu a été pensé pour des utilisateurs du numérique et des professionnels.<br><br>🗣 Animatrice :<a href=\"https://www.linkedin.com/in/laura-slendzak/\" rel=\"noopener\"> Laura Slendzak</a>, Consultante et Formatrice en stratégie de communication</p>\n<p>Au programme ⤵️</p>\n<p>▷ Un atelier de 2h autour des enjeux sociaux et environnementaux du numérique 🌴💻</p>\n<p>À travers un jeu de cartes collaboratif qui pose des questions et permet d’ouvrir le débat, on vous fait découvrir les enjeux sociaux et environnementaux du numérique, ainsi que les leviers d’action pour y répondre !</p>\n<p>Ensemble, réinventons la tech ! 💪🏼</p>\n<p><a href=\"https://tally.so/r/3xax8r\" rel=\"noopener\">Je participe</a></p>\n<figure><img src=\"/images/blog/662a0f00cbe67010c2e17b10.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Meetup Go SXB Go – 16/05/2024 – De 18h00 à 20h00</strong></p>\n<p><strong>Go Meetup de mai : atelier optimisation de performance 🐌 ➡️⚡️</strong></p>\n<p>Au programme ⤵️</p>\n<p>Cette fois, Julien vous propose un format un peu différent de d’habitude : un atelier porté sur l’optimisation de performance. Pour y assister en toute tranquilité, nul besoin d’être expert·e en Go ou même en programmation concurrente ; il suffit juste d’être familiarisé·e avec la syntaxe du langage.</p>\n<p>A partir d’un petit programme Go, nous mènerons ensemble un véritable travail de détective… 🔍</p>\n<p>▷ Le programme en question est-il aussi rapide que possible ?<br>▷ Consomme-t’il plus de mémoire que nécessaire ?<br>▷ Où concentrer nos efforts pour améliorer sa performance ?<br>▷ Quels changements effectuer ?<br>▷ Et comment vérifier que nos changements constituent bien une amélioration ?</p>\n<p>A l’issue de cet atelier, grâce notamment à l’apprentissage d’outils tels que les micro-benchmarks, pprof, et certaines options du compilateur, vous devriez repartir armé·e·s d’idées et de techniques pour améliorer la performance de vos propres programmes Go. 😏</p>\n<p>Et, qui sait ? On finira peut-être à l’Etabli pour une bière ou deux ! 🍻</p>\n<p>A bientôt à la Plage Digitale (salle Baleine) !</p>\n<p><a href=\"https://www.meetup.com/fr-FR/go-sxb-go/events/300511378/\" rel=\"noopener\">Participer</a></p>\n<figure><img src=\"/images/blog/65b79a2ac456be11fe229293-1-2.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Les rendez-vous mensuels !</strong></p>\n<p><strong>Achen’ight – 17/05/2024 – 19h00-23h00 👾</strong></p>\n<p>Achen’ight, c’est une soirée par mois où se rassemble l’équipe d’Achencraft pour discuter, rencontrer, rigoler, concevoir, …. bref tout ce qui permet au projet Achencraft de progresser ! 🤩</p>\n<p><strong>Strasbourg Flutter Meetup Group – 14/05/2024 et 28/05/2024 – 18h30-20h30 🚀</strong></p>\n<p>Les participants échangent en anglais 🇬🇧 ou allemand 🇩🇪 !</p>\n<p>▹ Aborder des sujets liés à Flutter<br>▹ Présentation des résultats des deux dernières semaines, ainsi que prévision pour la prochaine itération<br>▹ Échange sur les actualités Flutter (par exemple, notes de version ou nouveaux produits autour de Flutter)</p>\n<p>▶️ Canal Discord (https://discord.gg/AMfvWZEM). Si vous ne pouvez pas participer sur place, n’hésitez pas à visiter la réunion virtuellement.</p>\n<p><strong>Hack SXB – 31/05/2024 – 18h00-23h00 🛠</strong></p>\n<p>Venez partager votre passion pour la création avec un groupe d’étudiants et professionnels !💡</p>\n<p>Présentez vos propres projets ou rejoignez des projets collectifs sur des sujets variés, parfois thématiques, lors de cette soirée de programmation et de bricolage 🛠</p>\n<p><a href=\"https://www.facebook.com/Achencraft\" rel=\"noopener\">Achencraft</a></p>\n<p><a href=\"https://www.meetup.com/fr-FR/strasbourg-flutter-meetup-group/events/297562393/\" rel=\"noopener\">Strasbourg Flutter<br>Meetup Group</a></p>\n<p><a href=\"https://www.facebook.com/HackSXB\" rel=\"noopener\">Hack SXB</a></p>\n<figure><img src=\"/images/blog/662a1254c1dcf049d2362163.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>C’est arrivé le mois dernier … et près de chez vous !</strong></p>\n<p><strong>À la Plage Digitale, il s’en est passé des choses en avril :</strong></p>\n<p>👉🏼 2 permanences professionnelles, 2 rencontres Software Crafters Strasbourg, un after work très animé, l’achat d’une phone box pour nos membres, etc. 🤩</p>\n<p>Suivez-nous sur nos réseaux sociaux pour ne rien louper !</p>"
