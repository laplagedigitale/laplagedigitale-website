  - key: "coworker-de-la-semaine-anthony-bonhomme-le-videaste-multicasquette"
    fields:
      title: "[COWORKER DE LA SEMAINE] Anthony Bonhomme, le vidéaste multicasquette"
      slug: "coworker-de-la-semaine-anthony-bonhomme-le-videaste-multicasquette"
      excerpt: "Aujourd’hui, nous allons faire connaissance avec un professionnel de la caméra. Anthony Bonhomme, représentant l’agence Goodman & You, nous raconte son…"
      body: "<p><strong>Aujourd’hui, nous allons faire connaissance avec un professionnel de la caméra. Anthony Bonhomme, représentant l’agence <a href=\"http://goodmandyou.com/\" rel=\"noopener\">Goodman &amp; You</a>,  nous raconte son parcours atypique. Un jeune homme autodidacte et volontaire : des atouts qui lui ont permis de réussir professionnellement.</strong></p>\n<p><strong>1) Quelle est ta profession ?</strong></p>\n<p>Je suis réalisateur audiovisuel à Strasbourg. J’accompagne mes clients dans toutes les étapes de leur communication vidéo : de la stratégie au concept, du tournage à la post-production. Je travaille surtout pour des agences de communication et des PME. J’essaie d’apporter un regard de communicant, de m’imprégner de l’univers pour produire ce que désire le client. Mon objectif est de partager le meilleur côté de ce que je vois.</p>\n<p>Je me définis comme un entrepreneur qui rêve, qui aime la créativité mais aussi, qui comprend les réalités terre-à-terre du business.</p>\n<p><img src=\"/images/blog/photo-perso.webp\" alt=\"photo_perso\" loading=\"lazy\"></p>\n<p><strong>2) Quand as-tu mis les pieds dans la vidéo ? Comment en es-tu venu à créer la société « Goodman&amp;You » ?</strong></p>\n<p>J’ai commencé petit à petit et très jeune dans l’évènementiel. On galère au début, on commence par de petits contrats. Mais il n’y a pas de secrets, si tu veux réussir tu dois travailler.<br>\nPour le nom, « Goodman&amp;You » est un clin d’oeil à mon nom de famille « Bonhomme ». Je voulais jouer sur cet aspect relationnel et la proximité avec le client : « Vous et moi ». Et puis, je trouve que ça sonne bien.</p>\n<p><strong>3) Pourquoi avoir choisi le coworking et la Plage ?</strong></p>\n<p>J’étais freelance et je voulais m’implanter à Strasbourg. J’ai entendu parler du CPPlex, puis j’ai découvert la Plage Digitale. Pour moi, venir représentait un investissement financier en vue du développement. Je voulais être entouré d’autres entrepreneurs, apprendre d’eux, et simplement accroître mon réseau sur Strasbourg.</p>\n<p>Je pense aussi proposer un service qui intéresse les entrepreneurs aujourd’hui. Comme ce fût le cas il y a quelques temps avec les sites internet, la vidéo devient un outil vraiment essentiel dans la communication. C’est d’actualité.</p>\n<p><strong>4) En quoi la Plage répond-t-elle à tes besoins professionnels ?</strong></p>\n<p>En quelques mois, mon activité a pris un essor considérable. La Plage y est pour beaucoup dans ce développement : grâce au réseau, à l’esprit de travail, aux nouvelles rencontres, aux discussions, aux pauses café …</p>\n<p><img src=\"/images/blog/logo.webp\" alt=\"logo Goodman &amp; You, agence audiovisuelle à Strasbourg\" loading=\"lazy\"></p>\n<p>Au départ, la Plage m’a ouvert de nouvelles portes. Par exemple, j’ai pu couvrir l’évènement du Social Good Day Strasbourg, où SFR était partenaire de l’évènement. J’ai travaillé avec des personnes de la Plage qui avaient elles-mêmes des partenaires ou des relations. Être entouré d’autres entrepreneurs est réellement un atout, tant pour le développement que pour la motivation quotidienne dans le travail. Au bout d’un an et demi à la Plage, je peux vraiment affirmer que le co-working a été, et est encore, une des clefs du développement de Goodman&amp;You.</p>\n<blockquote><p>Anthony Bonhomme, fondateur de l’agence goodmann &amp; you<br>\n<a href=\"http://goodmandyou.com/\" rel=\"noopener\">goodmandyou.com</a>    <a href=\"https://www.facebook.com/pages/Production-et-r%C3%A9alisation-audiovisuelle-%C3%A0-Strasbourg-GoodmanYou/320211144658833?fref=ts\" rel=\"noopener\"><img src=\"/images/blog/test1.webp\" alt=\"test1\" loading=\"lazy\"></a>   <a href=\"https://twitter.com/anthonybonhomme\" rel=\"noopener\"><img src=\"/images/blog/test2.webp\" alt=\"test2\" loading=\"lazy\"></a></p></blockquote>"
      legacy_cover: "/images/blog/vignette-anthony.webp"
