  - key: "etienne-a-la-plage-carnet-de-bord"
    fields:
      title: "Etienne à la Plage : Carnet de Bord"
      slug: "etienne-a-la-plage-carnet-de-bord"
      excerpt: "Un site, pourquoi faire un site ? Une page Facebook ça convient tout à fait. En fait non. Parce qu’un site c’est aussi une identité, une carte de visite…"
      body: "<p>Un site, pourquoi faire un site ? Une page Facebook ça convient tout à fait. En fait non. Parce qu’un site c’est aussi une identité, une carte de visite, quelque chose qui est plus « nous » que tout ce qu’on peut faire ou dire sur Facebook.</p>\n<p>C’est pourquoi je suis heureux de pouvoir à présent m’exprimer ici, et savoir que vous pouvez consulter nos infos sans vendre votre âme à l’ami Zuckerberg, à fortiori dans le contexte délétère actuel de leur introduction en bourse. Mais que trouverez-vous ici ?</p>\n<p>Tout d’abord une mine d’information sur ce que nous sommes, ce que nous faisons, et surtout ce que nous vous invitons à faire avec nous. Le coworking, les horaires d’ouverture, les plannings d’évènements et de réservation de salle, etc. En bref ce site sera notre principale interface de communication.</p>\n<p>Mais vous y trouverez sûrement aussi ce que vous y amènerez, car ce site comme toutes nos actions, est basé sur les interactions, sur le collaboratif. Pour l’instant nous essayons de le rendre le plus exhaustif possible mais chacun sera amené à contribuer selon son bon vouloir et ses motivations.</p>\n<p>Je vais pour ma part essayer de développer notre logique d’ouverture et de transparence et de dresser des états clairs sur nos activités, les problèmes que nous rencontrons et comment nous essayons de les résoudre. Mais ce sera aussi le lieu où nous pourrons célébrer nos victoires ou pleurer nos défaites, en bref partager, puisque c’est une de nos valeurs principales.</p>\n<p>A bientôt à La Plage</p>"
      legacy_cover: ""
      status: "published"
      published_at: "2012-05-25"
      categories: ["actualites"]
      legacy_path: "/etienne-a-la-plage-carnet-de-bord/"
      created_at: "2012-05-25T13:50:18Z"
  - key: "edgefest-plus-on-est-de-fous-et-plus-on-interagit"
    fields:
      title: "EdgeFest : plus on est de fous et plus on interagit"
      slug: "edgefest-plus-on-est-de-fous-et-plus-on-interagit"
      excerpt: "La EdgeFest quèsaco ? Vous avez sûrement déjà entendu parler de la EdgeFest que nous organisons du 15 au 17 Juin. Si ce n’est pas le cas il s’agit d’un…"
      body: "<p><em>La EdgeFest quèsaco ?</em></p>\n<p>Vous avez sûrement déjà entendu parler de la <a href=\"http://www.edgefest.fr/\" rel=\"noopener\">EdgeFest</a> que nous organisons du 15 au 17 Juin. Si ce n’est pas le cas il s’agit d’un évènement regroupant 3 rencontres particulières : les portes ouvertes de La Plage Digitale, une soirée autour des arts créatifs et un barcamp organisé avec le mouvement des <a href=\"http://edgeryders.ppa.coe.int/\" rel=\"noopener\">Edgeryders</a>.</p>\n<p>Alors oui le nom est sûrement étrange, il s’agit déjà d’une collaboration entre les langues de Shakespeare et de Derrick, puisque Edge veut signifier le fait d’être à la pointe, en marge, sur le bord; et l’allemand Fest veut mettre l’accent sur le côté « festival » qui semble le mieux correspondre à l’agrégation des moments de ces trois jours. Personnellement j’avais proposé BordoFiesta mais j’ai vite pris conscience qu’il y avait une antipathie prononcée par ici pour tout ce qui se trouve au Sud géographique de la Loire. Mais comme j’aime bien <a href=\"http://fr.wikipedia.org/wiki/Adam_Copeland\" rel=\"noopener\">Edge</a> je me rangeais vite à l’avis du groupe.</p>\n<figure><img src=\"/images/blog/edge-spear.webp\" alt=\"Edge s&#x27;apprêtant à citer ShakeSPEARe\" loading=\"lazy\"><figcaption>Edge s’apprêtant à citer ShakeSPEARe</figcaption></figure>\n<p>Au cours de ces 3 jours nous vous proposons de venir partager avec nous vos projets, vos expériences, vos motivations, bref de partager ce que vous êtes et ce que vous faites. Derrière notre démarche nous cherchons à développer notre logique d’ouverture et nos interactions avec des milieux et des sphères différentes. J’ai pu constater qu’il est délicat de se détacher de certaines choses, comme par exemple les dénominations « Alsace Digitale » et « La Plage Digitale » qui donnent l’impression aux gens que ce ne sont que des repères de geek ou de techs et qu’il faut avoir un BAC + 5 en programmation procédurale pour pouvoir venir travailler dans l’espace de coworking ou être intéressé aux évènements que nous organisons. Alors qu’en fait un BAC + 4 suffit déjà amplement… Non justement, certes à la base de l’association il s’agit d’évoluer dans un contexte plutôt numérique et « nouvelles technologies » mais nous affichons notre volonté d’ouverture à tous les profils. D’ailleurs la Plage Digitale est accessible à tous ceux qui souhaitent travailler dans un espace de coworking et partager des valeurs de communauté et de convivialité. L’aspect « Digital » est surtout la marque de l’évolution des moyens de communications et d’interactions, mais justement l’immense avantage de disposer d’un lieu comme la Plage est de pouvoir se rencontrer vraiment et de périodiquement pouvoir « localiser » les interactions.</p>\n<h2>Mais revenons à la EdgeFest je vous prie monsieur Etienne !</h2>\n<p>Le <a href=\"http://www.facebook.com/events/261737550600578/\" rel=\"noopener\">EdgeDay</a> autrement appelé « JPP » (pour Journées Portes ouvertes à la Plage) est une sorte d’inauguration grand public qui vient contrebalancer les restrictions que nous nous étions imposée pour l’inauguration officielle. Toute la journée, de 9h à 17h (je vous rassure vous aurez au moins 29 secondes pour quitter les locaux une fois le 5e coup de cloche, nous voulons rester transigeants) nous vous invitons à des rencontres, des présentations et des débats autour des thèmes qui nous sont proches et des partenariats que nous avons déjà pu tisser avec les acteurs locaux du numérique, de l’artistique et du culturel entre autres. Le programme sera bientôt disponible et vous trouverez sûrement des choses qui vous intéressent, l’objectif n’étant pas de forcément vous bloquer une journée entière mais plutôt de pouvoir faciliter la circulation (afin de contourner la limitation que nous avons en termes d’accueil).</p>\n<p>La <a href=\"http://www.facebook.com/events/315428275202408/\" rel=\"noopener\">EdgeNight</a> est une soirée organisée le 15 Juin à <a href=\"http://www.lasalamandrestrasbourg.com/\" rel=\"noopener\">la Salamandre </a>que nous animerons en début de soirée par un <a href=\"http://fr.wikipedia.org/wiki/Pecha_Kucha\" rel=\"noopener\">Pecha Kucha </a>(un poisson d’eau douce à poil long pour les fainéants qui ont la flemme d’aller voir sur Wikipedia) suivi d’un concert et de battle graphiques (pas du paintball hein).</p>\n<p>Enfin, le <a href=\"http://www.facebook.com/events/236923216423817/\" rel=\"noopener\">EdgeCamp</a> est un barcamp du 16 au 17 au <a href=\"http://services-numeriques.unistra.fr/culture-numerique/centre-de-culture-numerique.html\" rel=\"noopener\">Centre de Culture Numérique de l’Université de Strasbourg</a>. Pour ceux qui ne connaissent pas les barcamps il s’agit d’une rencontre organisée autour de mini colloques / débats / conférences. Tous les gens se réunissent périodiquement pour se redistribuer en nouveaux groupes. Nous n’avons pas fixé de thème prédéfini étant donné le large public que nous convions et qui est issu d’horizons différents.</p>\n<p>Nous espérons que vous viendrez nombreux à l’un ou l’autre ou à tous ces évènements. N’oubliez pas que ce sont des invitations à partager et à interagir, pas des pièges à venir vous ennuyer à nous entendre parler, comme je viens peut-être déjà de vous ennuyer à me lire. Mea culpa.</p>"
      legacy_cover: "/images/blog/edgefest-201206.webp"
      status: "published"
      published_at: "2012-06-05"
      categories: ["actualites"]
      legacy_path: "/edgefest-plus-on-est-de-fous-et-plus-on-interagit/"
      created_at: "2012-06-05T10:35:10Z"
  - key: "carnet-de-bord-youpi-cest-la-fete"
    fields:
      title: "Carnet de Bord : Youpi c’est la fête !"
      slug: "carnet-de-bord-youpi-cest-la-fete"
      excerpt: "Ô rage, ô désespoir, ô collaborateurs ennemis. Derrière cette entrée en matière peu joyeuse se cache la triste réalité de l’homme en proie à une profonde…"
      body: "<p>Ô rage, ô désespoir, ô collaborateurs ennemis. Derrière cette entrée en matière peu joyeuse se cache la triste réalité de l’homme en proie à une profonde lassitude face aux erreurs et incompréhensions qu’il croise au long cours de sa vie professionnelle. Le dernier évènement date du moment où j’ai reçu enfin la jolie plaque que je vais installer en bas pour remplacer la feuille scotchée au mur. Certes la feuille en question aura survécu aux intempéries les plus violentes et il peut paraître un peu ingrat de la remplacer à présent par une nouvelle venue plus gracieuse. Mais que voulez-vous, le monde de la communication est impitoyable et laisse peu de place à un quelconque sentimentalisme.</p>\n<p>Me voilà donc joyeusement innocent en train de déballer fiévreusement le joli morceau de plexiglass gravé. Hooo comme c’est joli, y a le logo de La Plage. Haaaaa… ha ha ha… (rire nerveux) OK ils ont oublié de mettre le reste. Respirons un grand coup, errare humanum est, ça peut arriver à tout le monde de se tromper. Certes… Mais pourquoi ça arrive à tout le monde de se tromper quand ils ont affaire à moi uniquement ? J’ai l’impression que La Plage Digitale, et son actuel avatar humain que je suis, canalisent tout le Fail humain à la ronde : erreur de livraison, problème de date, installation électrique douteuse, plantage dans les mises à jour, mauvais branchements, oublis en tout genre, etc.</p>\n<p>Loin de moi l’idée d’en vouloir à une quelconque personne incriminée, même si elle peut être directement en cause. Non je souhaite conserver ma bonhommie naturelle et je ne supporte pas les gens qui s’énervent sur leurs interlocuteurs pour toute panne ou incident. Le type que vous avez en face de vous est forcément le bouc émissaire, le vaillant soldat de l’après-vente envoyé au front pour essuyer les balles et obus de la vindicative clientèle. Je connais ça moi-même dans ma fonction où c’est toujours de ma faute si la clim est en panne, si l’internet ne marche pas, si il n’y a plus de papier dans l’imprimante ou dans un endroit que je ne citerai pas à une heure si proche des repas. J’ai signé pour ça, j’accepte tout à fait d’être le rempart et le sac de sable, et j’ai donc une certaine empathie pour mes confrères défouloirs.</p>\n<p>Mais quand même…</p>\n<p>Prenons l’exemple de la climatisation.  Elle est normalement sensée être branchée sur les communs (compris dans les charges tout ça tout ça). En fait elle était branchée sur… un câble qui aboutissait au tableau électrique sur un grand vide avec un petit post-it « clim 2 ».</p>\n<p><img src=\"/images/blog/dsc-0022.webp\" alt=\"\" loading=\"lazy\"></p>\n<p>« A mon avis, ce doivent être les fils reliés à la climatisation et c’est pour ça qu’elle ne marche pas… » « You don’t say? »</p>\n<p>Une fois le « problème réparé monsieur » la climatisation Nord s’est avérée bien être branchée sur un disjoncteur climatisation (du grand classique) mais marche uniquement en ventilation (pas de refroidissement de l’air, et je pense donc aussi pas de chauffage). La climatisation Sud quant à elle a trouvé de bon ton d’être branchée sur un disjoncteur « chauffe-eau sanitaire femme » (magnifique panneau électrique d’ailleurs avec des disjoncteurs branchés mais sans étiquette où il est très délicat de savoir ce que ça fait quand on met « on / off »… je devrais vérifier, peut être que j’arrive à éteindre des trucs à la médiathèque en face ou certains luminaires du cimetière d’à-côté) Qui plus est, madame la climatisation est relativement timorée et se bloque 3 secondes après qu’on l’allume.  Quelle joie d’être en Alsace et de disposer d’un climat clément, parce que si ça commence à monter à plus de 30° dehors je vais proposer à nos amis de Rue 89 Strasbourg (qui occupent le bureau au Sud) de changer leur local en sauna pour coworkers. Et depuis j’attends, j’ai contacté les différents acteurs de ce mélodrame des temps modernes : le propriétaire, l’installateur de climatisation, l’électricien. Et moi je me retrouve au milieu de ce petit théâtre du n’importe quoi, essayant de faire comprendre aux habitants de La Plage qu’il faut laisser le temps au temps, mais que oui on s’occupe bien de ce problème. Et le pire du pire, c’est que je suis convaincu que les acteurs en question sont extrêmement compétents dans leurs domaines, il s’agit juste d’un concours de circonstances. Et la grande force de La Plage, et de moi-même votre humble serviteur, est d’être toujours premier aux concours de circonstances.</p>\n<p>Finalement je ne serais pas choqué le moins du monde d’apprendre que je sers de cobaye à un programme d’expérimentation sur les limites de la patience humaine, ou bien que derrière tout ça il y a un esprit machiavélique et malin, ou alors une bande de joyeux singes qui pense qu’on peut résoudre tous les problèmes du monde en tapant sur le sol avec des bâtons. Si ça ne marche pas il faut taper plus fort ou changer de bâton.</p>\n<p><em>« Always look on the bright side of life »</em></p>\n<p><iframe src=\"https://www.youtube.com/embed/JrdEMERq8MA\" loading=\"lazy\" allowfullscreen></iframe></p>"
