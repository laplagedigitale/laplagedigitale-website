      slug: "strasbourg-startups-meetup-16-spin-off-investissement-ou-rachat-quelle-strategie-dinnovation-pour-un-groupe"
      excerpt: "Aujourd’hui, une des préoccupations majeures des entreprises est d’être capable de se réinventer, de sortir d’une organisation classique et de développer de…"
      body: "<p>Aujourd’hui, une des préoccupations majeures des entreprises est d’être capable de se réinventer,  de sortir d’une organisation classique et de développer de nouveaux relais de croissance.</p>\n<p>Avec “Innover à tout prix”, comme leitmotiv, les entreprises testent de nouvelles structurations pour gagner en agilité et accélérer leurs efforts.</p>\n<p>Investir dans une startup est une option. Si plus de 61% des «licornes» ont au moins un groupe industriel parmi leurs actionnaires (source <a href=\"http://graphics.wsj.com/billion-dollar-club/\" rel=\"noopener\">Wall Street Journal</a>), c’est que ce schéma de collaboration est tentant et qu’il peut être concluant.</p>\n<p>D’autres testent des constructions en open innovation sortantes. Après avoir délimité les potentiels disruptifs de leur activité, ils les testent sous forme de spin-offs entrepreneuriales, laissant leurs collaborateurs exprimer tout leur potentiel.</p>\n<p>Pour partager ces différentes aventures, deux invités pour ce nouveau Meetup de Strasbourg Startups by Alsace Digitale : Nikolina Apostolova-Riehl, <a href=\"http://www.stock-booking.com/\" rel=\"noopener\">Stockbooking</a> et Grégory Regouby, <a href=\"https://www.groupesereliance.com/\" rel=\"noopener\">Groupe Sereliance</a>.</p>\n<p>Créée en août 2015 par Nikolina Apostolova-Riehl, entrepreneuse au profil international, spécialiste de la supply chain et de la logistique, Stockbooking est issue d’un projet développé en entrepreneuriat. Première plateforme européenne de stockage temporaire qui recense les espaces disponibles dans les entrepôts et les besoins des entreprises, Stockbooking a été “sponsorisé” par le groupe FM Logistic</p>\n<p>« Si le cœur de métier du groupe reste l’offre supply chain destinée aux grands industriels et distributeurs internationaux, FM Logistic voit dans le projet Stockbooking une nouvelle approche dynamique et une évolution du concept de la mutualisation. Au travers de la commercialisation digitalisée Stockbooking, des portes s’ouvrent vers une solution plus flexible du stockage » explique Pablo Gomez, Directeur Innovation pour le groupe FM Logistic.</p>\n<p>Le Groupe Sereliance quant à lui, a très vite compris les enjeux du numérique et du digital. Il a été sélectionné et est labellisé « Bpifrance Excellence » et a rejoint des entreprises à fort potentiel économique.</p>\n<p>Créé il y a 50 ans sur le marché de la serrurerie via Birgel-Schmitt, le groupe Séréliance s’est fortement développé et a conquis de nouveaux marchés, se spécialisant dans l’amélioration de l’habitat des particuliers. Pour s’adapter aux nouveaux modes de consommation et être toujours précurseur, Grégory Regouby a à coeur de diversifier les activités du groupe avec Plus que PRO par exemple ou Au magasin. Pour se rapprocher des startups, il a même récemment créé un incubateur.</p>\n<p>Pour vous inscirte au Meetup #16 c’est <a href=\"https://www.eventbrite.fr/e/billets-strasbourg-startups-meetup-16-spin-off-investissement-ou-rachat-quelle-strategie-dinnovation-pour-40105079372\" rel=\"noopener\">ICI</a> !</p>"
      legacy_cover: "/images/blog/enventbritemeetup16originalsansphoto.webp"
