  - key: "one-hour-of-code-une-heure-pour-sinitier"
    fields:
      title: "One hour of Code : une heure pour s’initier"
      slug: "one-hour-of-code-une-heure-pour-sinitier"
      excerpt: "Du 5 au 11 novembre, le code est à la fête ! Dans le cadre du mouvement mondial Hour of Code, le Coding Club Strasbourg organise un atelier d’initiation le 7…"
      body: "<p><strong>Du 5 au 11 novembre, le code est à la fête ! Dans le cadre du mouvement mondial Hour of Code, le Coding Club Strasbourg organise un atelier d’initiation le 7 décembre de 14h à 16h, au Centre Socioculturel du Neudorf à Strasbourg.</strong></p>\n<p><b>Hour of Code</b>  a pour but de rassembler des millions d’élèves à travers le monde, autour de tutoriels d’une heure, disponibles en ligne et traduit dans plus de 40 langues. Ce mouvement converge autour du <strong>développement et de la programmation informatique, </strong>et est destiné particulièrement aux enfants, mais aussi aux adultes qui veulent découvrir le code.</p>\n<p>L’accent est donné sur l’apprentissage et le partage. Les participants sont là pour apprendre mais également pour transmettre leurs connaissances acquises. <strong>Le tout dans la bonne humeur autour d’un goûter.</strong></p>\n<p><strong>A Strasbourg, l’atelier One Hour of Code a lieu le 7 décembre de 14h à 16h. </strong>Petits comme grands sont les bienvenus pour s’essayer à un<strong> tutoriel Minecraft</strong>, le célèbre jeu vidéo de construction.</p>\n<p>Des étudiants d’Epitech et des membres d’Alsace Digitale seront là pour encadrer les participants. C’est l’occasion pour tous de s’initier au code, mais aussi de développer sa créativité et ses compétences en informatique.</p>\n<p><strong>Y aller :</strong> Centre Socioculturel du Neudorf – 42 Rue du Neufeld, 67100 Strasbourg</p>\n<p>Plus d’informations sur <a href=\"https://hourofcode.com/fr\" rel=\"noopener\"><strong>Hour of Cod</strong>e</a>, et sur le <strong><a href=\"http://codingclub.epitech.eu/\" rel=\"noopener\">Coding Club</a>.</strong></p>"
