  - key: "la-plage-le-rendez-vous-des-developpeurs"
    fields:
      title: "La Plage : Le rendez-vous des développeurs"
      slug: "la-plage-le-rendez-vous-des-developpeurs"
      excerpt: "Vous êtes développeurs ? N’hésitez à prendre part aux 3 meetups organisés en cette fin de mois, respectivement par StrasbourgJS, ReactJS SXB et Strasbourg…"
      body: "<p><strong>Vous êtes développeurs ? N’hésitez à prendre part aux 3 meetups organisés en cette fin de mois, respectivement par StrasbourgJS, ReactJS SXB et Strasbourg Startups, susceptibles de vous intéresser. Sans oublier le traditionnel Hack SXB organisé à la Plage Digitale, qui en fait un véritable lieu de réunion et d’inspiration pour les développeurs.</strong></p>\n<ul><li><strong>Meetup Strasbourg JS</strong></li></ul>\n<p><strong>Déploiement serverless</strong></p>\n<p>Lors de ce Meetup, <a href=\"https://www.linkedin.com/in/paulchobert\" rel=\"noopener\"><strong>Paul CHOBERT</strong></a>, développeur Freelance, présentera comment développer en serverless une application NodeJS.</p>\n<p>Le terme “serverless” est très en vogue actuellement et la définition des architectures serverless mérite d’être discutée. Ce sont des architectures et des applications où l’utilisateur n’a plus à gérer à la moindre infrastructure. En savoir plus <strong><a href=\"http://blog.d2-si.fr/2017/02/21/aws-lambda-serverless/\" rel=\"noopener\">ICI</a></strong>.</p>\n<p>L’événement sera suivi d’une petite collation.</p>\n<p><strong>Inscription</strong> : <strong><a href=\"https://www.meetup.com/fr-FR/StrasbourgJS/events/238360041/?eventId=238360041\" rel=\"noopener\">https://www.meetup.com/fr-FR/StrasbourgJS/events/238360041/?eventId=238360041</a></strong></p>\n<p><strong>Y aller :</strong> mercredi 22 mars de 19h à 21h à la Plage Digitale – 15 route du Rhin 67100 Strasbourg</p>\n<ul><li><strong>Meetup ReactJS SXB </strong></li></ul>\n<p><strong>Présentation de Preact, alternative légère de React avec la même API</strong></p>\n<p>Qu’est-ce que Preact ? Est-ce difficile de l’utiliser ? Faut-il migrer mon code ? Quels sont les bénéfices ?</p>\n<p>Toutes les réponses lors de ce Meetup organisé par ReactJS SXB !</p>\n<p>Au programme, une démonstration : passez votre application sur Preact en une soirée et découvrez les bénéfices par rapport à React.</p>\n<p>Une expérience avec React est vivement conseillée, tous les niveaux sont acceptés.</p>\n<p><strong>Inscription : <a href=\"https://www.meetup.com/fr-FR/ReactJS-SXB/events/238380582/\" rel=\"noopener\">https://www.meetup.com/fr-FR/ReactJS-SXB/events/238380582/</a></strong></p>\n<p><strong>Y aller :</strong> vendredi 24 mars de 19h à 21h à la Plage Digitale – 15 route du Rhin 67100 Strasbourg</p>\n<ul><li><strong>Meetup <a href=\"http://www.strasbourg-startups.com/\" rel=\"noopener\">Strasbourg Startups</a></strong></li></ul>\n<p><strong> Les développeurs(ses), éléments clés pour la création des startups.</strong></p>\n<p>Ce meetup tentera d’analyser l’impact que peut avoir la présence ou, au contraire, l’absence d’un fondateur au profil technique pour la création et le développement d’une startup. En effet, un porteur de projet n’a pas toujours les bonnes compétences pour le réaliser et doit savoir s’entourer.</p>\n<p>Mais, comment se passe la création de la startup quand on doit, dès le début, recruter des développeurs ? Est-il judicieux, dans ces cas là, de sous-traiter à une autre entreprise ou de faire appel à un développeur freelance ? Ou faut-il, au contraire, s’associer avec un autre fondateur technique ?</p>\n<p>Pour répondre à ces questions les invités sont :</p>\n<ul><li>Jérôme SCALIA : fondateur de la startup <strong><a href=\"http://awaken.fr/fr/accueil/\" rel=\"noopener\">Awaken</a></strong></li><li>Paul CHOBERT : <strong><a href=\"https://www.linkedin.com/in/paulchobert/\" rel=\"noopener\">Développeur Freelance</a></strong></li><li>Florian PETIT, président d’<strong><a href=\"https://its-future.com/\" rel=\"noopener\">ITS Future</a></strong></li></ul>\n<p>Ces interventions seront suivies par une table-ronde et un buffet de networking.</p>\n<p><strong>Inscription : <a href=\"https://www.eventbrite.fr/e/billets-meetup-13-32531321057\" rel=\"noopener\">https://www.eventbrite.fr/e/billets-meetup-13-32531321057</a></strong></p>\n<p><strong>Y aller </strong>: jeudi 30 mars à 18h30 au Shadok – 25 presqu’île Malraux 67100 Strasbourg</p>\n<ul><li><strong>Hacksxb #49</strong></li></ul>\n<p><strong>Langage R, Art-Duino et Hop’n’Splash</strong></p>\n<p>Pour ce 49ème rendez-vous du <strong><a href=\"http://www.hacksxb.com/\" rel=\"noopener\">HackSXB</a></strong>, le groupe meetup R vous proposera une introduction au langage R et les élèves du mooc Art-duino pourront continuer leur objet connecté. On vous propose également de travailler sur la suite du jeu Hop’n’Splash.</p>\n<p>Le but est de produire quelque chose de fonctionnel à la fin de la soirée, de faire avancer un projet commun ou votre projet personnel. Une petite présentation à l’ensemble des participants est également appréciée ! Ramenez votre projet en cours, vos problèmes du moment, vos nouveaux gadgets !</p>\n<p>Les règles sont simples : partager avec les autres, montrer ce que vous faites et faire preuve d’ouverture d’esprit !</p>\n<p>Collation offerte par <strong><a href=\"http://www.alsacedigitale.org/\" rel=\"noopener\">Alsace Digitale</a></strong>, n’hésitez pas à ramener aussi quelque chose</p>\n<p><strong>Inscription : <a href=\"https://www.helloasso.com/associations/alsace-digitale/evenements/hacksxb-49-r-art-duino-et-hop-n-splash\" rel=\"noopener\">https://www.helloasso.com/associations/alsace-digitale/evenements/hacksxb-49-r-art-duino-et-hop-n-splash</a></strong></p>\n<p><strong>Y aller :</strong> vendredi 31 mars à partir de 19h à la Plage Digitale – 15 route du Rhin 67100 Strasbourg</p>"
