  - key: "demonight-2-les-jeunes-pousses-entrepreneuriales-ont-du-talent"
    fields:
      title: "DemoNight #2 : les jeunes pousses entrepreneuriales ont du talent"
      slug: "demonight-2-les-jeunes-pousses-entrepreneuriales-ont-du-talent"
      excerpt: "Nous l’avons préparé, le stress était présent mais nous avons réussi ! La DemoNight #2 nous a confirmé que la scène startup strasbourgeoise est riche de…"
      body: "<p>Nous l’avons préparé, le stress était présent mais nous avons réussi ! La DemoNight #2 nous a confirmé que la scène startup strasbourgeoise est riche de talents. Ce 26 septembre, quatre entrepreneurs ont fait leur show à la Plage lors de la soirée <strong>organisée par <a href=\"https://www.facebook.com/StrasbourgStartups\" rel=\"noopener\">Strasbourg Startups</a>.</strong> Devant 50 personnes physiques et quinze en livestreaming, elles avaient chacune cinq minutes pour convaincre de leur utilité.</p>\n<p> Stéphane Becker a introduit la soirée en présentant l’association Alsace Digitale et toutes les initiatives qu’elle entreprend (La Plage, Strasbourg Startup, Startup Weekend Strasbourg,…). Il a ensuite passé la parole à  Jean-Loup Karst de <strong><a href=\"https://twitter.com/PAYMILL_France\" rel=\"noopener\">Paymill France</a>, sponsor de la DemoNight,</strong> pour une keynote pleine de bon sens. Au travers de l’histoire de son entreprise, le Business Developper a donné des leçons primordiales pour toute startup en phase de développement. L’accent doit être mis sur la culture d’entreprise pour améliorer l’engagement des employés. Un public à motiver d’autant plus qu’il représente les premiers ambassadeurs de la marque. Ils doivent se sentir libre donc éviter le micromanagement. Cette attitude peut être vite pesante en étant « sur le dos » de l’employé.</p>\n<p>Se sont suivis <strong><a href=\"http://www.lacartedescolocs.fr\" rel=\"noopener\">La Carte des Colocs,</a></strong> la solution simple pour trouver des colocations dans n’importe quelle ville de France (et bientôt d’Europe, de Brésil et d’Australie); <a href=\"http://www.appsdeck.eu/\" rel=\"noopener\"><strong>Appsdeck</strong> </a>pour héberger et déployer votre application web en 2 minutes chrono; Easy Night, l’application mobile (Iphone et Android) pour trouver vos plans soirées; et <a href=\"http://astelos-senior.com\" rel=\"noopener\"><strong>Astelos Senior</strong>,</a> un site proposant des solutions à la dépendance. Pour une description plus détaillée des startups, nous vous invitons à lire <a href=\"http://bit.ly/18uEMNf\" rel=\"noopener\"><strong>l’article détaillé de la blogueuse Yen Bui</strong></a>. Les photos de la soirée se trouvent sur<a href=\"http://on.fb.me/1h8odKa\" rel=\"noopener\"> notre album photo facebook</a> : venez liker !</p>\n<p>Enfin, les spectateurs ont ensuite échangés avec les équipes sur les projets de chacun. Cette DemoNight #2 a été une réussite… Au point d’encourager <strong><a href=\"https://www.facebook.com/StrasbourgStartups\" rel=\"noopener\">Strasbourg Startups</a> </strong>à réitérer une troisième fois l’opération ?  Sûrement mais, pour l’instant, d’<a href=\"http://www.strasbourg-startups.com/headlines/next-events-planning\" rel=\"noopener\">autres événements sont déjà sur le point d’arriver </a>!</p>\n<p>Le livestreaming de la <a href=\"http://www.livestream.com/?utm_source=lsplayer&amp;utm_medium=embed&amp;utm_campaign=footerlinks\" rel=\"noopener\">DemoNight #2</a></p>"
      legacy_cover: "/images/blog/vignette-demo-night1.webp"
      status: "published"
      published_at: "2013-09-27"
