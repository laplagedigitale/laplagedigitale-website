  - key: "devoxx4kids-3eme-edition-pour-linauguration-de-lppli"
    fields:
      title: "Devoxx4Kids 3ème édition pour l’inauguration de l’@ppli"
      slug: "devoxx4kids-3eme-edition-pour-linauguration-de-lppli"
      excerpt: "Pour cette troisième édition de Devoxx4Kids, nous proposons à tous les enfants d’apprendre les rudiments de la programmation dans le cadre du nouvel espace…"
      body: "<p>Pour cette troisième édition de Devoxx4Kids, nous  proposons à tous les enfants d’apprendre les rudiments de la programmation dans le cadre du nouvel espace numérique de la médiathèque Malraux l’@ppli.</p>\n<p>Rendez-vous le 23 novembre prochain, de 10h à 12h30, à la Médiathèque André Malraux !</p>\n<p>Déroulement d’évènement :<br>\n– présentation de l’outil Scratch<br>\n– composition des binômes<br>\n– atelier codage<br>\n– pause gouter<br>\n– atelier codage<br>\n– présentation des résultats</p>\n<p>L’évènement sera animé par Sébastien Letélié, Valérie Taesch et Nicolas Hirlemann accompagnés de plusieurs étudiants de l’Epitech.</p>\n<p>Inscription à la médiathèque sur place ou par téléphone au <strong>03 88 45 10 10</strong> au département jeunesse</p>\n<p><img src=\"/images/blog/bandeau-blog-l-ppli.webp\" alt=\"Bandeau Blog L@ppli\" loading=\"lazy\"><img src=\"/images/blog/epitech-2011-bitmaps-transparent.webp\" alt=\"Epitech-2011-bitmaps-transparent\" loading=\"lazy\"></p>"
