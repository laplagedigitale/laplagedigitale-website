  - key: "global-game-jam-2016"
    fields:
      title: "Global Game Jam 2016"
      slug: "global-game-jam-2016"
      excerpt: "La Global Game Jam rassemble des talents multiples (développeurs, artistes, infographistes,…) dont l’objectif est de donner vie à un jeu en 48H. Les Game Jam…"
      body: "<p>La <strong>Global Game Jam</strong> rassemble des talents multiples (développeurs, artistes, infographistes,…) dont l’objectif est de donner vie à un jeu en 48H. Les Game Jam permettent à des personnes de formations complètement différentes de se retrouver pour créer un objet vidéo­‐ludique en accord avec un thème dévoilé au début de l’événement (les supports sont souvent libres).</p>\n<p>A l’issue de la Jam, toutes les équipes présentent leur production en la mettant à disposition sur le site de l’organisateur, dans ce cas, celui de la Global Game Jam. Il s’agit d’<strong>un évènement mondial</strong>: 5439 jeux répartis sur plus de 500 sites et 78 pays en un week-end. Dimanche 31 à 17h, les jeux créés à Strasbourg seront présentés dans le monde entier.</p>\n<p>Petite spécificité à Strasbourg, un <strong>jury local sera organisé et remettra des prix</strong> aux équipes ayant participé dans les deux lieux hôtes, à savoir à la <strong>Plage du Shadok</strong> (co-organisé par Alsace Digitale et Epitech) et à la <strong>Ludus Académie</strong> (organisé par Ludus Académie).</p>\n<p>Les équipes présentes se retrouveront également pour <strong>une soirée festive le 05 février à 20h au Shadok</strong> : l’occasion de remettre les distinctions et de présenter les jeux créés au public.</p>\n<p><strong>La participation à la Global Game Jam est gratuite.</strong> Les deux espaces proposent une petite restauration.</p>\n<p>Inscription :<br>\nShadok : <a href=\"http://ggj-strasbourg.eventbrite.fr/\" rel=\"noopener\">http://ggj-strasbourg.eventbrite.fr/<br>\n</a>Ludus Académie : <a href=\"http://globalgamejam.org/2016/jam-sites/ludus-acad%C3%A9mie-strasbourg\" rel=\"noopener\">http://globalgamejam.org/2016/jam-sites/ludus-acad%C3%A9mie-strasbourg</a></p>\n<p>Date : du 29 au 31 janvier 2016</p>"
      legacy_cover: "/images/blog/globalgamejam.webp"
      status: "published"
      published_at: "2016-01-06"
      categories: ["actualites", "evenements"]
      legacy_path: "/global-game-jam-2016/"
      created_at: "2016-01-06T15:06:05Z"
  - key: "strasbourg-startups-meeting-7"
    fields:
      title: "Strasbourg Startups Meeting"
      slug: "strasbourg-startups-meeting-7"
      excerpt: "Garder le Cap ! De nombreux dispositifs d’accompagnement existent. Certains ont été pensés à destination des startups, d’autres plus généralistes peuvent…"
      body: "<p>Garder le Cap !<br>\nDe nombreux dispositifs d’accompagnement existent. Certains ont été pensés à destination des startups, d’autres plus généralistes peuvent aider à concrétiser l’aventure.</p>\n<p>Certains de ces dispositifs ne se conjuguent par ailleurs qu’au féminin. Avis aux initiatives !</p>\n<p>Pour ce prochain meetup, le <strong>Syntec Numérique</strong> présentera aux startups déjà créées ou en devenir, les actions concrètes que le bureau régional Alsace a mis en place vis-à-vis des startups et TPE ainsi que le tout nouveau pack de service lancé par Syntec Numérique à l’attention des startups.<br>\nLe Syntec Numérique est une association professionnelle et une chambre syndicale qui co-gère une convention collective (convention « Syntec »).</p>\n<p>Laura Fort, du <strong>Studio Pixmix</strong> sera également présente pour témoigner. Elle bénéficie gratuitement de cet accompagnement durant 1 an en tant que lauréate du trophée Excellencia entrepreneur dans le cadre du programme Excellencia mis en place par la commission Femmes du numérique de Syntec numérique.</p>\n<p><strong>Alsace Active</strong> et son Labo Régional des Partenariats passeront en revue leur programme et leurs initiatives autour de la création d’entreprise. Alsace Active apporte un soutien technique et financier à tous les projets qui, par l’activité économique, créent des emplois pérennes, prioritairement pour des personnes en situation précaire.</p>\n<p><strong>Pour vous inscrire gratuitement <a href=\"https://www.eventbrite.fr/e/billets-stasbourg-startups-meeting-7-20693009348?aff=es2\" rel=\"noopener\">cliquez ici</a><br>\nDate :</strong> Jeudi 21 janvier 2016<br>\n<strong>Lieu :</strong> Le Shadok, 25 presqu’île André Malraux 67100 Strasbourg</p>"
      legacy_cover: "/images/blog/strassumeeting73.webp"
      status: "published"
      published_at: "2016-01-13"
      categories: ["actualites", "evenements"]
      legacy_path: "/strasbourg-startups-meeting-7/"
      created_at: "2016-01-13T14:30:21Z"
  - key: "collegiens-et-lyceens-programmez-un-robot-avec-le-coding-club"
    fields:
      title: "Collégiens et lycéens, programmez un robot avec le Coding Club"
      slug: "collegiens-et-lyceens-programmez-un-robot-avec-le-coding-club"
      excerpt: "Les Code4Kids & Code4Teens Camps sont des stages de développement qui permettent aux collégiens et lycéens de s’initier à la programmation et aux nouvelles…"
      body: "<p>Les<strong> Code4Kids </strong>&amp;<strong> Code4Teens Camps</strong> sont des stages de développement qui permettent aux <strong>collégiens et lycéens</strong> de s’initier à la programmation et aux nouvelles technologies.</p>\n<p>Les ateliers d’apprentissage sont animés par des étudiants d’Epitech et des bénévoles d’Alsace Digitale.</p>\n<p>Cette fois-ci, venez découvrir la programmation de robots avec nous !<br>\n– Pour les collégiens : nous verrons comment piloter un robot en agençant des blocs logiques sur Scratch.<br>\n– Pour les lycéens : nous verrons comment contrôler le robot en écrivant des lignes de code.<br>\nLes ateliers Coding Club sont organisés par Alsace Digitale en partenariat avec Orange et Top Music.</p>\n<p>Pour vous inscrire, <a href=\"http://codingclub.epitech.eu/inscription-strasbourg.html\" rel=\"noopener\">cliquez ici</a></p>\n<p><strong>Dates </strong><br>\n<strong>Code4Kids</strong> à destination des collégiens : les 8 et 9 février 2016<br>\n<strong>Code4Teens</strong> à destination des lycéens : les 10, 11 et 12 février 2016 de 10 à17h.</p>\n<p><strong>Lieu </strong><br>\nEpitech Strasbourg<br>\n4 Rue du dôme<br>\n67000 Strasbourg</p>"
      legacy_cover: "/images/blog/logo-coding-club.webp"
      status: "published"
      published_at: "2016-01-14"
      categories: ["actualites", "coding-club"]
      legacy_path: "/collegiens-et-lyceens-programmez-un-robot-avec-le-coding-club/"
      created_at: "2016-01-14T15:05:24Z"
  - key: "laprimaire-org-debarque-a-strasbourg"
    fields:
      title: "LaPrimaire.org débarque à Strasbourg !"
      slug: "laprimaire-org-debarque-a-strasbourg"
      excerpt: "Alsace Digitale est partenaire de LaPrimaire.org LaPrimaire.org : qu’est-ce que c’est ? Il s’agit d’une primaire ouverte et organisée pour permettre aux…"
      body: "<p>Alsace Digitale est partenaire de <a href=\"https://laprimaire.org/\" rel=\"noopener\">LaPrimaire.org</a></p>\n<h3><strong>LaPrimaire.org : qu’est-ce que c’est ?</strong></h3>\n<p>Il s’agit d’une primaire ouverte et organisée pour permettre aux français de <strong>choisir de manière transparente et démocratique</strong> les candidats qu’ils souhaitent voir se présenter à l’élection présidentielle de 2017.</p>\n<p><a href=\"https://laprimaire.org/\" rel=\"noopener\">LaPrimaire.org</a> a été créé en partant du constat que les citoyens n’ont plus réellement le choix des candidats pour lesquels ils doivent voter dans le cadre des différentes élections. En effet, ces derniers sont désignés par les partis politiques, soit 0.5% de la population. Son objectif est donc de permettre aux citoyens de choisir librement leur candidat et ainsi reprendre en main leur pays en prévision des élections présidentielles de 2017.</p>\n<h3><strong>Une soirée conférence et débat le 4 février à Strasbourg</strong></h3>\n<p>Afin de mieux cerner le fonctionnement de cette primaire et d’échanger autour de sa problématique, une conférence est organisée le 4 février et <strong>tout le monde peut y participer</strong>.</p>\n<p>La soirée se déroulera en trois étapes :</p>\n<ul><li>Premièrement, une présentation synthétique de l’initiative, sa philosophie, ses modalités de déroulement, la technologie utilisée ;</li><li>Puis, un long moment d’échange avec celles et ceux qui seront présents, sous forme de questions/réponses ;</li><li>Enfin, des discussions plus informelles, à l’issue de la soirée, avec celles et ceux qui le souhaitent.</li></ul>\n<p><strong>Date :</strong> Jeudi 4 février 2016 de 19:00 à 22:00 (Heure : France)<br>\n<strong>Lieu :</strong> La maison des associations, 1a Place des Orphelins, 67000 Strasbourg</p>\n<p>Pour vous inscrire, <a href=\"https://www.eventbrite.fr/e/billets-conference-debat-laprimaireorg-a-strasbourg-20542601474\" rel=\"noopener\">cliquez ici ! </a><br>\nPlus d’infos sur <a href=\"https://laprimaire.org/\" rel=\"noopener\">LaPrimaire.org</a></p>"
      legacy_cover: "/images/blog/laprimaire.webp"
      status: "published"
      published_at: "2016-01-18"
      categories: ["actualites", "evenements"]
      legacy_path: "/laprimaire-org-debarque-a-strasbourg/"
      created_at: "2016-01-18T15:58:11Z"
  - key: "growing-local-startups-a-win-win-strategy-for-jobs-in-europe"
    fields:
      title: "Growing local startups: a win-win strategy for jobs in Europe?"
      slug: "growing-local-startups-a-win-win-strategy-for-jobs-in-europe"
      excerpt: "La Startup Europe Week, un évènement européen du 01 au 05 février A Strasbourg – Mercredi 03 février à 08h30 au Shadok Au cours des dix dernières années, de…"
      body: "<p><strong><img src=\"/images/blog/new-carousel-startupeurope-500x254px-11797-1.webp\" alt=\"new-carousel-startupeurope-500x254px_11797\" loading=\"lazy\"></strong></p>\n<p><strong>La Startup Europe Week, un évènement européen du 01 au 05 février</strong></p>\n<p><strong>A Strasbourg – Mercredi 03 février à 08h30 au Shadok</strong></p>\n<p>Au cours des dix dernières années, de nombreux événements ont été organisés un peu partout en Europe sur le thème de l’entrepreunariat. Le déroulement de ces événements se calquaient sur ceux de la Silicon Valley (keynotes, sessions de réseautage etc…). Cependant, l’Europe est bien différente et a besoin d’ajustement afin de correspondre à ses particularités. Les diversités régionales et politiques locales jouent un rôle majeur dans le développement de ses startups. </p>\n<p>L’ambition de la Startup Europe Week est de <strong>rassembler autant de régions et d’acteurs européens que possible</strong> avec le soutien de <a href=\"http://startupeuropeclub.eu/\" rel=\"noopener\">Startup Europe</a> et <a href=\"http://cor.europa.eu/en/Pages/home.aspx\" rel=\"noopener\">EU Committee of the Regions</a>.<br>\n<br>\n<strong>Du 1er au 5 février, la SEW mettra en lumière toutes les actions mises en place par les régions pour soutenir les entrepreneurs européens.</strong> En restant conscient du contexte global, c’est d’abord les actions à échelle locale qui aident à démarrer une activité. </p>\n<h3>Rencontrez les membres du Parlement lors d’un World Cafe au Shadok</h3>\n<p>L’objectif est de permettre aux entrepreneurs de rencontrer les membres du Parlement Européen afin de leur poser des questions, éclaircir leur situation, faire part de leurs besoins et de leurs initiatives. Les participants changeront de table toutes les 15 minutes afin de rencontrer un maximum de personnes et de faire fructifier les échanges.</p>\n<p>Voici, à titre d’exemples différents axes qui seront étayés durant toute la semaine et donc durant ce World Cafe :</p>\n<ul><li>Quelles sont  les meilleures initiatives promues par les régions pour soutenir les entrepreneurs ?</li><li>Informer l’écosystème local de ce qui existe déjà pour leur venir en aide</li><li>L’Eurometropole est-elle attractive pour les Startups ?</li><li>Quels sont les freins au développement des Startups en dehors de leur région, de leur pays ?</li><li>Partager avec les acteurs régionaux sur ce que les autres régions en Europe font et ce qui peut être exploité localement</li><li>Comment l’Europe peut-elle être un levier ?</li></ul>\n<p>Les places seront disponibles<strong> <a href=\"https://fr.amiando.com/sew-strasbourg.html\" rel=\"noopener\">sur inscription</a>.</strong></p>\n<p>Une session de feedbacks et de questions-réponses viendra clôturer cet évènement.</p>\n<p><strong>Lieu :</strong> la Plage du Shadok, 25 presqu’île André Malraux<br>\n<strong>Date : Mercredi 03 février de 08h30 à 10h</strong></p>\n<p>Traduction :</p>\n<p>StartUp European Week Strasbourg event: « Growing local startups:  a win-win strategy for jobs in Europe? » Wednesday 3 February 2016. 8 :30-10 :00</p>\n<p>Format : Small introductory speeches followed by World Café discussions</p>\n<p>8:30 Introductions (1 minute speaking time) each:</p>\n<p>8:55 World Café discussions starts between start-ups entrepreneurs and MEPs</p>\n<p>Sessions of 15 minutes : the participants will sit at different table and turn 3 times</p>\n<p>Questions to be discussed:</p>\n<p>• What is Alsace doing to attract start-ups? Other helpful (or less) helpful public policy activities that should be encouraged and at what level? Local, national, European.</p>\n<p>• Can Start Up Europe help?</p>\n<p>• What types of financing are needed? Public and/or private?</p>\n<p>• Skills and recruitment issues?  What can be done locally to provide skills? And are new ways of working seen as positive or disruptive?</p>\n<p>• Connecting digital hubs- opportunities and challenges?</p>\n<p>This event is organized by  Alsace Digitale, the Shadok , France Digital and the S&amp;D Digital Europe Working Group.</p>"
      legacy_cover: "/images/blog/new-carousel-startupeurope-500x254px-11797-1.webp"
