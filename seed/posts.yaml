  - key: "alsacalcul-hpc-event"
    fields:
      title: "AlsaCalcul HPC Event"
      slug: "alsacalcul-hpc-event"
      excerpt: "Mardi 14 juin 2016: 14h00-18h30 Centre de Calcul de l’Université de Strasbourg Un événement organisé le 14 juin 2016 avec la collaboration d’Alsace Digitale.…"
      body: "<p>Mardi 14 juin 2016: 14h00-18h30</p>\n<p>Centre de Calcul de l’Université de Strasbourg</p>\n<p>Un événement organisé le 14 juin 2016 avec la collaboration d’<a href=\"http://www.alsacedigitale.org/\" rel=\"noopener\">Alsace Digitale</a>.</p>\n<p>Venez rencontrer les acteurs majeurs du HPC. Les intervenants partageront avec vous leurs points de vue sur les enjeux autour du HPC et les dernières évolutions des outils pour le calcul intensif.</p>\n<p>Bien évidemment, le format se veut complétement interactif avec <strong>un atelier d’initiation à la programmation GPU</strong> proposé par <strong>Nvidia (apportez vos ordinateurs portables).</strong></p>\n<p>Une <strong>session de networking</strong> autour d’un cocktail sera proposée à l’issue de l’événement.</p>\n<p>Profitez de cet évènement <strong>gratuit </strong>pour poser vos questions, vous renseigner, vous sensibiliser au calcul intensif et son évolution!!</p>\n<p>Cette demi-journée précède <strong><em>le Challenge « GPU-Programming ». Si vous avez besoin de booster votre appli c’est le moment.</em></strong></p>\n<p>Le programme détaillé se trouve : <a href=\"http://alsacalcul.unistra.fr/wp-content/uploads/2016/04/Programme-GPU-Challenge.pdf\" rel=\"noopener\">Programme-GPU Challenge du 14 au 16 juin 2016.</a></p>\n<p>Réservez vos billets (<strong>inscription obligatoire</strong>) : <a href=\"https://alsacalcul-hpc-2016.eventbrite.fr/\" rel=\"noopener\">https://alsacalcul-hpc-2016.eventbrite.fr</a></p>\n<p>Centre de Calcul de l’Université de Strasbourg<br>\nESPE Alsace, au 141 avenue de Colmar, 67100 Strasbourg</p>"
      legacy_cover: "/images/blog/logo-alsacalcul-300x250.webp"
      status: "published"
      published_at: "2016-05-03"
      categories: ["actualites", "evenements"]
      legacy_path: "/alsacalcul-hpc-event/"
      created_at: "2016-05-03T10:02:07Z"
  - key: "strasbourg-startups-meeting-10"
    fields:
      title: "Strasbourg Startups Meetup #10"
      slug: "strasbourg-startups-meeting-10"
      excerpt: "19 mai 2016: 19h00 – 22h00 French Tech Alsace deuxième round L’objectif du label French Tech est de faire de la France entière un vaste accélérateur de…"
      body: "<p>19 mai 2016: 19h00 – 22h00</p>\n<p>French Tech Alsace deuxième round</p>\n<p>L’objectif du label French Tech est de faire de la France entière un vaste accélérateur de startups ! L’Alsace s’est positionnée dans un vaste réseau d’écosystèmes attractifs qui répondent aux besoins des startups françaises, des investisseurs et des talents étrangers. Le label écosystème Medtech lui a été attribué, une demande de labellisation Industrie 4.0 est en cours. Le moment de faire le point sur cette dynamique qui nous accompagnera sur la route d’une reconnaissance mondiale !</p>\n<p>Invité : Christophe Perih et Luc Soler</p>\n<p>Christophe Perih, directeur de la French Tech Alsace a pour mission de fédérer et d’impliquer davantage les acteurs économiques dans le processus French Tech. Son rôle sera enfin de suivre les programmes nationaux et internationaux de la Mission French Tech, tout en assurant la promotion de la French Tech Alsace à l’extérieur de la région.</p>\n<p>Dans l’immédiat, Christophe Perih a en charge la mise en place d’une gouvernance associant de façon étroite entrepreneurs et investisseurs, qui seront désormais intégrés au comité de pilotage et de créer le Club French Tech Alsace, instance de concertation et de créativité qui rassemble tout un faisceau d’acteurs privés (entrepreneurs, startupeurs, mentors, financeurs, etc.) en vue de faire émerger de nouveaux projets, de promouvoir la mise en réseau, de booster le partage d’expériences et de compétences.</p>\n<p>Directeur scientifique de l’IRCAD et de l’IHU Strasbourg, enseignant à l’Université de Strasbourg , Luc Soler est membre fondateur de Visible Patient.</p>\n<p>Cette startup propose un service en ligne novateur et convivial pour les praticiens qui ont besoin d’une modélisation 3D personnalisée d’un patient afin de planifier efficacement leur thérapie. Cette technologie a été imaginée en 1999 et développée dans le cadre de l’Institut de recherche contre les cancers de l’appareil digestif (Ircad). Son président-fondateur, le professeur Jacques Marescaux, est d’ailleurs le premier actionnaire de la startup, aux côtés de plusieurs cadres et d’un industriel du secteur médical qui ont investi ensemble 3 millions d’euros.</p>\n<p>Après une phase de développement, le projet a pris son envol de façon autonome en 2013 suite à un appel d’offres européen. C’est aujourd’hui une des startups fleurons de l’écosystème Medtech strasbourgeois.</p>\n<p>Le Shadok – 25 presqu’île André Malraux, 67100 Strasbourg</p>\n<p>Pour vous inscrire, rendez-vous <a href=\"https://www.eventbrite.fr/e/billets-startups-meeting-10-25192572663\" rel=\"noopener\">ici</a>.</p>"
      legacy_cover: "/images/blog/strasbourg-startups.webp"
      status: "published"
      published_at: "2016-05-04"
      categories: ["actualites", "evenements"]
      legacy_path: "/strasbourg-startups-meeting-10/"
      created_at: "2016-05-04T09:15:37Z"
  - key: "imagine-cup-junior"
    fields:
      title: "Imagine Cup Junior"
      slug: "imagine-cup-junior"
      excerpt: "Microsoft organise depuis le 2 mai, un concours national appelé Imagine Cup Junior. Le but de ce concours est de réaliser un jeu vidéo sur le thème de…"
      body: "<p>Microsoft organise depuis le 2 mai, un concours national appelé Imagine Cup Junior. Le but de ce concours est de réaliser un jeu vidéo sur le thème de l’espace.</p>\n<p>Il est ouvert gratuitement aux jeunes du CM1 à la 3ème qui bénéficieront d’une initiation ludique à la programmation, au code et aux outils web.</p>\n<p>A Strasbourg dans le cadre du Coding Club, les bénévoles d’Alsace Digitale et d’Epitech se proposent d’encadrer les participants qui le souhaitent.<br>\n<strong>3 défis à réaliser seront donnés avant le 17 mai</strong> à l’issue desquels, les meilleurs pourront s’affronter le <strong>samedi 11 juin lors d’</strong><strong>un «Imagine Cup Junior Camp», un hackathon national</strong> qui se déroulera dans les 12 villes de France au sein des locaux d’Epitech.</p>\n<p>Premier rendez-vous pour faire le point sur les défis : <strong>mercredi 11 mai entre 14h et 18h</strong> dans les locaux d’Epitech. (vous pouvez venir tout ou partie de l’après-midi ou poser vos questions par mail).<br>\n<br>\nAlors que vous soyez débutant(e) ou jeune passionné(e), ce défis est l’occasion pour vous de vivre une aventure d’exception.</p>\n<p>Si votre enfant désire participer à ce concours, il vous suffit de nous confirmer son inscription par mail : codingclub@alsacedigitale.org<br>\n<br>\nInscrivez-vous <a href=\"https://www.imaginecupjunior.fr/\" rel=\"noopener\">ici</a>.</p>\n<p>4 Rue du Dôme, 67000 Strasbourg</p>"
      legacy_cover: "/images/blog/13131083-1314232941924884-2933386281989808973-o.webp"
      status: "published"
      published_at: "2016-05-10"
      categories: ["actualites", "coding-club", "evenements"]
