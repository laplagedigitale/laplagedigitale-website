  - key: "meetup26-cofondateurs-je-taime-moi-non-plus"
    fields:
      title: "Meetup#26 – Cofondateurs : Je t’aime, moi non plus"
      slug: "meetup26-cofondateurs-je-taime-moi-non-plus"
      excerpt: "Un cofondateur, c’est un partenaire crucial pour la vie d’une startup : une véritable âme-sœur entrepreneuriale. Alignement des visions, même modes de gestion…"
      body: "<p>Un cofondateur, c’est un partenaire crucial pour la vie d’une startup : une véritable âme-sœur entrepreneuriale. Alignement des visions, même modes de gestion ou complémentarité, fluidité dans la communication, partage des rôles, répartition équitable des parts… les exigences de cette aventure à plusieurs sont nombreuses. Les aléas également.</p>\n<p>Partons du début : la rencontre… Le cofondateur idéal s’engagera corps et âme, contribuera à l’atteinte des objectifs et représentera l’image de l’entreprise. Vous allez vivre collé l’un à l’autre, en hyper-dépendance, pendant plusieurs années. Pour dénicher la perle rare, les startups ont recours à plusieurs solutions : diffusion d’annonces, se faire héberger dans un incubateur, participer à un startup week-end ou fréquenter les groupement ou salons de startups pour y croiser d’autres entrepreneurs…. Mais comment savoir que c’est le bon ?</p>\n<p>Vous l’avez trouvé ? Félicitations.</p>\n<p>Allons à la fin 🙁 Un conflit, un changement de situation personnelle ou parfois d’une soif de nouvelles aventures et c’est la rupture, le divorce, la déchirure. Quel est l’impact pour l’entreprise ? Comment les Startups ont survécu face à cette situation ? Comment trouver une entente pour ne pas handicaper l’avenir de l’entreprise? Quels sont les procédures pour se séparer à l’amiable?</p>\n<p>Après plusieurs témoignages de startups, deux intervenants animeront ce Meetup #26 de Strasbourg Startups by Alsace Digitale</p>\n<p>Les intervenants</p>\n<p>Jérôme Scalia, fondateur de Awaken, une startup qui a développé un boitier pour les véhicules, le AWAKEN Car, qui permet, entre autres, de détecter les collisions, de prévenir les secours en cas d’accident, de le géolocaliser, etc</p>\n<p>Alexandra Lopez, Dirigeante de Juriest, ayant accompagné plusieurs startups dans des séparations difficiles.</p>\n<p>Comme à chaque meetup, nous finirons par une séance de questions – réponses suivie d’un moment de networking autour d’un buffet. Entrepreneurs, startupers ou curieux, n’hésitez pas à venir échanger !</p>\n<p>Où : Le Shadok<br>\nQuand : Jeudi 26 Septembre 2019 à 18h30<br>\nBilletterie : https://www.eventbrite.fr/e/billets-meetup26-cofondateurs-je-taimemoi-non-plus-72053121827</p>"
      legacy_cover: "/images/blog/le-bon-visuel-meetup-26.webp"
      status: "published"
      published_at: "2019-09-11"
      categories: ["actualites", "evenements"]
      legacy_path: "/meetup26-cofondateurs-je-taime-moi-non-plus/"
      created_at: "2019-09-11T09:54:56Z"
  - key: "hacksxb-76-hic-en-approche"
    fields:
      title: "HackSXB #76 – HIC en approche !"
      slug: "hacksxb-76-hic-en-approche"
      excerpt: "Thématique du HackSXB de ce mois de septembre : le Hacking Industry Camp ! Vous avez envie de participer au HIC ? C’est l’occasion de vous y préparer, en…"
      body: "<p><strong>Thématique du HackSXB de ce mois de septembre : le Hacking Industry Camp !</strong><br>\n<strong>Vous avez envie de participer au HIC ? C’est l’occasion de vous y préparer, en expérimentant des technos, etc.</strong></p>\n<p>Le Hacking Industry Camp est un hackathon dédié à l’industrie, un évènement destiné à bousculer les idées et à faire émerger de nouveaux projets. Des équipes aux divers talents s’affrontent pendant tout un week-end pour concevoir des prototypes d’applications, d’objets connectés… C’est un espace-temps où les communautés se croisent et fourmillent d’idées avec pour objectif l’innovation ! Plus d’information : http://www.hackingindustry.camp/</p>\n<p>Pour rappel : des robots éducatifs, des Arduino et des capteurs sont à disposition.</p>\n<p>Alsace Digitale sponsorise le repas. N’hésitez pas à ramener quelque chose à boire / grignoter !</p>\n<p>“Talk is cheap, show me the code, the PCB, whatever”.</p>\n<p>Le but est de produire quelque chose de fonctionnel à la fin de la soirée, de faire avancer un projet commun ou votre projet personnel. Une petite présentation à l’ensemble des participants est également appréciée ! Ramenez votre projet en cours, vos problèmes du moment, vos nouveaux gadgets !</p>\n<p>Les règles sont simples : partager avec les autres, montrer ce que vous faites et faire preuve d’ouverture d’esprit !</p>\n<p>Rendez-vous le vendredi 27 septembre à 19h à La Plage Digitale (15 avenue du Rhin)</p>\n<p>Vous pouvez annoncer sur <a href=\"https://www.facebook.com/events/2358472424372679/\" rel=\"noopener\">cet événement</a> votre sujet de travail et vos besoins en matos ou autre.</p>"
      legacy_cover: "/images/blog/70857534-2459143957480304-7007815403481071616-o.webp"
      status: "published"
      published_at: "2019-09-17"
      categories: ["actualites", "evenements"]
      legacy_path: "/hacksxb-76-hic-en-approche/"
      created_at: "2019-09-17T07:43:20Z"
  - key: "meetup-27-web-summit-ces-quelle-strategie-pour-une-startup-dans-un-salon"
    fields:
      title: "Meetup #27 – Web Summit, CES… : Quelle stratégie pour une startup dans un salon ?"
      slug: "meetup-27-web-summit-ces-quelle-strategie-pour-une-startup-dans-un-salon"
      excerpt: "Les startups reçoivent beaucoup de sollicitations pour participer à des salons. Tout le monde a entendu parler du Web Summit, de Viva Technology ou du CES. En…"
      body: "<p>Les startups reçoivent beaucoup de sollicitations pour participer à des salons. Tout le monde a entendu parler du Web Summit, de Viva Technology ou du CES.</p>\n<p>En parallèle, le salon professionnel a une image désuète et un modèle qui rend difficile pour une startup de calculer un Retour sur Investissement (ROI), surtout à l’air du web marketing.</p>\n<p><strong>Est-ce qu’une startup doit participer à un salon ? Si oui, comment ? Comment calculer le ROI ? ?</strong></p>\n<p>D’autant plus que la participation à un salon est un gros investissement pour une startup qui démarre : prix de l’entrée ou du stand, prix d’aménagement du stand, mobilisation de personnel, etc.</p>\n<p>Pour vous aider à adopter la stratégie qui vous permettra de réussir votre présence à un salon, nos intervenants vous partageront les étapes clés à ne pas rater en amont et aval suivi de leurs conseils.</p>\n<p>Les Intervenants :</p>\n<ul><li><strong>Geoffrey Kretz</strong>, Co-fondateur de Kwit</li><li><strong>Delphine Kuhry</strong>, Co-fondatrice de Mes-Sorties.fr</li><li><strong>Polina Mickhaylova</strong>, Co-fondatrice de Knot</li></ul>\n<p>Comme pour chaque meetup, nous finirons par une séance de questions – réponses suivie d’un moment de networking autour d’un buffet.</p>\n<p><strong>N’hésitez pas à venir échanger ! </strong>?</p>\n<p><strong>Où</strong> : Le Shadok<br>\n<strong>Quand</strong> : Jeudi 28 novembre 2019 à 18h30<br>\n<strong>Lien billetterie</strong> : <a href=\"https://www.eventbrite.fr/e/billets-meetup27-quelle-strategie-pour-une-startup-dans-un-salon-82521874147?aff=efbeventtix&amp;fbclid=IwAR3UeW8wcbhGC_150dj5v2dfn0uzabHrhwyWjH1mBy6jrtsQjSPQ4g7KOsM\" rel=\"noopener\">Billetterie meetup #27</a></p>"
      legacy_cover: "/images/blog/76180543-2410549622400811-6805515945553952768-o.webp"
      status: "published"
      published_at: "2019-11-22"
      categories: ["actualites", "evenements"]
      legacy_path: "/meetup-27-web-summit-ces-quelle-strategie-pour-une-startup-dans-un-salon/"
