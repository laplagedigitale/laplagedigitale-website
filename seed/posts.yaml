  - key: "hack-sxb-47-hack-et-gaming"
    fields:
      title: "Hack SXB #47 : Hack et Gaming !"
      slug: "hack-sxb-47-hack-et-gaming"
      excerpt: "En 2017, le Hack SXB démarre fort avec une édition Hack et Gaming au sein de l’école Ludus Académie, qui aura lieu le vendredi 27 janvier. Ce mois-ci a lieu…"
      body: "<p><strong>En 2017, le Hack SXB démarre fort avec une édition Hack et Gaming au sein de l’école Ludus Académie, qui aura lieu le vendredi 27 janvier.</strong></p>\n<p>Ce mois-ci a lieu la <a href=\"/blog/la-global-game-jam-est-de-retour\"><strong>Global Game Jam</strong></a>, concours mondial de création de jeux vidéo. Pour rester dans le thème, Théo Meyer sera l’invité de cette 47e édition du Hack SXB et nous présentera en début de soirée sa console de jeux <a href=\"http://www.u-gems.com/\" rel=\"noopener\"><strong>uGEMS</strong></a>.</p>\n<p><em>“Talk is cheap, show me the code, the PCB, whatever”.</em></p>\n<p>Comme d’habitude, le but est de produire quelque chose de fonctionnel à la fin de la soirée, de faire avancer un projet commun ou votre projet personnel. Une petite présentation à l’ensemble des participants est également appréciée ! Ramenez votre projet en cours, vos problèmes du moment, vos nouveaux gadgets !</p>\n<p><strong>Les règles sont simples : partager avec les autres, montrer ce que vous faites et faire preuve d’ouverture d’esprit !</strong></p>\n<p>Une collation est offerte par Alsace Digitale, n’hésitez pas à ramener aussi quelque chose.</p>\n<p><strong><a href=\"https://www.helloasso.com/associations/alsace-digitale/evenements/hacksxb-47\" rel=\"noopener\">Je m’inscris !</a></strong></p>\n<p><strong>Y aller :</strong> Le 27 janvier à 19h chez Ludus Académie – 44 Avenue de la Forêt-Noire 67000 Strasbourg</p>\n<p>Plus d’infos sur le Hack SXB sur son <a href=\"http://www.hacksxb.com/\" rel=\"noopener\"><strong>site</strong> </a>et sur sa page <a href=\"https://www.facebook.com/HackSXB/\" rel=\"noopener\"><strong>Facebook</strong> </a>!</p>"
      legacy_cover: "/images/blog/15941271-1276042509123794-6425758913558650327-n.webp"
      status: "published"
      published_at: "2017-01-11"
      categories: ["actualites"]
      legacy_path: "/hack-sxb-47-hack-et-gaming/"
      created_at: "2017-01-11T16:17:03Z"
  - key: "compte-rendu-global-game-jam-2017"
    fields:
      title: "Compte-rendu Global Game Jam 2017"
      slug: "compte-rendu-global-game-jam-2017"
      excerpt: "Ce week-end concouraient une centaine de personnes répartit en 17 équipes lors de l’édition 2017 de la Global Game Jam à Strasbourg ! Leur but : créer un jeu…"
      body: "<p><strong>Ce week-end concouraient une centaine de personnes répartit en 17 équipes lors de l’édition 2017 de la Global Game Jam à Strasbourg ! Leur but : créer un jeu vidéo ou de société en 48h sur le thème « Waves ».</strong></p>\n<p>En 2016, 6 867 jeux ont été créés à travers 93 pays en un week-end, et ce record a été battu ! En effet, lors de cette édition 2017, on recense plus de <strong> 7 000 jeux</strong> crées sur <strong>702 lieux</strong> à travers <strong>95 pays</strong> dans le monde ! Et pas moins de <strong>36 000 participants</strong> au total !</p>\n<p>Nos jamers strasbourgeois peuvent donc être fiers d’avoir participé à ce <strong>nouveau record</strong>, et on leur donne rendez-vous l’année prochaine pour toujours plus de créativité !</p>\n<p>Mais cette édition 2017 n’est pas totalement finie. Un <a href=\"https://www.facebook.com/events/1829822497237621/\" rel=\"noopener\"><strong>After</strong> </a>ouvert au public est organisé<strong> lundi 30 janvier à 19h au Shadok</strong> pour venir tester les jeux crées lors de cette édition par les équipes strasbourgeoises. L’occasion également de remettre les prix du jury aux équipes gagnantes. Le tout autour d’un pot convivial.</p>\n<p>Une session de rattrapage a également lieu le <strong>3 février au bar <a href=\"https://www.meltdown.bar/strasbourg\" rel=\"noopener\">Meltdown</a></strong>.</p>\n<p>En attendant, on vous laisse revivre ce week-end gaming à travers les <a href=\"https://www.facebook.com/alsace.digitale/photos/?tab=album&amp;album_id=1558321877515988\" rel=\"noopener\"><strong>photos</strong> </a>de David Chevillet et Florian Fries. Et surtout retrouvez les jeux créés lors de cette édition sur le site de la <strong><a href=\"http://globalgamejam.org/2017/games\" rel=\"noopener\">Global Game Jam</a></strong> !</p>\n<p><strong>Merci à tous les participants, à nos bénévoles et à nos partenaires pour ce week-end.</strong></p>\n<p><strong>A très bientôt !</strong></p>"
      legacy_cover: "/images/blog/dsc-0305-5.webp"
      status: "published"
      published_at: "2017-01-23"
      categories: ["actualites"]
      legacy_path: "/compte-rendu-global-game-jam-2017/"
      created_at: "2017-01-23T15:08:44Z"
  - key: "atelier-focus-innovation-4-0"
    fields:
      title: "Focus Innovation 4.0 : PI et Open Innovation"
      slug: "atelier-focus-innovation-4-0"
      excerpt: "Mardi 28 février à 18h à la Maison du Technopole de Mulhouse se tiendra un Focus Industrie 4.0 sur le thème de l’Open Innovation, où sera notamment abordée la…"
      body: "<p><strong>Mardi 28 février à 18h à la Maison du Technopole de Mulhouse se tiendra un Focus Industrie 4.0 sur le thème de l’Open Innovation, où sera notamment abordée la question de la Propriété Industrielle en présence de l’INPI.</strong></p>\n<p>Alsace Digitale, l’Adira, l’INPI et le Technopole Mulhouse vous invitent à découvrir les véritables risques mais surtout les opportunités pour votre entreprise (TPE, PME ou Grands Groupes)  à s’ouvrir à l’<strong>Open Innovation.</strong></p>\n<p>L’Innovation ouverte ou Open Innovation , parfois aussi Innovation distribuée désignent dans les domaines de la recherche et du développement des modes d’innovation fondés sur le partage, la collaboration. Cette approche est compatible avec une économie de marché (via les brevets et licences) et avec l’Intelligence économique, et permet des approches alternatives éthiques ou solidaires de partage libre des savoirs et savoir-faire modernes ou traditionnels, avec notamment l’utilisation de licences libres dans un esprit dit ODOSOS (qui signifie : Open Data, Open Source, Open Standards).</p>\n<p><strong>La conférence se déroulera selon le programme suivant :</strong></p>\n<p><strong>17H45  : Accueil</strong><br>\n<strong>18H00 : Open Innovation : pourquoi, pour qui, comment ?</strong><br>\navec l’intervention de Julien PÉNIN, professeur à la Faculté des Sciences Économiques et de Gestion de Strasbourg.<br>\n<strong>18H30 : Témoignages</strong><br>\n– Pierre WOEHL, Ph.D.<br>\nHead of Research &amp; Development, BioMonitoring<br>\nLife Science | Applied Solutions SMI – MERCK<br>\nLa société MERCK est un acteur majeur sur les marchés pharmaceutiques innovants, les sciences de la vie, les technologies et les produits chimiques de pointe.</p>\n<p>Pour participer, merci de vous rendre <a href=\"https://docs.google.com/a/alsacedigitale.org/forms/d/e/1FAIpQLScCcxJQTD1RTWOUimFBqCnGJ780n9ftJjjkKbtBjrmvjVM3sA/viewform\" rel=\"noopener\"><strong>ICI</strong></a>.</p>\n<p><strong>Y aller :</strong> Mardi 28 février à 18h à la Maison du Technopole de Mulhouse – 40 Rue Marc Seguin, 68060 Mulhouse</p>\n<p>Plus d’informations sur le site du <a href=\"http://www.technopole-mulhouse.com/agenda/open-innovation-va-t-on-me-piquer-idees-propriete-industrielle-a-t-sens-demarche-dopen-innovation\" rel=\"noopener\"><strong>Technopole</strong></a>.</p>"
      legacy_cover: "/images/blog/open-innovation-image900x472.webp"
      status: "published"
      published_at: "2017-01-31"
      categories: ["actualites"]
      legacy_path: "/atelier-focus-innovation-4-0/"
      created_at: "2017-01-31T10:52:25Z"
  - key: "challenge-industrie-mulhouse"
    fields:
      title: "Challenge Industrie Mulhouse"
      slug: "challenge-industrie-mulhouse"
      excerpt: "Lors du Challenge Industrie Mulhouse organisé par Alsace Digitale et le Technopole de Mulhouse du 23 au 25 mars 2017, vous aurez 40h pour stimuler…"
      body: "<p><strong>Lors du Challenge Industrie Mulhouse organisé par Alsace Digitale et le Technopole de Mulhouse du 23 au 25 mars 2017, vous aurez 40h pour stimuler l’innovation et inventer l’industrie de demain !</strong></p>\n<p>Sur le même modèle des <a href=\"http://www.hackingindustry.camp/\" rel=\"noopener\"><strong>Hacking Industry Camp</strong></a> ou autre <strong><a href=\"http://www.journaldunet.com/solutions/emploi-rh/hackathon.shtml\" rel=\"noopener\">Hackaton</a></strong>, le Challenge Industrie Mulhouse est un événement destiné à faire émerger de nouveaux projets ou solutions dans un temps donné en s’appuyant sur la <strong>collaboration d’équipes composées de talents, de compétences, de parcours divers</strong> qui s’affrontent pour relever des défis d’innovation liés à un thème ou un secteur d’activité, démultiplier les idées.</p>\n<p><strong>Pour stimuler le partage et la créativité</strong>, les participants travaillent en équipes autour de défis posés par les porteurs de projets, avec pour objectif la présentation d’un <strong>prototype</strong> devant un jury de professionnels , qui récompensera le meilleur.</p>\n<p><strong>Pour participer </strong>: du jeudi 23 au samedi 25 mars à l’ENSISA – 12 Rue des Frères Lumière 68093 Mulhouse</p>\n<p><strong><a href=\"https://www.eventbrite.fr/e/billets-challenge-industrie-mulhouse-30905839197\" rel=\"noopener\">Inscrivez-vous ici !</a></strong></p>\n<p>Les frais d’inscriptions varient selon votre profil :</p>\n<p>– Etudiants ENSISA 10€ TTC</p>\n<p>– Etudiants ou chômeurs : 25€ TTC</p>\n<p>– Early Birds : 35€ TTC</p>\n<p>– Tarif plein : 50€ TTC</p>\n<p>Pour plus d’informations, notamment sur le déroulement, consultez la plaquette de l’événement <a href=\"http://www.technopole-mulhouse.com/wp-content/uploads/2016/12/plaquette_CIM_2017.pdf\" rel=\"noopener\"><strong>ICI</strong></a>.</p>"
      legacy_cover: "/images/blog/cimx.webp"
      status: "published"
      published_at: "2017-01-31"
      categories: ["actualites"]
      legacy_path: "/challenge-industrie-mulhouse/"
      created_at: "2017-01-31T11:20:33Z"
  - key: "bizz-buzz-le-festival-du-numerique-en-alsace"
    fields:
      title: "Bizz & Buzz, le festival du numérique en Alsace"
      slug: "bizz-buzz-le-festival-du-numerique-en-alsace"
      excerpt: "Welcome to Far East ! Du 7 au 9 Mars 2017 sera organisé la 4ème édition du plus grand festival numérique du Grand Est : Bizz & Buzz. Revenons ensemble sur la…"
      body: "<p><strong>Welcome to Far East ! Du 7 au 9 Mars 2017 sera organisé la 4ème édition du plus grand festival numérique du Grand Est : Bizz &amp; Buzz.</strong></p>\n<p>Revenons ensemble sur la précédente édition. En 2016, le festival avait rassemblés <strong>130 speakers</strong> répartis dans <strong>42 conférences et ateliers</strong> avec plus de<strong> 1500 participants</strong> sur les 3 jours !</p>\n<p>Mais Bizz &amp; Buzz qu’est ce que c’est exactement ? Sur une période de 3 jours, des intervenants vont traiter des sujets d’actualités qu’ils maîtrisent et partager leurs connaissances avec les participants. Ces interventions ont pour but d’inciter à réfléchir ainsi que de donner de l’inspiration aux acteurs du numérique de demain : <strong>peut être vous</strong> !</p>\n<p>Pour le <strong>programme</strong> de l’édition <strong>2017</strong> vous pouvez vous rendre : <strong><a href=\"http://bizzandbuzz.fr/programme/\" rel=\"noopener\">ici</a></strong>.</p>\n<p>Et si vous aussi vous voulez prendre part à cette révolution numérique inscrivez vous sur <strong><a href=\"http://bizzandbuzz.fr/billetterie/\" rel=\"noopener\">ce lien</a></strong> !</p>\n<p><strong>À très bientôt sur le festival !</strong></p>"
      legacy_cover: "/images/blog/capture-decran-2017-01-31-a-15-59-39.webp"
      status: "published"
      published_at: "2017-01-31"
