  - key: "la-plage-centre-collaboratif-connecte-labellise"
    fields:
      title: "La Plage : Centre Collaboratif Connecté labellisé !"
      slug: "la-plage-centre-collaboratif-connecte-labellise"
      excerpt: "Depuis quelques semaines nos Plages arborent fièrement le label Centre Collaboratif Connecté (C3) du réseau Actipole 21. Il est le label de référence des…"
      body: "<p><strong>Depuis quelques semaines nos Plages arborent fièrement le label Centre Collaboratif Connecté (C3) du réseau Actipole 21. Il est le label de référence des tiers-lieux professionnels.</strong></p>\n<p>La Plage Digitale Rivetoile et La Plage du Shadok, les 2 <strong><a href=\"/espace-coworking\">espaces de coworking</a></strong> gérés par Alsace Digitale, ont été récompensées par le label C3. Celui-ci repose sur plusieurs critères, tels que <strong>l’intégration dans le territoire, les équipements technologiques ou la façon dont il répond aux exigences entreprises, entrepreneurs et salariés.</strong> Il comporte 4 axes : proximité, lien social, haute performance et un axe transversal de gouvernance/inter-opérabilité entre tiers-lieux.</p>\n<p>Une commission nationale de certification, composée de personnes morales et physiques indépendantes des tiers-lieux candidats s’est réunie pour statuer de la candidature de nos espaces. La décision d’attribution du label se décide à la majorité absolue.</p>\n<p><strong>Ce <a href=\"http://actipole21.org/le-label-c3/\" rel=\"noopener\">label C3</a> est donc un gage de qualité de nos espaces, une référence et un facteur d’activité pour les entreprises et les entrepreneurs qui souhaitent venir y travailler.</strong> C’est aussi l’assurance d’un certain niveau de services.</p>\n<p>Alsace Digitale est très fière de ce label et tient à <strong>remercier tous les coworkers des Plages</strong>, car ils sont le cœur et la vie de ces espaces.</p>\n<p><a href=\"http://actipole21.org/\" rel=\"noopener\"><strong>Actipole 21</strong></a>, acteur et promoteur de nouvelles forme d’organisation du travail, promeut le développement des tiers-lieux et cherche à faciliter l’implantation de ces derniers.</p>\n<p>En savoir plus sur <a href=\"http://actipole21.org/\" rel=\"noopener\"><strong>Actipole 21</strong></a> et le <a href=\"http://actipole21.org/le-label-c3/\" rel=\"noopener\"><strong>label C3</strong></a>.</p>"
      legacy_cover: "/images/blog/plages-labelc3.webp"
