  - key: "coworker-de-la-semaine-jonathan-path-le-freelance-hyperactif"
    fields:
      title: "[COWORKER DE LA SEMAINE] Jonathan Path, le freelance hyperactif"
      slug: "coworker-de-la-semaine-jonathan-path-le-freelance-hyperactif"
      excerpt: "Après tous les talents que nous avons pu voir jusqu’ici, nous nous penchons aujourd’hui sur un jeune profil. Jonathan est webdesigner freelance, toujours à la…"
      body: "<h2><strong>Après tous les talents que nous avons pu voir jusqu’ici, nous nous penchons aujourd’hui sur un jeune profil. Jonathan est webdesigner freelance, toujours à la recherche de nouveaux projets à mettre en place. De cette hyperactivité résulte des aventures forts passionnantes qu’il nous partage. Parole au coworker :</strong></h2>\n<p><strong> 1) Pourrais-tu te présenter aux lecteurs ?</strong></p>\n<p><img src=\"/images/blog/jonathanpath.webp\" alt=\"Jonathan Path, graphiste et webdesigner\" loading=\"lazy\"></p>\n<p>Je m’appelle Jonathan Path. J’ai fait des études de multimédia. Je me suis rapidement spécialisé dans la création de sites web. J’ai commencé par faire de l’alternance dans une association puis dans 2 startups. Cela fait maintenant deux ans que je suis freelance en tant que créateur de site web. Pour les connaisseurs, je suis spécialisé en développement front-end.</p>\n<p>Niveau clients, je suis très sélectif. J’en ai peu mais qui payent bien, ce qui peut m’assurer du travail pendant plusieurs mois. Je peux ainsi libérer du temps pour mes projets personnels.</p>\n<p><b>2) J’ai vu que tu travailles avec une institution religieuse. Peux-tu nous en dire plus ? Le web et la religion ne sont-ils pas incompatibles ?</b></p>\n<p> Pas du tout. La religion permet de véhiculer un message. Aujourd’hui, avec les médias, c’est un peu la même chose. J’ai passé deux ans dans une association chrétienne et je travaille actuellement pour l’église protestante <a href=\"http://eglise-ebs.com/\" rel=\"noopener\">EBS (Eglise Bible Style)</a>. On essaye de changer l’image vieillotte que la plupart des gens ont de la religion car nous croyons que Dieu et la Bible restent actuels et pertinents. En y regardant de plus près, les églises investissent de plus en plus le web. Ça avance. Bien sûr, ce n’est pas encore comme aux États-Unis où les pasteurs communiquent via leur propre compte Twitter et les églises sont sur le web : c’est dans leur culture.</p>\n<p>Le web permet la diffusion d’un message ou de valeurs à grande échelle. Je suis convaincu que c’est pertinent pour l’Église.</p>\n<p><b>3) Tu es aussi l’un des créateurs du <a href=\"http://wdstr.fr/\" rel=\"noopener\">WDSTR</a>. Que recèle cette aventure ?</b></p>\n<p>Je suis arrivé sur Strasbourg il y a un an. Au début, je ne connaissais personne. Je suis donc allé sur Dribbble (ndr : un  réseau  social  pour  webdesigners). Il y avait 5-6 personnes qui habitaient à Strasbourg. On s’est rencontré puis j’ai proposé de créer un événement mensuel entre webdesigners et développeurs web. Il y avait déjà des rencontres très ciblés – pour les programmeurs par exemple – mais peu pour les webdesigners.</p>\n<p><img src=\"/images/blog/wdstr.webp\" alt=\"wdstr\" loading=\"lazy\">C’est toute une organisation d’événements qui s’est développé au fur et à mesure. On se réunit dans des bars ou on fait des mini-conférences et des débats. Je me souviens, pour la 3ème rencontre, on a organisé un meeting dans l’agence web « My Client is Rich ». Avec une bonne communication, on a atteint les 50 participants. Depuis, la communauté s’agrandit, et on peut même dire que ça cartonne. <a href=\"/blog/faites-exploser-votre-creativite-avec-fireworks\">On vient souvent à la Plage Digitale aussi, et c’est toujours plein.</a></p>\n<p>Notre présence sur les réseaux sociaux a permis de faire grossir notre communauté. Pour la suite, si on pouvait avoir des locaux plus grands, on arriverait sûrement à organiser des événements avec plus de 100 personnes.</p>\n<p><b>4) Ce n’est pas trop harassant d’être sur autant de projets ?</b></p>\n<p> J’ai constamment plusieurs chapeaux, je suis sur un programme de blogging. Je tends aussi vers le coaching en accueillant des stagiaires que je forme. En fait, tout est lié entre les événements que j’organise, le réseau que je me créé et les opportunités qui en ressortent. Je cherche à être le plus productif possible afin de libérer du temps pour en accorder à d’autres projets ainsi qu’à ma famille.</p>\n<blockquote><p>À la Plage, tu as des compétences complémentaires.</p></blockquote>\n<p><b>5) Que représente pour toi le freelancing ?</b></p>\n<p>Le but initial était de pouvoir gérer mon temps comme je le souhaite. En entreprise, tu peux être confronté à des périodes de rush qui te sont imposées alors qu’en freelance, tu peux t’organiser pour avoir un rythme de vie plus équilibré.</p>\n<p>En me lançant à mon compte, j’ai développé mon côté business mais aussi technique et organisationnel. J’aime faire des choses différentes, je n’aime pas trop la routine. C’est dans cet état d’esprit que je me suis retrouvé dans le coworking.</p>\n<p><b>6) Parlons-en d’ailleurs : comment t’es-tu retrouvé à la Plage Digitale ?</b></p>\n<p> Je viens de Paris où je faisais déjà du coworking à la Cantine. J’ai bien aimé le concept et quand je suis venu à Strasbourg, j’ai cherché un espace semblable. Le coworking correspond vraiment à mes besoins professionnels.</p>\n<p>Pour moi, l’avantage réside dans la connexion entre les personnes. À la Plage, tu as des compétences complémentaires. Tu fais des rencontres avec des gens intéressants, tu parles et échange avec des entrepreneurs, etc. On a les mêmes problématiques sur les démarches administratives par exemple. Quand tu as quelqu’un sur place, ça aide. De belles choses se sont faites ici.</p>\n<blockquote><p>Jonathan path, webdesigner freelance   <a href=\"http://jonathanpath.com/\" rel=\"noopener\">jonathanpath.com</a>  <a href=\"https://twitter.com/jonathanpath\" rel=\"noopener\"><img src=\"/images/blog/test2.webp\" alt=\"test2\" loading=\"lazy\"></a>      <a href=\"https://www.facebook.com/jonathan.path\" rel=\"noopener\"><img src=\"/images/blog/test1.webp\" alt=\"test1\" loading=\"lazy\"></a>      <a href=\"https://plus.google.com/u/0/109110598286686104232/posts\" rel=\"noopener\"><img src=\"/images/blog/06003950-photo-logo-google-plus.webp\" alt=\"06003950-photo-logo-google-plus\" loading=\"lazy\"></a></p></blockquote>"
      legacy_cover: "/images/blog/logo-jonathanpath1.webp"
      status: "published"
      published_at: "2013-09-16"
