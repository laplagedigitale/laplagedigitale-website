  - key: "edgefest-2014"
    fields:
      title: "Edgefest 2014"
      slug: "edgefest-2014"
      excerpt: "EdgeFest, c’est le festival des communautés numériques et créatives à Strasbourg organisé par Alsace Digitale, le Shadok et AvLab. www.edgefest.fr – Le Teaser…"
      body: "<p>EdgeFest, c’est le festival des communautés numériques et créatives à Strasbourg organisé par Alsace Digitale, le Shadok et AvLab.</p>\n<p><a href=\"http://www.edgefest.com\" rel=\"noopener\">www.edgefest.fr</a> – <a href=\"https://www.youtube.com/watch?v=eAApaqGledM&amp;list=UUXVLNTwPIsKI5yGtAen2g5w\" rel=\"noopener\">Le Teaser</a></p>\n<p>Des ateliers à destination d’adultes, d’enfants et d’adolescents, des démonstrations, des moments d’échange permettront à chacun de découvrir les multiples usages du numérique. La presqu’île André Malraux est le centre de cette effervescence et pour EdgeFest, elle sera transformée en plage dé-connectée, une bulle virtuelle au centre de la ville.</p>\n<p>Tous les évènements sont gratuits !</p>\n<p><a href=\"http://www.edgefest.fr/summercamp.html\" rel=\"noopener\"><b>Summercamp</b></a> Ateliers pour petits et grands à la Médiathèque Malraux.</p>\n<p><a href=\"http://www.edgefest.fr/hackathon.html\" rel=\"noopener\"><b>Hackathon</b></a> Rencontre de programmeurs et de créateurs  pour faire de la programmation informatique collaborative.</p>\n<p><a href=\"http://www.edgefest.fr/edgenight.html\" rel=\"noopener\"><b>EdgeNight</b></a> Performances live pour une soirée électrisante et festive.</p>\n<p><a href=\"http://www.edgefest.fr/shadok.html\" rel=\"noopener\"><b>Shadok Tour</b></a>Des visites en avant-première du Shadok, fabrique du numérique.</p>\n<p><a href=\"http://www.edgefest.fr/startupstories.html\" rel=\"noopener\"><b>Startup Stories</b></a> Soirée festive de présentation des parcours des créateurs de startups alsaciennes.</p>\n<p><a href=\"http://www.edgefest.fr/edgeday.html\" rel=\"noopener\"><b>EdgeDay</b></a> Croisement de projets du monde socio-économique des startups et des coworkers de la Plage Digitale </p>\n<p><b>Barcamp Alsace 11</b> Rencontres créatives autour d’ateliers et de non-conférences.</p>\n<p>Programme à télécharger :</p>\n<p><a href=\"http://issuu.com/edgefest2014/docs/programme_edgefest\" rel=\"noopener\">http://issuu.com/edgefest2014/docs/programme_edgefest</a></p>\n<p>Dossier de presse à télécharger : </p>\n<p><a href=\"http://issuu.com/edgefest2014/docs/dossier_de_presse_edgefest_2014/0\" rel=\"noopener\">http://issuu.com/edgefest2014/docs/dossier_de_presse_edgefest_2014/0</a></p>"
      legacy_cover: "/images/blog/avatar2.webp"
      status: "published"
      published_at: "2014-06-30"
      categories: ["actualites", "evenements"]
      legacy_path: "/edgefest-2014/"
      created_at: "2014-06-30T09:31:10Z"
  - key: "report-edgenight"
    fields:
      title: "Report Edgenight / Startup Stories"
      slug: "report-edgenight"
      excerpt: "EDGENIGHT reportée aujourd’hui samedi Nouveau Programme 20h00 – STARTUP STORIES déplacé à l’UGC Cinecité L’univers impitoyable des Startup. Leurs défis…"
      body: "<p><b>EDGENIGHT</b> <b>reportée aujourd’hui samedi</b></p>\n<p>Nouveau Programme</p>\n<p><b>20h00 – STARTUP STORIES</b> <strong>déplacé à l’UGC Cinecité</strong></p>\n<p>L’univers impitoyable des Startup. Leurs défis passionnants, leurs rêves irréalistes n’auront plus de secret.</p>\n<p><b>22h00 – EDGENIGHT plage devant la Médiathèque Malraux</b></p>\n<p>Sur la façade de Malraux : Mapping d’Avexciters, Retrogaming d’HACKsxb</p>\n<p>Sur la façade du Shadok : Façade du Shadok – Installation Vincent Godeau et Vincent Broquaire </p>\n<p>Et bien sur les DJ sur-vitaminés de Panimix !</p>"
