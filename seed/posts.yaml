  - key: "la-global-game-jam-est-de-retour"
    fields:
      title: "La Global Game Jam est de retour !"
      slug: "la-global-game-jam-est-de-retour"
      excerpt: "Organisée par le Game Dev Group Epitech Strasbourg et Alsace Digitale, la Global Game Jam revient à Strasbourg du 20 au 22 janvier au Shadok. La Global Game…"
      body: "<p><strong> Organisée par le Game Dev Group Epitech Strasbourg et Alsace Digitale, la Global Game Jam revient à Strasbourg du 20 au 22 janvier au Shadok.</strong></p>\n<p>La Global Game Jam est une manifestation mondiale de création de jeux vidéo ou de société qui se déroule dans de nombreux pays tous les ans. La date est la même pour tous les participants et un thème est imposé. Les jeux créés sont ensuite publiés sur le <a href=\"http://globalgamejam.org/2016/games\" rel=\"noopener\">site</a> de la Global Game Jam.</p>\n<p>En 2016, <strong>6 867</strong> jeux ont été créés à travers <strong>93</strong> pays en un week-end, record à battre !</p>\n<p>Les équipes se constituent sur place en fonction du thème annoncé au début de l’événement selon les envies et les idées proposées !</p>\n<p>Une restauration sera disponible sur place (Forfait 28€). Les petits-déjeuners sont offerts.</p>\n<p>Programmeurs, créatifs et curieux sont attendus nombreux, alors n’hésitez pas et rejoignez l’aventure en vous inscrivant <a href=\"https://www.eventbrite.fr/e/billets-global-game-jam-strasbourg-2017-29852776458\" rel=\"noopener\"><strong>ICI</strong></a>.<br>\n<strong>Y aller</strong> : Du 20 au 22 janvier 2017 au Shadok – 25 Presqu’île André Malraux 67100 Strasbourg</p>\n<p>Plus d’informations sur la <strong><a href=\"http://globalgamejam.org/\" rel=\"noopener\">Global Game Jam</a></strong>.</p>"
      legacy_cover: "/images/blog/15170986-1169082579848907-3124839086022781727-n.webp"
      status: "published"
      published_at: "2016-12-07"
      categories: ["actualites"]
      legacy_path: "/la-global-game-jam-est-de-retour/"
      created_at: "2016-12-07T09:51:11Z"
  - key: "hacksxb-46-bredele-party"
    fields:
      title: "HackSXB #46 : Bredele Party"
      slug: "hacksxb-46-bredele-party"
      excerpt: "Comme chaque mois, retrouvez le HackSXB, soirée dédiée à la programmation et à la bidouille. Cette 46e édition aura lieu le vendredi 16 décembre à 19h à la…"
      body: "<p><strong>Comme chaque mois, retrouvez le HackSXB, soirée dédiée à la programmation et à la bidouille. Cette 46e édition aura lieu le vendredi 16 décembre à 19h à la Plage Digitale.</strong></p>\n<p>Le HackSXB est une communauté d’étudiants et d’actifs qui partagent <strong>l’envie de créer</strong>. Sur des sujets libres et parfois plus thématiques, chacun vient avec son projet ou participe à un projet commun. Décembre oblige, cette édition sera placée sous le signe des fêtes de fin d’année, avec des <strong>bredele</strong> lors de la traditionnelle collation.</p>\n<p>En première partie de soirée, <a href=\"https://www.facebook.com/anfern\" rel=\"noopener\">Timothée Fermeaux</a> du <a href=\"https://www.facebook.com/gdgstrasbourg/\" rel=\"noopener\">Game Dev Group Strasbourg</a> (l’association de développement de jeux vidéo d’Epitech) présentera rapidement la <strong><a href=\"https://www.facebook.com/events/1312185795471128/?acontext=%7B%22source%22%3A1%2C%22action_history%22%3A%22%5B%7B%5C%22surface%5C%22%3A%5C%22page%5C%22%2C%5C%22mechanism%5C%22%3A%5C%22page_upcoming_events_card%5C%22%2C%5C%22extra_data%5C%22%3A%5B%5D%7D%2C%7B%5C%22surface%5C%22%3A%5C%22permalink%5C%22%2C%5C%22mechanism%5C%22%3A%5C%22surface%5C%22%2C%5C%22extra_data%5C%22%3A%5B%5D%7D%5D%22%2C%22has_source%22%3Atrue%7D&amp;source=1&amp;action_history=%5B%7B%22surface%22%3A%22page%22%2C%22mechanism%22%3A%22page_upcoming_events_card%22%2C%22extra_data%22%3A%5B%5D%7D%2C%7B%22surface%22%3A%22permalink%22%2C%22mechanism%22%3A%22surface%22%2C%22extra_data%22%3A%5B%5D%7D%5D&amp;has_source=1\" rel=\"noopener\">Global Game Jam Strasbourg 2017</a></strong>, puis <a href=\"https://www.facebook.com/gnoeppel\" rel=\"noopener\">Gilles Noeppel</a> d’<a href=\"https://www.facebook.com/almedia.france/\" rel=\"noopener\">Almédia</a> témoignera de ses participations à ces hackathons dédiés aux jeux vidéo !</p>\n<p>Comme d’habitude, chacun pourra également venir avec ses propres projets pour travailler dessus et les partager avec la communauté. Le but est de produire quelque chose de fonctionnel à la fin de la soirée. Ramenez votre projet en cours, vos problèmes du moment, vos nouveaux gadgets !</p>\n<p>Les règles sont simples : partager avec les autres, montrer ce que vous faites et faire preuve d’ouverture d’esprit !</p>\n<p><strong>Pour vous inscrire</strong>, c’est par <a href=\"https://www.helloasso.com/associations/alsace-digitale/evenements/hacksxb-46-bredele-party-presentation-global-game-jam\" rel=\"noopener\"><strong>ICI</strong></a>, et c’est gratuit !</p>\n<p><strong>Y aller :</strong> le 16 décembre à 19h à la Plage Digitale Rivetoile – 15 avenue du Rhin 67100 Strasbourg</p>\n<p>Plus d’informations : <a href=\"https://www.facebook.com/events/1644965712468030/\" rel=\"noopener\">https://www.facebook.com/events/1644965712468030/</a></p>\n<p>Découvrir la communauté <a href=\"http://www.hacksxb.com/\" rel=\"noopener\">HackSXB</a>.</p>"
      legacy_cover: "/images/blog/15317917-1239144829480229-2972176323768945975-n.webp"
      status: "published"
      published_at: "2016-12-12"
      categories: ["actualites"]
      legacy_path: "/hacksxb-46-bredele-party/"
      created_at: "2016-12-12T14:17:34Z"
  - key: "soutenez-les-ateliers-play2code"
    fields:
      title: "Soutenez les ateliers Play2Code !"
      slug: "soutenez-les-ateliers-play2code"
      excerpt: "… et aidez les enfants à devenir des As de la programmation informatique ! Qu’est ce que Play2Code ? Play2Code réunit sous une même bannière les ateliers…"
      body: "<p>… et aidez les enfants à devenir des As de la programmation informatique !</p>\n<h3><em>Qu’est ce que Play2Code ?</em></h3>\n<p>Play2Code réunit sous une même bannière les ateliers d’apprentissage à la programmation et au développement informatique à destination des enfants et adolescents, que sont les : Code4Kids (10-14 ans), Coding Club (15-18 ans) et Coding Goûter. Ces ateliers ont pour vocation de leur<b> apprendre les bases de la programmation et du développement informatique</b>, et ainsi leur permettre de<b>développer un esprit critique</b> sur leur environnement.</p>\n<h3><em>Comment se déroulent les ateliers ?</em></h3>\n<p>Lors de ces ateliers, les participants créent des jeux vidéo et des animations, qu’ils peuvent ensuite parfaire une fois rentrés chez eux.</p>\n<p>Play2Code permet donc de développer des compétences en informatique, mais également d’être créatif et de travailler de façon autonome. Les ateliers sont basés sur la pédagogie Epitech : chacun avance à son rythme, les participants mobilisent d’abord leurs compétences en suivant des tutoriels sur-mesures et des coachs sont présents pour les aider.</p>\n<p>Ces événements prennent différentes formes :<br>\n– un atelier chaque mois le mercredi après-midi dans les locaux d’Epitech Strasbourg<br>\n– des stages de 2 à 3 jours pendant les vacances scolaires<br>\n– des ateliers ponctuels dans les médiathèques, les centres socio-culturels et les établissements scolaires.</p>\n<p>Tout est entièrement gratuit, afin de permettre à n’importe quelle personne intéressée d’y participer.</p>\n<h3><em>Pourquoi une campagne de dons</em> ?</h3>\n<p>Nous faisons appel à votre générosité dans le but d’aider au développement de Play2Code. Plus nous aurons de matériel, plus nous pourrons accueillir de participants et plus nous pourrons diversifier nos propositions.</p>\n<p>Le montant collecté sera utilisé pour l’<b>achat de matériel</b> : matériel informatique, Arduino, Lego Mindstorms, etc.</p>\n<p>Par ailleurs, <b>nous sommes également à la recherche d’une dizaine d’ordinateurs portables</b> afin d’augmenter les capacités d’accueil de nos événements.</p>\n<h2><strong><a href=\"https://www.helloasso.com/associations/alsace-digitale/collectes/apprendre-en-s-amusant-grace-au-play2code\" rel=\"noopener\">Oui, je veux soutenir Play2Code</a></strong></h2>\n<p>Ces dons ne sont pas déductibles de vos impôts. En effet, les activités de l’association Alsace Digitale sont soumises à la TVA du fait de sa gestion d’espaces de coworking.</p>\n<p><i>(Le site Play2Code est en cours de développement, il sera mis en ligne prochainement)</i></p>"
      legacy_cover: "/images/blog/test-play2code.webp"
      status: "published"
      published_at: "2016-12-14"
      categories: ["actualites"]
      legacy_path: "/soutenez-les-ateliers-play2code/"
      created_at: "2016-12-14T15:23:36Z"
  - key: "workshop-pitch-deck"
    fields:
      title: "Workshop Pitch Deck"
      slug: "workshop-pitch-deck"
      excerpt: "Suite au succès du dernier Workshop sur le Business Plan, Alsace Business Angels et Alsace Digitale repartent du bon pied en 2017 pour vous proposer une…"
      body: "<p><strong>Suite au succès du dernier Workshop sur le Business Plan, Alsace Business Angels et Alsace Digitale repartent du bon pied en 2017 pour vous proposer une édition dédiée au Pitch Deck, qui se déroulera le mardi 24 janvier de 10h à 13h au Shadok.</strong></p>\n<p>Le Pitch Deck reste un incontournable pour <strong>présenter sa startup à des investisseurs.</strong> Comme plus personne ne lit les business plan Word de 50 pages, il faut être clair, intéressant et pertinent en 5 minutes chrono.</p>\n<p>Le Pitch Deck est aussi le 3e outil après les canvas et le business plan Excel pour <strong>structurer sa pensée</strong> et trouver les hypothèses à vérifier. Faire son Pitch Deck en amont permet d’identifier quels sont les points à améliorer avant de vouloir chercher des fonds.</p>\n<p><strong>Au programme de ce workshop :</strong><br>\n– pourquoi faire un Pitch Deck?<br>\n– les slides 1 par 1<br>\n– exemples de Pitch Deck pour s’inspirer<br>\n– mise en pratique</p>\n<p>L’objectif est d’avoir une base de Pitch Deck pour votre projet à la fin du workshop.</p>\n<p>Venez vous inscrire <a href=\"https://www.eventbrite.fr/e/billets-hacking-business-3-pitch-deck-30814006523\" rel=\"noopener\"><strong>ICI</strong></a>, le nombre de place est limité ! </p>\n<p><strong>Y aller :<br>\n</strong> Mardi 24 janvier de 10h à 13h au Shadok<br>\n25 Presqu’île André Malraux 67100 Strasbourg</p>\n<p>Cet évènement est co-organisé par <a href=\"http://www.alsacebusinessangels.com/\" rel=\"noopener\">Alsace business Angels</a> et <a href=\"http://www.alsacedigitale.org/\" rel=\"noopener\">Alsace Digitale</a>.</p>"
      legacy_cover: "/images/blog/15826322-194695474331315-3111659935587304575-n.webp"
      status: "published"
      published_at: "2017-01-03"
      categories: ["actualites"]
