  - key: "fermeture-temporaire-de-la-plage-digitale"
    fields:
      title: "Fermeture temporaire de La Plage Digitale"
      slug: "fermeture-temporaire-de-la-plage-digitale"
      excerpt: "Suite aux récentes annonces et mesures préconisées par le gouvernement dans l’optique de réduire la propagation du coronavirus et endiguer l’épidémie le plus…"
      body: "<p>Suite aux récentes annonces et mesures préconisées par le gouvernement dans l’optique de réduire la propagation du coronavirus et endiguer l’épidémie le plus rapidement possible, notre espace de coworking est fermé jusqu’à nouvel ordre.</p>\n<p>Nous restons tout de même joignable à l’adresse mail contact@alsacedigitale.org.</p>\n<p>En espérant vous revoir au plus vite, voici quelques outils qui pourront vous aider à organiser votre travail en home office :</p>\n<p><a href=\"https://www.atolia.com/fr/\" rel=\"noopener\">Atolia</a> : un espace de travail collaboratif et sécurisé made in Alsace</p>\n<p><a href=\"https://www.endlesspaper.app/\" rel=\"noopener\">Endless paper</a> : application pour tablette faisant office de paperboard, permettant de prendre des notes manuscrites et de dessiner schémas et croquis sur une surface infinie.</p>\n<p><a href=\"https://bienvenue.epopia.com/le-guide-de-survie-a-la-maison?fbclid=IwAR2MkvPuvjf4belhl0SiHMPvtKZIOxg9TNTD8kK3hMyA-RLF6oPub_6iIZ0\" rel=\"noopener\">Un guide de survie</a> pour faire école à la maison, proposé par <a href=\"https://www.epopia.com/\" rel=\"noopener\">Epopia.</a></p>"
