  - key: "juillet-2024"
    fields:
      title: "Juillet 2024"
      slug: "juillet-2024"
      excerpt: "Juillet, mois de chaleur et de lumière, où chaque jour est une promesse d’été. ⛱"
      body: "<p>« Juillet, mois de chaleur et de lumière, où chaque jour est une promesse d’été. » ⛱</p>\n<h2><strong>Découvrez l’agenda du mois de juillet de la Plage Digitale 🗓</strong></h2>\n<figure><img src=\"/images/blog/66865ca12f266c98f9d28a9b.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Permanence Propriété Industrielle – 04/07/2024 – De 13h30 à 16h30</strong></p>\n<p><strong>Vous aurez la possibilité de venir vous entretenir gratuitement avec Pauline Wendehenne, Chargée d’affaires en Propriété Industrielle, à l’INPI.</strong></p>\n<p>🤝 Elle pourra répondre à vos questions, quelques exemples ⤵️</p>\n<p>▷ J’ai un nom pour ma société ou mon produit : est-ce que j’ai le droit de l’utiliser ? Est-ce que c’est un bon choix ? Est-ce que je peux le protéger par une marque ?<br><br>▷ Je voudrai déposer une marque : combien ça coûte ? Comment je choisis le type de marque et les classes (c’est quoi une classe ?!) ? Quels outils peuvent m’aider ?<br><br>▷ Mon identité visuelle comporte un logo : à qui appartiennent les droits sur le logo ? Puis-je le modifier par exemple ?<br><br>▷ Comment protéger mon innovation ? Le dépôt d’une demande de brevet est-il pertinent pour mon projet ?<br><br>▷ Quel est l’intérêt de dater et comment faire ?<br><br>▷ Je développe une application mobile, un site internet ou un logiciel : à qui appartiennent les droits d’auteur sur le code ? Comment je peux le protéger ? Y a-t-il d’autres mécanismes de protection possibles ?<br><br>▷ Comment combiner les titres de Propriété Industrielle et construire ma protection pour accélérer le développement de mon entreprise ?<br><br>▷ Je souhaite conquérir des marchés étrangers : quelles précautions peuvent être prises ?<br><br>▷ Comment l’INPI peut m’accompagner ? Quelles aides existent ?</p>\n<figure><img src=\"/images/blog/668673791b848175efbe2594.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Permanence Création d’Entreprise – 25/07/2024 – De 10h00 à 12h00</strong></p>\n<p><strong>Vous aurez la possibilité de venir vous entretenir gratuitement avec Benjamin Gonzalez, Conseiller en Création et Développement d’Entreprise, à la CCI Alsace Eurométropole.</strong></p>\n<p>🤝 Il pourra répondre à vos questions, quelques exemples ⤵️</p>\n<p>▷Comment valider la faisabilité de mon idée de projet ou de reprise d’entreprise ?</p>\n<p>▷Quelles sont les démarches administratives essentielles pour créer ou reprendre une entreprise ?</p>\n<p>▷Comment élaborer un business plan solide et convaincant pour les investisseurs et les banques ?</p>\n<p>▷ Quelles stratégies de financement puis-je envisager pour min projet de création ou reprise d’entreprise ?</p>\n<p>▷ Comment identifier et analyser le marché cible pour mon projet d’entreprise ? </p>\n<p>▷ De quelles manières puis-je protéger mon idée, mon produit, ou ma marque ?</p>\n<p>▷ Comment définir une stratégie de marketing et de communication efficace pour le lancement de mon entreprise ?</p>\n<p>▷ Quels sont les principaux pièges à éviter lors de la création ou de la reprise d’une entreprise ?</p>\n<p>▷ Comment choisir le statut juridique la plus adaptée à mon projet d’entreprise (EI, SARL, SAS, etc.) ?</p>\n<p>▷ Quelles sont les aides et subventions disponibles pour les créateurs et repreneurs d’entreprise ?</p>\n<figure><img src=\"/images/blog/66865ca154ae80355a2c0d59.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Software Crafters Strasbourg – 18/07/2024 – De 18h45 à 20h45</strong></p>\n<p><strong>Une lecture dramatique du Manifeste Agile …</strong></p>\n<p>Romeu Moura : « Le Manifeste Agile est composé de 80 mots et je vais les lire, les approfondir, essayer de les rendre tangibles, donner beaucoup d’exemples et vous connecter avec ce que je trouve beau dans le Manifeste.<br>Connectons-nous à la beauté du respect des plans, des processus, des outils, des documentations complètes et de la négociation contractuelle ! (yay !) »</p>\n<figure><img src=\"/images/blog/66865ca27c7e0ab4d22a80d9.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Achen’ight – 26/07/2024 – De 19h00 à 23h00</strong></p>\n<p><strong>Organisé par l’association </strong><a href=\"https://www.linkedin.com/company/latitudes%E2%80%93exploringtechforgood/\" rel=\"noopener\"><strong>Achencraft</strong></a><strong>  🤝</strong></p>\n<p>Achen’ight, c’est une soirée par mois où se rassemble l’équipe d’Achencraft pour discuter, rencontrer, rigoler, concevoir, …. bref tout ce qui permet au projet Achencraft de progresser ! 🤩</p>\n<figure><img src=\"/images/blog/66865c882f266c98f9d28a90.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>C’est arrivé le mois dernier … et près de chez vous !</strong></p>\n<p><strong>À la Plage Digitale, il s’en est passé des choses en juin :</strong></p>\n<p>👉🏼 Une Fresque du Climat, un tournoi Mario Kart, une bataille de l’IA, un événement par ActionCOACH, des rencontres Software Craft Strasbourg, des permanences professionnelles, etc. 🤩</p>\n<p>Suivez-nous sur nos réseaux sociaux pour ne rien louper !</p>"
