  - key: "bretzel-connect-lemission-100-french-tech-strasbourg"
    fields:
      title: "Bretzel Connect : L’émission 100% French Tech Strasbourg"
      slug: "bretzel-connect-lemission-100-french-tech-strasbourg"
      excerpt: "?Startupeurs, futurs startupeurs ou simples curieux de l’écosystème startup alsacien ? La série de podcasts mitonnés par Catherine Mosser et Virginie Athias…"
      body: "<p>?Startupeurs, futurs startupeurs ou simples curieux de l’écosystème startup alsacien ?</p>\n<p>La série de podcasts mitonnés par <strong>Catherine Mosser</strong> et <strong>Virginie Athias</strong>, mais surtout assaisonnés par les startups membres de la <a href=\"https://www.frenchtechstrasbourg.com\" rel=\"noopener\"><strong>Communauté French Tech Strasbourg</strong></a> débarque sur vos ondes !</p>\n<p>?Bretzel Connect fait son entrée avec ses nouveaux épisodes de podcasts qui seront publiés toutes les semaines. En effet, cette initiative a été réfléchie et élaborée par la <a href=\"https://www.frenchtechstrasbourg.com\" rel=\"noopener\"><b>Communauté French Tech Strasbourg</b></a> dans le cadre du projet d’avenir Disrupt Campus, portée par <a href=\"https://www.alsacedigitale.org\" rel=\"noopener\"><b>Alsace Digitale</b></a>, afin de transmettre le savoir aux <b>futurs entrepreneurs</b> qui rêvent de devenir startupeur. Le but de ces podcasts c’est d’inspirer les interlocuteurs afin qu’ils aient une vision d’une entreprise installée.</p>\n<p>Alors n’hésitez pas à venir écouter ! ?</p>\n<p>Découvrez le premier épisode : <a href=\"https://podcast.ausha.co/bretzel-connect-l-emission-100-french-tech-strasbourg?fbclid=IwAR231hFI680V5K1rrpXvtLq9kFJSLFK_y4XbUGjHkB-JtILyAdn2dm6QfGA\" rel=\"noopener\">ICI</a></p>\n<p>Disponible sur <a href=\"https://open.spotify.com/show/bretzel-connect\" rel=\"noopener\">Spotify</a>, <a href=\"https://www.deezer.com/show/bretzel-connect\" rel=\"noopener\">Deezer</a> et <a href=\"https://soundcloud.com/bretzel-connect\" rel=\"noopener\">SoundCloud</a>.</p>"
