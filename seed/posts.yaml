  - key: "meetup-1-la-premiere-de-mulhouse-startups"
    fields:
      title: "Meetup #1 : La première de Mulhouse Startups !"
      slug: "meetup-1-la-premiere-de-mulhouse-startups"
      excerpt: "Save the date ! Mulhouse Startups organise son premier Meetup mercredi 8 février à 18h30 à l’ENSISA, sur le thème « Hébergement des applications & agilité des…"
      body: "<p><strong>Save the date !  Mulhouse Startups organise son premier Meetup mercredi 8 février à 18h30 à l’ENSISA, sur le thème « Hébergement des applications &amp; agilité des startups ».</strong></p>\n<p>« Vous ne pouvez pas demander aux clients ce qu’ils veulent et ensuite essayer de le leur donner. Au moment où vous l’aurez créé, ils voudront autre chose. » (<em>Steve Jobs)</em></p>\n<p>C’est pourquoi l’<strong>agilité</strong> a tellement d’importance pour le développement des startups : la clef est d’adapter son produit le plus rapidement possible. Et c’est là qu’interviennent les invités de ce premier Meetup !</p>\n<ul><li><strong>Yann Klis a co-fondé <a href=\"https://scalingo.com/\" rel=\"noopener\">Scalingo</a></strong>, qui permet aux startups de se concentrer sur l’amélioration de leurs applications sans se soucier de leur hébergement. Il vous révélera les avantages de cet outil clef et témoignera de son expérience de serial entrepreneur.</li><li><strong>Jérôme Schneider</strong>,<strong> dirigeant de <a href=\"http://netgusto.com/\" rel=\"noopener\">Netgusto</a></strong>, entreprise de conseil et développement web, sera présent à ses côtés pour engager le débat et nous nourrir de ses nombreuses expériences.</li></ul>\n<p>L’évènement se terminera par un petit buffet, l’occasion d’échanger entre entrepreneurs, startupers, étudiants et curieux de ces sujets.</p>\n<p>La participation est gratuite, inscrivez-vous <a href=\"https://www.eventbrite.fr/e/billets-meetup-1-hebergement-dapplications-agilite-des-startups-31677607577\" rel=\"noopener\"><strong>ICI</strong></a>.</p>\n<p><b>Y aller : </b>mercredi 8 février à 18h30 à l’ENSISA Lumière – 12 rue des frères Lumière, 68093 Mulhouse</p>\n<p><strong><a href=\"http://mulhouse-startups.com/\" rel=\"noopener\">Mulhouse Startups</a></strong>, tout comme <strong><a href=\"http://www.strasbourg-startups.com/\" rel=\"noopener\">Strasbourg Startups</a></strong>, sont des communautés émanant d’<strong><a href=\"http://www.alsacedigitale.org/\" rel=\"noopener\">Alsace Digitale</a></strong> et de sa dynamique de création d’écosystèmes fertiles et de stimulation de l’entreprenariat. À l’instar de son “grand frère” Strasbourg Startups, Mulhouse Startups a donc pour volonté de fédérer, sous un nom commun, les startups émergentes à Mulhouse et ses environs.</p>\n<p>David Lichtlé, à l’initiative de ce groupe, expose sa vision : “Le premier objectif de Mulhouse Startups est de transmettre et de propager la “culture startup”, en montrant que la ville possède un <strong>écosystème dynamique</strong>. Le deuxième objectif est de rassembler les différentes startups déjà présentes à Mulhouse afin de créer une véritable <strong>communauté d’entrepreneurs</strong> qui pourront s’entraider et avancer plus intelligemment ensemble”. Le collectif espère que ce Meetup sera le <strong>premier</strong> d’une longue série !</p>"
      legacy_cover: "/images/blog/https-cdn-evbuc-com-images-27898446-59493528783-1-original-jpg.webp"
      status: "published"
      published_at: "2017-02-02"
