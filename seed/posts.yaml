  - key: "hackathon-femmes-et-entrepreunariat"
    fields:
      title: "Hackathon femmes et entrepreunariat"
      slug: "hackathon-femmes-et-entrepreunariat"
      excerpt: "Le premier hackathon #FemmesEntrepreneuses arrive le 1er février à Strasbourg ! Orange et les entreprises partenaires EDF, ES, Caisse d’Epargne, Paul Heumann…"
      body: "<p><strong>Le premier hackathon #FemmesEntrepreneuses arrive le 1er février à Strasbourg !</strong></p>\n<p>Orange et les entreprises partenaires EDF, ES, Caisse d’Epargne, Paul Heumann, Team Attitude et Alsace Digitale proposent aux femmes du territoire de libérer leur envie de créer et de faire émerger leurs idées lors du Le hackathon #FemmesEntrepreneuses. Ce marathon de l’innovation au féminin vise à imaginer, concevoir et prototyper des produits et services et promouvoir l’entrepreneuriat féminin.</p>\n<p><strong>Vous êtes une femme et portez un projet d’entrepreneuriat que vous rêvez de lancer ? </strong>Venez le présenter et bénéficier de la puissance de l’intelligence collective pour le développer, le faire évoluer et le concrétiser. Vous serez impressionnée de voir ce que vous serez capable de produire en équipe en une journée seulement grâce aux nouvelles méthodes de travail ! Si les équipes qui relèveront les défis sont mixtes, ce sont des femmes qui ont vocation à les animer et les manager.</p>\n<p>Cette journée s’annonce riche en rencontres et en partages ! Nous avons hâte de vous retrouver pour cette première escale !</p>\n<p>Alors on se retrouve à l’Orange Crystal Park, 1 avenue de l’Europe, 67300 Schiltigheim,</p>\n<p>le 1er Février 2019 à partir de 8h30 jusqu’à 18h00 !</p>\n<p>Pour aller à l’évènement c’est juste <a href=\"https://www.eventbrite.com/e/hackathon-femmes-et-entrepreunariat-tickets-53819885727?aff=escb&amp;utm-source=cp&amp;fbclid=IwAR0e1B1Ay2EMxb3EouIzUJLpXuCd7Wjd2IQlZkFBI3fOc-GbjYKMHEuXl9A&amp;utm-campaign=social&amp;utm-content=attendeeshare&amp;utm-medium=discovery&amp;utm-term=listingLe\" rel=\"noopener\">LA</a></p>\n<p>Pour une petite présentation d’Orange et de son écosystème mondial de soutien et d’échange au service de la croissance des start-up cliquer sur leur site internet : <a href=\"https://startup.orange.com/fr/\" rel=\"noopener\">https://startup.orange.com/fr/</a></p>"
      legacy_cover: "/images/blog/https-cdn-evbuc-com-images-54090895-138873328811-1-original.webp"
