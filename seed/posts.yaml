  - key: "partez-a-la-decouverte-du-financement-participatif"
    fields:
      title: "Partez à la découverte du financement participatif"
      slug: "partez-a-la-decouverte-du-financement-participatif"
      excerpt: "Envie d’en savoir plus sur le financement participatif ? Olivier SANCH de KissKissBankBank vient vous en parler au cours d’un After-Work le jeudi 8 décembre à…"
      body: "<p><strong>Envie d’en savoir plus sur le financement participatif ? Olivier SANCH de KissKissBankBank vient vous en parler au cours d’un After-Work le jeudi 8 décembre à l’Espace Avenir à Strasbourg.</strong></p>\n<p><strong>Le Financement Participatif (ou Crowdfunding),</strong> est une autre façon pour les entreprises, les particuliers de récolter des fonds pour leur projets. Dans la plupart des cas, c’est l’association d’un grand nombre de personnes investissant un petit montant qui permettent aux porteurs de projets de trouver les fonds demandés. Ce mode de financement est également un moyen de <strong>fédérer</strong> le plus grand nombre de personnes autour de leurs projets.</p>\n<p>Alors que vous portiez un projet entrepreneurial ou non, venez découvriravec nous le financement participatif ! Olivier SANCH, chargé de mission collectivités et acteurs publics chez KissKissBankBank sera là pour vous guider.</p>\n<p>Rendez-vous le <b>8 décembre 2016</b> de <b>18h à 19h</b>.</p>\n<p>Lieu : Espace Avenir, Nouveau Patio – 20a rue René Descartes, 67000 Strasbourg</p>\n<p>Pensez à vous inscrire <strong><a href=\"https://docs.google.com/a/alsacedigitale.org/forms/d/e/1FAIpQLSfwHAv6qaiYOGw_oQ9EAHP8bkZ8poQHMvZJnz2ifSdpxdwZ1A/viewform?c=0&amp;w=1\" rel=\"noopener\">ICI</a></strong> !</p>\n<p>En savoir plus sur <a href=\"https://www.kisskissbankbank.com/\" rel=\"noopener\">KissKissBankBank</a>, site de financement participatif.</p>"
      legacy_cover: "/images/blog/unnamed.webp"
