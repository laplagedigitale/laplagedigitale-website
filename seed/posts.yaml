  - key: "hack-le-chalet-retour-sur-un-week-end-mouvemente"
    fields:
      title: "Hack le Chalet : retour sur un week-end mouvementé"
      slug: "hack-le-chalet-retour-sur-un-week-end-mouvemente"
      excerpt: "Après tout un week-end dans un chalet, il y en a des choses à dire ! Alsace Digitale avait organisé son premier hackathon (ou marathon du hack) le week-end du…"
      body: "<p><b>Après tout un week-end dans un chalet, il y en a des choses à dire ! Alsace Digitale avait organisé son premier hackathon (ou marathon du hack) le week-end du 24 au 26 mai. Les participants avaient 48 heures pour hacker. Ne vous méprenez pas, le « hack » en question ne concernait pas le craquage de réseaux protégés mais bien la création ou « bidouillage » d’un programme, d’une application pour le détourner de sa fonction première. Le tout devait être présenté devant Stéphane Becker, jury de l’évènement.</b></p>\n<p>Hack le Chalet a réuni 25 participants, soit 8 équipes, dans la verte contrée de Luttenbach-près-Munster. Un cadre assez insolite pour rester devant son ordinateur mais néanmoins  sympathique. Retour sur ces deux jours très particuliers.</p>\n<p><strong>Les équipes</strong></p>\n<p><em>Équipe Acadock :</em> Créer des containers avec Docker, c’est enfin possible.<br>\n<em>Équipe Arduitools</em> : Pouvoir régler un ventaliteur depuis un smartphone ou l’ordinateur, c’est quand même pratique.<br>\n<em>Équipe Gravitris :</em> Tetris avec de la gravité, un concept fou mais tellement amusant !<br>\n<em>Équipe Geekiest :</em> Challenge entre amis pour montrer que vous êtes le meilleur « geek ». Mélange entre « song pop » et « draw something », vous devez faire deviner des éléments de culture geek par le biais de vidéos, images,…<br>\n<em>Équipe Hot Meals</em> : Gestion des repas et de la liste de course directement grâce à une interface très ergonomique.<br>\n<em>Équipe Là-Haut :</em> Lancer de l’électronique avec des ballons et le suivre à grâce au GPS, c’est technique.<br>\n<em>Équipe La Boussole du Soiffard : </em>Une application utile pour trouver les happy hours les plus proches de vous.<br>\n<em>Équipe Vélocar (projet abandonné)</em> : Une application conçue pour le vélo, avec toutes les informations utiles sur votre smartphone.</p>\n<p><b>Vendredi 24 mai :</b> Tout le monde a su trouver son chemin jusqu’au chalet. Le lieu est plaisant, le paysage bucolique. Mais on ne peut pas dire qu’on pourra en profiter ! Un apéro, un discours de Stéphane Becker et un court dîner après, la compétition démarre. Les équipes se créent, les liens aussi. Certaines personnes sont venues en groupe avec une idée bien en tête du projet à mettre en place. D’autres se découvrent tout en brainstormant. Le temps est compté, il faut démarrer dès ce soir.</p>\n<p><img src=\"/images/blog/dsc03427.webp\" alt=\"Hack le Chalet, le hackathon par Alsace Digitale\" loading=\"lazy\"></p>\n<p>La salle prend vie peu à peu. Dans un décor de donjon, les « geeks » installent leur antre. Les sodas s’empilent sur les tables, les cafés se préparent : la première nuit va être longue !</p>\n<p><b>Samedi 25 mai :</b> C’est ce qui se confirme le lendemain matin. Les traits tirés, les participants avouent avoir dormi « cinq heures », « deux heures » ou « pas beaucoup ». Théo confie : « D’un côté, je savais qu’en venant à un hackathon,  le principe c’est de coder autant qu’on peut, il ne faut pas perdre de temps. Je me suis dit que je pourrai dormir chez moi, là je tourne au café ! ». Sur ces belles paroles, chaque équipe met les bouchées doubles. Les organisateurs voyagent entre chaque table, chaque équipe. Stéphane Becker, Yann Klis et Yannick Jost jettent un œil aux projets, histoire de voir si tout va bien. Même les équipes échangent entre elles.</p>\n<p><img src=\"/images/blog/dsc03309.webp\" alt=\"Hack le Chalet, le hackathon par Alsace Digitale\" loading=\"lazy\"><img src=\"/images/blog/dsc03311.webp\" alt=\"Hack le Chalet, le hackathon par Alsace Digitale\" loading=\"lazy\"><img src=\"/images/blog/dsc03545.webp\" alt=\"Hack le Chalet, le hackathon par Alsace Digitale\" loading=\"lazy\">La précision et la concentration font tout !<img src=\"/images/blog/dsc03419.webp\" alt=\"Hack le Chalet, le hackathon par Alsace Digitale\" loading=\"lazy\"> Théo travaille sur son application « Hot Meals ».<img src=\"/images/blog/dsc03416.webp\" alt=\"Hack le Chalet, le hackathon par Alsace Digitale\" loading=\"lazy\"> L’équipe Arduitools passe en phase de test.<img src=\"/images/blog/dsc03375.webp\" alt=\"Hack le Chalet, le hackathon par Alsace Digitale\" loading=\"lazy\"> L’équipe Gravitris corrige quelques problèmes.<img src=\"/images/blog/dsc03682.webp\" alt=\"Hack le Chalet, le hackathon par Alsace Digitale\" loading=\"lazy\">La Boussole du Soiffard, pratique pour connaître les Happy-hours dans les environs.</p>\n<p><b>Dimanche 26 mai : </b>Pour la plupart, la nuit blanche était de rigueur. Nous sommes entrés dans les 10 dernières heures et il faut tout donner. Des problèmes persistent, mettant quelques heures avant d’être enfin résolu. 3 heures restantes. On teste, on doute… Au pire, on trouve des alternatives. La pression est palpable à l’heure fatidique.</p>\n<p>L’après-midi, à partir de 14h, chaque équipe fait une démo de son projet. On commence par le lâcher de ballon par l’équipe Là-Haut. De grosses frayeurs ont accompagné le groupe durant le week-end car le temps ne leur était pas favorable.  Heureusement, tout fonctionne ! Le vent emporte le ballon au loin… Jusqu’en Thaïlande. Nul besoin de dire que le GPS fait défaut. Après quelques ajustements, le ballon a été repéré du côté de Pfaffenhoffen, près d’Haguenau. Une centaine de kilomètres a été parcourue, c’est déjà pas mal !</p>\n<p><img src=\"/images/blog/dsc03636.webp\" alt=\"Hack le Chalet, le hackathon par Alsace Digitale\" loading=\"lazy\"> <img src=\"/images/blog/dsc03649.webp\" alt=\"Hack le Chalet, le hackathon par Alsace Digitale\" loading=\"lazy\">Le lancement semble être une réussite !</p>\n<p><img src=\"/images/blog/dsc03653.webp\" alt=\"Hack le Chalet, le hackathon par Alsace Digitale\" loading=\"lazy\"> <img src=\"/images/blog/dsc03663.webp\" alt=\"Hack le Chalet, le hackathon par Alsace Digitale\" loading=\"lazy\">Maintenant, il faut trouver jusqu’où a volé le projet.</p>\n<p>S’ensuivent la présentation des autres projets. Les aspects techniques sont détaillés, « ça doit être de la pornographie pour geeks » rigole Stéphane Becker. Il faut dire, qu’en 48 heures, le rendu est assez impressionnant ! Les projets sont plus ou moins aboutis, certains vont être finalisés après Hack le Chalet. Comme l’a dit Stéphane juste avant la remise des prix, « Il n’y a pas à dire : tous les projets sont bons, très bons ». Difficile de départager tout le monde… Mais il le fallait bien. Ainsi, nous retrouvons donc sur le podium :</p>\n<p>3ème  – Équipe Là-haut<img src=\"/images/blog/dsc03717.webp\" alt=\"Hack le Chalet, le hackathon par Alsace Digitale\" loading=\"lazy\"></p>\n<p>2ème  – Équipe Acadock<br>\n<img src=\"/images/blog/dsc03728.webp\" alt=\"Hack le Chalet, le hackathon par Alsace Digitale\" loading=\"lazy\"></p>\n<p>1er   – Équipe Geekiest <img src=\"/images/blog/dsc03755.webp\" alt=\"Hack le Chalet, le hackathon par Alsace Digitale\" loading=\"lazy\"></p>\n<p>Du côté des participants, le week-end s’est bien passé. Ce qui est sûr, c’est que tout le monde a passé un bon moment :</p>\n<blockquote><p>Équipe Arduitools<br>\nOn est crevé mais contents. En voyant les premières démos, on était un peu stressés mais le nôtre a bien marché. Le seul regret est que le week-end fut rapide. On pourra quand même continuer notre projet par la suite .</p><p>Équipe Gravitris<br>\nPersonnellement, on n’est pas si crevés que ça. On a su gérer notre temps. Vu l’ambiance, on n’avait aucun stress. On était juste inquiets pour les bugs qui pouvaient survenir. Dans l’ensemble, ce hackathon est sympa, faut bien une première dans le genre !</p><p>Équipe Acadock<br>\nOn a essayé de bien dormir pour ne pas perdre de productivité. Surtout, que parfois on s’énerve vite. Dès qu’on a un problème, ça prend 1-2h pour le résoudre. On compte sûrement venir pour la seconde édition. D’ici là, notre projet est utilisable, on va le continuer pour pouvoir le déployer sur l’intranet de notre école, l’ENSIIE.</p></blockquote>\n<p><img src=\"/images/blog/dsc03774.webp\" alt=\"Hack le Chalet, le hackathon par Alsace Digitale\" loading=\"lazy\"><em>Petite pause détente après un week-end de compétition.</em></p>"
      legacy_cover: "/images/blog/01.webp"
      status: "published"
      published_at: "2013-06-05"
      categories: ["actualites"]
      legacy_path: "/hack-le-chalet-retour-sur-un-week-end-mouvemente/"
      created_at: "2013-06-05T12:57:19Z"
  - key: "concours-interne-le-rose-envahit-la-plage"
    fields:
      title: "Concours interne : le rose envahit la Plage"
      slug: "concours-interne-le-rose-envahit-la-plage"
      excerpt: "Comme il est de coutume dans une entreprise, les employés s’adonnent à des activités plus ou moins banales. C’est un peu le même principe à la Plage Digitale…"
      body: "<p>Comme il est de coutume dans une entreprise, les employés s’adonnent à des activités plus ou moins banales. C’est un peu le même principe à la Plage Digitale, les coworkers laissent fleurir leur imagination. Tout cela laisse beaucoup de place aux idées.</p>\n<p>Il y a quelques semaines, Isabel Mota (<em>Feuille de Choux Communication</em>) et Simon Thierry (<em>Adoc Métis</em>) ont lancé un concours de dessin. Les participants avaient pour thème l’association de deux mots : « thé » et « barbapapa ». Après délibération, les organisateurs ont pu remettre deux prix. Le gagnant dans la catégorie «Le dessin le plus original» est Sébastien Lorentz, pour son dessin d’un barbapapa hypnotisant le spectateur avec un sachet de thé. Quant à la catégorie «Le plus beau dessin», c’est Martin Kuppe qui l’emporte avec son dessin d’un barbapapa-théière.</p>\n<p>Bravo à eux deux, ils gagnent chacun un mois de thé gratuit !</p>\n<p><img src=\"/images/blog/02.webp\" alt=\"02\" loading=\"lazy\"><em>Attention, le thé peut rendre fou…</em><img src=\"/images/blog/dessin-barbapapa.webp\" alt=\"dessin-barbapapa\" loading=\"lazy\"><em>Une production qui a valu à Martin Kuppe d’être lauréat dans la catégorie « le plus beau dessin ».</em><br>\n<img src=\"/images/blog/dessin-barbapapa2.webp\" alt=\"dessin-barbapapa2\" loading=\"lazy\"><em>C’est avec ça que tu espérais gagner Etienne</em> ?</p>"
      legacy_cover: "/images/blog/couverture-barbapapa.webp"
      status: "published"
      published_at: "2013-06-06"
      categories: ["actualites"]
      legacy_path: "/concours-interne-le-rose-envahit-la-plage/"
      created_at: "2013-06-06T13:28:40Z"
  - key: "fetez-lete-a-strasbourg-avec-ledgefest"
    fields:
      title: "Fêtez l’été à Strasbourg avec l’EdgeFest"
      slug: "fetez-lete-a-strasbourg-avec-ledgefest"
      excerpt: "Le beau temps revient (du moins, il reviendra), la bonne humeur est de mise et nos inquiètudes sont balayées. Nous sommes parés pour l’EdgeFest, le festival…"
      body: "<p>Le beau temps revient (du moins, il reviendra), la bonne humeur est de mise et nos inquiètudes sont balayées.</p>\n<p>Nous sommes parés pour l’EdgeFest, le festival de la communauté numérique et créative de ce début d’été à Strasbourg ! Une seconde édition qui est née sous une bonne étoile. Pendant 4 jours complets, la Presqu’île Malraux prendra vie.  Haut-lieu culturel avec le Conservatoire, la Médiathèque Malraux et la Plage Digitale; la Presqu’île Malraux prendra vie du 4 au 7 Juillet grâce à l’EdgeFest by Alsace Digitale. Cet évènement est organisé en Préfiguration du Pôle Seegmuller et dans le cadre de la programmation Place à l’Eté de la Ville de Strasbourg.</p>\n<p><img src=\"/images/blog/affiche1.webp\" alt=\"Affiche EdgeFest 2013\" loading=\"lazy\"></p>\n<p>L’été arrive et nous allons le fêter du mieux que nous pouvons ! Alors préparez-vous, ça va bouger sur toute la presqu’île. Du 4 au 7 juillet, Alsace Digitale et ses partenaires vous proposent des ateliers, des soirées conviviales, des conférences et des non-conférences même. Plus précisément, l’EdgeFest se divisera en plusieurs évènements. <strong>Chacun d’eux est ouvert à tous et reste gratuit !</strong></p>\n<ul><li><a href=\"http://bit.ly/13GO8CS\" rel=\"noopener\">Summercamp –</a> ateliers pour petits et grands à la Médiathèque;</li><li><a href=\"http://bit.ly/19XzbkT\" rel=\"noopener\">EdgeDay –</a> Portes Ouvertes de la Plage Digitale avec des ateliers et des tables rondes;</li><li><a href=\"http://bit.ly/168mqBE\" rel=\"noopener\">DemoNight – </a>présentation de start-up Alsaciennes;</li><li><a href=\"http://bit.ly/19hPLLh\" rel=\"noopener\">Barcamp Alsace 10 – </a>rencontres numérique au tour d’ateliers et de non-conférence;</li><li><a href=\"http://on.fb.me/128vtNQ\" rel=\"noopener\">EdgeNight –</a> Soirée électro sur une plage improvisée;</li><li><a href=\"http://on.fb.me/12KJBnK\" rel=\"noopener\">Hackathon –</a> réunion de programmeurs pour faire de la programmation informatique collaborative.</li></ul>\n<p>L’EdgeFest sera agrémenté de rencontres avec des entrepreneurs, artistes, développeurs, designers, mais aussi, tarabiscoteurs, inventeurs et joueurs. On espère vous retrouver au gré des activités, d’échanger – et surtout – de passer un moment convivial pendant le festival.</p>\n<p>Retrouvez toute notre programmation sur <a href=\"http://www.edgefest.fr/\" rel=\"noopener\">notre site internet</a> ou via notre carte interactive ci-dessous :</p>"
      legacy_cover: "/images/blog/sans-titre-7.webp"
      status: "published"
      published_at: "2013-06-27"
      categories: ["evenements"]
      legacy_path: "/fetez-lete-a-strasbourg-avec-ledgefest/"
      created_at: "2013-06-27T13:54:53Z"
  - key: "gerez-vos-bases-de-donnees-avec-couchbase"
    fields:
