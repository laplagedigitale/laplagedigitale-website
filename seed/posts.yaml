  - key: "table-ronde-propriete-intellectuelle-numerique-et-startups"
    fields:
      title: "Table ronde : Propriété intellectuelle, numérique et startups"
      slug: "table-ronde-propriete-intellectuelle-numerique-et-startups"
      excerpt: "Dans le cadre de sa mission d’accompagnement des entreprises, l’INPI (L’Institut National de la Propriété Intellectuelle) a lancé un appel à contributions…"
      body: "<p>Dans le cadre de sa mission d’accompagnement des entreprises, l’INPI (L’Institut National de la Propriété Intellectuelle) a lancé un appel à contributions pour recueillir le point de vue d’experts afin d’initier une réflexion sur les problématiques liées à la propriété intellectuelle dans le numérique.</p>\n<p>A Strasbourg, l’INPI, Rhénatic et Alsace Digitale se sont associés à ce projet et propose un événement, à mi-chemin entre une table-ronde et un world café autour du thème : “<b>La propriété intellectuelle, le numérique et les startups</b>”. L’objectif est de rassembler à la fois des experts de ces questions mais également de permettre à chacun d’apporter sa contribution.</p>\n<p>Rendez-vous <b>mardi 29 novembre</b>, au <b>Shadok</b> à partir de <b>9h</b>.</p>\n<p>Cet événement sera donc l’occasion de réfléchir sur les nouveaux outils juridiques à mettre en place pour améliorer l’usage du code de la propriété intellectuelle dans le numérique. En effet, de nombreux domaines d’innovation et de création ne rentrent pas dans le cadre traditionnel du code de la propriété intellectuelle. Par exemple, les objets connectés n’ont pas de régime juridique propre, leur protection fait appel à différents droits (protection par brevet du logiciel, droit d’auteur pour l’exécution du logiciel et droit des dessins et modèles pour le design de l’objet). De la même manière, la démocratisation de l’utilisation des Big Data n’est pas encadrée sur le plan juridique : s’il existe bien un droit de production des données, il n’en n’existe pas pour leur exploitation. Mais encore, les imprimantes 3D, qui en facilitant la production d’oeuvres en grand nombre, rendent, par conséquent, difficile la lutte contre la contrefaçon. Le code, également, est aujourd’hui exclu du champ de la brevetabilité et n’est protégé que par le droit d’auteur : il ne peut donc être valorisé dans le bilan des entreprises.</p>\n<p>Informations pratiques :</p>\n<p><b>Inscription obligatoire</b> sur Eventbrite : <a href=\"https://www.eventbrite.fr/e/billets-table-ronde-la-propriete-intellectuelle-le-numerique-et-les-startups-29111177315\" rel=\"noopener\">https://www.eventbrite.fr/e/billets-table-ronde-la-propriete-intellectuelle-le-numerique-et-les-startups-29111177315</a></p>\n<p><b>9h00</b> : accueil autour d’un café<br>\n<b>9h30 – 12h</b> : événement<br>\n<b>12h</b> : moment de networking autour d’une collation</p>\n<p>Au<b> Shadok</b>, 25 presqu’île Malraux, 67100 Strasbourg</p>\n<p>Pour en savoir plus :</p>\n<p>. <a href=\"http://www.usine-digitale.fr/editorial/comment-reconcilier-numerique-et-propriete-intellectuelle.N357209\" rel=\"noopener\">“Comment réconcilier numérique et propriété intellectuelle”</a> sur L’Usine Digitale</p>\n<p>. Le rapport de l’INPI sur <a href=\"https://fr.scribd.com/document/285220795/PI-Et-Transformation-Economie-Numerique-INPI-Interactif-2#from_embed\" rel=\"noopener\">“La propriété intellectuelle et la transformation numérique de l’économie”</a></p>"
