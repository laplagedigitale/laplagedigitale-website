  - key: "actinspace-2018"
    fields:
      title: "ActInSpace 2018"
      slug: "actinspace-2018"
      excerpt: "ActInSpace 2018 En mai 2018, ActInSpace vous propose de plonger la tête dans les étoiles. Cette troisième édition de l’événement mondial se déroulera dans…"
      body: "<p><img src=\"/images/blog/ais18.webp\" alt=\"\" loading=\"lazy\"></p>\n<p><strong>ActInSpace 2018</strong></p>\n<p>En mai 2018, ActInSpace vous propose de plonger la tête dans les étoiles. Cette troisième édition de l’événement mondial se déroulera dans plusieurs villes, dont Strasbourg, et vous offrira la chance unique de devenir <strong>entrepreneur dans l’industrie spatiale</strong> pendant 24 heures !</p>\n<p>Vous et d’autres participants aurez pour mission de relever un des nombreux <a href=\"https://entreprises.cnes.fr/fr/entreprises-partenaires/actinspacer/les-defis-0\" rel=\"noopener\">défis</a> imposés par le <a href=\"https://cnes.fr/fr\" rel=\"noopener\">CNES</a> (Centre National d’Etudes Spatiales), l’agence <a href=\"https://www.esa.int/ESA\" rel=\"noopener\">ESA</a> (European Space Agency) et leurs partenaires. Pour réussir, il vous faudra <strong>dépasser vos limites</strong> et réussir à <strong>travailler en équipe</strong>.</p>\n<p>L’initiative ActInSpace a pour objectif de promouvoir l’utilisation des technologies spatiales afin d’<strong>améliorer le quotidien </strong>des citoyens, de <strong>booster l’emploi</strong> et de <strong>préserver la planète</strong>. Ce hackathon est possible grâce à la participation et l’expertise des acteurs du domaine spatial et entrepreneurial.</p>\n<p>Vous êtes étudiant, chercheur, développeur, entrepreneur ou tout simplement passionné par l’espace et ses mystères ? ActInSpace est pour vous ! Vous aurez l’occasion de <strong>faire des rencontres uniques</strong>, d’élargir votre carnet d’adresses et peut-être même de participer aux finales de Toulouse, les 26 et 27 juin.</p>\n<p>Du vendredi 25 au samedi 26 mai 2018<br>\n<a href=\"http://www.isunet.edu/\" rel=\"noopener\">International Space University</a>, 1 rue Jean-Dominique Cassini – 67400 Illkirch-Graffenstaden<br>\nInscriptions sur le <a href=\"https://actinspace.org/register\" rel=\"noopener\">site officiel d’ActInSpace</a></p>"
      legacy_cover: "/images/blog/ais18.webp"
      status: "published"
      published_at: "2018-04-24"
      categories: ["actualites", "evenements"]
      legacy_path: "/actinspace-2018/"
      created_at: "2018-04-24T14:19:24Z"
  - key: "meetup-19-monetisation-et-optimisation-de-revenus"
    fields:
      title: "Meetup #19 : “Monétisation et optimisation de revenus”"
      slug: "meetup-19-monetisation-et-optimisation-de-revenus"
      excerpt: "Meetup #19 : “Monétisation et optimisation de revenus” La question toute simple que n’importe quel développeur peut un jour se poser, avant de mettre son…"
      body: "<h3><img src=\"/images/blog/untitled-1.webp\" alt=\"\" loading=\"lazy\"></h3>\n<h3><b>Meetup #19</b><b> : “Monétisation et optimisation de revenus”</b></h3>\n<p>La question toute simple que n’importe quel développeur peut un jour se poser, avant de mettre son appli sur un store, est <i>“Comment je vais faire pour la monétiser ?”</i> Une interrogation qui peut paraître bateau, mais qui est bien plus complexe qu’on ne le pense.</p>\n<p>Est-ce qu’il est préférable de passer par un modèle freemium, qui favorise les micro-paiements tout en offrant néanmoins énormément de contenu gratuit aux utilisateurs ? Ou peut-être que l’affichage de publicités dans l’application serait une meilleure idée, pour éviter de faire payer l’utilisateur directement ? Pour l’affichage des pubs, et si on se servait du sponsoring ? Est-ce que le modèle premium pur fonctionne encore, ou les utilisateurs se méfient-ils du contenu derrière un paywall ?</p>\n<p>Comme on le voit, les questions ne manquent pas. Et ce soir, avec l’aide de nos intervenants, nous allons essayer de chercher des réponses pour vous permettre de trouver le modèle économique qui vous corresponde !</p>\n<p>Nos intervenants :</p>\n<ul><li><a href=\"https://www.linkedin.com/in/geoffreykretz/\" rel=\"noopener\"><b>Geoffrey Kretz</b></a> (Entrepreneur et ingénieur logiciel, spécialiste de l’expérience utilisateur et créateur de <a href=\"https://kwit.fr/\" rel=\"noopener\"><b>Kwit</b></a>, l’application mobile qui vous fait arrêter de fumer pour de bon)</li><li><a href=\"https://www.linkedin.com/in/damiendessagne/\" rel=\"noopener\"><b>Damien Dessagne</b></a> (Co-fondateur et CTO de <a href=\"http://www.voodoo.io/\" rel=\"noopener\"><b>Voodoo.io</b></a>, créateurs de jeux vidéo et leader du mobile gaming pour casual gamers)</li></ul>\n<p><b>Jeudi 31 mai 2018, de 18h30 à 21h30</b></p>\n<p><b>Le Shadok, 25 Presqu’île André Malraux – 67100 Strasbourg</b></p>\n<p>Entrée libre, sur inscription :</p>\n<p><a href=\"https://www.eventbrite.fr/e/billets-meetup-19-experience-utilisateur-45928740098\" rel=\"noopener\"><b>https://www.eventbrite.fr/e/billets-meetup-19-experience-utilisateur-45928740098</b></a></p>"
      legacy_cover: "/images/blog/untitled-1.webp"
      status: "published"
      published_at: "2018-05-30"
      categories: ["actualites"]
      legacy_path: "/meetup-19-monetisation-et-optimisation-de-revenus/"
      created_at: "2018-05-30T13:22:20Z"
  - key: "edgefest-2018"
    fields:
      title: "EdgeFest 2018"
      slug: "edgefest-2018"
      excerpt: "EdgeFest, le festival des communautés numériques et créatives est de retour à Strasbourg pour sa 7ème édition, du 25 juin au 7 juillet 2018 ! Jeunes ou moins…"
      body: "<p><a href=\"http://www.edgefest.fr/\" rel=\"noopener\"><img src=\"/images/blog/background.webp\" alt=\"\" loading=\"lazy\"></a></p>\n<p><b>EdgeFest</b>, le festival des communautés numériques et créatives est de retour à Strasbourg pour sa 7ème édition, du 25 juin au 7 juillet 2018 !</p>\n<p>Jeunes ou moins jeunes, inventeurs du dimanche ou amateurs de nouvelles technologies, startuppers accomplis ou grands rêveurs, retrouvons nous tous pour faire rayonner la capitale européenne en ce début d’été. Quoi de mieux que de se promener entre les robots et les animations au bord de l’eau ? C’est ça, la formidable aventure qu’on vient partager à EdgeFest : une invitation aux rencontres, à la réflexion, à la découverte et à la fête. Bref, une ode à la créativité !</p>\n<p>Faisons de la Presqu’île Malraux le temps de deux semaines le théâtre de nos inventions. En quelques jours devenons des développeurs en herbe, des bidouilleurs audacieux, des penseurs du monde de demain. Et qui de mieux que des startuppers, génies du code et artistes de tous horizons pour ouvrir la voie et faire vivre ce festival ? Embarquez dans cette expérience si particulière et unique dans la région !</p>\n<p>Pour plus d’infos, direction le <strong><a href=\"http://www.edgefest.fr/\" rel=\"noopener\">site officiel EdgeFest</a></strong> !</p>\n<p><strong>#EdgeFestSXB</strong></p>\n<p><a href=\"http://www.edgefest.fr/\" rel=\"noopener\"><img src=\"/images/blog/logo-edgefest-07-transparency.webp\" alt=\"\" loading=\"lazy\"></a></p>"
      legacy_cover: "/images/blog/background.webp"
      status: "published"
      published_at: "2018-06-25"
      categories: ["actualites", "evenements"]
      legacy_path: "/edgefest-2018/"
      created_at: "2018-06-25T14:28:37Z"
  - key: "innovons-a-la-foire-europeenne"
    fields:
      title: "Innovons à la Foire européenne !"
      slug: "innovons-a-la-foire-europeenne"
      excerpt: "La communauté Strasbourg Startups sera présente dès l’ouverture de la foire ce vendredi sur l’espace Hello Demain, Showroom Startups & Innovation Hall 5 ! Cet…"
      body: "<p><strong>La communauté Strasbourg Startups sera présente dès l’ouverture de la foire ce vendredi sur l’espace Hello Demain, Showroom Startups &amp; Innovation Hall 5 !</strong></p>\n<p>Cet évènement qui se place sous le signe du numérique, sans restriction d’âge, vous invite à plonger dans le monde du digital en rencontrant notre robot Uby ou encore en explorant le monde de la réalité virtuelle. Démos de produits, projets et présentations de startups innovantes seront au rendez-vous : croyez-nous, les strasbourgeois n’ont pas fini de vous étonner !</p>\n<p>Vous pouvez rencontrer la communauté <strong>Strasbourg Startups</strong> ainsi que ses acteurs autour d’un verre le Mercredi 12 de 18h à 20h et également le samedi 15 à la même heure lors du tirage au sort des gagnants du jeu de la semaine « Hello Demain ! » d’<strong>Incroyable Startups</strong> !</p>\n<p>Au programme également, <strong>@Orange</strong> présentera en avant-première son nouveau jeu Orange Rézo, l’occasion de se poser des questions sur notre rapport aux réseaux sociaux et à l’environnement numérique en général.</p>\n<p>Sur l’évènement seront aussi présent <strong>@Play2Code</strong>, pour initier petits et grands à la programmation à travers des logiciels ludiques et innovants.</p>\n<p>Nous vous réservons encore quelques surprises et pour les découvrir c’est à la Foire européenne du 7 septembre jusqu’au 17 septembre au parc exposition wacken de Strasbourg ! On vous y attend nombreux !</p>\n<p><strong>Plus d’informations sur le site de la Foire</strong> (<a href=\"http://www.foireurop.com/\" rel=\"noopener\">http://www.foireurop.com/</a>)</p>\n<p><strong>et sur notre évènement Facebook</strong> (<a href=\"https://www.facebook.com/events/2186981211325456/\" rel=\"noopener\">https://www.facebook.com/events/2186981211325456/</a>).</p>"
      legacy_cover: "/images/blog/foire-europeenne-de-strasbourg-2018-87896-1200-630.webp"
      status: "published"
      published_at: "2018-09-06"
      categories: ["evenements"]
