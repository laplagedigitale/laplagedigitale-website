      slug: "gerez-vos-bases-de-donnees-avec-couchbase"
      excerpt: "Une base de données est-elle suffisante ? Une question rhétorique posée par Tugdual Grall, venu présenter Couchbase devant une quinzaine d’intéressés, le 20…"
      body: "<p>Une base de données est-elle suffisante ? Une question rhétorique posée par Tugdual Grall, venu présenter <b>Couchbase</b> devant une quinzaine d’intéressés, le 20 juin dernier. Ce « Technical Evangelist » –comme il se définit lui-même – a introduit le logiciel ainsi que le NoSQL. De quoi apprendre à optimiser ses bases de données !</p>\n<p>En effet, rassembler des noms/prénoms/pseudos/adresses emails (rayez les mentions inutiles) c’est bien. Savoir les gérer efficacement, c’est mieux ! Imaginez une application prometteuse. Appellons-la <strong>Draw Something</strong>. Son succès est tel qu’en 6 semaines, 50 millions d’utilisateurs se sont prêtés au jeu. Forcément, il va falloir bien organiser toutes les données pour ne pas se perdre dans le flot d’informations.</p>\n<p><img src=\"/images/blog/dsc03970.webp\" alt=\"Couchbase - NoSQL, conférence par Tugdual Grall. Soirée Elsass JUG\" loading=\"lazy\"><img src=\"/images/blog/dsc03987.webp\" alt=\"Couchbase - NoSQL, conférence par Tugdual Grall. Soirée Elsass JUG\" loading=\"lazy\"></p>\n<p>L’avantage de Couchbase est de faciliter la gestion de clusters de bases de données relationnelles et de pouvoir gérer les clients au cas par cas (pour les sites de e-commerces notamment). Au lieu de rentrer dans un flot de détails, Tugduall nous a partagé ses slides pour voir le fil rouge de la soirée Elsass JUG.</p>\n<p><a href=\"https://www.slideshare.net/slideshow/embed_code/24286258\">Voir la présentation sur SlideShare</a></p>"
      legacy_cover: "/images/blog/dsc03962.webp"
      status: "published"
      published_at: "2013-07-16"
      categories: ["actualites"]
      legacy_path: "/gerez-vos-bases-de-donnees-avec-couchbase/"
