  - key: "conference-gratuite-de-pascal-desfarges"
    fields:
      title: "Conférence gratuite de Pascal Desfarges"
      slug: "conference-gratuite-de-pascal-desfarges"
      excerpt: "Pour un bien être commun à l’heure de la société contributive Hacker, remixer, innover par ceux qui vivent, produisent et inventent la santé de demain.…"
      body: "<p><strong>Pour un bien être commun à l’heure de la société contributive<br>\n</strong><br>\nHacker, remixer, innover par ceux qui vivent, produisent et <strong>inventent la santé de demain.</strong><br>\nPascal Desfarges est designer d’usages, ingénieur d’idées et pédagogue, spécialiste des territoires et de la médiation numérique passé par la philosophie et le théâtre. Il tend à favoriser l’émergence d’une imagination collaborative et d’une « mise en fiction », conditions de l’innovation.</p>\n<p>Pascal Desfarges est le fondateur de l’agence Retiss, qui positionne son action autour de l’innovation sur les territoires dans le contexte des technologies émergentes. Elle s’appuie principalement sur les usages innovants et les dispositifs de médiation. Retiss accompagne les structures, territoires, organisations dans la production d’objets sociaux, économiques et culturels innovants.</p>\n<p>La conférence est <strong>ouverte à tous</strong>, l’inscription est<strong> gratuite</strong> dans la limite des places disponibles</p>\n<p><strong>Pour plus d’infos, rendez-vous sur le <a href=\"http://hackinghealth.camp/fr\" rel=\"noopener\">site du Hacking Health </a></strong><br>\n<strong><a href=\"http://hhcamp.eventbrite.com\" rel=\"noopener\">Inscriptions ici</a></strong><br>\n<strong>Date :</strong> Samedi 19 mars à 10h00<br>\n<strong>Lieu :</strong> Faculté de médecine, 4 Rue Kirschleger, 67000 Strasbourg</p>"
      legacy_cover: "/images/blog/bannieredesfarges.webp"
