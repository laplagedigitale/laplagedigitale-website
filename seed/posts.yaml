  - key: "hacking-industry-camp"
    fields:
      title: "Hacking Industry Camp"
      slug: "hacking-industry-camp"
      excerpt: "Inventer l’énergie de demain Du vendredi 9 au dimanche 11 octobre 2015 à Strasbourg Qu’est-ce qu’un Hacking Industry Camp ? Le Hacking Industry Camp est un…"
      body: "<p><b><img src=\"/images/blog/hic-logo-28-201509.webp\" alt=\"HIC - logo-28\" loading=\"lazy\"></b></p>\n<p><b>Inventer l’énergie de demain</b></p>\n<p><b>Du vendredi 9 au dimanche 11 octobre 2015 à Strasbourg</b></p>\n<p><iframe src=\"https://www.youtube.com/embed/PyeARmlLkCw\" loading=\"lazy\" allowfullscreen title=\"Hacking Industry Camp\"></iframe></p>\n<p><b>Qu’est-ce qu’un Hacking Industry Camp ?</b></p>\n<p>Le <b>Hacking Industry Camp</b> est un<b> hackathon</b> <b>dédié à l’industrie</b>, un évènement destiné à bousculer les idées et à faire émerger de nouveaux projets.</p>\n<p>Contraction de “hack” et “marathon”, le hackathon est un évènement de programmation informatique collaborative. Des équipes aux divers talents s’affrontent pendant tout un week-end pour concevoir des prototypes d’applications, d’objets connectés… C’est un espace-temps où les communautés se croisent et fourmillent d’idées avec pour objectif<b> l’innovation</b> !</p>\n<p>Le <b>Hacking Industry Camp</b> c’est :</p>\n<p><b>54 h</b> pour participer à l’<b>aventure Usine 4.0</b>. Déplacer l’industrie dans ses fondements, l’interroger sur ses <i>process</i>, la rendre plus agile, plus inventive.</p>\n<p><b>54 h</b> pour <b>innover à plusieurs</b>. Un concentré d’énergie créative de tous bords : développeurs, ingénieurs, designers, bricoleurs, utilisateurs, marketeurs…</p>\n<p><b>54 h</b> pour <b>démultiplier les idées</b>, les faire émerger, les concrétiser et donner naissance à des projets innovants qui se poursuivront, soit par la création de <i>start up</i>, soit au sein d’entreprises existantes.</p>\n<p><a href=\"https://www.eventbrite.fr/myevent?eid=17896068623\" rel=\"noopener\">https://www.eventbrite.fr/myevent?eid=17896068623</a></p>\n<p><a href=\"http://www.hackingindustry.camp\" rel=\"noopener\">www.hackingindustry.camp</a></p>\n<p>Evènément co-organisé avec le groupe ES</p>"
      legacy_cover: "/images/blog/hic-logo-28-201509.webp"
      status: "published"
      published_at: "2015-09-08"
      categories: ["actualites", "evenements"]
      legacy_path: "/hacking-industry-camp/"
      created_at: "2015-09-08T07:43:08Z"
  - key: "hacking-health-cafe"
    fields:
      title: "Hacking Health Café"
      slug: "hacking-health-cafe"
      excerpt: "Prochain rendez-vous : Jeudi 01 octobre à 19h30 – Caveau du Centre Chorégraphique – rue Séllenick Le Thème du Mois : La Rééducation Fonctionnelle Quelles sont…"
      body: "<p><img src=\"/images/blog/hackinghealth.webp\" alt=\"hackinghealth\" loading=\"lazy\"></p>\n<p><strong><br>\nProchain rendez-vous : Jeudi 01 octobre à 19h30 – Caveau du Centre Chorégraphique – rue  Séllenick</strong></p>\n<p>Le Thème du Mois : La Rééducation Fonctionnelle</p>\n<p><strong>Quelles sont les tendances santé de demain?<br>\nQui sont les nouveaux acteurs?<br>\nComment pouvons-nous accompagner ce mouvement?</strong><br><br>Bienvenue au Hacking Health Café!<br>Chaque mois, venez découvrir un panorama des innovations médicales émergentes aux 4 coins du monde ainsi que des exemples locaux.<br>Pour trouver l’inspiration, rencontrer d’autres innovateurs santé et faire tomber les barrières. <br>Le tout dans un cadre convivial.<br><br><strong>Pour Qui?</strong><br>Kinés, Ergothérapeutes, Podologues, Infirmiers, mais aussi Médecins, Informaticiens, Etudiants, Chirurgiens, Ingénieurs, Patients, Designers, Cadres Hospitaliers, Assureurs…<br>Car les idées les plus prometteuses naissent de la convergence entre toutes les disciplines.<br><br><strong>Le Thème du Mois: La Rééducation Fonctionnelle</strong><br>Suite à un accident domestique, à un choc sportif, à une maladie ou à cause d’une position de travail, nous connaissons tous à un moment des problèmes et douleurs physiques. Grâce aux nouvelles technologies (impression 3D, internet mobile, réalité augmentée,…) de solutions créatives apparaissent dans les domaines de la rééducation physique et fonctionnelle.</p>"
      legacy_cover: "/images/blog/hackinghealth.webp"
      status: "published"
      published_at: "2015-09-28"
      categories: ["actualites"]
      legacy_path: "/hacking-health-cafe/"
      created_at: "2015-09-28T09:22:42Z"
  - key: "codeweek-2015"
    fields:
      title: "CodeWeek 2015"
      slug: "codeweek-2015"
      excerpt: "La CodeWeek, semaine dédiée au code et à la culture numérique partout en Europe, revient cette année à Strasbourg ! Venez participer à des ateliers variés et…"
      body: "<p>La <strong>CodeWeek</strong>, semaine dédiée au code et à la culture numérique partout en Europe, revient cette année à Strasbourg ! Venez participer à des ateliers variés et amusants !</p>\n<p>Cette année, nous vous proposons <strong>trois événements</strong> :</p>\n<ul><li><strong>Coding Club</strong> : Cette journée sera placée sous le signe du développement vidéoludique ! Vous allez pouvoir, au cours de cette après-midi destinée aux lycéens, créer votre premier jeu-vidéo et ainsi découvrir l’envers du décor de la création d’un jeu.<br>\nDate : le<strong> mercredi 14 octobre </strong>de<strong> 14h à 17h<br>\n</strong>Lieu : <strong>Epitech</strong> au <strong>4 rue du dôme, 67000 Strasbourg<br>\n</strong>Public : <strong>14-20 ans<br>\n</strong></li><li><a href=\"http://events.codeweek.eu/view/4088/coding-club/\" rel=\"noopener\">Plus d’informations</a></li><li><strong>Afterwork CodeWeek</strong> : Que vous vous demandiez comment bien sécuriser votre compte Facebook ou Twitter, que ce soit pour apprendre à placer un widget sous WordPress, ou simplement pour parler de numérique avec d’autres personnes…<br>\nDate : le <strong>mercredi 14 octobre</strong> à <strong>18h</strong><br>\nLieu : <strong>Club Presse Strasbourg </strong>au<strong> 10 Place Kleber, 67000 Strasbourg<br>\n</strong>Public : <strong>À partir de 14 ans</strong><br>\n<a href=\"http://events.codeweek.eu/view/5008/afterwork-codeweek/\" rel=\"noopener\">Plus d’informations</a></li><li><strong>CodingGoûter</strong> : De nombreux ateliers de découverte vous seront proposés pour découvrir la culture numérique de façon ludique !<br>\nDate : le <strong>samedi 17 octobre</strong> à  <strong>14h </strong><br>\nLieu : <strong>UGC Ciné Cité </strong>au<strong> 25 Route du Rhin, 67100 Strasbourg<br>\n</strong>Public : <strong>7-99 ans</strong><br>\n<a href=\"http://events.codeweek.eu/view/5031/coding-gouter-a-lugc/\" rel=\"noopener\">Plus d’informations</a></li></ul>\n<p><strong>Tous les événements sont gratuits et ouverts au public !</strong></p>"
      legacy_cover: "/images/blog/12063753-1647699602150741-1946067732128760498-n.webp"
