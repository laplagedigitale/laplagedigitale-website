  - key: "coworker-de-la-semaine-yves-hertwig-lhomme-dun-seul-client"
    fields:
      title: "[COWORKER DE LA SEMAINE] Yves Hertwig, l’homme d’un seul client"
      slug: "coworker-de-la-semaine-yves-hertwig-lhomme-dun-seul-client"
      excerpt: "L’air décontracté, Yves Hertwig a créé son entreprise alors qu’il ne travaille que pour un seul client. Il s’est découvert l’âme d’entrepreneur un peu par…"
      body: "<p><strong>L’air décontracté, Yves Hertwig a créé son entreprise <strong>alors qu’il ne travaille que pour un seul client</strong>. Il s’est découvert l’âme d’entrepreneur un peu par sérendipité et, comme le hasard fait bien les choses, il ne regrette aucunement son choix. Il nous en dit plus sur cette situation originale :</strong></p>\n<p><strong>1) Quelle est ta profession ?</strong></p>\n<p>Je suis consultant en informatique pour General Motors, pour un projet nommé Global Coding. En gros, il s’agissait initialement de regrouper un grand nombre d’outils de référencement d’articles indirects en une seule base de données : le catalogue global. À présent, il s’agit de faire vivre cette base.</p>\n<p>J’ai débuté comme intérimaire à General Motors Strasbourg il y 7 ans, avec comme mission de migrer une base de données obsolète. Le site de Strasbourg était alors un site pilote, j’ai été intégré au projet dès le départ. Comme tout se passait bien, ma hiérarchie m’a laissé plus de liberté et m’a permis de prendre part aux décisions. Ma mission d’un an arrivée à terme, j’ai été recontacté par la maison mère pour appliquer la migration de données à l’ensemble de ses usines.</p>\n<p><strong>2) N’avoir qu’un seul client n’est-il pas désavantageux ?</strong></p>\n<p>Ce n’est initialement pas un choix. Ma mission d’un an sur le site strasbourgeois finie, General Motors n’avait pas de contrat à me proposer et m’a persuadé de me mettre à mon compte… Chose faite en octobre 2007. C’est un concours de circonstance, je n’avais pas prévu créer ma boîte. Il s’avère que ça me plaît, surtout en termes de libertés ! Je continue donc sur ma lancée, avec des commandes annuelles émises par General Motors.</p>\n<p>Ce client m’occupe à 100% tout en me laissant du temps libre à côté de mon activité. De plus, il ne me formule pas de demande impossible. Du moment que le contrat est renouvelé tous les ans, ça me convient. Je sais qu’un jour, ça s’arrêtera. À ce moment, ce sera à moi de vendre mes compétences.</p>\n<p><strong><img src=\"/images/blog/yves-blog.webp\" alt=\"Yves Hertwig, consultant en informatique pour General Motors\" loading=\"lazy\"><br>\n3) Dans les sentiers de la Plage, il se dit que tu es « le pro de l’Excel ». Une réputation surfaite ?</strong></p>\n<p>Oui, certainement. Un de mes outils de travail principal reste Excel, support de toute action liée au traitement des données du catalogue. Concrètement, ça représente 50% de mon temps de travail. Du coup, quand les Plagistes passent dans mon dos, Excel est grand ouvert. Ceci explique cela.</p>\n<p><strong>4) Pourquoi avoir choisi le coworking et la Plage ?</strong></p>\n<p>Je travaillais déjà en open-space au sein de General Motors Strasbourg. Quand le site a été vendu en janvier 2013, peu d’options s’offraient à moi. N’étant pas suffisamment rigoureux pour travailler chez moi, le coworking est apparu comme la solution. De par la situation géographique, le coût et l’environnement : la Plage s’est imposée comme choix.</p>\n<p><strong>5) Que t’apporte la Plage Digitale ?</strong></p>\n<p>L’environnement est studieux, c’est limite intimidant au début. C’est un lieu qui se prête au travail, mais aussi échanges entre les coworkers : échanges de services, de compétences, d’informations et de bon plans. Comme cela a déjà été le cas avec Jérôme, Greg ou encore Alexandra (juriste). Je leur ai apporté mon aide, et eux m’ont apporté la leur.</p>\n<p>Et surtout, l’ambiance est au beau fixe, et l’espace détente / cuisine apporte convivialité et énergie à tout instant.</p>"
      legacy_cover: "/images/blog/yves-en-vignette.webp"
      status: "published"
      published_at: "2013-10-14"
