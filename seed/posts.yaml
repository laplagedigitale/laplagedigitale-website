  - key: "xfive-booste-les-defis-du-hacking-industry-camp"
    fields:
      title: "xFIVE booste les défis du Hacking Industry Camp !"
      slug: "xfive-booste-les-defis-du-hacking-industry-camp"
      excerpt: "Participez aux workshops de préparation Les hackathons, vous connaissez ? Un challenge insensé : en un weekend, présenter un défi, rassembler une équipe…"
      body: "<p>Participez aux workshops de préparation</p>\n<p>Les hackathons, vous connaissez ? Un challenge insensé : en un weekend, présenter un défi, rassembler une équipe improbable, co-construire une solution innovante, la prototyper et la défendre devant un jury !<br>\n<img src=\"/images/blog/workshop-hic-2017.webp\" alt=\"workshop HIC 2017\" loading=\"lazy\"></p>\n<p>Strasbourg se prépare à vivre cette expérience le weekend du 13 au 15 octobre 2017. Avec ses partenaires, Alsace Digitale organise son troisième <a href=\"http://www.hackingindustry.camp/\" rel=\"noopener\">Hacking Industry Camp</a> sur le thème « Inventer l’énergie de demain ! ». Leur ambition : participer à la quatrième révolution industrielle (l’industrie 4.0) développée par l’être humain pour l’être humain : l’être humain, c’est ça la nouvelle énergie de demain !</p>\n<p>Et donc pour nourrir le hackathon, il faut des défis à relever !  C’est pour préparer les porteurs de défis à construire et présenter au mieux leurs challenges qu’<a href=\"http://www.alsacedigitale.org/\" rel=\"noopener\">Alsace Digitale</a> et <a href=\"http://www.rhenatic.eu/\" rel=\"noopener\">Rhénatic</a> ont chargé xFIVE d’animer des ateliers afin d’aider les porteurs de défis à construire et enrichir leurs challenges, pour leur permettre de séduire et rassembler une équipe enthousiaste autour de leur idée.</p>\n<p>Lors de l’édition 2016, une trentaine de participants aux profils très divers, venus d’entreprises strasbourgeoises et d’ailleurs, ont joué le jeu pendant deux demi-journées et ont déroulé ensemble le parcours VOSICOT. </p>\n<p><strong>VOSICOT</strong> (le petit nom de notre méthodologie <a href=\"http://xfive.be/fr/qui-sommes-nous/nos-outils-et-methodes-cadmi-triz/13-qui-sommes-nous/81-notre-methode-c-a-d-m-i\" rel=\"noopener\">CADMI</a>) n’est pas un outil réservé aux pitchers. C’est un processus systématique pour innover, depuis l’émergence de l’idée à sa concrétisation. Plus qu’une boite à outils, VOSICOT c’est une attitude favorisant l’intelligence collective. Et c’est d’ailleurs la volonté des organisateurs que d’offrir à chaque participant une méthode d’innovation applicable à tous les défis de l’entreprise ou de la société en général. VOSICOT une solution simple, efficace et abordable pour relever ensemble les défis du redéploiement d’activités entrepreneuriales.</p>\n<p>Pour les participants de l’an dernier qui souhaitent participer à la construction de leurs défis, nous aborderons cette année avec eux VOSICOT selon les différents outils et méthodes de conception inventives qui vous permettront de proposer un défi techniquement plus innovant !</p>\n<p><strong>Rendez-vous les 7 et 14 septembre prochains pour vivre de nouveaux moments intenses avant le grand week-end du Hacking Industry Camp 2017. Et nous serons là bien sûr !</strong></p>\n<p>Les liens d’inscription :</p>\n<p>Deux niveaux : débutant = saison 1, sensibilisé = saison 2 – Pour chacun deux épisodes !</p>\n<p>Les Workshop du 07 !</p>\n<p><a href=\"https://www.eventbrite.com/e/workshop-hic-saison-1-episode-1-tickets-36611875104\" rel=\"noopener\">https://www.eventbrite.com/e/workshop-hic-saison-1-episode-1-tickets-36611875104</a></p>\n<p><a href=\"https://www.eventbrite.com/e/workshop-hic-saison-2-episode-1-tickets-37289096692\" rel=\"noopener\">https://www.eventbrite.com/e/workshop-hic-saison-2-episode-1-tickets-37289096692</a></p>\n<p>Les Workshop du 14 !</p>\n<p><a href=\"https://www.eventbrite.com/e/workshop-hic-saison-1-episode-2-tickets-37289341424\" rel=\"noopener\">https://www.eventbrite.com/e/workshop-hic-saison-1-episode-2-tickets-37289341424</a></p>\n<p><a href=\"https://www.eventbrite.fr/e/billets-workshop-hic-saison-2-episode-2-37289498895\" rel=\"noopener\">https://www.eventbrite.fr/e/billets-workshop-hic-saison-2-episode-2-37289498895</a></p>\n<p>organisé avec le soutien des fonds Interreg : UpperRhine 4.0</p>"
