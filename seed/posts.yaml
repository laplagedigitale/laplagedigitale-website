      excerpt: "La Plage Digitale, 1er espace de coworking à Strasbourg vous ouvre ses portes durant le mois de janvier (entre le 04 et le 31). Ambiance studieuse et…"
      body: "<p><img src=\"/images/blog/final-cet-hiver.webp\" alt=\"final_cet_hiver\" loading=\"lazy\"></p>\n<p>La Plage Digitale, 1er espace de coworking à Strasbourg vous ouvre ses portes durant le mois de janvier (entre le 04 et le 31). Ambiance studieuse et conviviale à la fois, la plage est le lieu idéal pour se poser sur ses dossiers et se sentir entouré. Si vous voulez profiter d’une journée cadeau.</p>\n<p>Merci de remplir le formulaire ci-dessous.</p>\n<p>https://docs.google.com/forms/d/1Y1lg8cLa2H1_GI8ZLBbBqQkKTLz38ArWd3dp2n9E-o0/viewform?usp=send_form</p>"
