  - key: "donnez-un-coup-de-pouce-a-votre-projet-mobilite"
    fields:
      title: "Donnez un coup de pouce à votre projet mobilité!"
      slug: "donnez-un-coup-de-pouce-a-votre-projet-mobilite"
      excerpt: "Strasbourg accueillera du 19 au 22 juin 2017 le 12ème congrès européen sur les systèmes de transports intelligents. Pour l’occasion Engie et Alsace Digitale…"
      body: "<p><strong>Strasbourg accueillera du 19 au 22 juin 2017 le <a href=\"http://strasbourg2017.itsineurope.com/\" rel=\"noopener\">12ème congrès européen sur les systèmes de transports intelligents</a>. Pour l’occasion Engie et <a href=\"http://www.alsacedigitale.org/\" rel=\"noopener\">Alsace Digitale</a>, en collaboration avec <a href=\"http://www.strasbourg.eu/\" rel=\"noopener\">Eurométropole Strasbourg</a> et Pôle Véhicule du Futur lance un appel à projets aux startups qui peuvent apporter des solutions innovantes et durables en matière de mobilité.</strong></p>\n<p>Dans un monde de plus en plus peuplé et interconnecté, les nouvelles technologies sont devenues des outils indispensables à la mobilité, avec des usages nombreux qui se diffusent rapidement. Voiture connectée, carburants alternatifs, applications d’auto partage, route intelligente,…  Les mobilités intelligentes de demain doivent permettre une organisation plus fluide, plus efficace et plus verte de nos villes. Et pour qu’une telle transition s’opère, nous avons besoin de vos idées innovantes !</p>\n<p>Vous avez créé votre startup dans la Région Grand Est ou Rhin Supérieur depuis plus d’un an ? Votre démarche s’inscrit dans une volonté de révolutionner nos modes de déplacement pour les rendre plus sûrs, plus confortables, plus économes ? Alors prenez part à cet appel à projet et bénéficiez d’un programme de mentoring concentré sur trois jours encadré par des spécialistes mondiaux de la mobilité durable. Cet événement à portée internationale se déroulera entièrement en anglais.</p>\n<p>Enfin vous pourrez tenter votre chance d’être sélectionné pour pitcher devant les congressistes : une occasion en or d’acquérir une notoriété mondiale et de rencontrer des experts du domaine qui vous aideront à concrétiser votre idée. Un coup de pouce qui pourrait bien transformer votre startup story en véritable success story !</p>\n<p>Pour en savoir plus et participer c’est par <a href=\"https://fab.engie.com/fr/detail/appel-a-projet/startup-boost-your-mobility-up-/4358?utm_source=mail&amp;utm_medium=projet&amp;utm_content=strasbourg\" rel=\"noopener\">ICI</a>.</p>\n<p>Attention à ne pas manquer le coche, les candidatures prennent fin le<strong> 28 MAI 2017 à MINUIT </strong>!</p>"
      legacy_cover: "/images/blog/transports.webp"
      status: "published"
      published_at: "2017-05-17"
      categories: ["actualites"]
      legacy_path: "/donnez-un-coup-de-pouce-a-votre-projet-mobilite/"
      created_at: "2017-05-17T10:45:18Z"
  - key: "salon-idf-conference-les-nouveaux-modes-de-collaboration"
    fields:
      title: "Salon IDF : Conférence « Les nouveaux modes de collaboration ! »"
      slug: "salon-idf-conference-les-nouveaux-modes-de-collaboration"
      excerpt: "L’édition 2017 du salon Industries du Futur à Mulhouse se tiendra les 14 et 15 juin au Parc Expo de Mulhouse. A cette occasion plusieurs conférences autour…"
      body: "<p>L’édition 2017 du <a href=\"http://www.industriesdufutur.eu/\" rel=\"noopener\">salon Industries du Futur</a> à Mulhouse se tiendra les 14 et 15 juin au Parc Expo de Mulhouse. A cette occasion plusieurs <a href=\"http://www.industriesdufutur.eu/visiter-salon/conferences/\" rel=\"noopener\">conférences</a> autour des enjeux industriels seront données. <a href=\"https://www.alsacedigitale.org/\" rel=\"noopener\">Alsace Digitale</a> organisera, en collaboration avec <a href=\"http://www.lafrenchtech-alsace.eu/\" rel=\"noopener\">La French Tech Alsace</a> et <a href=\"http://www.rhenatic.eu/\" rel=\"noopener\">Rhénatic</a>, une conférence sur le thème des nouveaux modes de collaboration pour stimuler l’innovation.</p>\n<p>A l’heure où la créativité devient un atout indispensable dans le secteur industriel, de nouvelles méthodes de production d’idées et de concepts émergent. Pour collaborer tous les moyens sont à tester : FabLab, Hackathon, Workshop, …</p>\n<p>Autour de présentations et de partages d’expériences, les intervenants apporteront les éclairages nécessaires à la compréhension de ces nouvelles méthodes ainsi que leurs témoignages.</p>\n<p>Les inscriptions aux conférences sont gratuites et déjà ouvertes, ça se passe <a href=\"https://www.parcexpo.fr/billets-idf/conferences/inscription_conferences.php\" rel=\"noopener\">ICI</a>.</p>\n<p>On espère vous y voir nombreux !</p>\n<p>Retrouvez plus d’infos sur notre événement Facebook  -&gt; https://www.facebook.com/events/1690367697939275/</p>"
      legacy_cover: "/images/blog/salon-idf-2.webp"
      status: "published"
      published_at: "2017-05-31"
      categories: ["actualites"]
      legacy_path: "/salon-idf-conference-les-nouveaux-modes-de-collaboration/"
