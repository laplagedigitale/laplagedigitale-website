  - key: "hack-le-chalet-la-competition-dans-la-joie-et-la-bonne-humeur"
    fields:
      title: "Hack le Chalet : la compétition dans la joie et la bonne humeur"
      slug: "hack-le-chalet-la-competition-dans-la-joie-et-la-bonne-humeur"
      excerpt: "Dans la lignée du Hack SXB, nous vous dévoilons notre tout nouvel évènement : Hack le Chalet ! En effet, Alsace Digitale organise un hackathon pour rassembler…"
      body: "<p>Dans la lignée du Hack SXB, nous vous dévoilons notre tout nouvel évènement : Hack le Chalet !  En effet, Alsace Digitale organise un hackathon pour rassembler plusieurs équipes de développeurs sur des projets.</p>\n<p>Tout d’abord, qu’est-ce qu’un hackathon ? Concept de plus en plus répandu en France, un hackathon est un marathon entre développeurs sur, généralement, un week-end. L’intérêt est de réunir différentes équipes montant leurs propres projets dans un esprit compétitif. Et quand on sait que plusieurs coworkers de la Plage seront présents, forcément, l’ambiance n’en sera que plus électrisée !</p>\n<p>Les participants ont 48 heures pour créer leur propre application par groupe de 5, maximum.  Hack le Chalet se déroulera du 24 au 26 mai et nous avons choisi un endroit insolite, pour prendre un peu d’air frais. Le hackathon s’installera à la Fermeraie, un chalet reculé à Luttenbach-prés-Munster (Haut-Rhin). Pas d’inquiétude, vous ne serez pas coupés du monde puisqu’il y aura internet. Cependant, ne vous laissez pas distraire, la compétition sera intense.</p>\n<p>Une quinzaine de personnes sont déjà inscrites. Nous prévoyons d’accueillir des coworkers européens issus de pays transfrontaliers comme l’Allemagne ou la Suisse. Que du beau monde en perspective !<br>\nMettez-vous au vert pour <strong>60€, tout compris</strong> (repas, internet, logement,…). Tentez de gagner des tablettes et téléphones Google Nexus. Faites part de vos talents avec des gens funs. N’attendez plus. <a href=\"http://www.hacklechalet.com/\" rel=\"noopener\">Prenez vos places sur notre site internet</a>.</p>"
      legacy_cover: "/images/blog/untitled-1-2.webp"
      status: "published"
      published_at: "2013-05-06"
      categories: ["evenements"]
      legacy_path: "/hack-le-chalet-la-competition-dans-la-joie-et-la-bonne-humeur/"
      created_at: "2013-05-06T12:02:11Z"
  - key: "internet-cet-outil-vital-au-quotidien-et-incompris"
    fields:
      title: "Internet, cet outil vital au quotidien et incompris."
      slug: "internet-cet-outil-vital-au-quotidien-et-incompris"
      excerpt: "Sorti depuis peu, le documentaire « Une contre-histoire de l’Internet » rencontre de bonnes critiques. À la Plage Digitale, on ne pouvait pas passer à côté…"
      body: "<p>Sorti depuis peu, le documentaire <b>« Une contre-histoire de l’Internet »</b> rencontre de bonnes critiques. À la Plage Digitale, on ne pouvait pas passer à côté d’un tel sujet qui nous concerne au quotidien !</p>\n<p>Lundi dernier, une trentaine de « vieux geeks » se sont réunis pour une soirée nostalgie. Chacun a pu redécouvrir les joies des débuts d’internet et retracer son évolution grâce au reportage <b>d’ARTE</b>. Internet ne s’est pas construit en un jour, bien au contraire. Un grand débat s’est ensuite articulé autour des sujets –plus ou moins sensibles– abordés  dans le documentaire : liberté d’expression, hackers, incompréhension et maîtrise approximative du grand public, éthique,… C’est à ce moment qu’une quinzaine de twettos nous ont rejoint pour participer à la discussion.</p>\n<p><img src=\"/images/blog/dsc030311.webp\" alt=\"Projection-débat sur &quot;une contre-histoire de l&#x27;internet&quot; à la Plage Digitale, Strasbourg\" loading=\"lazy\"></p>\n<p>Pierre France, journaliste de <b>Rue89 Strasbourg</b>, a animé la séance. Le premier thème concerne la neutralité du web. Tout de suite, les affrontements commerciaux entre Google et Free s’insèrent dans la conversation. « Le plus dangereux, c’est le pouvoir des grosses entreprises sur Internet », martèle Stéphane Becker, président d’Alsace Digitale. Mettant tout le monde d’accord, une autre interrogation survient : faut-il enseigner le codage à l’école ? C’est là où les avis divergent. Certains préconisent un apprentissage précoce, d’autres non en faisant remarquer « à chacun son métier ». Devant les discours trop enflammés de certains, Pierre France passe à une autre question…</p>\n<p>Peu à peu, la conversation dévie sur la vie privée sur le web : mythe ou réalité ? Tout le monde pointe alors du doigt Facebook. Une phrase de Julien Assange (fondateur de Wikileaks), issue du documentaire, semble encrée dans les mémoires. On présente <em>Facebook</em> comme «<i> la version postmoderne de la Stasi</i> ». À comprendre que le réseau social est une grande machine à espionner, l’actuel Big Brother. Si chaque individu doit savoir gérer sa vie privée et contrôler ce qui se dit sur soi, les choses échappent parfois à notre contrôle. La faute aux amis, qui dévoilent des informations sur leurs propres murs.</p>\n<p><img src=\"/images/blog/untitled-1-201305.webp\" alt=\"Les participants ont pris la parole pendant le débat &quot;une contre-histoire de l&#x27;internet&quot;, à la Plage Digitale.\" loading=\"lazy\"><img src=\"/images/blog/dsc03048.webp\" alt=\"Les participants ont pris la parole pendant le débat &quot;une contre-histoire de l&#x27;internet&quot;, à la Plage Digitale.\" loading=\"lazy\"></p>\n<p>En conclusion, Internet a-t-il bien ou mal évolué depuis sa création ? C’est plus un changement d’habitudes et d’utilisation qu’il faut observer. Des internautes préfèrent regarder des lolcats et des memes sur la toile alors que d’autres, les « activistes », vont chercher à gagner la liberté de l’internet.</p>\n<p>Tout le monde s’accorde pour dire qu’internet évolue. Il ne faut pas oublier que nous sommes là pour l’accompagner et pour enseigner les bonnes méthodes aux générations futures ! En effet, sans l’action de certaines personnes, nous n’en serions pas là aujourd’hui. Les « geeks » sont devenus très influents tant culturellement que politiquement parlant…</p>\n<p>Cette première soirée projection-débat fut une réussite. Si ce n’était qu’un prototype, ce premier essai a bien fonctionné. Seulement, les prochaines sessions se feront à plus petite échelle afin d’éviter les dérives comme ce fut le cas lundi !</p>\n<p><img src=\"/images/blog/dsc0303121.webp\" alt=\"DSC030312\" loading=\"lazy\"></p>"
      legacy_cover: "/images/blog/couverture-article.webp"
      status: "published"
      published_at: "2013-05-23"
      categories: ["actualites"]
      legacy_path: "/internet-cet-outil-vital-au-quotidien-et-incompris/"
