  - key: "les-communautes-se-retrouvent-a-la-plage-digitale"
    fields:
      title: "Les communautés se retrouvent à La Plage Digitale"
      slug: "les-communautes-se-retrouvent-a-la-plage-digitale"
      excerpt: "Que vous soyez développeurs, devops, bidouilleurs… La Plage Digitale c’est the place to be pour faire votre veille et rencontrer les communautés et acteurs du…"
      body: "<p>Que vous soyez développeurs, devops, bidouilleurs… La Plage Digitale c’est <em>the place to be</em> pour faire votre veille et rencontrer les communautés et acteurs du numérique à Strasbourg. Voici une sélection non-exhaustive des groupes meetups à découvrir et qui organisent régulièrement leurs rencontres à La Plage !</p>\n<p>—————-</p>\n<p><img src=\"/images/blog/global-465069379.webp\" alt=\"global_465069379\" loading=\"lazy\"></p>\n<h3><strong><a href=\"https://www.meetup.com/DevOps-SXB/\" rel=\"noopener\">DevOps SXB</a></strong></h3>\n<p>Le groupe meetup DevOps SXB promouvoit l’apprentissage et le partage d’information autour de la culture Dev Ops, ses outils et bonnes pratiques !</p>\n<p>« Le <b>DevOps</b> est un mouvement visant à l’alignement de l’ensemble des équipes du système d’information sur un objectif commun, à commencer par les équipes de <i>dev</i> ou <i>dev engineers</i> chargées de faire évoluer le système d’information et les <i>ops</i> ou <i>ops engineers</i> responsables des infrastructures (exploitants, administrateurs système, réseau, bases de données,…). » (Wikipedia)</p>\n<p>Professionnels, hackers, managers et ingénieurs – qu’ils soient plus orientés développement ou système – composent ce groupe qui vient de se créer et qui va se réunir pour la première fois le 10 novembre. Vous pourrez y apprendre à gérer vos machines virtuelles (VM) et faire du load balancing de requêtes TCP !</p>\n<p>Prochaine rencontre : <a href=\"https://www.meetup.com/DevOps-SXB/events/243920846/\" rel=\"noopener\">Le vendredi 10 novembre à 19h à La Plage</a></p>\n<p>—————-</p>\n<p><img src=\"https://pbs.twimg.com/profile_images/905443224189317122/JGdQmMwg_400x400.jpg\" alt=\"\" loading=\"lazy\"></p>\n<h3><strong><a href=\"https://www.meetup.com/fr-FR/StrasbourgJS/\" rel=\"noopener\">StrasbourgJS</a></strong></h3>\n<p>Le groupe de <strong>développeurs JavaScript</strong>, débutants et expérimentés ! On y parle aussi bien du JS côté client que côté serveur.  Lisez l’interview de <a href=\"https://twitter.com/svensauleau\" rel=\"noopener\">Sven Sauleau</a> pour comprendre ce mouvement :</p>\n<p>« Je contribue activement à la communauté JavaScript (dans Babeljs notamment) et aux nouvelles fonctionnalités du language même. Je pense qu’il est important de partager un tel savoir auprès de la communauté locale de développeurs. Notre contexte technologique est très vaste et je dois admettre qu’il est parfois difficile de suivre. J’essaie de proposer une vue d’ensemble des technologies du marché ainsi qu’une veille constantes des nouveautés. Nos événements sont destinés à tous les niveaux et à tous ages. Je considère que c’est une chance pour les jeunes développeurs, je leur recommande vivement d’assister à nos événements. À noter que même si le sujet ne semble pas intéressant, il sera entouré de professionnels du milieu avec qui il peut librement échanger. De plus, je serais extrêmement content si cela lui permet d’accéder à sa première embauche. »</p>\n<p>Le prochain meetup du groupe Strasbourg JS a d’ailleurs une intervention plannifiée qui change des présentations habituelles de frameworks et outils du langage ! Stephanie Hertrich présentera l’association Duchess qui cherche valoriser et promouvoir les développeuses et femmes avec profils techniques. Sven explique la démarche : « Je suis concient que notre métier souffre du sexisme et autres maladresses envers les minorités. J’espère que notre prochaine soirée permettra d’échanger librement sur le sujet et de faire venir ces personnes. ». Il présentera également pendant ce meetup les nouveautés du langage JavaScript.</p>\n<p>Prochaine rencontre : <a href=\"https://www.meetup.com/StrasbourgJS/events/244425002/\" rel=\"noopener\">Le lundi 13 novembre à 19h à La Plage<br>\n</a>En savoir plus : <a href=\"https://twitter.com/Strasbourg_js\" rel=\"noopener\">Strasbourg JS sur Twitter</a>, <a href=\"https://www.youtube.com/playlist?list=PLyFRNlGSj8FgUaLxSrMF4qaabQ9Alpqvp\" rel=\"noopener\">les vidéos des meetups Strasbourg JS sur la chaîne YouTube Alsace Digitale</a></p>\n<p>—————-</p>\n<p><img src=\"/images/blog/elsassjug.webp\" alt=\"\" loading=\"lazy\"></p>\n<h3><strong><a href=\"https://www.meetup.com/fr-FR/ElsassJUG/\" rel=\"noopener\">Elsass JUG</a></strong></h3>\n<p>ElsassJUG, le <strong>Java User Group</strong> d’Alsace, s’intéresse bien sûr à Java et son très large écosystème, que ce soit la JVM, le tooling ou les autres langages tournant dessus.</p>\n<p>Toutefois, un bon développeur a besoin de connaître bien plus, et c’est surtout cela notre objectif : nous avons donc accueilli des speakers sur des sujets variés, par exemple JavaScript, Docker, Reactive Domain Driven Design ou TDD.</p>\n<p>Le groupe est ouvert aux autres horizons techniques, que ce soit avec des speakers nationaux ou, encore mieux, locaux. Une seule exigence : de la passion pour le bon code 🙂</p>\n<p>Prochaine rencontre : <a href=\"https://www.meetup.com/ElsassJUG/events/244517249/\" rel=\"noopener\">Le mercredi 22 novembre à 20h à La Plage</a> avec pour thématique les librairies Java qui changent la vie !<br>\nEn savoir plus : <a href=\"https://twitter.com/ElsassJUG\" rel=\"noopener\">Elsass JUG sur Twitter</a>, <a href=\"https://www.youtube.com/playlist?list=PLyFRNlGSj8Fi_fYTUL0lptMh_9t0cAzVv\" rel=\"noopener\">les vidéos des meetups Elsass JUG sur la chaîne YouTube Alsace Digitale</a></p>\n<p>—————-</p>\n<p><img src=\"https://pbs.twimg.com/profile_images/3375106417/58d971c7b33e165d44064f31f7ccc9a7_400x400.jpeg\" alt=\"\" loading=\"lazy\"></p>\n<h3><strong><a href=\"http://hacksxb.com\" rel=\"noopener\">HackSXB</a></strong></h3>\n<p>La communauté de<strong> développeurs et makers</strong> portée par Alsace Digitale. Fans de programmation et de <strong>bidouille</strong>, ils vous donnent rendez-vous tous les derniers vendredis du mois. C’est l’endroit idéal pour parler de ses projets, trouver des profils aux compétences variées (électronique, bricolage, développement…). L’objectif des soirées est toujours de produire et apprendre quelque chose, et surtout de partager son apprentissage avec les autres !</p>\n<p>Une ou deux fois par an, ces geeks et bidouilleurs travaillent ensemble pour concevoir un projet connecté collaboratif qui fait appel à tous types de compétences. C’est comme ça qu’a l’été 2014 ils ont par exemple projeté des jeux vidéos au laser sur la médiathèque Malraux ou plus récemment exposé un bac à sable en réalité augmentée pendant le festival EdgeFest.</p>\n<p>Prochaine rencontre : Le vendredi 1er décembre à 19h La Plage (meetup non annoncé, <a href=\"https://www.meetup.com/HackSXB/\" rel=\"noopener\">rejoignez le groupe meetup</a> pour être informé !)<br>\nEn savoir plus : <a href=\"http://hacksxb.com\" rel=\"noopener\">Le site du HackSXB</a>, <a href=\"http://join.hacksxb.com\" rel=\"noopener\">le groupe Facebook du HackSXB</a></p>\n<p>—————-</p>\n<p><img src=\"https://pbs.twimg.com/profile_images/923531215034044417/PrniYI_j_400x400.jpg\" alt=\"Golang Strasbourg\" loading=\"lazy\"></p>\n<h3><strong><a href=\"https://www.meetup.com/Go-SXB-Go/\" rel=\"noopener\">Go SXB, Go!</a></strong></h3>\n<p>C’est le groupe des strasbourgeois intéressés par le<strong> langage Go</strong> ! Il est ouvert aux curieux ou aux développeurs plus expérimentés.</p>\n<p>« Go est un langage de programmation compilé et concurrent inspiré de C et Pascal. Ce langage a été développé par Google à partir d’un concept initial de Robert Griesemer, Rob Pike et Ken Thompson.  » (Wikipedia)</p>\n<p>Utilisé en production chez Google, DotCloud (projet Docker), Heroku… Go peut être compilé pour Linux, Mac OS X, FreeBSD, OpenBSD, Plan 9 and MS Windows avec des architectures à processeurs i386, amd64 et ARM.</p>\n<p>Certains des meetups GO SXB, Go! sont organisés pour parler du langage en lui même et son actualité (nouvelles versions…) et d’autres autour de sujets plus spécifiques avec des retours d’expérience (frameworks, outils, bonnes pratiques…).</p>\n<p>Prochaine rencontre : Le 5 décembre à 19h à La Plage (meetup non annoncé, <a href=\"https://www.meetup.com/Go-SXB-Go/\" rel=\"noopener\">rejoignez le groupe meetup</a> pour être informé !)<br>\nEn savoir plus : <a href=\"https://twitter.com/GoSXBGo\" rel=\"noopener\">Golang Strasbourg sur Twitter</a></p>\n<p>—————-</p>\n<p><img src=\"/images/blog/ai-strasbourg.webp\" alt=\"ai_strasbourg\" loading=\"lazy\"></p>\n<h3><strong><a href=\"https://www.meetup.com/AI-Strasbourg/\" rel=\"noopener\">AI Strasbourg</a></strong></h3>\n<p>Théorique ou pratique. Réelle ou imaginée. Subie ou souhaitée. Philosophique ou technique. Discutons de ce thème fabuleux qu’est <strong>l’intelligence artificielle</strong> !</p>\n<p>L’idée de ces meetups est de faire réunir les strasbourgeois intéressés par le sujet et d’approfondir certains aspects ! En présence d’intervenants qualifiés, trouvez des réponses à vos questions et découvrez l’ensemble les outils et possibilités qu’apportent l’intelligence artificielle.</p>\n<p>Prochaine rencontre : Janvier 2018 (meetup non annoncé, <a href=\"https://www.meetup.com/AI-Strasbourg/\" rel=\"noopener\">rejoignez le groupe meetup</a> pour être informé !)</p>\n<p>—————-</p>\n<p>Alors, certaines de ces communautés vous intéressent ? Venez à leur prochain meetup !<br>\n<br>\nD’ailleurs, si vous aussi vous souhaitez organiser des rencontres thématiques, n’hésitez pas à en faire la demande à <a href=\"mailto:contact@alsacedigitale.org\">contact@alsacedigitale.org</a>. C’est gratuit, si vous organisez la rencontre en votre nom propre et sans but commercial (capacité de 50 personnes, possibilité d’avoir une captation vidéo de l’événement).</p>"
      legacy_cover: "/images/blog/dljpe9jx0aaudjk.webp"
      status: "published"
      published_at: "2017-11-08"
