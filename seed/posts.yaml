  - key: "code-ton-avenir-le-numerique-une-chance-pour-leducation"
    fields:
      title: "Code ton #Avenir : Le numérique, une chance pour l’éducation !"
      slug: "code-ton-avenir-le-numerique-une-chance-pour-leducation"
      excerpt: "Vivez pleinement l’ère du digital ! Rendez-vous le 17 Mars, de 10h à 17h, à l’ECAM à Strasbourg pour appréhender l’avenir à travers le spectre du numérique…"
      body: "<p><img src=\"/images/blog/cta-affiche.webp\" alt=\"\" loading=\"lazy\"><br>\nVivez pleinement l’ère du digital ! Rendez-vous <strong>le 17 Mars, de 10h à 17h, à l’ECAM</strong> à Strasbourg pour appréhender l’avenir à travers le spectre du numérique, dans le cadre du forum « Code ton #Avenir » co-organisé par l’APEL. A l’honneur cette année, l’importance du numérique et les nouvelles possibilités qui s’ouvrent à nous en termes d’éducation, aussi bien à l’école qu’à la maison.</p>\n<p><strong>Code ton #Avenir</strong>, c’est l’occasion de confronter les jeunes, filles et garçons, aux nouvelles technologies à travers des activités ludiques pensées comme une première approche de la révolution du numérique. Un programme riche et varié grâce à nos différents partenaires, qui éveillera les sens et participera à la prise de conscience des jeunes sur l’enjeu incontournable que représente le numérique aujourd’hui.</p>\n<p><strong>Code ton #Avenir</strong>, c’est aussi l’occasion d’attiser sa curiosité, découvrir, et s’émerveiller devant les possibilités qu’offre le digital en matière d’éducation et d’avenir professionnel. De quoi susciter l’envie d’acquérir de nouvelles connaissances, et ainsi participer à la lutte contre le décrochage scolaire.</p>\n<p>Entrée libre et gratuite !</p>\n<p>Inscription sur le <a href=\"http://www.helloasso.com/associations/apel-academique-d-alsace/evenements/code-ton-avenir\" rel=\"noopener\">site d’HelloAsso</a><br>\nPlus d’infos sur le <a href=\"http://www.apelalsace.org/\" rel=\"noopener\">site de l’APEL</a></p>"
      legacy_cover: "/images/blog/cta-affiche.webp"
      status: "published"
      published_at: "2018-03-07"
      categories: ["actualites"]
      legacy_path: "/code-ton-avenir-le-numerique-une-chance-pour-leducation/"
      created_at: "2018-03-07T12:55:38Z"
  - key: "strasbourg-startups-meetup-19-pitch-night"
    fields:
      title: "Strasbourg Startups : Pitch Night #2"
      slug: "strasbourg-startups-meetup-19-pitch-night"
      excerpt: "Rendez-vous le 19 avril pour la nouvelle Pitch Night, organisée par Alsace Digitale. Une soirée unique, pendant laquelle de nombreux entrepreneurs…"
      body: "<p><img src=\"/images/blog/pitch-night-1920.webp\" alt=\"\" loading=\"lazy\"></p>\n<p>Rendez-vous le 19 avril pour la nouvelle Pitch Night, organisée par Alsace Digitale. Une soirée unique, pendant laquelle de nombreux entrepreneurs strasbourgeois viendront pitcher leur projet pendant une dizaine de minutes, non seulement devant un jury d’investisseurs bienveillants, mais surtout devant vous ! Cela leur permettra de s’entraîner à un dur exercice de présentation et de persuasion à l’oral, pour adapter leur futur storytelling en fonction du feedback reçu ce soir.</p>\n<p>Pourquoi s’entraîner au pitch devant un public ? Eh bien pour lever des fonds, bien sûr ! C’est la base de toute aventure startup : réussir à convaincre un auditoire d’investisseurs, afin de leur faire croire en un projet. Une fois les fonds débloqués, on peut avancer d’un pas plus assuré. Cette Pitch Night leur offrira donc la chance de parfaire leur communication en bénéficiant de conseils avisés, avant de partir sur les routes de France et d’ailleurs pour réaliser leurs rêves !</p>\n<p>Les startups présentes :</p>\n<ul><li><strong><a href=\"https://scalingo.com/\" rel=\"noopener\">Scalingo</a> :</strong> Plateforme destinée aux développeurs, qui leur permet de suivre tout le cycle de développement de leurs applications sans avoir à se soucier de l’aspect gestion de serveurs et autres bases de données.</li><li><a href=\"https://www.vijump.com/\" rel=\"noopener\"><strong>ViJump</strong></a><strong> :</strong> Technologie innovante, qui permet la recherche et l’analyse de contenu audiovisuel, en réponse à l’énorme popularité de la vidéo comme outil de communication d’entreprise.</li><li><a href=\"https://transchain.io/fr/\" rel=\"noopener\"><strong>TransChain</strong></a><strong> :</strong> Technologie de sécurisation des données grâce à la technologie Blockchain, qui propose un connecteur digital permettant de fluidifier la communication entre les acteurs de la supply chain.</li><li><a href=\"https://teewii.fr/\" rel=\"noopener\"><strong>Teewii</strong></a><strong> :</strong> Agence innovante, qui propose de créer des campagnes de communication disruptives afin de rassembler et mobiliser les étudiants autour d’une marque ou d’une entreprise, le tout via le T-shirting.</li><li><strong><a href=\"https://www.messortiesce.fr/\" rel=\"noopener\">MesSortiesCE</a> :</strong> Site internet destiné aux élus de comités d’entreprise et aux prestataires de loisirs, et qui permet de les mettre en relation dans le cadre de l’organisation de manifestations sociales et culturelles de groupe.</li></ul>\n<p><strong>Jeudi 19 avril 2018</strong>, de 18h30 à 21h30<br>\n<strong>Le Shadok</strong>, 25 Presqu’île André Malraux – 67100 Strasbourg</p>\n<p>Entrée libre, sur inscription :<br>\n<a href=\"https://www.eventbrite.fr/e/billets-pitch-night-2018-44523007514\" rel=\"noopener\">https://www.eventbrite.fr/e/billets-pitch-night-2018-44523007514</a></p>"
      legacy_cover: "/images/blog/pitch-night-1920.webp"
      status: "published"
      published_at: "2018-03-27"
      categories: ["actualites"]
      legacy_path: "/strasbourg-startups-meetup-19-pitch-night/"
      created_at: "2018-03-27T10:05:52Z"
  - key: "be-a-boss-2018"
    fields:
      title: "Be a Boss 2018"
      slug: "be-a-boss-2018"
      excerpt: "Be a Boss Awards 2018 Dans l’écosystème de la startup française, les femmes sont malheureusement encore sous-représentées, puisque seulement 15 à 20% des…"
      body: "<p><img src=\"/images/blog/be-a-boss-awards-strasbourg.webp\" alt=\"\" loading=\"lazy\"></p>\n<p><strong>Be a Boss Awards 2018</strong></p>\n<p>Dans l’écosystème de la startup française, les femmes sont malheureusement encore sous-représentées, puisque seulement <b>15 à 20% des startups ont été créées par des femmes en 2017</b> (d’après le site <a href=\"http://www.entreprendre.fr/\" rel=\"noopener\">entreprendre.fr</a>). C’est ce rapide constat qui a inspiré le concept Be a Boss, un forum français 100% féminin. Depuis sa création en 2015, Be a Boss est tout naturellement devenu LA référence des entrepreneuses.</p>\n<p>Be a Boss, c’est un événement à l’échelle nationale, avec <b>5 étapes régionales durant l’année</b> (à Bordeaux, Lyon, Toulouse, Marseille et bien entendu Strasbourg) et une grande finale qui aura lieu à Paris, le jeudi 20 septembre 2018, pour récompenser les lauréates. <strong>Alsace Digitale</strong> et <strong>Epitech</strong> s’associent à Be a Boss cette année, pour valoriser toutes les startups, issues du milieu de la tech ou non.</p>\n<p>Le 7 juin aura lieu l’étape strasbourgeoise. Au programme de cette journée : plusieurs keynotes informatives, des pauses networking, du pitch de projet, des tables rondes… Le tout conduisant à <b>l’annonce des deux gagnantes</b> qui auront la chance de faire partie des 12 finalistes à Paris.</p>\n<p>Le forum Be a Boss a <b>trois objectifs</b> :</p>\n<ul><li>Booster l’ambition entrepreneuriale chez les femmes</li><li>Identifier les futures pépites régionales et nationales</li><li>Récompenser et accompagner des startups innovantes et prometteuses</li></ul>\n<p>En 2017, le Be a Boss Tour a permis à plus de <b>800 porteuses de projet et startuppeuses</b> d’assister au forum dans leur région, voire de présenter leur projet pour participer au concours Be a Boss Awards.</p>\n<p>Elles ont osé, pourquoi pas vous ? N’hésitez plus : devenez la Boss. Vous avez jusqu’au <b>23 mai au plus tard</b> pour candidater : <a href=\"http://strasbourg.be-a-boss.com/Inscription\" rel=\"noopener\"><b>http://strasbourg.be-a-boss.com/Inscription</b></a></p>"
      legacy_cover: "/images/blog/be-a-boss-awards-strasbourg.webp"
      status: "published"
      published_at: "2018-04-09"
      categories: ["actualites", "evenements"]
