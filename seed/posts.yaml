  - key: "un-ete-a-la-plage-digitale"
    fields:
      title: "Un été à la Plage… Digitale"
      slug: "un-ete-a-la-plage-digitale"
      excerpt: "Juillet s’en va déjà, Août installe ses quartiers sur la ville qui tourne au ralenti. A la Plage Digitale rien n’a vraiment changé sauf que nous profitons que…"
      body: "<p>Juillet s’en va déjà, Août installe ses quartiers sur la ville qui tourne au ralenti. A la Plage Digitale rien n’a vraiment changé sauf que nous profitons que la climatisation marche pour faire un pied de nez à certaines des plus chaudes journées, bien peu nombreuses il faut l’avouer. Le beau temps est parti en vacances, il semble parfois revenir mais il est trop vite chassé par la pluie et l’orage. Dommage pour ceux qui pourraient en profiter.</p>\n<p>Mais il n’est pas dans mon intention de vous assommer avec un bulletin météo médiocre. Au contraire je vous propose un petit bilan estival sur nos activités, nos réflexions, avec un petit zeste personnel pour égayer un peu le propos.</p>\n<p>Tout d’abord je dois dire que le mois de Juillet a été incroyablement chargé, beaucoup de contacts et de rencontres. Beaucoup plus en tout cas que ce à quoi je m’attendais dans une période de « grandes vacances ». Nous avons eu le plaisir d’accueillir dans nos locaux une ribambelle de gens qui se sont succédés pour échanger avec nous ou nous présenter des choses intéressantes, notamment Vendredi dernier avec la projection photos de Julien Gérard dont vous pouvez lire le compte rendu plus bas.</p>\n<p>Christelle est venu s’échouer à la Plage pour quelques mois et s’occupera de me filer un coup de main pour la communication et l’organisation événementielle. Bon j’avoue c’est pas gagné vu que j’ai tendance à partir un peu dans tous les sens et qu’il est souvent difficile de me suivre. Néanmoins elle fait des efforts et je ne doute pas qu’ils soient couronnés de succès d’ici à la fin de son stage. Elle a déjà réussi à produire un post de blog, et même si j’avoue que je n’ai pas tout compris, la faute sûrement à mon esprit trop cartésien,  certains d’entre vous ont pu apprécier son style particulier. Il faut juste qu’elle arrive à faire des phrases qui veulent dire quelque chose maintenant, et surtout que j’arrête d’être médisant…</p>\n<p>Je prépare une rentrée particulière, avec un programme suffisamment chargé pour que je puisse demander quelques bonnes nuits de sommeil et de calme dans ma lettre au Père Noël. Au programme beaucoup de collaboration avec nos amis de la Médiathèque, je salue au passage les gentilles personnes de la Médiathèque d’Illkirch qui sont passés nous rendre visite, avec des mots clefs comme « podcast » « conférence game design » « esport » qui devraient peut-être mettre l’eau à la bouche de certains. Le Conservatoire devrait aussi être à l’honneur avec un événementiel qui devrait courir jusqu’en 2013 au minimum et que nous préparons actuellement. Et surtout début Octobre nous co-organisons un Social Good Day avec le Centre de Culture Numérique de l’Université de Strasbourg et SFR.</p>\n<p>Mais j’en oublie un tas d’autres, la liste serait bien trop longue à dresser ici. Nous ferons sûrement appel à toutes les bonnes volontés qui désirent participer à nos activités et partagent nos valeurs. Car ce n’est pas « notre » événementiel à nous tout seul, nous n’irions pas bien loin et cela serait sûrement assez inutile et inconsistant, mais plutôt « Notre » à tous ceux qui souhaitent s’y associer dans un respect mutuel de chacun et une logique d’ouverture et de partage.</p>\n<p>C’est donc peut-être un peu le vôtre, à bientôt !</p>"
      legacy_cover: "/images/blog/mer-copy.webp"
      status: "published"
      published_at: "2012-08-03"
      categories: ["actualites"]
      legacy_path: "/un-ete-a-la-plage-digitale/"
      created_at: "2012-08-03T12:53:31Z"
  - key: "barcamp-hack-the-culture"
    fields:
      title: "BarCamp Hack The Culture"
      slug: "barcamp-hack-the-culture"
      excerpt: "« Arts et entreprises numériques, outils/projets/lieux/créativité » Une journée de passerelles, croisements et transferts entre artistes, programmateurs…"
      body: "<p>« Arts et entreprises numériques, outils/projets/lieux/créativité »<br>\nUne journée de passerelles, croisements et transferts entre artistes, programmateurs, hackers, créateurs, entrepreneurs, issus des cultures numériques, des trois côtés du Rhin en France, en Suisse et en Allemagne.</p>\n<p>Venez partager vos réalisations, vos recherches et vos rêves, et surtout croiser et échanger les diverses approches des nouveaux outils.</p>\n<p>Hack The Culture est un BarCamp proposé par Audiorama et La Plage.</p>\n<p>Vous voulez participer ? Enregistrez vous maintenant !</p>\n<p>Qu’est-ce qu’un BarCamp ? C’est une non conférence, un atelier ouvert et participatif dont le contenu est proposé et partagé par tous les participants. Tous le monde est invité à présenter un projet, une idée ou une réalisation… Le principe qui régit l’open forum comme tous les Barcamps est « pas de spectateurs, que des participants ».</p>\n<p>A la fin de la journée une synthèse de chacun des groupes de travail sera donnée à l’ensemble des participants.</p>\n<p>Hack The Culture 2 aura lieu le dimanche 10 Mars 2013 à La Plage Digitale – 15 route du Rhin 67100 Strasbourg.</p>\n<p>Cet événement ainsi que l’ensemble du projet Oeil et Oreille est entièrement gratuit.</p>\n<p>Plus d’infos et inscription ici.<br>\nProgramme<br>\n9h00    Petit déjeuner de bienvenue autour de croissants et café chaud 🙂<br>\n9h30    Chacun se présente par 3 tags<br>\n10h00    Sessions du matin<br>\n13h00    Pause déjeûner<br>\n14h00    Sessions de l’après midi<br>\n16h30    Fin de session / Brainstorming et synthèse<br>\n17h00    Compte rendu de la journée</p>"
      legacy_cover: ""
      status: "published"
      published_at: "2013-02-25"
      categories: ["evenements"]
      legacy_path: "/barcamp-hack-the-culture/"
      created_at: "2013-02-25T09:50:38Z"
  - key: "un-an-apres-il-fait-toujours-grand-soleil-a-la-plage"
    fields:
      title: "Un an après, il fait toujours grand soleil à la Plage !"
      slug: "un-an-apres-il-fait-toujours-grand-soleil-a-la-plage"
      excerpt: "On ne le dira jamais assez, le temps passe trop vite. Un an déjà que la Plage Digitale, premier espace de coworking strasbourgeois, existe. Une année chargée…"
      body: "<p>On ne le dira jamais assez, le temps passe trop vite. Un an déjà que la Plage Digitale, premier espace de coworking strasbourgeois, existe. Une année chargée qui a permis d’apporter de la maturité dans certains projets de nos coworkers et de tisser des liens entre chacun.  Les uns restent, les autres repartent, certains débarquent : c’est tout un mode de vie, toute une philosophie.</p>\n<p>Le 23 avril 2012, l’inauguration de notre espace collaboratif marquait le début d’une nouvelle aventure.  Lancée par Alsace Digitale, notre chère Plage a vu son paysage changer au cours du temps. Entrepreneurs, designers, graphistes et artistes ont trouvé refuge dans les locaux actuels. Que leur a apporté cette expérience ?</p>\n<blockquote><p><strong>Stéphane Becker, Président d’Alsace Digitale :</strong><br>\n« Depuis sa création, je trouve que la Plage Digitale a été acceptée dans le paysage local. J’ai croisé plusieurs personnes qui ont trouvé que cet espace était super : c’est encourageant !  Evidemment, tout ça demande beaucoup de travail et d’investissement personnel. Aujourd’hui, on voit les aspects positifs, les synergies entre les coworkers. A vrai dire, la Plage n’est qu’une pièce du puzzle, elle permet la création de nouvelles entreprises. »</p><p><strong>StEphan d’Intuitive :</strong><br>\nLa Plage nous apporte le confort qu’on n’avait pas avant.  L’espace permet de partager avec les gens : j’ai pu travailler sur des projets qui n’avaient pas vraiment de rapports avec ce que je faisais habituellement. Mais ça m’a permis de récupérer des compétences. Les deux aspects positifs restent l’échange entre tous les coworkers et le côté financier !</p><p><strong>Jérome de Base 8</strong> :<br>\nEn un an, la Plage a beaucoup changé. Au début, je craignais qu’en se remplissant, la vie ici soit plus difficile à vivre. En fait, non. Mes craintes n’étaient pas fondées. Pour moi, la Plage Digitale reste un endroit de travail mais l’intérêt est qu’on crée des liens avec des personnes vivant dans les mêmes conditions que nous. Evidemment, je peux travailler chez moi mais je n’aurais pas ce réseau.  C’est une chance d’être ici car c’est tout à fait ce qu’il me fallait.</p></blockquote>\n<p><img src=\"/images/blog/photo32.webp\" alt=\"\" loading=\"lazy\"></p>\n<p><strong>Que nous réserve la suite ?</strong></p>\n<p>Notre objectif, comme le note si bien Stéphane Becker, est « d’étendre des dispositifs et des évènements autour de la Plage ».  Il faut dire que la Plage Digitale est victime de son succès. Les places sont convoitées, c’est pour cela que notre espace doit s’agrandir. Dès 2014, un déménagement se fera dans le nouveau bâtiment Seegmuller. L’espace commun –plus grand- sera propice à de nouveaux échanges avec les coworkers.</p>\n<p>Un an que la Plage existe grâce à vous tous. Pour vous remercier, on se devait bien de vous réserver une petite surprise ! On vous a préparé une infographie pour présenter la Plage Digitale, après un an d’existence :</p>\n<p><img src=\"/images/blog/infographie-1.webp\" alt=\"Infographie un an la Plage Digitale, Strasbourg\" loading=\"lazy\"></p>"
      legacy_cover: "/images/blog/couv2.webp"
      status: "published"
      published_at: "2013-04-24"
      categories: ["actualites"]
      legacy_path: "/un-an-apres-il-fait-toujours-grand-soleil-a-la-plage/"
      created_at: "2013-04-24T12:48:50Z"
  - key: "une-soiree-pour-coder"
    fields:
      title: "Une soirée pour coder"
      slug: "une-soiree-pour-coder"
      excerpt: "Toujours à la pointe de la technologie, la Plage Digitale accueillait, le jeudi 25 avril, la soirée « Développer dans le Google Cloud » avec Aurélien…"
      body: "<p>Toujours à la pointe de la technologie, la Plage Digitale accueillait, le jeudi 25 avril, la soirée « Développer dans le Google Cloud » avec Aurélien Pelletier, directeur technique de SFEIR Paris. Ce dernier nous parla de cloud computing, et plus particulièrement du Google Cloud. Organisée par Elsass JUG, cette soirée a réuni une quarantaine de personnes pour deux heures de conférence. Ce fut l’occasion de manipuler en live-coding le Google Apps Scipt, le Google Apps Engine et le Google Compute Engine.</p>\n<p><img src=\"/images/blog/01-201304.webp\" alt=\"conférence développer sur Google Cloud par Aurélien Pelletier à la Plage Digitale, Strasbourg\" loading=\"lazy\"><em>L’évènement a attiré une quarantaine de personnes.</em></p>\n<p><img src=\"/images/blog/02-201304.webp\" alt=\"conférence développer sur Google Cloud par Aurélien Pelletier à la Plage Digitale, Strasbourg\" loading=\"lazy\"></p>\n<p><em>Petit sondage sur les utilisateurs des différentes versions de JAVA.</em></p>\n<p>Le but d’Aurélien Pelletier était de démontrer l’efficacité du Google Cloud pour les développeurs. Ce service permet de créer des applications (avec Google Apps Script), de rooter sur des instances Google (avec Google Compute Engine) et d’automatiser de tâches bureautiques avec Google App Script au lieu de Java. Si les avis sont partagés sur l’arrivée du Java 8  et Java Enterprise Edition 8, l’absence de cloud sur les versions actuelles est un problème. « Le cloud, le HTML5 et le mobile : tout ça, il faut le maîtriser, c’est le futur » martèle l’intervenant. Le cloud est un réel atout dans les entreprises (et même en dehors), une force dont se sont emparés Amazon, Facebook, Google ou encore Apple. Reste que peu de firmes utilisent des outils plus poussés : « Si [elles] utilisent de plus en plus le cloud, avec dropbox notamment, seule une entreprise du CAC 40 utilise Google Apps ».</p>\n<p><img src=\"/images/blog/05-201304.webp\" alt=\"conférence développer sur Google Cloud par Aurélien Pelletier à la Plage Digitale, Strasbourg\" loading=\"lazy\"><em>Le cloud n’est pas seulement utile pour </em><em>les </em><em>particuliers mais aussi pour les entreprises.</em></p>\n<p>Après avoir fait l’état des lieux, Aurélien passe aux démonstrations. Il pose une situation quelconque. Vous mettez en ligne un formulaire que remplira un internaute lambda. À la suite de cette inscription, un mail automatique doit être envoyé en même temps à l’internaute et à la secrétaire, qui souhaite avoir un fichier PDF joint. « Combien de temps mettrez-vous pour coder tout ça ? », demande Aurélien. Alors qu’une personne répond « moins d’une journée », l’intervenant commence son live-coding…</p>\n<p><img src=\"/images/blog/07-201304.webp\" alt=\"conférence développer sur Google Cloud par Aurélien Pelletier à la Plage Digitale, Strasbourg\" loading=\"lazy\"><em>Et c’est parti pour le live-coding !</em></p>\n<p>Le moins que l’on puisse dire est qu’Aurélien a réussi son pari ! Google Apps Script est très pratique, notamment avec une interface intuitive, similaire à celle de Google Drive. Certaines méthodes sont simplifiées comme le montre Aurélien : « vous voyez, j’ai généré un PDF avec une seule ligne de code ». Ce que les développeurs auraient fait en – reprenons l’opinion du public – « moins d’une journée », Aurélien l’a fait en 35 minutes ! Un gain de temps grâce à « une plateforme mature avec beaucoup d’applications ». Le point négatif de ce système consiste en l’impossibilité de budgétiser son utilisation car tout varie selon vos besoins (quotas, utilisation temporaire d’une application,…).<br>\nIl ne vous reste plus qu’à essayer, apprécier et adopter !</p>\n<blockquote><p>Aurélien Pelletier – @toutantic<br>\nDirecteur technique de SFEIR Paris depuis 2012, diplômé de l’IAE de Paris et d’un master en réseaux et telecom il a fait une partie de ses études aux Etats-Unis. Aurélien a commencé sa carrière de développeur chez un éditeur de logiciel de CRM. En 2002 il intègre la SSII IMPROVE en qualité de chef de projet technique. En 2004, il rejoint le pôle architecture d’ATOS, puis la cellule innovation en 2007 et l’Open Source Center d’ATOS en 2009. En 2010, il rejoint la société Altavia, leader européen de la communication commerciale dans le secteur “print”, en qualité de Directeur Technique.</p></blockquote>"
      legacy_cover: "/images/blog/google-cloud.webp"
      status: "published"
      published_at: "2013-04-29"
      categories: ["actualites"]
      legacy_path: "/une-soiree-pour-coder/"
      created_at: "2013-04-29T15:25:30Z"
  - key: "devoxx-4-kids-2"
    fields:
      title: "Devoxx 4 Kids : coder est un jeu d’enfants"
      slug: "devoxx-4-kids-2"
      excerpt: "Pour cette première édition de Devoxx 4 Kids, nous vous proposons à tous les enfants d’apprendre les rudiments de la programmation. Rendez-vous le 22 juin…"
      body: "<p>Pour cette première édition de Devoxx 4 Kids, nous vous proposons à tous les enfants d’apprendre les rudiments de la programmation. Rendez-vous le 22 juin prochain, de 14h à 18h, à la Médiathèque André Malraux !</p>\n<p>Déroulement d’évènement :<br>\n– présentation de l’outil Scratch<br>\n– presentation de Lego MindStorm par le club de robotique de l’Epitech<br>\n– composition des binômes<br>\n– atelier codage<br>\n– pause gouter<br>\n– atelier codage<br>\n– présentation des résultats<br>\n– distribution de cadeaux et remise des diplômes</p>\n<p>L’évènement sera animé par Audrey Neveu et Sébastien Letélié accompagnés de plusieurs développeurs de l’association ElsassJUG et d’Alsace Digitale.<br>\nInscriptions obligatoires. Pour plus d’informations, consultez l’affiche :  <img src=\"http://medias.fer-ge.ch/FERGE/img/iconePDF.png\" alt=\"\" loading=\"lazy\"></p>\n<p><img src=\"/images/blog/devoxx4kids.webp\" alt=\"Affiche de l&#x27;évènement Devoxx 4 Kids par Alsace Digitale\" loading=\"lazy\"></p>"
      legacy_cover: ""
      status: "published"
      published_at: "2013-05-06"
