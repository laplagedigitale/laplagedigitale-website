      slug: "startup-stories-edgefest-2016"
      excerpt: "Date : Mercredi 6 juillet de 19h à 22h Lieu : UGC Événement gratuit sur inscription. Participer ici! La soirée Startup Stories propose au grand public une…"
      body: "<p><strong>Date </strong>: Mercredi 6 juillet de 19h à 22h</p>\n<p><strong>Lieu</strong> : UGC</p>\n<p><strong>Événement gratuit sur inscription. <a href=\"https://www.eventbrite.fr/e/billets-startup-stories-3-25901311520\" rel=\"noopener\">Participer ici</a><a href=\"https://www.eventbrite.fr/e/billets-startup-stories-3-25901311520\" rel=\"noopener\">!</a></strong></p>\n<p>La soirée Startup Stories propose au grand public une sélection d’histoires de startups. Leur univers impitoyable, leurs défis passionnants, leurs rêves irréalistes n’auront plus de secret. Une fois, ils se sont lancés suivant leur idée… Lors de cette animation, étudiants, jeunes entrepreneurs et tout public seront invités à échanger et à confronter leurs réalités.</p>\n<p>  Une visite groupée de la <a href=\"http://www.edgefest.fr/materiauteque.html\" rel=\"noopener\">matériauthèque</a>, au Shadok, aura lieu avant l’événement Startup Stories le 6 juillet de 18h à 19h. <a href=\"https://www.eventbrite.fr/e/billets-materiautheque-26051300140\" rel=\"noopener\">Inscription ici</a>.</p>"
      legacy_cover: "/images/blog/startupstories2.webp"
