  - key: "le-hacksxb-se-met-aux-cours-en-ligne-2"
    fields:
      title: "Le HackSXB se met aux cours en ligne !"
      slug: "le-hacksxb-se-met-aux-cours-en-ligne-2"
      excerpt: "Du 23 février au 7 avril, le HackSXB, communauté strasbourgeoise des bidouilleurs, makers et développeurs se joint au mouvement lancé par l’école de l’image…"
      body: "<p><strong>Du 23 février au 7 avril, le HackSXB, communauté strasbourgeoise des bidouilleurs, makers et développeurs se joint au mouvement lancé par l’école de l’image Gobelins qui met en place un MOOC (Massive Open Online Course) sur l’Art-Duino.</strong></p>\n<p>La prestigieuse <a href=\"http://www.gobelins.fr/\" rel=\"noopener\"><strong>École de l’image Gobelins</strong></a> propose un cours intitulé <a href=\"https://www.fun-mooc.fr/courses/gobelins/83002/session01/about\" rel=\"noopener\"><strong>« Art-duino : fabriquer des objets connectés créatifs »</strong></a>, qui s’étalera sur la période du 23 février au 7 avril. Le but de cette formation est de vous faire acquérir les bases de l’informatique et de l’Arduino pour connecter un objet, afin de réaliser vous même des objets « <strong>papertoys</strong> » connectés telle une station météo. La technologie Arduino (ou Genuino) repose sur des cartes matériellement libre (open-source) sur lesquelles se trouvent un microcontrôleur qui remplit les fonctions de bases d’un ordinateur. Ces cartes sont alors personnalisable et programmable de manière à effectuer des fonctions diverses, notamment en domotique.</p>\n<h3><strong>Le HackSXB vous accompagne dans le projet !</strong></h3>\n<p>Ce cours vous intéresse mais vous avez peur de vous lancer ou ne pouvez pas acquérir une carte Arduino et le matériel nécessaire à la réalisation des objets connectés ? Pas de problème !<strong> <a href=\"http://www.hacksxb.com/\" rel=\"noopener\">La communauté HackSXB</a></strong> vous invite à la rejoindre pour apprendre, imaginer et créer ensemble dans une ambiance conviviale et collaborative.</p>\n<p>En effet, <strong>Alsace Digitale et ses HackSXB</strong> proposent de créer un groupe local pour suivre ensemble ce MOOC Art-Duino, et peut vous fournir tout le matériel nécessaire si vous besoin est. <strong>En rejoignant ce mouvement, vous pourrez échanger via le groupe Facebook et vous retrouvez à 3 reprises pour faire le point en présence de coachs compétents dans le domaine.</strong></p>\n<h4><strong>Les dates de ces 3 réunions collaboratives :</strong></h4>\n<p><strong>Jeudi 2 mars</strong></p>\n<p><strong>Jeudi 16 mars</strong></p>\n<p><strong>Vendredi 31 mars</strong></p>\n<p><strong>A la Plage Rivetoile 15 avenue du Rhin</strong></p>\n<p>Et pour en savoir plus, le <strong>HackSXB #48 qui a lieu le 24 février à 19h à la plage Rivetoile </strong>sera en partie consacré à ce projet, pensez à vous inscrire gratuitement <a href=\"https://www.helloasso.com/associations/alsace-digitale/evenements/hacksxb-48-let-s-get-creative\" rel=\"noopener\"><strong>ICI</strong></a>. Le HackSXB est en partenariat avec <a href=\"http://www.cables-piles-accus-electronique.fr\" rel=\"noopener\"><strong>Bric Electronic</strong></a> : des cartes de réduction de 10% seront distribuées pour les participants qui seront présents le 24 février.</p>\n<h3><strong>Qu’est ce qu’un MOOC ?</strong></h3>\n<p>Un MOOC est donc une <strong>formation en ligne ouverte à tous.</strong> Une tendance en fort développement permmettant à chacun de s’initier ou progresser dans un domaine particulier, en suivant des cours à distance via internet. <a href=\"https://www.fun-mooc.fr/\" rel=\"noopener\"><strong>France Université Numérique (FUN)</strong></a> propose plus d’une centaine de MOOC divers et variés, proposés par des établissements scolaires sur son site internet, où chacun peut  trouver accès à ces savoirs et compétences. Service complet, chaque cours est planifié sur une période précise, propose une bibliographie et propose une évaluation avec une certification payante mais valorisante.</p>\n<p>Suivez le HackSXB sur <a href=\"http://join.hacksxb.com\" rel=\"noopener\"><strong>Facebook</strong> </a>pour toutes les infos à venir !</p>\n<p>Et si vous voulez plus d’infos sur le MOOC « Art-duino : fabriquer des objets connectés créatifs » c’est par <a href=\"https://www.fun-mooc.fr/courses/gobelins/83002/session01/about\" rel=\"noopener\"><strong>ICI</strong></a>.</p>\n<p>Mais aussi sur la technologie <a href=\"https://www.arduino.cc/\" rel=\"noopener\"><strong>Arduino</strong> </a>et sur l’<strong><a href=\"http://www.gobelins.fr/\" rel=\"noopener\">École de l’image Gobelins.</a></strong></p>"
      legacy_cover: "/images/blog/arduino-projects-670x335-2.webp"
      status: "published"
