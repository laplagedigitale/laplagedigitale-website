  - key: "meetup-devenir-entrepreneure"
    fields:
      title: "Meetup : Devenir Entrepreneure !"
      slug: "meetup-devenir-entrepreneure"
      excerpt: "Pour ce meetup, la femme est à l’honneur et pour cause, veille du premier Hackathon Femmes & Entrepreneuriat à Strasbourg, trois intervenantes viendront…"
      body: "<p>Pour ce meetup, la femme est à l’honneur et pour cause, veille du premier <a href=\"https://www.facebook.com/events/358497751398803/\" rel=\"noopener\">Hackathon Femmes &amp; Entrepreneuriat</a> à Strasbourg, trois intervenantes viendront échanger avec l’écosystème strasbourgeois à propos du sujet :</p>\n<p><strong>                                                                                Devenir entrepreneurE !</strong></p>\n<p>Un sujet qui agace ou qui passionne. … Effectivement pourquoi développer des programmes spécifiquement féminins? Serions nous moins compétentes? Moins compétitives? Moins agiles? <br>\nBref, moins que moins que moins … Non bien-sûr ! <br>\nPourtant ces initiatives, tout en mettant en avant des réussites inspirantes de personnalités féminines exceptionnelles, pointent également nos différences et force est de constater que seules 10% de femmes sont à la tête d’une startup (ou entreprise nouvelle génération?). Quelle est la réalité ? Quel est le dernier cap à passer pour plus de mixité et de diversité ? Place à nos trois intervenantes pour nous donner leur point de vue.</p>\n<p><strong>Jessica Angeli</strong> – <i>Prisma Media</i></p>\n<p>Après plus de 10 ans d’expérience en Marketing, sur des problématiques d’innovation produits et de développement business à l’international, Jessica booste son potentiel en renforçant ses compétences numériques. Après un MBA en E-Business et E-Marketing, elle intègre Prisma Media où elle est aujourd’hui responsable des Opérations du Lab Innovation. Intrapreneure, elle développe elle-même un projet innovant, <a href=\"https://www.bloomher.fr/\" rel=\"noopener\">BLOOMHER</a> un accélérateur de carrière au féminin dont un des buts est de former les femmes au digital grâce au micro-learning.</p>\n<p><strong>Séverine Sigrist</strong> – <a href=\"https://www.defymed.com/\" rel=\"noopener\"><i>Defymed</i></a></p>\n<p>Séverine Sigrist, docteur en science, a fondé Defymed en 2011 après six ans passés au sein du Centre européen d’étude du Diabète (CeeD). Elle travaille sur la création d’un pancréas bioartificiel permettant de restaurer la sécrétion d’insuline nécessaire à la régulation de la glycémie. En 2014, elle reçoit le Prix Irène-Joliot-Curie dans la catégorie Parcours Femme entreprise pour l’ensemble de son activité à la recherche scientifique et technique au CeeD. Rare femme entrepeneure de ce secteur scientifique, Séverine Sigrist estime que ce n’est pas le milieu qui empêche les femmes de monter leur société mais plutôt elles-mêmes qui hésitent avant de se décider.</p>\n<p><strong>Carole Chapin</strong> – <i>Adoc Mètis</i></p>\n<p>Carole CHAPIN est docteure en littérature comparée, formatrice et de responsable des projets de recherche sur les carrières des chercheur·e·s. Auparavant, Carole Chapin a été chargée de mission « Culture et société » à l’université de Picardie (relais des affaires culturelles et de la mission égalité F/H sur le campus de l’IUT de l’Oise) et coordinatrice du groupe de travail « Gender equality » au sein de l’association Eurodoc (Association européenne des chercheur·e·s en début de carrière). Dans le cadre de ses activités pour Adoc Mètis, Carole Chapin a placé l’axe de l’égalité professionnelle F/H ( en particulier dans la fonction publique) au coeur de ses recherches et interventions. Elle accompagne les structures dans la mise en place de leurs stratégie d’égalité – diversité, et y forme les personnels de tous niveaux.<br>\n<a href=\"https://l.facebook.com/l.php?u=http%3A%2F%2Fwww.adoc-metis.com%2Fcabinet-conseil-ressources-humaines%2Fcarole-chapin-chercheuse-consultante%2F%3Ffbclid%3DIwAR0ZffHQgTNJRziLa6LxFiU4teb4JBkam6S9a7ogUczTFl7t_jxF93soY4A&amp;h=AT1bSmwzMbey9FU4HbRavyLncBvH92hkex8rqwiHrXGSI9u4_wPwVhqqk9774Cj8Qv9nVhqzdTrEQitCu4HTVMnQyIhWl7ZfAvN4duk8ZBD3ruqwOm-sah-ThRnQpvR2oQ\" rel=\"noopener\">http://www.adoc-metis.com/cabinet-conseil-ressources-humaines/carole-chapin-chercheuse-consultante/</a></p>\n<p><strong>Pour s’inscrire, cliquer </strong><strong><a href=\"https://www.eventbrite.fr/e/billets-meetup-devenir-entrepreneure-54579697344\" rel=\"noopener\">ici</a><br>\nLien facebook : <a href=\"https://www.facebook.com/events/2280194541999937/\" rel=\"noopener\">ici</a></strong><br>\n<strong>On vous donne rendez-vous le jeudi 31 janvier à 18h30 au rez de chaussée du Shadok !</strong></p>\n<p>Comme lors de chaque meetup, nous finirons par une séance de questions – réponses suivie d’un moment de networking autour d’un buffet. Entrepreneurs, startupers ou curieux, n’hésitez pas à venir échanger !</p>"
