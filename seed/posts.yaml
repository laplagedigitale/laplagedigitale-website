  - key: "novembre-2023"
    fields:
      title: "Novembre 2023 🗓"
      slug: "novembre-2023"
      excerpt: "S’il tonne en novembre, l’année suivante sera bonne ⚡️"
      body: "<p><strong>S’il tonne en novembre, l’année suivante sera bonne ⚡️</strong></p>\n<p><strong>Découvrez l’agenda du mois de novembre de la Plage Digitale</strong></p>\n<figure><img src=\"/images/blog/format-newsletter-40.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Atelier Software Crafters Strasbourg – 04/11/2023 – 9h00-18h30</strong></p>\n<p><strong>The Global Day of Code Retreat</strong></p>\n<p>Le Global Day of Code Retreat est un événement international d’une journée permettant de pratiquer le développement « dans les règles de l’art », sans être pressé par des contraintes de temps et d’argent</p>\n<p>Une code retreat permet d’apprendre et d’approfondir les fondamentaux de design et du développement logiciel en poussant les participant·e·s en dehors du confort de leurs habitudes.</p>\n<p>La session est accessible pour les développeurs et développeuses débutant·e·s comme chevronné·e·s !</p>\n<p>Au programme ⤵️</p>\n<p>▹ La journée se déroule en 6 séances de 40 minutes chacune portant sur le même sujet. Chaque session se déroule en pair et permet d’explorer de nouvelles contraintes.</p>\n<p>▹ Les participant·e·s sont convié·e·s à venir avec leur ordinateur et/ou un ensemble clavier/souris USB pour permettre le travail en pair, en minimisant le partage par les binômes d’un même équipement.</p>\n<p>⚠️ Un environnement de travail doté d’un framework d’exécution de tests doit être installé avant la tenue de l’événement.</p>\n<p> Nous prevoyons un repas végé friendly pour la pause de midi. Contactez-nous en cas d’allergies ou de régimes particuliers. Nous vous invitons à vous inscrire si vous êtes certain•e de pouvoir venir. Nous voulons éviter des désistements de dernière minute pour pouvoir anticiper les repas au mieux.</p>\n<p><a href=\"https://www.meetup.com/fr-FR/software-crafters-strasbourg/events/296513856/?_xtd=gqFyqTIwMDc2NTE0OKFwo2FwaQ%253D%253D&amp;from=ref\" rel=\"noopener\">Participer à l’événement</a></p>\n<figure><img src=\"/images/blog/format-newsletter-45.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Achen’ight – 10/11/2023 – À partir de 19h00</strong></p>\n<p><strong>Le rendez-vous de novembre est fixé pour Achencraft ! </strong>‍</p>\n<p>Si vous avez envie de discuter du projet Achencraft lors d’une soirée conviviale avec l’équipe, ne manquez pas cet événement ! </p>\n<p>Le projet Achencraft implique la création d’une version de Strasbourg dans le jeu Minecraft.</p>\n<p>Assurez-vous d’apporter votre ordinateur personnel et une petite collation à partager !</p>\n<p><a href=\"https://www.facebook.com/Achencraft\" rel=\"noopener\">Rejoindre la communauté</a></p>\n<figure><img src=\"/images/blog/format-newsletter-46.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Meetup Deep Learning – 18/10/2023 – De 10h00 à 12h00</strong></p>\n<p><strong>Automatiser les tâches LLM avec Langchain et GPT‍</strong></p>\n<p>Au programme ⤵️</p>\n<p> Nous approfondissons notre analyse de documents avec GPT lors d’une nouvelle session en utilisant LangChain, avec des exemples concrets de la manière d’automatiser le scraping et l’extraction de données en utilisant LangChain et OpenAI.</p>\n<p>✅ Vous apprendrez à coder votre propre agent autonome qui utilise l’API de recherche Google et des outils personnalisés pour trouver et formater les données que vous recherchez.</p>\n<p><a href=\"https://urlz.fr/o9uV\" rel=\"noopener\">Participer</a></p>\n<figure><img src=\"/images/blog/format-newsletter-41.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Foli’Commerce – 13/11/2023 – De 18h30 à 20h30</strong></p>\n<p><strong>Attirez des visiteurs dans votre commerce grâce au web-to-store</strong></p>\n<p>L’objectif est que vous puissiez prendre du recul et les bonnes décisions pour développer votre activité professionnelle grâce au web</p>\n<p>Cet événement est organisé par <a href=\"https://lesfoliweb.fr/\" rel=\"noopener\">Les Foliweb</a> en partenariat avec la <a href=\"https://www.alsace-eurometropole.cci.fr/\" rel=\"noopener\">CCI Alsace Eurométropole</a></p>\n<p>Vous avez un commerce et vous vous demandez comment le numérique peut vous aider à augmenter votre trafic en magasin❓</p>\n<p> Cet atelier est fait pour vous !</p>\n<p>✅ Apprenez les meilleures techniques pour optimiser votre présence en ligne et inciter vos clients virtuels à franchir les portes de votre magasin.</p>\n<p> Des experts vous livreront leurs conseils et outils pour transformer votre site web et vos réseaux sociaux en véritables aimants à clients pour votre boutique physique.</p>\n<p>Ils vous expliqueront comment la stratégie de web-to-store peut servir de pont entre votre présence en ligne et votre commerce physique, maximisant ainsi les opportunités de vente.</p>\n<p>‍ Vous êtes :</p>\n<p>• Dirigeant de TPE, entrepreneur ou porteur de projets</p>\n<p>• Niveau débutant à intermédiaire</p>\n<p>• Motivé et vous avez très envie d’apprendre et de partager avec nous, dans une ambiance conviviale et bienveillante</p>\n<p> Contenu de l’atelier :</p>\n<p>• Comprendre le concept de web-to-store et son importance pour votre commerce</p>\n<p>• Identifier les meilleures pratiques pour optimiser votre présence en ligne afin d’attirer des clients en magasin</p>\n<p>• Découvrir comment le marketing numérique et le référencement local peuvent augmenter votre visibilité</p>\n<p><a href=\"https://urlz.fr/o4Hq\" rel=\"noopener\">Participer gratuitement</a></p>\n<figure><img src=\"/images/blog/format-newsletter-47.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Strasbourg Flutter Meetup Group – 02/11/2023 – De 18h30 à 20h30</strong></p>\n<p><strong>Rejoignez la communauté Strasbourg Flutter Meetup Group‍</strong></p>\n<p>Les participants échangent en anglais ou allemand !</p>\n<p>L’objectif de cette est d’écouter une ou deux présentations sur des sujets liés à Flutter, que chacun présente ses résultats des deux dernières semaines et indique au groupe ce qu’il prévoit de faire lors de la prochaine itération</p>\n<p>De plus, nous souhaitons échanger sur les nouveautés de Flutter et pourquoi pas finir par une petite bière dans un bar</p>\n<p> Ordre du jour:</p>\n<p>▹ TechPress</p>\n<p>▹ Examiner, planifier et résoudre les obstacles</p>\n<p>▹ Échanger des actualités Flutter (par exemple, notes de version ou nouveaux produits autour de Flutter)</p>\n<p>▶️ Canal Discord (<a href=\"https://l.facebook.com/l.php?u=https%3A%2F%2Fdiscord.gg%2FAMfvWZEM%3Ffbclid%3DIwAR0gwnGG3Oyj9QEM0ORc-SZzwRpiPCfzj7cOV50vsAA2-c9ac31rxy_H77A&amp;h=AT2ozkUt_eAoBZKExoR6kWqpbUrLjQtwwNeIVPI1oIBoZyEVqbjrQREv_06Lhu-Cazii9OyRdVNLyQSiEBtPPP6Tdm6pwO0j9eVk26xtJ2viGIdV3n7yPSHqKbx73sQ4OgYQC56Ibw&amp;__tn__=-UK-R&amp;c[0]=AT3CP2JUIGkBLJZZ5Lywg-YDtn8ccX38IcMpS-RB_z5_1Dp30hNnW57HSbP2O9nV9xKgotss4AEdxD_E4pwH0oBu79rQz8l04dJWVsETfRKrg5HpmXrDy6ymEmzUr6KPHAUJmv3TW04jAdw5rkLtQLTR8U40bA\" rel=\"noopener\">https://discord.gg/AMfvWZEM</a>). Si vous ne pouvez pas participer sur place, n’hésitez pas à visiter la réunion virtuellement.</p>\n<p><em>« The target of the meeting is to hear one or two presentation about Flutter related topics, that everyone presents its results of the last two weeks and tells the group what he plans to do in the next iteration</em></p>\n<p><em>Furthermore we want to exchange Flutter news and to go to a pub for a beer</em></p>\n<p><em> Agenda :</em></p>\n<p><em>▹ TechPress</em></p>\n<p><em>▹ Review, Planning and solving Impediments</em></p>\n<p><em>▹ Exchange Flutter news (e. g. Release notes or new products around Flutter)</em></p>\n<p><em>▶️  I set up a discord channel (</em><a href=\"https://discord.gg/AMfvWZEM?fbclid=IwAR108ihsuxVGiDuFAWxMBsnQqdKEOlahynWIxE-KmrkIknACaqPFpqksiMc\" rel=\"noopener\"><em>https://discord.gg/AMfvWZEM</em></a><em>). If you can’t participate on-site don’t hesitate to visit the meeting virtually. »</em></p>\n<p><a href=\"https://urlz.fr/o5RH\" rel=\"noopener\">Rejoindre l’événement</a></p>\n<figure><img src=\"/images/blog/format-newsletter-44.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>C’est arrivé le mois dernier … et près de chez vous !</strong></p>\n<p><strong>À la Plage Digitale, il s’en est passé des choses en octobre :</strong></p>\n<p> GDG Strasbourg, Strasbourg JS, Les Facilitateurs d’Alsace, Achen’ight, Meetup Deep Learning, Pixels &amp; Bretzels, Hack SXB… !</p>\n<p>Suivez-nous sur nos réseaux sociaux pour ne rien louper !</p>\n<p><a href=\"https://www.linkedin.com/company/la-plage-digitale/?viewAsMember=true\" rel=\"noopener\">Linkedin</a></p>\n<p><a href=\"https://www.facebook.com/laplagedigitale\" rel=\"noopener\">Facebook</a></p>\n<p><a href=\"https://www.instagram.com/laplagedigitale/\" rel=\"noopener\">Instagram</a></p>\n<p><a href=\"https://twitter.com/laplagedigitale\" rel=\"noopener\">Twitter</a></p>"
