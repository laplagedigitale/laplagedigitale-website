  - key: "octobre-2023"
    fields:
      title: "Octobre 2023 🍁"
      slug: "octobre-2023"
      excerpt: "En octobre, qui n’a pas de manteau doit en trouver un bientôt"
      body: "<p><strong>En octobre, qui n’a pas de manteau doit en trouver un bientôt</strong></p>\n<p><strong>Découvrez l’agenda du mois d’octobre de la Plage Digitale</strong></p>\n<figure><img src=\"/images/blog/format-newsletter-33.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>GDG Strasbourg – 02/10/2023 – À partir de 19h00</strong></p>\n<p><strong>Utiliser Qwik pour répondre aux normes Google, avec Ayoub Alouane</strong></p>\n<p>Durant cette rencontre, vous pourrez examiner ensemble pourquoi Qwik s’aligne stratégiquement avec les Core Web Vitals de Google. Vous explorerez comment le framework Qwik permet de réduire au minimum le temps d’interactivité des sites web en utilisant le concept de la resumabilité comme alternative efficace à l’hydratation</p>\n<p>Qwik est un framework fullstack créé par le créateur d’Angular, Misko Hevery. Qwik a un objectif clair : atteindre des performances optimales, 0 javascript, du HTML pur et une excellente DX.</p>\n<p>Les participants apprendront comment améliorer les performances de chargement et l’interactivité, qui font partie des facteurs connus sous le nom de « Core Web Vitals », les mesures clés que Google utilise dans son algorithme de classement</p>\n<p>Au cours de cette session, nous fournirons une vue d’ensemble et une compréhension du LCP (Largest Contentful Paint), du FID (First Input Delay) et du CLS (Cumulative Layout Shift).</p>\n<p>À l’issue de ce talk, les participants posséderont les connaissances nécessaires pour créer des sites web performants et évolutifs</p>\n<p><a href=\"https://www.meetup.com/fr-FR/gdg-strasbourg/events/296052786/\" rel=\"noopener\"><strong>Participer à l’événement</strong></a></p>\n<figure><img src=\"/images/blog/format-newsletter-36.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Achen’ight – 13/10/2023 – À partir de 19h00</strong></p>\n<p><strong>Le rendez-vous mensuel d’Achencraft !</strong>‍</p>\n<p>Si vous souhaitez échanger autour du projet Achencraft lors d’une soirée conviviale avec l’équipe, cet événement est fait pour vous ! <br>Le projet Achencraft consiste à faire une représentation de Strasbourg, version Minecraft.<br>N’oubliez pas de ramener un ordinateur personnel, ainsi qu’une petite collation à partager !</p>\n<p><a href=\"https://www.facebook.com/Achencraft\" rel=\"noopener\"><strong>Rejoindre la communauté Achencraft</strong></a></p>\n<figure><img src=\"/images/blog/format-newsletter-34.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Meetup Deep Learning – 14/10/2023 – De 10h00 à 12h00</strong></p>\n<p><strong>Comment analyser des documents textuels avec OpenAI GPT ?</strong></p>\n<p>Lors de cette réunion, nous exploiterons la puissance des grands modèles de langage pour analyser des documents. Nous verrons le flux de travail de base et le changement de paradigme, passant de la programmation à « prompt engineering ».</p>\n<p><a href=\"https://www.meetup.com/strasbourg-deep-learning-meetup/events/296225597/?utm_medium=referral&amp;utm_campaign=share-btn_savedevents_share_modal&amp;utm_source=link\" rel=\"noopener\"><strong>Participer à l’atelier</strong></a></p>\n<figure><img src=\"/images/blog/format-newsletter-37-1.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Pixels &amp; Bretzels – 18/10/2023 – À partir de 18h30</strong></p>\n<p><strong>Qu’est-ce qu’un Design system et comment faire adhérer à sa mise en place dans une entreprise ?</strong></p>\n<p>Qu’est-ce qu’un Design system, qu’est-ce qu’il contient, quand est-ce qu’on en a besoin, quels en sont les acteurs et les outils ? Et comment aujourd’hui réussir à faire adhérer les décisionnaires d’une entreprise à la mise en place d’un design system ?<br>Hélène Kosmalsky va tenter de répondre à ces questions avec ses recherches et sa propre expérience sur le sujet.</p>\n<p><a href=\"https://www.helloasso.com/associations/pixels-bretzels/evenements/qu-est-ce-qu-un-design-system-et-comment-le-mettre-en-place-en-entreprise\" rel=\"noopener\"><strong>Participer à l’événement</strong></a></p>\n<figure><img src=\"/images/blog/format-newsletter-35-1.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>HackSXB – 27/10/2023 – À partir de 18h00</strong></p>\n<p><strong>HackSXB – La communauté de développeurs et makers à Strasbourg – Portée par <a href=\"https://www.alsacedigitale.org\" rel=\"noopener\">Alsace Digitale</a></strong></p>\n<p>Le HackSXB est une communauté qui partagent l’envie de créer. Organisé les derniers vendredis de chaque mois, le HackSXB est une soirée dédiée à la programmation et à la bidouille. Sur des sujets libres et parfois plus thématiques, chacun vient avec son projet ou participe à un projet commun</p>\n<p>Du développement de jeux vidéo à la soudure de composants électroniques, on y retrouve des passionnés avec des compétences variées.</p>\n<p><a href=\"https://fb.me/e/9kNJhOH2z\" rel=\"noopener\"><strong>S’inscrire à la rencontre</strong></a></p>"
