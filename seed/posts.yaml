  - key: "startup-weekend-strasbourg-logo-battle"
    fields:
      title: "Startup Weekend Strasbourg Logo Battle"
      slug: "startup-weekend-strasbourg-logo-battle"
      excerpt: "Startup Weekend Strasbourg fête ses 5 ans en 2015 ! À cette occasion nous avons besoin d’un nouveau logo, à la hauteur de notre ville et de notre événement…"
      body: "<figure><img src=\"/images/blog/10421485-1019520991403004-4789578539597590229-n.webp\" alt=\"visuel Logo Battle Stratup weekend\" loading=\"lazy\"><figcaption>visuel Logo Battle Stratup weekend</figcaption></figure>\n<p>Startup Weekend Strasbourg fête ses 5 ans en 2015 !</p>\n<p>À cette occasion nous avons besoin d’un nouveau logo, à la hauteur de notre ville et de notre événement: plus créatif, plus frais et plus punchy. Aujourd’hui, nous avons besoin de vous !</p>\n<p><strong>QUE FAUT-IL FAIRE: </strong></p>\n<p>Créez un nouveau logo officiel de SW Strasbourg, avec deux-trois propositions de couleurs. UP Global (le Gourou de Startup Weekend) fournit les polices et les bases de logo, alors vous ne partez pas de zéro, mais adaptez juste le logo à l’édition de Strasbourg.</p>\n<p><strong>COMMENT PARTICIPER: </strong></p>\n<p>Prenez les bases : https://brandisty.com/page?id=536c544b791eb35245000032, personnalisez-les pour l’édition de Strasbourg 2015 et envoyez le résultat sur strasbourg@startupweekend.org avant le 14 septembre.</p>\n<p>QUAND: Nous attendons vos logos <strong>avant le 14 septembr</strong>e. Ensuite, un vote sera organisé sur Facebook pour sélectionner cinq projets! Un jury choisira le logo-champion.</p>\n<p><strong>QU’EST-CE QUE VOUS GAGNEZ:</strong> La gloire éternelle, mais pas seulement.</p>\n<p>– Invitation spéciale pour le SW Strasbourg 2015</p>\n<p>– Votre nom sur le site web</p>\n<p>– Un prix spécial (un peu de suspense !), remis lors de SW Strasbourg 2015</p>\n<p><strong>NE RATEZ PAS VOTRE CHANCE</strong>! Lancez-vous dans le SW Strasbourg LOGO BATTLE #logobattleswsxb</p>\n<p>Reglement complet : SW STRASBOURG LOGO_français</p>"
      legacy_cover: "/images/blog/10421485-1019520991403004-4789578539597590229-n.webp"
      status: "published"
      published_at: "2015-08-24"
      categories: ["actualites", "evenements"]
      legacy_path: "/startup-weekend-strasbourg-logo-battle/"
      created_at: "2015-08-24T14:32:22Z"
  - key: "fantastic-game-jam"
    fields:
      title: "Fantastic Game Jam"
      slug: "fantastic-game-jam"
      excerpt: "Dans le cadre de la 8ème édition du Festival européen du film fantastique de Strasbourg, Alsace Digitale présente la Fantastic Game Jam ou comment livrer le…"
      body: "<p>Dans le cadre de la 8ème édition du Festival européen du film fantastique de Strasbourg, Alsace Digitale présente la Fantastic Game Jam ou c<b>omment livrer le meilleur jeu vidéo en 48h </b>sur un thème tiré au sort au dernier moment.</p>\n<p>Quelle sera la meilleure stratégie à adopter ? Créer l’équipe la plus performante ? Trouver le concept le plus fun ? La technologie la plus adaptée ? L’expérience le dira !</p>\n<p>Cet événement est ouvert à tous. Chaque équipe est constituée de développeurs, de graphistes, de musiciens, de game designers, de gamers…  formée sur place. </p>\n<p>Chacun vient avec son équipement.</p>\n<p>L’équipe primée se verra remettre un pass pour le Festival Européen du Film Fantastique de Strasbourg.</p>\n<p>Réservation : </p>\n<p><a href=\"https://www.eventbrite.fr/e/billets-fantastic-game-jam-17892965341\" rel=\"noopener\">https://www.eventbrite.fr/e/billets-fantastic-game-jam-17892965341</a></p>\n<p>Coût de participation : </p>\n<p>25 euros comprenant 4 repas et 2 petits déjeuners.</p>\n<p>Adresse : Shadok 25 Presqu’île Malraux</p>"
      legacy_cover: "/images/blog/elpoulpio-def-1.webp"
      status: "published"
      published_at: "2015-08-26"
      categories: ["actualites", "evenements"]
      legacy_path: "/fantastic-game-jam/"
