  - key: "il-etait-une-fois-a-la-plage"
    fields:
      title: "Il était une fois à la Plage"
      slug: "il-etait-une-fois-a-la-plage"
      excerpt: "Contrairement à ce que le temps nous fait croire, l’été est bien là depuis quelques jours. Et qui dit été dit vacances, calme, farniente. Mais dans notre…"
      body: "<p>Contrairement à ce que le temps nous fait croire, l’été est bien là depuis quelques jours. Et qui dit été dit vacances, calme, farniente. Mais dans notre jeunesse folle nous n’allons pas en rester là, après tout nous avons 2 mois révolus, pourquoi se reposer alors qu’il y a sûrement plein de choses à faire et à organiser à Strasbourg en été. En plus nous bénéficions à présent d’une climatisation en état de marche, ce qui est un avantage non négligeable sur les mois qui arrivent.</p>\n<p>Mais avant de me lancer plus avant dans un post qui présagerait de nos activités estivales, je tiens à faire un petit flashback sur la fin du printemps, et un évènement que nous avons appelé EdgeFest.</p>\n<p>Le premier mot qui me vient à l’esprit est MERCI ! Merci à tous ceux qui sont venus, merci à ceux qui nous ont fait confiance, merci à ceux qui ont partagé avec nous, merci à ceux qui nous ont aidé à tout organiser, merci à tout le monde, à tous ceux qui ont fait que ça a été possible, et que ça a été si génial.</p>\n<p>Alsace Digitale : J’ai déjà remercié Yann Klis, parce qu’il m’a obligé à le faire sous la menace de quitter notre team à Starcraft, donc je vais remercier l’autre mec donc le prénom commence pareil mais se finit moins abruptement. Merci à toi Yannick Jost pour avoir au début juste proposé de parler de robotique, puis finalement pour avoir emmené ta team, puis embarqué une autre team de l’INSA, « ha tiens vous avez besoin de matos son, c’est possible », « ha ben on emmène le terrain, les robots, une dizaine de mecs motivés pour une démo, et on peut rester toute la journée ». J’avoue qu’à un moment j’ai cru qu’il allait nous proposer de monter un banquet et de nous préparer quelques viandes rôties, ça m’aurait fait mal de lui dire qu’on ne pourrait pas à cause de l’alarme incendie. Non, ce mec est vraiment un magicien.</p>\n<p>La Communauté Urbaine de Strasbourg : Merci à Sandrine André notamment pour nous avoir poussé jusque dans nos derniers retranchements, pour nous avoir donné une motivation sans limites à faire de cet évènement quelque chose de grand, qui attire un maximum de monde et qui n’oublie personne sur le bord de la route. Il faut quand même que je raconte ce vendredi où on s’est retrouvé à une heure fort matinale (ne respectant pas les accords de la convention de Genève sur le repos nécessaire à l’homme civilisé en fin de semaine) pour placer 7 tables rondes, 4 stands, 3 ateliers créatifs, des musiciens, des présentations de start-ups, etc. Moi j’étais directement parti sur l’idée qu’on allait monter une arche de Noé ou un boat-people, ou qu’on allait devoir mettre des mecs sur le toit. Yann nous a bien ressorti la blague du chapiteau (« Vous inquiétez pas, ça sera super un chapiteau dehors on pourra même faire des barbecues !»), mais au final on a réussi à caser tout le monde sans que les gens ne se marchent trop sur les pieds.</p>\n<p>Les amis : Alors là, je dois dire que c’est la chose qui m’a le plus marqué durant ces portes ouvertes. J’avais discuté avec Philippe Geiss de la possibilité qu’il fasse un petit quelque chose avec le Conservatoire durant cette journée. Il m’avait proposé ce que vous avez tous pu lire sur le programme, et sur le papier ça m’avait paru vraiment bien. Mais je ne m’attendais pas à ça, à cette énergie communicatrice. Nous cherchions à associer dès à présent les arts et la culture à notre célébration, et nous n’osions espérer telle concrétisation. Le quatuor phénoménal qui a entonné ses divines mélodies au milieu de notre espace a fait résonner haut et fort la joie de pouvoir partager ensemble et avec tous.</p>\n<p>A un moment j’ai dû me pincer pour comprendre que je ne rêvais pas, que nous avions bien réussi ce pari insensé d’associer entrepreneuriat, numérique, artistique et culturel. Derrière une porte des combats de robots, dans cette salle une fresque participative et une présentation d’un jeu collaboratif, ici des musiciens, là des jeunes start-up présentant leurs projets, au milieu une table ronde sur le numérique et la création artistique ; et tout ça avec des étudiants, des ingénieurs, des geeks, des artistes, des administratifs, des professeurs, des graphistes, etc. Et moi au milieu de tout ça, réfléchissant à ces dernières semaines de travail, de tractations, de discussions, de planification, avec juste un simple sourire aux lèvres et l’œil toujours aux aguets du moindre problème à résoudre ou à anticiper.</p>\n<p>Merci à vous tous pour tout ça, et pour tout ce qui va venir.</p>\n<p>A bientôt !</p>\n<p><em>Crédit Photo : <a href=\"http://www.juliengerard.com\" rel=\"noopener\">Julien GERARD</a></em></p>\n<p><em>Ci-dessous une vidéo de Anthony Bonhomme (<a href=\"http://www.goodmandyou.com/\" rel=\"noopener\">Goodman &amp; You</a>) sur l’évènement EdgeFest</em></p>\n<p><iframe src=\"https://player.vimeo.com/video/44323655\" loading=\"lazy\" allowfullscreen></iframe></p>\n<p><a href=\"http://vimeo.com/44323655\" rel=\"noopener\">Recap EdgeFest Strasbourg 15 au 17 juin 2012</a> from <a href=\"http://vimeo.com/user8331893\" rel=\"noopener\">Anthony Bonhomme</a> on <a href=\"http://vimeo.com\" rel=\"noopener\">Vimeo</a>.</p>"
