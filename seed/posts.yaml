  - key: "le-startup-weekend-mulhouse-est-de-retour-2"
    fields:
      title: "Le Startup Weekend Mulhouse est de retour !"
      slug: "le-startup-weekend-mulhouse-est-de-retour-2"
      excerpt: "Pour sa 4e édition, le Startup Weekend Mulhouse revient du 19 au 21 mai prochain à la HEAR à Mulhouse, et permettra aux courageux participants de créer un…"
      body: "<p><img src=\"/images/blog/logos-swe17-long0.webp\" alt=\"Logos Start-Up Week-end Mulhouse 2017\" loading=\"lazy\"></p>\n<p><strong>Pour sa 4e édition, le Startup Weekend Mulhouse revient du 19 au 21 mai prochain à la HEAR à Mulhouse, et permettra aux courageux participants de créer un concept de Startup en 54h chrono !</strong></p>\n<p>Pour ceux qui ne sont pas familier de ce genre d’événement, le <a href=\"https://www.facebook.com/StartupWeekendMulhouse/\" rel=\"noopener\"><strong>Startup Weekend</strong></a> est un hackaton, un marathon entrepreneurial en quelque sorte, où <strong>différentes équipes</strong> <strong>se constituent en fonction des compétences de chacun</strong> et ont pour objectif de présenter un concept de startup innovante dans le temps imparti. 54h dans ce cas là.</p>\n<p>Le Startup Weekend est à la base d’un mouvement d’entrepreneurs actifs et confirmés, qui apprennent les bases de <strong>la création de startups et du lancement de projet.</strong> C’est la plus grande communauté d’entrepreneurs passionnés, avec plusieurs centaines d’évènements dans autant de villes du monde, comme à <a href=\"https://www.facebook.com/StartupWeekendStrasbourg/?fref=ts\" rel=\"noopener\"><strong>Strasbourg</strong> </a>en fin d’année.</p>\n<p>Entrepreneurs, étudiants, développeurs, designers, créatifs, curieux : tous les profils peuvent apporter quelque chose lors du Startup Weekend, <strong>alors pourquoi pas vous ?</strong></p>\n<p>Rejoignez le mouvement en vous inscrivant <a href=\"https://www.eventbrite.com/e/startup-weekend-mulhouse-4-tickets-29082871652\" rel=\"noopener\"><strong>ICI</strong></a> !</p>\n<p>La participation s’élève à <strong>50€</strong> mais comprend la <strong>restauration sur l’ensemble de weekend</strong>, <strong>l’usage des locaux et la possibilité de dormir sur place</strong> pour ceux qui viennent de loin. <strong>De nombreuses animations et une ambiance conviviale</strong> vous accompagneront tout au long de cette expérience humaine.</p>\n<p>On compte déjà une trentaine de participants à plus d’un mois du début de l’événement organisé par <strong><a href=\"http://www.alsacedigitale.org/\" rel=\"noopener\">Alsace Digitale</a></strong> et son antenne <strong><a href=\"http://mulhouse-startups.com/\" rel=\"noopener\">Mulhouse Startups</a>, </strong>ainsi qu’<strong><a href=\"http://www.enovcampus.eu/\" rel=\"noopener\">e-nov Campus</a> </strong>et <strong><a href=\"http://www.technopole-mulhouse.com/\" rel=\"noopener\">Le Technopole Mulhouse</a>.</strong> C’est près de la moitié du nombre total de participants de l’an dernier. Le record de participation semble donc bien parti pour être battu !</p>\n<p><strong>On compte sur vous !</strong></p>\n<p><strong>Y aller :</strong> Du vendredi 19 au dimanche 21 mai 2017 à la HEAR – 3 Quai des Pêcheurs, 68200 Mulhouse</p>\n<p><strong><a href=\"https://www.eventbrite.com/e/startup-weekend-mulhouse-4-tickets-29082871652\" rel=\"noopener\">Sur inscription</a></strong></p>\n<p><strong>Plus d’infos sur Facebook</strong> : <a href=\"https://www.facebook.com/events/231750303957014/\" rel=\"noopener\">https://www.facebook.com/events/231750303957014/</a></p>"
