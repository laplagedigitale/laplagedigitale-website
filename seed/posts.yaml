  - key: "decembre-2023"
    fields:
      title: "Décembre 2023 🎿"
      slug: "decembre-2023"
      excerpt: "Si décembre est sous la neige, la récolte se protège ☃️"
      body: "<p><strong>Si décembre est sous la neige, la récolte se protège ☃️</strong></p>\n<p><strong>Découvrez l’agenda du mois de décembre de la Plage Digitale</strong></p>\n<figure><img src=\"/images/blog/02-12-deep-learning.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Meetup Deep Learning – 02/12/2023 – 10h00-12h00</strong></p>\n<p><strong>Comment fonctionne un moteur de recherche web ?‍</strong></p>\n<p> Un bon cas d’utilisation pour le learning to rank »</p>\n<p> Nous en utilisons tous les jours sans plus y prêter attention. Sans eux, la recherche d’un site pertinent dans notre internet aux centaines de milliards de sites serait humainement impossible … Il s’agit bien-sûr des moteurs de recherches web.</p>\n<p>1️⃣ Cet exposé en 3 parties débutera par des éléments généraux sur le fonctionnement de ces pépites technologiques méconnues.</p>\n<p>2️⃣ Les deux parties suivantes, plus techniques, seront centrées sur les aspects théoriques et pratiques du learning-to-rank (branche du ML très utilisée dans les moteurs de recherches) ainsi que sur les extensions vectorielles qui sont dorénavant l’état de l’art.</p>\n<p><a href=\"https://urlz.fr/oxLb\" rel=\"noopener\">Participer à l’événement</a></p>\n<figure><img src=\"/images/blog/06-12-strasbourg-js.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Strasbourg JS – 06/12/2023 – 19h00-21h00</strong></p>\n<p><strong>Rendez-vous pour la dernière de 2023 autour du JavaScript !</strong></p>\n<p>Jonathan Marco dirigera un atelier autour de Vite pour servir une application en mode rendu côté serveur sans méta framework</p>\n<p>Michel Edighoffer présentera UnJS et ses modules polyvalents pour rendre vos applications plus efficaces et déployables partout.</p>\n<p><a href=\"https://www.meetup.com/fr-FR/strasbourgjs/events/297560426/\" rel=\"noopener\">Rejoindre la communauté</a></p>\n<figure><img src=\"/images/blog/ada-horizon.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>ADA Horizon – 07/12/2023 – 18h30-21h00</strong></p>\n<p><strong>Parité dans la tech : Après le constat, quels sont les moyens et leviers d’action pour un futur plus inclusif ?</strong></p>\n<p>Moins de 20%, c’est la proportion de femmes dans la Tech, et ce chiffre stagne en 2023 …</p>\n<p>C’est à partir de ce constat que nous avons décidé de créer Ada Horizon, un collectif qui permettra d’ouvrir la discussion, mettre en lumière des initiatives et favoriser l’émergence de solutions concrètes pour faire bouger les lignes.</p>\n<p>Et pour commencer, nous organisons une table ronde sur les moyens et leviers d’action possibles pour un futur plus inclusif !</p>\n<p> Cette table ronde sera suivie d’un apéro networking, donc n’hésitez pas à vous inscrire pour nous permettre d’organiser au mieux ce moment convivial. </p>\n<p><a href=\"https://t.ly/nfDTK\" rel=\"noopener\">Participer</a></p>\n<figure><img src=\"/images/blog/13-12-sgc.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Strasbourg Games Community – 13/12/2023 – 19h00-20h45</strong></p>\n<p><strong>Parlons Startups, parlons Gaming !</strong></p>\n<p>Soirée spéciale “pitchs” avec plusieurs porteurs de projet locaux ! Pour ce rendez-vous rare, on mettra en lumière plusieurs Startups qui ont pour point commun d’être liées au monde Gaming / Gamification</p>\n<p>Nous laisserons aussi la parole à au moins un acteur de l’écosystème startup</p>\n<p> Objectifs de l’événement :</p>\n<p>▸  Apporter davantage de visibilité pour nos entrepreneurs locaux.<br>▸ Favoriser les collaborations ou le réseautage entre gens passionnés par l’entrepreneuriat ou les thèmes de la soirée.</p>\n<p><a href=\"https://www.helloasso.com/associations/strasbourg-games-community/evenements/soiree-pitch-sartups-gaming-gamification\" rel=\"noopener\">Participer gratuitement</a></p>\n<figure><img src=\"/images/blog/14-12-facilitateurs.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Les Facilitateurs d’Alsace – 14/12/2023 – À partir de 18h30</strong></p>\n<p><strong>Café Parlote</strong></p>\n<p>Les Facilitateurs d’Alsace proposent un nouveau Café Parlote à Strasbourg ! ☕️</p>\n<p>Le principe ? Échanger sur nos pratiques et découvertes de facilitateurs.trices.</p>\n<p>La rencontre est ouverte aux 30 premier.e.s inscrit.e.s</p>\n<p><a href=\"https://urlz.fr/oz95\" rel=\"noopener\">Rejoindre l’événement</a></p>\n<figure><img src=\"/images/blog/16-2.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Les rendez-vous mensuels  !</strong></p>\n<p><strong>Achen’ight – 15/12/2023 – 19h00-23h00</strong></p>\n<p>Achen’ight, c’est une soirée par mois où se rassemble l’équipe d’Achencraft pour discuter, rencontrer, rigoler, concevoir, …. bref tout ce qui permet au projet Achencraft de progresser !</p>\n<p><strong>Strasbourg Flutter Meetup Group – 14/12/2023 et 28/12/2023 – 18h30-20h30</strong></p>\n<p>Les participants échangent en anglais ou allemand !</p>\n<p>▹ Aborder des sujets liés à Flutter<br>▹ Présentation des résultats des deux dernières semaines, ainsi que prévision pour la prochaine itération<br>▹ Échange sur les actualités Flutter (par exemple, notes de version ou nouveaux produits autour de Flutter)</p>\n<p>▶️ Canal Discord (https://discord.gg/AMfvWZEM). Si vous ne pouvez pas participer sur place, n’hésitez pas à visiter la réunion virtuellement.</p>\n<p><strong>Hack SXB – 29/12/2023 – 18h00-23h00</strong></p>\n<p>Venez partager votre passion pour la création avec un groupe d’étudiants et professionnels !</p>\n<p>Présentez vos propres projets ou rejoignez des projets collectifs sur des sujets variés, parfois thématiques, lors de cette soirée de programmation et de bricolage</p>\n<p><a href=\"https://www.facebook.com/Achencraft\" rel=\"noopener\">Achen’ight</a></p>\n<p><a href=\"https://www.meetup.com/fr-FR/strasbourg-flutter-meetup-group/events/297562393/\" rel=\"noopener\">Strasbourg Flutter Meetup</a></p>\n<p><a href=\"https://www.facebook.com/HackSXB\" rel=\"noopener\">Hack SXB</a></p>\n<figure><img src=\"/images/blog/format-newsletter-49.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>C’est arrivé le mois dernier … et près de chez vous !</strong></p>\n<p><strong>À la Plage Digitale, il s’en est passé des choses en novembre :</strong></p>\n<p> Plusieurs rencontres de la communauté Strasbourg Flutter Meetup Group, un atelier Software Crafters Strasbourg, un atelier Deep Learning, un Strasbourg Developer Meetup, un meetup Data Science, un Foli’Commerce, un Hack SXB, un Achen’ight… !</p>\n<p>Suivez-nous sur nos réseaux sociaux pour ne rien louper !</p>"
