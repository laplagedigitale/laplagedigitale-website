  - key: "la-social-cup-apporter-une-reponse-aux-grands-enjeux-de-notre-societe"
    fields:
      title: "La Social Cup : apporter une réponse aux grands enjeux de notre société"
      slug: "la-social-cup-apporter-une-reponse-aux-grands-enjeux-de-notre-societe"
      excerpt: "La Social Cup est de retour, et elle s’arrête à Strasbourg le 3 décembre prochain dans le cadre de sa tournée nationale. Organisée par MakeSense en…"
      body: "<p><strong>La Social Cup est de retour, et elle s’arrête à Strasbourg le 3 décembre prochain dans le cadre de sa tournée nationale. Organisée par MakeSense en partenariat avec KissKissBankBank et La Banque Postale, la Social Cup est la première coupe de France de l’entreprenariat social étudiant, dédiée à la résolution des grands enjeux de notre société.</strong></p>\n<p>Cette année encore, la Social Cup vous invite à découvrir l’entreprenariat social et le monde des start-ups en vous permettant de développer votre projet si vous en avez un, ou de contribuer à un projet existant. C’est également l’occasion de se faire accompagner et soutenir par MakeSense et son réseau de professionnel.</p>\n<p>La Social Cup favorise les projets ambitieux et innovants répondant aux grands enjeux de notre société (environnement, exclusion, emploi, vieillissement, éducation…). <strong>Elle est ouverte aux étudiants et aux personnes de moins de 30 ans</strong>, de tout horizon, permettant à chacun d’apporter ses compétences respectives au sein d’une équipe pluridisciplinaire.</p>\n<h2><strong>Déroulement :</strong></h2>\n<ul><li><strong>L’échauffement</strong> : Depuis la rentrée de septembre, la Social Cup parcourt les écoles des plus grandes villes de France pour présenter les enjeux de l’entreprenariat social.</li><li><strong>Les événements SenseFiction</strong> : Un après-midi destiné à l’élaboration des projets lors d’un atelier d’innovation collective. Les meilleurs d’entre eux seront sélectionnés par un jury pour représenter leur ville lors de la Battle Finale.</li><li><strong>L’épreuve finale, la Battle de Créateurs :</strong> Les projets s’affronteront au mois de janvier et le public votera pour les meilleurs projets en format éliminatoire à trois tours : poule, demi-finale et finale.</li></ul>\n<h2><strong>A Gagner :</strong></h2>\n<p>Les participants à la Battle Finale se verront offrir une campagne de financement participatif sur KissKissBankBank, soutenue financièrement par la Banque Postale :</p>\n<ul><li>500 € pour la phase de poule</li><li>1000 € pour les demi-finalistes</li><li>1500 € pour le finaliste</li><li>3000 € pour le lauréat</li></ul>\n<p>Et également une incubation d’un an au SenseCube, l’incubateur de start-ups sociales de MakeSense pour accélérer le développement de votre projet..</p>\n<h2><strong>Participer :</strong></h2>\n<p>La Social Cup organise une tournée dans toute la France pour organiser les ateliers SenseFiction, au cours desquels les meilleurs projets sont sélectionnés pour la Battle Finale.</p>\n<p><strong>A  Strasbourg, cela se passe le samedi 3 décembre à La Plage Rivetoile. </strong></p>\n<p><strong>Tout le monde peut y participer</strong>, mais seuls les moins de 30 ans peuvent candidater pour la Finale. Alors si vous êtes porteur d’un projet innovant ou que vous voulez tout simplement contribuer à l’un d’entre eux, <strong>n’hésitez pas à vous inscrire <a href=\"https://www.lasocialcup.com/je-minscris\" rel=\"noopener\">sur ce lien !</a></strong></p>\n<p>De plus, un <strong><a href=\"https://www.facebook.com/events/168956706901404/\" rel=\"noopener\">apéro MakeSense</a></strong> est organisé le mercredi 23 novembre à 18h30 à la Taverne Française, afin d’en savoir plus sur tous les événements à venir !</p>\n<p>Et retrouvez plus d’informations sur la Social Cup <strong><a href=\"https://www.lasocialcup.com/\" rel=\"noopener\">ici</a></strong>.</p>\n<p>Découvrez également <strong><a href=\"https://www.makesense.org/fr/pages/howitworks\" rel=\"noopener\">MakeSense</a></strong>.</p>"
