  - key: "aout-2023"
    fields:
      title: "Août 2023 🌊"
      slug: "aout-2023"
      excerpt: "Entre juillet et août, le boire est de bon goût"
      body: "<p><strong>Entre juillet et août, le boire est de bon goût</strong></p>\n<p><strong>Découvrez l’agenda du mois de juillet de la Plage Digitale </strong></p>\n<figure><img src=\"/images/blog/format-newsletter-7-1.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Qu’est-ce qu’un Tiers-Lieu ? </strong></p>\n<p><strong>« Un tiers-lieu est un espace physique et ouvert pour faire ensemble, où des individus peuvent se réunir pour travailler, s’approprier des savoirs et des compétences, se rencontrer ou simplement échanger de façon informelle. »</strong></p>\n<p>Il s’agit d’un lieu intermédiaire entre le domicile et le lieu de travail traditionnel</p>\n<p>➡️ Un tiers-lieu peut prendre différentes formes, telles qu’un café, un espace de coworking, ou une bibliothèque. <strong>L’objectif est de favoriser la créativité, l’innovation et la collaboration</strong> en offrant un environnement propice à la rencontre entre des personnes issues de divers horizons professionnels et sociaux. </p>\n<p>Les tiers-lieux sont souvent caractérisés par leur flexibilité, leur accessibilité, leur ouverture à tous et leur capacité à encourager l’échange de connaissances et la co-création</p>\n<p>Ils peuvent également offrir des services supplémentaires tels que des formations, des événements ou des ressources pour soutenir le développement personnel et professionnel de leurs membres.</p>\n<p><a href=\"https://www.grandest.fr/accompagner-15-29-ans/vous-orienter-vous-former/les-tiers-lieux/\" rel=\"noopener\"><strong>En savoir plus sur les Tiers-Lieux</strong></a></p>\n<figure><img src=\"/images/blog/format-newsletter-7-2.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Journée internationale du coworking – 09/08/2023</strong></p>\n<p><strong>Le mercredi 9 août prochain aura lieu la journée internationale du coworking</strong></p>\n<p>Cette journée est une occasion de célébrer, de promouvoir et de sensibiliser à la valeur du coworking en tant que modèle de travail collaboratif. Elle renforce la communauté, favorise la collaboration et met en lumière les avantages économiques et sociaux du coworking dans le monde entier</p>\n<p>Avez-vous déjà travaillé dans un espace de coworking ?</p>\n<p>Si la réponse est jamais, n’hésitez pas à passer une journée à la Plage Digitale. On vous promet de vous accueillir chaleureusement !</p>\n<figure><img src=\"/images/blog/format-newsletter-6-1.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Les rendez-vous du mois sont maintenus en août !</strong></p>\n<p><strong>Achen’ight et HackSXB, c’est programmé !</strong></p>\n<p><strong>Achen’ight aura lieu le vendredi 18/08</strong> ⤵️</p>\n<p> Rendez-vous pour échanger autour du projet Achencraft et de Minecraft lors d’une soirée conviviale avec l’équipe !</p>\n<p>Les seules choses à penser : Ramener un ordinateur personnel et une petite collation à partager.</p>\n<p><strong>HackSXB aura lieu le vendredi 25/08 </strong>⤵️</p>\n<p> Découvrez HackSXB, la communauté créée par Alsace Digitale, où étudiants et professionnels partagent leur passion pour la création, la programmation, et le bricolage !</p>\n<p><a href=\"https://www.facebook.com/Achencraft\" rel=\"noopener\"><strong>Achencraft</strong></a></p>\n<p><a href=\"https://www.facebook.com/HackSXB\" rel=\"noopener\"><strong>HackSXB</strong></a></p>\n<figure><img src=\"/images/blog/format-newsletter-5.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Une nouvelle formule d’abonnement a débarqué à la Plage Digitale !</strong></p>\n<p><strong>Profitez dès à présent de notre formule nomade !</strong></p>\n<p> Notre nouvelle formule vous permet de profiter : </p>\n<p>* D’un accès 24h/24, 7j/7 à l’espace Flex avec la mise à disposition des clés<br>* D’un accès aux imprimantes et scanners, selon le principe du fair use<br>* D’un accès internet Haut Débit (fibre), ainsi qu’une connexion WIFI<br>* D’un accès gratuit à l’espace détente et cafétéria<br>* Du café à volonté gratuit</p>\n<p>⚠️ <em>Information</em> : La location des salles de réunion dans cette formule est facturée en supplément en cas de besoin.</p>\n<p><a href=\"/les-formules\"><strong>Découvrir nos formules</strong></a></p>\n<figure><img src=\"/images/blog/format-newsletter-4.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>C’est arrivé le mois dernier … et près de chez vous !</strong></p>\n<p><strong>À la Plage Digitale, il s’en est passé des choses en juillet :</strong></p>\n<p> Remise de don à la SPA de Strasbourg, des ateliers pour enfants (création de robots, Scratch, Play2Code), un meetup Software Crafters Strasbourg, etc.</p>\n<p>Suivez-nous sur nos réseaux sociaux pour ne rien louper !</p>\n<p><a href=\"https://www.facebook.com/laplagedigitale\" rel=\"noopener\">Facebook</a></p>\n<p><a href=\"https://www.instagram.com/laplagedigitale/\" rel=\"noopener\">Instagram</a></p>\n<p><a href=\"https://www.google.com/url?sa=t&amp;rct=j&amp;q=&amp;esrc=s&amp;source=web&amp;cd=&amp;cad=rja&amp;uact=8&amp;ved=2ahUKEwjB5sH5hbGAAxVeUqQEHbZqDhIQFnoECCAQAQ&amp;url=https%3A%2F%2Ffr.linkedin.com%2Fcompany%2Fla-plage-digitale&amp;usg=AOvVaw0b3w9EuJuMxRtcUZkoQ3FJ&amp;opi=89978449\" rel=\"noopener\">Linkedin</a></p>\n<p><a href=\"https://twitter.com/laplagedigitale\" rel=\"noopener\">Twitter</a></p>"
