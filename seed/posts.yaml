      title: "Février 2024"
      slug: "fevrier-2024"
      excerpt: "En février, s’il gèle et tonne, c’est la marque d’un bel automne"
      body: "<p><strong>En février, s’il gèle et tonne, c’est la marque d’un bel automne</strong></p>\n<p><strong>Découvrez l’agenda du mois de février de la Plage Digitale </strong></p>\n<figure><img src=\"/images/blog/alexis-martin.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Permanence Propriété Intellectuelle – 01/02/2024 – 10h00-12h00</strong></p>\n<p><strong>Alexis accompagne quotidiennement les entreprises/porteurs de projets innovants afin de les sensibiliser à la protection de leur(s) création(s)</strong></p>\n<p>Il effectue également des audits d’entreprises/de projets gratuits. Son objectif est de vous montrer que la Propriété Intellectuelle est avant tout un outil qui vous permet de consolider votre avantage concurrentiel !</p>\n<p><a href=\"https://tally.so/r/wMREjA\" rel=\"noopener\">Prendre rdv gratuitement</a></p>\n<figure><img src=\"/images/blog/foliweb-1.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Les Foliweb – 13/02/2024 – De 10h00 à 12h00</strong></p>\n<p><strong>Optimisez votre site internet pour le rendre plus performant !</strong></p>\n<p>Au programme ⤵️</p>\n<p>Les événements #Foliweb sont dédiés aux entrepreneurs et TPE souhaitant passer à l’action sur le numérique et nous sommes ravis de vous y convier</p>\n<p>Ce mardi 13 février, Dan Bernier viendra échanger et vous apprendre comment optimiser votre site internet pour le rendre plus performant !</p>\n<p><a href=\"https://bit.ly/42bdOfC\" rel=\"noopener\">Participer</a></p>\n<figure><img src=\"/images/blog/benjamin-gonzalez-1.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Permanence Création d’Entreprise – 15/02/2024 – De 10h00 à 12h00</strong></p>\n<p><strong>Prenez rendez-vous avec Benjamin Gonzalez, Conseiller en Création d’Entreprise à la CCI Alsace Eurométropole ‍</strong></p>\n<p>Au programme ⤵️</p>\n<p> Inscrivez-vous pour une Permanence Gratuite au sein de La Plage Digitale : Conseil en Création et Développement d’Entreprises</p>\n<p>Vous êtes en train de démarrer votre entreprise ou vous dirigez une jeune entreprise de moins de trois ans ?</p>\n<p>✅Profitez de notre session de conseil individuelle de 30 minutes, gratuite et personnalisée, avec un expert en création et développement d’entreprise de la Chambre de Commerce et de l’Industrie Alsace Eurométropole.</p>\n<p> Au Programme de votre Rendez-vous de 30 Minutes :</p>\n<p>1️⃣ Évaluation de Votre Projet : <br>▷ Faisons le point ensemble sur l’état actuel de votre projet d’entreprise.</p>\n<p>2️⃣ Réponses à Vos Questions : <br>▷ Posez vos premières questions et clarifiez vos doutes avec l’aide d’un expert.<br><br>Si besoin, recevez des conseils sur les prochaines étapes et les possibilités d’accompagnement adaptées à votre projet.</p>\n<p>✨ Pour Qui ?</p>\n<p>▷ Les porteurs de projets en phase de création d’entreprise.<br>▷ Les dirigeants de jeunes entreprises de moins de trois ans.</p>\n<p><a href=\"https://urlz.fr/pjVv\" rel=\"noopener\">Prendre rdv gratuitement</a></p>\n<figure><img src=\"/images/blog/bryan.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Automatiser avec l’IA – 15/02/2024 – De 18h00 à 19h30</strong></p>\n<p><strong>Utiliser l’IA pour automatiser ses réseaux sociaux et canaux de vente</strong></p>\n<p>Cette conférence, animée par Bryan Rassen, a pour but de vous plonger dans les techniques modernes de marketing, de gestion des réseaux et d’automatisation pour propulser votre entreprise vers le succès</p>\n<p>À l’ère du numérique actuelle, il est essentiel pour les entrepreneurs de maîtriser les outils et stratégies qui favorisent la croissance et la compétitivité</p>\n<p><a href=\"https://tally.so/r/w2PDMM\" rel=\"noopener\">Participer gratuitement</a></p>\n<figure><img src=\"/images/blog/deep-learning-1.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Meetup Deep Learning – 17/02/2024 – De 10h00 à 12h00</strong></p>\n<p><strong>Rencontre avec l’Intelligence Artificielle</strong></p>\n<p>Au programme ⤵️</p>\n<p>Découvrez le monde fascinant de l’intelligence artificielle et explorez comment elle transforme déjà notre vie de tous les jours (générations de textes, voix, images, vidéos, analyses et traitements de données…).</p>\n<p>De l’amélioration des tâches quotidiennes à la révolution des méthodes de travail, cette démonstration vous invite à plonger dans l’univers de l’IA.</p>\n<p>Rejoignez-nous pour une exploration stimulante des avancées technologiques actuelles et des perspectives d’avenir, où l’IA devient un compagnon inséparable de notre quotidien.</p>\n<p>Préparez-vous à une aventure inspirante qui éclairera les possibilités infinies que l’IA nous réserve.</p>\n<p>‍♀️‍♂️ Public : Tout public, professionnel et particulier.<br><br> Objectif : Découvrir ce que l’IA est capable de réaliser aujourd’hui et dans un futur proche.<br><br> Speaker: Ingénieur en informatique avec plus de 30 années d’expérience à son actif, Gilles PFOTZER est le gérant de la société CONNECTI. Il a conçu de nombreux sites web dans le secteur du tourisme et notamment le site PartirOu.com qui est devenu une référence dans le monde du voyage. Il est expert SEO et passionné depuis plusieurs années d’Intelligence Artificielle.</p>\n<p><a href=\"https://www.meetup.com/strasbourg-deep-learning-meetup/events/298775602/?utm_medium=referral&amp;utm_campaign=share-btn_savedevents_share_modal&amp;utm_source=link\" rel=\"noopener\">Rejoindre l’événement</a></p>\n<figure><img src=\"/images/blog/data-science-1.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Meetup Data Science – 22/02/2024 – À partir de 18h45</strong></p>\n<p><strong>Retours d’expérience: OpenStreetMap / applications de grands modèles de langage</strong></p>\n<p>Cet événement est organisé en partenariat avec Alsace Digitale.</p>\n<p>Au programme ⤵️</p>\n<p>▷ 18h45 : Accueil.<br>▷ 19h00 : Trois retours d’expérience de 20 minutes (voir résumés ci-dessous).<br>▷ 20h00 : Échange autour d’un apéritif offert.<br>▷ 21h00 : fin de l’événement à la Plage Digitale, poursuite des échanges dans un bar à proximité.</p>\n<p>Toutes les présentations auront lieu en</p>\n<p> Découvrez et exploitez la richesse d’OpenStreetMap avec Overpass Turbo</p>\n<p> Enora Lericolais (Cheffe de projet données, Région Grand Est)</p>\n<p> Exploitation de Grands Modèles de Langage pour la Détection de Variation de Poids Liés aux Traitements Antidépresseurs dans les Contenus en Ligne Générés par les Utilisateurs</p>\n<p> Taïoh Yokoyama (Faculté de Pharmacie, Université de Strasbourg)</p>\n<p>Les plateformes web de santé permettent aux patients de témoigner leurs expériences avec leurs traitements. Ces témoignages contiennent des informations utiles à l’évaluation des médicaments en condition de vie réelle, dont notamment la survenue d’effets indésirables sous-déclarés. Nous avons étudié le potentiel des grands modèles de langage (Large Language Models, LLMs) pour détecter les signaux de variations de poids, en tant qu’effets adverses sous-déclaré des antidépresseurs, dans des contenus en ligne générés par les utilisateurs. Les LLMs ajustés ont montré des résultats intéressants pour la tâche de détection d’effets adverses à partir de témoignages de patients en ligne, et ce même avec les modèles avec nombre limité de paramètres. Nos résultats suggèrent que ces modèles pourraient être exploités à grande échelle pour une investigation en condition de vie réelle.</p>\n<p> Communication et extraction de données de diverses sources en utilisant LangChain</p>\n<p> Yacine Touati (Consultant IT, Reboot-Conseil, Strasbourg)</p>\n<p>Jusqu’à présent, obtenir des informations précises, formatées exactement comme vous le souhaitez, à partir de différents systèmes, a été le défi quotidien des développeurs et des utilisateurs finaux lors de leurs interactions avec les systèmes informatiques. Dans cette présentation de niveau débutant, nous vous montrerons comment tirer parti des chains de code et utilisant des LLMs pour mettre en place un pipeline d’extraction de données automatisé à partir de diverses sources, incluant des sites web, des bases de données relationnelles, etc., à partir de diverses API distantes de LLM mais aussi entièrement en local. Nous nous attarderons sur les défis que nous avons rencontrés en cours de route, et fournirons également un retour sur les différentes API de LLM que nous avons utilisées.</p>\n<p><a href=\"https://www.meetup.com/data-science-strasbourg/events/298531567/\" rel=\"noopener\">Rejoindre l’événement</a></p>\n<figure><img src=\"/images/blog/27.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Les rendez-vous mensuels !</strong></p>\n<p><strong>Achen’ight – 09/02/2024 – 19h00-23h00</strong></p>\n<p>Achen’ight, c’est une soirée par mois où se rassemble l’équipe d’Achencraft pour discuter, rencontrer, rigoler, concevoir, …. bref tout ce qui permet au projet Achencraft de progresser !</p>\n<p><strong>Strasbourg Flutter Meetup Group – 06/02/2024 et 20/02/2024 – 18h30-20h30</strong></p>\n<p>Les participants échangent en anglais ou allemand !</p>\n<p>▹ Aborder des sujets liés à Flutter<br>▹ Présentation des résultats des deux dernières semaines, ainsi que prévision pour la prochaine itération<br>▹ Échange sur les actualités Flutter (par exemple, notes de version ou nouveaux produits autour de Flutter)</p>\n<p>▶️ Canal Discord (https://discord.gg/AMfvWZEM). Si vous ne pouvez pas participer sur place, n’hésitez pas à visiter la réunion virtuellement.</p>\n<p><strong>Hack SXB – 23/02/2024 – 18h00-23h00</strong></p>\n<p>Venez partager votre passion pour la création avec un groupe d’étudiants et professionnels !</p>\n<p>Présentez vos propres projets ou rejoignez des projets collectifs sur des sujets variés, parfois thématiques, lors de cette soirée de programmation et de bricolage</p>\n<p><a href=\"https://www.facebook.com/Achencraft\" rel=\"noopener\">Achen’ight</a></p>\n<p><a href=\"https://www.meetup.com/fr-FR/strasbourg-flutter-meetup-group/events/297562393/\" rel=\"noopener\">Strasbourg Flutter <br>Meetup Group</a></p>\n<p><a href=\"https://www.facebook.com/HackSXB\" rel=\"noopener\">Hack SXB</a></p>\n<figure><img src=\"/images/blog/format-newsletter-57-2.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>C’est arrivé le mois dernier … et près de chez vous !</strong></p>\n<p><strong>À la Plage Digitale, il s’en est passé des choses en janvier :</strong></p>\n<p> Les Facilitateurs d’Alsace, Go SXB Go, Fresque du Climat, MTG Strasbourg, Achen’ight, Hack SXB… !</p>\n<p>Suivez-nous sur nos réseaux sociaux pour ne rien louper !</p>\n<figure><img src=\"/images/blog/28.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p><strong>Adhérer à “La Plage Digitale” pour cette nouvelle année 2024 !</strong></p>\n<p>En devenant membre de l’association, vous pourrez profiter de ce <strong>lieu de rencontres et d’échanges de l’écosystème entrepreneurial strasbourgeois</strong>. Cet espace est propice aux initiatives créatives tant individuelles que collectives. Dotée de nombreux espaces adaptés à sa vocation, la Plage Digitale est le <strong>point de départ incontournable pour votre futur projet</strong>. Vous pourrez également <strong>profiter des meetups</strong> ou soirées organisés par nos partenaires associatifs, institutionnels ou privés</p>\n<p>Il n’est jamais trop tard pour bien faire, alors rejoignez-nous en adhérant à la Plage Digitale‍</p>\n<p><a href=\"https://www.helloasso.com/associations/la-plage-digitale/adhesions/adhesion-la-plage-digitale-2024\" rel=\"noopener\">Devenir un(e) plagiste</a></p>"
