  - key: "coworker-de-la-semaine-veronique-campillo-creatrice-de-synergies"
    fields:
      title: "[COWORKER DE LA SEMAINE] Véronique Campillo, créatrice de synergies"
      slug: "coworker-de-la-semaine-veronique-campillo-creatrice-de-synergies"
      excerpt: "Véronique compte parmi les premiers coworkers de la Plage. Fondatrice de Colligence, elle favorise l’intelligence collective en créant des synergies entre les…"
      body: "<h2><strong>Véronique compte parmi les premiers coworkers de la Plage. Fondatrice de Colligence, elle favorise l’intelligence collective en créant des synergies entre les personnes. Une méthode qu’elle applique aussi à la Plage :</strong></h2>\n<p><b>1) </b><b>Quelle est la spécialisation de Colligence ? Comment se passe le coaching et l’écriture ?</b></p>\n<p>J’ai créé Colligence pour développer l’intelligence collective qui est le fait de rassembler les salariés pour échanger et collaborer sur un projet afin d’aboutir à une synergie.  Je me suis spécialisée en coaching et en écriture pour amener mes clients à travailler ensemble et à adopter un esprit d’équipe.  C’est mon originalité, ça permet de créer du contenu à plusieurs – pour un livre blanc par exemple. Ce processus révèle aux individus leurs capacités, dont ils n’avaient parfois pas connaissance auparavant.</p>\n<p>Colligence est en train de se développer. Mes clients sont principalement à Paris, ce qui m’amène à me déplacer, mais aussi à Strasbourg. Je fais aussi bien du coaching individuel que collaboratif dans des domaines variés : transports public, consultants, groupes de coachs,…</p>\n<p><b>2) </b><b>Quels sont tes prochains projets ?</b></p>\n<p><img src=\"/images/blog/veronique-blog.webp\" alt=\"Véronique Campillo, fondatrice de Colligence\" loading=\"lazy\">Il y en beaucoup. Premièrement, mon site et mon activité d’édition que je développe pour que tout le monde puisse avoir accès à des livres qui parlent d’intelligence collective. Je fais aussi une démarche de crowdfunding <i>(ndr : finance participative, en français)</i> pour éditer mon prochain livre. Dans mon business, je vais améliorer mes offres en proposant une formation inter-entreprises en intelligence collective. Mon dernier projet concerne l’écriture collaborative à distance dans le but de créer ces synergies en abattant les frontières géographiques, possible grâce à Internet.</p>\n<p><b>3) </b><b>La dynamique de groupe est fortement présente à la Plage. De quelle manière fais-tu appel à elle ?</b></p>\n<p>Avec d’autres coworkers de la Plage, on a conjointement recruté des stagiaires pour nous aider chacun dans des missions spécifiques. Ça s’est très bien passé et j’ai même envie de recommencer. À côté, je travaille avec des personnes à l’extérieur de la Plage qui font ensuite appel à d’autres Plagistes.</p>\n<p>Il m’arrive de travailler avec d’autres coworkers comme François pour le webmarketing ou Hélène qui m’a aidé à maquetter mon livre blanc. J’envisage de proposer une formation à l’écriture collaborative avec les autres coworkers où d’autres personnes pourront nous rejoindre. Je suis favorable à ce transfert de compétences que chacun peut, par la suite, appliquer à son domaine.</p>\n<p><b>4) </b><b>Qu’est ce qui te plaît le plus dans le coworking ? Et à la Plage ?</b></p>\n<p>La Plage est en train de mûrir, ça prend du temps. Il y a un esprit vivant qui se créé car les relations qu’on a entre nous durent sur le long terme. D’ailleurs, peu de Plagistes quittent les lieux !</p>\n<p>C’est intéressant d’avoir des compétences sur place. Surtout quand ce sont des gens de confiance. La Plage est un endroit qui favorise le travail et l’efficacité de par l’ambiance studieuse et la compagnie qu’on peut avoir. C’est d’autant plus vrai quand on sait que les règles de vie et de savoir-être sont respectées ici. L’autorégulation des personnes est spontanée. Il faudrait multiplier les tiers-lieux pour les petites boîtes.</p>\n<p><b>5) </b><b>La Plage va justement déménager aux Dock’s à la fin des travaux. Qu’en penses-tu ?</b></p>\n<p>L’idéal serait d’avoir la Plage là-bas comme rampe de lancement pour les startups et garder l’espace actuel pour les équipes de 2-3 personnes. Tout en gardant l’aspect open-space. Le brassage est important.</p>\n<p><img src=\"/images/blog/logo-colligence.webp\" alt=\"Logo Colligence, intelligence collective !\" loading=\"lazy\"></p>\n<blockquote><p>Véronique campillo, fondatrice de colligence<br>\n<a href=\"http://colligence.fr/\" rel=\"noopener\">colligence.fr</a>      <a href=\"https://twitter.com/ColligenceIC\" rel=\"noopener\"><img src=\"/images/blog/test2.webp\" alt=\"test2\" loading=\"lazy\"></a>       <a href=\"https://www.facebook.com/Colligence?fref=ts\" rel=\"noopener\"><img src=\"/images/blog/test1.webp\" alt=\"test1\" loading=\"lazy\"></a>      <a href=\"https://plus.google.com/u/0/107553388863547354984/posts\" rel=\"noopener\"><img src=\"/images/blog/06003950-photo-logo-google-plus.webp\" alt=\"06003950-photo-logo-google-plus\" loading=\"lazy\"></a></p></blockquote>"
      legacy_cover: "/images/blog/veronique.webp"
      status: "published"
      published_at: "2013-09-30"
      categories: ["actualites"]
      legacy_path: "/coworker-de-la-semaine-veronique-campillo-creatrice-de-synergies/"
      created_at: "2013-09-30T11:30:30Z"
  - key: "crowdfunding-lulule-tour-passe-par-la-plage"
    fields:
      title: "Ulule s’associe à Strasbourg Startup pour l’Ulule Tour"
      slug: "crowdfunding-lulule-tour-passe-par-la-plage"
      excerpt: "Premier site de financement participatif (crowdfunding) en Europe, Ulule fait son tour de France du 9 octobre au 22 novembre. Dans ces 6 000 kms parcourus, à…"
      body: "<p>Premier site de financement participatif (<i>crowdfunding</i>) en Europe, Ulule fait son tour de France du 9 octobre au 22 novembre. Dans ces 6 000 kms parcourus, à sa 6ème étape éphémère, le 17 octobre à partir de 16h, <strong>l’Ulule Tour s’intalle à la Plage Digitale ! </strong>Une journée complète co-organisée avec <a href=\"http://www.strasbourg-startups.com/\" rel=\"noopener\"><strong>Strasbourg Startups </strong></a>pour découvrir le système de crowdfunding, ses méthodes et ses enjeux.</p>\n<p>Cette étape se divisera en deux parties. La première en un <strong>workshop</strong> organisé par <strong>Ulule</strong> qui vous propose de vous familiariser avec sa plateforme. Toujours fidèle à sa devise « donner vie aux bonnes idées », des professionnels viendront vous donner des conseils pour les curieux ou vous aideront à lancer votre projet crowdfunding. Cet atelier s’axe plus dans la pratique.</p>\n<blockquote><p>Durée du workshop : 1h30 (1h de présentation et 30mns de questions) Capacité : 10 personnes sur réservation gratuite.</p></blockquote>\n<p>La seconde partie est mise en place par <strong>Strasbourg Startups</strong>. Présentation d’Ulule et témoignages d’utilisateurs d’autres plateformes de crowdfunding (Kickstarter et KissKissBank) vous donneront un aperçu de l’écosystème de crowdfunding.</p>\n<blockquote><p>Début de la conférence : 19h (un buffet est prévu par la suite) Capacité : 50 personnes sur réservation gratuite.</p></blockquote>\n<p><em><strong><img src=\"/images/blog/strasbourg-startups.webp\" alt=\"Logo strasbourg startups\" loading=\"lazy\"></strong></em></p>\n<p><em><strong>Pour résumer : Le 17 octobre à la Plage Digitale<br>\n<strong>16h – 17h30 : atelier Ulule.<br>\n19h : conférence crowdfunding.</strong></strong></em></p>"
      legacy_cover: "/images/blog/bandeau-site1.webp"
