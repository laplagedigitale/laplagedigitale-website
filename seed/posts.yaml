  - key: "be-a-boss-tour-debarque-a-strasbourg-pour-un-forum-sur-lentrepreneuriat-au-feminin"
    fields:
      title: "Be a boss Tour débarque à Strasbourg pour un forum sur l’entrepreneuriat au féminin!"
      slug: "be-a-boss-tour-debarque-a-strasbourg-pour-un-forum-sur-lentrepreneuriat-au-feminin"
      excerpt: "Dans le cadre de sa 3e édition le Be a boss Tour organisé par Digital Business News (révélateur d’écosystèmes digital et entrepreneurial) débarque à…"
      body: "<p><strong>Dans le cadre de sa 3e édition le </strong><a href=\"http://www.be-a-boss.com/\" rel=\"noopener\"><strong>Be a boss Tour</strong></a><strong> organisé par </strong><a href=\"http://www.digitalbusinessnews.com/\" rel=\"noopener\"><strong>Digital Business News</strong> </a><strong>(révélateur d’écosystèmes digital et entrepreneurial) débarque à Strasbourg pour un forum dédié aux femmes entrepreneures le 1er juin 2017 en partenariat avec </strong><strong><a href=\"http://www.alsacedigitale.org/\" rel=\"noopener\">Alsace Digitale</a> et <a href=\"http://www.epitech.eu/strasbourg/ecole-informatique-strasbourg.aspx\" rel=\"noopener\">Epitech</a></strong><strong>.  </strong></p>\n<p>Vous êtes une <strong>femme </strong>? Vous êtes <strong>impliquée dans l’univers entrepreneurial ou rêvez de monter votre propre startup</strong> ? Participez gratuitement au forum Be a Boss pour rencontrer des femmes entrepreneures, networker et partager vos expériences, réfléchir ensemble sur des thèmes au cœur du projet d’entreprise, et pourquoi pas même concourir au Be a Boss Awards en pitchant votre projet.</p>\n<p>Le Be a boss Tour se déroule dans 5 villes de France (Lyon, Lille, Strasbourg, Bordeaux et Marseille) et se clôture par <strong>une grande finale à Paris afin de récompenser et d’encourager les startups innovantes fondées par des femmes</strong>.</p>\n<h3><strong>Be a boss Strasbourg</strong></h3>\n<p>Tout au long de la journée, vous aurez l’occasion de participer à <strong>des</strong> <strong>tables rondes</strong> avec des femmes qui sont des exemples de réussite dans le monde de l’entrepreneuriat ou encore à <strong>des keynotes</strong> qui vous permettront d’avoir toutes les clés en main pour vous lancer dans l’aventure entrepreneuriale. Les thématiques abordées seront notamment celles <strong>des solutions de financement, de ce qu’il faut savoir sur la propriété intellectuelle</strong>… Certains moments seront également réservés au <strong>networking</strong> pour qu’autour d’un café vous puissiez échanger au mieux sur vos expériences de femmes entrepreneures  (accomplies ou en devenir). <strong>Pour participer</strong> <strong>à cette belle journée</strong> mettant à l’honneur les femmes qui ont envie d’entreprendre, c’est <a href=\"https://www.eventbrite.fr/e/billets-be-a-boss-strasbourg-2017-30952519820?aff=ehomecard\" rel=\"noopener\"><strong>ICI</strong></a>.</p>\n<p>Enfin en milieu d’après-midi <strong>7 startups strasbourgeoises fondées ou cofondées par des femmes seront invitées à pitcher</strong> devant un jury qui en sélectionnera deux d’entre elles pour participer à la grande finale du <a href=\"http://www.be-a-boss.com/be-a-boss-award\" rel=\"noopener\"><strong>Be a boss Awards</strong></a> à Paris le 21 septembre 2017. Le concours prendra la forme suivante : 5 minutes de pitch, 3 minutes de questions/réponses. Les deux startups gagnantes recevront un volume de 30 000€ d’espace publicitaire ainsi qu’un accès privilégié à un dispositif de financement par Bpifrance Financement. <strong>Pour participer au Be a boss Awards</strong> il vous suffit de remplir le <a href=\"https://docs.google.com/a/alsacedigitale.org/forms/d/e/1FAIpQLScgv6yBG8OU88E-r3zRasE8Id8XtPdIq8bwl_77ui6drKsoAg/viewform?c=0&amp;w=1\" rel=\"noopener\"><strong>formulaire</strong></a> avant le 18 mai 2017.</p>\n<p>L’événement sera suivi d’un apéro entrepreneur!</p>\n<p><strong><em>Infos pratiques :</em></strong></p>\n<p><strong><em>Quand ? </em></strong></p>\n<p>Jeudi 1er  juin 2017, de 13h à 19h30</p>\n<p><strong><em>Où</em></strong> <strong>? </strong></p>\n<p>Campus <a href=\"http://www.epitech.eu/ecole-informatique-strasbourg.aspx\" rel=\"noopener\">Epitech</a>, 4 rue du Dôme 67000 Strasbourg</p>\n<p><strong><em>Accès ?</em></strong></p>\n<p>Tramway ligne B, C, F : Broglie<br>\nTramway ligne A, D : Langstross – Grand’Rue</p>\n<p><strong><em>Tarif ?</em></strong></p>\n<p>Entrée gratuite !</p>\n<p><em>Lien vers la billetterie : </em><a href=\"https://www.eventbrite.fr/e/billets-be-a-boss-strasbourg-2017-30952519820?aff=ehomecard\" rel=\"noopener\">https://www.eventbrite.fr/e/billets-be-a-boss-strasbourg-2017-30952519820?aff=ehomecard</a></p>\n<p><em>En savoir plus sur le Be a boss Tour</em> : <a href=\"http://www.be-a-boss.com/\" rel=\"noopener\">http://www.be-a-boss.com/</a></p>\n<p><em>En savoir plus sur Digital Business News</em> : <a href=\"http://www.digitalbusinessnews.com/\" rel=\"noopener\">http://www.digitalbusinessnews.com/</a></p>"
      legacy_cover: "/images/blog/image-be-a-boss.webp"
